<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<title>Ledgerly · Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — light grey canvas, black brand, pink / butter / sky blocks for accounts, soft tints for categories. */
:root {
  --font: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F2F0; --surface: #FFFFFF; --surface-2: #F5F5F3; --line: rgba(13,13,13,.08); --line-2: rgba(13,13,13,.14);
  --text: #0D0D0D; --text-2: #5C5E64; --text-3: #8A8C92;
  --brand: #0D0D0D; --on-brand: #FFFFFF;
  --pink: #FFD6E0; --butter: #FFEDA8; --sky: #CDE5FF;
  --ok: #157A3A; --ok-tint: #E3F5E8; --warn: #A15C00; --warn-tint: #FFF1D6; --bad: #C2312B; --bad-tint: #FDE9E8;
  --r-xs: 8px; --r-sm: 12px; --r-md: 20px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(20,20,16,.04), 0 1px 1px rgba(20,20,16,.03);
  --sh-2: 0 1px 2px rgba(20,20,16,.05), 0 8px 24px -12px rgba(20,20,16,.12);
  --sh-float: 0 12px 32px -8px rgba(20,20,16,.22), 0 2px 6px rgba(20,20,16,.06);
  --tab-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; font-weight: 500; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.side { display: none; }
main { padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.view { display: grid; gap: 16px; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.brand-mark { width: 32px; height: 32px; }
.m-top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.m-top .actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1); position: relative;
  transition: transform .15s ease-out, background-color .15s ease-out; }
.icon-btn:hover { background: #FAFAF8; }
.icon-btn:active { transform: scale(.95); }
.icon-btn .dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #E0567A; box-shadow: 0 0 0 2px var(--surface); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--pink); overflow: hidden; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.avatar img { width: 100%; height: 100%; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 0 4px; }
.page-head .eyebrow { font-size: 14px; color: var(--text-2); }
.page-head h1 { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
.page-head .head-actions { display: none; gap: 8px; align-items: center; }

/* Tab bar */
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--text-2); border-radius: var(--r-sm);
  transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] .ic { stroke-width: 2.2; }
.tab:hover { color: var(--text); }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 8px 18px -6px rgba(13,13,13,.45); transition: transform .15s ease-out; }
.tab-add:active { transform: scale(.94); }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-size: 18px; letter-spacing: -.01em; }
.card-head .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.link { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; color: var(--text); padding: 10px 4px 10px 10px; margin: -10px -4px -10px 0; border-radius: var(--r-xs); }
.link .ic { width: 16px; height: 16px; transition: transform .15s ease-out; }
.link:hover .ic { transform: translateX(2px); }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.pill .ic { width: 13px; height: 13px; stroke-width: 2.4; }

/* Balance card */
.balance { position: relative; background: var(--brand); color: #fff; padding: 22px 20px 18px; overflow: visible; isolation: isolate; }
.balance::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; overflow: hidden;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255,214,224,.16), transparent 55%), radial-gradient(80% 70% at 0% 100%, rgba(205,229,255,.10), transparent 60%); }
.balance .coin { position: absolute; top: -26px; right: 8px; width: 96px; height: 96px; filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); pointer-events: none; display: grid; place-items: center; font-size: 64px; }
.balance .label { font-size: 14px; color: rgba(255,255,255,.72); }
.big { font-size: 32px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin-top: 4px; }
.big .cents { color: rgba(255,255,255,.55); font-weight: 600; }
.bal-delta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.72); }
.bal-delta .pill { background: rgba(255,214,224,.16); color: var(--pink); }
.bal-delta .pill.down { background: rgba(255,170,160,.16); color: #FFB4AA; }
.spark { position: relative; height: 72px; margin: 14px -4px 4px; }
.spark svg { width: 100%; height: 100%; overflow: visible; }
.spark .end { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 4px rgba(255,214,224,.22); transform: translate(-50%, -50%); }
.spark-x { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.6); }
.bal-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.bal-stats > div { display: flex; gap: 10px; align-items: center; }
.bal-stats > div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.12); }
.bal-stats .chip { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.bal-stats .chip.in { background: var(--pink); color: var(--text); }
.bal-stats .chip.out { background: var(--sky); color: var(--text); }
.bal-stats small { display: block; font-size: 12px; color: rgba(255,255,255,.66); line-height: 1.3; }
.bal-stats b { display: block; font-size: 16px; font-weight: 600; }

/* Accounts */
.accounts { display: grid; grid-auto-flow: column; grid-auto-columns: 158px; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin: 0 -16px; padding: 2px 16px 6px;
  scrollbar-width: none; }
.accounts::-webkit-scrollbar { display: none; }
.acct { scroll-snap-align: start; border-radius: var(--r-md); padding: 14px 14px 16px; display: grid; gap: 14px; text-align: left; color: var(--text); min-height: 132px; align-content: space-between;
  transition: transform .15s ease-out, box-shadow .15s ease-out; }
.acct:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.acct.pink { background: var(--pink); } .acct.butter { background: var(--butter); } .acct.sky { background: var(--sky); }
.acct-top { display: flex; justify-content: space-between; align-items: center; }
.acct-ic { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.65); display: grid; place-items: center; }
.acct-mask { font-size: 13px; color: rgba(13,13,13,.66); }
.acct-name { font-size: 14px; color: rgba(13,13,13,.72); }
.acct-bal { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }

/* Budget */
.budget-figs { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.budget-figs .fig { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.budget-figs .fig .cents { color: var(--text-3); font-weight: 600; }
.budget-figs .cap { font-size: 14px; color: var(--text-2); margin-top: 4px; }
.budget-figs .right { text-align: right; font-size: 14px; color: var(--text-2); }
.budget-figs .right b { display: block; color: var(--text); font-size: 16px; font-weight: 600; }
.meter { position: relative; height: 14px; border-radius: var(--r-full); background: var(--surface-2); margin: 18px 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--brand); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.meter .fill.over { background: var(--bad); }
.meter .pace { position: absolute; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: #E0567A; box-shadow: 0 0 0 2px var(--surface); transform: translateX(-50%); }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.meter-legend .key { display: inline-flex; align-items: center; gap: 6px; }
.meter-legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }
.meter-legend .sw.pace { width: 3px; height: 12px; background: #E0567A; border-radius: 2px; }
.divider { height: 1px; background: var(--line); margin: 20px 0 16px; }
.mini-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.mini-head h3 { font-size: 16px; }
.mini-head span { font-size: 13px; color: var(--text-2); }

.bars { position: relative; height: 132px; display: flex; align-items: flex-end; gap: 3px; padding-top: 30px; }
.bars .b { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.bars .b i { display: block; width: 100%; max-width: 14px; border-radius: var(--r-full); background: #E3E3DF; min-height: 4px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.bars .b.hi i { background: var(--pink); }
.bars .b.today i { background: var(--brand); }
.bars .b.future i { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); min-height: 6px; height: 6px !important; }
.bars .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--brand); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-xs); white-space: nowrap; }
.bars .tip::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 1px; }
.bars .avg { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(13,13,13,.28); pointer-events: none; }
.bars .avg span { position: absolute; right: 0; top: -22px; font-size: 12px; color: var(--text-2); background: var(--surface); padding: 0 0 0 6px; }
.bars-x { display: flex; gap: 3px; margin-top: 8px; font-size: 12px; color: var(--text-2); }
.bars-x span { flex: 1; min-width: 0; text-align: center; overflow: visible; white-space: nowrap; }

/* Segmented control */
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { height: 40px; padding: 0 12px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; color: var(--text-2); white-space: nowrap; transition: background-color .15s ease-out, color .15s ease-out; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1), 0 0 0 1px var(--line); }
.seg.lg { display: grid; } .seg.lg button { height: 40px; font-size: 14px; }

/* Category breakdown */
.stack { display: flex; gap: 3px; height: 14px; margin-bottom: 6px; }
.stack i { display: block; border-radius: var(--r-full); min-width: 6px; transition: flex-grow .5s ease-out; }
.stack-total { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.stack-total b { color: var(--text); font-weight: 600; }
.cat-list { display: grid; }
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.cat-row:first-child { border-top: 0; }
.cat-row .nm { font-size: 15px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
.cat-row .nm em { font-style: normal; font-size: 12px; color: var(--text-2); font-weight: 500; }
.prog { height: 6px; border-radius: var(--r-full); background: var(--surface-2); margin-top: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.prog i { display: block; height: 100%; border-radius: inherit; }
.cat-row .amt { text-align: right; font-size: 15px; font-weight: 600; line-height: 1.3; }
.cat-row .amt small { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }
.cat-row .amt small.over { color: var(--bad); font-weight: 600; }

.chip-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--t); color: var(--c); flex: none; }
.chip-ic .ic { width: 20px; height: 20px; }

/* Transactions */
.tx-list { display: grid; margin: 0 -8px; }
.tx { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; min-height: 64px; border-radius: var(--r-sm); text-align: left; width: 100%;
  transition: background-color .15s ease-out; }
.tx:hover { background: var(--surface-2); }
.tx:active { background: #EDEDEA; }
.tx .chip-ic { width: 44px; height: 44px; border-radius: 12px; }
.tx .nm { font-size: 16px; font-weight: 600; line-height: 1.3; }
.tx .meta { font-size: 13px; color: var(--text-2); line-height: 1.35; }
.tx .amt { font-size: 16px; font-weight: 600; text-align: right; white-space: nowrap; }
.tx .amt.pos { color: var(--ok); }
.tx .amt small { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }
.day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); font-weight: 600; padding: 16px 0 4px; }
.day-head:first-child { padding-top: 0; }

/* Empty */
.empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 24px 12px 12px; }
.empty .art { width: 96px; height: 96px; border-radius: 24px; background: var(--butter); display: grid; place-items: center; font-size: 48px; margin-bottom: 8px; }
.empty .art img { width: 64px; height: 64px; }
.empty h3 { font-size: 18px; }
.empty p { font-size: 14px; color: var(--text-2); max-width: 30ch; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 15px;
  background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 16px -8px rgba(13,13,13,.55);
  transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; white-space: nowrap; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 22px -8px rgba(13,13,13,.6); } }
.btn:active { transform: scale(.98); }
.btn.sm { height: 40px; padding: 0 16px; font-size: 14px; }
.btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
.btn.block { width: 100%; }
.btn .ic { width: 18px; height: 18px; stroke-width: 2.2; }

/* Activity */
.search { position: relative; }
.search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-2); }
.input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); padding: 0 16px; font-size: 16px; font-weight: 500;
  transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,13,13,.08); }
.search .input { padding-left: 46px; border-radius: var(--r-full); border-color: transparent; box-shadow: var(--sh-1); }
.search .input:focus { border-color: var(--brand); }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.filters::-webkit-scrollbar { display: none; }
.fchip { height: 40px; padding: 0 16px; border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  transition: background-color .15s ease-out, color .15s ease-out; }
.fchip:hover { background: #FAFAF8; }
.fchip[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: none; }
.fchip .n { font-size: 12px; opacity: .7; }
.sum-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum-tile { border-radius: var(--r-md); padding: 14px; display: grid; gap: 2px; }
.sum-tile small { font-size: 12px; color: rgba(13,13,13,.7); }
.sum-tile b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.rank { display: grid; gap: 14px; }
.rank-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.rank-row .nm { font-size: 15px; font-weight: 600; }
.rank-row .meta { font-size: 12px; color: var(--text-2); }
.rank-row .amt { font-weight: 600; font-size: 15px; }

/* Budget view */
.ring-wrap { display: grid; grid-template-columns: 148px 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.ring .c small { font-size: 13px; color: var(--text-2); }
.kv { display: grid; gap: 12px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--text-2); }
.kv b { color: var(--text); font-weight: 600; font-size: 15px; }
.month-step { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r-full); box-shadow: var(--sh-1); padding: 2px; }
.month-step button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.month-step button:hover:not(:disabled) { background: var(--surface-2); }
.month-step button:disabled { opacity: .3; cursor: default; }
.month-step span { font-size: 14px; font-weight: 600; min-width: 108px; text-align: center; }
.limit-input { width: 104px; position: relative; }
.limit-input span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-2); font-size: 15px; }
.limit-input .input { height: 40px; padding-left: 24px; text-align: right; padding-right: 12px; font-weight: 600; }
.goal { background: var(--butter); border-radius: var(--r-lg); padding: 20px; display: grid; grid-template-columns: 1fr 88px; gap: 12px; align-items: center; position: relative; }
.goal small { font-size: 13px; color: rgba(13,13,13,.7); }
.goal h3 { font-size: 18px; margin: 2px 0 10px; }
.goal .g-fig { font-size: 15px; font-weight: 600; }
.goal .g-fig span { color: rgba(13,13,13,.66); font-weight: 500; }
.goal .prog { background: rgba(255,255,255,.6); box-shadow: none; height: 8px; }
.goal .prog i { background: var(--brand); }
.goal .obj { width: 88px; height: 88px; display: grid; place-items: center; font-size: 56px; filter: drop-shadow(0 10px 12px rgba(120,90,0,.25)); }

/* Compare */
.cmp { display: grid; gap: 16px; }
.cmp-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.cmp-row .nm { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
.cmp-bars { display: grid; gap: 3px; }
.cmp-bars i { display: block; height: 6px; border-radius: var(--r-full); min-width: 4px; }
.cmp-row .amt { text-align: right; font-size: 15px; font-weight: 600; line-height: 1.3; }
.cmp-row .amt small { display: block; font-size: 12px; color: var(--ok); }
.cmp-row .amt small.up { color: var(--warn); }

/* Settings */
.profile { display: flex; gap: 16px; align-items: center; }
.profile .avatar { width: 64px; height: 64px; }
.profile h2 { font-size: 20px; }
.profile p { font-size: 14px; color: var(--text-2); }
.group-title { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 8px 4px 0; }
.list-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 4px 16px; }
.srow { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; min-height: 64px; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.srow:first-child { border-top: 0; }
button.srow { border-radius: 0; }
button.srow:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.srow .nm { font-size: 15px; font-weight: 600; line-height: 1.3; }
.srow .meta { font-size: 13px; color: var(--text-2); }
.srow .val { font-size: 14px; color: var(--text-2); font-weight: 600; }
.srow.danger .nm { color: var(--bad); }
.toggle { width: 50px; height: 30px; border-radius: var(--r-full); background: #DADAD6; position: relative; transition: background-color .2s ease-out; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.toggle-hit { padding: 7px 0 7px 8px; margin: -7px 0; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(13,13,13,.4); display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow: var(--sh-float); animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #DADAD6; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -.01em; }
.close { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.close:hover { background: #ECECE8; }
.field { display: grid; gap: 8px; margin-top: 18px; }
.field > label, .field > .lbl { font-size: 14px; font-weight: 600; }
.amount-in { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 18px 0 10px; }
.amount-in span { font-size: 32px; font-weight: 600; color: var(--text-2); }
.amount-in input { border: 0; background: none; font-size: 40px; font-weight: 700; letter-spacing: -.02em; width: 6.5ch; text-align: left; padding: 0; }
.amount-in input:focus { outline: none; }
.amount-in input::placeholder { color: #C8C8C4; }
.amount-wrap { border-radius: var(--r-md); background: var(--surface-2); margin-top: 16px; }
.amount-wrap:focus-within { box-shadow: 0 0 0 2px var(--brand); }
.err { font-size: 13px; color: var(--bad); font-weight: 600; min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ochip { height: 40px; padding: 0 14px 0 6px; border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
  transition: background-color .15s ease-out, box-shadow .15s ease-out; }
.ochip.plain { padding: 0 16px; }
.ochip .chip-ic { width: 28px; height: 28px; border-radius: 50%; }
.ochip .chip-ic .ic { width: 15px; height: 15px; }
.ochip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--brand); background: var(--surface-2); }
.ochip:hover { background: var(--surface-2); }
.select { position: relative; }
.select select { appearance: none; -webkit-appearance: none; width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); padding: 0 44px 0 16px; font-size: 16px; font-weight: 500; }
.select select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,13,13,.08); }
.select .ic { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-2); }
.sheet-foot { margin-top: 24px; display: grid; gap: 10px; }
.detail-top { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 4px 0 16px; }
.detail-top .chip-ic { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 6px; }
.detail-top .chip-ic .ic { width: 28px; height: 28px; }
.detail-top .amt { font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
.detail-top .amt.pos { color: var(--ok); }
.detail-top .nm { font-size: 16px; color: var(--text-2); font-weight: 600; }
.dl { background: var(--surface-2); border-radius: var(--r-md); padding: 4px 16px; }
.dl div { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 15px; }
.dl div:first-child { border-top: 0; }
.dl dt { color: var(--text-2); } .dl dd { margin: 0; font-weight: 600; text-align: right; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--brand); color: #fff; padding: 12px 18px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; box-shadow: var(--sh-float); transition: opacity .2s ease-out, transform .2s ease-out;
  display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 18px; height: 18px; color: var(--pink); stroke-width: 2.4; }

/* Layout: home grid with reorder on phones */
.home-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.a-acc { min-width: 0; }
.col { display: contents; }
.a-bal { order: 1; } .a-acc { order: 2; } .a-bud { order: 3; } .a-tx { order: 4; } .a-cat { order: 5; }
.act-grid, .bud-grid, .set-grid { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr); }
.stack-col { display: grid; gap: 16px; min-width: 0; }
.act-grid > .stack-col:last-child { order: -1; }
.act-grid > .stack-col:last-child > section:last-child { display: none; }
@media (min-width: 760px) { .act-grid > .stack-col:last-child > section:last-child { display: block; } }

@media (min-width: 760px) {

  .home-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
  .col { display: grid; gap: 16px; min-width: 0; }

  .act-grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .act-grid > .stack-col:last-child { order: 0; }
  .bud-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .set-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filters { margin: 0; padding: 0; flex-wrap: wrap; overflow: visible; }
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: 28px; animation: pop .22s cubic-bezier(.2,.8,.2,1); padding: 20px 24px 24px; }
  .grab { display: none; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
}

/* ---------- Desktop ---------- */
@media (min-width: 1100px) {
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); background: linear-gradient(90deg, #fff 255px, var(--line) 255px 256px, transparent 256px); }

  .nav { display: grid; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: var(--r-sm); font-size: 15px; font-weight: 600; color: var(--text-2); transition: background-color .15s ease-out, color .15s ease-out; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }

  .nav-item .count { margin-left: auto; font-size: 12px; background: var(--surface-2); color: var(--text-2); border-radius: var(--r-full); padding: 1px 8px; }
  .nav-item[aria-current="page"] .count { background: rgba(255,255,255,.16); color: #fff; }
  .nav-label { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0 12px 4px; }
  .side .goal { margin-top: auto; grid-template-columns: 1fr 56px; padding: 16px; border-radius: var(--r-md); }
  .side .goal h3 { font-size: 15px; margin-bottom: 8px; }
  .side .goal .obj { width: 56px; height: 56px; font-size: 36px; }
  .side .goal .g-fig { font-size: 13px; }
  .me { display: flex; align-items: center; gap: 12px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
  .me .avatar { width: 40px; height: 40px; }
  .me b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .me small { font-size: 12px; color: var(--text-2); }
  .tabbar, .tabbar-fade, .m-top { display: none; }
  main { max-width: 1240px; width: 100%; padding: 32px 40px 48px; }
  .page-head { padding-bottom: 8px; }
  .page-head h1 { font-size: 32px; }
  .page-head .head-actions { display: flex; }
  .toast { bottom: 32px; left: calc(50% + 128px); }
  .home-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
  .col, .stack-col { gap: 20px; }
  .card { padding: 24px; }
  .balance { padding: 26px 24px 20px; }
  .big { font-size: 40px; }
  .balance .coin { width: 120px; height: 120px; top: -30px; right: 16px; font-size: 80px; }
  .act-grid, .bud-grid, .set-grid { gap: 20px; }
  .act-grid > .stack-col:last-child { position: sticky; top: 32px; }
}
.mobile-goal { display: grid; }
@media (min-width: 1100px) { .mobile-goal { display: none; } }
</style>

function balanceSeries(days = 30) {
  const t = today0(), out = []; let bal = total();
  const net = {}; S.tx.forEach((x) => { net[x.date] = (net[x.date] || 0) + x.amount; });
  for (let i = 0; i < days; i++) { const d = ymd(addDays(t, -i)); out.unshift(round2(bal)); bal -= net[d] || 0; }

function catBreakdown(off, limit) {

    <div class="stack-total"><span>${keys.length} categories</span><span>Total <b>${money(tot)}</b></span></div>`;
  const rows = keys.slice(0, limit).map((k) => {
    const b = +S.budgets[k] || 0, v = m[k], p = b ? Math.min(100, v / b * 100) : 100, over = b && v > b;
    const share = Math.round(v / tot * 100);

  return stack + `<div class="cat-list">${rows}</div>`;

/* ---------- Activity ---------- */
function viewActivity() {
  const q = ui.q.trim().toLowerCase();
  let list = sorted();
  const counts = { all: list.length, out: list.filter(isExp).length, in: list.filter((x) => x.amount > 0).length };
  if (ui.filter === 'out') list = list.filter(isExp);
  else if (ui.filter === 'in') list = list.filter((x) => x.amount > 0);
  else if (ui.filter.startsWith('acct:')) list = list.filter((x) => x.acct === ui.filter.slice(5));
  if (q) list = list.filter((x) => x.name.toLowerCase().includes(q) || CATS[x.cat].name.toLowerCase().includes(q));
  const groups = []; list.forEach((x) => { const g = groups[groups.length - 1]; if (g && g.date === x.date) g.items.push(x); else groups.push({ date: x.date, items: [x] }); });
  const acctChips = S.accounts.map((a) => `<button class="fchip" aria-pressed="${ui.filter === 'acct:' + a.id}" data-filter="acct:${a.id}">${a.short}</button>`).join('');
  const listHTML = groups.length ? groups.map((g) => {
    const net = round2(g.items.reduce((s, x) => s + x.amount, 0));
    return `<div class="day-head"><span>${dayLabel(g.date, true)}${dayLabel(g.date) === 'Today' || dayLabel(g.date) === 'Yesterday' ? ' · ' + parse(g.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''}</span><span>${signed(net)}</span></div>
      <div class="tx-list">${g.items.map(txRow).join('')}</div>`;
  }).join('') : (S.tx.length ? `<div class="empty"><div class="art" style="background:var(--sky)">${obj3d('🔍', 64)}</div><h3>No matches</h3><p>Nothing matches${q ? ` “${esc(ui.q)}”` : ''} with this filter. Try another search or filter.</p><button class="btn sm ghost" data-action="clearfilter" style="margin-top:8px">Clear search</button></div>` : emptyTx('No transactions yet', 'Everything you spend and earn will be listed here, newest first.'));
  // side summary
  const mtx = inMonth(0), inc = sum(mtx, (x) => x.amount > 0), out = -sum(mtx, isExp);
  const merch = {}; mtx.filter(isExp).forEach((x) => { const m = merch[x.name] || (merch[x.name] = { v: 0, n: 0, cat: x.cat }); m.v -= x.amount; m.n++; });
  const top = Object.entries(merch).filter(([, m]) => !FIXED.has(m.cat)).sort((a, b) => b[1].v - a[1].v).slice(0, 5);
  return mobileTop() + pageHead(`${S.tx.length} transactions`, 'Activity') + `<div class="act-grid">
    <div class="stack-col">
      <div class="search"><label class="sr" for="q">Search transactions</label>${icon('search')}<input class="input" id="q" type="search" placeholder="Search merchants or categories" value="${esc(ui.q)}" autocomplete="off"></div>
      <div class="filters" role="group" aria-label="Filter"><button class="fchip" aria-pressed="${ui.filter === 'all'}" data-filter="all">All <span class="n">${counts.all}</span></button><button class="fchip" aria-pressed="${ui.filter === 'out'}" data-filter="out">Expenses <span class="n">${counts.out}</span></button><button class="fchip" aria-pressed="${ui.filter === 'in'}" data-filter="in">Income <span class="n">${counts.in}</span></button>${acctChips}</div>
      <section class="card" aria-label="Transactions" id="actList">${listHTML}</section>
    </div>
    <div class="stack-col">
      <section class="card" aria-labelledby="sumH"><div class="card-head"><h2 id="sumH">${monthName(monthStart(0))} so far</h2></div>
        <div class="sum-tiles"><div class="sum-tile" style="background:var(--pink)"><small>Money in</small><b>${fmt0.format(inc)}</b></div><div class="sum-tile" style="background:var(--sky)"><small>Money out</small><b>${fmt0.format(out)}</b></div><div class="sum-tile" style="background:var(--butter)"><small>Net</small><b>${inc - out < 0 ? '−' : '+'}${fmt0.format(Math.abs(inc - out))}</b></div></div></section>
      <section class="card" aria-labelledby="topH"><div class="card-head"><div><h2 id="topH">Top merchants</h2><p class="sub">Everyday spending this month</p></div></div>
        ${top.length ? `<div class="rank">${top.map(([n, m]) => `<div class="rank-row">${chip(m.cat)}<div><div class="nm">${esc(n)}</div><div class="meta">${m.n} ${m.n === 1 ? 'visit' : 'visits'}</div></div><div class="amt">${money(m.v)}</div></div>`).join('')}</div>` : '<p style="color:var(--text-2);font-size:14px">No everyday spending yet this month.</p>'}</section>
    </div></div>`;
}

/* ---------- Budget ---------- */
function viewBudget() {
  const off = ui.budOff, ms = monthStart(off), m = byCat(inMonth(off));
  const spent = round2(Object.values(m).reduce((s, v) => s + v, 0)), B = budgetTotal(), left = round2(B - spent);
  const p = B ? spent / B : 0, C = 2 * Math.PI * 62;
  const isCur = off === 0, n = daysIn(ms), day = isCur ? today0().getDate() : n, daysLeft = n - day + 1;
  const keys = [...EXP_CATS].sort((a, b) => (m[b] || 0) - (m[a] || 0));
  const overN = keys.filter((k) => (m[k] || 0) > (+S.budgets[k] || 0) && S.budgets[k]).length;
  const rows = keys.map((k) => {
    const b = +S.budgets[k] || 0, v = m[k] || 0, pc = b ? Math.min(100, v / b * 100) : (v ? 100 : 0), over = b && v > b;
    const right = ui.editing
      ? `<div class="limit-input"><span>$</span><label class="sr" for="lim-${k}">${CATS[k].name} limit</label><input class="input" id="lim-${k}" data-limit="${k}" inputmode="numeric" value="${b}"></div>`
      : `<div class="amt">${money(v)}${b ? (over ? `<small class="over">${money(v - b)} over</small>` : `<small>${money(b - v)} left</small>`) : '<small>No limit</small>'}</div>`;
    return `<div class="cat-row">${chip(k)}<div><div class="nm">${CATS[k].name}</div>
      ${ui.editing ? `<div style="font-size:13px;color:var(--text-2)">${money(v)} spent</div>` : `<div class="prog"><i style="width:${pc}%;background:${over ? 'var(--bad)' : CATS[k].c}"></i></div>`}</div>${right}</div>`;
  }).join('');
  const step = `<div class="month-step"><button aria-label="Previous month" data-budoff="-1" ${off <= -1 ? 'disabled' : ''}>${icon('left')}</button><span>${monthName(ms)} ${ms.getFullYear()}</span><button aria-label="Next month" data-budoff="0" ${off >= 0 ? 'disabled' : ''}>${icon('right')}</button></div>`;
  return mobileTop() + pageHead('Monthly budget', 'Budget') + `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">${step}${overN ? `<span class="pill bad">${icon('alert')}${overN} ${overN === 1 ? 'category' : 'categories'} over</span>` : `<span class="pill ok">${icon('check')}All within limits</span>`}</div>
    <div class="bud-grid"><div class="stack-col">
      <section class="card" aria-labelledby="ovH"><div class="card-head"><h2 id="ovH">Overview</h2>${isCur ? `<span class="pill neutral">${daysLeft} days left</span>` : '<span class="pill neutral">Closed</span>'}</div>
        <div class="ring-wrap"><div class="ring" role="img" aria-label="${Math.round(p * 100)}% of budget spent">
          <svg viewBox="0 0 148 148" aria-hidden="true"><circle cx="74" cy="74" r="62" fill="none" stroke="var(--surface-2)" stroke-width="16"/>
          <circle cx="74" cy="74" r="62" fill="none" stroke="${left < 0 ? 'var(--bad)' : 'var(--brand)'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${Math.min(1, p) * C} ${C}"/></svg>
          <div class="c"><b>${Math.round(p * 100)}%</b><small>spent</small></div></div>
          <div class="kv"><div>Budget<b>${money(B)}</b></div><div>Spent<b>${money(spent)}</b></div><div>${left < 0 ? 'Over by' : 'Left'}<b style="color:${left < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(Math.abs(left))}</b></div>${isCur && left > 0 ? `<div>Per day<b>${money(left / daysLeft)}</b></div>` : ''}</div></div></section>
      ${compareCard(off)}
      <div class="goal mobile-goal">${goalHTML()}</div>
    </div>
    <section class="card" aria-labelledby="limH"><div class="card-head"><div><h2 id="limH">Category limits</h2><p class="sub">${fmt0.format(B)} a month across ${EXP_CATS.length} categories</p></div>
      ${ui.editing ? `<div style="display:flex;gap:8px"><button class="btn sm ghost" data-action="cancel-edit">Cancel</button><button class="btn sm" data-action="save-limits">Save</button></div>` : `<button class="btn sm ghost" data-action="edit-limits">${icon('pencil')}Edit</button>`}</div>
      <div class="cat-list">${rows}</div></section></div>`;
}

function compareCard(off) {
  const a = byCat(inMonth(off)), b = byCat(inMonth(off - 1)), prevMs = monthStart(off - 1);
  const ta = round2(Object.values(a).reduce((s, v) => s + v, 0)), tb = round2(Object.values(b).reduce((s, v) => s + v, 0));
  if (!tb) return '';
  const keys = EXP_CATS.filter((k) => !FIXED.has(k) && (a[k] || b[k])).sort((x, y) => Math.abs((a[y] || 0) - (b[y] || 0)) - Math.abs((a[x] || 0) - (b[x] || 0))).slice(0, 4);
  const max = Math.max(1, ...keys.map((k) => Math.max(a[k] || 0, b[k] || 0)));
  const d = round2(ta - tb);
  return `<section class="card" aria-labelledby="cmpH"><div class="card-head"><div><h2 id="cmpH">Compared with ${monthName(prevMs)}</h2><p class="sub">${monthName(prevMs, 'short')} total ${money(tb)}</p></div>
    <span class="pill ${d > 0 ? 'warn' : 'ok'}">${d > 0 ? '+' : '−'}${fmt0.format(Math.abs(d))}</span></div>
    <div class="cmp">${keys.map((k) => { const va = a[k] || 0, vb = b[k] || 0, dd = round2(va - vb);
      return `<div class="cmp-row">${chip(k)}<div><div class="nm">${CATS[k].name}</div>
        <div class="cmp-bars"><i style="width:${va / max * 100}%;background:var(--brand)"></i><i style="width:${vb / max * 100}%;background:#DCDCD8"></i></div></div>
        <div class="amt">${money(va)}<small class="${dd > 0 ? 'up' : 'down'}">${dd > 0 ? '+' : '−'}${money(Math.abs(dd))}</small></div></div>`; }).join('')}</div>
    <div class="meter-legend" style="margin-top:14px"><span class="key"><span class="sw"></span>${monthName(monthStart(off), 'short')}</span><span class="key"><span class="sw" style="background:#DCDCD8"></span>${monthName(prevMs, 'short')}</span></div></section>`;
}

    <button class="toggle-hit" role="switch" aria-checked="${!!S.prefs[key]}" aria-labelledby="lbl-${key}" data-pref="${key}"><span class="toggle" aria-checked="${!!S.prefs[key]}" style="display:block"></span></button></div>`;

      <div class="srow"><span class="chip-ic" style="--t:var(--surface-2);--c:var(--text)">${icon('calendar')}</span><div><div class="nm">Budget period</div><div class="meta">Resets on the 1st</div></div><span class="val">Monthly</span></div></div>

      <button class="srow" data-action="restore"><span class="chip-ic" style="--t:var(--butter);--c:var(--text)">${icon('refresh')}</span><div><div class="nm">Restore sample data</div><div class="meta">Reload the example accounts and transactions</div></div>${icon('right')}</button>

/* ---------- Render ---------- */
const NAV = [['home', 'Overview', 'grid'], ['activity', 'Activity', 'receipt'], ['budget', 'Budget', 'pie'], ['settings', 'Settings', 'settings']];
function renderChrome() {
  const cur = (v) => ui.view === v ? 'aria-current="page"' : '';
  const m = byCat(inMonth(0)), overN = EXP_CATS.filter((k) => S.budgets[k] && (m[k] || 0) > S.budgets[k]).length;
  $('#sideNav').innerHTML = `<p class="nav-label">Menu</p>` + NAV.map(([v, l, i]) => `<button class="nav-item" data-go="${v}" ${cur(v)}>${icon(i)}${l}${v === 'activity' ? `<span class="count">${S.tx.length}</span>` : v === 'budget' && overN ? `<span class="count">${overN} over</span>` : ''}</button>`).join('');
  const tab = ([v, l, i]) => `<button class="tab" data-go="${v}" ${cur(v)}>${icon(i)}${v === 'home' ? 'Home' : l}</button>`;
  $('#tabbar').innerHTML = tab(NAV[0]) + tab(NAV[1]) + `<button class="tab-add" data-action="add" aria-label="Add transaction">${icon('plus')}</button>` + tab(NAV[2]) + tab(NAV[3]);
  $('#sideGoal').innerHTML = goalHTML();
  $('#sideMe').innerHTML = `${avatarHTML()}<div><b>${esc(S.user.first)} ${esc(S.user.last)}</b><small>Personal plan</small></div>`;
}
function render(keepFocus) {
  const views = { home: viewHome, activity: viewActivity, budget: viewBudget, settings: viewSettings };
  const main = $('#main');
  main.innerHTML = `<div class="view">${views[ui.view]()}</div>`;
  if (keepFocus) main.firstElementChild.style.animation = 'none';
  renderChrome();
  const q = $('#q');
  if (q) q.addEventListener('input', () => { ui.q = q.value; const pos = q.selectionStart; render(true); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
}
function go(v) { ui.view = v; ui.editing = false; render(); window.scrollTo({ top: 0 }); }

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.innerHTML = icon('check') + esc(msg); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- Sheets ---------- */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $('#sheet').innerHTML = `<div class="grab" aria-hidden="true"></div>` + html;
  $('#scrim').classList.add('open'); document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = $('#sheet [autofocus]') || $('#sheet button, #sheet input'); f && f.focus(); }, 30);
}
function closeSheet() { $('#scrim').classList.remove('open'); document.body.style.overflow = ''; lastFocus && lastFocus.focus && lastFocus.focus(); }
const sheetHead = (t) => `<div class="sheet-head"><h2 id="sheetTitle">${t}</h2><button class="close" data-action="close" aria-label="Close">${icon('x')}</button></div>`;

const form = { type: 'expense', cat: 'groceries', acct: 'card', day: 0 };
function addSheet() {
  const cats = form.type === 'expense' ? EXP_CATS : INC_CATS;
  if (!cats.includes(form.cat)) form.cat = cats[0];
  const t = today0();
  const dayOpts = Array.from({ length: 30 }, (_, i) => { const d = addDays(t, -i); return `<option value="${i}" ${form.day === i ? 'selected' : ''}>${i === 0 ? 'Today' : i === 1 ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</option>`; }).join('');
  return sheetHead('Add transaction') + `<form id="addForm" novalidate>
    <div class="seg lg" role="group" aria-label="Type"><button type="button" aria-pressed="${form.type === 'expense'}" data-type="expense">Expense</button><button type="button" aria-pressed="${form.type === 'income'}" data-type="income">Income</button></div>
    <div class="amount-wrap"><label class="sr" for="fAmt">Amount</label><div class="amount-in"><span>$</span><input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" value="${form.amt || ''}" autofocus></div></div>
    <p class="err" id="errAmt"></p>
    <div class="field"><label for="fName">${form.type === 'expense' ? 'Merchant' : 'From'}</label><input class="input" id="fName" placeholder="${form.type === 'expense' ? 'e.g. Jewel-Osco' : 'e.g. Payroll deposit'}" autocomplete="off" value="${esc(form.name || '')}"><p class="err" id="errName"></p></div>
    <div class="field"><span class="lbl" id="catLbl">Category</span><div class="chips" role="group" aria-labelledby="catLbl">${cats.map((k) => `<button type="button" class="ochip" aria-pressed="${form.cat === k}" data-cat="${k}">${chip(k)}${CATS[k].name}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl" id="acLbl">Account</span><div class="chips" role="group" aria-labelledby="acLbl">${S.accounts.map((a) => `<button type="button" class="ochip" aria-pressed="${form.acct === a.id}" data-acct="${a.id}"><span class="chip-ic" style="--t:var(--${a.color});--c:var(--text)">${icon(a.icon)}</span>${a.short}</button>`).join('')}</div></div>
    <div class="field"><label for="fDay">Date</label><div class="select"><select id="fDay">${dayOpts}</select>${icon('down')}</div></div>
    <div class="sheet-foot"><button class="btn block" type="submit">${icon('check')}Save ${form.type}</button></div></form>`;
}
function openAdd(type) {
  Object.assign(form, { type: type || 'expense', amt: '', name: '', day: 0 });
  form.cat = form.type === 'expense' ? 'groceries' : 'income'; form.acct = form.type === 'expense' ? 'card' : 'chk';
  openSheet(addSheet());
}
function rerenderAdd() {
  form.amt = $('#fAmt').value; form.name = $('#fName').value; form.day = +$('#fDay').value;
  const active = document.activeElement && document.activeElement.dataset; const key = active && (active.cat || active.acct || active.type);
  $('#sheet').innerHTML = `<div class="grab" aria-hidden="true"></div>` + addSheet();
  if (key) { const el = $(`#sheet [data-cat="${key}"], #sheet [data-acct="${key}"], #sheet [data-type="${key}"]`); el && el.focus(); }
}
function submitAdd() {
  const raw = $('#fAmt').value.replace(/[$,\s]/g, ''), amt = round2(parseFloat(raw)), name = $('#fName').value.trim();
  let ok = true;
  $('#errAmt').textContent = ''; $('#errName').textContent = '';
  if (!raw || !isFinite(amt) || amt <= 0) { $('#errAmt').textContent = 'Enter an amount greater than $0.'; $('#errAmt').style.textAlign = 'center'; ok = false; }
  if (!name) { $('#errName').textContent = form.type === 'expense' ? 'Add the merchant name.' : 'Add where the money came from.'; ok = false; }
  if (!ok) { (!raw || amt <= 0 ? $('#fAmt') : $('#fName')).focus(); return; }
  const now = new Date(), d = addDays(today0(), -(+$('#fDay').value));
  const x = { id: 'u' + Date.now(), date: ymd(d), time: `${pad(now.getHours())}:${pad(now.getMinutes())}`, name, cat: form.cat, acct: form.acct, amount: form.type === 'expense' ? -amt : amt };
  S.tx.push(x); acct(x.acct).balance = round2(acct(x.acct).balance + x.amount); save();
  closeSheet(); render(); toast(`${name} · ${signed(x.amount)} added`);
}
function detailSheet(id) {
  const x = S.tx.find((t) => t.id === id); if (!x) return;
  const a = acct(x.acct), c = CATS[x.cat];
  openSheet(sheetHead('Transaction') + `<div class="detail-top">${chip(x.cat)}<p class="amt ${x.amount > 0 ? 'pos' : ''}">${signed(x.amount)}</p><p class="nm">${esc(x.name)}</p></div>
    <dl class="dl"><div><dt>Category</dt><dd>${c.name}</dd></div><div><dt>Account</dt><dd>${a ? `${a.name} •• ${a.mask}` : '—'}</dd></div>
    <div><dt>Date</dt><dd>${parse(x.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</dd></div><div><dt>Time</dt><dd>${timeLabel(x.time)}</dd></div></dl>
    <div class="sheet-foot"><button class="btn danger block" data-del="${x.id}">${icon('trash')}Delete transaction</button></div>`);
}
function confirmSheet(title, text, label, action, danger) {
  openSheet(sheetHead(title) + `<p style="color:var(--text-2);font-size:15px">${text}</p><div class="sheet-foot"><button class="btn block ${danger ? 'danger' : ''}" data-action="${action}">${label}</button><button class="btn ghost block" data-action="close">Cancel</button></div>`);
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-go]'); if (!el) { if (e.target === $('#scrim')) closeSheet(); return; }
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.tx) return detailSheet(d.tx);
  if (d.catoff !== undefined) { ui.catOff = +d.catoff; return render(true); }
  if (d.budoff !== undefined) { ui.budOff = +d.budoff; ui.editing = false; return render(true); }
  if (d.filter) { ui.filter = d.filter; return render(true); }
  if (d.filterAcct) { ui.filter = 'acct:' + d.filterAcct; ui.q = ''; return go('activity'); }
  if (d.pref) { S.prefs[d.pref] = !S.prefs[d.pref]; save(); el.setAttribute('aria-checked', S.prefs[d.pref]); el.firstElementChild.setAttribute('aria-checked', S.prefs[d.pref]); return; }
  if (d.type) { form.type = d.type; return rerenderAdd(); }
  if (d.cat) { form.cat = d.cat; return rerenderAdd(); }
  if (d.acct) { form.acct = d.acct; return rerenderAdd(); }
  if (d.del) {
    const i = S.tx.findIndex((t) => t.id === d.del); if (i < 0) return;
    const [x] = S.tx.splice(i, 1); const a = acct(x.acct); if (a) a.balance = round2(a.balance - x.amount); save();
    closeSheet(); render(); return toast(`${x.name} deleted`);
  }
  switch (d.action) {
    case 'add': return openAdd();
    case 'close': return closeSheet();
    case 'search': ui.view = 'activity'; render(); return $('#q').focus();
    case 'notify': return toast('Xfinity Internet is due Dec 6');
    case 'clearfilter': ui.q = ''; ui.filter = 'all'; return render(true);
    case 'edit-limits': ui.editing = true; render(true); return $('[data-limit]').focus();
    case 'cancel-edit': ui.editing = false; return render(true);
    case 'save-limits':
      document.querySelectorAll('[data-limit]').forEach((i) => { const v = Math.max(0, Math.round(parseFloat(i.value.replace(/[$,]/g, '')) || 0)); S.budgets[i.dataset.limit] = v; });
      ui.editing = false; save(); render(true); return toast('Budget limits saved');
    case 'export': {
      const rows = [['Date', 'Time', 'Description', 'Category', 'Account', 'Amount']].concat(sorted().map((x) => [x.date, x.time, x.name, CATS[x.cat].name, acct(x.acct)?.name || '', x.amount.toFixed(2)]));
      const csv = rows.map((r) => r.map((v) => /[",]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `ledgerly-transactions-${ymd(today0())}.csv`; a.click();
      return toast('CSV downloaded');
    }
    case 'restore': return confirmSheet('Restore sample data?', 'This replaces your accounts, budget and transactions with the example set.', 'Restore sample data', 'do-restore');
    case 'do-restore': S = buildSample(); save(); closeSheet(); ui.filter = 'all'; render(); return toast('Sample data restored');
    case 'clear': return confirmSheet('Start fresh?', `All ${S.tx.length} transactions will be deleted and account balances set to $0.00. Your budget limits stay.`, 'Delete everything', 'do-clear', true);
    case 'do-clear': S.tx = []; S.accounts.forEach((a) => { a.balance = 0; }); save(); closeSheet(); ui.filter = 'all'; render(); return toast('All data cleared');
  }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'addForm') { e.preventDefault(); submitAdd(); } });
document.addEventListener('keydown', (e) => {
  if (!$('#scrim').classList.contains('open')) return;
  if (e.key === 'Escape') return closeSheet();
  if (e.key === 'Tab') {
    const f = [...$('#sheet').querySelectorAll('button, input, select')].filter((x) => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

render();
})();
</script>
</body>
</html>
