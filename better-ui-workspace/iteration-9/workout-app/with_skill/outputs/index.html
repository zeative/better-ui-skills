<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Loaded — workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
/* Idea: every set is a plate you load onto the bar. Motif: barbell plates (side-on on the bar, face-on as set buttons, stacked for the week).
   Kit: mono. Base: chalk + iron black. Block: bumper-plate vermilion. */
:root{
  --bg:#EFECE5; --surface:#FFFFFF; --ink:#0B0B0B; --ink-2:#44423E; --ink-3:#6B6862;
  --line:#0B0B0B; --soft:rgba(11,11,11,.14);
  --block:#FF4A1C; --block-ink:#0B0B0B; --chalk:#F7F5F0;
  --r-lg:28px; --r-pill:999px;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(28px + env(safe-area-inset-bottom));transition:padding .3s}
body.resting{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--block);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

.app{max-width:1160px;margin:0 auto;padding:0 16px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px}
.mark{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.04em;text-transform:uppercase}
.mark svg{display:block}
.head-r{display:flex;align-items:center;gap:8px}
.date-pill{border:2px solid var(--ink);border-radius:var(--r-pill);height:44px;padding:0 14px;display:flex;align-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;transition:transform .15s}
.icon-btn:active{transform:scale(.92) rotate(-40deg)}

.layout{display:grid;gap:16px}

/* hero */
.hero{background:radial-gradient(120% 60% at 50% 72%,#2A1610 0%,var(--ink) 62%);color:#fff;padding:20px 20px 0;position:relative;overflow:hidden;border-radius:0 0 var(--r-lg) 0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .kicker{color:var(--block)}
.hero h1{font-size:15px;font-weight:500;color:#CFCBC3;margin-top:6px;max-width:34ch}
.hero h1 b{color:#fff;font-weight:800}
.sticker{background:var(--block);color:var(--block-ink);border-radius:var(--r-pill);padding:9px 14px;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-5deg);white-space:nowrap;position:absolute;right:0;top:6px}
.count{position:relative;display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.count .big{font-weight:900;font-size:clamp(112px,34vw,150px);line-height:.8;letter-spacing:-.06em;margin-left:-6px}
.count .of{padding-bottom:4px;font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.05}
.count .of span{display:block;white-space:nowrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A8A49C;font-weight:800;margin-top:4px}
.bar-wrap{margin:22px -20px 0;padding:0 8px}
.bar-wrap svg{display:block;width:100%;height:auto}
.plate{transition:fill .25s,stroke .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px -20px 0;border-top:2px solid #2A2927}
.hero-stats div{padding:14px 0 16px 20px}
.hero-stats div+div{border-left:2px solid #2A2927;padding-left:14px}
.hero-stats b{display:block;font-weight:900;font-size:24px;letter-spacing:-.03em;line-height:1}
.hero-stats b small{font-size:12px;font-weight:800;letter-spacing:0;color:#A8A49C;margin-left:2px}
.hero-stats span{font-size:12px;font-weight:600;color:#A8A49C;letter-spacing:.04em;text-transform:uppercase;display:block;margin-top:6px}
.hero.done .big{color:var(--block)}

/* section heads */
.sec-h{margin:8px 0 12px}
.sec-h span{display:block;margin-top:6px}
.sec-h h2{font-weight:900;font-size:28px;letter-spacing:-.04em;text-transform:uppercase;line-height:1}
.sec-h span{font-size:12px;font-weight:600;color:var(--ink-3)}

/* exercise cards */
.list{display:grid;gap:12px}
.ex{background:var(--surface);border:2px solid var(--ink);padding:16px 16px 18px;position:relative;transition:background .3s,color .3s}
.ex-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tile{width:52px;height:52px;background:var(--ink);color:#fff;display:grid;place-items:center;border-radius:0 0 12px 0;transition:background .3s,color .3s}
.ex h3{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.ex .meta{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:3px}
.ex .idx{font-weight:900;font-size:13px;color:var(--ink-3);letter-spacing:.04em;align-self:start}
.sets{display:flex;gap:10px;margin-top:18px;position:relative;padding-right:18px}
.sets::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#CFCBC3;box-shadow:inset 0 -2px 0 rgba(11,11,11,.18)}
.sets::after{content:"";position:absolute;right:10px;top:50%;width:8px;height:22px;margin-top:-11px;border-radius:2px;background:var(--ink)}
.ex.done .sets::before{background:#4A4844}.ex.done .sets::after{background:#fff}
.set{width:64px;height:64px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--chalk);position:relative;z-index:1;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(11,11,11,.1),0 3px 0 rgba(11,11,11,.18);
  transition:transform .15s,background .2s}
.set::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(11,11,11,.35)}
.set .r{font-weight:900;font-size:20px;letter-spacing:-.03em;line-height:1}
.set .r small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.set .ck{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.set[aria-pressed=true]{background:var(--block);box-shadow:inset 0 -4px 0 rgba(11,11,11,.16),inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 rgba(11,11,11,.3)}
.set[aria-pressed=true]::before{border:1.5px solid var(--ink);inset:3px}
.set[aria-pressed=true] .r small{color:var(--ink)}
.set[aria-pressed=true] .ck{transform:scale(1)}
.set.pop{animation:spin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{0%{transform:scale(.8) rotate(-90deg)}100%{transform:none}}
@media(hover:hover){.set:hover{transform:translateY(-2px)}}
.set:active{transform:scale(.92)}
.ex-f{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:2px dotted var(--soft);gap:12px}
.ex-f .left{font-size:12px;font-weight:600;color:var(--ink-3)}
.ex-f .left b{color:inherit;font-weight:800}
.step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:var(--r-pill);height:44px;background:var(--surface);color:var(--ink)}
.step button{width:44px;height:40px;font-weight:900;font-size:18px;border-radius:var(--r-pill)}
.step button:active{background:var(--block)}
.step output{min-width:62px;text-align:center;font-weight:800;font-size:14px}
.ex.next{box-shadow:6px 6px 0 var(--block)}
.ex.done{background:var(--ink);color:#fff}
.ex.done .step{background:transparent;color:#fff;border-color:#57544F}
.step.static output{padding:0 16px;color:var(--ink-3)}.ex.done .step.static output{color:#A8A49C}
.ex.done .tile{background:var(--block);color:var(--ink)}
.ex.done .meta,.ex.done .idx,.ex.done .ex-f .left{color:#A8A49C}
.ex.done .ex-f{border-top-color:#3A3835}
.ex.done .set{border-color:var(--block);color:var(--ink)}
.ex.done .set .ck{background:#fff;color:var(--ink)}
.ex .done-tag{display:none}
.ex.done .done-tag{display:inline-block;background:#fff;color:var(--ink);border-radius:var(--r-pill);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;transform:rotate(-5deg)}
.ex.done .idx{display:none}

/* week */
.week{background:var(--block);color:var(--block-ink);padding:20px 20px 0;border-radius:var(--r-lg) 0 0 0}
.week-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.week-h h2{font-weight:900;font-size:40px;letter-spacing:-.05em;line-height:.88;text-transform:uppercase}
.week-h .sess{text-align:right;font-weight:900;font-size:40px;letter-spacing:-.05em;line-height:.88}
.week-h .sess small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-top:6px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:16px}
.legend i{width:18px;height:5px;border-radius:2px;background:var(--ink)}.legend i.t{background:rgba(11,11,11,.22);margin-left:10px}
.racks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;align-items:end}
.rack{display:flex;flex-direction:column;align-items:center;gap:0}
.rack .n{font-weight:900;font-size:13px;height:18px}
.stack{height:112px;width:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;position:relative;padding-bottom:4px}
.stack::before{content:"";position:absolute;left:50%;top:6px;bottom:0;width:4px;margin-left:-2px;background:var(--ink);opacity:.9;border-radius:2px 2px 0 0}
.stack i{display:block;height:4.5px;border-radius:2px;background:var(--ink);position:relative;z-index:1;flex:none}
.stack i.todo{background:rgba(11,11,11,.22)}
.stack.off::before{top:auto;height:10px}
.stack .rest{position:absolute;bottom:42px;left:50%;transform:translateX(-50%) rotate(-90deg);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--block);padding:0 6px;z-index:2;white-space:nowrap}
.base{height:4px;width:100%;background:var(--ink)}
.rack .d{margin-top:8px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;width:100%;text-align:center;padding:6px 0;border-radius:var(--r-pill)}
.rack .d b{display:block;font-size:15px;font-weight:900;letter-spacing:-.02em}
.rack.today .d{background:var(--ink);color:#fff}
.week-stats{display:grid;grid-template-columns:1fr 1fr;margin:20px -20px 0;border-top:2px solid var(--ink)}
.week-stats div{padding:14px 20px 18px}
.week-stats div+div{border-left:2px solid var(--ink)}
.week-stats b{display:block;white-space:nowrap;font-weight:900;font-size:26px;letter-spacing:-.04em;line-height:1}
.week-stats b small{font-size:13px;font-weight:800;letter-spacing:0;margin-left:3px}
.week-stats span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

.note{font-size:12px;color:var(--ink-3);margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note button{border:2px solid var(--ink);border-radius:var(--r-pill);height:44px;padding:0 16px;font-weight:800;font-size:13px;color:var(--ink)}
.note button:active{background:var(--ink);color:#fff}

/* rest timer */
.timer{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(343px,calc(100% - 32px));
  background:var(--ink);color:#fff;border-radius:var(--r-pill);height:64px;display:flex;align-items:center;gap:12px;padding:0 8px 0 8px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.3,1.3,.5,1),visibility 0s .35s;z-index:10;overflow:hidden;visibility:hidden}
.timer.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.timer .dial{width:48px;height:48px;flex:none}
.timer .t{flex:1;line-height:1.1}
.timer .t b{font-weight:900;font-size:24px;letter-spacing:-.03em;display:block}
.timer .t span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A8A49C}
.timer button{height:48px;padding:0 16px;border-radius:var(--r-pill);font-weight:800;font-size:13px}
.timer .add{border:2px solid #4A4844;color:#fff}
.timer .skip{background:var(--block);color:var(--ink)}

@media(min-width:720px){
  .app{padding:0 24px}
  header{padding:24px 0 18px}
  .layout{grid-template-columns:minmax(320px,42%) 1fr;gap:24px;align-items:start}
  .side{position:sticky;top:20px;display:grid;gap:16px}
  .sec-h{margin-top:-2px}
  .sec-h h2{font-size:40px}
  .list{gap:16px}
}
@media(min-width:1000px){
  .app{padding:0 32px}
  .layout{grid-template-columns:minmax(380px,440px) 1fr;gap:32px}
  .count .big{font-size:168px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between}
  .sec-h span{margin:0}
}
@media(min-width:1180px){
  .list{grid-template-columns:1fr 1fr}
  .ex-h{min-height:64px}
  .ex.last{grid-column:1/-1}
}
@media(max-width:719px){.side{display:contents}.hero{order:1}.main{order:2}.week{order:3}.note{order:4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#0B0B0B"/><circle cx="15" cy="15" r="9" fill="none" stroke="#FF4A1C" stroke-width="3"/><circle cx="15" cy="15" r="3" fill="#EFECE5"/></svg>
      Loaded
    </div>
    <div class="head-r">
      <div class="date-pill num" id="date"></div>
      <button class="icon-btn" id="reset" aria-label="Clear today's ticks" title="Clear today's ticks">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <div class="side">
      <section class="hero" id="hero" aria-live="polite"></section>
      <section class="week" id="week" aria-label="This week"></section>
      <div class="note" id="note"></div>
    </div>
    <main class="main">
      <div class="sec-h"><h2>Today's lifts</h2><span id="hint">Tap a plate to log a set</span></div>
      <div class="list" id="list"></div>
    </main>
  </div>
</div>

<div class="timer" id="timer" role="timer" aria-label="Rest timer">
  <svg class="dial" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="#33312E" stroke-width="6"/><circle id="arc" cx="24" cy="24" r="20" fill="none" stroke="#FF4A1C" stroke-width="6" stroke-dasharray="125.7" transform="rotate(-90 24 24)"/><circle cx="24" cy="24" r="5" fill="#fff"/></svg>
  <div class="t"><b class="num" id="tleft">1:30</b><span>Rest</span></div>
  <button class="add" id="tadd">+30s</button>
  <button class="skip" id="tskip">Skip</button>
</div>

<script>
(() => {
const ICON = {
  barbell:'<svg width="30" height="30" viewBox="0 0 30 30" fill="currentColor"><rect x="1" y="14" width="28" height="2"/><rect x="5" y="6" width="3.5" height="18" rx="1"/><rect x="9.5" y="9" width="2.5" height="12" rx="1"/><rect x="21.5" y="6" width="3.5" height="18" rx="1"/><rect x="18" y="9" width="2.5" height="12" rx="1"/></svg>',
  press:'<svg width="30" height="30" viewBox="0 0 30 30" fill="currentColor"><rect x="1" y="6" width="28" height="2"/><rect x="4" y="2" width="3.5" height="10" rx="1"/><rect x="22.5" y="2" width="3.5" height="10" rx="1"/><circle cx="15" cy="13.5" r="2.8"/><path d="M9 8v5l3.5 4.5V28h5V17.5L21 13V8h-2.4v4.2L16.5 15h-3l-2.1-2.8V8z"/></svg>',
  dumbbell:'<svg width="30" height="30" viewBox="0 0 30 30" fill="currentColor"><g transform="rotate(-35 15 15)"><rect x="9" y="13.5" width="12" height="3"/><rect x="4" y="8" width="5" height="14" rx="1.5"/><rect x="21" y="8" width="5" height="14" rx="1.5"/><rect x="1.5" y="11" width="2" height="8" rx="1"/><rect x="26.5" y="11" width="2" height="8" rx="1"/></g></svg>',
  cable:'<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="7" r="3.5"/><path d="M11 9.5 22 20"/><path d="M19 23l6-6" stroke-width="3.4"/><rect x="4" y="16" width="8" height="3" fill="currentColor" stroke="none"/><rect x="4" y="20.5" width="8" height="3" fill="currentColor" stroke="none"/><rect x="4" y="25" width="8" height="3" fill="currentColor" stroke="none"/></svg>',
  body:'<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h26"/><path d="M9 5v5l3 3M21 5v5l-3 3"/><circle cx="15" cy="9.5" r="2.6" fill="currentColor" stroke="none"/><path d="M12 13h6v7l-1 7M12 13v7l1 7"/></svg>'
};
const E = (id,name,sets,reps,kg,icon,step=2.5) => ({id,name,sets,reps,kg,icon,step});
const WORKOUTS = {
  push:{name:'Push',ex:[E('bench','Bench Press',4,6,70,'barbell'),E('ohp','Overhead Press',3,8,40,'press'),E('idb','Incline Dumbbell Press',3,10,22,'dumbbell',1),E('fly','Cable Fly',3,12,15,'cable'),E('dips','Dips',3,10,0,'body')]},
  pull:{name:'Pull',ex:[E('dead','Deadlift',3,5,110,'barbell',5),E('row','Barbell Row',4,8,60,'barbell'),E('lat','Lat Pulldown',3,10,55,'cable'),E('curl','Dumbbell Curl',3,12,12,'dumbbell',1),E('face','Face Pull',2,15,20,'cable')]},
  legs:{name:'Legs',ex:[E('squat','Back Squat',4,6,90,'barbell',5),E('rdl','Romanian Deadlift',3,8,80,'barbell',5),E('lunge','Walking Lunge',3,12,16,'dumbbell',1),E('calf','Calf Raise',4,15,40,'barbell')]},
  upper:{name:'Upper',ex:[E('bench2','Bench Press',4,8,60,'barbell'),E('ohp2','Overhead Press',3,10,35,'press'),E('idb2','Incline Dumbbell Press',3,12,20,'dumbbell',1),E('crow','Seated Cable Row',3,12,45,'cable'),E('pull','Pull-ups',3,8,0,'body')]}
};
const SCHEDULE = [null,'push','pull',null,'legs',null,'upper']; // Sun..Sat
const KEY = 'loaded.v1', REST = 90;
const $ = id => document.getElementById(id);
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt = n => Math.round(n).toLocaleString('en-GB');

const now = new Date(), todayKey = iso(now);
const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
const weekDays = [...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d});
function plannedFor(d){ return SCHEDULE[d.getDay()]; }
function nextPlanned(d){ for(let i=1;i<8;i++){const k=SCHEDULE[(d.getDay()+i)%7]; if(k) return k;} }

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if(!S || !S.days){ S = {days:{},kg:{},sample:true}; seed(); }
if(!S.days[todayKey]) S.days[todayKey] = {wk: plannedFor(now) || nextPlanned(now), bonus: !plannedFor(now), done:{}};
const today = S.days[todayKey], W = WORKOUTS[today.wk];
W.ex.forEach(e => { if(!today.done[e.id]) today.done[e.id] = Array(e.sets).fill(false); });
save();

function seed(){ // a believable week so far, and a session in progress
  weekDays.forEach(d=>{
    const k = plannedFor(d); if(!k || d >= new Date(now.getFullYear(),now.getMonth(),now.getDate())) return;
    const done = {}; WORKOUTS[k].ex.forEach((e,i,a)=>{ done[e.id] = Array(e.sets).fill(true); if(k==='pull' && i===a.length-1) done[e.id][e.sets-1] = false; });
    S.days[iso(d)] = {wk:k,done};
  });
  const k = plannedFor(now) || nextPlanned(now), done = {}; let n = 7;
  WORKOUTS[k].ex.forEach(e=>{ done[e.id] = Array(e.sets).fill(false).map(()=> n-- > 0); });
  S.days[todayKey] = {wk:k,bonus:!plannedFor(now),done};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const kgOf = e => S.kg[e.id] ?? e.kg;
function dayStats(key){
  const rec = S.days[key]; if(!rec) return {done:0,total:0,vol:0};
  let done=0,total=0,vol=0;
  WORKOUTS[rec.wk].ex.forEach(e=>{ const a = rec.done[e.id]||[]; total+=e.sets; const c=a.filter(Boolean).length; done+=c; vol+=c*e.reps*kgOf(e); });
  return {done,total,vol};
}

/* ---------- hero: the bar ---------- */
function renderHero(){
  const st = dayStats(todayKey), left = st.total-st.done;
  const next = W.ex.find(e => today.done[e.id].includes(false));
  const exDone = W.ex.filter(e => !today.done[e.id].includes(false)).length;
  // plates: innermost = first set. Height tracks the load of that lift.
  const flat = []; W.ex.forEach((e,ei)=> today.done[e.id].forEach(d => flat.push({d,ei,e})));
  const maxKg = Math.max(...W.ex.map(kgOf),1);
  const VW=343, CY=62, cx=VW/2, inner=30, pitch=Math.min(8,(cx-inner-14)/flat.length), pw=pitch-2;
  let plates='';
  flat.forEach((p,i)=>{
    const h = 44 + 60*(kgOf(p.e)/maxKg), gap = p.ei*3;
    [1,-1].forEach(s=>{
      const x = s>0 ? cx+inner+gap+i*pitch : cx-inner-gap-i*pitch-pw;
      plates += `<rect class="plate" x="${x.toFixed(1)}" y="${(CY-h/2).toFixed(1)}" width="${pw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.6" ${p.d?'fill="#FF4A1C"':'fill="#1B1A18" stroke="#8A867E" stroke-width="1"'}/>`;
    });
  });
  let knurl=''; for(let x=cx-20;x<=cx+20;x+=4) knurl+=`<path d="M${x} ${CY-3}v6" stroke="#0B0B0B" stroke-width="1"/>`;
  const svg = `<svg viewBox="0 0 ${VW} 124" role="img" aria-label="${st.done} of ${st.total} plates loaded on the bar">
    <ellipse cx="${cx}" cy="119" rx="150" ry="3.5" fill="#000" opacity=".55"/><path d="M12 119.5h${VW-24}" stroke="#3A3835" stroke-width="1" stroke-dasharray="2 5"/><rect x="0" y="${CY-3}" width="${VW}" height="6" rx="3" fill="#D9D5CC"/>${knurl}
    <rect x="${cx-inner}" y="${CY-9}" width="5" height="18" rx="1.5" fill="#F7F5F0"/><rect x="${cx+inner-5}" y="${CY-9}" width="5" height="18" rx="1.5" fill="#F7F5F0"/>
    ${plates}</svg>`;
  const mins = Math.round(left*2.75);
  const line = left===0 ? `<b>Bar's loaded.</b> ${fmt(st.vol)} kg moved today — go eat.`
    : `<b>${left} ${left===1?'set':'sets'} to go.</b> Next up: ${next.name}, ${next.reps} reps${kgOf(next)?` at ${kgOf(next)} kg`:''}.`;
  $('hero').className = 'hero'+(left===0?' done':'');
  $('hero').innerHTML = `
    <div class="hero-top"><div><div class="kicker">${today.bonus?'Rest day · bonus ':''}${W.name} day</div><h1>${line}</h1></div>
      </div>
    <div class="count"><div class="big num">${st.done}</div><div class="of num">/ ${st.total}<span>sets loaded</span></div><div class="sticker">${left===0?'Done ✓':Math.round(st.done/st.total*100)+'% loaded'}</div></div>
    <div class="bar-wrap">${svg}</div>
    <div class="hero-stats">
      <div><b class="num">${fmt(st.vol)}<small>kg</small></b><span>Volume</span></div>
      <div><b class="num">${exDone}<small>/ ${W.ex.length}</small></b><span>Lifts done</span></div>
      <div><b class="num">${left?'~'+mins+'<small>min</small>':'100<small>%</small>'}</b><span>${left?'To go':'Complete'}</span></div>
    </div>`;
}

/* ---------- exercises ---------- */
const CHECK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5 5 9l4.5-6"/></svg>';
function renderList(pop){
  const nextEx = W.ex.find(e => today.done[e.id].includes(false));
  $('list').innerHTML = W.ex.map((e,i)=>{
    const a = today.done[e.id], c = a.filter(Boolean).length, kg = kgOf(e), all = c===e.sets;
    return `<article class="ex${all?' done':''}${e===nextEx?' next':''}${W.ex.length%2&&i===W.ex.length-1?' last':''}">
      <div class="ex-h"><div class="tile">${ICON[e.icon]}</div>
        <div><h3>${e.name}</h3><div class="meta num">${e.sets} × ${e.reps} · ${kg?kg+' kg':'bodyweight'}</div></div>
        <div><span class="idx num">${String(i+1).padStart(2,'0')}</span><span class="done-tag">Done</span></div></div>
      <div class="sets" role="group" aria-label="${e.name} sets">${a.map((d,j)=>
        `<button class="set${pop===e.id+j?' pop':''}" data-ex="${e.id}" data-i="${j}" aria-pressed="${d}" aria-label="Set ${j+1}, ${e.reps} reps${kg?' at '+kg+' kg':''}"><span class="r num">${e.reps}<small>reps</small></span><span class="ck">${CHECK}</span></button>`).join('')}</div>
      <div class="ex-f"><div class="left num">${all?`<b>${fmt(c*e.reps*kg)} kg</b> moved`:all?`<b>${c*e.reps} reps</b> done`:`<b>${c} of ${e.sets}</b> sets`}</div>
        ${kg?`<div class="step"><button data-step="-1" data-ex="${e.id}" aria-label="Lower ${e.name} weight">−</button><output class="num">${kg} kg</output><button data-step="1" data-ex="${e.id}" aria-label="Raise ${e.name} weight">+</button></div>`:'<div class="step static"><output>No load</output></div>'}</div>
    </article>`;}).join('');
}
$('list').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const e = W.ex.find(x=>x.id===b.dataset.ex);
  if(b.dataset.step){
    S.kg[e.id] = Math.max(e.step, kgOf(e) + e.step*b.dataset.step); save(); render();
    $('list').querySelector(`[data-ex="${e.id}"][data-step="${b.dataset.step}"]`).focus(); return;
  }
  const i = +b.dataset.i, a = today.done[e.id]; a[i] = !a[i]; save(); render(a[i] ? e.id+i : null);
  $('list').querySelector(`.set[data-ex="${e.id}"][data-i="${i}"]`).focus({preventScroll:true});
  if(a[i] && dayStats(todayKey).done < dayStats(todayKey).total) startRest(REST); else stopRest();
  if(navigator.vibrate) navigator.vibrate(a[i]?12:4);
});

/* ---------- week: plate stacks ---------- */
function renderWeek(){
  let sessions=0, planned=0, sets=0, vol=0;
  const cols = weekDays.map(d=>{
    const key = iso(d), rec = S.days[key], plan = rec ? rec.wk : plannedFor(d), isToday = key===todayKey;
    const st = rec ? dayStats(key) : {done:0,total: plan ? WORKOUTS[plan].ex.reduce((s,e)=>s+e.sets,0) : 0, vol:0};
    if(plan && !(rec && rec.bonus && !st.done)) planned++;
    if(st.done && st.done >= st.total-1) sessions++;
    sets += st.done; vol += st.vol;
    const future = key > todayKey, rest = !plan || (rec && rec.bonus && !st.done);
    let stack = '';
    if(rest) stack = '<span class="rest">Rest</span>';
    else for(let i=0;i<st.total;i++){ const on = i<st.done; stack += `<i class="${on?'':'todo'}" style="width:84%"></i>`; }
    return `<div class="rack${isToday?' today':''}" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long'})}: ${rest?'rest':st.done+' of '+st.total+' sets'}">
      <div class="n num">${rest?'':(future?'':st.done)}</div><div class="stack${rest?' off':''}">${stack}</div><div class="base"></div>
      <div class="d">${d.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)}<b class="num">${d.getDate()}</b></div></div>`;
  }).join('');
  $('week').innerHTML = `
    <div class="week-h"><h2>This<br>week</h2><div class="sess num">${sessions}/${planned}<small>sessions done</small></div></div>
    <div class="legend"><i></i>set done<i class="t"></i>still to do</div>
    <div class="racks">${cols}</div>
    <div class="week-stats"><div><b class="num">${sets}<small>sets</small></b><span>Plates stacked</span></div>
      <div><b class="num">${fmt(vol)}<small>kg</small></b><span>Total volume</span></div></div>`;
}

function renderNote(){
  $('note').innerHTML = S.sample
    ? '<span>Showing a sample week so you can see it working.</span><button id="fresh">Start fresh</button>'
    : '<span>Saved on this device.</span>';
}
function render(pop){ renderHero(); renderList(pop); renderWeek(); renderNote(); }

$('date').textContent = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
$('reset').addEventListener('click', ()=>{
  if(!confirm("Clear today's ticked sets?")) return;
  W.ex.forEach(e=> today.done[e.id].fill(false)); save(); stopRest(); render();
});
$('note').addEventListener('click', ev=>{
  if(ev.target.id!=='fresh' || !confirm('Clear the sample week and start from zero?')) return;
  S.days = {[todayKey]:today}; S.kg = {}; S.sample = false;
  W.ex.forEach(e=> today.done[e.id].fill(false)); save(); stopRest(); render();
});

/* ---------- rest timer ---------- */
let tEnd=0, tTotal=REST, tInt=null;
function startRest(s){ tTotal=s; tEnd=Date.now()+s*1000; $('timer').classList.add('on'); document.body.classList.add('resting'); clearInterval(tInt); tInt=setInterval(tick,250); tick(); }
function stopRest(){ clearInterval(tInt); $('timer').classList.remove('on'); document.body.classList.remove('resting'); }
function tick(){
  const l = Math.max(0,(tEnd-Date.now())/1000), s = Math.ceil(l);
  $('tleft').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('arc').setAttribute('stroke-dashoffset', (125.7*(1-l/tTotal)).toFixed(1));
  if(l<=0){ if(navigator.vibrate) navigator.vibrate([80,60,80]); stopRest(); }
}
$('tskip').addEventListener('click', stopRest);
$('tadd').addEventListener('click', ()=>{ tEnd+=30000; tTotal+=30; tick(); });

render();
})();
</script>
</body>
</html>
