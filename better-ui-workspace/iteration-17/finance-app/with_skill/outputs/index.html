<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<title>Ledgerly · Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — light grey canvas, white cards, near-black brand for the balance card and controls,
   pink block for the budget, butter/sky/pastel tints for categories. Font: Urbanist. */
:root {
  --font: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F2F0; --surface: #FFFFFF; --surface-2: #F5F5F3; --line: #E8E8E5; --line-2: #DCDCD8;
  --text: #121212; --text-2: #5E6066; --text-3: #8C8E94;
  --brand: #0D0D0D; --on-brand: #FFFFFF;
  --pink: #FFD6E0; --pink-2: #FFC4D3; --butter: #FFF1B8; --sky: #D3E8FF;
  --ok: #15803D; --ok-tint: #E3F5E9; --warn: #A15C07; --warn-tint: #FEF0D9; --bad: #C0262D; --bad-tint: #FDE8E8;
  --r-xs: 8px; --r-sm: 12px; --r-md: 20px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(20,20,20,.04), 0 1px 1px rgba(20,20,20,.03);
  --sh-2: 0 1px 2px rgba(20,20,20,.05), 0 8px 20px -10px rgba(20,20,20,.12);
  --sh-float: 0 12px 32px -8px rgba(20,20,20,.22), 0 2px 6px rgba(20,20,20,.06);
  --ease: cubic-bezier(.2,.8,.2,1);
  --tabbar-h: 72px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.shell { min-height: 100dvh; }
.sidebar { display: none; }
.main { padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabbar-fade { display: none; }
.tabbar-inner { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; max-width: 520px; margin: 0 auto; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; color: var(--text-2); font-size: 12px; font-weight: 500; border-radius: var(--r-sm); transition: color .15s; }
.tab .ico { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); font-weight: 600; }
.tab[aria-current="page"] .ico { stroke-width: 2.1; }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 8px 18px -6px rgba(0,0,0,.45); transition: transform .15s var(--ease); }
.tab-add:active { transform: scale(.94); }
.tab-add .ico { width: 24px; height: 24px; stroke-width: 2.2; }

/* Page header */
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; min-height: 48px; }
.ph-kicker { font-size: 14px; color: var(--text-2); font-weight: 500; }
.ph h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.ph-actions { display: flex; align-items: center; gap: 8px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--pink); overflow: hidden; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.avatar img { width: 100%; height: 100%; }
.avatar-btn { border-radius: 50%; transition: transform .15s var(--ease); }
.avatar-btn:active { transform: scale(.95); }
.search-top { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full);
  font-weight: 600; font-size: 15px; background: var(--brand); color: #fff; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 14px -6px rgba(0,0,0,.4); transition: transform .15s var(--ease), box-shadow .15s var(--ease), background-color .15s; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); background: #262626; } }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn-ghost:hover { background: var(--surface-2); } }
.btn-danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn-danger:hover { background: #FAD5D5; } }
.btn-block { width: 100%; height: 52px; font-size: 16px; }
.link { font-size: 14px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 2px; padding: 10px 4px 10px 10px; margin: -10px -4px -10px 0; border-radius: var(--r-xs); }
.link .ico { width: 16px; height: 16px; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); transition: background-color .15s; }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }

/* Cards */
.card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-1); padding: 20px; border: 1px solid rgba(0,0,0,.035); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.card-sub { font-size: 14px; color: var(--text-2); }

/* Overview grid */
.ov { display: grid; gap: 16px; grid-template-areas: "bal" "bud" "cat" "rec"; }
.ov > * { min-width: 0; }
.a-bal { grid-area: bal; display: grid; gap: 12px; }
.a-bud { grid-area: bud; }
.a-cat { grid-area: cat; }
.a-rec { grid-area: rec; }

/* Balance card */
.balance { position: relative; overflow: hidden; background: var(--brand); color: #fff; border-radius: var(--r-lg); padding: 20px 20px 18px;
  box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 20px 40px -18px rgba(0,0,0,.55); isolation: isolate; }
.balance::before { content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,214,224,.22), transparent 68%); z-index: -1; }
.bal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bal-label { font-size: 14px; color: rgba(255,255,255,.72); font-weight: 500; }
.bal-acct { font-size: 13px; color: rgba(255,255,255,.72); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.netmark { display: inline-flex; }
.netmark i { width: 16px; height: 16px; border-radius: 50%; background: #FF8FAB; }
.netmark i + i { background: rgba(255,241,184,.9); margin-left: -6px; mix-blend-mode: screen; }
.bal-fig { font-size: 36px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; margin-top: 6px; }
.bal-fig .dec { color: rgba(255,255,255,.55); font-size: 24px; }
.bal-delta { align-self: flex-start; width: max-content; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-full); background: rgba(198,244,170,.16); color: #C9F2B0; }
.bal-delta.neg { background: rgba(255,170,170,.16); color: #FFB8B8; }
.bal-delta span { color: rgba(255,255,255,.72); font-weight: 500; }
.spark { position: relative; height: 56px; margin: 16px 6px 0 0; }
.spark svg { width: 100%; height: 100%; }
.spark-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--pink); border: 2px solid var(--brand); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(255,214,224,.18); }
.bal-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }
.bal-stat { display: flex; align-items: center; gap: 10px; }
.bal-stat + .bal-stat { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.12); }
.bal-stat .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
.bal-stat .ic .ico { width: 16px; height: 16px; }
.bal-stat small { display: block; font-size: 12px; color: rgba(255,255,255,.72); line-height: 1.3; }
.bal-stat b { font-size: 16px; font-weight: 600; }

/* Quick actions */
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 14px 8px; }
.qa-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text); padding: 4px 0; border-radius: var(--r-sm); }
.qa-btn .c { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; transition: transform .15s var(--ease); }
.qa-btn:active .c { transform: scale(.94); }
@media (hover: hover) { .qa-btn:hover .c { transform: translateY(-2px); } }

/* Budget block */
.budget { background: var(--pink); border-radius: var(--r-lg); padding: 20px; color: var(--text); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.budget-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.budget-head h2 { font-size: 16px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.plain::before { display: none; }
.budget .pill { background: rgba(255,255,255,.7); }
.budget-fig { font-size: 32px; font-weight: 600; letter-spacing: -0.025em; margin-top: 14px; line-height: 1.15; }
.budget-fig { white-space: nowrap; }
.budget-fig .dec { font-size: 22px; color: rgba(18,18,18,.66); }
.budget-fig small { font-size: 16px; font-weight: 500; color: rgba(18,18,18,.7); letter-spacing: 0; margin-left: 4px; }
.budget-of { font-size: 14px; color: rgba(18,18,18,.72); margin-top: 2px; }
.meter { position: relative; margin-top: 20px; }
.meter-track { height: 12px; border-radius: var(--r-full); background: rgba(18,18,18,.1); overflow: hidden; }
.meter-fill { height: 100%; border-radius: var(--r-full); background: var(--brand); transition: width .6s var(--ease); }
.meter-pace { position: absolute; top: -4px; width: 2px; height: 20px; background: var(--brand); border-radius: 2px; transform: translateX(-1px); }
.meter-pace::after { content: ""; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); border: 2px solid var(--pink); }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: rgba(18,18,18,.68); margin-top: 8px; font-weight: 500; }
.budget-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 8px; }
.watch { margin-top: 20px; background: rgba(255,255,255,.62); border-radius: 16px; padding: 6px 14px; }
.watch-title { font-size: 12px; font-weight: 600; color: rgba(18,18,18,.7); padding: 8px 0 2px; }
.watch-row { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; }
.watch-row + .watch-row { border-top: 1px solid rgba(18,18,18,.07); }
.watch-row .chip-ic { width: 32px; height: 32px; border-radius: 10px; }
.watch-row .chip-ic .ico { width: 16px; height: 16px; }
.watch-row b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.watch-bar { height: 4px; border-radius: 2px; background: rgba(18,18,18,.08); margin-top: 5px; overflow: hidden; }
.watch-bar span { display: block; height: 100%; border-radius: 2px; }
.watch-v { font-size: 13px; font-weight: 600; text-align: right; }
.watch-v.bad { color: var(--bad); }
.watch-v small { display: block; font-size: 12px; font-weight: 500; color: rgba(18,18,18,.66); }
.budget-stats { margin-top: 8px; }
@media (min-width: 768px) { .budget-stats { margin-top: auto; padding-top: 12px; } }
.bstat { background: rgba(255,255,255,.62); border-radius: 12px; padding: 12px 14px; }
.bstat small { display: block; font-size: 12px; color: rgba(18,18,18,.7); font-weight: 500; }
.bstat b { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

/* Category breakdown */
.segbar { display: flex; gap: 3px; height: 14px; margin-bottom: 18px; }
.segbar span { border-radius: 4px; min-width: 4px; transition: opacity .15s; }
.segbar span:first-child { border-radius: 7px 4px 4px 7px; }
.segbar span:last-child { border-radius: 4px 7px 7px 4px; }
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.cat-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
.cat-meta { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.cat-meta i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.cat-amt { text-align: right; font-size: 15px; font-weight: 600; }
.cat-amt small { display: block; font-size: 13px; color: var(--text-2); font-weight: 500; }

/* Icon chips */
.chip-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--fg); flex: none; }
.chip-ic .ico { width: 19px; height: 19px; }

/* Transactions */
.tx-group + .tx-group { margin-top: 12px; }
.tx-day { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 4px 0 4px; }
.tx { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 12px; transition: background-color .15s; min-height: 60px; }
@media (hover: hover) { .tx:hover { background: var(--surface-2); } }
.tx:active { background: var(--surface-2); }
.tx-main { min-width: 0; }
.tx-name { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
.tx-sub { display: block; font-size: 13px; color: var(--text-2); line-height: 1.35; }
.tx-amt { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tx-amt.pos { color: var(--ok); }

/* Activity */
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-2); width: 18px; height: 18px; pointer-events: none; }
.input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search .input { padding-left: 42px; }
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,13,13,.08); }
.input.err { border-color: var(--bad); }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #E7E7E4; border-radius: var(--r-full); padding: 4px; gap: 2px; }
.seg button { height: 40px; padding: 0 16px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .15s, color .15s; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px; margin: 0 -16px; scroll-snap-type: x proximity; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.fchip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; transition: background-color .15s, border-color .15s, color .15s; scroll-snap-align: start; }
.fchip.plainc { padding: 0 16px; }
.fchip .dotc { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
.fchip .dotc .ico { width: 15px; height: 15px; }
.fchip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (hover: hover) { .fchip:not([aria-pressed="true"]):hover { border-color: var(--line-2); background: var(--surface-2); } }
.act-tools { display: grid; gap: 12px; margin-bottom: 16px; }
.act-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.act-layout { display: grid; gap: 16px; }
.act-layout > * { min-width: 0; }
@media (max-width: 1023px) { .act-side { order: -1; } }
.sumtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sumtile { background: var(--surface); border-radius: var(--r-md); padding: 16px; box-shadow: var(--sh-1); border: 1px solid rgba(0,0,0,.035); }
.sumtile .chip-ic { width: 36px; height: 36px; border-radius: 10px; margin-bottom: 12px; }
.sumtile small { display: block; font-size: 13px; color: var(--text-2); font-weight: 500; }
.sumtile b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.result-count { font-size: 13px; color: var(--text-2); font-weight: 500; }

/* Budget screen */
.bud-layout { display: grid; gap: 16px; }
.bud-layout > * { min-width: 0; }
.pace-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.pace-fig { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.pace-fig small { display: block; margin-top: 2px; }
@media (min-width: 480px) { .pace-fig small { display: inline; margin: 0; } }
.pace-fig small { font-size: 15px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.chart { position: relative; height: 200px; margin: 20px 0 0 40px; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.chart .yl { position: absolute; left: -40px; width: 32px; text-align: right; font-size: 12px; color: var(--text-2); transform: translateY(-50%); }
.chart .xl { position: absolute; top: calc(100% + 8px); font-size: 12px; color: var(--text-2); transform: translateX(-50%); white-space: nowrap; }
.chart .pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--brand); transform: translate(-50%, -50%); }
.chart .tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); background: var(--brand); color: #fff; padding: 6px 10px; border-radius: 10px; font-size: 12px; white-space: nowrap; line-height: 1.35; box-shadow: var(--sh-float); }
.chart .tip b { display: block; font-size: 14px; font-weight: 600; }
.chart .blabel { position: absolute; right: 0; transform: translateY(calc(-100% - 4px)); font-size: 12px; font-weight: 600; color: var(--text-2); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin-top: 36px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 2.5px solid var(--brand); display: inline-block; }
.legend i.dash { border-top: 2px dashed #9A9CA2; }
.legend i.lim { border-top: 2px dotted var(--text-2); }
.brow { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 12px; transition: background-color .15s; }
@media (hover: hover) { .brow:hover { background: var(--surface-2); } }
.brow + .brow { box-shadow: 0 -1px 0 var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
.brow .bar { grid-column: 2 / 4; height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin-top: -2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.03); }
.brow .bar span { display: block; height: 100%; border-radius: inherit; }
.brow-right { display: flex; align-items: center; gap: 8px; }
.brow-right .ico { width: 16px; height: 16px; color: var(--text-3); }

.bars { position: relative; height: 120px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; border-bottom: 1px solid var(--line-2); }

.srow-s { font-size: 13px; color: var(--text-2); display: block; }
.srow-v { font-size: 14px; color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.srow-v .ico { width: 16px; height: 16px; }
button.srow { border-radius: 0; }

.srow.danger .srow-t { color: var(--bad); }
.card.set-card { padding: 4px 20px; }
@media (min-width: 1024px) { .card.set-card { padding: 4px 24px; } }
.switch { width: 48px; height: 28px; border-radius: var(--r-full); background: #D6D6D2; position: relative; transition: background-color .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.foot-note { font-size: 13px; color: var(--text-2); text-align: center; padding: 8px 0; }

/* Empty */

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 92dvh; overflow-y: auto;

  .side-widget .mini { height: 6px; border-radius: 3px; background: rgba(18,18,18,.1); margin-top: 12px; overflow: hidden; }

  .side-widget p { font-size: 13px; color: rgba(18,18,18,.72); margin-top: 8px; }
  .user { display: flex; align-items: center; gap: 10px; padding: 16px 6px 0; margin-top: 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; border-radius: 0; }
  .user .avatar { width: 40px; height: 40px; }

  .user span { font-size: 13px; color: var(--text-2); }

  .main { max-width: 1200px; width: 100%; margin: 0; padding: 32px 40px 48px; }

  .search-top { display: block; width: 280px; }

  .ov { grid-template-columns: 7fr 5fr; gap: 20px; grid-template-areas: "bal bud" "rec cat"; }
  .balance { padding: 24px 24px 20px; }
  .spark { height: 84px; }
  .bal-fig { font-size: 40px; }
  .budget { padding: 24px; }
  .card { padding: 24px; }
  .act-layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  .act-side { position: sticky; top: 32px; display: grid; gap: 16px; }
  .bud-layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .chart { height: 240px; }
  .tab-only { display: none !important; }
  .toast { bottom: 32px; }
}
@media (max-width: 1023px) { .desk-only { display: none !important; } }
@media (min-width: 1280px) { .main { padding: 36px 56px 56px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

<body>
<div class="shell">
  <aside class="sidebar" aria-label="Main">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#0D0D0D"/><rect x="8" y="15" width="4" height="7" rx="2" fill="#FFF1B8"/><rect x="13" y="11" width="4" height="11" rx="2" fill="#D3E8FF"/><rect x="18" y="7" width="4" height="15" rx="2" fill="#FFD6E0"/></svg>Ledgerly</div>
    <nav class="nav" id="sideNav"></nav>

<div id="sheetRoot"></div>

<script>
/* ---------- Icons ---------- */
const I = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  activity: '<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="2.6"/>',
  budget: '<path d="M21 12A9 9 0 1 1 12 3"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  groceries: '<circle cx="8" cy="20.5" r="1.2"/><circle cx="18" cy="20.5" r="1.2"/><path d="M2 3h2.5l2.4 11.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L21 7H5.3"/>',
  dining: '<path d="M4 2v7a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V2M7 2v20"/><path d="M20 15V2a5 5 0 0 0-4 5v6a2 2 0 0 0 2 2h2zm0 0v7"/>',
  transport: '<path d="M5 17H3v-5l2.5-5h13L21 12v5h-2"/><path d="M3 12h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5"/>',
  shopping: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  bills: '<path d="M13 2 4 14h8l-1 8 9-12h-8z"/>',
  housing: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  entertainment: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/>',
  health: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  income: '<path d="M17 7 7 17M17 17H7V7"/>',
  expense: '<path d="M7 17 17 7M7 7h10v10"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  dollar: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  pencil: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
};
const ico = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Categories ---------- */
const CATS = {
  housing:       { name: 'Rent',              bg: '#FFE4D1', fg: '#9A4A14', bar: '#F4A46F', fixed: true },
  groceries:     { name: 'Groceries',         bg: '#D3E8FF', fg: '#1D5A9E', bar: '#7DB3F0' },
  dining:        { name: 'Dining out',        bg: '#FFD6E0', fg: '#A8264F', bar: '#F590AE' },
  transport:     { name: 'Transport',         bg: '#FFF1B8', fg: '#755900', bar: '#F2CC4E' },
  shopping:      { name: 'Shopping',          bg: '#E7E0FF', fg: '#5A3EC2', bar: '#A893F2' },
  bills:         { name: 'Bills & utilities', bg: '#D6F3E3', fg: '#17704A', bar: '#67C795', fixed: true },
  entertainment: { name: 'Entertainment',     bg: '#D2F1F0', fg: '#0D6C69', bar: '#5CC5C0' },
  health:        { name: 'Health',            bg: '#ECF6C8', fg: '#56690A', bar: '#B5D44A' },
  income:        { name: 'Income',            bg: '#DDF5CF', fg: '#2E7514', bar: '#7CCB5A' },
};
const EXPENSE_CATS = Object.keys(CATS).filter(k => k !== 'income');
const catChip = (k, size = '') => { const c = CATS[k]; return `<span class="chip-ic ${size}" style="--bg:${c.bg};--fg:${c.fg}">${ico(k)}</span>`; };

/* ---------- Dates & money ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TODAY_S = ymd(TODAY);
const MONTH_KEY = TODAY_S.slice(0, 7);
const DAYS_IN_MONTH = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate();
const DAY = TODAY.getDate();
const MONTH_NAME = TODAY.toLocaleDateString('en-US', { month: 'long' });
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const money = n => usd.format(Math.abs(n));
const signed = n => (n < 0 ? '−' : '+') + money(n);
const splitMoney = (n, neg) => { const s = money(n); const i = s.lastIndexOf('.'); return `${neg ? '−' : ''}${s.slice(0, i)}<span class="dec">${s.slice(i)}</span>`; };
const shortMoney = n => n >= 1000 ? '$' + (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'k' : '$' + Math.round(n);
const round2 = n => Math.round(n * 100) / 100;
function dayLabel(s) {
  if (s === TODAY_S) return 'Today';
  const y = new Date(TODAY); y.setDate(y.getDate() - 1);
  if (s === ymd(y)) return 'Yesterday';
  const d = parse(s);
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  if (d.getFullYear() !== TODAY.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-US', opts);
}
const timeLabel = t => { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Sample data ---------- */
const TEMPLATE = [
  [1, '09:02', 'Rent payment', 'housing', 1650],
  [1, '06:15', 'Payroll deposit', 'income', 2425],
  [1, '11:30', 'Spotify', 'entertainment', 11.99],

function seed() {
  const tx = []; let id = 1;
  const prev = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1);
  const prevDays = new Date(prev.getFullYear(), prev.getMonth() + 1, 0).getDate();
  TEMPLATE.forEach(([d, t, m, c, a], i) => {
    if (d <= prevDays) {
      const fixed = c === 'income' || c === 'housing' || ['Spotify', 'Netflix', 'Hulu', 'Verizon Wireless', 'Planet Fitness'].includes(m);
      const f = fixed ? 1 : 0.82 + ((i * 37) % 31) / 100;
      tx.push({ id: id++, date: ymd(new Date(prev.getFullYear(), prev.getMonth(), d)), time: t, merchant: m, cat: c, amount: round2((c === 'income' ? 1 : -1) * a * f) });
    }
  });
  TEMPLATE.forEach(([d, t, m, c, a]) => {
    if (d <= DAY) tx.push({ id: id++, date: ymd(new Date(TODAY.getFullYear(), TODAY.getMonth(), d)), time: t, merchant: m, cat: c, amount: (c === 'income' ? 1 : -1) * a });
  });
  return { v: 1, opening: 8920.40, nextId: id, tx, budgets: { ...DEFAULT_BUDGETS }, prefs: { alerts: true, weekly: false } };
}

/* ---------- Derived ---------- */
const sortTx = list => [...list].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || b.id - a.id);
function derive() {
  const balance = round2(S.opening + S.tx.reduce((s, t) => s + t.amount, 0));
  const month = S.tx.filter(t => t.date.startsWith(MONTH_KEY));
  const income = round2(month.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0));
  const spent = round2(-month.filter(t => t.amount < 0).reduce((s, t) => s + t.amount, 0));
  const byCat = {};
  EXPENSE_CATS.forEach(k => byCat[k] = { amt: 0, n: 0 });
  month.filter(t => t.amount < 0).forEach(t => { byCat[t.cat].amt = round2(byCat[t.cat].amt - t.amount); byCat[t.cat].n++; });
  const budgetTotal = EXPENSE_CATS.reduce((s, k) => s + (S.budgets[k] || 0), 0);
  const fixedBudget = EXPENSE_CATS.filter(k => CATS[k].fixed).reduce((s, k) => s + (S.budgets[k] || 0), 0);
  const expectedAt = d => fixedBudget + (budgetTotal - fixedBudget) * d / DAYS_IN_MONTH;
  const expected = expectedAt(DAY);
  const left = round2(budgetTotal - spent);
  const daysLeft = DAYS_IN_MONTH - DAY;
  return { balance, month, income, spent, byCat, budgetTotal, fixedBudget, expectedAt, expected, left, daysLeft };
}

function budgetView(D) {
  // Cumulative spending chart
  const days = DAYS_IN_MONTH;
  const cum = []; let run = 0;
  for (let d = 1; d <= DAY; d++) {
    const ds = `${MONTH_KEY}-${pad(d)}`;
    run += -D.month.filter(t => t.date === ds && t.amount < 0).reduce((s, t) => s + t.amount, 0);
    cum.push(run);
  }
  const top = Math.max(D.budgetTotal, run) * 1.1;
  const step = top > 4000 ? 1000 : top > 2000 ? 1000 : 500;
  const ymax = Math.ceil(top / step) * step || 500;
  const W = 600, H = 200;
  const X = d => (d - 1) / (days - 1) * W;
  const Y = v => H - v / ymax * H;
  const line = cum.map((v, i) => (i ? 'L' : 'M') + X(i + 1).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const pace = `M0 ${Y(D.expectedAt(1)).toFixed(1)} L${W} ${Y(D.budgetTotal).toFixed(1)}`;
  const ticks = []; for (let v = 0; v <= ymax; v += step) ticks.push(v);
  const xt = [1, 8, 15, 22, days];
  const tx = X(DAY) / W * 100, ty = Y(run) / H * 100;
  const tipShift = tx > 80 ? 'transform:translate(-88%, calc(-100% - 14px))' : tx < 15 ? 'transform:translate(-12%, calc(-100% - 14px))' : '';
  const diff = round2(run - D.expected);

  const rows = EXPENSE_CATS.map(k => ({ k, b: S.budgets[k] || 0, ...D.byCat[k] })).sort((a, b) => (b.amt / (b.b || 1)) - (a.amt / (a.b || 1)));
  const over = rows.filter(r => r.amt > r.b && r.b > 0).length;

  return `<div class="view">${header('Budget', `${MONTH_NAME} ${TODAY.getFullYear()} · ${D.daysLeft} days left`)}
  <div class="bud-layout">
    <div style="display:grid;gap:16px;min-width:0">
      <section class="card" aria-labelledby="paceTitle">
        <div class="pace-head">
          <div><h2 class="card-sub" id="paceTitle" style="font-weight:500">Spent so far</h2><div class="pace-fig num">${money(D.spent)} <small>of ${money(D.budgetTotal)}</small></div></div>
          <span class="pill ${diff > 1 ? 'warn' : 'ok'} num">${diff > 1 ? `${money(diff)} over plan` : `${money(-diff)} under plan`}</span>
        </div>
        <div class="chart" role="img" aria-label="Cumulative spending this month: ${money(run)} by day ${DAY}, against a plan of ${money(D.expected)} and a budget of ${money(D.budgetTotal)}">
          ${ticks.map(v => `<span class="yl num" style="top:${Y(v) / H * 100}%">${shortMoney(v)}</span>`).join('')}
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0D0D" stop-opacity=".12"/><stop offset="1" stop-color="#0D0D0D" stop-opacity="0"/></linearGradient></defs>
            ${ticks.map(v => `<path d="M0 ${Y(v)}H${W}" stroke="${v ? '#ECECE9' : '#D6D6D2'}" stroke-width="1" vector-effect="non-scaling-stroke" ${v ? 'stroke-dasharray="3 5"' : ''}/>`).join('')}
            <path d="M0 ${Y(D.budgetTotal)}H${W}" stroke="#5E6066" stroke-width="1.5" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
            <path d="${pace}" stroke="#9A9CA2" stroke-width="1.75" stroke-dasharray="5 5" fill="none" vector-effect="non-scaling-stroke"/>
            ${cum.length > 1 ? `<path d="${line} L${X(DAY)} ${H} L0 ${H}Z" fill="url(#cg)"/>` : ''}
            <path d="${line}" stroke="#0D0D0D" stroke-width="2.5" fill="none" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            <path d="M${X(DAY)} ${Y(run)}V${H}" stroke="#0D0D0D" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
          </svg>
          <span class="blabel num" style="top:${Y(D.budgetTotal) / H * 100}%">Budget ${shortMoney(D.budgetTotal)}</span>
          <span class="pt" style="left:${tx}%;top:${ty}%"></span>
          <span class="tip num" style="left:${tx}%;top:${ty}%;${tipShift}"><b>${money(run)}</b>${MONTH_NAME.slice(0, 3)} ${DAY}</span>
          ${xt.map(d => `<span class="xl num" style="left:${X(d) / W * 100}%">${MONTH_NAME.slice(0, 3)} ${d}</span>`).join('')}
        </div>
        <div class="legend"><span><i></i>Spent</span><span><i class="dash"></i>Plan</span><span><i class="lim"></i>Budget</span></div>
      </section>
      ${dailyCard(D)}
      <div class="sumtiles">
        <div class="sumtile"><span class="chip-ic" style="--bg:var(--butter);--fg:#755900">${ico('target')}</span><small>Left to spend</small><b class="num">${D.left < 0 ? '−' : ''}${money(D.left)}</b></div>
        <div class="sumtile"><span class="chip-ic" style="--bg:var(--sky);--fg:#1D5A9E">${ico('calendar')}</span><small>Per day, ${D.daysLeft} days</small><b class="num">${money(D.daysLeft ? Math.max(0, D.left) / D.daysLeft : Math.max(0, D.left))}</b></div>
      </div>
    </div>
    <section class="card" aria-labelledby="bcTitle">
      <div class="card-head"><div><h2 class="card-title" id="bcTitle">Categories</h2><p class="card-sub">${over ? `${over} over budget · ` : ''}Tap a category to change its limit</p></div></div>
      ${rows.map(r => {
        const p = r.b ? r.amt / r.b : (r.amt ? 1.01 : 0);
        const paid = CATS[r.k].fixed && r.b > 0 && Math.abs(r.amt - r.b) < 0.005;
        const st = paid ? 'plain' : p > 1 ? 'bad' : p >= .85 ? 'warn' : '';
        const pillTxt = paid ? 'Paid' : p > 1 ? `${money(r.amt - r.b)} over` : `${money(r.b - r.amt)} left`;
        return `<button class="brow" data-action="ebudget" data-cat="${r.k}">
          ${catChip(r.k)}
          <span><span class="tx-name">${CATS[r.k].name}</span><span class="tx-sub num">${money(r.amt)} of ${money(r.b)}</span></span>
          <span class="brow-right"><span class="pill num ${st || 'plain'}" ${st && st !== 'plain' ? '' : 'style="background:var(--surface-2);color:var(--text-2)"'}>${pillTxt}</span>${ico('chevron')}</span>
          <span class="bar" aria-hidden="true"><span style="width:${Math.min(100, p * 100)}%;background:${st === 'bad' ? 'var(--bad)' : st === 'warn' ? '#E59A1F' : CATS[r.k].bar}"></span></span>
        </button>`;
      }).join('')}
    </section>
  </div></div>`;
}

function dailyCard(D) {
  const vals = [];
  for (let d = 1; d <= DAYS_IN_MONTH; d++) {
    const ds = `${MONTH_KEY}-${pad(d)}`;
    vals.push(d > DAY ? null : -D.month.filter(t => t.date === ds && t.amount < 0 && !CATS[t.cat].fixed).reduce((s, t) => s + t.amount, 0));
  }
  const past = vals.filter(v => v !== null);
  const avg = past.reduce((s, v) => s + v, 0) / (past.length || 1);
  const max = Math.max(...past, 1);
  const ymax = Math.ceil(max / 50) * 50;
  const maxDay = past.indexOf(Math.max(...past)) + 1;
  return `<section class="card" aria-labelledby="dayTitle">
    <div class="card-head"><div><h2 class="card-title" id="dayTitle">Day-to-day spending</h2><p class="card-sub">Excludes rent and bills</p></div><div style="text-align:right"><div class="num" style="font-size:20px;font-weight:600;letter-spacing:-0.01em">${money(avg)}</div><p class="card-sub">daily average</p></div></div>
    <div class="bars" role="img" aria-label="Daily spending this month; average ${money(avg)}, highest ${money(max)} on ${MONTH_NAME} ${maxDay}">
      <span class="avg" style="bottom:${avg / ymax * 100}%"><em class="num">avg ${shortMoney(avg)}</em></span>
      ${vals.map((v, i) => `<span class="b ${i + 1 === DAY ? 'today' : ''} ${v === null ? 'future' : ''}" style="height:${v === null ? 4 : Math.max(3, v / ymax * 100)}%" title="${MONTH_NAME.slice(0, 3)} ${i + 1}: ${v === null ? '—' : money(v)}"></span>`).join('')}
    </div>
    <div class="bars-x num">${vals.map((v, i) => `<span>${[1, 8, 15, 22, 29].includes(i + 1) ? i + 1 : ''}</span>`).join('')}</div>
  </section>`;
}

function settingsView() {
  const sw = (k, t, s, ic, c) => `<div class="srow"><span class="chip-ic" style="--bg:${c[0]};--fg:${c[1]}">${ico(ic)}</span><span><span class="srow-t" id="sw-${k}">${t}</span><span class="srow-s">${s}</span></span><button class="switch" role="switch" aria-checked="${!!S.prefs[k]}" aria-labelledby="sw-${k}" data-action="pref" data-k="${k}"></button></div>`;
  return `<div class="view">${header('Settings')}
  <div class="set-layout">
    <section class="card"><div class="profile">${avatar().replace('class="avatar"', 'class="avatar"')}<div><b>${USER.name}</b><span>${USER.email}</span></div></div></section>
    <h2 class="group-title">Accounts</h2>
    <section class="card set-card">
      <div class="srow"><span class="chip-ic" style="--bg:#1B1B1B;--fg:#fff">${ico('card')}</span><span><span class="srow-t">Everyday Checking</span><span class="srow-s">•••• 4821</span></span><span class="srow-v num">${money(derive().balance)}</span></div>
      <div class="srow"><span class="chip-ic" style="--bg:#DDF5CF;--fg:#2E7514">${ico('dollar')}</span><span><span class="srow-t">Currency</span><span class="srow-s">Used for all amounts</span></span><span class="srow-v">USD ($)</span></div>
    </section>
    <h2 class="group-title">Notifications</h2>
    <section class="card set-card">
      ${sw('alerts', 'Budget alerts', 'When a category reaches 85% of its limit', 'bell', ['#FFD6E0', '#A8264F'])}
      ${sw('weekly', 'Weekly summary', 'A recap of your spending every Monday', 'mail', ['#D3E8FF', '#1D5A9E'])}
    </section>
    <h2 class="group-title">Data</h2>
    <section class="card set-card">
      <button class="srow" data-action="export"><span class="chip-ic" style="--bg:var(--butter);--fg:#755900">${ico('download')}</span><span><span class="srow-t">Export transactions</span><span class="srow-s">Download a CSV file</span></span><span class="srow-v">${ico('chevron')}</span></button>
      <button class="srow" data-action="reset"><span class="chip-ic" style="--bg:#E7E0FF;--fg:#5A3EC2">${ico('refresh')}</span><span><span class="srow-t">Restore sample data</span><span class="srow-s">Replace your data with the example month</span></span><span class="srow-v">${ico('chevron')}</span></button>
      <button class="srow danger" data-action="clear"><span class="chip-ic" style="--bg:var(--bad-tint);--fg:var(--bad)">${ico('trash')}</span><span><span class="srow-t">Start fresh</span><span class="srow-s">Delete all transactions and reset budgets</span></span><span class="srow-v">${ico('chevron')}</span></button>
    </section>
    <p class="foot-note">Ledgerly 1.4 · Data is stored in this browser</p>
  </div></div>`;
}

/* ---------- Render ---------- */
const main = document.getElementById('main');
function render(focus) {
  const D = derive();
  main.innerHTML = view === 'overview' ? overview(D) : view === 'activity' ? activity(D) : view === 'budget' ? budgetView(D) : settingsView();
  const tab = v => `<button class="tab" data-action="nav" data-view="${v}" ${view === v ? 'aria-current="page"' : ''}>${ico(v)}${VIEW_LABEL[v] === 'Transactions' ? 'Activity' : VIEW_LABEL[v] === 'Overview' ? 'Home' : VIEW_LABEL[v]}</button>`;
  document.getElementById('tabbar').innerHTML = tab('overview') + tab('activity') + `<button class="tab-add" data-action="add" data-type="expense" aria-label="Add transaction">${ico('plus')}</button>` + tab('budget') + tab('settings');
  document.getElementById('sideNav').innerHTML = VIEWS.map(v => `<button class="nav-item" data-action="nav" data-view="${v}" ${view === v ? 'aria-current="page"' : ''}>${ico(v)}${VIEW_LABEL[v]}${v === 'activity' ? `<span class="count num">${S.tx.length}</span>` : ''}</button>`).join('');
  const used = D.budgetTotal ? Math.min(100, D.spent / D.budgetTotal * 100) : 0;
  document.getElementById('sideWidget').innerHTML = `<small>${MONTH_NAME} budget</small><b class="num">${money(D.left)} ${D.left < 0 ? 'over' : 'left'}</b><div class="mini"><span style="width:${used}%"></span></div><p class="num">${Math.round(used)}% used · ${D.daysLeft} days to go</p>`;
  document.getElementById('sideUser').innerHTML = `${avatar()}<span><b>${USER.name}</b><span>Personal</span></span>${ico('chevron')}`;
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; } }
}
function go(v) {
  view = v; history.replaceState(null, '', '#' + v); render(); window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = ico('check') + esc(msg); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- Sheet ---------- */
const root = document.getElementById('sheetRoot');
let lastFocus = null;
function openSheet(title, body) {
  lastFocus = document.activeElement;
  root.innerHTML = `<div class="scrim" data-action="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="icon-btn" data-action="close" aria-label="Close">${ico('x')}</button></div><div id="sheetBody">${body}</div></div>`;
  requestAnimationFrame(() => { root.querySelector('.scrim').classList.add('open'); root.querySelector('.sheet').classList.add('open'); });
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = root.querySelector('[autofocus], input, button.btn'); f && f.focus({ preventScroll: true }); }, 60);
}
function closeSheet() {
  const s = root.querySelector('.sheet'); if (!s) return;
  s.classList.remove('open'); root.querySelector('.scrim').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { root.innerHTML = ''; }, 260);
  lastFocus && lastFocus.focus && document.contains(lastFocus) && lastFocus.focus({ preventScroll: true });
}

/* Add transaction */
const A = { type: 'expense', cat: 'groceries', offset: 0 };
function addBody(errors = {}, vals = {}) {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(TODAY); d.setDate(d.getDate() - i); days.push({ i, d }); }
  const cats = A.type === 'income' ? [] : EXPENSE_CATS;
  return `<form data-form="add" novalidate>
    <div class="seg" role="group" aria-label="Type" style="display:grid;width:100%">${[['expense', 'Expense'], ['income', 'Income']].map(([v, l]) => `<button type="button" data-action="atype" data-v="${v}" aria-pressed="${A.type === v}">${l}</button>`).join('')}</div>
    <div class="field" style="margin-bottom:22px">
      <label class="sr" for="amt">Amount in dollars</label>
      <div class="amount-wrap"><span>$</span><input id="amt" class="amount num" inputmode="decimal" placeholder="0.00" autocomplete="off" value="${esc(vals.amt || '')}" autofocus aria-invalid="${!!errors.amt}" ${errors.amt ? 'aria-describedby="amtErr"' : ''}></div>
      <div class="amount-line ${errors.amt ? 'err' : ''}"></div>
      ${errors.amt ? `<p class="msg" id="amtErr" style="text-align:center">${errors.amt}</p>` : ''}
    </div>
    <div class="field">
      <label for="desc">${A.type === 'income' ? 'From' : 'Merchant'}</label>
      <input id="desc" class="input ${errors.desc ? 'err' : ''}" placeholder="${A.type === 'income' ? 'e.g. Payroll deposit' : "e.g. Trader Joe's"}" value="${esc(vals.desc || '')}" maxlength="40" autocomplete="off" aria-invalid="${!!errors.desc}" ${errors.desc ? 'aria-describedby="descErr"' : ''}>
      ${errors.desc ? `<p class="msg" id="descErr">${errors.desc}</p>` : ''}
    </div>
    ${cats.length ? `<div class="field"><span class="lbl" id="catLbl">Category</span><div class="catgrid" role="group" aria-labelledby="catLbl">${cats.map(k => `<button type="button" class="catopt" data-action="acat" data-v="${k}" aria-pressed="${A.cat === k}">${catChip(k)}${CATS[k].name.replace(' & utilities', '')}</button>`).join('')}</div></div>` : ''}
    <div class="field"><span class="lbl" id="dayLbl">Date</span><div class="days" role="group" aria-labelledby="dayLbl">${days.map(({ i, d }) => `<button type="button" class="dayopt" data-action="aday" data-v="${i}" aria-pressed="${A.offset === i}" aria-label="${dayLabel(ymd(d))}"><span>${i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short' })}</span><b class="num">${d.getDate()}</b></button>`).join('')}</div></div>
    <button class="btn btn-block" type="submit">${A.type === 'income' ? 'Add income' : 'Add expense'}</button>
  </form>`;
}
function rerenderAdd(errors) {
  const vals = { amt: document.getElementById('amt')?.value, desc: document.getElementById('desc')?.value };
  document.getElementById('sheetBody').innerHTML = addBody(errors, vals);
  document.getElementById('sheetTitle').textContent = A.type === 'income' ? 'Add income' : 'Add expense';
}
function submitAdd() {
  const raw = document.getElementById('amt').value.replace(/[$,\s]/g, '');
  const amt = parseFloat(raw);
  const desc = document.getElementById('desc').value.trim();
  const errors = {};
  if (!raw || isNaN(amt) || amt <= 0) errors.amt = 'Enter an amount greater than $0';
  else if (amt > 1e7) errors.amt = 'That amount looks too large';
  if (!desc) errors.desc = A.type === 'income' ? 'Add where the money came from' : 'Add a merchant name';
  if (Object.keys(errors).length) { rerenderAdd(errors); (errors.amt ? document.getElementById('amt') : document.getElementById('desc')).focus(); return; }
  const d = new Date(TODAY); d.setDate(d.getDate() - A.offset);
  const n = new Date();
  const time = A.offset === 0 ? `${pad(n.getHours())}:${pad(n.getMinutes())}` : '12:00';
  S.tx.push({ id: S.nextId++, date: ymd(d), time, merchant: desc, cat: A.type === 'income' ? 'income' : A.cat, amount: round2(A.type === 'income' ? amt : -amt) });
  save(); closeSheet(); render(); toast(`${A.type === 'income' ? 'Income' : 'Expense'} of ${money(amt)} added`);
}

/* Transaction detail */
function txDetail(id) {
  const t = S.tx.find(x => x.id === id); if (!t) return;
  const c = CATS[t.cat];
  openSheet('Transaction', `<div class="detail-amt">${catChip(t.cat)}<b class="num" style="${t.amount > 0 ? 'color:var(--ok)' : ''}">${signed(t.amount)}</b><span>${esc(t.merchant)}</span></div>
    <dl class="kv"><div><dt>Category</dt><dd>${c.name}</dd></div><div><dt>Date</dt><dd>${parse(t.date).toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}</dd></div><div><dt>Time</dt><dd>${timeLabel(t.time)}</dd></div><div><dt>Account</dt><dd>Checking •••• 4821</dd></div></dl>
    <div class="sheet-actions"><button class="btn btn-danger btn-block" data-action="deltx" data-id="${t.id}">${ico('trash')}Delete transaction</button></div>`);
}

/* Edit budget */
function budgetBody(k, err) {
  const spent = derive().byCat[k].amt;
  return `<form data-form="budget" data-cat="${k}" novalidate>
    <div class="detail-amt" style="padding-bottom:4px">${catChip(k)}<span class="num">${money(spent)} spent in ${MONTH_NAME}</span></div>
    <div class="field" style="margin-bottom:8px"><label class="sr" for="bamt">Monthly limit in dollars</label>
      <div class="amount-wrap"><span>$</span><input id="bamt" class="amount num" inputmode="decimal" value="${S.budgets[k] || ''}" placeholder="0" autocomplete="off" autofocus aria-invalid="${!!err}"></div>
      <div class="amount-line ${err ? 'err' : ''}"></div>
      ${err ? `<p class="msg" style="text-align:center">${err}</p>` : ''}
    </div>
    <div class="stepper">${[-50, -10, 10, 50].map(v => `<button type="button" data-action="bstep" data-v="${v}">${v > 0 ? '+' : '−'}$${Math.abs(v)}</button>`).join('')}</div>
    <div style="margin-top:22px"><button class="btn btn-block" type="submit">Save limit</button></div>
  </form>`;
}

/* CSV */
function exportCsv() {
  const rows = [['Date', 'Time', 'Merchant', 'Category', 'Amount']].concat(sortTx(S.tx).map(t => [t.date, t.time, t.merchant, CATS[t.cat].name, t.amount.toFixed(2)]));
  const csv = rows.map(r => r.map(v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `ledgerly-transactions-${TODAY_S}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${S.tx.length} transactions exported`);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'nav') { closeSheet(); go(el.dataset.view); }
  else if (a === 'add') { A.type = el.dataset.type || 'expense'; A.offset = 0; openSheet(A.type === 'income' ? 'Add income' : 'Add expense', addBody()); }
  else if (a === 'atype') { A.type = el.dataset.v; rerenderAdd(); }
  else if (a === 'acat') { A.cat = el.dataset.v; root.querySelectorAll('.catopt').forEach(b => b.setAttribute('aria-pressed', b === el)); }
  else if (a === 'aday') { A.offset = +el.dataset.v; root.querySelectorAll('.dayopt').forEach(b => b.setAttribute('aria-pressed', b === el)); }
  else if (a === 'close') closeSheet();
  else if (a === 'tx') txDetail(+el.dataset.id);
  else if (a === 'deltx') { const t = S.tx.find(x => x.id === +el.dataset.id); S.tx = S.tx.filter(x => x.id !== +el.dataset.id); save(); closeSheet(); render(); toast(`${t ? t.merchant : 'Transaction'} deleted`); }
  else if (a === 'ftype') { F.type = el.dataset.v; if (F.type === 'income' && F.cat !== 'all' && F.cat !== 'income') F.cat = 'all'; if (F.type === 'expense' && F.cat === 'income') F.cat = 'all'; render(); }
  else if (a === 'fcat') { F.cat = el.dataset.v; if (F.cat === 'income') F.type = 'all'; else if (F.cat !== 'all' && F.type === 'income') F.type = 'all'; render(); }
  else if (a === 'more') { F.limit += 30; render(); }
  else if (a === 'fclear') { F.q = ''; F.type = 'all'; F.cat = 'all'; render(); }
  else if (a === 'ebudget') { const k = el.dataset.cat; openSheet(`${CATS[k].name} limit`, budgetBody(k)); }
  else if (a === 'bstep') { const i = document.getElementById('bamt'); i.value = Math.max(0, (parseFloat(i.value) || 0) + +el.dataset.v); }
  else if (a === 'pref') { const k = el.dataset.k; S.prefs[k] = !S.prefs[k]; el.setAttribute('aria-checked', S.prefs[k]); save(); }
  else if (a === 'export') exportCsv();
  else if (a === 'reset') { if (confirm('Replace your transactions and budgets with the example month?')) { S = seed(); save(); render(); toast('Sample data restored'); } }
  else if (a === 'clear') { if (confirm('Delete all transactions? This can’t be undone.')) { const b = S.budgets; S = { v: 1, opening: 0, nextId: 1, tx: [], budgets: { ...DEFAULT_BUDGETS }, prefs: S.prefs }; save(); render(); toast('All transactions deleted'); } }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'add') submitAdd();
  else if (f === 'budget') {
    const k = e.target.dataset.cat; const v = parseFloat(document.getElementById('bamt').value.replace(/[$,\s]/g, ''));
    if (isNaN(v) || v < 0) { document.getElementById('sheetBody').innerHTML = budgetBody(k, 'Enter a limit of $0 or more'); document.getElementById('bamt').focus(); return; }
    S.budgets[k] = round2(v); save(); closeSheet(); render(); toast(`${CATS[k].name} limit set to ${money(v)}`);
  }
  else if (f === 'topsearch' || f === 'search') { if (view !== 'activity') go('activity'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q' || e.target.id === 'topq') {
    F.q = e.target.value;
    if (view !== 'activity') { view = 'activity'; history.replaceState(null, '', '#activity'); }
    render(e.target.id);
  }
});
document.addEventListener('keydown', e => {
  const sheet = root.querySelector('.sheet.open'); if (!sheet) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== view) { closeSheet(); view = v; render(); } });

render();
</script>
</body>
