<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<title>Pocket — Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — light grey canvas, black balance card and controls, pink / butter / sky / lilac blocks for budget and accounts. */
:root {
  --font: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F4F4F4; --surface: #FFFFFF; --surface-2: #F6F6F6; --line: #EAEAEA;
  --text: #0D0D0D; --text-2: #5F5F5F; --text-3: #8F8F8F;
  --brand: #0D0D0D; --on-brand: #FFFFFF;
  --pink: #FFD6E0; --butter: #FFEDB0; --sky: #CFE8FF; --lilac: #E4DCFF; --lime: #DDF2C4;
  --ok: #17803F; --ok-tint: #E2F4E8; --warn: #9A5B00; --warn-tint: #FFF0D2; --bad: #BF2A2A; --bad-tint: #FDE5E4;
  --r-xs: 8px; --r-sm: 12px; --r-md: 20px; --r-lg: 28px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(20,20,20,.04), 0 1px 1px rgba(20,20,20,.03);
  --sh-2: 0 1px 2px rgba(20,20,20,.04), 0 10px 24px -14px rgba(20,20,20,.16);
  --sh-float: 0 12px 32px -8px rgba(20,20,20,.22);
  --tab-h: 72px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.side { display: none; }
main { padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 16px; }
.topbar .hello { flex: 1; min-width: 0; }
.hello small { display: block; font-size: 14px; color: var(--text-2); font-weight: 500; }
.hello h1 { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
.round { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1);
  transition: transform .15s, background-color .15s; position: relative; }
.round:hover { background: #FAFAFA; } .round:active { transform: scale(.95); }
.round .dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #E2557A; box-shadow: 0 0 0 2px var(--surface); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--pink); overflow: hidden; display: grid; place-items: center; font-weight: 600; flex: none; }
.avatar img { width: 100%; height: 100%; }
.desk-only { display: none !important; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: #6E6E6E; text-decoration: none; min-height: 52px; justify-content: center; border-radius: 12px; }
.tab:hover { color: var(--text-2); }
.tab[aria-current="page"] { color: var(--text); font-weight: 600; }
.tab .ic { width: 22px; height: 22px; }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 8px 18px -6px rgba(0,0,0,.45); transition: transform .15s; }
.tab-add:active { transform: scale(.94); }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Cards ---------- */
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border-radius: var(--r-md); padding: 20px; box-shadow: var(--sh-2); min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-head h2 { font-size: 18px; letter-spacing: -.01em; }
.link { font-size: 14px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px; text-decoration: none; border-radius: 8px; }
.link .ic { width: 16px; height: 16px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Balance card */
.balance { background: var(--brand); color: #fff; border-radius: var(--r-lg); padding: 22px 22px 18px; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; width: 260px; height: 260px; right: -110px; top: -130px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,214,224,.22), transparent); pointer-events: none; }
.balance .lbl { font-size: 14px; color: rgba(255,255,255,.72); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.big { font-size: 36px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; margin-top: 4px; }
.big .c { color: rgba(255,255,255,.55); font-size: 24px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.pill.on-dark { background: rgba(255,255,255,.12); color: #fff; }
.pill.up { background: var(--ok-tint); color: var(--ok); }
.pill.down { background: var(--bad-tint); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.spark { position: relative; height: 72px; margin: 14px -4px 4px; }
.spark svg { width: 100%; height: 100%; }
.spark-x { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.6); }
.flows { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.14); }
.flow { display: flex; align-items: center; gap: 10px; }
.flow + .flow { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.14); }
.flow .fi { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.flow .fi .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.flow small { display: block; font-size: 13px; color: rgba(255,255,255,.72); }
.flow b { font-weight: 600; font-size: 16px; }

/* Accounts */
.accounts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(168px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px;
  margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.accounts::-webkit-scrollbar { display: none; }
.acct { scroll-snap-align: start; border-radius: var(--r-md); padding: 16px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; text-align: left; }
.acct-top { display: flex; justify-content: space-between; align-items: flex-start; }
.acct .chip { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.65); display: grid; place-items: center; }
.acct .mask { font-size: 13px; font-weight: 500; color: rgba(13,13,13,.68); }
.acct .name { font-size: 14px; font-weight: 500; color: rgba(13,13,13,.75); }
.acct .amt { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.acct .sub { font-size: 12px; font-weight: 500; color: rgba(13,13,13,.68); }

/* Budget card */
.budget { background: var(--pink); border-radius: var(--r-md); padding: 20px; }
.budget .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.budget .lbl { font-size: 14px; font-weight: 500; color: rgba(13,13,13,.72); }
.budget .fig { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.budget .fig small { font-size: 16px; font-weight: 500; color: rgba(13,13,13,.68); letter-spacing: 0; }
.bar { height: 10px; border-radius: var(--r-full); background: rgba(13,13,13,.1); overflow: hidden; margin: 16px 0 12px; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--brand); }
.bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: rgba(13,13,13,.55); border-radius: 2px; }
.budget .meta { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: rgba(13,13,13,.75); gap: 12px; }
.budget .meta b { color: var(--text); font-weight: 600; }
.badge-ring { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.6); display: grid; place-items: center; flex: none; }

/* Category breakdown */
.seg { display: flex; gap: 3px; height: 14px; margin-bottom: 18px; }
.seg i { border-radius: 4px; min-width: 4px; }
.seg i:first-child { border-radius: 8px 4px 4px 8px; } .seg i:last-child { border-radius: 4px 8px 8px 4px; }
.cats { display: grid; gap: 4px; }
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; min-height: 52px; width: 100%; text-align: left; border-radius: 12px; padding: 4px; margin: 0 -4px; width: calc(100% + 8px); }
button.cat-row:hover { background: var(--surface-2); }
.cat-row .t { font-size: 15px; font-weight: 500; line-height: 1.3; }
.cat-row .s { font-size: 13px; color: var(--text-2); line-height: 1.3; }
.cat-row .v { text-align: right; font-weight: 600; font-size: 15px; }
.cat-row .v small { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); }
.mini { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.mini i { display: block; height: 100%; border-radius: inherit; }
.chip-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--t); color: var(--k); flex: none; }

/* Transactions */
.tx-group + .tx-group { margin-top: 14px; }
.tx-day { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 0 4px; }
.tx { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; min-height: 60px; width: calc(100% + 8px); margin: 0 -4px; padding: 6px 4px; text-align: left; border-radius: 12px; }
.tx:hover { background: var(--surface-2); }
.tx .t { font-size: 15px; font-weight: 500; line-height: 1.3; }
.tx .s { font-size: 13px; color: var(--text-2); line-height: 1.3; }
.tx .v { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tx .v.in { color: var(--ok); }
.empty { text-align: center; padding: 24px 8px 8px; display: grid; justify-items: center; gap: 6px; }
.empty img { width: 88px; height: 88px; }
.empty b { font-size: 16px; } .empty p { font-size: 14px; color: var(--text-2); max-width: 30ch; }

/* Goal */
.goal { background: var(--lime); border-radius: var(--r-md); padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.goal img { width: 84px; height: 84px; grid-row: span 2; }
.goal .lbl { font-size: 14px; font-weight: 500; color: rgba(13,13,13,.72); }
.goal .fig { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.goal .fig small { font-size: 15px; font-weight: 500; color: rgba(13,13,13,.68); letter-spacing: 0; }
.goal .bar { grid-column: 1 / -1; margin: 6px 0 0; }
.goal .meta { grid-column: 1 / -1; font-size: 14px; font-weight: 500; color: rgba(13,13,13,.75); display: flex; justify-content: space-between; }

/* Budget page */
.page-title { font-size: 24px; letter-spacing: -.02em; }
.ring-wrap { display: grid; grid-template-columns: 132px 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .in b { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.ring .in small { font-size: 12px; color: var(--text-2); font-weight: 500; }
.kv { display: grid; gap: 10px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--text-2); font-weight: 500; }
.kv b { color: var(--text); font-weight: 600; }
.chart { position: relative; height: 200px; margin: 8px 0 0 36px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart .yl { position: absolute; left: -36px; font-size: 12px; color: var(--text-2); transform: translateY(-50%); }
.chart .xl { position: absolute; bottom: -22px; font-size: 12px; color: var(--text-2); transform: translateX(-50%); }
.chart .pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--brand); transform: translate(-50%, -50%); }
.chart .tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); background: var(--brand); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); font-weight: 500; margin-top: 34px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--brand); }
.legend i.dash { background: repeating-linear-gradient(90deg, #A8A8A8 0 4px, transparent 4px 7px); }
.legend i.bud { background: repeating-linear-gradient(90deg, #D6456B 0 4px, transparent 4px 7px); }

/* Activity */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--sh-1); color: var(--text-2); }
.search input { border: 0; outline: 0; background: none; flex: 1; font-size: 16px; color: var(--text); min-width: 0; }
.search:focus-within { box-shadow: 0 0 0 2px var(--brand); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); font-size: 14px; font-weight: 600; box-shadow: var(--sh-1); white-space: nowrap; }
.fchip .ic { width: 16px; height: 16px; }
.fchip:hover { background: #FAFAFA; }
.fchip[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg-ctl { display: grid; grid-template-columns: 1fr 1fr; background: #E9E9E9; border-radius: var(--r-full); padding: 4px; }
.seg-ctl button { height: 38px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
.sum-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sum { border-radius: var(--r-md); padding: 16px; }
.sum small { display: block; font-size: 13px; font-weight: 500; color: rgba(13,13,13,.72); }
.sum b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }

/* Settings */
.prof { display: flex; align-items: center; gap: 14px; }
.prof .avatar { width: 56px; height: 56px; }
.prof b { font-size: 18px; display: block; line-height: 1.3; } .prof span { font-size: 14px; color: var(--text-2); }
.list { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 4px 16px; }
.li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; min-height: 60px; width: 100%; text-align: left; }
.li + .li { border-top: 1px solid var(--line); }
.li .chip-ic { width: 36px; height: 36px; border-radius: 10px; }
.li .chip-ic .ic { width: 18px; height: 18px; }
.li .t { font-size: 15px; font-weight: 500; } .li .s { font-size: 13px; color: var(--text-2); }
.li .val { font-size: 14px; color: var(--text-2); display: flex; align-items: center; gap: 4px; font-weight: 500; }
button.li:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.li.danger .t { color: var(--bad); }
.toggle { width: 48px; height: 28px; border-radius: 14px; background: #D6D6D6; position: relative; transition: background-color .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.group-lbl { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 8px 4px -8px; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(13,13,13,.4); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
  max-height: 92dvh; overflow-y: auto; transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); box-shadow: var(--sh-float); }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #DCDCDC; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -.01em; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 600; }
.input { height: 50px; border-radius: var(--r-sm); border: 1px solid #DDDDDD; background: var(--surface); padding: 0 14px; font-size: 16px; width: 100%; }
.input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,13,13,.1); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.err { font-size: 13px; color: var(--bad); font-weight: 500; min-height: 0; }
.amount-in { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 12px 0 4px; }
.amount-in span { font-size: 32px; font-weight: 600; color: var(--text-3); }
.amount-in input { font-size: 40px; font-weight: 600; letter-spacing: -.02em; border: 0; outline: 0; width: 6ch; text-align: left; background: none; font-variant-numeric: tabular-nums; }
.amount-in input::placeholder { color: #C8C8C8; }
.amount-in:focus-within { }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 6px; border-radius: var(--r-full); background: var(--surface-2); font-size: 14px; font-weight: 600; border: 1px solid transparent; }
.pick button.plain { padding: 0 14px; }
.pick button .mi { width: 28px; height: 28px; border-radius: 50%; background: var(--t); color: var(--k); display: grid; place-items: center; }
.pick button .mi .ic { width: 15px; height: 15px; }
.pick button:hover { border-color: #D4D4D4; }
.pick button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; width: 100%; border-radius: var(--r-full); background: var(--brand); color: #fff; font-weight: 600; font-size: 16px;
  box-shadow: 0 8px 18px -8px rgba(0,0,0,.5); transition: transform .15s, background-color .15s; }
.btn:hover { background: #262626; } .btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface-2); color: var(--text); box-shadow: none; }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
.btn-row { display: grid; gap: 10px; margin-top: 8px; }
.detail-top { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 8px 0 20px; }
.detail-top .chip-ic { width: 56px; height: 56px; border-radius: 18px; }
.detail-top .chip-ic .ic { width: 26px; height: 26px; }
.detail-top b { font-size: 32px; letter-spacing: -.02em; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; background: var(--brand); color: #fff;
  padding: 10px 16px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; z-index: 50; transition: .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Tablet ---------- */
@media (min-width: 720px) {
  main { max-width: 760px; padding-left: 24px; padding-right: 24px; }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .home-grid > .wide { grid-column: 1 / -1; }

function paceChart() {

  draft = { type: 'expense', cat: 'groceries', account: 'card', day: 0 };
  openSheet(head('Add transaction') + `<form id="addForm" novalidate>
    <div class="seg-ctl" role="group" aria-label="Type" style="margin-bottom:8px"><button type="button" aria-pressed="true" data-type="expense">Expense</button><button type="button" aria-pressed="false" data-type="income">Income</button></div>
    <div class="amount-in"><span>$</span><label class="sr" for="fAmt">Amount</label><input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" autofocus></div>
    <p class="err" id="eAmt" style="text-align:center;margin-bottom:12px"></p>
    <div class="field"><label for="fMer">Merchant or payee</label><input class="input" id="fMer" placeholder="e.g. Trader Joe's" autocomplete="off" maxlength="40"><p class="err" id="eMer"></p></div>
    <div class="field" id="catField"><span class="flabel">Category</span><div class="pick" role="group" aria-label="Category">${SPEND_CATS.map(c => `<button type="button" data-pick-cat="${c}" aria-pressed="${c===draft.cat}" style="--t:${CATS[c].t};--k:${CATS[c].k}"><span class="mi">${icon(c)}</span>${CATS[c].short || CATS[c].name}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel">Account</span><div class="pick" role="group" aria-label="Account">${Object.entries(ACCTS).map(([k,a]) => `<button type="button" class="plain" data-pick-acct="${k}" aria-pressed="${k===draft.account}">${a.short} ${a.mask.replace('•• ','')}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel">Date</span><div class="pick" role="group" aria-label="Date">${[0,1,2].map(n => `<button type="button" class="plain" data-pick-day="${n}" aria-pressed="${n===0}">${n===0?'Today':n===1?'Yesterday':fmtShort.format(addDays(TODAY,-2))}</button>`).join('')}</div></div>
    <div class="btn-row"><button class="btn" type="submit">Save transaction</button></div></form>`);
}
function txSheet(id) {
  const t = S.txns.find(x => x.id === id); if (!t) return;
  const c = CATS[t.cat];
  openSheet(head('Transaction') + `<div class="detail-top"><span class="chip-ic" style="--t:${c.t};--k:${c.k}">${icon(t.cat)}</span>
    <b class="num" style="${t.amount>0?'color:var(--ok)':''}">${money(t.amount, { plus: true })}</b><span style="font-size:16px;font-weight:600">${esc(t.merchant)}</span></div>
    <div class="list" style="box-shadow:none;background:var(--surface-2)">
      <div class="li" style="grid-template-columns:1fr auto"><span class="t">Category</span><span class="val">${c.name}</span></div>
      <div class="li" style="grid-template-columns:1fr auto"><span class="t">Account</span><span class="val">${ACCTS[t.account].name} ${ACCTS[t.account].mask}</span></div>
      <div class="li" style="grid-template-columns:1fr auto"><span class="t">Date</span><span class="val">${new Intl.DateTimeFormat('en-US',{ weekday:'long', month:'long', day:'numeric', year:'numeric' }).format(parse(t.date))}</span></div>
    </div>
    <div class="btn-row" style="margin-top:16px"><button class="btn danger" data-delete="${t.id}">${icon('trash')}Delete transaction</button></div>`);
}
function budgetSheet(c) {
  openSheet(head(`${CATS[c].name} budget`) + `<form id="budForm" data-cat="${c}" novalidate>
    <div class="amount-in"><span>$</span><label class="sr" for="fBud">Monthly budget</label><input id="fBud" inputmode="numeric" value="${S.budgets[c]}" autofocus></div>
    <p class="err" id="eBud" style="text-align:center;margin-bottom:12px"></p>
    <div class="pick" style="justify-content:center;margin-bottom:16px">${[-50,-10,10,50].map(n => `<button type="button" class="plain num" data-bump="${n}">${n>0?'+':'−'}$${Math.abs(n)}</button>`).join('')}</div>
    <p style="text-align:center;font-size:14px;color:var(--text-2);margin-bottom:16px" class="num">Spent so far: ${money(byCat(inMonth(CUR))[c], { whole: true })}</p>
    <div class="btn-row"><button class="btn" type="submit">Save budget</button></div></form>`);
}

/* ---------- Events ---------- */
let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
const pressGroup = (btn, attr) => btn.parentElement.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute('aria-pressed', b === btn));

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, a'); if (!el) { if (e.target === scrim) closeSheet(); return; }
  const d = el.dataset;
  if (d.tab && el.tagName === 'A' && location.hash === '#' + d.tab) { e.preventDefault(); tab = d.tab; render(true); }
  if (d.action === 'add') addSheet();
  else if (d.action === 'close') closeSheet();
  else if (d.action === 'notify') toast(budgetStats().left >= 0 ? `On track: ${money(budgetStats().perDay, { whole: true })} a day left to spend` : 'You are over this month’s budget');
  else if (d.action === 'clear-filters') { actCat = 'all'; actQuery = ''; render(); }
  else if (d.action === 'export') {
    const rows = [['Date','Merchant','Category','Account','Amount'], ...sorted().map(t => [t.date, t.merchant, CATS[t.cat].name, ACCTS[t.account].name, t.amount.toFixed(2)])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `pocket-transactions-${iso(TODAY)}.csv`; a.click();
    toast('Transactions exported');
  }
  else if (d.action === 'reset') { if (confirm('Replace all data with the sample month?')) { S = seed(); save(); render(); toast('Sample data restored'); } }
  else if (d.action === 'clear') { if (confirm('Delete all transactions and start fresh? This can’t be undone.')) { const s = seed(); S = { ...s, txns: [], opening: { chk: 0, sav: 0, card: 0 } }; save(); render(); toast('All data cleared'); } }
  else if (d.pref) { S.prefs[d.pref] = !S.prefs[d.pref]; save(); render(); document.querySelector(`[data-pref="${d.pref}"]`)?.focus(); }
  else if (d.tx) txSheet(d.tx);
  else if (d.delete) { S.txns = S.txns.filter(t => t.id !== d.delete); save(); closeSheet(); render(); toast('Transaction deleted'); }
  else if (d.editBudget) budgetSheet(d.editBudget);
  else if (d.month) { actMonth = d.month; actCat = 'all'; render(); document.querySelector(`[data-month="${d.month}"]`)?.focus(); }
  else if (d.cat) { actCat = d.cat; render(); document.querySelector(`[data-cat="${d.cat}"]`)?.focus(); }
  else if (d.type) { draft.type = d.type; pressGroup(el, 'data-type'); document.getElementById('catField').hidden = d.type === 'income'; if (d.type === 'income' && draft.account === 'card') { draft.account = 'chk'; sheet.querySelectorAll('[data-pick-acct]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pickAcct === 'chk')); } }
  else if (d.pickCat) { draft.cat = d.pickCat; pressGroup(el, 'data-pick-cat'); }
  else if (d.pickAcct) { draft.account = d.pickAcct; pressGroup(el, 'data-pick-acct'); }
  else if (d.pickDay) { draft.day = +d.pickDay; pressGroup(el, 'data-pick-day'); }
  else if (d.bump) { const i = document.getElementById('fBud'); i.value = Math.max(0, (parseFloat(i.value) || 0) + +d.bump); }
});
scrim.addEventListener('click', closeSheet);
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'addForm') {
    const amt = parseFloat(document.getElementById('fAmt').value.replace(/[$,\s]/g, '')), mer = document.getElementById('fMer').value.trim();
    const eA = document.getElementById('eAmt'), eM = document.getElementById('eMer');
    eA.textContent = !(amt > 0) ? 'Enter an amount above $0' : amt > 1e6 ? 'That looks too large — check the amount' : '';
    eM.textContent = mer ? '' : 'Add who you paid or who paid you';
    document.getElementById('fAmt').setAttribute('aria-invalid', !!eA.textContent); document.getElementById('fMer').setAttribute('aria-invalid', !!eM.textContent);
    if (eA.textContent) return document.getElementById('fAmt').focus();
    if (eM.textContent) return document.getElementById('fMer').focus();
    const inc = draft.type === 'income';
    S.txns.push({ id: 't' + Date.now(), date: iso(addDays(TODAY, -draft.day)), merchant: mer, cat: inc ? 'income' : draft.cat, amount: +(inc ? amt : -amt).toFixed(2), account: draft.account });
    save(); closeSheet(); render(); toast(inc ? 'Income added' : 'Expense added');
  } else if (e.target.id === 'budForm') {
    const v = Math.round(parseFloat(document.getElementById('fBud').value));
    if (!(v >= 0) || v > 1e6) { document.getElementById('eBud').textContent = 'Enter a whole amount from $0'; return; }
    S.budgets[e.target.dataset.cat] = v; save(); closeSheet(); render(); toast('Budget updated');
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-act-search], [data-global-search]')) {
    actQuery = e.target.value; const pos = e.target.selectionStart, gl = e.target.matches('[data-global-search]');
    if (tab !== 'activity') { tab = 'activity'; history.replaceState(null, '', '#activity'); }
    render();
    const n = document.querySelector(gl && matchMedia('(min-width:1080px)').matches ? '[data-global-search]' : '[data-act-search]');
    if (n) { n.value = actQuery; n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', (e) => {
  if (sheet.hidden) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button, input')].filter(x => !x.closest('[hidden]'));
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]) { e.preventDefault(); f[0].focus(); }
  }
});

save(); render();
})();
</script>
</body>
</html>
