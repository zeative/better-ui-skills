<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady">
<title>Steady · Habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — pale lilac canvas, white cards, violet brand, soft category tints, 3D emoji item icons. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F3F2F8; --surface: #FFFFFF; --surface-2: #F5F4FA; --line: #E9E7F1;
  --text: #16132B; --text-2: #5F5B74; --text-3: #8E8AA3;
  --brand: #5B4CF0; --brand-strong: #4636D9; --brand-tint: #EEECFE; --on-brand: #FFFFFF;
  --ok: #15803D; --ok-tint: #E7F6EC; --warn: #B45309; --bad: #C8282E; --bad-tint: #FDECEC;
  --flame: #E8590C;
  --c-violet: #6D5DFC; --c-blue: #2867D6; --c-green: #1A8F55; --c-orange: #E5681C; --c-pink: #D9437C; --c-teal: #0B8F8F;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(30,24,70,.05), 0 1px 1px rgba(30,24,70,.03);
  --sh-2: 0 1px 2px rgba(30,24,70,.04), 0 8px 24px -12px rgba(30,24,70,.12);
  --sh-float: 0 12px 32px -8px rgba(30,24,70,.22);
  --tabbar-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.emo { display: grid; place-items: center; line-height: 1; }

/* ---------- Shell ---------- */
.app { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px); }
.sidebar, .panel { display: none; }
.screen { display: none; }
.screen.on { display: block; animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; margin-bottom: 16px; }
.top .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.streak-pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: var(--r-full);
  background: var(--surface); box-shadow: var(--sh-2); font-weight: 600; font-size: 15px; }
.streak-pill .emo { width: 22px; height: 22px; font-size: 18px; }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; border-radius: var(--r-md);
  transition: background-color .15s ease-out, transform .1s ease-out; }
.day:not(:disabled):active { transform: scale(.96); }
@media (hover: hover) { .day:not(:disabled):not(.sel):hover { background: var(--surface); } }
.day .dl { font-size: 12px; font-weight: 500; color: var(--text-2); }
.day .ring { --p: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--ring, var(--brand)) calc(var(--p) * 1%), var(--ring-track, #DEDBEA) 0); }
.day .ring::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--ring-fill, var(--canvas)); }
.day .ring span { position: relative; font-size: 14px; font-weight: 600; }
.day.today .ring span { color: var(--brand); }
.day.sel { background: var(--brand); box-shadow: 0 6px 14px -8px rgba(91,76,240,.6); }
.day.sel .dl { color: rgba(255,255,255,.85); }
.day.sel .ring { --ring: #fff; --ring-track: rgba(255,255,255,.28); --ring-fill: var(--brand); }
.day.sel .ring span { color: #fff; }
.day:disabled { cursor: default; }
.day:disabled .dl, .day:disabled .ring span { color: var(--text-3); }

/* ---------- Summary card ---------- */
.summary { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; color: var(--on-brand); margin-bottom: 24px;
  background: radial-gradient(120% 140% at 100% 0%, #7466FF 0%, var(--brand) 45%, var(--brand-strong) 100%);
  box-shadow: 0 14px 28px -18px rgba(70,54,217,.6); }
.summary::before, .summary::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); pointer-events: none; }
.summary::before { width: 260px; height: 260px; right: -90px; top: -120px; }
.summary::after { width: 180px; height: 180px; right: -50px; top: -80px; }
.sum-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.sum-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.85); }
.sum-fig { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.sum-fig small { font-size: 16px; font-weight: 500; color: rgba(255,255,255,.85); letter-spacing: 0; margin-left: 2px; }
.sum-note { font-size: 14px; color: rgba(255,255,255,.9); margin-top: 4px; }
.big-ring { width: 88px; height: 88px; flex: none; position: relative; }
.big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.big-ring circle { fill: none; stroke-width: 9; }
.big-ring .trk { stroke: rgba(255,255,255,.2); }
.big-ring .val { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.big-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.sum-stats { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.18); }
.sum-stats div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.18); }
.sum-stats span { display: block; font-size: 13px; color: rgba(255,255,255,.82); }
.sum-stats strong { font-size: 18px; font-weight: 600; }

/* ---------- Sections, cards, rows ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 12px; min-height: 28px; }
.sec-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.sec-head .sub { font-size: 14px; font-weight: 600; color: var(--text-2); }
.link { color: var(--brand); font-size: 14px; font-weight: 600; padding: 12px 8px; margin: -12px -8px; border-radius: var(--r-xs); }
@media (hover: hover) { .link:hover { color: var(--brand-strong); } }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); }
.card.pad { padding: 20px; }
.stack { display: grid; gap: 10px; margin-bottom: 24px; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-1);
  transition: box-shadow .15s ease-out; }
@media (hover: hover) { .row:hover { box-shadow: var(--sh-2); } }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; border-radius: var(--r-sm); min-height: 48px; }
.chip { --c: var(--c-violet); width: 48px; height: 48px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 24px;
  background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.chip img { width: 30px; height: 30px; }
.chip.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 32px; }
.chip.lg img { width: 40px; height: 40px; }
.chip.sm { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; }
.chip.sm img { width: 24px; height: 24px; }
.row-name { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.row-meta { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--text-2); margin-top: 2px; }
.row-meta .ic { width: 14px; height: 14px; color: var(--flame); stroke-width: 2; }
.row-meta .ic.cold { color: var(--text-3); }
.row-meta .hot { color: var(--text); font-weight: 600; }
.dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.row.muted .row-name { color: var(--text-2); }

.check { --c: var(--brand); width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid #D9D6E6; color: transparent; background: var(--surface);
  transition: background-color .18s ease-out, border-color .18s ease-out, transform .12s ease-out; }
.check .ic { width: 22px; height: 22px; stroke-width: 2.6; }
@media (hover: hover) { .check:not(.on):hover { border-color: var(--c); color: color-mix(in srgb, var(--c) 45%, transparent); } }
.check:active { transform: scale(.92); }
.check.on { background: var(--c); border-color: var(--c); color: #fff; }
.check.pop { animation: pop .32s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }

.chevron { color: var(--text-3); }

/* ---------- Stats ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--sh-1); }
.tile .chip { margin-bottom: 12px; }
.tile .t-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile .t-fig { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; }
.tile .t-fig small { font-size: 14px; font-weight: 500; color: var(--text-2); letter-spacing: 0; margin-left: 3px; }
.tile .t-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; overflow-wrap: anywhere; }

.chart-card { margin-bottom: 16px; }
.c-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.c-head h2 { font-size: 16px; }
.c-head p { font-size: 13px; color: var(--text-2); }
.c-head p strong { color: var(--text); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 150px; align-items: end; position: relative;
  background: repeating-linear-gradient(to top, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); background-size: 100% calc(100% - 52px); background-position: 0 24px; background-repeat: no-repeat; }
.bar { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 6px; }
.bar .v { font-size: 12px; font-weight: 600; color: var(--text-2); min-height: 18px; }
.bar .track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar .b { width: 100%; max-width: 30px; border-radius: 8px; background: #CFC9FB; min-height: 4px; transform-origin: bottom; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.bar.now .b { background: var(--brand); }
.bar.now .v { color: var(--brand); }
.bar .l { font-size: 12px; color: var(--text-2); font-weight: 500; height: 22px; display: grid; place-items: center; }
.bar.now .l { color: var(--text); font-weight: 600; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.heat-wrap { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; }
.heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 11px; color: var(--text-2); grid-row: 2; }
.heat-days span { display: flex; align-items: center; line-height: 1; }
.heat-months { grid-column: 2; display: grid; gap: 4px; font-size: 12px; color: var(--text-2); }
.heat-months span { white-space: nowrap; }
.heat { grid-column: 2; display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(30,24,70,.04); }
.heat i.l1 { background: #DCD8FD; } .heat i.l2 { background: #B3AAFA; } .heat i.l3 { background: #8577F5; } .heat i.l4 { background: var(--brand); }
.heat i.fut { background: transparent; box-shadow: none; }
.heat i.td { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--text); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 12px; color: var(--text-2); margin-top: 12px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }
.legend i.l1 { background: #DCD8FD; } .legend i.l2 { background: #B3AAFA; } .legend i.l3 { background: #8577F5; } .legend i.l4 { background: var(--brand); }
.legend span { margin: 0 4px; }

.list { padding: 6px 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 64px; width: 100%; text-align: left; position: relative; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 68px; right: 16px; height: 1px; background: var(--line); }
button.li { border-radius: 0; transition: background-color .15s ease-out; }
@media (hover: hover) { button.li:hover { background: var(--surface-2); } }
.list > .li:first-child { border-top-left-radius: var(--r-lg); border-top-right-radius: var(--r-lg); }
.list > .li:last-child { border-bottom-left-radius: var(--r-lg); border-bottom-right-radius: var(--r-lg); }
.li-body { flex: 1; min-width: 0; }
.li-title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.li-sub { display: block; font-size: 13px; color: var(--text-2); text-wrap: pretty; }
.li-end { text-align: right; flex: none; }
.streak-n { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 15px; }
.streak-n .ic { width: 16px; height: 16px; color: var(--flame); stroke-width: 2; }
.streak-n.zero { color: var(--text-2); font-weight: 500; }
.streak-n.zero .ic { color: var(--text-3); }
.li .ic-chip { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); flex: none; }
.li .ic-chip.red { background: var(--bad-tint); color: var(--bad); }
.li.danger .li-title { color: var(--bad); }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; margin-bottom: 16px; }
.page-head h1 { font-size: 24px; letter-spacing: -0.02em; }
.page-head p { font-size: 13px; color: var(--text-2); font-weight: 500; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full);
  font-weight: 600; font-size: 15px; background: var(--brand); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(30,24,70,.2), 0 6px 16px -6px rgba(91,76,240,.7);
  transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { background: var(--brand-strong); transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.btn.block { width: 100%; height: 52px; font-size: 16px; }
.btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); } }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.danger:hover { background: #FADADB; } }
.btn.quiet-danger { background: transparent; color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.quiet-danger:hover { background: var(--bad-tint); } }
.btn.sm { height: 40px; padding: 0 14px; font-size: 14px; }
.icon-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text);
  transition: background-color .15s ease-out; flex: none; }
@media (hover: hover) { .icon-btn:hover { background: var(--line); } }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 600px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 8px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 56px; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 500; color: var(--text-2); transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 600; }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: var(--brand);
  box-shadow: 0 10px 20px -8px rgba(91,76,240,.8); transform: translateY(-10px); transition: transform .15s ease-out, background-color .15s ease-out; }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.4; }
.tab-add:active { transform: translateY(-10px) scale(.95); }
@media (hover: hover) { .tab-add:hover { background: var(--brand-strong); } }

/* ---------- Sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(22,19,43,.42); display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s ease-out; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet:focus { outline: none; }
.sheet { width: 100%; max-width: 600px; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface);
  border-radius: 28px 28px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%);
  transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: var(--sh-float); }
.backdrop.open .sheet { transform: none; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -0.01em; }
.field { margin-bottom: 20px; }
.field > label, .field > .lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.input { width: 100%; height: 52px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 0 16px; font-size: 16px;
  transition: border-color .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px rgba(91,76,240,.14); }
.input.err { border-color: var(--bad); }
.err-msg { color: var(--bad); font-size: 13px; margin-top: 6px; font-weight: 500; }
.sugs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px 20px; padding: 2px 20px; }
.sugs::-webkit-scrollbar { display: none; }
.sug { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: var(--r-full); white-space: nowrap;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; transition: background-color .15s ease-out; flex: none; }
.sug img { width: 20px; height: 20px; }
@media (hover: hover) { .sug:hover { background: var(--brand-tint); } }
.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.emoji-opt { aspect-ratio: 1; min-height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 22px;
  transition: background-color .15s ease-out, box-shadow .15s ease-out; }
.emoji-opt img { width: 28px; height: 28px; }
.emoji-opt[aria-checked="true"] { background: var(--brand-tint); box-shadow: inset 0 0 0 2px var(--brand); }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.color-opt { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff;
  box-shadow: 0 0 0 0 var(--surface); transition: box-shadow .15s ease-out; }
.color-opt .ic { width: 20px; height: 20px; stroke-width: 2.6; opacity: 0; }
.color-opt[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.color-opt[aria-checked="true"] .ic { opacity: 1; }

  box-shadow: inset 0 0 0 1px var(--line); }

.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-2); }

.d-head { display: flex; align-items: center; gap: 14px; }

.d-stat strong { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.d-stat strong small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 2px; letter-spacing: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head h3 { font-size: 16px; }

.cal-head .icon-btn { width: 40px; height: 40px; background: transparent; }
@media (hover: hover) { .cal-head .icon-btn:hover:not(:disabled) { background: var(--surface-2); } }
.cal-head .icon-btn:disabled { color: var(--text-3); cursor: default; }

.cal .wd { font-size: 12px; color: var(--text-2); font-weight: 500; padding: 4px 0; }
.cal button, .cal .blank { aspect-ratio: 1; max-height: 48px; width: 100%; border-radius: 12px; font-size: 14px; font-weight: 500; display: grid; place-items: center; }
.cal button { --c: var(--brand); transition: background-color .15s ease-out; }
@media (hover: hover) { .cal button:not(:disabled):not(.done):hover { background: var(--surface-2); } }
.cal button.off { color: var(--text-3); }
.cal button.miss { color: var(--text); }
.cal button.done { background: var(--brand-tint); color: var(--brand-strong); font-weight: 600; }

.cal button { grid-template-rows: 1fr auto; padding-top: 4px; }
.cal button:not(.done)::after { content: ""; height: 4px; margin-top: -8px; }
.cal button.td { box-shadow: inset 0 0 0 1.5px var(--brand); }
.cal button:disabled { color: #C3C0D0; cursor: default; }
.cal-note { font-size: 13px; color: var(--text-2); margin-top: 10px; }
.d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }

/* empty */

.empty img, .empty .emo { width: 112px; height: 112px; margin: 0 auto 16px; font-size: 80px; }

  font-size: 14px; font-weight: 500; box-shadow: var(--sh-float); opacity: 0; pointer-events: none; transition: opacity .2s ease-out, transform .2s ease-out;

/* ---------- Desktop ---------- */

  .backdrop.open .sheet { opacity: 1; }
  .grabber { display: none; }
  .tile .t-fig { font-size: 28px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }

}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; padding: 8px 8px 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 14px -6px rgba(91,76,240,.8); }

.side-nav { display: grid; gap: 4px; }

  color: var(--text-2); transition: background-color .15s ease-out, color .15s ease-out; text-align: left; }
@media (hover: hover) { .side-nav button:hover { background: rgba(255,255,255,.7); color: var(--text); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }

<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Steady</div>
    <nav class="side-nav" aria-label="Main" id="sideNav"></nav>
    <button class="btn" data-action="add"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New habit</button>
  </aside>
  <main class="main" id="main">
    <section class="screen" data-screen="today" aria-labelledby="h-today"></section>
    <section class="screen" data-screen="progress" aria-labelledby="h-progress"></section>
    <section class="screen" data-screen="habits" aria-labelledby="h-habits"></section>
    <section class="screen" data-screen="settings" aria-labelledby="h-settings"></section>
  </main>
  <aside class="panel" id="panel" aria-label="This week"></aside>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-in" id="tabbar"></div>
</nav>

<div class="backdrop" id="backdrop">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" type="button"></button></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ---------- Icons ---------- */
const P = {
  today: '<rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M9 15.5l2 2 4-4"/>',
  progress: '<path d="M3 21h18"/><rect x="5" y="11" width="3.5" height="7" rx="1"/><rect x="10.25" y="5" width="3.5" height="13" rx="1"/><rect x="15.5" y="13.5" width="3.5" height="4.5" rx="1"/>',
  habits: '<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  eraser: '<path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21M22 21H7M5 11l9 9"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const emojiUrl = (e) => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' +
  [...e].map((c) => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e, size = 30) => `<img src="${emojiUrl(e)}" alt="" width="${size}" height="${size}" loading="lazy" decoding="async" data-emo="${esc(e)}">`;
// Fall back to the native emoji if the 3D image can't load (offline etc.)
document.addEventListener('error', (ev) => {
  const t = ev.target;
  if (t.tagName === 'IMG' && t.dataset.emo) t.replaceWith(document.createTextNode(t.dataset.emo));
}, true);

const COLORS = ['violet', 'blue', 'green', 'orange', 'pink', 'teal'];
const EMOJIS = ['💧', '📚', '🏃', '🧘', '🦷', '📝', '🥗', '😴', '🚶', '💪', '📵', '🌱'];
const SUGGEST = [
  ['💧', 'Drink 2L of water', 'blue'], ['📚', 'Read 20 pages', 'orange'], ['🚶', 'Walk 8,000 steps', 'green'],
  ['🧘', 'Meditate 10 min', 'violet'], ['🦷', 'Floss', 'teal'], ['📝', 'Journal', 'pink'], ['😴', 'In bed by 11pm', 'violet'], ['🥗', 'Eat a salad', 'green'],
];
const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LETTER = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];

/* ---------- Dates ---------- */
const pad = (n) => String(n).padStart(2, '0');
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));

/* ---------- Store ---------- */
const STORE = 'steady.v1';
let data;
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.habits)) return s; } catch (e) {}
  return sampleData();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) { toast('Couldn’t save — storage is full or blocked'); } }
const uid = () => Math.random().toString(36).slice(2, 10);

function sampleData() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const t = today();
  const defs = [
    { name: 'Drink 2L of water', emoji: '💧', color: 'blue', days: ALL_DAYS, streak: 23, done: true, p: .86, age: 74 },
    { name: 'Read 20 pages', emoji: '📚', color: 'orange', days: ALL_DAYS, streak: 12, done: true, p: .72, age: 74 },
    { name: 'Morning run', emoji: '🏃', color: 'green', days: [1, 3, 5], streak: 6, done: false, p: .8, age: 74 },
    { name: 'Meditate 10 min', emoji: '🧘', color: 'violet', days: ALL_DAYS, streak: 4, done: false, p: .7, age: 50 },
    { name: 'Floss', emoji: '🦷', color: 'teal', days: ALL_DAYS, streak: 0, done: false, p: .62, age: 32 },
  ];
  const habits = defs.map((d) => {
    const h = { id: uid(), name: d.name, emoji: d.emoji, color: d.color, days: d.days.slice(), created: key(addDays(t, -d.age)), done: {} };
    const sched = [];
    for (let i = 0; i <= d.age; i++) { const day = addDays(t, -i); if (h.days.includes(day.getDay())) sched.push(key(day)); }
    let i = 0;
    if (sched[0] === key(t)) { if (d.done) h.done[sched[0]] = 1; i = 1; }
    let left = d.streak - (d.done && sched[0] === key(t) ? 1 : 0);
    for (; i < sched.length && left > 0; i++, left--) h.done[sched[i]] = 1;
    i++; // the day the streak started after a miss
    for (; i < sched.length; i++) if (rnd() < d.p) h.done[sched[i]] = 1;
    return h;
  });
  return { habits, sample: true };
}

/* ---------- Habit maths ---------- */
const scheduled = (h, d) => h.days.includes(d.getDay()) && key(d) >= h.created;
const isDone = (h, k) => !!h.done[k];

function streakOf(h) {
  const t = today();
  let d = t, n = 0;
  if (scheduled(h, t) && !isDone(h, key(t))) d = addDays(t, -1);
  for (let i = 0; i < 4000; i++, d = addDays(d, -1)) {
    const k = key(d);
    if (k < h.created) break;
    if (!h.days.includes(d.getDay())) continue;
    if (isDone(h, k)) n++; else break;
  }
  return n;
}
function bestOf(h) {
  const t = key(today());
  let d = parse(h.created), run = 0, best = 0;
  for (let i = 0; i < 4000; i++, d = addDays(d, 1)) {
    const k = key(d);
    if (k > t) break;
    if (!h.days.includes(d.getDay())) continue;
    if (isDone(h, k)) { run++; best = Math.max(best, run); } else if (k !== t) run = 0;
  }
  return best;
}
function rangeStats(habits, from, to) {
  let s = 0, done = 0;
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) {
    const k = key(d);
    for (const h of habits) if (scheduled(h, d)) { s++; if (isDone(h, k)) done++; }
  }
  return { s, done, pct: s ? Math.round(done / s * 100) : 0 };
}
const dayStats = (d) => rangeStats(data.habits, d, d);
function schedLabel(days) {
  const s = [...days].sort().join('');
  if (s === '0123456') return 'Every day';
  if (s === '12345') return 'Weekdays';
  if (s === '06') return 'Weekends';
  return WEEK_ORDER.filter((d) => days.includes(d)).map((d) => DOW_SHORT[d]).join(', ');
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- UI state ---------- */
const ui = { tab: 'today', sel: key(today()), pop: null };

/* ---------- Rendering ---------- */
const $ = (s, r = document) => r.querySelector(s);

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function topStreak() {
  let best = null;
  for (const h of data.habits) { const s = streakOf(h); if (!best || s > best.s) best = { h, s }; }
  return best;
}

function rowHTML(h, selKey, sched) {
  const st = streakOf(h), done = isDone(h, selKey), best = bestOf(h);
  const meta = st > 0
    ? `${icon('flame')}<span class="hot num">${plural(st, 'day')}</span>`
    : `${icon('flame', 'cold')}<span>${best > 0 ? `Best ${plural(best, 'day')}` : 'No streak yet'}</span>`;
  return `<div class="row${sched ? '' : ' muted'}">
    <button class="row-main" data-action="detail" data-id="${h.id}" data-f="d-${h.id}" aria-label="${esc(h.name)}, details">
      <span class="chip" style="--c:var(--c-${h.color})">${emo(h.emoji)}</span>
      <span style="min-width:0"><span class="row-name" style="display:block">${esc(h.name)}</span>
      <span class="row-meta">${meta}<i class="dot-sep" aria-hidden="true"></i><span>${schedLabel(h.days)}</span></span></span>
    </button>
    <button class="check${done ? ' on' : ''}${ui.pop === h.id && done ? ' pop' : ''}" data-action="tick" data-id="${h.id}" data-f="t-${h.id}"
      aria-pressed="${done}" aria-label="${esc(h.name)} done">${icon('check')}</button>
  </div>`;
}

function renderToday() {
  const t = today(), tk = key(t), sel = parse(ui.sel), isToday = ui.sel === tk;
  const top = topStreak();
  let html = `<header class="top">
    <div><p class="eyebrow">${fmt(t, { weekday: 'long', day: 'numeric', month: 'long' })}</p><h1 id="h-today">${greeting()}</h1></div>
    ${top && top.s > 0 ? `<span class="streak-pill num" title="Longest current streak: ${esc(top.h.name)}" aria-label="Longest current streak ${top.s} days"><span class="emo">${emo('🔥', 22)}</span>${top.s}</span>` : ''}
  </header>`;

  // week strip
  const mon = mondayOf(t);
  html += `<div class="week" role="group" aria-label="Choose a day">`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = key(d), fut = k > tk, ds = dayStats(d);
    html += `<button class="day${k === tk ? ' today' : ''}${k === ui.sel ? ' sel' : ''}" data-action="day" data-k="${k}" data-f="day-${k}" ${fut ? 'disabled' : ''}
      aria-pressed="${k === ui.sel}" aria-label="${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${fut ? '' : `, ${ds.done} of ${ds.s} done`}">
      <span class="dl">${DOW_LETTER[d.getDay()]}</span>
      <span class="ring" style="--p:${fut ? 0 : ds.pct}"><span class="num">${d.getDate()}</span></span></button>`;
  }
  html += `</div>`;

  if (!data.habits.length) {
    html += `<div class="card empty"><div class="emo" style="margin:0 auto 16px">${emo('🌱', 112)}</div>
      <h2>No habits yet</h2><p>Add a habit you want to keep, then tick it off each day to build a streak.</p>
      <button class="btn" data-action="add">${icon('plus')}Add your first habit</button></div>`;
    return html;
  }

  const ds = dayStats(sel);
  const wk = rangeStats(data.habits, mon, t);
  const C = 2 * Math.PI * 38, off = C * (1 - (ds.s ? ds.done / ds.s : 0));
  const left = ds.s - ds.done;
  const note = !ds.s ? 'Nothing scheduled' : left === 0 ? (isToday ? 'All done for today' : 'All done') : `${plural(left, 'habit')} left${isToday ? ' for today' : ''}`;
  html += `<section class="summary" aria-label="Progress">
    <div class="sum-top">
      <div><p class="sum-label">${isToday ? 'Today' : fmt(sel, { weekday: 'long', day: 'numeric', month: 'short' })}</p>
        <p class="sum-fig num">${ds.done} of ${ds.s}<small>done</small></p>
        <p class="sum-note">${note}</p></div>
      <div class="big-ring" aria-hidden="true"><svg viewBox="0 0 88 88"><circle class="trk" cx="44" cy="44" r="38"/>
        <circle class="val" cx="44" cy="44" r="38" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><b class="num">${ds.pct}%</b></div>
    </div>
    <div class="sum-stats">
      <div><span>This week</span><strong class="num">${wk.pct}%</strong></div>
      <div><span>Best streak</span><strong class="num">${top ? plural(Math.max(...data.habits.map(bestOf)), 'day') : '—'}</strong></div>
    </div></section>`;

  const on = data.habits.filter((h) => scheduled(h, sel) || (sel >= parse(h.created) && false));
  const off2 = data.habits.filter((h) => !on.includes(h));
  html += `<div class="sec-head"><h2>${isToday ? 'Today’s habits' : 'Habits'}</h2><button class="link" data-action="tab" data-tab="habits">Edit</button></div>`;
  if (on.length) html += `<div class="stack">${on.map((h) => rowHTML(h, ui.sel, true)).join('')}</div>`;
  else html += `<div class="card rest"><span class="chip sm" style="--c:var(--c-violet)">${emo('😴', 24)}</span><p><strong>Rest day</strong>Nothing is scheduled for ${DOW_SHORT[sel.getDay()]}.</p></div>`;
  if (off2.length) {
    html += `<div class="sec-head"><h2 class="sub">Not scheduled ${isToday ? 'today' : 'this day'}</h2></div>
      <div class="stack">${off2.map((h) => rowHTML(h, ui.sel, false)).join('')}</div>`;
  }
  return html;
}

function chartCard() {
  const t = today();
  let bars = '', sum = 0, n = 0;
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i), s = dayStats(d);
    if (s.s) { sum += s.pct; n++; }
    bars += `<div class="bar${i === 0 ? ' now' : ''}" title="${fmt(d, { weekday: 'long' })}: ${s.done} of ${s.s}"><span class="v num">${i === 0 && s.s ? s.pct + '%' : ''}</span>
      <span class="track"><span class="b" style="height:${Math.max(s.pct, 3)}%"></span></span><span class="l">${i === 0 ? 'Today' : DOW_LETTER[d.getDay()]}</span></div>`;
  }
  const avg = n ? Math.round(sum / n) : 0;
  return `<section class="card pad chart-card" aria-label="Completion over the last 7 days, average ${avg}%">
    <div class="c-head"><h2>Last 7 days</h2><p>Average <strong class="num">${avg}%</strong></p></div>
    <div class="bars">${bars}</div></section>`;
}

function heatCard(weeks = 16) {
  const t = today(), tk = key(t), start = addDays(mondayOf(t), -(weeks - 1) * 7);
  let cells = '', months = '', perfect = 0;
  for (let w = 0; w < weeks; w++) {
    let label = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i), k = key(d);
      if (d.getDate() === 1 || (w === 0 && i === 0)) label = fmt(d, { month: 'short' });
      if (k > tk) { cells += `<i class="fut"></i>`; continue; }
      const s = dayStats(d);
      const lv = !s.s || !s.done ? 0 : s.pct < 34 ? 1 : s.pct < 67 ? 2 : s.pct < 100 ? 3 : 4;
      if (lv === 4) perfect++;
      cells += `<i class="l${lv}${k === tk ? ' td' : ''}" title="${fmt(d, { day: 'numeric', month: 'short' })}: ${s.done} of ${s.s}"></i>`;
    }
    months += `<span>${w === 0 && label && addDays(start, 0).getDate() > 14 ? '' : label}</span>`;
  }
  return `<section class="card pad chart-card" aria-label="Daily completion for the last ${weeks} weeks, ${perfect} perfect days">
    <div class="c-head"><h2>Last ${weeks} weeks</h2><p><strong class="num">${perfect}</strong> perfect days</p></div>
    <div class="heat-wrap">
      <div class="heat-months" style="grid-template-columns:repeat(${weeks},1fr)" aria-hidden="true">${months}</div>
      <div class="heat-days" aria-hidden="true"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span></span></div>
      <div class="heat" aria-hidden="true">${cells}</div>
    </div>
    <div class="legend" aria-hidden="true">Less<span></span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span></span>More</div>
  </section>`;
}

function streakList() {
  const items = data.habits.map((h) => ({ h, s: streakOf(h), b: bestOf(h) })).sort((a, b) => b.s - a.s || b.b - a.b);
  return `<section class="card list" aria-label="Streaks">${items.map(({ h, s, b }) => `
    <button class="li" data-action="detail" data-id="${h.id}" data-f="s-${h.id}">
      <span class="chip sm" style="--c:var(--c-${h.color})">${emo(h.emoji, 24)}</span>
      <span class="li-body"><span class="li-title" style="display:block">${esc(h.name)}</span><span class="li-sub num">Best ${plural(b, 'day')}</span></span>
      <span class="li-end"><span class="streak-n num${s ? '' : ' zero'}">${icon('flame')}${s}</span></span>
    </button>`).join('')}</section>`;
}

function renderProgress() {
  let html = `<header class="page-head"><div><p>Your streaks and history</p><h1 id="h-progress">Progress</h1></div></header>`;

  let perfect = 0;

  html += `<div class="tiles">

  return html;
}

function renderPanel() {
  return chartCard() + heatCard(14) + `<div class="sec-head" style="margin-top:24px"><h2>Streaks</h2></div>` + streakList();
}

function renderNav() {
  const tabs = [['today', 'Today'], ['progress', 'Progress'], ['habits', 'Habits'], ['settings', 'Settings']];
  const tb = (t) => `<button class="tab" data-action="tab" data-tab="${t[0]}" ${ui.tab === t[0] ? 'aria-current="page"' : ''}>${icon(t[0])}${t[1]}</button>`;
  $('#tabbar').innerHTML = tb(tabs[0]) + tb(tabs[1]) +

function render() {
  const f = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  if (ui.sel > key(today())) ui.sel = key(today());
  renderNav();
  const R = { today: renderToday, progress: renderProgress, habits: renderHabits, settings: renderSettings };
  document.querySelectorAll('.screen').forEach((s) => {
    const on = s.dataset.screen === ui.tab;
    s.classList.toggle('on', on);

  });
  const withPanel = ui.tab === 'today' && data.habits.length > 0;
  $('#app').classList.toggle('with-panel', withPanel);
  $('#panel').innerHTML = withPanel ? renderPanel() : '';
  ui.pop = null;
  if (f) { const el = document.querySelector(`.screen.on [data-f="${f}"]`); if (el) el.focus({ preventScroll: true }); }

/* ---------- Sheet ---------- */
let lastFocus = null, sheetCtx = null;
const backdrop = $('#backdrop'), sheet = $('#sheet');
function openSheet(html, ctx) {
  const wasOpen = backdrop.classList.contains('open');
  if (!wasOpen) lastFocus = document.activeElement;
  sheetCtx = ctx || null;
  sheet.innerHTML = `<div class="grabber" aria-hidden="true"></div>` + html;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!wasOpen) sheet.scrollTop = 0;
  requestAnimationFrame(() => {
    const first = sheet.querySelector('[autofocus]');
    if (first) first.focus({ preventScroll: true });
    else if (!wasOpen) sheet.focus({ preventScroll: true });
  });
}
function closeSheet() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
  sheetCtx = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeSheet(); });
document.addEventListener('keydown', (e) => {
  if (!backdrop.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button:not(:disabled), input')];
    if (!f.length) return;
    const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});

function formSheet(h) {
  const isNew = !h;
  const f = sheetCtx && sheetCtx.form ? sheetCtx.form : {
    id: h ? h.id : null, name: h ? h.name : '', emoji: h ? h.emoji : '💧', color: h ? h.color : 'violet', days: h ? h.days.slice() : ALL_DAYS.slice(), err: '',
  };
  const s = [...f.days].sort().join('');
  const mode = s === '0123456' ? 'all' : s === '12345' ? 'week' : 'custom';
  openSheet(`
    <div class="sheet-head"><h2 id="sheetTitle">${isNew ? 'New habit' : 'Edit habit'}</h2><button class="icon-btn" data-action="close" aria-label="Close">${icon('x')}</button></div>
    ${isNew ? `<div class="sugs" role="group" aria-label="Suggestions">${SUGGEST.map((x, i) => `<button class="sug" type="button" data-action="sug" data-i="${i}">${emo(x[0], 20)}${esc(x[1])}</button>`).join('')}</div>` : ''}
    <form id="habitForm" novalidate>
      <div class="field"><label for="fName">Name</label>
        <input class="input${f.err ? ' err' : ''}" id="fName" name="name" maxlength="40" autocomplete="off" placeholder="e.g. Stretch for 5 minutes" value="${esc(f.name)}" ${f.err ? 'aria-invalid="true" aria-describedby="fErr"' : ''} ${isNew && matchMedia('(hover: hover)').matches ? 'autofocus' : ''}>
        ${f.err ? `<p class="err-msg" id="fErr">${f.err}</p>` : ''}</div>
      <div class="field"><span class="lbl" id="lEmoji">Icon</span>
        <div class="emoji-grid" role="radiogroup" aria-labelledby="lEmoji">${EMOJIS.map((e) => `<button type="button" class="emoji-opt" role="radio" aria-checked="${e === f.emoji}" aria-label="${e}" data-action="f-emoji" data-v="${e}">${emo(e, 28)}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl" id="lColor">Colour</span>
        <div class="colors" role="radiogroup" aria-labelledby="lColor">${COLORS.map((c) => `<button type="button" class="color-opt" role="radio" aria-checked="${c === f.color}" aria-label="${c}" style="--c:var(--c-${c})" data-action="f-color" data-v="${c}">${icon('check')}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl" id="lRepeat">Repeat</span>
        <div class="seg" role="radiogroup" aria-labelledby="lRepeat">
          <button type="button" role="radio" aria-checked="${mode === 'all'}" data-action="f-mode" data-v="all">Every day</button>
          <button type="button" role="radio" aria-checked="${mode === 'week'}" data-action="f-mode" data-v="week">Weekdays</button>
          <button type="button" role="radio" aria-checked="${mode === 'custom'}" data-action="f-mode" data-v="custom">Custom</button></div>
        <div class="dows" role="group" aria-label="Days">${WEEK_ORDER.map((d) => `<button type="button" class="dow" aria-pressed="${f.days.includes(d)}" aria-label="${DOW_SHORT[d]}" data-action="f-dow" data-v="${d}">${DOW_LETTER[d]}</button>`).join('')}</div></div>
      <button class="btn block" type="submit">${isNew ? 'Add habit' : 'Save changes'}</button>
    </form>`, { form: f, kind: 'form', habit: h });
  $('#habitForm').addEventListener('submit', (e) => { e.preventDefault(); submitForm(); });
  $('#fName').addEventListener('input', (e) => { f.name = e.target.value; });
}
function rerenderForm() {
  const ctx = sheetCtx, st = sheet.scrollTop;
  const active = document.activeElement;
  const sel = active && active.dataset ? `[data-action="${active.dataset.action}"][data-v="${active.dataset.v}"]` : null;
  formSheet(ctx.habit);
  sheet.scrollTop = st;
  if (sel) { const el = sheet.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
}
function submitForm() {
  const f = sheetCtx.form;
  f.name = $('#fName').value.trim();
  if (!f.name) { f.err = 'Give your habit a name.'; rerenderForm(); $('#fName').focus(); return; }
  if (!f.days.length) { f.err = ''; toast('Pick at least one day'); return; }
  if (f.id) {
    const h = data.habits.find((x) => x.id === f.id);
    Object.assign(h, { name: f.name, emoji: f.emoji, color: f.color, days: f.days.slice() });
    save(); render(); detailSheet(h); toast('Changes saved');
  } else {
    const h = { id: uid(), name: f.name, emoji: f.emoji, color: f.color, days: f.days.slice(), created: key(today()), done: {} };
    data.habits.push(h); save();
    ui.tab = 'today'; ui.sel = key(today());
    closeSheet(); render(); toast(`Added “${f.name}”`);
  }
}

function detailSheet(h, month) {
  const t = today(), tk = key(t);
  const m = month || (sheetCtx && sheetCtx.kind === 'detail' && sheetCtx.habit.id === h.id ? sheetCtx.month : new Date(t.getFullYear(), t.getMonth(), 1));
  const st = streakOf(h), best = bestOf(h), r = rangeStats([h], addDays(t, -29), t);
  const first = new Date(m.getFullYear(), m.getMonth(), 1), daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const createdMonth = parse(h.created); createdMonth.setDate(1);
  const canPrev = first > new Date(t.getFullYear() - 2, t.getMonth(), 1);
  const canNext = first < new Date(t.getFullYear(), t.getMonth(), 1);
  let cells = WEEK_ORDER.map((d) => `<span class="wd" aria-hidden="true">${DOW_LETTER[d]}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += `<span class="blank"></span>`;
  let monthDone = 0;
  for (let i = 1; i <= daysIn; i++) {
    const d = new Date(m.getFullYear(), m.getMonth(), i), k = key(d), fut = k > tk, dn = isDone(h, k);
    if (dn) monthDone++;
    const cls = [dn ? 'done' : (h.days.includes(d.getDay()) && k >= h.created ? 'miss' : 'off'), k === tk ? 'td' : ''].join(' ');
    cells += `<button class="num ${cls}" data-action="cal" data-k="${k}" ${fut ? 'disabled' : ''} aria-pressed="${dn}"
      aria-label="${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${dn ? ', done' : ''}">${i}</button>`;
  }
  openSheet(`
    <div class="sheet-head"><div class="d-head"><span class="chip lg" style="--c:var(--c-${h.color})">${emo(h.emoji, 40)}</span>
      <div><h2 id="sheetTitle">${esc(h.name)}</h2><p>${schedLabel(h.days)}</p></div></div>
      <button class="icon-btn" data-action="close" aria-label="Close">${icon('x')}</button></div>
    <div class="d-stats">
      <div class="d-stat"><span>Current streak</span><strong class="num">${st}<small>${st === 1 ? 'day' : 'days'}</small></strong></div>
      <div class="d-stat"><span>Best streak</span><strong class="num">${best}<small>${best === 1 ? 'day' : 'days'}</small></strong></div>
      <div class="d-stat"><span>Last 30 days</span><strong class="num">${r.pct}%</strong></div>
    </div>
    <div class="cal-head"><h3 aria-live="polite">${fmt(m, { month: 'long', year: 'numeric' })}</h3><div>
      <button class="icon-btn" data-action="cal-prev" aria-label="Previous month" ${canPrev ? '' : 'disabled'}>${icon('left')}</button>
      <button class="icon-btn" data-action="cal-next" aria-label="Next month" ${canNext ? '' : 'disabled'}>${icon('right')}</button></div></div>
    <div class="cal" role="group" aria-label="Days done">${cells}</div>
    <p class="cal-note num">Done ${plural(monthDone, 'time')} this month · tap a day to change it</p>
    <div class="d-actions">
      <button class="btn ghost" data-action="edit">${icon('pencil')}Edit</button>
      <button class="btn quiet-danger" data-action="delete">${icon('trash')}Delete habit</button>
    </div>`, { kind: 'detail', habit: h, month: m });
}

/* ---------- Toast ---------- */
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg;
  $('#toastAct').textContent = undo ? 'Undo' : '';
  toastUndo = undo || null;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('show'); toastUndo = null; }, undo ? 6000 : 2600);
}
$('#toastAct').addEventListener('click', () => { if (toastUndo) toastUndo(); toastUndo = null; $('#toast').classList.remove('show'); });

/* ---------- Actions ---------- */
function setTab(tab) {
  ui.tab = tab; render();
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  const H = () => data.habits.find((x) => x.id === b.dataset.id);
  switch (a) {
    case 'tab': setTab(b.dataset.tab); break;
    case 'day': ui.sel = b.dataset.k; render(); break;
    case 'tick': {
      const h = H(); const k = ui.sel;
      if (h.done[k]) delete h.done[k]; else { h.done[k] = 1; ui.pop = h.id; if (k < h.created) h.created = k; }
      save(); render();
      const ds = dayStats(parse(k));
      if (h.done[k] && ds.s && ds.done === ds.s) toast(k === key(today()) ? 'All habits done for today' : 'All habits done for this day');
      break;
    }
    case 'detail': detailSheet(H()); break;
    case 'close': closeSheet(); break;
    case 'add': formSheet(null); break;
    case 'sug': {
      const x = SUGGEST[+b.dataset.i], f = sheetCtx.form;
      f.emoji = x[0]; f.name = x[1]; f.color = x[2]; f.err = ''; rerenderForm(); $('#fName').focus(); break;
    }
    case 'f-emoji': sheetCtx.form.emoji = b.dataset.v; rerenderForm(); break;
    case 'f-color': sheetCtx.form.color = b.dataset.v; rerenderForm(); break;
    case 'f-mode': {
      const v = b.dataset.v, f = sheetCtx.form;
      if (v === 'all') f.days = ALL_DAYS.slice();
      else if (v === 'week') f.days = [1, 2, 3, 4, 5];
      else if ([...f.days].sort().join('') === '0123456') f.days = [1, 3, 5];
      rerenderForm(); break;
    }
    case 'f-dow': {
      const d = +b.dataset.v, f = sheetCtx.form;
      f.days = f.days.includes(d) ? f.days.filter((x) => x !== d) : [...f.days, d];
      rerenderForm(); break;
    }
    case 'cal': {
      const h = sheetCtx.habit, k = b.dataset.k;
      if (h.done[k]) delete h.done[k]; else { h.done[k] = 1; if (k < h.created) h.created = k; }
      save(); render(); detailSheet(h);
      const el = sheet.querySelector(`[data-k="${k}"]`); if (el) el.focus({ preventScroll: true });
      break;
    }
    case 'cal-prev': case 'cal-next': {
      const m = sheetCtx.month;
      detailSheet(sheetCtx.habit, new Date(m.getFullYear(), m.getMonth() + (a === 'cal-prev' ? -1 : 1), 1));
      const el = sheet.querySelector(`[data-action="${a}"]:not(:disabled)`); if (el) el.focus({ preventScroll: true });
      break;
    }
    case 'edit': formSheet(sheetCtx.habit); break;
    case 'delete': {
      const h = sheetCtx.habit, idx = data.habits.indexOf(h);
      data.habits.splice(idx, 1); save(); closeSheet(); render();
      toast(`Deleted “${h.name}”`, () => { data.habits.splice(idx, 0, h); save(); render(); });
      break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = `steady-backup-${key(today())}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Backup downloaded'); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'clear-sample': {
      const prev = data; data = { habits: [], sample: false }; save(); render();
      toast('Sample data cleared', () => { data = prev; save(); render(); }); break;
    }
    case 'load-sample': {
      const prev = data; data = sampleData(); save(); render();
      toast('Sample data loaded', () => { data = prev; save(); render(); }); break;
    }
    case 'wipe': {
      const prev = data; data = { habits: [], sample: false }; save(); render();
      toast('All data deleted', () => { data = prev; save(); render(); }); break;
    }
  }
});
$('#importFile').addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.habits) || !d.habits.every((h) => h.id && h.name && Array.isArray(h.days) && h.done)) throw 0;
      const prev = data; data = { habits: d.habits, sample: !!d.sample }; save(); render();
      toast(`Imported ${plural(d.habits.length, 'habit')}`, () => { data = prev; save(); render(); });
    } catch (err) { toast('That file isn’t a Steady backup'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

// Roll over to a new day if the app stays open past midnight
let lastDay = key(today());
const checkDay = () => { const k = key(today()); if (k !== lastDay) { if (ui.sel === lastDay) ui.sel = k; lastDay = k; render(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

data = load();
save();
render();
})();
</script>
</body>
</html>
