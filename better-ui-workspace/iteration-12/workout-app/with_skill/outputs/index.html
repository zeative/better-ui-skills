<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Repday · Workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: dark with one neon — near-black canvas, graphite cards, lime accent on the summary card, ticks and active states. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #0E0F12; --surface: #18191E; --surface-2: #22242A; --surface-3: #2B2E35;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --text: #F3F4F6; --text-2: #A3A7B0; --text-3: #868A94;
  --brand: #CDF54E; --brand-ink: #11130A; --brand-soft: rgba(205,245,78,.14); --brand-text: #D6F870;
  --ok: #5EE0A0; --warn: #F5C451; --bad: #FF7A6B;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-full: 999px;
  --sh-1: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.3);
  --sh-float: inset 0 1px 0 rgba(255,255,255,.06), 0 16px 40px -10px rgba(0,0,0,.7);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--canvas); }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.main { padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }
.side { display: none; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding: 6px 8px env(safe-area-inset-bottom);
  background: rgba(20,21,25,.94); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-2);
  border-radius: var(--r-sm); transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand-text); }
.tab:active { transform: scale(.96); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; min-height: 48px; }
.top .eyebrow { font-size: 14px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #E9DDFE; flex: none; display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--canvas), 0 0 0 3px var(--line-2); color: #3B2470; font-weight: 600; font-size: 14px; }
.avatar-btn img { width: 100%; height: 100%; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
.round-btn:hover { background: var(--surface-2); }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 9px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.day .dl { font-size: 12px; color: var(--text-2); font-weight: 500; }
.day .dn { font-size: 16px; font-weight: 600; }
.day .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.day.done .dot { background: var(--brand); }
.day.rest .dot { background: var(--surface-3); }
.day.today { background: var(--text); border-color: var(--text); color: var(--canvas); }
.day.today .dl { color: #4A4D55; }
.day.today .dot { background: var(--canvas); }

/* ---------- Summary card ---------- */
.hero { position: relative; overflow: hidden; background: var(--brand); color: var(--brand-ink); border-radius: var(--r-lg); padding: 20px; margin-bottom: 24px;
  box-shadow: 0 18px 40px -18px rgba(205,245,78,.45); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.35), transparent); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; position: relative; z-index: 1; }
.hero .label { font-size: 14px; font-weight: 500; color: #3A4214; display: flex; align-items: center; gap: 6px; }
.hero h2 { font-size: 32px; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 6px; font-weight: 700; }
.hero .sub { font-size: 14px; color: #3A4214; font-weight: 500; }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring .rv b { font-size: 20px; font-weight: 700; }
.ring .rv span { font-size: 12px; font-weight: 500; color: #3A4214; }
.ring .arc { transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.hero-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(17,19,10,.14); }
.hero-stats div + div { border-left: 1px solid rgba(17,19,10,.14); padding-left: 14px; }
.hero-stats dt { font-size: 12px; color: #3A4214; font-weight: 500; }
.hero-stats dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
.hero-stats small { font-size: 13px; font-weight: 500; color: #3A4214; }

/* ---------- Sections ---------- */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 12px; gap: 12px; }
.sec-head h2, .sec-head h3 { font-size: 18px; letter-spacing: -.01em; }
.sec-head .meta { font-size: 14px; color: var(--text-2); }
.link { font-size: 14px; font-weight: 500; color: var(--brand-text); display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px; margin: -12px -4px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); }

/* ---------- Exercise list ---------- */
.ex-list { display: grid; gap: 10px; margin-bottom: 20px; }
.ex { padding: 6px 6px 14px; transition: border-color .2s ease-out; }
.ex.complete { border-color: rgba(205,245,78,.22); }
.ex-head { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 8px; border-radius: var(--r-md); }
.ex-head:hover { background: rgba(255,255,255,.03); }
.chip { --c: #888; width: 44px; height: 44px; border-radius: var(--r-sm); flex: none; display: grid; place-items: center; font-size: 22px;
  background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
.chip img { width: 28px; height: 28px; }
.chip.lg { width: 52px; height: 52px; border-radius: var(--r-md); }
.chip.lg img { width: 34px; height: 34px; }
.ex-body { flex: 1; min-width: 0; }
.ex-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-meta { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.ex-count { font-size: 14px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.ex.complete .ex-count { color: var(--brand-text); }
.ex-count .ic { color: var(--text-3); }
.sets { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 8px 0 64px; }
.set { position: relative; min-width: 56px; height: 52px; padding: 0 10px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
  transition: background-color .15s ease-out, border-color .15s ease-out, transform .15s ease-out; }
.set b { font-size: 16px; font-weight: 600; }
.set span { font-size: 12px; color: var(--text-2); font-weight: 500; }
@media (hover: hover) { .set:hover { border-color: rgba(205,245,78,.5); } }
.set:active { transform: scale(.94); }
.set[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.set[aria-pressed="true"] span { color: #3A4214; }
.set .tick { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand-ink); color: var(--brand);
  display: none; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.set .tick .ic { width: 12px; height: 12px; stroke-width: 3; }
.set[aria-pressed="true"] .tick { display: grid; animation: pop .25s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: var(--r-full);
  font-size: 16px; font-weight: 600; background: var(--brand); color: var(--brand-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 24px -12px rgba(205,245,78,.6); transition: transform .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn:disabled { background: var(--surface-2); color: var(--text-3); box-shadow: none; cursor: not-allowed; transform: none; }
.btn.sm { height: 44px; padding: 0 16px; font-size: 14px; }
.finish-note { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 10px; }

/* ---------- Rest day / empty ---------- */
.empty { text-align: center; padding: 32px 20px 28px; }
.empty img { width: 104px; height: 104px; margin: 0 auto 12px; }
.empty .em { font-size: 72px; line-height: 1; margin-bottom: 12px; }
.empty h2 { font-size: 20px; margin-bottom: 6px; }
.empty p { color: var(--text-2); font-size: 14px; margin: 0 auto 20px; max-width: 32ch; }

/* ---------- Progress ---------- */
.wk-hero .days { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 18px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #3A4214; }
.wd i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed rgba(17,19,10,.35); }
.wd.done i { background: var(--brand-ink); border: 0; color: var(--brand); }
.wd.rest i { border: 0; background: rgba(17,19,10,.08); }
.wd.today i { border: 2px solid var(--brand-ink); }
.wd .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.goalbar { position: relative; z-index: 1; height: 8px; border-radius: var(--r-full); background: rgba(17,19,10,.14); margin-top: 16px; overflow: hidden; }
.goalbar b { display: block; height: 100%; border-radius: var(--r-full); background: var(--brand-ink); transition: width .5s cubic-bezier(.2,.8,.2,1); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.tile { padding: 16px; }
.tile .chip { width: 36px; height: 36px; border-radius: var(--r-sm); color: var(--c); margin-bottom: 12px; }
.tile .chip .ic { width: 18px; height: 18px; }
.tile .tl { font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile .tv { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; margin-top: 2px; white-space: nowrap; }
.tile .tv small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 3px 8px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; }
.pill.up { background: rgba(94,224,160,.12); color: var(--ok); }
.pill.down { background: rgba(255,122,107,.12); color: var(--bad); }
.pill.flat { background: var(--surface-2); color: var(--text-2); }

.chart-card { padding: 18px 16px 14px; margin-bottom: 24px; }
.chart-top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 18px; }
.chart-top h3 { font-size: 16px; }
.chart-top .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.chart-top .big small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.legend { display: flex; gap: 12px; white-space: nowrap; font-size: 12px; color: var(--text-2); font-weight: 500; padding-top: 4px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.chart { position: relative; height: 168px; display: grid; grid-template-columns: 30px 1fr; }
.yax { position: relative; font-size: 12px; color: var(--text-3); }
.yax span { position: absolute; left: 0; transform: translateY(-50%); }
.plot { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; border-bottom: 1px solid var(--line-2); }
.grid-l { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-2); }
.col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.bar { width: 100%; max-width: 30px; border-radius: var(--r-xs) var(--r-xs) 4px 4px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.bar.this { background: #3D4150; z-index: 1; }
.bar.this.cur { background: var(--brand); }
.col .bv { position: absolute; z-index: 2; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
.xax { display: grid; grid-template-columns: 30px repeat(7, 1fr); column-gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-2); text-align: center; font-weight: 500; }
.xax span:first-child { grid-column: 2; }
.xax .cur { color: var(--brand-text); font-weight: 600; }
.chart-empty { position: absolute; inset: 0 0 0 30px; display: grid; place-items: center; font-size: 14px; color: var(--text-2); }

.rows { padding: 4px 0; margin-bottom: 24px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 68px; }
.row + .row { border-top: 1px solid var(--line); }
.row .rb { flex: 1; min-width: 0; }
.row .rt { font-size: 16px; font-weight: 600; line-height: 1.3; }
.row .rs { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.row .rr { text-align: right; font-size: 16px; font-weight: 600; white-space: nowrap; }
.row .rr small { margin-left: 3px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.rows .empty-row { padding: 22px 16px; text-align: center; color: var(--text-2); font-size: 14px; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; background: var(--brand-soft); color: var(--brand-text); margin-left: 6px; vertical-align: 2px; }

/* ---------- Plan ---------- */
.plan { display: grid; gap: 10px; margin-bottom: 24px; }
.plan details { overflow: hidden; }
.plan summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 72px; cursor: pointer; border-radius: var(--r-lg); }
.plan summary::-webkit-details-marker { display: none; }
.plan summary:hover { background: rgba(255,255,255,.02); }
.plan .dbox { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; place-content: center; text-align: center; line-height: 1.1; flex: none; }
.plan .dbox b { font-size: 16px; }
.plan .dbox span { font-size: 12px; color: var(--text-2); font-weight: 500; }
.plan .is-today .dbox { background: var(--brand); color: var(--brand-ink); }
.plan .is-today .dbox span { color: #3A4214; }
.plan .chev { color: var(--text-3); transition: transform .2s ease-out; }
.plan details[open] .chev { transform: rotate(90deg); }
.plan .rest summary { cursor: default; }
.plan ol { margin: 0; padding: 4px 14px 14px; list-style: none; display: grid; gap: 2px; }
.plan li { display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 2px; font-size: 14px; }
.plan li .chip { width: 36px; height: 36px; border-radius: var(--r-sm); }
.plan li .chip img { width: 22px; height: 22px; }
.plan li b { font-weight: 600; font-size: 14px; flex: 1; }
.plan li span { color: var(--text-2); }

/* ---------- Profile ---------- */
.profile { display: flex; align-items: center; gap: 16px; padding: 18px; margin-bottom: 24px; }
.profile .avatar-btn { width: 64px; height: 64px; font-size: 20px; }
.profile h2 { font-size: 20px; }
.profile p { font-size: 14px; color: var(--text-2); }
.group-title { font-size: 14px; color: var(--text-2); font-weight: 500; margin: 0 4px 8px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 68px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .chip { width: 36px; height: 36px; border-radius: var(--r-sm); color: var(--c); }
.set-row .chip .ic { width: 18px; height: 18px; }
.set-row .rb { flex: 1; min-width: 0; }
.set-row .rt { font-size: 16px; font-weight: 500; }
.set-row .rs { font-size: 13px; color: var(--text-2); }
.row-btn { width: 100%; text-align: left; }
.row-btn:hover { background: rgba(255,255,255,.025); }
.row-btn.danger .rt { color: var(--bad); }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; border: 1px solid var(--line); }
.stepper button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
.stepper button:hover { background: var(--surface-3); }
.stepper button:disabled { color: var(--text-3); background: none; cursor: not-allowed; }
.stepper output { min-width: 44px; text-align: center; font-weight: 600; font-size: 16px; }
.stepper output small { font-size: 12px; color: var(--text-2); font-weight: 500; margin-left: 1px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; border: 1px solid var(--line); }
.seg button { height: 40px; padding: 0 12px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); min-width: 48px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--canvas); }
.foot-note { font-size: 13px; color: var(--text-2); text-align: center; margin: 4px 0 24px; }

/* ---------- Rest timer ---------- */
.timer { position: fixed; z-index: 25; left: 50%; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(calc(100% - 32px), 420px); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: var(--r-full);
  background: #2A2C33; border: 1px solid var(--line-2); box-shadow: var(--sh-float); overflow: hidden; animation: rise .3s cubic-bezier(.2,.8,.2,1); }
.timer[hidden] { display: none; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.timer .tl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.timer .tl .ic { color: var(--brand); }
.timer .tl span { font-size: 14px; color: var(--text-2); }
.timer .tl b { font-size: 18px; font-weight: 700; }
.timer .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); transition: width 1s linear; }
.timer .tbtn { height: 40px; padding: 0 14px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; background: var(--surface-3); }
.timer .tbtn:hover { background: #3A3D45; }
.timer .tbtn.pri { background: var(--brand); color: var(--brand-ink); }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease-out; }
.scrim[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 600px; max-height: 88dvh; overflow: auto; background: var(--surface); border-radius: 26px 26px 0 0; border: 1px solid var(--line-2); border-bottom: 0;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: var(--sh-float); animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet:focus { outline: none; }
.grab { width: 40px; height: 4px; border-radius: var(--r-full); background: var(--surface-3); margin: 0 auto 14px; }
.sh-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.sh-head .rb { flex: 1; min-width: 0; }
.sh-head h2 { font-size: 20px; letter-spacing: -.01em; line-height: 1.3; }
.sh-head p { font-size: 14px; color: var(--text-2); }
.sh-sets { display: grid; gap: 8px; margin-bottom: 16px; }
.sh-set { display: grid; grid-template-columns: 44px 1fr 1fr; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.sh-set.is-done { border-color: rgba(205,245,78,.3); background: color-mix(in srgb, var(--brand) 7%, var(--surface-2)); }
.sh-set .sn { font-size: 14px; font-weight: 600; color: var(--text-2); }
.sh-set .fld { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sh-set .fld > span { font-size: 12px; color: var(--text-2); font-weight: 500; }
.sh-set .stepper { padding: 2px; background: var(--surface); }
.sh-set .stepper button { width: 40px; height: 40px; }
.sh-set .stepper output { min-width: 38px; font-size: 16px; }
.sh-set .bw { height: 40px; display: grid; place-items: center; font-size: 14px; color: var(--text-2); }
.tick-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-2); color: var(--text-3); transition: background-color .15s, transform .15s; }
.tick-btn:hover { border-color: var(--brand); color: var(--brand); }
.tick-btn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.tick-btn:active { transform: scale(.92); }
.tick-btn .ic { stroke-width: 2.6; display: none; }
.tick-btn .tn { font-size: 16px; font-weight: 600; color: var(--text); }
.tick-btn[aria-pressed="true"] .ic { display: block; }
.tick-btn[aria-pressed="true"] .tn { display: none; }
.sh-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.sh-tip { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
.sh-tip .ic { color: var(--brand); }
.sh-tip b { color: var(--text); font-weight: 600; }

.today-grid > .col-side { display: none; }
.side-h { font-size: 18px; margin-bottom: 12px; }

/* ---------- Tablet ---------- */
@media (min-width: 720px) {
  .main { padding-top: 32px; }
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: 26px; border-bottom: 1px solid var(--line-2); max-width: 520px; }
  .sheet:focus { outline: none; }
.grab { display: none; }
}

/* ---------- Desktop ---------- */
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .tabbar { display: none; }
  .app::before { content: ""; position: fixed; inset: 0 auto 0 0; width: 248px; background: #121317; border-right: 1px solid var(--line); z-index: 0; }
  .side { position: sticky; z-index: 1; display: flex; flex-direction: column; top: 0; height: 100dvh; padding: 24px 16px; }
  .two-col.prog-row { align-items: stretch; margin-bottom: 24px; }
  .prog-row > div { display: flex; flex-direction: column; }
  .prog-row .hero, .prog-row .chart-card { flex: 1; margin: 0; }
  .prog-row .hero { display: flex; flex-direction: column; }
  .prog-row .hero .goalbar { margin-top: auto; }
  .prog-row .hero .hero-top { margin-bottom: 20px; }
  .prog-tiles .tiles { grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; padding: 0 8px; margin-bottom: 28px; }
  .brand i { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
  .brand i .ic { stroke-width: 2.4; }
  .side nav { display: grid; gap: 4px; }
  .side .nav { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: var(--r-sm); font-size: 15px; font-weight: 500; color: var(--text-2); }
  .side .nav:hover { background: var(--surface); color: var(--text); }
  .side .nav[aria-current="page"] { background: var(--surface-2); color: var(--text); }
  .side .nav[aria-current="page"] .ic { color: var(--brand); }
  .side .nav .cnt { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
  .me .avatar-btn { width: 40px; height: 40px; box-shadow: none; }
  .me b { font-size: 14px; display: block; }
  .me span { font-size: 13px; color: var(--text-2); }
  .main { max-width: none; margin: 0; padding: 36px 40px 64px; }
  .main > * { max-width: 1080px; }
  .top .avatar-btn { display: none; }
  .today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
  .today-grid > .col-side { display: block; position: sticky; top: 36px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .narrow { max-width: 640px; }
  .timer { left: calc(50% + 124px); bottom: 24px; }
  .col-side .tiles { margin-bottom: 16px; }
  .col-side .chart-card { margin-bottom: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand"><i><svg class="ic"><use href="#i-dumbbell"/></svg></i>Repday</div>
    <nav id="sidenav" aria-label="Main"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div class="timer" id="timer" role="status" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
</svg>

<script>
/* ================= Data ================= */
const G = {
  chest:     { e: '🏋️', c: '#FF9A5C' },
  shoulders: { e: '🤸', c: '#7DB7FF' },
  arms:      { e: '💪', c: '#F5C451' },
  back:      { e: '🧗', c: '#B794F6' },
  legs:      { e: '🦵', c: '#5EE0A0' },
  cardio:    { e: '🚣', c: '#4FD1C5' },
  core:      { e: '🧘', c: '#F687B3' },
};
const X = (name, g, sets, reps, w, rest = 90, unit = 'reps') => ({ name, g, sets, reps, w, rest, unit });
const T = {
  full: { name: 'Full body', focus: 'Squat, press, row', ex: [
    X('Front squat', 'legs', 3, 6, 60, 120), X('Push press', 'shoulders', 3, 6, 40, 120), X('Barbell row', 'back', 3, 8, 55),
    X('Hip thrust', 'legs', 3, 10, 80), X('Plank', 'core', 3, 45, 0, 60, 's') ] },
  pull: { name: 'Pull day', focus: 'Back and biceps', ex: [
    X('Deadlift', 'back', 3, 5, 100, 150), X('Pull-ups', 'back', 3, 8, 0, 120), X('Seated cable row', 'back', 3, 10, 50),
    X('Face pull', 'shoulders', 3, 15, 20, 60), X('Dumbbell curl', 'arms', 3, 12, 12, 60) ] },
  legs: { name: 'Leg day', focus: 'Quads, hamstrings, calves', ex: [
    X('Back squat', 'legs', 4, 6, 80, 150), X('Romanian deadlift', 'legs', 3, 8, 70, 120), X('Walking lunge', 'legs', 3, 12, 16),
    X('Lying leg curl', 'legs', 3, 12, 35, 60), X('Standing calf raise', 'legs', 3, 15, 40, 60) ] },
  upper: { name: 'Upper body', focus: 'Chest, back, shoulders', ex: [
    X('Incline bench press', 'chest', 4, 8, 50, 120), X('Chin-ups', 'back', 3, 8, 0, 120), X('Arnold press', 'shoulders', 3, 10, 16),
    X('Chest-supported row', 'back', 3, 10, 22), X('Hammer curl', 'arms', 3, 12, 14, 60) ] },
  push: { name: 'Push day', focus: 'Chest, shoulders, triceps', ex: [
    X('Bench press', 'chest', 4, 8, 60, 120), X('Overhead press', 'shoulders', 3, 8, 37.5, 120), X('Incline dumbbell press', 'chest', 3, 10, 22),
    X('Cable lateral raise', 'shoulders', 3, 15, 7.5, 60), X('Triceps pushdown', 'arms', 3, 12, 25, 60), X('Rowing machine', 'cardio', 1, 10, 0, 0, 'min') ] },
};
const PLAN = ['full', 'pull', 'legs', null, 'upper', null, 'push']; // Mon..Sun
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const KEY = 'repday.v1';

/* ================= Helpers ================= */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dow = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = new Date(); today.setHours(0, 0, 0, 0);
const TK = dk(today);
const weekDates = Array.from({ length: 7 }, (_, i) => addDays(today, i - dow(today)));
const fmt = n => Math.round(n).toLocaleString('en-GB');
const kg = w => (Number.isInteger(w) ? w : w.toFixed(1)) + '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const e3d = e => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' + [...e].map(c => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e, size = 28) => `<img src="${e3d(e)}" alt="" width="${size}" height="${size}" onerror="this.replaceWith(document.createTextNode('${e}'))">`;
const chip = (g, cls = '') => `<span class="chip ${cls}" style="--c:${G[g].c}" aria-hidden="true">${emo(G[g].e)}</span>`;
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h ${pad(Math.round(m % 60))} min` : `${Math.round(m)} min`;
const unitLabel = ex => ex.unit === 'min' ? 'min' : ex.unit === 's' ? 'sec' : 'reps';
const exMeta = ex => {
  const load = ex.unit !== 'reps' ? '' : ex.w ? ` · ${kg(ex.w)} kg` : ' · Bodyweight';
  if (ex.unit === 'min') return `${ex.reps} min steady`;
  if (ex.unit === 's') return `${ex.sets} × ${ex.reps} sec hold`;
  return `${ex.sets} × ${ex.reps}${load}`;
};
const tplSets = tid => T[tid].ex.reduce((a, e) => a + e.sets, 0);
const tplMins = tid => Math.round((tplSets(tid) * 2.8 + 6) / 5) * 5;

function newSession(tid) {
  return { tid, sets: T[tid].ex.map(e => Array.from({ length: e.sets }, () => ({ r: e.reps, w: e.w, d: false }))), done: false, min: null };
}
function sVol(s) { let v = 0; s.sets.forEach((arr, i) => { if (T[s.tid].ex[i].unit === 'reps') arr.forEach(x => { if (x.d) v += x.r * x.w; }); }); return v; }
function sDone(s) { return s.sets.reduce((a, arr) => a + arr.filter(x => x.d).length, 0); }
function sTotal(s) { return s.sets.reduce((a, arr) => a + arr.length, 0); }
function sMins(s) { return s.min ?? Math.round(sDone(s) * 2.8); }

/* ================= State ================= */
let state;
function seed() {
  const s = { name: 'Alex', goal: 5, rest: 'plan', sessions: {}, override: {}, lastWeek: [], streak: 3, sample: true };
  weekDates.forEach((d, i) => {
    const tid = PLAN[i];
    // last week: same plan, slightly lighter loads
    if (tid) {
      const ses = newSession(tid); ses.sets.forEach(a => a.forEach(x => (x.d = true)));
      s.lastWeek[i] = { vol: Math.round(sVol(ses) * (0.9 + (i % 3) * 0.03) / 10) * 10, min: tplMins(tid) - 3 + (i % 2) * 6 };
    } else s.lastWeek[i] = { vol: 0, min: 0 };
    if (!tid || d >= today) return;
    const ses = newSession(tid);
    ses.sets.forEach((arr, ei) => arr.forEach((x, si) => { x.d = true; if (si === arr.length - 1 && ei % 2 === 1 && T[tid].ex[ei].unit === 'reps') x.r -= 1; }));
    if (tid === 'legs') ses.sets[0][3].w = 82.5;
    ses.done = true; ses.min = tplMins(tid) + (i % 2 ? 4 : -2);
    s.sessions[dk(d)] = ses;
  });
  const tt = PLAN[dow(today)];
  if (tt) {
    const ses = newSession(tt);
    ses.sets[0].forEach(x => (x.d = true));
    if (ses.sets[1]) { ses.sets[1][0].d = true; ses.sets[1][1].d = true; }
    s.sessions[TK] = ses;
  }
  return s;
}
function load() {
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && raw.sessions) return raw; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
state = load(); save();

const ui = { tab: 'today', sheet: null, confirm: null };
const todayTid = () => state.override[TK] || PLAN[dow(today)];
function todaySession() {
  const tid = todayTid(); if (!tid) return null;
  if (!state.sessions[TK] || state.sessions[TK].tid !== tid) { state.sessions[TK] = newSession(tid); save(); }
  return state.sessions[TK];
}

/* ================= Week stats ================= */
function weekStats() {
  const ti = dow(today);
  const days = weekDates.map((d, i) => {
    const s = state.sessions[dk(d)];
    const planned = !!(PLAN[i] || (i === ti && state.override[TK]));
    let st = 'upcoming';
    if (s && s.done) st = 'done';
    else if (i === ti) st = 'today';
    else if (!planned) st = 'rest';
    else if (d < today) st = 'missed';
    return { d, i, s, st, vol: s ? sVol(s) : 0, min: s ? (s.done || i === ti ? sMins(s) : 0) : 0, sets: s ? sDone(s) : 0, planned };
  });
  const done = days.filter(x => x.st === 'done').length;
  const vol = days.reduce((a, x) => a + x.vol, 0);
  const min = days.reduce((a, x) => a + x.min, 0);
  const sets = days.reduce((a, x) => a + x.sets, 0);
  const cmp = days.filter(x => x.i < ti || (x.i === ti && x.s && x.s.done));
  const n = cmp.length ? Math.max(...cmp.map(x => x.i)) + 1 : 0;
  const cVol = cmp.reduce((a, x) => a + x.vol, 0), cMin = cmp.reduce((a, x) => a + x.min, 0);
  const lw2 = state.lastWeek && state.lastWeek.length ? state.lastWeek.slice(0, n) : null;
  return { days, done, vol, min, sets, cVol, cMin, lwVol: lw2 ? lw2.reduce((a, x) => a + x.vol, 0) : 0, lwMin: lw2 ? lw2.reduce((a, x) => a + x.min, 0) : 0, ti };
}
function delta(cur, prev, label = 'vs last week') {
  if (!prev) return `<span class="pill flat">No data last week</span>`;
  const p = Math.round((cur - prev) / prev * 100);
  if (p === 0) return `<span class="pill flat">Same as last week</span>`;
  return `<span class="pill ${p > 0 ? 'up' : 'down'}">${ic(p > 0 ? 'up' : 'down', 'sm')}${Math.abs(p)}% ${label}</span>`;
}

/* ================= Views ================= */
const TABS = [['today', 'Today', 'home'], ['progress', 'Progress', 'chart'], ['plan', 'Plan', 'cal'], ['profile', 'Profile', 'user']];
function avatar(cls = 'avatar-btn', attrs = '') {
  const n = esc(state.name || 'You');
  return `<span class="${cls}" ${attrs}><img src="https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(n)}&backgroundColor=e9ddfe" alt="" width="44" height="44" onerror="this.replaceWith(document.createTextNode('${n.slice(0, 1).toUpperCase()}'))"></span>`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
const longDate = d => d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const rangeLabel = () => { const a = weekDates[0], b = weekDates[6]; const m = { month: 'short' };
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${b.toLocaleDateString('en-GB', m)}` : `${a.getDate()} ${a.toLocaleDateString('en-GB', m)} – ${b.getDate()} ${b.toLocaleDateString('en-GB', m)}`; };

function weekStrip(ws) {
  return `<div class="week" role="list" aria-label="This week">${ws.days.map(x => {
    const lbl = { done: 'workout done', today: 'today', rest: 'rest day', upcoming: 'planned', missed: 'no workout logged' }[x.st];
    return `<div role="listitem" class="day ${x.st}" aria-label="${DAYS[x.i]} ${x.d.getDate()}, ${lbl}"><span class="dl">${DAYS[x.i][0]}</span><span class="dn num">${x.d.getDate()}</span><span class="dot"></span></div>`;
  }).join('')}</div>`;
}

function ringSvg(p) {
  const C = 2 * Math.PI * 38;
  return `<svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="38" fill="none" stroke="rgba(17,19,10,.14)" stroke-width="8"/>
    <circle class="arc" cx="44" cy="44" r="38" fill="none" stroke="#11130A" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg>`;
}

function viewToday() {
  const ws = weekStats();
  const s = todaySession();
  const head = `<header class="top"><div><p class="eyebrow">${longDate(today)}</p><h1>${greeting()}, ${esc(state.name || 'there')}</h1></div>
    ${avatarBtn()}</header>`;
  let body;
  if (!s) {
    const next = nextPlanned();
    body = `${weekStrip(ws)}<section class="card empty">${emo('😴', 104)}<h2>Rest day</h2>
      <p>Nothing scheduled today. Next up is ${T[next.tid].name.toLowerCase()} on ${DAYS[next.i]}.</p>
      <button class="btn" data-act="train" data-tid="${next.tid}">${ic('dumbbell')}Train ${esc(T[next.tid].name.toLowerCase())} today</button></section>`;
  } else {
    const t = T[s.tid], done = sDone(s), total = sTotal(s), p = done / total;
    const exDone = s.sets.filter(a => a.every(x => x.d)).length;
    const left = total - done;
    const remainingMin = Math.max(0, Math.round(left * 2.8));
    const hero = `<section class="hero" aria-label="Today's workout summary">
      <div class="hero-top"><div><p class="label">${ic(s.done ? 'check' : 'dumbbell', 'sm')}${s.done ? 'Workout saved' : "Today's workout"}</p>
        <h2>${esc(t.name)}</h2><p class="sub">${esc(t.focus)}</p></div>
        <div class="ring" role="img" aria-label="${done} of ${total} sets done">${ringSvg(p)}<div class="rv"><b class="num">${done}/${total}</b><span>sets</span></div></div></div>
      <dl class="hero-stats">
        <div><dt>Volume</dt><dd class="num">${fmt(sVol(s))} <small>kg</small></dd></div>
        <div><dt>Exercises</dt><dd class="num">${exDone} <small>of ${t.ex.length}</small></dd></div>
        <div><dt>${s.done ? 'Duration' : 'Time left'}</dt><dd class="num">${s.done ? sMins(s) : '≈ ' + remainingMin} <small>min</small></dd></div>
      </dl></section>`;
    const list = t.ex.map((ex, ei) => {
      const arr = s.sets[ei], n = arr.filter(x => x.d).length, all = n === arr.length;
      return `<article class="card ex ${all ? 'complete' : ''}">
        <button class="ex-head" data-open="${ei}" data-fid="open-${ei}" aria-label="${esc(ex.name)}, ${n} of ${arr.length} sets done. Edit sets">
          ${chip(ex.g)}<span class="ex-body"><span class="ex-name" style="display:block">${esc(ex.name)}</span><span class="ex-meta" style="display:block">${exMeta(ex)}</span></span>
          <span class="ex-count num">${all ? ic('check', 'sm') + 'Done' : `${n}/${arr.length}`}${ic('chev', 'sm')}</span></button>
        <div class="sets">${arr.map((x, si) => setBtn(ex, x, ei, si)).join('')}</div></article>`;
    }).join('');
    const foot = s.done
      ? `<button class="btn ghost block" data-act="resume">${ic('undo')}Reopen workout</button><p class="finish-note">Saved ${done} sets · ${sMins(s)} min. Counted in your week.</p>`
      : `<button class="btn block" data-act="finish" ${done ? '' : 'disabled'}>${ic('check')}Finish workout</button>
         <p class="finish-note">${left ? `${left} set${left > 1 ? 's' : ''} left · about ${remainingMin} min` : 'All sets done. Nice work.'}</p>`;
    body = `${weekStrip(ws)}${hero}<div class="sec-head"><h2>Exercises</h2><span class="meta num">${exDone} of ${t.ex.length} done</span></div>
      <div class="ex-list">${list}</div>${foot}`;
  }
  const side = `<aside class="col-side" aria-label="This week"><h2 class="side-h">This week <span class="meta" style="font-size:14px;color:var(--text-2);font-weight:500;margin-left:6px">${rangeLabel()}</span></h2>
    ${weekCard(ws, false)}${tiles(ws)}${chartCard(ws)}</aside>`;
  return `${head}<div class="today-grid"><div class="col-main">${body}</div>${side}</div>`;
}
function setBtn(ex, x, ei, si) {
  const big = ex.unit === 'reps' ? x.r : x.r;
  const small = ex.unit === 'reps' ? (x.w ? `${kg(x.w)} kg` : 'BW') : unitLabel(ex);
  const label = `Set ${si + 1}: ${x.r} ${unitLabel(ex)}${ex.unit === 'reps' && x.w ? ` at ${kg(x.w)} kg` : ''}`;
  return `<button class="set" data-set="${ei}:${si}" data-fid="set-${ei}-${si}" aria-pressed="${x.d}" aria-label="${label}">
    <b class="num">${big}</b><span class="num">${small}</span><i class="tick" aria-hidden="true">${ic('check')}</i></button>`;
}
function nextPlanned() {
  for (let k = 1; k <= 7; k++) { const i = (dow(today) + k) % 7; if (PLAN[i]) return { i, tid: PLAN[i] }; }
  return { i: 0, tid: 'full' };
}

function weekCard(ws, hero = true) {
  const goal = state.goal, left = Math.max(0, goal - ws.done);
  const days = ws.days.map(x => `<div class="wd ${x.st}"><i>${x.st === 'done' ? ic('check') : ''}</i><span>${DAYS[x.i].slice(0, 1)}</span></div>`).join('');
  return `<section class="hero wk-hero" aria-label="Weekly goal: ${ws.done} of ${goal} workouts" style="${hero ? '' : 'margin-bottom:16px'}">
    <div class="hero-top"><div><p class="label">${ic('target', 'sm')}Weekly goal</p>
      <h2 class="num">${ws.done} of ${goal} <span style="font-size:18px;font-weight:600">workouts</span></h2>
      <p class="sub">${left ? `${left} more to reach your goal` : 'Goal reached this week'}</p></div></div>
    <div class="goalbar" aria-hidden="true"><b style="width:${Math.min(100, ws.done / goal * 100)}%"></b></div>

}
function tiles(ws) {
  const lw = state.lastWeek && state.lastWeek.length;
  return `<div class="tiles">
    <div class="card tile"><span class="chip" style="--c:#CDF54E">${ic('bolt')}</span><p class="tl">Volume</p><p class="tv num">${fmt(ws.vol)} <small>kg</small></p>${delta(ws.cVol, lw ? ws.lwVol : 0)}</div>
    <div class="card tile"><span class="chip" style="--c:#7DB7FF">${ic('clock')}</span><p class="tl">Time trained</p><p class="tv num">${ws.min >= 60 ? `${Math.floor(ws.min / 60)}<small>h</small> ${Math.round(ws.min % 60)}<small>m</small>` : `${ws.min} <small>min</small>`}</p>${delta(ws.cMin, lw ? ws.lwMin : 0)}</div>
    <div class="card tile"><span class="chip" style="--c:#B794F6">${ic('layers')}</span><p class="tl">Sets done</p><p class="tv num">${ws.sets}</p><span class="pill flat">${ws.days.filter(x => x.sets).length} training days</span></div>

  </div>`;
}
function chartCard(ws) {
  const lw = (state.lastWeek && state.lastWeek.length) ? state.lastWeek : null;
  const vals = ws.days.map(x => x.vol);
  const max = Math.max(1000, ...vals);
  const step = max > 8000 ? 4000 : max > 4000 ? 2000 : 1000;
  const top = Math.ceil(max / step) * step;
  const ticks = []; for (let v = step; v <= top; v += step) ticks.push(v);
  const k = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : v;
  const cols = ws.days.map((x, i) => {
    const h = x.vol / top * 100;
    return `<div class="col">
      ${x.vol ? `<div class="bar this ${i === ws.ti ? 'cur' : ''}" style="height:${h}%"></div><span class="bv num" style="bottom:calc(${h}% + 4px)">${k(x.vol)}</span>` : ''}</div>`;
  }).join('');
  const any = vals.some(Boolean);
  const best = ws.days.reduce((a, x) => x.vol > a.vol ? x : a, ws.days[0]);
  return `<section class="card chart-card" aria-label="Volume by day. ${any ? `Highest on ${DAYS[best.i]} with ${fmt(best.vol)} kg.` : 'No sessions yet this week.'}">
    <div class="chart-top"><div><h3>Volume by day</h3><p class="big num">${fmt(ws.vol)} <small>kg this week</small></p></div>
      <div class="legend"><span><i style="background:#3D4150"></i>Earlier</span><span><i style="background:var(--brand)"></i>Today</span></div></div>
    <div class="chart" aria-hidden="true"><div class="yax">${ticks.map(v => `<span style="top:${100 - v / top * 100}%">${k(v)}</span>`).join('')}</div>
      <div class="plot">${ticks.map(v => `<span class="grid-l" style="top:${100 - v / top * 100}%"></span>`).join('')}${cols}</div>
      ${any ? '' : '<div class="chart-empty">No sessions yet this week</div>'}</div>
    <div class="xax" aria-hidden="true">${ws.days.map(x => `<span class="${x.i === ws.ti ? 'cur' : ''}">${DAYS[x.i].slice(0, 3)}</span>`).join('')}</div></section>`;
}
function topLifts(ws) {
  const best = {};
  ws.days.forEach(x => { if (!x.s) return; x.s.sets.forEach((arr, ei) => { const ex = T[x.s.tid].ex[ei]; if (ex.unit !== 'reps' || !ex.w) return;
    arr.forEach(st => { if (!st.d) return; const b = best[ex.name]; if (!b || st.w > b.w || (st.w === b.w && st.r > b.r)) best[ex.name] = { ex, w: st.w, r: st.r, i: x.i }; }); }); });
  const list = Object.values(best).sort((a, b) => b.w - a.w).slice(0, 5);
  return `<div class="sec-head"><h2>Top lifts</h2><span class="meta">Heaviest set this week</span></div>
    <div class="card rows">${list.length ? list.map(b => `<div class="row">${chip(b.ex.g)}<div class="rb"><p class="rt">${esc(b.ex.name)}</p><p class="rs">${DAYS[b.i]} · ${b.r} reps</p></div><p class="rr num">${kg(b.w)} kg</p></div>`).join('')
      : '<p class="empty-row">Tick off weighted sets to see your top lifts.</p>'}</div>`;
}
function sessionsList(ws) {

      <button class="set-row row-btn danger" data-act="clear" data-fid="clear"><span class="chip" style="--c:#FF7A6B">${ic('trash')}</span><span class="rb"><span class="rt" style="display:block">${ui.confirm === 'clear' ? 'Tap again to clear everything' : (state.sample ? 'Clear sample data' : 'Start fresh')}</span><span class="rs" style="display:block">Remove all workouts and history</span></span>${ic('chev', 'sm')}</button>
    </div>

/* ================= Sheet ================= */
function renderSheet() {
  const sh = document.getElementById('sheet'), scrim = document.getElementById('scrim');
  if (ui.sheet == null) { scrim.hidden = true; return; }
  const s = todaySession(); const ei = ui.sheet; const ex = T[s.tid].ex[ei]; const arr = s.sets[ei];
  const restS = ex.rest ? `${Math.floor(ex.rest / 60)}:${pad(ex.rest % 60)}` : 'none';
  const rows = arr.map((x, si) => {
    const wField = ex.unit === 'reps'
      ? (x.w ? `<div class="fld"><span>kg</span><div class="stepper"><button data-adj="${si}:w:-1" data-fid="w-${si}-m" aria-label="Set ${si + 1}: less weight">${ic('minus', 'sm')}</button><output class="num">${kg(x.w)}</output><button data-adj="${si}:w:1" data-fid="w-${si}-p" aria-label="Set ${si + 1}: more weight">${ic('plus', 'sm')}</button></div></div>`
        : `<div class="fld"><span>Load</span><div class="bw">Bodyweight</div></div>`)
      : `<div class="fld"><span>Type</span><div class="bw">${ex.unit === 'min' ? 'Steady pace' : 'Hold'}</div></div>`;
    return `<div class="sh-set ${x.d ? 'is-done' : ''}"><button class="tick-btn" data-set="${ei}:${si}" data-fid="tick-${si}" aria-pressed="${x.d}" aria-label="Set ${si + 1} done">${ic('check')}<span class="tn num" aria-hidden="true">${si + 1}</span></button>${wField}
      <div class="fld"><span>${unitLabel(ex)}</span><div class="stepper"><button data-adj="${si}:r:-1" data-fid="r-${si}-m" aria-label="Set ${si + 1}: fewer ${unitLabel(ex)}" ${x.r <= 1 ? 'disabled' : ''}>${ic('minus', 'sm')}</button><output class="num">${x.r}</output><button data-adj="${si}:r:1" data-fid="r-${si}-p" aria-label="Set ${si + 1}: more ${unitLabel(ex)}">${ic('plus', 'sm')}</button></div></div></div>`;
  }).join('');
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div>
    <div class="sh-head">${chip(ex.g, 'lg')}<div class="rb"><h2 id="sh-title">${esc(ex.name)}</h2><p>${exMeta(ex)} · ${arr.filter(x => x.d).length} of ${arr.length} done</p></div>
      <button class="round-btn" data-act="close" data-fid="close" aria-label="Close">${ic('x')}</button></div>
    ${ex.rest ? `<div class="sh-tip">${ic('timer')}<span>Rest <b class="num">${restS}</b> between sets${ex.unit === 'reps' && ex.w ? ` · weight changes in steps of ${ex.w >= 20 ? '2.5' : '1'} kg` : ''}</span></div>` : ''}
    <div class="sh-sets">${rows}</div>
    <div class="sh-actions"><button class="btn ghost" data-act="add-set" data-fid="add-set">${ic('plus')}Add set</button><button class="btn" data-act="close" data-fid="done">Done</button></div>`;
  if (scrim.hidden) { scrim.hidden = false; sh.tabIndex = -1; requestAnimationFrame(() => sh.focus()); }
}

/* ================= Timer ================= */
let tmr = null;
function startRest(sec, name) {
  clearInterval(tmr); if (!sec) return hideTimer();
  const el = document.getElementById('timer'); let left = sec, total = sec;
  const draw = () => {
    el.innerHTML = `<div class="tl">${ic('timer')}<div><span>Rest · ${esc(name)}</span><br><b class="num">${Math.floor(left / 60)}:${pad(left % 60)}</b></div></div>
      <button class="tbtn" data-act="t-add" aria-label="Add 15 seconds">+15s</button><button class="tbtn pri" data-act="t-skip">Skip</button>
      <span class="prog" style="width:${(1 - left / total) * 100}%"></span>`;
  };
  el.hidden = false; draw();
  el.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act === 't-add') { left += 15; total += 15; draw(); } else hideTimer(); };
  tmr = setInterval(() => { left--; if (left <= 0) { hideTimer(); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} } else draw(); }, 1000);
}
function hideTimer() { clearInterval(tmr); document.getElementById('timer').hidden = true; }

/* ================= Render ================= */
function nav() {
  const t = TABS.map(([id, l, i]) => `<button class="tab" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('');
  document.getElementById('tabbar').innerHTML = t;
  const ws = weekStats();
  document.getElementById('sidenav').innerHTML = TABS.map(([id, l, i]) => `<button class="nav" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>${ic(i)}${l}${id === 'progress' ? `<span class="cnt num">${ws.done}/${state.goal}</span>` : ''}</button>`).join('');
  document.getElementById('me').innerHTML = `${avatar('avatar-btn')}<div><b>${esc(state.name || 'You')}</b><span>Goal ${state.goal} a week</span></div>`;
}
function render() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const v = { today: viewToday, progress: viewProgress, plan: viewPlan, profile: viewProfile }[ui.tab];
  document.getElementById('main').innerHTML = v();
  nav(); renderSheet();
  if (fid) { const el = document.querySelector(`[data-fid="${fid}"]`); if (el) el.focus({ preventScroll: true }); }
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-set],[data-open],[data-adj],[data-act]'); if (!t || t.closest('#timer')) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.confirm = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.set) {
    const [ei, si] = t.dataset.set.split(':').map(Number); const s = todaySession(); const x = s.sets[ei][si];
    x.d = !x.d; if (s.done && !x.d) s.done = false; save(); render();
    if (x.d) {
      const ex = T[s.tid].ex[ei];
      const left = sTotal(s) - sDone(s);
      const sec = state.rest === 'plan' ? ex.rest : Number(state.rest);
      if (left && sec) startRest(sec, ex.name); else hideTimer();
    }
    return;
  }
  if (t.dataset.open) { ui.sheet = Number(t.dataset.open); lastOpener = t.dataset.fid; renderSheet(); return; }
  if (t.dataset.adj) {
    const [si, f, d] = t.dataset.adj.split(':'); const s = todaySession(); const x = s.sets[ui.sheet][+si];
    if (f === 'r') x.r = Math.max(1, x.r + Number(d));
    else { const stepW = x.w >= 20 ? 2.5 : 1; x.w = Math.max(stepW, Math.round((x.w + Number(d) * stepW) * 10) / 10); }
    save(); render(); return;
  }
  const a = t.dataset.act; const s = state.sessions[TK];
  if (a === 'close') { closeSheet(); }
  else if (a === 'add-set') { const arr = todaySession().sets[ui.sheet]; const l = arr[arr.length - 1]; arr.push({ r: l.r, w: l.w, d: false }); todaySession().done = false; save(); render(); }
  else if (a === 'finish') { s.done = true; s.min = Math.max(5, sMins(s)); hideTimer(); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (a === 'resume') { s.done = false; s.min = null; save(); render(); }
  else if (a === 'train') { state.override[TK] = t.dataset.tid; save(); render(); }
  else if (a === 'goal') { state.goal = Math.min(7, Math.max(1, state.goal + Number(t.dataset.d))); save(); render(); }
  else if (a === 'rest') { state.rest = t.dataset.v === 'plan' ? 'plan' : Number(t.dataset.v); save(); render(); }
  else if (a === 'reset-today' || a === 'clear') {
    if (ui.confirm !== a) { ui.confirm = a; render(); return; }
    ui.confirm = null;
    if (a === 'reset-today') { const tid = todayTid(); if (tid) state.sessions[TK] = newSession(tid); }
    else { state.sessions = {}; state.override = {}; state.lastWeek = []; state.streak = 0; state.sample = false; }
    hideTimer(); save(); render();
  }
});
let lastOpener = null;
function closeSheet() { ui.sheet = null; renderSheet(); render(); if (lastOpener) { const el = document.querySelector(`[data-fid="${lastOpener}"]`); el && el.focus(); } }
document.getElementById('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => {
  if (ui.sheet == null) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...document.querySelectorAll('#sheet button:not(:disabled)')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
render();
</script>
</body>
