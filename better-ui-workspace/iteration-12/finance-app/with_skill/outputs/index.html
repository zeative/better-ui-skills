<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<title>Fern · Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean. Cool off-white canvas, white cards, deep green brand on the summary card and active states, soft category tints. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F4F3; --surface: #FFFFFF; --surface-2: #F5F7F6; --line: #E7EBE9; --line-2: #DCE2DF;
  --text: #0F1A16; --text-2: #5E6B66; --text-3: #8F9A96;
  --brand: #0B7A5C; --brand-2: #07634A; --brand-tint: #E5F3EE; --on-brand: #FFFFFF;
  --ok: #0E7a3F; --ok-tint: #E6F6EC; --warn: #9A5600; --warn-tint: #FDF1DE; --bad: #B92D26; --bad-tint: #FCEBEA;
  --r-xs: 6px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(15,30,24,.04), 0 1px 1px rgba(15,30,24,.03);
  --sh-2: 0 1px 2px rgba(15,30,24,.04), 0 8px 24px -12px rgba(15,30,24,.12);
  --sh-float: 0 12px 32px -8px rgba(15,30,24,.20);
  --sh-brand: 0 1px 2px rgba(7,99,74,.12), 0 12px 28px -16px rgba(7,99,74,.38);
  --tab-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11"; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)); }

.topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; margin-bottom: 16px; }
.topbar .t { flex: 1; min-width: 0; }
.topbar .kicker { font-size: 13px; color: var(--text-2); font-weight: 500; }
.topbar h1 { font-size: 20px; letter-spacing: -0.01em; line-height: 1.25; }
.topbar h1.page { font-size: 24px; letter-spacing: -0.02em; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(140deg, #FFE3C2, #F9C9A6); flex: none; overflow: hidden; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #8A4B00; }
.avatar img { width: 100%; height: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1); border: 1px solid var(--line); color: var(--text); transition: background-color .15s, transform .15s; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.96); }
.desk-only { display: none !important; }
.gsearch { height: 44px; width: 280px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); align-items: center; gap: 10px; padding: 0 8px 0 14px; color: var(--text-2); font-size: 14px; transition: border-color .15s; }
.gsearch:hover { border-color: var(--line-2); color: var(--text); }
.gsearch span { flex: 1; text-align: left; }
.gsearch kbd { font: inherit; font-size: 12px; font-weight: 600; min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r-xs); border: 1px solid var(--line-2); color: var(--text-2); background: var(--surface-2); }

.view { display: none; }
.view.on { display: block; animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.act-grid .a-side { display: contents; }
.act-grid .a-srch { order: 1; } .act-grid .a-daily { order: 2; } .act-grid .a-txl { order: 3; } .act-grid .a-merch { order: 4; }
.act-grid .filters { margin-bottom: 0; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); border: 1px solid rgba(15,30,24,.03); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; min-height: 28px; }
.card-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.card-head .sub { font-size: 13px; color: var(--text-2); font-weight: 500; }
.link { font-size: 14px; font-weight: 600; color: var(--brand); text-decoration: none; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px 0 12px; margin: -10px -4px -10px 0; border-radius: var(--r-full); }
.link:hover { background: var(--brand-tint); }
.link .ic { width: 16px; height: 16px; }

/* Summary card */
.summary { position: relative; overflow: hidden; color: var(--on-brand); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-brand);
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.14), transparent 55%),
    radial-gradient(60% 60% at 0% 100%, rgba(0,0,0,.10), transparent 70%),
    linear-gradient(160deg, #0E8B68 0%, #0A7457 55%, #075F48 100%); }
.a-sum { display: grid; }
.summary { display: flex; flex-direction: column; }
.summary .spark-wrap { flex: 1 0 96px; max-height: 150px; }
.summary .spark-x { margin-bottom: 4px; }
.summary .mini-stats { margin-top: auto; }
.summary .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.summary .label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.88); display: flex; align-items: center; gap: 8px; }
.acct { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-full); background: rgba(255,255,255,.16); color: #fff; white-space: nowrap; }
.hero-fig { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 6px; }
.hero-fig .c { color: rgba(255,255,255,.72); font-weight: 600; font-size: 24px; }
.delta-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: var(--r-full); background: rgba(255,255,255,.16); margin-top: 10px; white-space: nowrap; }
.delta-pill .ic { width: 14px; height: 14px; }
.delta-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.delta-row .delta-pill { margin-top: 0; }
.delta-note { font-size: 13px; color: rgba(255,255,255,.85); }
.spark-wrap { position: relative; margin: 16px 6px 0 0; height: 96px; min-height: 96px; }
.spark-wrap svg { width: 100%; height: 100%; overflow: visible; }
.spark-x { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.85); margin-top: 6px; }
.spark-tip { position: absolute; transform: translate(-100%, -130%); background: #fff; color: var(--text); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: var(--r-xs); white-space: nowrap; box-shadow: var(--sh-float); pointer-events: none; }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 16px; }
.mini-stats > div { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mini-stats > div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.18); }
.mini-ic { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.16); display: grid; place-items: center; flex: none; }
.mini-ic .ic { width: 18px; height: 18px; }
.mini-stats .k { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }
.mini-stats .v { font-size: 16px; font-weight: 600; line-height: 1.3; }

/* Budget card */
.budget-fig { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget-fig .big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.budget-fig .of { font-size: 14px; color: var(--text-2); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.seg-bar { display: flex; gap: 3px; height: 12px; margin: 16px 0 10px; border-radius: var(--r-full); overflow: hidden; background: var(--surface-2); }
.seg-bar i { display: block; height: 100%; min-width: 3px; }
.seg-bar i:first-child { border-radius: var(--r-full) 0 0 var(--r-full); }
.pbar { position: relative; height: 12px; border-radius: var(--r-full); background: var(--surface-2); margin: 16px 0 10px; }
.pbar i { display: block; height: 100%; border-radius: var(--r-full); background: linear-gradient(90deg, #0E8B68, var(--brand)); }
.pbar b { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 2px var(--surface); }
.bar-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.pace-key { display: inline-flex; align-items: center; gap: 6px; } .pace-key::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--text); }
.budget-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.budget-foot > div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.budget-foot .k { font-size: 12px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.budget-foot .v { font-size: 15px; font-weight: 600; white-space: nowrap; }

.watch-h { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 20px 0 4px; display: flex; justify-content: space-between; }
.watch { list-style: none; margin: 0; padding: 0; }
.watch .brow { padding: 8px; }
.watch .track { margin: 6px 0 0; height: 6px; }
.up-date { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: grid; place-content: center; text-align: center; flex: none; line-height: 1.1; }
.up-date .m { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.up-date .d { font-size: 16px; font-weight: 700; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.rank li { display: flex; align-items: center; gap: 12px; }
.rank .mid { flex: 1; min-width: 0; }
.rank .top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
.rank .meta { font-size: 13px; color: var(--text-2); }
.rank .track { height: 6px; margin: 6px 0 4px; }
/* Item chips */
.chip-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 22px; line-height: 1;
  background: color-mix(in srgb, var(--c) 16%, #fff); }
.chip-ic img { width: 26px; height: 26px; }
.chip-ic.sm { width: 36px; height: 36px; border-radius: 12px; font-size: 18px; }
.chip-ic.sm img { width: 22px; height: 22px; }

/* Transaction rows */
.tx-list { list-style: none; margin: 0; padding: 0; }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: var(--r-md); min-height: 64px; transition: background-color .15s; }
.tx:hover { background: var(--surface-2); }
.tx:active { background: var(--line); }
.tx .mid { flex: 1; min-width: 0; }
.tx .name { font-size: 15px; font-weight: 600; line-height: 1.3; }
.tx .meta { font-size: 13px; color: var(--text-2); line-height: 1.4; margin-top: 2px; }
.tx .amt { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tx .amt.in { color: var(--ok); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 14px 0 4px; }
.day-head:first-child { padding-top: 0; }
.day-head .num { font-weight: 500; }

/* Category spending */
#catCard { container-type: inline-size; }
.cat-wrap { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 20px; align-items: center; }
@container (max-width: 330px) { .cat-wrap { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }
.donut { position: relative; width: 132px; height: 132px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .ctr .k { font-size: 12px; color: var(--text-2); font-weight: 500; }
.donut .ctr .v { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.legend .n { flex: 1; min-width: 0; font-weight: 500; }
.legend .p { color: var(--text-2); font-size: 14px; width: 40px; text-align: right; }
.legend .a { font-weight: 600; width: 76px; text-align: right; }
.cat-compare { text-wrap: balance; margin-top: 16px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; color: var(--text-2); display: flex; gap: 10px; align-items: center; }
.cat-compare b { color: var(--text); font-weight: 600; }
.cat-compare .ic { color: var(--ok); width: 18px; height: 18px; }
.cat-compare.more { background: var(--warn-tint); } .cat-compare.more .ic { color: var(--warn); }

/* Activity */
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search input { width: 100%; height: 48px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--surface); padding: 0 16px 0 44px; font-size: 16px; box-shadow: var(--sh-1); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); }
.filters { display: flex; gap: 8px; margin: 12px 0 16px; overflow-x: auto; scrollbar-width: none; }
.fchip { height: 40px; padding: 0 14px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s, color .15s; }
.fchip:hover { color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--brand-tint); color: var(--brand-2); border-color: var(--brand); }
.fchip .cnt { font-size: 12px; color: inherit; font-weight: 500; }
.bars { position: relative; height: 140px; margin-top: 12px; display: flex; align-items: flex-end; gap: 3px; padding-top: 8px; padding-right: 40px; }
.bars .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-2); }
.bars .gl span { position: absolute; right: 0; top: -9px; font-size: 12px; line-height: 16px; color: var(--text-2); background: var(--surface); padding-left: 6px; }
.bars .b { flex: 1; background: color-mix(in srgb, var(--brand) 22%, #fff); border-radius: 4px 4px 2px 2px; min-height: 3px; position: relative; }
.bars .b.today { background: var(--brand); }
.bars .b.future { background: transparent; }
.bars-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-top: 8px; padding-right: 40px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-row > div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.stat-row .k { font-size: 12px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.stat-row .v { font-size: 16px; font-weight: 600; }

/* Budget screen */
.ring-card { display: grid; grid-template-columns: 128px 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 128px; height: 128px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .ctr .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.ring .ctr .k { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }
.kv { display: grid; gap: 10px; font-size: 14px; }
.kv > div { display: flex; justify-content: space-between; gap: 8px; }
.kv .k { color: rgba(255,255,255,.85); }
.kv .v { font-weight: 600; }
.brow { display: flex; align-items: center; gap: 12px; width: calc(100% + 16px); margin: 0 -8px; padding: 12px 8px; text-align: left; border-radius: var(--r-md); transition: background-color .15s; }
.brow:hover { background: var(--surface-2); }
.brow .mid { flex: 1; min-width: 0; }
.brow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.brow .name { font-size: 15px; font-weight: 600; }
.brow .left { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--text-2); }
.brow .left.bad { color: var(--bad); }
.brow .left.warn { color: var(--warn); }
.track { height: 8px; border-radius: var(--r-full); background: var(--surface-2); margin: 8px 0 6px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: var(--r-full); background: var(--c); }
.track.over i { background: var(--bad); }
.track.warn i { background: #E2A13A; }
.brow .meta { font-size: 13px; color: var(--text-2); }
.brow .chev { color: var(--text-3); }

/* Settings */
.profile { display: flex; align-items: center; gap: 14px; }
.profile .avatar { width: 56px; height: 56px; }
.profile .n { font-size: 18px; font-weight: 600; }
.profile .e { font-size: 14px; color: var(--text-2); }
.set-group { padding: 6px 20px; }
.set-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .mid { flex: 1; min-width: 0; }
.set-row .name { font-size: 15px; font-weight: 600; }
.set-row .meta { font-size: 13px; color: var(--text-2); }
.set-row .val { font-size: 14px; color: var(--text-2); font-weight: 500; }
.set-row .chev { color: var(--text-3); }
button.set-row:hover .name { color: var(--brand); }
.set-row.danger .name { color: var(--bad); }
.lic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.lic .ic { width: 18px; height: 18px; }
.section-label { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 24px 0 8px 20px; }
.set-grid { display: grid; gap: 0 20px; max-width: 640px; }
.set-grid .section-label.first { margin-top: 24px; }
.cmp { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cmp li { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.cmp .n { flex: 1; font-size: 15px; font-weight: 600; min-width: 0; }
.cmp .n small { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); }
.dpill { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: var(--r-full); white-space: nowrap; min-width: 64px; text-align: center; }
.dpill { background: var(--surface-2); } .dpill.ok { color: var(--ok); } .dpill.bad { color: var(--bad); } .dpill.eq { color: var(--text-2); }
.foot-note { font-size: 13px; color: var(--text-2); text-align: center; margin-top: 24px; }

/* Empty */
.empty { text-align: center; padding: 16px 8px 8px; display: grid; justify-items: center; gap: 6px; }
.empty img, .empty .em { width: 72px; height: 72px; font-size: 56px; line-height: 72px; margin-bottom: 6px; }
.empty .t { font-size: 16px; font-weight: 600; }
.empty .s { font-size: 14px; color: var(--text-2); max-width: 32ch; }
.empty .btn { margin-top: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 15px;
  background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(7,99,74,.18), 0 6px 14px -8px rgba(7,99,74,.4);

.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -0.01em; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); padding: 4px; border-radius: var(--r-full); margin-bottom: 20px; }

.amount-field { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 8px 0 4px; }

.amount-field input { width: 4.2ch; min-width: 0; border: 0; outline: none; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; text-align: left; background: none; font-variant-numeric: tabular-nums; padding: 0; }
.amount-field input::placeholder { color: var(--text-3); }

.field { margin-bottom: 18px; }

.input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }

  background: var(--text); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 10px 10px 16px; border-radius: var(--r-full); box-shadow: var(--sh-float); display: flex; align-items: center; gap: 12px; transition: opacity .2s, transform .2s; white-space: nowrap; }

<body>

<script>
/* ---------- Icons ---------- */
const I = {
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  activity: '<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/>',
  budget: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  up: '<path d="M7 17 17 7M9 7h8v8"/>',
  down: '<path d="M17 7 7 17M15 17H7V9"/>',
  trend: '<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',

};
const svg = (k, cls = 'ic', sw = 1.8) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

/* ---------- Categories ---------- */
const CATS = {
  housing:       { name: 'Housing',   e: '🏠', c: '#0B7A5C' },
  groceries:     { name: 'Groceries', e: '🛒', c: '#4C8FE0' },
  dining:        { name: 'Dining',    e: '🍜', c: '#E48AB5' },
  transport:     { name: 'Transport', e: '🚗', c: '#58BCD6' },
  shopping:      { name: 'Shopping',  e: '🛍️', c: '#A58AE6' },
  bills:         { name: 'Bills',     e: '💡', c: '#7CC4AE' },
  entertainment: { name: 'Leisure',   e: '🎬', c: '#6F7FE8' },
  health:        { name: 'Health',    e: '💊', c: '#93A1B4' },
  other:         { name: 'Other',     e: '📦', c: '#C3CBD3' },
  income:        { name: 'Income',        e: '💼', c: '#22A06B' }
};
const EXP_CATS = Object.keys(CATS).filter(k => k !== 'income' && k !== 'other');
const emoji3d = e => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' + [...e].map(c => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e, size) => `<img src="${emoji3d(e)}" alt="" width="${size}" height="${size}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${e}'))">`;

function smoothPath(p) {
  // monotone cubic (Fritsch–Carlson): smooth, never overshoots
  const n = p.length; if (n < 2) return `M${p[0][0]} ${p[0][1]}`;
  const dx = [], dy = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; dy[i] = p[i + 1][1] - p[i][1]; m[i] = dy[i] / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; } const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b; if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; } }
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) d += ` C${(p[i][0] + dx[i] / 3).toFixed(1)} ${(p[i][1] + t[i] * dx[i] / 3).toFixed(1)} ${(p[i + 1][0] - dx[i] / 3).toFixed(1)} ${(p[i + 1][1] - t[i + 1] * dx[i] / 3).toFixed(1)} ${p[i + 1][0].toFixed(1)} ${p[i + 1][1].toFixed(1)}`;
  return d;
}

function budgetStatus(spent, budget) {
  if (budget <= 0) return ['ok', 'No budget'];
  const r = spent / budget;
  if (spent - budget > .005) return ['bad', 'Over budget'];
  if (budget - spent < .005) return ['ok', 'Fully used'];
  if (r > .85) return ['warn', 'Close to limit'];
  return ['ok', 'On track'];
}

function expectedBy() {
  const sp = spentBy(monthKey), total = budgetTotal(), hb = S.budgets.housing || 0;
  return Math.min(sp.housing || 0, hb) + (total - hb) * TODAY.getDate() / daysInMonth;
}
function overallStatus(sp, spent, total) {
  if (!total) return ['ok', 'No budget'];
  if (spent > total) return ['bad', 'Over budget'];
  const over = EXP_CATS.filter(c => S.budgets[c] && (sp[c] || 0) > S.budgets[c] + .005).length;
  if (over) return ['warn', over === 1 ? '1 category over' : over + ' categories over'];
  const fixed = Math.min(sp.housing || 0, S.budgets.housing || 0);
  const expected = fixed + (total - (S.budgets.housing || 0)) * TODAY.getDate() / daysInMonth;
  if (spent > expected * 1.08) return ['warn', 'Ahead of pace'];
  return ['ok', 'On track'];
}

    if (list.length < 2 || !['housing', 'bills', 'entertainment', 'income'].includes(list[0].cat)) return;
    list.sort((a, b) => a.date.localeCompare(b.date));
    const a = list[list.length - 2], b = list[list.length - 1];
    if (Math.abs(a.amount - b.amount) > Math.abs(b.amount) * .15) return;
    const gap = Math.round((parse(b.date) - parse(a.date)) / 864e5);
    const next = parse(b.date);
    if (gap >= 13 && gap <= 15) next.setDate(next.getDate() + 14);
    else if (gap >= 27 && gap <= 32) next.setMonth(next.getMonth() + 1);
    else return;
    if (next > TODAY && (next - TODAY) / 864e5 <= 31) out.push({ ...b, next: key(next), gap });
  });
  return out.sort((a, b) => a.next.localeCompare(b.next));
}
function renderUpcoming() {
  const list = upcoming().slice(0, 5);
  const el = document.getElementById('upCard');
  el.innerHTML = `<div class="card-head"><h2>Upcoming</h2><span class="sub">Next 30 days</span></div>
    ${list.length ? `<ul class="tx-list">${list.map(t => { const d = parse(t.next); const n = Math.round((d - TODAY) / 864e5);
      return `<li><button class="tx" data-tx="${t.id}"><span class="up-date" aria-hidden="true"><span class="m">${d.toLocaleDateString('en-US', { month: 'short' })}</span><span class="d">${d.getDate()}</span></span>
      <div class="mid"><div class="name">${esc(t.merchant)}</div><div class="meta">${n === 1 ? 'Tomorrow' : 'In ' + n + ' days'} · ${t.gap < 20 ? 'Biweekly' : 'Monthly'}</div></div>
      <div class="amt num ${t.amount > 0 ? 'in' : ''}">${signed(t.amount)}</div></button></li>`; }).join('')}</ul>`
    : `<p style="font-size:14px;color:var(--text-2)">Repeating payments, like rent and subscriptions, show up here once they appear twice.</p>`}`;
}
function renderMerchants() {
  const by = {};
  inMonth(monthKey).filter(t => t.amount < 0 && t.cat !== 'housing').forEach(t => { const m = by[t.merchant] = by[t.merchant] || { n: 0, v: 0, cat: t.cat }; m.n++; m.v += -t.amount; });
  const list = Object.entries(by).sort((a, b) => b[1].v - a[1].v).slice(0, 5);
  const max = list.length ? list[0][1].v : 1;
  document.getElementById('merchCard').innerHTML = `<div class="card-head"><h2>Top merchants</h2><span class="sub">${monthName}</span></div>
    ${list.length ? `<ol class="rank">${list.map(([name, m]) => `<li>${chip(m.cat, 'sm', name)}<div class="mid"><div class="top"><span>${esc(name)}</span><span class="num">${money(m.v)}</span></div>
      <div class="track" style="--c:${CATS[m.cat].c}"><i style="width:${m.v / max * 100}%"></i></div><div class="meta">${CATS[m.cat].name} · ${m.n} ${m.n === 1 ? 'payment' : 'payments'}</div></div></li>`).join('')}</ol>`
    : `<p style="font-size:14px;color:var(--text-2)">No spending yet this month.</p>`}`;
}

/* ---------- Activity ---------- */
function renderDaily() {
  const byDay = Array(daysInMonth).fill(0);
  inMonth(monthKey).forEach(t => { if (t.amount < 0 && t.cat !== 'housing') byDay[parse(t.date).getDate() - 1] += -t.amount; });
  const max = Math.max(...byDay, 1);
  const nice = Math.ceil(max / 50) * 50;
  const today = TODAY.getDate();
  const past = byDay.slice(0, today);
  const avg = sum(past) / today;
  const big = Math.max(...past);
  const bigDay = past.indexOf(big) + 1;
  document.getElementById('dailyCard').innerHTML = `
    <div class="card-head"><div><h2>Daily spending</h2><div class="sub">${monthName}, excluding rent</div></div></div>
    <div class="stat-row">
      <div><div class="k">This month</div><div class="v num">${usd0.format(sum(past))}</div></div>
      <div><div class="k">Average</div><div class="v num">${usd0.format(avg)}</div></div>
      <div><div class="k">Biggest day</div><div class="v num">${big ? usd0.format(big) : '$0'}</div></div>
    </div>
    <div class="bars" role="img" aria-label="Daily spending in ${monthName}. Average ${usd0.format(avg)} per day${big ? `, highest ${usd0.format(big)} on ${monthName.slice(0, 3)} ${bigDay}` : ''}.">
      <div class="gl" style="top:8px"><span class="num">${usd0.format(nice)}</span></div>
      <div class="gl" style="top:calc(8px + (100% - 8px) / 2)"><span class="num">${usd0.format(nice / 2)}</span></div>
      ${byDay.map((v, i) => `<div class="b ${i + 1 === today ? 'today' : i + 1 > today ? 'future' : ''}" style="height:${i + 1 > today ? 0 : Math.max(v / nice * 100, 2.5)}%" title="${monthName.slice(0, 3)} ${i + 1}: ${money(v)}"></div>`).join('')}
    </div>
    <div class="bars-x num"><span>${monthName.slice(0, 3)} 1</span><span>${monthName.slice(0, 3)} ${Math.ceil(daysInMonth / 2)}</span><span>${monthName.slice(0, 3)} ${daysInMonth}</span></div>`;
}

function renderFilters() {
  const n = { all: S.tx.length, out: S.tx.filter(t => t.amount < 0).length, in: S.tx.filter(t => t.amount > 0).length };
  document.getElementById('filters').innerHTML = [['all', 'All'], ['out', 'Spending'], ['in', 'Income']].map(([k, l]) =>
    `<button class="fchip" data-filter="${k}" aria-pressed="${filter === k}">${l}<span class="cnt num">${n[k]}</span></button>`).join('');
}
function renderAll() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = sortTx(S.tx);
  if (filter === 'out') list = list.filter(t => t.amount < 0);
  if (filter === 'in') list = list.filter(t => t.amount > 0);
  if (q) list = list.filter(t => (t.merchant + ' ' + CATS[t.cat].name + ' ' + t.note).toLowerCase().includes(q));
  document.getElementById('allTx').innerHTML = list.length ? grouped(list, false)
    : S.tx.length ? emptyBlock('No matches', q ? `Nothing matches “${esc(q)}”. Try a merchant or category name.` : 'No transactions in this filter.', false)
    : emptyBlock('No transactions yet', 'Everything you add will be listed here, newest first.', true);
}

/* ---------- Budget ---------- */
function budgetRow(c, sp, full) {
  const b = S.budgets[c] || 0, s = sp[c] || 0, rr = b ? s / b : (s ? 1.01 : 0);
  const [cls] = budgetStatus(s, b);
  const leftTxt = !b ? 'No budget' : cls === 'bad' ? `${money(s - b)} over` : b - s < .005 ? 'Fully used' : `${money(b - s)} left`;
  return `<li><button class="brow" data-budget="${c}" aria-label="Edit ${CATS[c].name} budget">
    ${chip(c, full ? '' : 'sm')}
    <div class="mid">
      <div class="top"><span class="name">${CATS[c].name}</span><span class="left num ${b ? cls : ''}">${leftTxt}</span></div>
      <div class="track ${b && cls === 'bad' ? 'over' : b && cls === 'warn' ? 'warn' : ''}" style="--c:${CATS[c].c}"><i style="width:${Math.min(rr, 1) * 100}%"></i></div>
      ${full ? `<div class="meta num">${money(s)} of ${money(b)}</div>` : ''}
    </div>
    ${full ? svg('chev', 'ic chev', 2) : ''}
  </button></li>`;
}

function renderBudgetView() {
  const sp = spentBy(monthKey), total = budgetTotal();
  const spent = sum(EXP_CATS.map(c => sp[c] || 0));
  const left = total - spent, daysLeft = daysInMonth - TODAY.getDate() + 1;
  const r = total ? Math.min(spent / total, 1) : 0;
  const C = 2 * Math.PI * 42;
  document.getElementById('budgetSummary').innerHTML = `
    <div class="summary">
      <div class="row1"><div class="label">${monthName} budget</div><span class="acct">${daysLeft} days left</span></div>
      <div class="ring-card" style="margin-top:16px">
        <div class="ring" role="img" aria-label="${Math.round(spent / (total || 1) * 100)}% of monthly budget used">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${r * C} ${C}"/></svg>
          <div class="ctr"><div class="v num">${Math.round(spent / (total || 1) * 100)}%</div><div class="k">used</div></div>
        </div>
        <div class="kv num">
          <div><span class="k">Budget</span><span class="v">${money(total)}</span></div>
          <div><span class="k">Spent</span><span class="v">${money(spent)}</span></div>
          <div><span class="k">${left >= 0 ? 'Left' : 'Over'}</span><span class="v">${money(Math.abs(left))}</span></div>
          <div><span class="k">Per day</span><span class="v">${left > 0 ? money(left / daysLeft) : '$0.00'}</span></div>
        </div>
      </div>
    </div>`;
  const rows = EXP_CATS.map(c => budgetRow(c, sp, true)).join('');
  document.getElementById('budgetList').innerHTML = `<div class="card-head"><h2>Categories</h2><span class="sub">${monthName}</span></div><ul class="tx-list">${rows}</ul>`;
}

function renderCompare() {
  const sp = spentBy(monthKey);
  const prev = {}; inMonth(prevMonth).forEach(t => { if (t.amount < 0 && parse(t.date).getDate() <= TODAY.getDate()) prev[t.cat] = (prev[t.cat] || 0) + -t.amount; });
  const cats = EXP_CATS.filter(c => sp[c] || prev[c]);
  document.getElementById('compareCard').innerHTML = `<div class="card-head"><h2>Compared with ${prevName}</h2><span class="sub">vs ${prevName.slice(0, 3)} 1–${TODAY.getDate()}</span></div>
    ${cats.length ? `<ul class="cmp">${cats.map(c => { const a = sp[c] || 0, b = prev[c] || 0, d = a - b;
      const cls = Math.abs(d) < 1 ? 'eq' : d < 0 ? 'ok' : 'bad';
      return `<li>${chip(c, 'sm')}<div class="n">${CATS[c].name}<small class="num">${usd0.format(a)} vs ${usd0.format(b)}</small></div><span class="dpill num ${cls}">${cls === 'eq' ? 'Same' : (d < 0 ? '↓ ' : '↑ ') + usd0.format(Math.abs(d))}</span></li>`; }).join('')}</ul>`
    : `<p style="font-size:14px;color:var(--text-2)">Not enough history yet.</p>`}`;
}
/* ---------- Render all ---------- */
function render() {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  renderNav(); renderHeader();
  renderSummary(); renderBudgetCard(); renderRecent(); renderCategories(); renderSideTip();
  renderUpcoming(); renderDaily(); renderMerchants(); renderFilters(); renderAll(); renderBudgetView(); renderCompare();
  document.getElementById('budMeta').textContent = `${usd0.format(budgetTotal())} a month across ${EXP_CATS.length} categories`;
  document.getElementById('expMeta').textContent = `${S.tx.length} transactions`;
  document.getElementById('sideAvatar').innerHTML = document.getElementById('profAvatar').innerHTML = avatarHTML();
}
function go(v) { if (v === view) return; view = v; history.replaceState(null, '', '#' + v); render(); window.scrollTo(0, 0); }

/* ---------- Sheet ---------- */
const sheet = document.getElementById('sheet'), backdrop = document.getElementById('backdrop');
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`;
  sheet.hidden = false; backdrop.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add('on'); backdrop.classList.add('on'); });
  document.body.style.overflow = 'hidden';
  setTimeout(() => (sheet.querySelector('[autofocus]') || sheet.querySelector('button, input')).focus(), 60);
}
function closeSheet() {
  sheet.classList.remove('on'); backdrop.classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(() => { sheet.hidden = true; backdrop.hidden = true; }, 260);
  if (lastFocus) lastFocus.focus();
}
const sheetHead = t => `<div class="sheet-head"><h2 id="sheetTitle">${t}</h2><button class="close-btn" data-action="close" aria-label="Close">${svg('x', 'ic', 2)}</button></div>`;

function openAdd() {
  let type = 'out', cat = null, day = 0;
  openSheet(`${sheetHead('New transaction')}
    <form id="addForm" novalidate>
      <div class="seg" role="group" aria-label="Type"><button type="button" data-type="out" aria-pressed="true">Expense</button><button type="button" data-type="in" aria-pressed="false">Income</button></div>
      <div class="amount-field"><span>$</span><label class="sr-only" for="fAmt">Amount</label><input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" autofocus aria-describedby="eAmt"></div>
      <div class="amount-line"></div>
      <div class="err" id="eAmt" style="text-align:center;margin:-12px 0 16px">Enter an amount greater than $0.</div>
      <div class="field"><label for="fMer" id="lMer">Merchant</label><input class="input" id="fMer" placeholder="e.g. Trader Joe's" autocomplete="off" maxlength="40" aria-describedby="eMer"><div class="err" id="eMer">Add who you paid.</div></div>
      <div class="field" id="catField"><div class="lbl" id="lCat">Category</div><div class="cat-grid" role="group" aria-labelledby="lCat">
        ${EXP_CATS.map(c => `<button type="button" class="cat-opt" data-cat="${c}" aria-pressed="${c === cat}"><span class="chip-ic sm" style="--c:${CATS[c].c}" aria-hidden="true">${emo(CATS[c].e, 22)}</span>${CATS[c].name}</button>`).join('')}
      </div><div class="err" id="eCat">Choose a category.</div></div>
      <div class="field"><div class="lbl" id="lDate">Date</div><div class="date-chips" role="group" aria-labelledby="lDate">
        ${[0, 1, 2].map(d => `<button type="button" class="fchip" data-day="${d}" aria-pressed="${d === day}">${d === 0 ? 'Today' : d === 1 ? 'Yesterday' : fmtDay(daysAgo(2))}</button>`).join('')}
      </div></div>
      <button class="btn block" type="submit" style="margin-top:8px">Save transaction</button>
    </form>`);
  const f = document.getElementById('addForm');
  f.addEventListener('click', e => {
    const b = e.target.closest('button[type=button]'); if (!b) return;
    if (b.dataset.type) { type = b.dataset.type; f.querySelectorAll('[data-type]').forEach(x => x.setAttribute('aria-pressed', x === b));
      document.getElementById('catField').style.display = type === 'in' ? 'none' : '';
      document.getElementById('lMer').textContent = type === 'in' ? 'From' : 'Merchant';
      document.getElementById('fMer').placeholder = type === 'in' ? 'e.g. Salary' : "e.g. Trader Joe's"; }
    if (b.dataset.cat) { cat = b.dataset.cat; f.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
    if (b.dataset.day) { day = +b.dataset.day; f.querySelectorAll('[data-day]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const amtEl = document.getElementById('fAmt'), merEl = document.getElementById('fMer');
    const amt = Math.round(parseFloat(amtEl.value.replace(/[^0-9.]/g, '')) * 100) / 100;
    const mer = merEl.value.trim();
    const okA = amt > 0 && amt < 1e7, okM = !!mer, okC = type === 'in' || !!cat;
    document.getElementById('eCat').classList.toggle('on', !okC);
    document.getElementById('eAmt').classList.toggle('on', !okA); amtEl.setAttribute('aria-invalid', !okA);
    document.getElementById('eMer').classList.toggle('on', !okM); merEl.setAttribute('aria-invalid', !okM);
    if (!okA) return amtEl.focus(); if (!okM) return merEl.focus(); if (!okC) return f.querySelector('[data-cat]').focus();
    const t = { id: 'u' + Date.now(), date: daysAgo(day), merchant: mer, cat: type === 'in' ? 'income' : cat, amount: type === 'in' ? amt : -amt, note: '', t: Date.now() };
    S.tx.push(t); save(); closeSheet(); render();
    toast(`${type === 'in' ? 'Income' : 'Expense'} of ${money(amt)} added`, () => { S.tx = S.tx.filter(x => x.id !== t.id); save(); render(); });
  });
}

function openTx(id) {
  const t = S.tx.find(x => x.id === id); if (!t) return;
  openSheet(`${sheetHead(relDay(t.date))}
    <div class="detail-top"><span class="chip-ic" style="--c:${CATS[t.cat].c}" aria-hidden="true">${emo(iconFor(t.cat, t.merchant), 38)}</span>
      <div class="n">${esc(t.merchant)}</div><div class="a num ${t.amount > 0 ? 'in' : ''}">${signed(t.amount)}</div></div>
    <div class="dl">
      <div><span class="k">Category</span><span class="v">${CATS[t.cat].name}</span></div>
      <div><span class="k">Date</span><span class="v">${parse(t.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</span></div>
      ${t.note ? `<div><span class="k">Note</span><span class="v">${esc(t.note)}</span></div>` : ''}
      <div><span class="k">Account</span><span class="v">Checking ···· 4821</span></div>
    </div>
    <button class="btn ghost block del" data-del="${t.id}">${svg('trash', 'ic', 2)}Delete transaction</button>`);
}

function openBudget(c) {
  const sp = spentBy(monthKey)[c] || 0;
  openSheet(`${sheetHead(CATS[c].name + ' budget')}
    <form id="budForm" novalidate>
      <div class="detail-top" style="padding-bottom:8px">${chip(c)}<div class="meta" style="font-size:14px;color:var(--text-2)">${money(sp)} spent in ${monthName}</div></div>
      <div class="amount-field"><span>$</span><label class="sr-only" for="fBud">Monthly budget</label><input id="fBud" inputmode="decimal" value="${S.budgets[c] || ''}" placeholder="0" style="width:${String(S.budgets[c] || '0').length + 0.2}ch" autocomplete="off" autofocus aria-describedby="eBud"></div>
      <div class="amount-line"></div>
      <div class="err" id="eBud" style="text-align:center;margin:-12px 0 16px">Enter a number, or 0 for no budget.</div>
      <div class="date-chips" style="justify-content:center;margin-bottom:20px">${[sp ? Math.ceil(sp / 10) * 10 : 0, ...[50, 100, 250].map(x => Math.ceil(((S.budgets[c] || 0) + x) / 10) * 10)].filter((v, i, a) => v && a.indexOf(v) === i).slice(0, 3).map(v => `<button type="button" class="fchip" data-set="${v}">${usd0.format(v)}</button>`).join('')}</div>
      <button class="btn block" type="submit">Save budget</button>
    </form>`);
  const f = document.getElementById('budForm'), inp = document.getElementById('fBud');
  f.addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b) { inp.value = b.dataset.set; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.focus(); } });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = parseFloat(inp.value.replace(/[^0-9.]/g, ''));
    const ok = !isNaN(v) && v >= 0 && v < 1e7;
    document.getElementById('eBud').classList.toggle('on', !ok); inp.setAttribute('aria-invalid', !ok);
    if (!ok) return inp.focus();
    S.budgets[c] = Math.round(v * 100) / 100; save(); closeSheet(); render(); toast(`${CATS[c].name} budget set to ${usd0.format(v)}`);
  });
}

function openConfirm(title, body, label, fn) {
  openSheet(`${sheetHead(title)}<p style="color:var(--text-2);font-size:15px;margin-bottom:20px">${body}</p>
    <div class="btn-row"><button class="btn ghost" data-action="close">Cancel</button><button class="btn danger" id="confirmBtn">${label}</button></div>`);
  document.getElementById('confirmBtn').onclick = () => { fn(); closeSheet(); render(); };
}

/* ---------- Toast ---------- */
const toastEl = document.getElementById('toast'); let toastT;
function toast(msg, undo) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) toastEl.querySelector('button').onclick = () => { undo(); toastEl.classList.remove('on'); };
  toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 4000);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { e.preventDefault(); go(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'add') openAdd();
    if (act === 'close') closeSheet();
    if (act === 'search') { go('activity'); setTimeout(() => document.getElementById('q').focus(), 50); }
    if (act === 'budgets') go('budget');
    if (act === 'export') exportCSV();
    if (act === 'reseed') openConfirm('Load sample data?', 'This replaces your transactions and budgets with example data.', 'Load sample', () => { S = sampleState(); save(); toast('Sample data loaded'); });
    if (act === 'clear') openConfirm('Start fresh?', 'All transactions are deleted and your balance is set to $0. Budgets are kept. This can’t be undone.', 'Delete all', () => { S.tx = []; S.opening = 0; save(); toast('All transactions deleted'); });
    return;
  }
  const tx = e.target.closest('[data-tx]'); if (tx) return openTx(tx.dataset.tx);
  const b = e.target.closest('[data-budget]'); if (b) return openBudget(b.dataset.budget);
  const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; renderFilters(); renderAll(); return; }
  const d = e.target.closest('[data-del]');
  if (d) {
    const idx = S.tx.findIndex(x => x.id === d.dataset.del); const [t] = S.tx.splice(idx, 1);
    save(); closeSheet(); render(); toast(`${t.merchant} deleted`, () => { S.tx.push(t); save(); render(); });
  }
});
backdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (sheet.hidden) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button, input')].filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.getElementById('q').addEventListener('input', renderAll);
document.addEventListener('input', e => { if (e.target.matches('.amount-field input')) e.target.style.width = Math.max(e.target.value.length || 4, 1) + 0.2 + 'ch'; });
document.addEventListener('keydown', e => { if (e.key === '/' && sheet.hidden && !e.target.matches('input')) { e.preventDefault(); go('activity'); setTimeout(() => document.getElementById('q').focus(), 50); } });
let mqW = matchMedia('(min-width: 720px)'); mqW.addEventListener('change', renderRecent);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (NAV.some(n => n[0] === v)) go(v); });

function exportCSV() {
  const rows = [['Date', 'Merchant', 'Category', 'Amount', 'Note'], ...sortTx(S.tx).map(t => [t.date, t.merchant, CATS[t.cat].name, t.amount.toFixed(2), t.note])];
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `fern-transactions-${key(TODAY)}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}

render();
</script>
</body>
</html>
