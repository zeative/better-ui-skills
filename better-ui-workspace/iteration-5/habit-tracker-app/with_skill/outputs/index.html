<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1FB">
<title>Daychain · habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: candy, tuned for a streak tracker.
   Lead: cobalt "clear sky" gradient (the daily card). Counter-accent: flame orange, used only for streaks.
   Own device: the chain. Consecutive ticked days are joined by a link, in the week strip and the logo. */
:root{
  --bg:#E9EEFA; --surface:#FFFFFF; --surface-2:#F0F3FC; --ink:#131A33; --ink-2:#4A5372; --ink-3:#626A88;
  --line:rgba(19,26,51,.09); --line-2:rgba(19,26,51,.16);
  --accent:#2447F9; --accent-ink:#FFFFFF; --accent-soft:#E4E9FF;
  --g-lead:linear-gradient(135deg,#1626B8 0%,#2447F9 48%,#2D6BF2 100%);
  --flame:#FF6A1A; --flame-ink:#B93A08; --flame-soft:#FFEBDD; --gold:#FFC83D;
  --dark:#131A33;
  --r-sm:14px; --r-md:22px; --r-lg:30px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(22,38,120,.06),0 2px 6px -2px rgba(22,38,120,.06);
  --sh-2:0 1px 2px rgba(22,38,120,.06),0 8px 18px -6px rgba(22,38,120,.14);
  --sh-3:0 2px 4px rgba(22,38,120,.06),0 16px 34px -10px rgba(22,38,120,.20),0 34px 64px -24px rgba(22,38,120,.18);
  --font:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(46% 38% at 12% 0%,rgba(45,107,242,.22),transparent 70%),
             radial-gradient(34% 30% at 96% 4%,rgba(255,106,26,.16),transparent 70%),
             radial-gradient(40% 36% at 70% 100%,rgba(36,71,249,.10),transparent 70%)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg{display:block}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 14px}
.brand{margin:0;line-height:1.5;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--g-lead);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px rgba(36,71,249,.7)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.datechip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-1);font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.datechip i{width:8px;height:8px;border-radius:50%;background:var(--flame);box-shadow:0 0 0 3px var(--flame-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:var(--r-pill);font-weight:600;font-size:16px;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(22,38,120,.3),0 10px 20px -8px rgba(36,71,249,.7);
  transition:transform .15s ease-out,box-shadow .15s ease-out}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(22,38,120,.3),0 14px 26px -8px rgba(36,71,249,.8)}}
.btn-quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--sh-1)}
@media (hover:hover){.btn-quiet:hover{box-shadow:var(--sh-2)}}
.btn-danger{background:#FFE9EC;color:#B3152F;box-shadow:none;border:1px solid rgba(179,21,47,.2)}
.btn-danger.armed{background:#C8173A;color:#fff}
.top .btn{display:none;height:42px;padding:0 18px;font-size:14px}

.layout{display:grid;gap:20px}
.col{display:grid;gap:16px;align-content:start;min-width:0}
body[data-tab="today"] .col-side{display:none}
body[data-tab="insights"] .col-main{display:none}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-lg);padding:20px;color:#fff;background:var(--g-lead);overflow:clip;isolation:isolate;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(22,38,120,.2),0 22px 40px -16px rgba(36,71,249,.6)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(60% 80% at 100% 0%,rgba(96,200,255,.55),transparent 62%),radial-gradient(50% 60% at 0% 100%,rgba(12,20,120,.55),transparent 70%)}
.hero-links{position:absolute;right:-30px;bottom:-44px;width:260px;opacity:.13;z-index:-1;transform:rotate(-14deg)}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);background:rgba(8,16,100,.38);
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero h2{font-size:28px;line-height:1.08;letter-spacing:-.025em;font-weight:700;margin-top:12px}
.hero-sub{font-size:14px;margin-top:8px;color:#fff;opacity:.92;max-width:34ch}
.ringbox{position:relative;width:116px;height:116px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:rgba(8,16,100,.35)}
.ring .val{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-c span{font-size:12px;font-weight:500;margin-top:3px}
.ring-flame{position:absolute;right:-8px;bottom:-6px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 6px 14px -4px rgba(8,16,100,.6)}
.ring-flame svg{width:26px;height:26px}
.ring-flame.off svg{filter:grayscale(1);opacity:.45}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px;padding:12px 10px 10px;border-radius:20px;background:rgba(8,16,100,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.wk{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600}
.wk .cap{width:100%;max-width:30px;height:44px;border-radius:10px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.wk .cap i{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:10px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.wk.full .cap i{background:linear-gradient(180deg,var(--gold),#FF9A3D)}
.wk.today .cap{box-shadow:0 0 0 2px #fff}
.wk small{font-size:12px;font-weight:500}

/* ---------- section head ---------- */
.shead{display:flex;align-items:center;gap:10px;padding:6px 4px 0}
.shead h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.count{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--accent-soft);color:#1B32C4;font-size:12px;font-weight:700}
.shead .hint{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}

/* ---------- habit card ---------- */
.list{display:grid;gap:12px;container-type:inline-size}
.habit{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"obj text check" "strip strip strip";gap:14px 12px;align-items:center;
  padding:16px;border-radius:var(--r-md);background:linear-gradient(180deg,#fff,#FAFBFF);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 #fff,var(--sh-1);transition:box-shadow .2s ease-out,transform .2s ease-out}
@media (hover:hover){.habit:hover{box-shadow:inset 0 1px 0 #fff,var(--sh-2);transform:translateY(-1px)}}
.h-obj{grid-area:obj;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 14%,transparent)}
.h-obj svg{width:44px;height:44px}
.h-text{grid-area:text;min-width:0}
.h-name{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:44px;margin:-8px 0;text-align:left;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;border-radius:8px;overflow-wrap:anywhere}
.h-name svg{flex:none;width:14px;height:14px;color:var(--ink-3);opacity:.7;transition:opacity .15s}
@media (hover:hover){.h-name:hover svg{opacity:1;color:var(--accent)}}
.h-name::after{content:"";position:absolute;left:0;top:0;width:calc(100% - 84px);height:84px} /* wider hit area: tap the card top to edit */
.h-meta{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.streak{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 6px;border-radius:var(--r-pill);background:var(--flame-soft);color:var(--flame-ink);font-size:12px;font-weight:600;white-space:nowrap}
.streak svg{width:18px;height:18px}
.streak b{font-size:16px;font-weight:700;letter-spacing:-.02em;color:#8A2A04}
.streak.cold{background:var(--surface-2);color:var(--ink-2)}
.streak.cold b{color:var(--ink)}
.streak.cold svg{filter:grayscale(1);opacity:.5}
.streak.risk{background:#fff;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--flame) 55%,transparent)}
.best{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.best svg{width:12px;height:12px;color:#B7860B}

.check{grid-area:check;position:relative;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--surface);
  border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);
  transition:transform .15s ease-out,background-color .2s,border-color .2s,box-shadow .2s}
.check svg{width:28px;height:28px;stroke-dasharray:30;stroke-dashoffset:0;opacity:.35;transition:opacity .2s}
@media (hover:hover){.check:hover{background:var(--accent-soft)}.check:hover svg{opacity:.8}}
.check:active{transform:scale(.92)}
.check[aria-pressed="true"]{background:var(--g-lead);border:0;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 3px rgba(22,38,120,.25),0 12px 20px -8px rgba(36,71,249,.75)}
.check[aria-pressed="true"] svg{opacity:1}
.check.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.check.pop svg{animation:draw .4s .08s ease-out backwards}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}

.strip{grid-area:strip;display:grid;grid-template-columns:repeat(7,1fr);padding:8px 2px 6px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(22,38,120,.06)}
.day{position:relative;display:grid;justify-items:center;gap:4px;min-height:56px;padding:2px 0;font-size:12px;font-weight:600;color:var(--ink-3);border-radius:12px}
.day .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink-2);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .15s ease-out,background-color .2s}
.day .dot svg{width:16px;height:16px}
.day.on .dot{background:var(--c);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 6px -2px color-mix(in srgb,var(--c) 60%,transparent)}
.day.on.linked::before{content:"";position:absolute;right:50%;width:100%;bottom:13px;height:10px;background:color-mix(in srgb,var(--c) 55%,#fff)} /* the chain link */
.day.today{color:var(--ink)}
.day.today .dot{box-shadow:inset 0 0 0 2px var(--c)}
.day.today.on .dot{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px #fff,0 0 0 4px var(--c)}
.day:active .dot{transform:scale(.88)}
@media (hover:hover){.day:not(.on):hover .dot{background:color-mix(in srgb,var(--c) 14%,#fff)}}

@container (min-width:600px){
  .habit{grid-template-columns:auto minmax(0,1fr) 290px auto;grid-template-areas:"obj text strip check";padding:16px 18px;gap:16px}
  .h-name::after{width:calc(100% - 400px)}
}

/* ---------- empty state ---------- */
.empty{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,var(--sh-2);padding:28px 20px 24px;text-align:center;overflow:hidden;position:relative}
.empty-art{position:relative;height:150px;max-width:320px;margin:0 auto 12px}
.empty-art .o{position:absolute;display:grid;place-items:center;border-radius:22px;background:#fff;box-shadow:var(--sh-3);border:1px solid var(--line)}
.empty-art .o svg{width:70%;height:70%}
.empty-art .o1{left:50%;top:16px;width:104px;height:104px;margin-left:-52px;border-radius:30px;z-index:2;background:var(--g-lead);border:0}
.empty-art .o2{left:6%;top:36px;width:70px;height:70px;transform:rotate(-8deg)}
.empty-art .o3{right:6%;top:30px;width:70px;height:70px;transform:rotate(7deg)}
.empty-art .o4{left:26%;top:98px;width:48px;height:48px;transform:rotate(6deg);z-index:3}
.empty-art .o5{right:25%;top:100px;width:48px;height:48px;transform:rotate(-6deg);z-index:3}
.empty h2{font-size:28px;letter-spacing:-.025em;line-height:1.1;font-weight:700}
.empty p{color:var(--ink-2);max-width:40ch;margin:8px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-2);font-size:14px;font-weight:600;
  box-shadow:var(--sh-1);transition:transform .15s ease-out,box-shadow .15s ease-out,border-color .15s}
.chip svg{width:28px;height:28px}
.chip:active{transform:scale(.96)}
@media (hover:hover){.chip:hover{box-shadow:var(--sh-2);border-color:var(--accent);transform:translateY(-1px)}}

/* ---------- insights ---------- */
.card{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,var(--sh-1);padding:18px}
.card-h{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.card-h h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card-h span{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3)}

.champ{position:relative;border-radius:var(--r-md);padding:18px;color:#fff;background:var(--dark);overflow:clip;isolation:isolate;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 16px 30px -14px rgba(19,26,51,.7);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.champ::before{content:"";position:absolute;z-index:-1;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,26,.55),transparent 65%)}
.champ .lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#C6CCE6}
.champ .big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.champ .big b{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.champ .big span{font-size:16px;font-weight:500;color:#DDE1F3}
.champ .who{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:32px;padding:0 12px 0 6px;border-radius:var(--r-pill);background:rgba(255,255,255,.1);font-size:14px;font-weight:500;max-width:100%}
.champ .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ .who svg{width:22px;height:22px;flex:none}
.champ-art{width:96px;height:96px;filter:drop-shadow(0 10px 18px rgba(255,106,26,.5))}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,var(--sh-1);padding:12px;display:grid;gap:2px;min-width:0}
.kpi .viz{height:30px;display:flex;align-items:center;margin-bottom:6px}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12px;font-weight:500;color:var(--ink-3);line-height:1.3;min-height:2.6em}
.kpi .dots{display:flex;gap:3px}
.kpi .dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.kpi .dots i.y{background:var(--gold);box-shadow:inset 0 0 0 1px #D99A00}
.kpi .mini-ring{width:30px;height:30px;transform:rotate(-90deg)}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .hd{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cell{position:relative;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.cell.l1{background:color-mix(in srgb,var(--accent) 16%,#fff);color:var(--ink)}
.cell.l2{background:color-mix(in srgb,var(--accent) 36%,#fff);color:var(--ink)}
.cell.l3{background:color-mix(in srgb,var(--accent) 60%,#fff);color:var(--ink)}
.cell.l4{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.cell.l4::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.fut{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:5px;margin-top:14px;font-size:12px;font-weight:500;color:var(--ink-3)}
.legend i{width:16px;height:16px;border-radius:5px}
.legend .gap{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.legend .gap i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--accent)}

.bars{position:relative;display:grid;grid-template-columns:28px 1fr;gap:0 8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:120px;font-size:12px;color:var(--ink-3);font-weight:500;text-align:right;line-height:1}
.plot{position:relative;height:120px;display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 50%,linear-gradient(0deg,var(--line-2) 1px,transparent 1px) 0 100%/100% 100% no-repeat}
.bar{position:relative;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--accent) 28%,#fff);min-height:3px}
.bar.full{background:var(--accent)}
.bar.now{background:var(--flame)}
.bar.now::after{content:attr(data-v);position:absolute;right:-2px;bottom:calc(100% + 6px);padding:2px 7px;border-radius:8px;background:var(--dark);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.xax{grid-column:2;display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:6px;font-size:12px;color:var(--ink-3);font-weight:500;text-align:center}
.xax span{white-space:nowrap;overflow:visible;justify-self:center}

.rank{display:grid;gap:12px}
.rk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.rk .ob{grid-row:span 2;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff)}
.rk .ob svg{width:34px;height:34px}
.rk .nm{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.rk .sv{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--ink)}
.rk .sv svg{width:16px;height:16px}
.rk .sv.cold svg{filter:grayscale(1);opacity:.5}
.rk .tr{grid-column:2;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.rk .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.rk .bs{font-size:12px;font-weight:500;color:var(--ink-3);text-align:right;white-space:nowrap}
.muted{color:var(--ink-3);font-size:14px}

/* ---------- tab bar (phone) ---------- */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;
  width:min(340px,calc(100% - 32px));padding:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 4px rgba(22,38,120,.08),0 18px 36px -10px rgba(22,38,120,.35)}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2);transition:background-color .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--accent-soft);color:#1B32C4}
.fab{width:56px;height:56px;border-radius:50%;background:var(--g-lead);color:#fff;display:grid;place-items:center;margin:-14px 4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 5px #fff,0 14px 24px -6px rgba(36,71,249,.8);transition:transform .15s ease-out}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}

/* ---------- sheet ---------- */
dialog{border:0;padding:0;color:var(--ink);background:var(--surface);width:100%;max-width:100%;margin:auto 0 0;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92dvh;overflow:auto;
  box-shadow:0 -20px 60px -10px rgba(19,26,51,.4)}
dialog::backdrop{background:rgba(19,26,51,.5);backdrop-filter:blur(4px)}
dialog[open]{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{padding:10px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:18px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.x{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:18px;height:18px}
.field label,.legend-l{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.field input{width:100%;height:52px;padding:0 16px;border-radius:var(--r-sm);background:var(--surface-2);border:1.5px solid var(--line-2);font-size:16px;font-weight:500;outline:0;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--ink-3)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:#fff}
.field.bad input{border-color:#C8173A;box-shadow:0 0 0 4px #FFE9EC}
.err{display:none;margin-top:6px;font-size:14px;color:#B3152F;font-weight:500}
.field.bad .err{display:block}
.sugg{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none}
fieldset{border:0;padding:0;margin:0;min-width:0}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ic{position:relative;display:grid;place-items:center;aspect-ratio:1;max-height:68px;width:100%;border-radius:18px;background:var(--surface-2);cursor:pointer;transition:transform .15s ease-out,background-color .15s}
.ic svg{width:60%;height:60%}
.ic input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.ic:has(input:checked){background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 0 0 2.5px var(--c)}
.ic:has(input:focus-visible){outline:2.5px solid var(--accent);outline-offset:2px}
.ic:active{transform:scale(.94)}
.sheet-f{display:flex;gap:10px}
.sheet-f .btn{flex:1;height:52px}
.sheet-f .btn-danger{flex:0 0 auto}

.burst{position:fixed;z-index:50;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:8px;height:8px;border-radius:3px;animation:fly .7s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg) scale(.3);opacity:0}}

.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ---------- tablet: both sections, stacked ---------- */
@media (min-width:720px){
  .wrap{padding:0 28px 48px}
  .top{padding:22px 0 20px}
  .top .btn{display:inline-flex}
  .tabbar{display:none}
  body[data-tab] .col-main,body[data-tab] .col-side{display:grid}
  .col-side{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .col-side .card-bars{grid-column:1/-1;order:5}
  .col-side .kpis{align-content:stretch}
  .hero{padding:28px}
  .hero h2{font-size:44px;letter-spacing:-.03em;line-height:1.02}
  .hero-sub{font-size:16px;margin-top:10px}
  .ringbox{width:148px;height:148px}
  .ring-c b{font-size:44px}
  .ring-c span{font-size:14px}
  .ring-flame{width:48px;height:48px}.ring-flame svg{width:32px;height:32px}
  .week{gap:10px;padding:14px 16px 12px;margin-top:24px}
  .wk .cap{max-width:48px;height:52px;border-radius:14px}
  .wk .cap i{border-radius:14px}
  .hero-links{width:340px}
  dialog{width:480px;margin:auto;border-radius:var(--r-lg)}
  .grab{display:none}
  .sheet{padding:22px 24px 24px}
  .sugg{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .empty{padding:44px 32px 36px}
}
/* ---------- desktop: list beside insights ---------- */
@media (min-width:1080px){
  .layout{grid-template-columns:minmax(0,1.62fr) minmax(340px,1fr);gap:24px;align-items:start}
  .col-side{grid-template-columns:1fr;position:sticky;top:20px}
  .col-side .card-bars{order:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

(() => {
  'use strict';
  const KEY = 'daychain.v1';
  const ICONS = {
    drop:{c:'#2563EB',label:'Water'}, book:{c:'#7C3AED',label:'Book'}, shoe:{c:'#C2410C',label:'Shoe'},
    moon:{c:'#4338CA',label:'Moon'}, dumbbell:{c:'#0E7490',label:'Dumbbell'}, leaf:{c:'#0F7B55',label:'Leaf'},
    apple:{c:'#D11A4A',label:'Apple'}, pencil:{c:'#B45309',label:'Pencil'}, note:{c:'#C0267B',label:'Music'}, star:{c:'#A16207',label:'Star'}
  };
  const SUGGEST = [['Drink 2 litres of water','drop'],['Read 20 pages','book'],['Go for a walk','shoe'],['Lights out by 11','moon'],
                   ['Workout','dumbbell'],['Meditate','leaf'],['Eat some fruit','apple'],['Write in journal','pencil'],['Practise guitar','note']];
  const DOW = ['S','M','T','W','T','F','S'];
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const obj = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#o-${id}"/></svg>`;

  /* ----- dates (local time, keyed YYYY-MM-DD) ----- */
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const shift = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  let today = keyOf(new Date());
  const lastDays = n => Array.from({ length: n }, (_, i) => shift(today, i - n + 1));

  /* ----- state ----- */
  let state = { habits: [] };
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && Array.isArray(raw.habits)) state = raw; } catch (e) {}
  state.habits.forEach(h => { h.done = h.done || {}; if (!ICONS[h.icon]) h.icon = 'star'; h.created = h.created || today; });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  /* ----- streak maths ----- */
  function streaks(h) {
    let cur = 0, k = h.done[today] ? today : shift(today, -1);
    while (h.done[k]) { cur++; k = shift(k, -1); }
    let best = 0, run = 0, prev = null;
    Object.keys(h.done).sort().forEach(d => { run = prev && shift(prev, 1) === d ? run + 1 : 1; if (run > best) best = run; prev = d; });
    return { cur, best: Math.max(best, cur) };
  }
  const activeOn = k => state.habits.filter(h => h.created <= k || h.done[k]);
  function dayStat(k) { const a = activeOn(k); const done = a.filter(h => h.done[k]).length; return { done, total: a.length, pct: a.length ? done / a.length : 0 }; }
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  /* ----- render: today column ----- */
  function renderMain() {
    const el = $('#main'), hs = state.habits;
    if (!hs.length) {
      el.innerHTML = `
      <div class="empty">
        <div class="empty-art" aria-hidden="true">
          <span class="o o2">${obj('book')}</span><span class="o o3">${obj('shoe')}</span>
          <span class="o o1">${obj('flame')}</span>
          <span class="o o4">${obj('drop')}</span><span class="o o5">${obj('leaf')}</span>
        </div>
        <h2>Start your first chain</h2>
        <p>Pick a habit, tick it off each day, and watch the days link up into a streak.</p>
        <div class="chips">${SUGGEST.slice(0, 6).map(([n, i]) => `<button class="chip" type="button" data-quick="${esc(n)}" data-icon="${i}">${obj(i)}${esc(n)}</button>`).join('')}</div>
        <button class="btn" type="button" data-act="add"><svg width="18" height="18" aria-hidden="true"><use href="#i-plus"/></svg>Add your own</button>
      </div>`;
      return;
    }
    const t = dayStat(today), left = t.total - t.done, alive = hs.filter(h => streaks(h).cur > 0).length;
    const title = left === 0 ? 'Perfect day. Every habit ticked.' : t.done === 0 ? `${plural(left, 'habit')} waiting for you` : `${left} to go, keep the chain`;
    const sub = left === 0 ? 'Nothing left for today. See you tomorrow.' : alive ? `${plural(alive, 'streak')} alive right now. Tick today to keep them.` : 'Tick one off to start a streak.';
    const C = 2 * Math.PI * 46, days = lastDays(7);
    const d = fromKey(today);
    el.innerHTML = `
    <div class="hero">
      <svg class="hero-links" viewBox="0 0 260 120" fill="none" stroke="#fff" stroke-width="16" aria-hidden="true"><rect x="10" y="30" width="100" height="60" rx="30"/><rect x="80" y="30" width="100" height="60" rx="30"/><rect x="150" y="30" width="100" height="60" rx="30"/></svg>
      <div class="hero-top">
        <div>
          <span class="eyebrow">${d.toLocaleDateString(undefined, { weekday: 'long' })}</span>
          <h2>${title}</h2>
          <p class="hero-sub">${sub}</p>
        </div>
        <div class="ringbox" role="img" aria-label="${t.done} of ${t.total} habits done today">
          <svg class="ring" viewBox="0 0 116 116"><circle class="trk" cx="58" cy="58" r="46"/><circle class="val" cx="58" cy="58" r="46" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - t.pct)}"/></svg>
          <div class="ring-c"><b class="num">${t.done}/${t.total}</b><span>done</span></div>
          <span class="ring-flame ${alive ? '' : 'off'}">${obj('flame')}</span>
        </div>
      </div>
      <div class="week" role="img" aria-label="Last 7 days: ${days.map(k => { const s = dayStat(k); return `${s.done} of ${s.total}`; }).join(', ')}">
        ${days.map(k => { const s = dayStat(k); return `<div class="wk ${k === today ? 'today' : ''} ${s.total && s.done === s.total ? 'full' : ''}"><span>${DOW[fromKey(k).getDay()]}</span><div class="cap"><i style="height:${Math.round(s.pct * 100)}%"></i></div><small class="num">${s.total ? s.done + '/' + s.total : '–'}</small></div>`; }).join('')}
      </div>
    </div>
    <div class="shead"><h2>Your habits</h2><span class="count num">${hs.length}</span><span class="hint">Tap a past day to fix it</span></div>
    <div class="list">${hs.map(h => habitCard(h, days)).join('')}</div>`;
  }

  function habitCard(h, days) {
    const s = streaks(h), on = !!h.done[today], c = ICONS[h.icon].c;
    const cls = s.cur === 0 ? 'cold' : on ? '' : 'risk';
    const label = s.cur === 0 ? 'No streak yet' : `day${s.cur === 1 ? '' : 's'}${on ? '' : ' · tick today'}`;
    return `
    <article class="habit" style="--c:${c}" data-id="${h.id}">
      <div class="h-obj">${obj(h.icon)}</div>
      <div class="h-text">
        <h3><button class="h-name" type="button" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}"><span>${esc(h.name)}</span><svg aria-hidden="true"><use href="#i-edit"/></svg></button></h3>
        <div class="h-meta">
          <span class="streak ${cls}">${obj('flame')}${s.cur ? `<b class="num">${s.cur}</b>` : ''}${label}</span>
          ${s.best > 0 ? `<span class="best"><svg aria-hidden="true"><use href="#i-trophy"/></svg>Best ${s.best}</span>` : ''}
        </div>
      </div>
      <button class="check" type="button" data-toggle="${h.id}" data-day="${today}" data-main aria-pressed="${on}" aria-label="${esc(h.name)}: ${on ? 'done today, tap to undo' : 'mark done today'}"><svg aria-hidden="true"><use href="#i-check"/></svg></button>
      <div class="strip">
        ${days.map((k, i) => { const d = fromKey(k), isOn = !!h.done[k], linked = isOn && i > 0 && h.done[days[i - 1]];
          return `<button class="day ${isOn ? 'on' : ''} ${linked ? 'linked' : ''} ${k === today ? 'today' : ''}" type="button" data-toggle="${h.id}" data-day="${k}" aria-pressed="${isOn}" aria-label="${d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}: ${isOn ? 'done' : 'not done'}"><span aria-hidden="true">${DOW[d.getDay()]}</span><span class="dot num" aria-hidden="true">${isOn ? '<svg><use href="#i-check"/></svg>' : d.getDate()}</span></button>`; }).join('')}
      </div>
    </article>`;
  }

  /* ----- render: insights column ----- */
  function renderSide() {
    const el = $('#side'), hs = state.habits;
    const ranked = hs.map(h => ({ h, ...streaks(h) })).sort((a, b) => b.cur - a.cur || b.best - a.best);
    const top = ranked[0];
    const total = hs.reduce((n, h) => n + Object.keys(h.done).length, 0);
    const d30 = lastDays(30).map(dayStat), sum = d30.reduce((a, s) => ({ d: a.d + s.done, t: a.t + s.total }), { d: 0, t: 0 });
    const rate = sum.t ? Math.round(sum.d / sum.t * 100) : 0;
    const allKeys = new Set(); hs.forEach(h => Object.keys(h.done).forEach(k => allKeys.add(k)));
    const perfect = [...allKeys].filter(k => { const s = dayStat(k); return s.total && s.done === s.total; }).length;
    const d7 = lastDays(7).map(dayStat), mx = Math.max(1, ...d7.map(s => s.done));
    const spark = d7.map((s, i) => `${4 + i * 12},${26 - s.done / mx * 22}`).join(' ');
    const Cr = 2 * Math.PI * 12;

    // calendar: five weeks, Monday first, ending with this week
    const td = fromKey(today), monOff = (td.getDay() + 6) % 7, start = shift(today, -monOff - 28);
    const cells = Array.from({ length: 35 }, (_, i) => { const k = shift(start, i); if (k > today) return `<div class="cell fut num">${fromKey(k).getDate()}</div>`;
      const s = dayStat(k), l = !s.total || !s.done ? 0 : s.done === s.total ? 4 : Math.min(3, Math.ceil(s.pct * 3));
      return `<div class="cell l${l} ${k === today ? 'now' : ''} num">${fromKey(k).getDate()}</div>`; }).join('');

    const d14k = lastDays(14), d14 = d14k.map(dayStat);

    el.innerHTML = `
    <div class="champ">
      <div>
        <p class="lbl">Longest live streak</p>
        <p class="big"><b class="num">${top ? top.cur : 0}</b><span>day${top && top.cur === 1 ? '' : 's'} in a row</span></p>
        ${top && top.cur ? `<span class="who">${obj(top.h.icon)}<span>${esc(top.h.name)}</span></span>` : `<span class="who">${obj('star')}<span>Tick a habit to light it</span></span>`}
      </div>
      ${obj('flame', 'champ-art')}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="viz"><svg width="80" height="30" viewBox="0 0 80 30" aria-hidden="true"><polyline points="${spark}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="${26 - d7[6].done / mx * 22}" r="3.5" fill="var(--accent)"/></svg></div><b class="num">${total}</b><span>check-ins, all time</span></div>
      <div class="kpi"><div class="viz"><div class="dots" aria-hidden="true">${d7.map(s => `<i class="${s.total && s.done === s.total ? 'y' : ''}"></i>`).join('')}</div></div><b class="num">${perfect}</b><span>perfect days</span></div>
      <div class="kpi"><div class="viz"><svg class="mini-ring" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--surface-2)" stroke-width="5"/><circle cx="15" cy="15" r="12" fill="none" stroke="#0F9D6B" stroke-width="5" stroke-linecap="round" stroke-dasharray="${Cr}" stroke-dashoffset="${Cr * (1 - rate / 100)}"/></svg></div><b class="num">${rate}%</b><span>done, last 30 days</span></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Last five weeks</h2><span>${fromKey(start).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} to today</span></div>
      <div class="heat" role="img" aria-label="Calendar of the last five weeks. ${perfect} perfect days in total.">
        ${['M','T','W','T','F','S','S'].map(x => `<div class="hd">${x}</div>`).join('')}${cells}
      </div>
      <div class="legend"><span>None</span><i style="background:var(--surface-2)"></i><i style="background:color-mix(in srgb,var(--accent) 16%,#fff)"></i><i style="background:color-mix(in srgb,var(--accent) 36%,#fff)"></i><i style="background:color-mix(in srgb,var(--accent) 60%,#fff)"></i><i style="background:var(--accent)"></i><span>All</span><span class="gap"><i></i>Perfect day</span></div>
    </div>
    <div class="card card-bars">
      <div class="card-h"><h2>Daily completion</h2><span>Last 14 days</span></div>
      <div class="bars" role="img" aria-label="Share of habits done each day for the last 14 days. Today ${Math.round(d14[13].pct * 100)} percent.">
        <div class="yax"><span>100</span><span>50</span><span>0%</span></div>
        <div class="plot">${d14.map((s, i) => `<div class="bar ${i === 13 ? 'now' : s.total && s.done === s.total ? 'full' : ''}" style="height:${Math.round(s.pct * 100)}%" data-v="${Math.round(s.pct * 100)}% today"></div>`).join('')}</div>
        <div class="xax">${d14k.map((k, i) => `<span>${i % 3 === 1 ? fromKey(k).getDate() + ' ' + fromKey(k).toLocaleDateString(undefined, { month: 'short' }) : ''}</span>`).join('')}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Streak board</h2><span>Current vs best</span></div>
      ${ranked.length ? `<div class="rank">${ranked.map(r => `
        <div class="rk" style="--c:${ICONS[r.h.icon].c}">
          <span class="ob">${obj(r.h.icon)}</span>
          <span class="nm">${esc(r.h.name)}</span>
          <span class="sv num ${r.cur ? '' : 'cold'}">${obj('flame')}${r.cur}</span>
          <span class="tr"><i style="width:${r.best ? Math.max(4, r.cur / r.best * 100) : 0}%"></i></span>
          <span class="bs num">best ${r.best}</span>
        </div>`).join('')}</div>` : `<p class="muted">Your habits will line up here, longest streak first.</p>`}
    </div>`;
  }

  function render(keepFocus) {
    const dn = fromKey(today);
    $('#dateChip').textContent = dn.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    let sel = null;
    const a = document.activeElement;
    if (keepFocus && a && a.dataset) {
      if (a.dataset.toggle) sel = `[data-toggle="${a.dataset.toggle}"][data-day="${a.dataset.day}"]${a.hasAttribute('data-main') ? '[data-main]' : ':not([data-main])'}`;
    }
    renderMain(); renderSide();
    if (sel) { const n = $(sel); if (n) n.focus({ preventScroll: true }); }
  }

  /* ----- actions ----- */
  function burst(el, big) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = el.getBoundingClientRect(), b = document.createElement('div');
    b.className = 'burst'; b.style.left = r.left + r.width / 2 + 'px'; b.style.top = r.top + r.height / 2 + 'px';
    const cols = ['#2447F9', '#FF6A1A', '#FFC83D', '#19B8F5', '#fff'], n = big ? 26 : 10;
    for (let i = 0; i < n; i++) { const p = document.createElement('i'), ang = Math.PI * 2 * i / n + Math.random() * .5, dist = (big ? 70 : 34) + Math.random() * (big ? 110 : 26);
      p.style.background = cols[i % cols.length]; p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist + 'px'); b.appendChild(p); }
    document.body.appendChild(b); setTimeout(() => b.remove(), 800);
  }

  function toggle(id, day, isMain) {
    const h = state.habits.find(x => x.id === id); if (!h) return;
    const wasAll = dayStat(today).pct === 1;
    if (h.done[day]) delete h.done[day]; else { h.done[day] = 1; if (day < h.created) h.created = day; }
    save(); render(true);
    if (h.done[day]) {
      const btn = $(`.habit[data-id="${id}"] .check`);
      if (day === today && btn) { btn.classList.add('pop'); burst(btn, false); }
      if (!isMain) { const dot = $(`.habit[data-id="${id}"] .day[data-day="${day}"] .dot`); if (dot && day !== today) burst(dot, false); }
      if (!wasAll && dayStat(today).pct === 1) { const ring = $('.ringbox'); if (ring) setTimeout(() => burst(ring, true), 150); }
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    }
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function addHabit(name, icon) { state.habits.push({ id: uid(), name: name.trim().slice(0, 40), icon, created: today, done: {} }); save(); render(); }

  /* ----- sheet ----- */
  const sheet = $('#sheet'), form = $('#form'), nameIn = $('#name'), delBtn = $('#del');
  let editing = null;
  $('#icons').innerHTML = Object.entries(ICONS).map(([id, v]) => `<label class="ic" style="--c:${v.c}"><input type="radio" name="icon" value="${id}"><span class="vh">${v.label}</span>${obj(id)}</label>`).join('');
  $('#sugg').innerHTML = SUGGEST.map(([n, i]) => `<button class="chip" type="button" data-fill="${esc(n)}" data-icon="${i}">${obj(i)}${esc(n)}</button>`).join('');
  const pick = icon => { const r = form.querySelector(`input[name="icon"][value="${icon}"]`); if (r) r.checked = true; };

  function openSheet(id) {
    editing = id ? state.habits.find(h => h.id === id) : null;
    $('#sheetTitle').textContent = editing ? 'Edit habit' : 'New habit';
    $('#save').textContent = editing ? 'Save changes' : 'Add habit';
    $('#sugg').hidden = !!editing; $('#sugg').style.display = editing ? 'none' : '';
    delBtn.hidden = !editing; delBtn.classList.remove('armed'); delBtn.textContent = 'Delete';
    $('#nameField').classList.remove('bad');
    nameIn.value = editing ? editing.name : '';
    const used = state.habits.map(h => h.icon);
    pick(editing ? editing.icon : (Object.keys(ICONS).find(i => !used.includes(i)) || 'star'));
    sheet.showModal();
    if (!editing && matchMedia('(min-width:720px)').matches) nameIn.focus(); else if (!editing) $('.x').focus();
  }
  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = nameIn.value.trim(), icon = (form.querySelector('input[name="icon"]:checked') || {}).value || 'star';
    if (!name) { $('#nameField').classList.add('bad'); nameIn.focus(); return; }
    if (editing) { editing.name = name.slice(0, 40); editing.icon = icon; save(); render(); } else addHabit(name, icon);
    sheet.close();
  });
  nameIn.addEventListener('input', () => $('#nameField').classList.remove('bad'));
  delBtn.addEventListener('click', () => {
    if (!delBtn.classList.contains('armed')) { delBtn.classList.add('armed'); delBtn.textContent = 'Tap again to delete'; return; }
    state.habits = state.habits.filter(h => h !== editing); save(); render(); sheet.close();
  });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

  /* ----- events ----- */
  function setTab(t) { document.body.dataset.tab = t; document.querySelectorAll('.tab').forEach(b => b.dataset.tab === t ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); window.scrollTo(0, 0); }
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.toggle) toggle(t.dataset.toggle, t.dataset.day, t.hasAttribute('data-main'));
    else if (t.dataset.edit) openSheet(t.dataset.edit);
    else if (t.dataset.act === 'add') openSheet();
    else if (t.dataset.act === 'close') sheet.close();
    else if (t.dataset.tab) setTab(t.dataset.tab);
    else if (t.dataset.quick) addHabit(t.dataset.quick, t.dataset.icon);
    else if (t.dataset.fill) { nameIn.value = t.dataset.fill; pick(t.dataset.icon); $('#nameField').classList.remove('bad'); }
  });
  const roll = () => { const k = keyOf(new Date()); if (k !== today) { today = k; render(); } };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) roll(); });
  setInterval(roll, 30000);

  setTab(location.hash === '#insights' ? 'insights' : 'today');
  render();
})();
</script>
</body>
</html>
