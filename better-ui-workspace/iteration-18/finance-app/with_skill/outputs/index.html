<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerly</title>
<meta name="theme-color" content="#F4F4F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — light grey canvas, near-black brand, pink / butter / sky blocks, Urbanist */
:root {
  --font: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F2F0; --surface: #FFFFFF; --surface-2: #F6F6F4; --line: rgba(13,13,13,.08);
  --text: #0D0D0D; --text-2: #5C5C63; --text-3: #8B8B92;
  --brand: #0D0D0D; --on-brand: #FFFFFF;
  --pink: #FFD6E0; --butter: #FFEFB0; --sky: #D2E6FF; --lilac: #E4DCFF; --peach: #FFDFC6; --mint: #D1F0DC;
  --ok: #15803D; --ok-tint: #E3F6EA; --warn: #B45309; --warn-tint: #FEF3DC; --bad: #C2263A; --bad-tint: #FDE8EB;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(13,13,13,.04), 0 1px 1px rgba(13,13,13,.03);
  --sh-2: 0 1px 2px rgba(13,13,13,.04), 0 8px 24px -12px rgba(13,13,13,.12);
  --sh-float: 0 12px 32px -8px rgba(13,13,13,.22);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; font-weight: 500; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
ul { list-style: none; margin: 0; padding: 0; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px 16px; }
.topbar .t-text { flex: 1; min-width: 0; }
.t-kicker { font-size: 14px; color: var(--text-2); font-weight: 500; }
.topbar h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--surface);
  box-shadow: var(--sh-1); border: 1px solid var(--line); transition: transform .15s ease-out, background-color .15s ease-out; }
.icon-btn:active { transform: scale(.95); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }
.avatar { width: 44px; height: 44px; border-radius: var(--r-full); background: var(--pink); overflow: hidden; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.avatar img { width: 100%; height: 100%; }
.t-search { display: none; }
.topbar .t-add { display: none; }

.content { padding: 0 16px calc(104px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
.view[hidden] { display: none; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + var(--safe-b)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 500; color: var(--text-2); border-radius: var(--r-sm); }
.tab svg.i { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] svg.i { stroke-width: 2.2; }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--text); }
.tab-add { justify-self: center; width: 56px; height: 56px; border-radius: var(--r-full); background: var(--brand); color: #fff; display: grid; place-items: center;
  transform: translateY(-14px); box-shadow: 0 0 0 5px var(--canvas), var(--sh-float); transition: transform .15s ease-out; }
.tab-add:active { transform: translateY(-14px) scale(.95); }
.tab-add svg.i { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Cards ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.see-all { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; color: var(--text); padding: 6px 4px 6px 12px; border-radius: var(--r-full); min-height: 40px; margin: -4px -4px -4px 0; }
.see-all svg.i { width: 16px; height: 16px; }
@media (hover: hover) { .see-all:hover { background: var(--surface-2); } }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

/* Balance card */
.bal-card { position: relative; overflow: clip; background: var(--brand); color: #fff; border-radius: var(--r-lg); padding: 20px; min-height: 200px;
  display: flex; flex-direction: column; box-shadow: 0 2px 4px rgba(13,13,13,.1), 0 20px 40px -18px rgba(13,13,13,.5); isolation: isolate; }
.bal-card::before { content: ""; position: absolute; z-index: -1; width: 320px; height: 320px; right: -120px; top: -160px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,214,224,.22), transparent); }
.spark { height: 48px; margin: 16px 0 0; }
.spark svg { width: 100%; height: 100%; overflow: visible; }
.bal-top { display: flex; align-items: center; gap: 8px; }
.bal-lbl { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.72); }
.eye { width: 40px; height: 40px; border-radius: var(--r-full); display: grid; place-items: center; color: rgba(255,255,255,.8); margin: -6px 0; }
.eye svg.i { width: 18px; height: 18px; }
@media (hover: hover) { .eye:hover { background: rgba(255,255,255,.1); } }
.network { display: flex; }
.network i { width: 26px; height: 26px; border-radius: 50%; background: var(--pink); }
.network i + i { background: var(--butter); margin-left: -10px; mix-blend-mode: multiply; }
.bal-fig { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 8px; }
.bal-fig .c { color: rgba(255,255,255,.55); font-weight: 600; }
.bal-delta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.72); }
.bal-delta .pill { background: rgba(209,240,220,.16); color: #A7EBC0; }
.bal-delta .pill.down { background: rgba(255,214,224,.16); color: #FFB3C6; }
.bal-bottom { margin-top: auto; padding-top: 16px; display: flex; align-items: flex-end; justify-content: space-between; }
.bal-acct { font-size: 13px; color: rgba(255,255,255,.72); }
.bal-num { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
.emv { margin-left: auto; width: 36px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #FFF3C4, #E9CF73); position: relative; overflow: hidden; }
.emv::before { content: ""; position: absolute; inset: 6px 0; border-top: 1px solid rgba(13,13,13,.25); border-bottom: 1px solid rgba(13,13,13,.25); }
.emv::after { content: ""; position: absolute; inset: 0 13px; border-left: 1px solid rgba(13,13,13,.25); border-right: 1px solid rgba(13,13,13,.25); }

/* Quick actions */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.action { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text); padding: 4px 0; border-radius: var(--r-md); }
.action .a-ic { width: 52px; height: 52px; border-radius: var(--r-full); background: var(--surface); display: grid; place-items: center; box-shadow: var(--sh-2); transition: transform .15s ease-out, background-color .15s ease-out; }
.action:active .a-ic { transform: scale(.94); }
@media (hover: hover) { .action:hover .a-ic { background: var(--surface-2); } }

/* Colour block tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 4px; min-height: 152px; }
.tile.butter { background: var(--butter); }
.tile.sky { background: var(--surface); box-shadow: var(--sh-2); }
.tile.sky .tile-ic { background: var(--sky); color: #1D58A0; }
.tile.sky .tile-lbl, .tile.sky .tile-sub { color: var(--text-2); }
.tile-ic { width: 36px; height: 36px; border-radius: var(--r-full); background: rgba(255,255,255,.7); display: grid; place-items: center; margin-bottom: 8px; }
.tile-ic svg.i { width: 18px; height: 18px; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; }
.tile-lbl { font-size: 13px; font-weight: 500; color: #3F3F45; }
.tile-fig { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.tile-sub { font-size: 13px; color: #3F3F45; margin-top: auto; }
.mini-bars { display: flex; align-items: flex-end; gap: 4px; height: 36px; }
.mini-bars span { width: 8px; border-radius: var(--r-full); background: rgba(13,13,13,.22); min-height: 3px; }
.mini-bars span.today { background: var(--brand); }

/* Budget card (pink block) */
.budget { background: var(--pink); border-radius: var(--r-lg); padding: 20px; }
.budget .b-head { display: flex; align-items: center; gap: 10px; }
.budget .b-head .tile-ic { margin: 0; }
.budget .b-title { font-size: 14px; font-weight: 600; flex: 1; }
.budget .see-all:hover { background: rgba(255,255,255,.5); }
.b-fig { white-space: nowrap; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 14px; }
.b-fig .c { color: rgba(13,13,13,.6); }
.b-fig small { font-size: 16px; font-weight: 500; color: #4A3B40; letter-spacing: 0; margin-left: 4px; }
.meter { position: relative; height: 12px; border-radius: var(--r-full); background: rgba(255,255,255,.7); margin: 14px 0 10px; overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-full); background: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.meter.over > span { background: var(--bad); }
.b-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #4A3B40; font-weight: 500; }
.b-row b { color: var(--text); font-weight: 600; }

/* Category breakdown */
.segbar { display: flex; gap: 3px; height: 14px; margin-bottom: 8px; }
.segbar span { border-radius: var(--r-full); min-width: 8px; }
.seg-legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.cat-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.chip-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--c-tint); color: var(--c-ink); }
.chip-ic svg.i { width: 20px; height: 20px; }
.cat-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.cat-sub { font-size: 13px; color: var(--text-2); }
.cat-amt { text-align: right; }
.cat-amt .v { font-size: 16px; font-weight: 600; }
.cat-amt .s { font-size: 13px; color: var(--text-2); }
.cat-amt .s.over { color: var(--bad); font-weight: 600; }
.cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* Transactions */
.tx-group + .tx-group { margin-top: 8px; }
.tx-day { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 8px 0 4px; }
.tx { width: 100%; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px);
  text-align: left; border-radius: var(--r-md); transition: background-color .15s ease-out; }
@media (hover: hover) { .tx:hover { background: var(--surface-2); } }
.tx:active { background: var(--surface-2); }
.mark { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; overflow: hidden; }
.mark img { width: 100%; height: 100%; }
.mark svg.i { width: 20px; height: 20px; }
.tx-main { min-width: 0; display: flex; flex-direction: column; }
.tx-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.tx-sub { font-size: 13px; color: var(--text-2); }
.tx-amt { font-size: 16px; font-weight: 600; text-align: right; white-space: nowrap; }
.tx-amt.in { color: var(--ok); }

/* Chart */
.chart-wrap { position: relative; padding-left: 36px; }
.chart-plot { position: relative; height: 180px; touch-action: pan-y; }
.chart-plot svg { width: 100%; height: 100%; overflow: visible; }
.y-lbl { position: absolute; left: -36px; font-size: 12px; color: var(--text-2); transform: translateY(-50%); }
.x-lbls { position: relative; height: 20px; margin-top: 8px; font-size: 12px; color: var(--text-2); }
.x-lbls span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.x-lbls span:first-child { transform: none; }
.x-lbls span:last-child { transform: translateX(-100%); }
.c-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--brand); transform: translate(-50%, -50%); pointer-events: none; }
.c-tip[hidden] { display: none; }
.c-tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); background: var(--brand); color: #fff; border-radius: var(--r-sm); padding: 6px 10px; font-size: 13px; white-space: nowrap; pointer-events: none; box-shadow: var(--sh-float); }
.c-tip b { display: block; font-size: 16px; font-weight: 600; }
.c-tip .d { color: rgba(255,255,255,.72); }
.c-bud { position: absolute; right: 0; font-size: 12px; font-weight: 600; color: #A3264A; background: var(--pink); padding: 2px 8px; border-radius: var(--r-full); transform: translateY(-50%); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--brand); }
.legend i.dash { background: repeating-linear-gradient(90deg, #E0507A 0 4px, transparent 4px 7px); }

/* Activity */
.search { position: relative; }
.search svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-2); }
.input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px;
  box-shadow: var(--sh-1); transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.search .input { padding-left: 44px; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,13,13,.08); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
@media (max-width: 1023px) { .chips { mask-image: linear-gradient(90deg, #000 85%, transparent); } }
.chip { flex: none; height: 40px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s ease-out, color .15s ease-out; }
.chip svg.i { width: 16px; height: 16px; }
@media (hover: hover) { .chip:hover { background: var(--surface-2); } }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.act-layout { display: flex; flex-direction: column; gap: 14px; }
.month-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ms.count { display: none; }
.ms { background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--sh-1); }
.ms .l { font-size: 13px; color: var(--text-2); font-weight: 500; }
.ms .v { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }

/* Budget list */
.bl-row { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 12px 0; }
.bl-row + .bl-row { border-top: 1px solid var(--line); }
.bl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -4px 0; }
.bl-top .cat-name { flex: 1; }
.bl-edit { height: 32px; padding: 0 10px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
.bl-edit svg.i { width: 14px; height: 14px; }
@media (hover: hover) { .bl-edit:hover { background: var(--surface-2); color: var(--text); } }
.bar { height: 8px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin: 6px 0 4px; }
.bar span { display: block; height: 100%; border-radius: var(--r-full); background: var(--c-bar); }
.bar.over span { background: var(--bad); }
.bl-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.bl-meta .over { color: var(--bad); font-weight: 600; }

/* Settings */
.profile { display: flex; align-items: center; gap: 14px; }
.profile .avatar { width: 56px; height: 56px; }
.profile .n { font-size: 18px; font-weight: 600; }
.profile .e { font-size: 14px; color: var(--text-2); }
.set-group h2 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 4px 8px; }
.set-list { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 4px 16px; }
.set-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; min-height: 60px; width: 100%; text-align: left; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .chip-ic { width: 40px; height: 40px; border-radius: 12px; }
.set-row .chip-ic svg.i { width: 18px; height: 18px; }
.set-row .t { font-size: 16px; font-weight: 500; }
.set-row .d { font-size: 13px; color: var(--text-2); text-wrap: pretty; }
.set-row { padding: 8px 0; }
.set-row .v { font-size: 14px; color: var(--text-2); display: inline-flex; align-items: center; gap: 2px; }
.set-row.danger .t { color: var(--bad); }
.toggle { width: 48px; height: 28px; border-radius: var(--r-full); background: #DADAD6; position: relative; transition: background-color .2s ease-out; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(13,13,13,.25); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.settings-grid { display: flex; flex-direction: column; gap: 24px; max-width: 600px; margin: 0 auto; }
.set-foot { text-align: center; font-size: 13px; color: var(--text-2); }

/* Empty */
.empty { text-align: center; padding: 24px 8px 8px; }
.empty svg { margin: 0 auto 12px; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--text-2); font-size: 14px; margin: 4px auto 16px; max-width: 30ch; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 16px;
  background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 6px 16px -6px rgba(13,13,13,.45); transition: transform .15s ease-out, box-shadow .15s ease-out; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.btn.danger { background: var(--bad); }
.btn svg.i { width: 18px; height: 18px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(13,13,13,.4); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s ease-out; }
.backdrop.open { opacity: 1; }
.backdrop[hidden] { display: none; }

/* ---------- Derived ---------- */
function derive() {
  const sorted = [...S.tx].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const month = sorted.filter((t) => t.date.startsWith(MONTH));
  const exp = month.filter((t) => t.amount < 0);
  const spent = exp.reduce((s, t) => s - t.amount, 0);
  const income = month.filter((t) => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const byCat = {};
  for (const k of Object.keys(CATS)) byCat[k] = { spent: 0, n: 0 };
  for (const t of exp) { byCat[t.cat].spent -= t.amount; byCat[t.cat].n++; }
  const budgetTotal = Object.values(S.budgets).reduce((a, b) => a + b, 0);
  const balance = S.opening + S.tx.reduce((s, t) => s + t.amount, 0);
  const daysLeft = DIM - TODAY.getDate() + 1;
  const last7 = Array.from({ length: 7 }, (_, i) => {
    const d = daysAgo(6 - i);
    return { d, v: S.tx.filter((t) => t.date === d && t.amount < 0).reduce((s, t) => s - t.amount, 0) };
  });
  const daily = Array.from({ length: TODAY.getDate() }, (_, i) => {
    const d = `${MONTH}-${pad(i + 1)}`;
    return exp.filter((t) => t.date === d).reduce((s, t) => s - t.amount, 0);
  });
  return { sorted, month, exp, spent, income, byCat, budgetTotal, balance, daysLeft, last7, daily,
    deposits: month.filter((t) => t.amount > 0).length };
}

  }
  const m = MERCHANTS[t.name];
  if (m) return `<span class="mark" style="background:${m[0]};color:${m[1]}">${esc(m[2])}</span>`;
  const c = CATS[t.cat] || INCOME;
  const letters = t.name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  return `<span class="mark" style="background:${c.tint};color:${c.ink}">${esc(letters)}</span>`;

function txSub(t) {

function txGroups(list, withTotals) {

function niceMax(v) { const steps = [500, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 8000, 10000, 15000, 20000]; return steps.find((s) => s >= v) || Math.ceil(v / 5000) * 5000; }
function chartCard(D, cls = '') {
  const cum = []; let acc = 0; D.daily.forEach((v) => { acc += v; cum.push(acc); });
  const max = niceMax(Math.max(D.budgetTotal, acc) * 1.08);
  const X = (day) => (DIM === 1 ? 0 : (day - 1) / (DIM - 1) * 100);
  const Y = (v) => 100 - v / max * 100;
  const pts = cum.map((v, i) => `${X(i + 1).toFixed(2)},${Y(v).toFixed(2)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${X(cum.length).toFixed(2)},100 L0,100 Z`;
  const ticks = [0, max / 2, max];
  const xs = [1, 8, 15, 22, DIM];
  const by = Y(D.budgetTotal);
  return `<div class="card ${cls}" id="chartCard">
    <div class="card-head"><h2>Spent so far</h2><span class="pill num">${money(acc)}</span></div>
    <div class="chart-wrap"><div class="chart-plot" id="plot" role="img" aria-label="Cumulative spending in ${monthName}: ${money(acc)} by day ${cum.length}, against a budget of ${usd0.format(D.budgetTotal)}.">
      ${ticks.map((t) => `<span class="y-lbl num" style="top:${Y(t)}%">${t >= 1000 ? '$' + (t / 1000) + 'k' : '$' + t}</span>`).join('')}

        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0D0D" stop-opacity=".16"/><stop offset="1" stop-color="#0D0D0D" stop-opacity="0"/></linearGradient></defs>
        ${ticks.map((t) => `<line x1="0" x2="100" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(13,13,13,.08)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`).join('')}
        <line x1="0" x2="100" y1="${by}" y2="${by}" stroke="#E0507A" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
        ${cum.length ? `<path d="${area}" fill="url(#cg)"/><path d="${line}" fill="none" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` : ''}
        <line id="cGuide" x1="0" x2="0" y1="0" y2="100" stroke="rgba(13,13,13,.25)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="c-bud num" style="top:${by}%">${usd0.format(D.budgetTotal)}</span>
      <span class="c-dot" id="cDot"></span><span class="c-tip" id="cTip" hidden></span>
    </div>
    <div class="x-lbls">${xs.map((d) => `<span style="left:${X(d)}%">${monthShort} ${d}</span>`).join('')}</div></div>
    <div class="legend" style="margin-top:12px"><span><i></i>Spent</span><span><i class="dash"></i>Monthly budget</span></div>
  </div>`;
}
function bindChart(D) {
  const plot = document.getElementById('plot'); if (!plot || !D.daily.length) return;
  const cum = []; let acc = 0; D.daily.forEach((v) => { acc += v; cum.push(acc); });
  const max = niceMax(Math.max(D.budgetTotal, acc) * 1.08);
  const dot = plot.querySelector('#cDot'), tip = plot.querySelector('#cTip'), guide = plot.querySelector('#cGuide');
  const show = (i, live) => {
    const x = DIM === 1 ? 0 : i / (DIM - 1) * 100, y = 100 - cum[i] / max * 100;
    dot.style.left = tip.style.left = x + '%'; dot.style.top = tip.style.top = y + '%';
    guide.setAttribute('x1', x); guide.setAttribute('x2', x);
    const tipX = Math.min(Math.max(x, 14), 86); tip.style.left = tipX + '%';
    tip.hidden = !live; guide.style.opacity = live ? 1 : 0;
    tip.innerHTML = `<b class="num">${money(cum[i])}</b><span class="d">${monthShort} ${i + 1}${D.daily[i] ? ` · ${money(D.daily[i])} that day` : ''}</span>`;
  };
  show(cum.length - 1);
  const mv = (e) => {
    const r = plot.getBoundingClientRect();
    const i = Math.round((e.clientX - r.left) / r.width * (DIM - 1));
    show(Math.max(0, Math.min(cum.length - 1, i)), true);
  };
  plot.addEventListener('pointermove', mv); plot.addEventListener('pointerdown', mv);
  plot.addEventListener('pointerleave', () => show(cum.length - 1));
}

  const row = (icn, tint, inkc, t, d, right, attrs = '', cls = '') =>
    `<button class="set-row ${cls}" ${attrs}><span class="chip-ic" style="--c-tint:${tint};--c-ink:${inkc}">${ic(icn)}</span><span><span class="t">${t}</span>${d ? `<br><span class="d">${d}</span>` : ''}</span>${right}</button>`;
  const tog = (on) => `<span class="toggle" role="switch" aria-checked="${on}" aria-hidden="true"></span>`;
  return `<div class="settings-grid">
    <div class="stack" style="gap:24px"><div class="card profile"><span class="avatar">${avatarImg()}</span><div><div class="n">${USER.name}</div><div class="e">${USER.email}</div></div></div>
    <div class="set-group"><h2>Account</h2><div class="set-list">
      ${row('wallet', 'var(--sky)', '#1D58A0', 'Everyday Checking', `•••• ${USER.card}`, `<span class="v">Primary</span>`)}
      ${row('globe', 'var(--lilac)', '#5739BD', 'Currency', '', `<span class="v">US Dollar</span>`)}
      ${row('calendar', 'var(--butter)', '#735800', 'Budget period', '', `<span class="v">Monthly</span>`)}
    </div></div>
    </div><div class="stack" style="gap:24px">
    <div class="set-group"><h2>Preferences</h2><div class="set-list">
      ${row('bell', 'var(--pink)', '#A8284E', 'Budget alerts', 'When a category goes over budget', tog(S.reminders), 'data-toggle="reminders" role="switch" aria-checked="' + S.reminders + '"')}
      ${row('eyeOff', 'var(--mint)', '#1A6B3E', 'Hide balance', 'Mask your balance on the home screen', tog(S.hideBalance), 'data-toggle="hideBalance" role="switch" aria-checked="' + S.hideBalance + '"')}
    </div></div>
    <div class="set-group"><h2>Data</h2><div class="set-list">
      ${row('download', 'var(--sky)', '#1D58A0', 'Export transactions', 'Download as CSV', `<span class="v">${ic('chev')}</span>`, 'data-export')}
      ${row('refresh', 'var(--peach)', '#9C4709', 'Load sample data', 'Replace your data with an example month', `<span class="v">${ic('chev')}</span>`, 'data-confirm="sample"')}
      ${row('trash', 'var(--bad-tint)', 'var(--bad)', 'Start fresh', 'Delete all transactions and budgets', `<span class="v">${ic('chev')}</span>`, 'data-confirm="clear"', 'danger')}
    </div></div>
    <p class="set-foot">Ledgerly 1.4.0 · Data is stored in this browser</p></div></div>`;
}
function avatarImg() { return `<img src="${avatarUrl(USER.name, 'FFD6E0')}" alt="" width="44" height="44" onerror="this.replaceWith('JL')">`; }

function render() {
  const D = derive();
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const dateStr = TODAY.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('kicker').textContent = view === 'home' ? dateStr : view === 'settings' ? 'Profile and preferences' : view === 'activity' ? 'All transactions' : `${monthName} ${TODAY.getFullYear()}`;
  document.getElementById('title').textContent = view === 'home' ? `${greet}, ${USER.first}` : VIEWS[view][1];
  document.title = `${VIEWS[view][1]} · Ledgerly`;
  for (const k of Object.keys(VIEWS)) { const v = document.getElementById('view-' + k); v.hidden = k !== view; if (k !== view) v.innerHTML = ''; }
  const el = document.getElementById('view-' + view);
  el.innerHTML = view === 'home' ? renderHome(D) : view === 'activity' ? renderActivity(D) : view === 'budget' ? renderBudget(D) : renderSettings();
  if (view === 'home' || view === 'budget') bindChart(D);

  const tabs = Object.entries(VIEWS);
  const tab = ([k, [i, n]]) => `<button class="tab" data-go="${k}" ${view === k ? 'aria-current="page"' : ''}>${ic(i)}${n}</button>`;
  document.getElementById('tabbar').innerHTML = tabs.slice(0, 2).map(tab).join('') +
    `<button class="tab-add" data-add="expense" aria-label="Add transaction">${ic('plus')}</button>` + tabs.slice(2).map(tab).join('');
  document.getElementById('sideNav').innerHTML = tabs.map(([k, [i, n]]) => `<button data-go="${k}" ${view === k ? 'aria-current="page"' : ''}>${ic(i)}${n}</button>`).join('');
  const left = D.budgetTotal - D.spent;
  document.getElementById('sideTip').style.visibility = (view === 'home' || view === 'budget') ? 'hidden' : 'visible';
  document.getElementById('sideTip').innerHTML = `<div class="l">Left to spend in ${monthName}</div><div class="v num">${left < 0 ? '−' : ''}${money(left)}</div>
    <div class="bar"><span style="width:${D.budgetTotal ? Math.min(100, D.spent / D.budgetTotal * 100) : 0}%"></span></div><div class="s">${D.daysLeft} days left</div>`;
  document.getElementById('sideUser').innerHTML = `<span class="avatar">${avatarImg()}</span><div><div class="n">${USER.name}</div><div class="e">Personal</div></div>`;
  document.getElementById('topAvatar').innerHTML = avatarImg();
}
function go(v) { view = v; render(); window.scrollTo({ top: 0 }); }

/* ---------- Sheets ---------- */
const backdrop = document.getElementById('backdrop'), sheet = document.getElementById('sheet');
let lastFocus = null;
function openSheet(html, focusSel) {
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grabber" aria-hidden="true"></div>${html}`;
  backdrop.hidden = false; requestAnimationFrame(() => backdrop.classList.add('open'));
  const f = focusSel && sheet.querySelector(focusSel); (f || sheet.querySelector('button, input')).focus({ preventScroll: true });
}
function closeSheet() {
  backdrop.classList.remove('open');
  setTimeout(() => { backdrop.hidden = true; sheet.innerHTML = ''; }, 200);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
const head = (t) => `<div class="sheet-head"><h2 id="sheetTitle">${t}</h2><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>`;

function openAdd(type) {
  const dates = Array.from({ length: 4 }, (_, i) => [daysAgo(i), i === 0 ? 'Today' : i === 1 ? 'Yesterday' : parse(daysAgo(i)).toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + parse(daysAgo(i)).getDate()]);
  openSheet(`${head('New transaction')}
    <form id="addForm" novalidate>
      <div class="seg" role="radiogroup" aria-label="Type">
        <button type="button" role="radio" data-type="expense" aria-checked="${type === 'expense'}">Expense</button>
        <button type="button" role="radio" data-type="income" aria-checked="${type === 'income'}">Income</button></div>
      <div class="field"><label for="fAmt">Amount</label><div class="amount"><span aria-hidden="true">$</span>
        <input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-describedby="eAmt"></div><div class="err" id="eAmt"></div></div>
      <div class="field"><label for="fName">${type === 'income' ? 'From' : 'Merchant'}</label>
        <input class="input" id="fName" placeholder="${type === 'income' ? 'e.g. Salary' : 'e.g. Whole Foods Market'}" autocomplete="off" aria-describedby="eName"><div class="err" id="eName"></div></div>
      <div class="field" id="catField" ${type === 'income' ? 'hidden' : ''}><span class="flabel" id="catLbl">Category</span>
        <div class="chip-grid" role="radiogroup" aria-labelledby="catLbl">${Object.entries(CATS).map(([k, c], i) => `<button type="button" class="chip" role="radio" data-cat="${k}" aria-checked="${i === 1}" style="${catStyle(k)}"><span class="chip-dot">${ic(c.icon)}</span>${c.name}</button>`).join('')}</div></div>
      <div class="field"><span class="flabel" id="dateLbl">Date</span>
        <div class="chip-grid" role="radiogroup" aria-labelledby="dateLbl">${dates.map(([d, l], i) => `<button type="button" class="chip" role="radio" data-date="${d}" aria-checked="${i === 0}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="fNote">Note <span style="color:var(--text-2);font-weight:500">(optional)</span></label><input class="input" id="fNote" autocomplete="off"></div>
      <div class="sheet-foot"><button class="btn block" type="submit" id="addSubmit">${type === 'income' ? 'Add income' : 'Add expense'}</button></div>
    </form>`, '#fAmt');
  const form = sheet.querySelector('#addForm');
  const pick = (sel, btn) => form.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-checked', b === btn));
  form.addEventListener('click', (e) => {
    const t = e.target.closest('[data-type]'), c = e.target.closest('[data-cat]'), d = e.target.closest('[data-date]');
    if (t) { pick('[data-type]', t); const inc = t.dataset.type === 'income';
      form.querySelector('#catField').hidden = inc; form.querySelector('#addSubmit').textContent = inc ? 'Add income' : 'Add expense';
      form.querySelector('label[for=fName]').textContent = inc ? 'From' : 'Merchant';
      form.querySelector('#fName').placeholder = inc ? 'e.g. Salary' : 'e.g. Whole Foods Market'; }
    if (c) pick('[data-cat]', c);
    if (d) pick('[data-date]', d);
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amtEl = form.querySelector('#fAmt'), nameEl = form.querySelector('#fName');
    const amt = parseFloat(amtEl.value.replace(/[^0-9.]/g, ''));
    const name = nameEl.value.trim();
    let ok = true;
    const setErr = (el, id, msg) => { el.setAttribute('aria-invalid', !!msg); sheet.querySelector('#' + id).textContent = msg; if (msg && ok) { el.focus(); ok = false; } };
    setErr(amtEl, 'eAmt', !(amt > 0) ? 'Enter an amount greater than $0.' : amt > 1e6 ? 'That amount looks too large.' : '');
    setErr(nameEl, 'eName', name ? '' : 'Add a name so you can find this later.');
    if (!ok) return;
    const inc = form.querySelector('[data-type][aria-checked=true]').dataset.type === 'income';
    const t = { id: 'u' + Date.now(), date: form.querySelector('[data-date][aria-checked=true]').dataset.date, name,
      cat: inc ? 'income' : form.querySelector('[data-cat][aria-checked=true]').dataset.cat,
      amount: Math.round(amt * 100) / 100 * (inc ? 1 : -1), note: form.querySelector('#fNote').value.trim() };
    S.tx.push(t); save(); closeSheet(); render(); toast(`${inc ? 'Income' : 'Expense'} added · ${signed(t.amount)}`);
  });
}
function openTx(id) {
  const t = S.tx.find((x) => x.id === id); if (!t) return;
  const c = t.amount > 0 ? INCOME : CATS[t.cat];
  openSheet(`${head('Transaction')}
    <div class="detail-hero">${mark(t)}<div class="tx-name">${esc(t.name)}</div><div class="amt num ${t.amount > 0 ? 'in' : ''}">${signed(t.amount)}</div></div>
    <dl class="dl"><div><dt>Category</dt><dd>${c.name}</dd></div>
      <div><dt>Date</dt><dd>${parse(t.date).toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}</dd></div>
      <div><dt>Account</dt><dd>Everyday Checking •••• ${USER.card}</dd></div>
      ${t.note ? `<div><dt>Note</dt><dd>${esc(t.note)}</dd></div>` : ''}</dl>
    <div class="btn-row"><button class="btn ghost" data-close>Close</button><button class="btn danger" id="delTx">${ic('trash')}Delete</button></div>`);
  sheet.querySelector('#delTx').addEventListener('click', () => {
    const i = S.tx.indexOf(t); S.tx.splice(i, 1); save(); closeSheet(); render();
    toast('Transaction deleted', () => { S.tx.splice(i, 0, t); save(); render(); });
  });
}
function openEditBudget(k) {
  openSheet(`${head(`${CATS[k].name} budget`)}
    <form id="budForm" novalidate><div class="field"><label for="fBud">Monthly limit</label><div class="amount"><span aria-hidden="true">$</span>
      <input id="fBud" inputmode="decimal" value="${S.budgets[k] || ''}" placeholder="0" autocomplete="off" aria-describedby="eBud"></div><div class="err" id="eBud"></div></div>
      <button class="btn block" type="submit">Save budget</button></form>`, '#fBud');
  sheet.querySelector('#budForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = sheet.querySelector('#fBud'); const raw = inp.value.replace(/[^0-9.]/g, '');
    const v = raw === '' ? 0 : parseFloat(raw);
    if (isNaN(v) || v < 0) { inp.setAttribute('aria-invalid', 'true'); sheet.querySelector('#eBud').textContent = 'Enter a number, or 0 for no budget.'; inp.focus(); return; }
    S.budgets[k] = Math.round(v); save(); closeSheet(); render(); toast(`${CATS[k].name} budget set to ${usd0.format(v)}`);
  });
}
function openConfirm(kind) {
  const clear = kind === 'clear';
  openSheet(`${head(clear ? 'Start fresh?' : 'Load sample data?')}
    <p style="color:var(--text-2);margin-bottom:20px">${clear ? 'This deletes all transactions and category budgets in this browser. You can’t undo this.' : 'This replaces your current transactions and budgets with an example month.'}</p>
    <div class="btn-row"><button class="btn ghost" data-close>Cancel</button><button class="btn ${clear ? 'danger' : ''}" id="doConfirm">${clear ? 'Delete everything' : 'Load sample'}</button></div>`);
  sheet.querySelector('#doConfirm').addEventListener('click', () => {
    if (clear) { S = { opening: 0, tx: [], budgets: Object.fromEntries(Object.keys(CATS).map((k) => [k, 0])), hideBalance: S.hideBalance, reminders: S.reminders }; }
    else S = sampleState();
    save(); closeSheet(); view = 'home'; render(); toast(clear ? 'All data deleted' : 'Sample data loaded');
  });
}
function exportCsv() {
  const rows = [['Date', 'Name', 'Category', 'Amount', 'Note'], ...[...S.tx].sort((a, b) => b.date.localeCompare(a.date)).map((t) => [t.date, t.name, (CATS[t.cat] || INCOME).name, t.amount.toFixed(2), t.note])];
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `ledgerly-${iso(TODAY)}.csv`; a.click();
  toast(`Exported ${S.tx.length} transactions`);
}
let toastTimer;
function toast(msg, undo) {
  const el = document.getElementById('toast'), u = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  u.hidden = !undo; u.onclick = () => { undo(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2600);
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const goEl = t.closest('[data-go]'); if (goEl) return go(goEl.dataset.go);
  const add = t.closest('[data-add]'); if (add) return openAdd(add.dataset.add);
  const tx = t.closest('[data-tx]'); if (tx) return openTx(tx.dataset.tx);
  const ed = t.closest('[data-edit]'); if (ed) return openEditBudget(ed.dataset.edit);
  if (t.closest('[data-close]')) return closeSheet();
  if (t.closest('[data-export]')) return exportCsv();
  const cf = t.closest('[data-confirm]'); if (cf) return openConfirm(cf.dataset.confirm);
  const tg = t.closest('[data-toggle]'); if (tg) { const k = tg.dataset.toggle; S[k] = !S[k]; save(); render(); document.querySelector(`[data-toggle="${k}"]`).focus(); return; }
  if (t.closest('#eyeBtn')) { S.hideBalance = !S.hideBalance; save(); render(); document.getElementById('eyeBtn').focus(); return; }
  const f = t.closest('[data-filter]'); if (f) { filter = f.dataset.filter; render(); document.querySelector(`[data-filter="${filter}"]`).focus(); return; }
  if (t.closest('#clearFilters')) { filter = 'all'; query = ''; render(); return; }
  if (t.closest('#searchBtn')) { go('activity'); document.getElementById('actSearch').focus(); return; }
  if (t.closest('#topAvatar')) return go('settings');
  if (t === backdrop) closeSheet();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'actSearch') {
    query = e.target.value; const pos = e.target.selectionStart; render();
    const s = document.getElementById('actSearch'); s.focus(); s.setSelectionRange(pos, pos);
  }
  if (e.target.getAttribute('aria-invalid') === 'true') { e.target.setAttribute('aria-invalid', 'false'); const id = e.target.getAttribute('aria-describedby'); if (id) document.getElementById(id).textContent = ''; }
});
document.getElementById('topSearch').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { query = e.target.value; e.target.value = ''; go('activity'); document.getElementById('actSearch').focus(); }
});
document.addEventListener('keydown', (e) => {
  if (backdrop.hidden) return;
  if (e.key === 'Escape') return closeSheet();
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button:not([hidden]), input')].filter((x) => x.offsetParent !== null);
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
render();
</script>
</body>
</html>
