<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9FF">
<title>Dayful · Habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: candy. Tuned: hero gradient deepened to grape→berry so white text stays readable,
   streaks carry a warm "flame" accent, device: the week as a linked chain you don't want to break. */
:root{
  --bg:#F6F3FF; --surface:#FFFFFF; --surface-2:#F1EEFB; --ink:#17132B; --ink-2:#565070; --ink-3:#6F6A8A;
  --line:rgba(23,19,43,.08); --line-2:rgba(23,19,43,.14);
  --accent:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#EFE7FF;
  --g-hero:linear-gradient(135deg,#43178F 0%,#6D28D9 48%,#BE185D 100%);
  --g-flame:linear-gradient(160deg,#FBBF24,#F97316 60%,#EF4444);
  --flame:#EA580C; --flame-ink:#9A3412; --flame-soft:#FFEDD9;
  --r-sm:14px; --r-md:22px; --r-lg:30px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(45,27,105,.06),0 1px 1px rgba(45,27,105,.04);
  --sh-2:0 1px 2px rgba(45,27,105,.05),0 8px 18px -6px rgba(45,27,105,.12);
  --sh-3:0 2px 4px rgba(45,27,105,.06),0 16px 32px -10px rgba(45,27,105,.18),0 30px 60px -20px rgba(45,27,105,.14);
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-base:16px; --fs-lg:20px; --fs-xl:28px; --fs-2xl:40px;
  --font:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* category palette: solid, gradient end, ink for text on tint */
.c-violet{--c:#7C3AED;--c2:#A855F7;--ci:#5B21B6}
.c-blue{--c:#2563EB;--c2:#38BDF8;--ci:#1D4ED8}
.c-sun{--c:#EA580C;--c2:#FBBF24;--ci:#9A3412}
.c-leaf{--c:#059669;--c2:#4ADE80;--ci:#047857}
.c-rose{--c:#DB2777;--c2:#FB7185;--ci:#BE185D}
.c-teal{--c:#0891B2;--c2:#2DD4BF;--ci:#0E7490}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);min-height:100dvh;overflow-x:clip}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
p{margin:0;text-wrap:pretty}
svg{display:block;flex:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* atmosphere */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 380px at 8% -6%,rgba(124,58,237,.16),transparent 70%),
             radial-gradient(480px 360px at 96% 2%,rgba(236,72,153,.13),transparent 70%),
             radial-gradient(600px 420px at 70% 105%,rgba(56,189,248,.12),transparent 70%)}

.app{max-width:1120px;margin:0 auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.03em}
.glyph{width:38px;height:38px;border-radius:12px;background:var(--g-hero);display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -6px rgba(109,40,217,.6)}
.top-right{display:flex;align-items:center;gap:10px}
.date-pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-1);font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.date-pill i{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:var(--r-pill);
  font-weight:700;font-size:var(--fs-md);background:var(--ink);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(23,19,43,.3),0 10px 20px -8px rgba(23,19,43,.5);
  transition:transform .15s ease-out,box-shadow .15s ease-out,background-color .15s ease-out}
.btn:active{transform:scale(.97)}
.btn.grad{background:var(--g-hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 24px -8px rgba(109,40,217,.65)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.btn.danger{background:#FFF1F2;color:#BE123C;border:1px solid #FECDD3;box-shadow:none}
.btn.danger.armed{background:#E11D48;color:#fff;border-color:#E11D48}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:not([disabled]):hover{transform:translateY(-1px)}}
.top .btn{display:none;height:42px}

.layout{display:grid;gap:20px}
.col{display:grid;gap:16px;align-content:start;min-width:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px 8px;color:#fff;background:var(--g-hero);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 4px rgba(67,23,143,.2),0 22px 44px -14px rgba(109,40,217,.55),0 40px 70px -30px rgba(190,24,93,.5)}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:330px;height:330px;border-radius:50%;pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0 27px,rgba(255,255,255,.09) 27px 28px)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);filter:blur(30px);pointer-events:none}
.hero-main{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-text{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:4px 10px;border-radius:var(--r-pill)}
.hero h2{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:12px 0 12px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;
  background:rgba(20,8,50,.32);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
.hchip svg{width:16px;height:16px}
.ring{position:relative;flex:none;width:112px;height:112px;filter:drop-shadow(0 10px 18px rgba(30,10,70,.35))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .trk{stroke:rgba(255,255,255,.2)}
.ring .prg{stroke:url(#ringGrad);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring-c b{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em}
.ring-c b small{font-size:var(--fs-base);font-weight:600;opacity:.9}
.ring-c span{font-size:var(--fs-xs);font-weight:600;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.ring-c .done-ic{width:44px;height:44px;border-radius:50%;background:#fff;color:#6D28D9;display:grid;place-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

.week{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:18px -12px 0}
.day{position:relative;display:grid;justify-items:center;gap:6px;padding:8px 0 10px;border:0;border-radius:18px;background:transparent;color:#fff;min-height:74px;
  transition:background-color .15s ease-out,transform .15s ease-out}
.day .dl{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em}
.day .dn{position:relative;width:36px;height:36px;display:grid;place-items:center;font-size:var(--fs-md);font-weight:700}
.day .dn svg{position:absolute;inset:0;width:36px;height:36px;transform:rotate(-90deg)}
.day .dn circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.day .dn .trk{stroke:rgba(255,255,255,.24)}
.day .dn .prg{stroke:#fff}
.day.full .dn{background:#fff;color:#6D28D9;border-radius:50%}
.day.full .dn svg{display:none}
.day[aria-pressed="true"]{background:rgba(20,8,50,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.day:active{transform:scale(.95)}
@media (hover:hover){.day:hover{background:rgba(20,8,50,.24)}}
.day .tdot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#FDE68A}

/* section head */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0}
.sec-head h2{font-size:var(--fs-lg);font-weight:700}
.count{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);
  font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);box-shadow:var(--sh-1)}
.linkbtn{border:0;background:var(--accent-soft);color:#5B21B6;font-weight:700;font-size:var(--fs-sm);height:32px;padding:0 14px;border-radius:var(--r-pill)}

/* habit cards */
.habits{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.habit{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  box-shadow:inset 0 1px 0 #fff,var(--sh-2);transition:box-shadow .2s ease-out,transform .2s ease-out,background-color .2s ease-out}
.habit.done{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 7%,#fff));border-color:color-mix(in srgb,var(--c) 22%,transparent)}
.h-row{display:flex;align-items:center;gap:12px}
.tile{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(140deg,var(--c),var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 18px -8px color-mix(in srgb,var(--c) 75%,transparent)}
.tile .ic{width:24px;height:24px;stroke-width:2}
.h-info{flex:1;min-width:0}
.h-name{font-size:17px;font-size:var(--fs-base);font-weight:700;letter-spacing:-.01em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.h-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.h-meta .fl{width:16px;height:16px}
.h-meta.live{color:var(--flame-ink)}
.h-meta b{font-weight:800}
.check{position:relative;flex:none;width:54px;height:54px;border-radius:18px;border:2.5px solid color-mix(in srgb,var(--c) 45%,#fff);
  background:color-mix(in srgb,var(--c) 8%,#fff);color:color-mix(in srgb,var(--c) 45%,#fff);display:grid;place-items:center;
  transition:transform .15s ease-out,background-color .15s ease-out,border-color .15s ease-out,box-shadow .15s ease-out}
.check .ic{width:26px;height:26px;stroke-width:3}
.check:active{transform:scale(.9)}
@media (hover:hover){.check:hover{border-color:var(--c);color:var(--c)}}
.check[aria-pressed="true"]{border-color:transparent;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 70%,var(--c2)));color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 20px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.check.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.check.pop .ic{stroke-dasharray:30;animation:draw .35s .08s ease-out backwards}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}

/* the chain: last seven days, linked */
.h-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:2px 4px 2px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(45,27,105,.06)}
.habit.done .h-foot{background:color-mix(in srgb,var(--c) 9%,#fff)}
.chain{display:flex;align-items:center}
.lk{position:relative;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-3);
  background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.lk+.lk{margin-left:9px}
.lk+.lk::before{content:"";position:absolute;right:100%;top:50%;width:9px;height:3px;margin-top:-1.5px;background:var(--line-2)}
.lk.on{background:var(--c);color:#fff;box-shadow:none}
.lk.on+.lk.on::before{background:var(--c)}
.lk.sel{outline:2px solid var(--c);outline-offset:2px}
.foot-r{display:flex;align-items:center;gap:2px}
.best{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:700;color:var(--ci);white-space:nowrap}
.best svg{width:14px;height:14px}
.more{width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:var(--ink-2);display:grid;place-items:center;transition:background-color .15s ease-out}
@media (hover:hover){.more:hover{background:rgba(23,19,43,.07)}}

/* empty state */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 20px 24px;text-align:center;box-shadow:inset 0 1px 0 #fff,var(--sh-2)}
.empty>svg{margin:0 auto 12px}
.empty h3{font-size:var(--fs-lg);font-weight:700}
.empty p{color:var(--ink-2);font-size:var(--fs-md);max-width:34ch;margin:6px auto 18px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:var(--r-pill);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);
  background:color-mix(in srgb,var(--c) 8%,#fff);color:var(--ci);font-size:var(--fs-md);font-weight:600;transition:transform .15s ease-out,background-color .15s ease-out}
.sug i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--c),var(--c2));color:#fff}
.sug i .ic{width:17px;height:17px}
.sug:active{transform:scale(.96)}
@media (hover:hover){.sug:hover{background:color-mix(in srgb,var(--c) 15%,#fff)}}
.empty .btn{margin-top:20px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{position:relative;overflow:hidden;border-radius:var(--r-md);padding:14px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,var(--sh-1);min-width:0}
.kpi .chip{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}
.kpi .lab{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);margin-top:12px}
.kpi .val{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.kpi .val small{font-size:var(--fs-md);font-weight:600;letter-spacing:0;color:var(--ink-2);margin-left:4px}
.kpi .sub{font-size:var(--fs-xs);font-weight:600;color:var(--ci);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .mini{position:absolute;right:12px;top:12px}
.kpi.hot{background:linear-gradient(160deg,#FFF7ED,#FFE4CC);border-color:rgba(234,88,12,.18)}
.kpi.hot .chip{background:var(--g-flame);color:#fff;box-shadow:0 8px 14px -6px rgba(234,88,12,.7)}
.kpi.hot .mini{right:-14px;top:-12px;opacity:.16}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px}
.bars i{width:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 28%,#fff);min-height:4px}
.bars i:last-child{background:var(--c)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:inset 0 1px 0 #fff,var(--sh-2);min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{font-size:var(--fs-base);font-weight:700}
.card-head p{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.legend{display:flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);white-space:nowrap}
.legend i{width:11px;height:11px;border-radius:4px}
.heat-wrap{display:grid;grid-template-columns:auto 1fr;gap:6px 8px}
.heat-months{grid-column:2;display:grid;grid-template-columns:repeat(var(--weeks),1fr);gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);height:16px}
.heat-months span{white-space:nowrap;overflow:visible}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2)}
.heat-days span{display:grid;align-items:center;line-height:1}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(var(--weeks),1fr);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:28%;background:var(--surface-2)}
.heat i.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.l1{background:#DDD0FB!important}.l2{background:#B79BF5!important}.l3{background:#8E5FEF!important}.l4{background:#6D28D9!important}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}

.rank{display:grid;gap:14px;list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.rank .pos{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c),var(--c2))}
.rank .pos .ic{width:18px;height:18px}
.rank .nm{font-size:var(--fs-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .bar{height:8px;border-radius:4px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c),var(--c2))}
.rank .rt{text-align:right;line-height:1.2}
.rank .rt b{display:block;font-size:var(--fs-md);font-weight:700}
.rank .rt span{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:700;color:var(--flame-ink)}
.rank .rt span svg{width:13px;height:13px}
.muted-note{font-size:var(--fs-sm);color:var(--ink-2)}

/* tab bar (phone) */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:7px;
  border-radius:var(--r-pill);background:rgba(23,19,43,.94);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 32px -8px rgba(23,19,43,.55),0 4px 10px rgba(23,19,43,.25)}
.tab{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border:0;border-radius:var(--r-pill);background:transparent;color:#CFCAE6;font-size:var(--fs-md);font-weight:600;
  transition:background-color .15s ease-out,color .15s ease-out}
.tab[aria-current="true"]{background:rgba(255,255,255,.14);color:#fff}
.fab{width:54px;height:54px;border:0;border-radius:50%;background:var(--g-flame);color:#fff;display:grid;place-items:center;margin:-14px 2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 5px var(--bg),0 12px 22px -6px rgba(234,88,12,.7);transition:transform .15s ease-out}
.fab .ic{width:26px;height:26px;stroke-width:2.6}
.fab:active{transform:scale(.92)}

/* phone view switching */
@media (max-width:759px){
  body[data-view="today"] .col-stats{display:none}
  body[data-view="stats"] .col-today{display:none}
}
@media (max-width:359px){.best span{display:none}.hero h2{font-size:24px}.ring{width:96px;height:96px}}

/* sheet */
dialog{border:0;padding:0;color:var(--ink);background:var(--surface);width:100%;max-width:100%;margin:auto 0 0;border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:92dvh;overflow:auto;box-shadow:0 -20px 60px -10px rgba(23,19,43,.4)}
dialog::backdrop{background:rgba(23,19,43,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sheet-head .tile{transition:background .2s}
.sheet-head h2{font-size:var(--fs-lg);font-weight:700;flex:1}
.xbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.field{display:block;margin-bottom:18px;border:0;padding:0;min-width:0}
.field>label,.field>legend{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--ink-2);margin-bottom:8px;padding:0}
.input{width:100%;height:52px;padding:0 16px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface-2);font-size:var(--fs-base);font-weight:500;
  transition:border-color .15s,box-shadow .15s,background-color .15s}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:0;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:#BE123C;font-size:var(--fs-sm);font-weight:600;margin-top:6px;min-height:0}
.quick{display:flex;gap:8px;overflow-x:auto;margin:-6px -20px 18px;padding:2px 20px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .sug{flex:none;height:44px;font-size:var(--fs-sm)}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick label{position:relative;display:grid;place-items:center;aspect-ratio:1;min-height:44px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);cursor:pointer;
  transition:background-color .15s,color .15s,transform .15s}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick label:has(input:checked){background:var(--pc,var(--accent));color:#fff;box-shadow:0 8px 14px -6px var(--pc,var(--accent))}
.pick label:has(input:focus-visible){outline:2.5px solid var(--accent);outline-offset:2px}
.pick label:active{transform:scale(.93)}
.pick.colors label{background:transparent}
.pick.colors label span{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--c),var(--c2));display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pick.colors label .ic{opacity:0;width:18px;height:18px;stroke-width:3}
.pick.colors label:has(input:checked){background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 0 0 2px var(--c)}
.pick.colors label:has(input:checked) .ic{opacity:1}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1;height:52px}
.sheet-actions .danger{flex:0 1 auto}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;
  display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:var(--fs-md);font-weight:600;padding:10px 16px 10px 12px;border-radius:var(--r-pill);
  box-shadow:var(--sh-3);transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:20px;height:20px}
.confetti{position:fixed;z-index:40;width:9px;height:9px;border-radius:3px;pointer-events:none}

.foot{margin-top:24px;text-align:center;font-size:var(--fs-sm);color:var(--ink-2)}

/* desktop */
@media (min-width:760px){
  .app{padding:28px 28px 48px}
  .top{margin-bottom:24px}
  .top .btn{display:inline-flex}
  .brand h1{font-size:24px;font-size:var(--fs-lg)}
  .tabbar{display:none}
  .layout{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:24px;align-items:start}
  .col-stats{position:sticky;top:24px}
  .hero{padding:26px 26px 12px}
  .week{margin:22px -10px 0;gap:6px}
  dialog{margin:auto;width:480px;border-radius:var(--r-lg)}
  .grab{display:none}
  .sheet{padding:22px 24px 24px}
  .quick{margin:-6px -24px 18px;padding:2px 24px 4px}
  .toast{bottom:32px}
  @media (hover:hover){.habit:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,var(--sh-3)}}
}
@media (min-width:1000px){
  .hero{padding:32px 32px 14px}
  .hero h2{font-size:var(--fs-2xl)}
  .ring{width:148px;height:148px}
  .ring-c b{font-size:var(--fs-2xl)}
  .habit{padding:16px 18px}
  .kpis{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
(function(){
'use strict';
var KEY='dayful.v1';
var ICONS=['drop','book','bolt','dumb','leaf','moon','pen','heart','sun','music','cup','chat'];
var ICON_NAMES={drop:'Water',book:'Book',bolt:'Energy',dumb:'Workout',leaf:'Calm',moon:'Sleep',pen:'Write',heart:'Health',sun:'Morning',music:'Music',cup:'Drink',chat:'Language'};
var COLORS=['violet','blue','sun','leaf','rose','teal'];
var HEX={violet:'#7C3AED',blue:'#2563EB',sun:'#EA580C',leaf:'#059669',rose:'#DB2777',teal:'#0891B2'};
var IDEAS=[['Drink 2L of water','drop','blue'],['Read 10 pages','book','violet'],['Move for 20 minutes','bolt','sun'],['Meditate','leaf','leaf'],['Write in journal','pen','rose'],['In bed by 11','moon','teal'],['Practise a language','chat','blue'],['Stretch','dumb','leaf']];
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WEEKS=16;

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var ic=function(id,cls){return '<svg class="'+(cls||'ic')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'};
var flame=function(cls){return '<svg class="'+(cls||'fl')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame"/></svg>'};

/* dates: local calendar days as YYYY-MM-DD */
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diff(a,b){return Math.round((a-b)/864e5)}

/* state */
var state={habits:[]};
var storageOk=true;
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.habits))state=s}}
  catch(e){storageOk=false}
  state.habits.forEach(function(h){h.done=h.done||{};if(COLORS.indexOf(h.color)<0)h.color='violet';if(ICONS.indexOf(h.icon)<0)h.icon='heart'});
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true}
  catch(e){if(storageOk)toast('Could not save. Storage is blocked or full.');storageOk=false}
}
var selKey=key(today()), todayKey=selKey, justToggled=null;

/* streak maths */
function curStreak(h){
  var d=today();if(!h.done[key(d)])d=add(d,-1);
  var n=0;while(h.done[key(d)]){n++;d=add(d,-1)}return n;
}
function bestStreak(h){
  var ks=Object.keys(h.done).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){var d=parse(k);run=(prev&&diff(d,prev)===1)?run+1:1;if(run>best)best=run;prev=d});
  return best;
}
function rate30(h){
  var t=today(),ks=Object.keys(h.done).sort();
  var first=parse(ks.length&&ks[0]<h.created?ks[0]:h.created);
  var start=add(t,-29);if(first>start)start=first;if(start>t)start=t;
  var span=diff(t,start)+1,n=0;
  for(var i=0;i<span;i++)if(h.done[key(add(start,i))])n++;
  return Math.round(n/span*100);
}
function doneOn(k){return state.habits.filter(function(h){return h.done[k]}).length}

/* render: today column */
function renderToday(){
  var t=today(),hs=state.habits,total=hs.length,done=doneOn(selKey),left=total-done,isToday=selKey===todayKey,sd=parse(selKey);
  var C=2*Math.PI*46,frac=total?done/total:0;
  var dayName=isToday?'today':(diff(t,sd)===1?'yesterday':'on '+WD[sd.getDay()]);
  var msg;
  if(!total)msg='Build your first streak.';
  else if(left===0)msg=isToday?'Perfect day. Every habit ticked.':'A perfect day. All ticked.';
  else if(done===0)msg=isToday?'Fresh day. Tick one off to get rolling.':'Nothing ticked '+dayName+' yet.';
  else msg=left+' to go '+dayName+'. Keep the chain alive.';
  var top=hs.map(function(h){return curStreak(h)}).reduce(function(a,b){return Math.max(a,b)},0);
  var wkDone=0;for(var i=0;i<7;i++)wkDone+=doneOn(key(add(t,-i)));
  var wkPct=total?Math.round(wkDone/(total*7)*100):0;

  var week='';
  for(i=6;i>=0;i--){
    var d=add(t,-i),k=key(d),f=total?doneOn(k)/total:0,c=2*Math.PI*16;
    week+='<button type="button" class="day'+(f===1?' full':'')+'" data-day="'+k+'" aria-pressed="'+(k===selKey)+'" aria-label="'+WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+', '+doneOn(k)+' of '+total+' done">'+
      '<span class="dl">'+WD[d.getDay()]+'</span>'+
      '<span class="dn num"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="16"/>'+(f>0?'<circle class="prg" cx="18" cy="18" r="16" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-f))+'"/>':'')+'</svg>'+d.getDate()+'</span>'+
      (i===0?'<span class="tdot" aria-hidden="true"></span>':'')+'</button>';
  }

  var html='<div class="hero">'+
    '<div class="hero-main"><div class="hero-text">'+
      '<span class="eyebrow num">'+(isToday?'Today':WD[sd.getDay()])+' · '+sd.getDate()+' '+MON[sd.getMonth()]+'</span>'+
      '<h2>'+msg+'</h2>'+
      '<div class="hero-chips">'+
        '<span class="hchip num">'+flame('')+(top?top+'-day top streak':'No streak yet')+'</span>'+
        (total?'<span class="hchip num" style="padding-left:12px">'+wkPct+'% this week</span>':'')+
      '</div></div>'+
      '<div class="ring" role="img" aria-label="'+done+' of '+total+' habits done"><svg viewBox="0 0 112 112"><circle class="trk" cx="56" cy="56" r="46"/>'+
        '<circle class="prg" cx="56" cy="56" r="46" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'"/></svg>'+
        '<div class="ring-c">'+(total&&left===0?'<div class="done-ic">'+ic('i-check','ic')+'</div>':'<b class="num">'+done+'<small>/'+total+'</small></b><span>done</span>')+'</div></div>'+
    '</div>'+
    '<div class="week" role="group" aria-label="Pick a day from the last week">'+week+'</div></div>';

  if(!total){
    html+='<div class="empty">'+
      '<svg width="132" height="112" viewBox="0 0 132 112" aria-hidden="true"><circle cx="66" cy="60" r="42" fill="#EFE7FF"/><circle cx="66" cy="60" r="30" fill="none" stroke="#D9C8FB" stroke-width="8"/>'+
      '<path d="M66 30a30 30 0 0 1 28 19" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>'+
      '<use href="#i-flame" x="48" y="41" width="36" height="36"/>'+
      '<circle cx="18" cy="34" r="7" fill="#38BDF8"/><circle cx="112" cy="26" r="5" fill="#FB7185"/><rect x="104" y="78" width="12" height="12" rx="4" fill="#4ADE80" transform="rotate(18 110 84)"/>'+
      '<path d="M24 86l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FBBF24"/></svg>'+
      '<h3>What will you do every day?</h3><p>Pick a starter below or make your own. Tick it off daily and watch the streak grow.</p>'+
      '<div class="sugs">'+IDEAS.slice(0,6).map(function(s,i){return '<button type="button" class="sug c-'+s[2]+'" data-idea="'+i+'"><i>'+ic('h-'+s[1])+'</i>'+s[0]+'</button>'}).join('')+'</div>'+
      '<button type="button" class="btn grad" data-act="add">'+ic('i-plus')+'Create your own</button></div>';
  }else{
    html+='<div class="sec-head"><h2>'+(isToday?'Today’s habits':WD[sd.getDay()]+' '+sd.getDate()+' '+MON[sd.getMonth()])+'</h2>'+
      (isToday?'<span class="count num">'+done+' of '+total+'</span>':'<button type="button" class="linkbtn" data-day="'+todayKey+'">Back to today</button>')+'</div>';
    html+='<ul class="habits">'+hs.map(function(h){
      var on=!!h.done[selKey],cs=curStreak(h),bs=bestStreak(h),alive=cs>0&&!h.done[todayKey];
      var chain='';
      for(var i=6;i>=0;i--){var d=add(t,-i),k=key(d);chain+='<span class="lk'+(h.done[k]?' on':'')+(k===selKey?' sel':'')+'">'+WD[d.getDay()][0]+'</span>'}
      var meta=cs>0?'<p class="h-meta live num">'+flame()+'<span><b>'+cs+'</b> day'+(cs>1?'s':'')+(alive?' · tick today to keep it':' in a row')+'</span></p>'
                   :'<p class="h-meta">'+(bs?'Streak ended. Start again today.':'Tick to start a streak')+'</p>';
      return '<li class="habit c-'+h.color+(on?' done':'')+'">'+
        '<div class="h-row"><span class="tile" aria-hidden="true">'+ic('h-'+h.icon)+'</span>'+
        '<div class="h-info"><p class="h-name">'+esc(h.name)+'</p>'+meta+'</div>'+
        '<button type="button" class="check'+(justToggled===h.id&&on?' pop':'')+'" data-check="'+h.id+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+', '+(on?'done':'not done')+'">'+ic('i-check')+'</button></div>'+
        '<div class="h-foot"><div class="chain" role="img" aria-label="Last 7 days">'+chain+'</div>'+
        '<div class="foot-r"><span class="best num" title="Best streak">'+ic('i-trophy','ic')+bs+'<span>&nbsp;best</span></span>'+
        '<button type="button" class="more" data-edit="'+h.id+'" aria-label="Edit '+esc(h.name)+'">'+ic('i-more')+'</button></div></div></li>';
    }).join('')+'</ul>';
  }
  $('#today').innerHTML=html;
}

/* render: stats column */
function renderStats(){
  var t=today(),hs=state.habits,total=hs.length;
  var live={n:0,h:null},best={n:0,h:null},checks=0;
  hs.forEach(function(h){var c=curStreak(h),b=bestStreak(h);if(c>live.n)live={n:c,h:h};if(b>best.n)best={n:b,h:h};checks+=Object.keys(h.done).length});
  var done30=0,poss30=0;
  hs.forEach(function(h){var r=rate30(h);done30+=r;poss30+=100});
  var r30=poss30?Math.round(done30/poss30*100):0,cR=2*Math.PI*15;
  var bars='';for(var i=6;i>=0;i--){var n=doneOn(key(add(t,-i)));bars+='<i style="height:'+(total?Math.max(12,n/total*100):12)+'%"></i>'}

  var html='<div class="sec-head"><h2>Streaks</h2><span class="count">'+total+' habit'+(total===1?'':'s')+'</span></div>'+
  '<div class="kpis">'+
    '<div class="kpi hot c-sun"><svg class="mini" width="96" height="96" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame-w" color="#EA580C"/></svg>'+
      '<span class="chip"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame-w"/></svg></span>'+
      '<p class="lab">Top live streak</p><p class="val num">'+live.n+'<small>day'+(live.n===1?'':'s')+'</small></p><p class="sub">'+(live.h?esc(live.h.name):'Tick a habit to light it')+'</p></div>'+
    '<div class="kpi c-violet"><span class="chip">'+ic('i-trophy')+'</span>'+
      '<p class="lab">Best ever</p><p class="val num">'+best.n+'<small>day'+(best.n===1?'':'s')+'</small></p><p class="sub">'+(best.h?esc(best.h.name):'Your record goes here')+'</p></div>'+
    '<div class="kpi c-leaf"><span class="chip">'+ic('i-today')+'</span>'+
      '<svg class="mini" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="20" cy="20" r="15" fill="none" stroke="#D1FAE5" stroke-width="6"/><circle cx="20" cy="20" r="15" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+cR+'" stroke-dashoffset="'+(cR*(1-r30/100))+'"/></svg>'+
      '<p class="lab">30-day rate</p><p class="val num">'+r30+'<small>%</small></p><p class="sub">of days kept</p></div>'+
    '<div class="kpi c-blue"><span class="chip">'+ic('i-check')+'</span><div class="mini bars" aria-hidden="true">'+bars+'</div>'+
      '<p class="lab">Check-ins</p><p class="val num">'+checks.toLocaleString()+'</p><p class="sub">all time</p></div>'+
  '</div>';

  /* heatmap: 16 weeks, Monday first */
  var dow=(t.getDay()+6)%7,start=add(t,-dow-(WEEKS-1)*7),cells='',months='',lastM=-1;
  for(var w=0;w<WEEKS;w++){
    var ws=add(start,w*7),m=add(ws,6).getMonth();
    months+='<span>'+(m!==lastM&&w<WEEKS-1?MON[m]:'')+'</span>';lastM=m;
    for(var r=0;r<7;r++){
      var d=add(ws,r),k=key(d);
      if(d>t){cells+='<i class="future"></i>';continue}
      var n2=doneOn(k),f=total?n2/total:0,l=f===0?0:f<=.34?1:f<=.67?2:f<1?3:4;
      cells+='<i class="'+(l?'l'+l:'')+(k===todayKey?' today':'')+'" title="'+d.getDate()+' '+MON[d.getMonth()]+': '+n2+' of '+total+'"></i>';
    }
  }
  html+='<div class="card"><div class="card-head"><div><h3>Last 16 weeks</h3><p>Darker days mean more habits kept</p></div>'+
    '<div class="legend" aria-hidden="true">Less<i style="background:var(--surface-2)"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>More</div></div>'+
    '<div class="heat-wrap" style="--weeks:'+WEEKS+'"><div class="heat-months" aria-hidden="true">'+months+'</div>'+
    '<div class="heat-days" aria-hidden="true"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div>'+
    '<div class="heat" role="img" aria-label="Calendar heatmap of habits kept per day over the last 16 weeks">'+cells+'</div></div></div>';

  html+='<div class="card"><div class="card-head"><div><h3>Habit by habit</h3><p>Current streak and 30-day consistency</p></div></div>';
  if(!total)html+='<p class="muted-note">Add a habit and its streak shows up here.</p>';
  else html+='<ol class="rank">'+hs.map(function(h){return {h:h,c:curStreak(h),r:rate30(h)}}).sort(function(a,b){return b.c-a.c||b.r-a.r}).map(function(x){
    return '<li class="c-'+x.h.color+'"><span class="pos" aria-hidden="true">'+ic('h-'+x.h.icon)+'</span>'+
      '<div style="min-width:0"><p class="nm">'+esc(x.h.name)+'</p><div class="bar" role="img" aria-label="'+x.r+'% of the last 30 days"><i style="width:'+x.r+'%"></i></div></div>'+
      '<div class="rt num"><b>'+x.r+'%</b><span>'+flame('')+x.c+' day'+(x.c===1?'':'s')+'</span></div></li>';
  }).join('')+'</ol>';
  html+='</div>';
  $('#stats').innerHTML=html;
}

function render(){
  var a=document.activeElement,sel=null;
  if(a&&a.dataset){if(a.dataset.check)sel='[data-check="'+a.dataset.check+'"]';else if(a.dataset.day&&a.classList.contains('day'))sel='.day[data-day="'+a.dataset.day+'"]';else if(a.dataset.edit)sel='[data-edit="'+a.dataset.edit+'"]'}
  var d=today();
  $('#datePill span').textContent=WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];
  renderToday();renderStats();
  if(sel){var el=$(sel);if(el)el.focus({preventScroll:true})}
  justToggled=null;
}

/* feedback */
var toastT;
function toast(msg,withFlame){
  var el=$('#toast');el.innerHTML=(withFlame?flame(''):'')+'<span>'+esc(msg)+'</span>';el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2600);
}
function confetti(x,y,hex){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!document.body.animate)return;
  var cols=[hex,'#FBBF24','#FB7185','#38BDF8','#A855F7','#4ADE80'];
  for(var i=0;i<14;i++){
    var p=document.createElement('i');p.className='confetti';p.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%cols.length]+(i%3===0?';border-radius:50%':'');
    document.body.appendChild(p);
    var ang=Math.PI*2*i/14+Math.random()*.5,dist=46+Math.random()*46;
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(ang)*dist+'px),calc(-50% + '+(Math.sin(ang)*dist+24)+'px)) rotate('+(Math.random()*360)+'deg) scale(.4)',opacity:0}],
      {duration:650+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=(function(n){return function(){n.remove()}})(p);
  }
}

function toggle(id,btn){
  var h=state.habits.find(function(x){return x.id===id});if(!h)return;
  var before=curStreak(h);
  if(h.done[selKey])delete h.done[selKey];else{
    h.done[selKey]=1;justToggled=id;
    var r=btn.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,HEX[h.color]);
    if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  }
  save();render();
  if(h.done[selKey]){
    var now=curStreak(h),all=doneOn(selKey)===state.habits.length;
    if(all&&state.habits.length>1)toast(selKey===todayKey?'Perfect day! Everything ticked.':'All ticked for that day.',true);
    else if(now>before&&now>1&&(now%7===0||now===3||now===bestStreak(h)))toast(now+' days in a row on '+h.name,true);
  }
}

/* add / edit sheet */
var sheet=$('#sheet'),form=$('#form'),editing=null;
$('#iconPick').innerHTML=ICONS.map(function(i){return '<label title="'+ICON_NAMES[i]+'"><input type="radio" name="icon" value="'+i+'"><span class="sr">'+ICON_NAMES[i]+'</span>'+ic('h-'+i)+'</label>'}).join('');
$('#colorPick').innerHTML=COLORS.map(function(c){return '<label class="c-'+c+'" title="'+c+'"><input type="radio" name="color" value="'+c+'"><span>'+ic('i-check')+'</span><span class="sr">'+c+'</span></label>'}).join('');
$('#quick').innerHTML=IDEAS.map(function(s,i){return '<button type="button" class="sug c-'+s[2]+'" data-fill="'+i+'"><i>'+ic('h-'+s[1])+'</i>'+s[0]+'</button>'}).join('');

function preview(){
  var i=form.elements.icon.value||'drop',c=form.elements.color.value||'violet';
  $('#pvTile').className='tile c-'+c;$('#pvIcon').setAttribute('href','#h-'+i);
  $('#iconPick').style.setProperty('--pc',HEX[c]);
}
function openSheet(h){
  editing=h||null;
  $('#sheetTitle').textContent=h?'Edit habit':'New habit';
  $('#saveBtn').textContent=h?'Save changes':'Add habit';
  var del=$('#delBtn');del.hidden=!h;del.classList.remove('armed');$('span',del).textContent='Delete';
  $('#quick').hidden=!!h;$('#fErr').textContent='';
  form.elements.name.value=h?h.name:'';
  var used=state.habits.map(function(x){return x.color});
  var nextC=COLORS.find(function(c){return used.indexOf(c)<0})||COLORS[state.habits.length%COLORS.length];
  form.elements.icon.value=h?h.icon:ICONS[state.habits.length%ICONS.length];
  form.elements.color.value=h?h.color:nextC;
  preview();
  if(sheet.showModal)sheet.showModal();else sheet.setAttribute('open','');
  if(!h&&matchMedia('(min-width:760px)').matches)form.elements.name.focus();
}
function closeSheet(){if(sheet.close)sheet.close();else sheet.removeAttribute('open')}
function addHabit(name,icon,color){
  state.habits.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,icon:icon,color:color,created:todayKey,done:{}});
  save();render();
}
form.addEventListener('change',preview);
form.addEventListener('submit',function(e){
  e.preventDefault();
  var name=form.elements.name.value.trim().replace(/\s+/g,' ');
  if(!name){$('#fErr').textContent='Give your habit a name first.';form.elements.name.focus();return}
  if(editing){editing.name=name;editing.icon=form.elements.icon.value;editing.color=form.elements.color.value;save();render();toast('Habit updated')}
  else{addHabit(name,form.elements.icon.value,form.elements.color.value);selKey=todayKey;setView('today');render();toast('Added. Tick it off when it’s done.')}
  closeSheet();
});
$('#delBtn').addEventListener('click',function(){
  if(!this.classList.contains('armed')){this.classList.add('armed');$('span',this).textContent='Tap again to delete';return}
  var name=editing.name;state.habits=state.habits.filter(function(h){return h!==editing});save();render();closeSheet();toast('Deleted “'+name+'”');
});
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
form.elements.name.addEventListener('input',function(){$('#fErr').textContent=''});

function setView(v){
  document.body.dataset.view=v;
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-current',String(t.dataset.view===v))});
}

document.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;
  var d=el.dataset;
  if(d.check)toggle(d.check,el);
  else if(d.day){selKey=d.day;render()}
  else if(d.edit)openSheet(state.habits.find(function(h){return h.id===d.edit}));
  else if(d.act==='add')openSheet();
  else if(d.act==='close')closeSheet();
  else if(d.view){setView(d.view);window.scrollTo(0,0)}
  else if(d.idea){var s=IDEAS[+d.idea];addHabit(s[0],s[1],s[2]);toast('Added. Tick it off when it’s done.')}
  else if(d.fill){var f=IDEAS[+d.fill];form.elements.name.value=f[0];form.elements.icon.value=f[1];form.elements.color.value=f[2];$('#fErr').textContent='';preview()}
});

/* roll over at midnight / when the app comes back to the foreground */
function tick(){var k=key(today());if(k!==todayKey){if(selKey===todayKey)selKey=k;todayKey=k;render()}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
setInterval(tick,60000);
window.addEventListener('storage',function(e){if(e.key===KEY){load();render()}});

load();render();
})();
</script>
</body>
</html>
