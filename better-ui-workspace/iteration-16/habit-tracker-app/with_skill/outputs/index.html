<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rhythm · Habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — cool lilac-grey canvas, white cards, violet brand on the summary card and actions, soft category tints on habit chips. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F2F8; --surface: #FFFFFF; --surface-2: #F5F5FA; --line: #E8E8F0;
  --text: #14141F; --text-2: #5C5F72; --text-3: #6F7286;
  --brand: #5B4CF0; --brand-strong: #4A3BDB; --brand-tint: #EEECFE; --on-brand: #FFFFFF;
  --ok: #15803D; --ok-tint: #E8F7EE; --bad: #C62828; --bad-tint: #FDECEC; --flame: #E8590C;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(20,20,40,.04), 0 1px 1px rgba(20,20,40,.03);
  --sh-2: 0 1px 2px rgba(20,20,40,.04), 0 8px 24px -12px rgba(20,20,40,.12);
  --sh-float: 0 12px 32px -8px rgba(20,20,40,.20);
  --sh-brand: 0 1px 2px rgba(40,20,120,.2), 0 18px 36px -14px rgba(74,59,219,.55);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.side, .panel { display: none; }
.main { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); }
.view { display: grid; gap: 20px; animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

/* Tab bar (phone) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 560px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 8px; }
.tab { display: grid; justify-items: center; gap: 3px; padding: 8px 0; color: var(--text-3); font-size: 12px; font-weight: 500; min-height: 48px; border-radius: var(--r-sm); transition: color .15s; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab:active { transform: scale(.96); }
.fab { justify-self: center; width: 52px; height: 52px; border-radius: var(--r-full); background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: var(--sh-brand); transition: transform .15s ease-out, background-color .15s; }
.fab .ic { width: 24px; height: 24px; stroke-width: 2.2; }
@media (hover: hover) { .fab:hover { background: var(--brand-strong); } }
.fab:active { transform: scale(.94); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.top h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.eyebrow { font-size: 14px; color: var(--text-2); font-weight: 500; }
.avatar { width: 44px; height: 44px; border-radius: var(--r-full); background: #FFE7C7; overflow: hidden; display: grid; place-items: center; flex: none;
  font-weight: 600; color: #8A4B00; box-shadow: 0 0 0 2px var(--surface), var(--sh-2); }
.avatar img { width: 100%; height: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); background: var(--surface); display: grid; place-items: center; color: var(--text); box-shadow: var(--sh-1); border: 1px solid var(--line); transition: background-color .15s, transform .15s; }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }
.icon-btn:active { transform: scale(.95); }
.icon-btn:disabled { opacity: .4; cursor: default; }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--surface); border-radius: var(--r-lg); padding: 8px; box-shadow: var(--sh-1); border: 1px solid var(--line); }
.day { display: grid; justify-items: center; gap: 4px; padding: 8px 0; border-radius: var(--r-md); transition: background-color .15s; min-height: 72px; }
.day .dow { font-size: 12px; font-weight: 500; color: var(--text-3); }
.day .dring { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.day .dring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.day .dnum { font-size: 14px; font-weight: 600; position: relative; }
@media (hover: hover) { .day:not(:disabled):hover { background: var(--surface-2); } }
.day.is-sel { background: var(--brand); }
.day.is-sel .dow { color: rgba(255,255,255,.85); }
.day.is-sel .dnum { color: #fff; }
.day.is-today:not(.is-sel) .dnum { color: var(--brand); }
.day:disabled { cursor: default; }
.day:disabled .dnum { color: #A3A5B5; }

/* ---------- Summary card ---------- */
.summary { position: relative; overflow: clip; border-radius: var(--r-lg); padding: 20px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, #7A6DFF 0%, var(--brand) 45%, var(--brand-strong) 100%); box-shadow: var(--sh-brand); }
.summary::before { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); pointer-events: none; }
.summary::before { width: 220px; height: 220px; right: -70px; top: -90px; }
.s-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.s-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9); }
.s-fig { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 4px; }
.s-fig small { font-size: 20px; font-weight: 500; color: rgba(255,255,255,.8); }
.s-sub { font-size: 14px; color: rgba(255,255,255,.9); margin-top: 2px; }
.s-ring { position: relative; width: 88px; height: 88px; flex: none; }
.s-ring svg { transform: rotate(-90deg); }
.s-ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.s-ring circle.val { transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.s-stats { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.2); }
.s-stat { display: flex; align-items: center; gap: 10px; }
.s-stat + .s-stat { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.2); }
.s-stat .chip { width: 36px; height: 36px; border-radius: var(--r-sm); background: rgba(255,255,255,.16); display: grid; place-items: center; flex: none; }
.s-stat b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.s-stat span { display: block; font-size: 13px; color: rgba(255,255,255,.88); line-height: 1.3; }

/* ---------- Sections & cards ---------- */
.sec { display: grid; gap: 12px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-h h2 { font-size: 18px; letter-spacing: -0.01em; }
.link { font-size: 14px; font-weight: 600; color: var(--brand); padding: 10px 4px; border-radius: var(--r-xs); display: inline-flex; align-items: center; gap: 4px; }
@media (hover: hover) { .link:hover { color: var(--brand-strong); } }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); border: 1px solid var(--line); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-h h2, .card-h h3 { font-size: 16px; }
.card-h .meta { font-size: 13px; color: var(--text-2); }

/* Habit rows */
.habits { display: grid; gap: 8px; }
.habit { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r-md); padding: 10px 12px 10px 10px; box-shadow: var(--sh-1); border: 1px solid var(--line); transition: box-shadow .15s, transform .15s; }
@media (hover: hover) { .habit:hover { box-shadow: var(--sh-2); } }
.h-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; padding: 2px; border-radius: var(--r-sm); }
.ichip { width: 48px; height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 13%, #fff); }
.ichip img, .ichip .nemo { width: 30px; height: 30px; font-size: 24px; line-height: 30px; text-align: center; }
.h-text { min-width: 0; }
.h-name { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.h-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; }
.h-sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.streak { white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; color: var(--text); font-weight: 600; }
.streak .ic { width: 14px; height: 14px; color: var(--flame); stroke-width: 2; }
.check { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: var(--r-full); }
.check span { width: 34px; height: 34px; border-radius: var(--r-full); border: 2px solid #D6D7E3; display: grid; place-items: center; color: transparent; transition: background-color .2s, border-color .2s, color .2s; }
.check .ic { width: 18px; height: 18px; stroke-width: 2.6; }
@media (hover: hover) { .check:hover span { border-color: var(--brand); color: color-mix(in srgb, var(--brand) 45%, transparent); } }
.check.on span { background: var(--brand); border-color: var(--brand); color: #fff; }
.check.pop span { animation: pop .32s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* Empty state */
.empty { text-align: center; display: grid; justify-items: center; gap: 8px; padding: 32px 20px; }
.empty img, .empty .nemo { width: 96px; height: 96px; font-size: 72px; line-height: 96px; margin-bottom: 8px; }
.empty h2 { font-size: 20px; }
.empty p { color: var(--text-2); font-size: 14px; max-width: 30ch; text-wrap: balance; }
.empty .btn { margin-top: 12px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 16px;
  background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 16px -6px rgba(74,59,219,.6); transition: transform .15s ease-out, background-color .15s; }
@media (hover: hover) { .btn:hover { background: var(--brand-strong); } }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.full { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); } }
.btn.danger { background: var(--bad); box-shadow: none; }
.btn.danger-ghost { background: var(--bad-tint); color: var(--bad); box-shadow: none; }

/* ---------- Stats ---------- */
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #E6E6EF; border-radius: var(--r-full); padding: 4px; }
.seg button { height: 36px; padding: 0 16px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-1); border: 1px solid var(--line); display: grid; gap: 12px; align-content: start; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
.tile-top .pill { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tchip { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--c) 13%, #fff); color: var(--c); }
.tile .lab { font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile .fig { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.tile .fig small { font-size: 14px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-full); }
.pill.up { background: var(--ok-tint); color: var(--ok); }
.pill.down { background: var(--bad-tint); color: var(--bad); }
.pill.flat { background: var(--surface-2); color: var(--text-2); }

/* Bar chart */
.chart { position: relative; height: 168px; display: grid; grid-template-columns: 40px 1fr; }
.y-ax { position: relative; font-size: 12px; color: var(--text-3); }
.y-ax span { position: absolute; right: 8px; transform: translateY(-50%); }
.plot { position: relative; height: 140px; }
.grid-l { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: var(--gap, 10px); }
.bar { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; }
.bar i { display: block; width: 100%; border-radius: var(--r-xs) var(--r-xs) 4px 4px; background: #D9D5FD; min-height: 3px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
.bar.hi i { background: var(--brand); }
.bar .tip { position: absolute; left: 50%; transform: translate(-50%, -100%); margin-top: -6px; background: var(--text); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-xs); white-space: nowrap; }
.x-ax { grid-column: 2; display: flex; gap: var(--gap, 10px); margin-top: 8px; font-size: 12px; color: var(--text-3); }
.x-ax span { flex: 1; text-align: center; white-space: nowrap; }
.x-ax span.hi { color: var(--brand); font-weight: 600; }

/* Per-habit list */
.hlist { display: grid; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; }
.hrow + .hrow { border-top: 1px solid var(--line); }
.hrow .ichip { width: 40px; height: 40px; border-radius: var(--r-sm); }
.hrow .ichip img, .hrow .ichip .nemo { width: 24px; height: 24px; font-size: 20px; line-height: 24px; }
.hrow-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.hrow-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.hrow-top b { font-weight: 600; }
.hrow-top span { color: var(--text-2); white-space: nowrap; }
.meter { height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }

/* ---------- Calendar ---------- */
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.cal-h h2 { font-size: 18px; }
.cal-nav { display: flex; gap: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { font-size: 12px; font-weight: 500; color: var(--text-3); text-align: center; padding-bottom: 4px; }
.cell { aspect-ratio: 1; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--text-2); min-height: 36px; transition: transform .12s; }
.cell.l1 { background: #E6E2FE; color: #3B2FB5; }
.cell.l2 { background: #C9C2FC; color: #2A1F98; }
.cell.l3 { background: #9D91F8; color: #1B1270; }
.cell.l4 { background: var(--brand); color: #fff; }
.cell.today { box-shadow: inset 0 0 0 2px var(--brand-strong); }
.cell.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand); }
.cell.today.l4 { box-shadow: inset 0 0 0 2px #fff, 0 0 0 0 transparent; }
.cell.future, .cell.pre { background: transparent; color: var(--text-3); font-weight: 500; }
.cell.blank { background: transparent; }
button.cell:active { transform: scale(.94); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 16px; font-size: 12px; color: var(--text-2); }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }
.legend span { margin: 0 4px; }
.mini .cal { gap: 4px; }
.mini .cell { font-size: 12px; border-radius: var(--r-xs); min-height: 0; }

.dayrows { display: grid; }
.dayrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.dayrow + .dayrow { border-top: 1px solid var(--line); }
.dayrow .ichip { width: 40px; height: 40px; border-radius: var(--r-sm); }
.dayrow .ichip img, .dayrow .ichip .nemo { width: 24px; height: 24px; font-size: 20px; line-height: 24px; }
.dayrow .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
.dayrow .check { margin-right: -6px; }

/* ---------- Settings ---------- */
.profile { display: flex; align-items: center; gap: 16px; }
.profile .avatar { width: 64px; height: 64px; font-size: 24px; }
.field { display: grid; gap: 6px; }
.field label, .flabel { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 13px; color: var(--text-2); }
.input { height: 48px; width: 100%; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid #DCDCE6; background: var(--surface); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.err { font-size: 13px; color: var(--bad); }
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); border: 1px solid var(--line); overflow: hidden; }
.group-t { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 16px -4px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; width: 100%; text-align: left; transition: background-color .15s; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover, label.row:hover { background: var(--surface-2); }
label.row { cursor: pointer; }
.row .tchip { width: 36px; height: 36px; border-radius: var(--r-xs); }
.row .tchip .ic { width: 18px; height: 18px; }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-size: 15px; font-weight: 600; }
.row .rt span { display: block; font-size: 13px; color: var(--text-2); }
.row .chev { color: var(--text-3); }
.row.danger .rt b { color: var(--bad); }
.row .seg button { height: 36px; padding: 0 12px; font-size: 13px; }
.foot-note { text-align: center; font-size: 13px; color: var(--text-2); }

/* ---------- Sheet (dialog) ---------- */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); color: var(--text);
  box-shadow: var(--sh-float); overflow: auto; overscroll-behavior: contain; }
dialog.sheet::backdrop { background: rgba(16,16,30,.42); }
dialog.sheet[open] { animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
.sheet-in:focus { outline: none; }
.sheet-in { padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 20px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #DCDCE6; margin: 0 auto; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-h h2 { font-size: 20px; letter-spacing: -0.01em; }
.sheet-h .icon-btn { box-shadow: none; background: var(--surface-2); border: 0; }
.sheet-h .icon-btn:focus-visible { box-shadow: 0 0 0 4px var(--brand-tint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sug { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; font-weight: 500; transition: background-color .15s, border-color .15s; }
.sug img, .sug .nemo { width: 22px; height: 22px; font-size: 17px; line-height: 22px; text-align: center; }

<script>
/* ================= Icons ================= */
const P = {

  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M9 20h6M10 17h4"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/>',
  star: '<path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  upload: '<path d="M12 16V5M7 10l5-5 5 5"/><path d="M5 20h14"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  week: '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 14h.01M12 14h.01M15 14h.01"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
};
const ic = (n, extra = '') => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${P[n]}</svg>`;

/* ================= Emoji (Fluent 3D with native fallback) ================= */
const e3d = (e) => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' + [...e].map(c => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e) => `<img src="${e3d(e)}" alt="" width="30" height="30" data-e="${e}" onerror="emojiFail(this)">`;
function emojiFail(img) { const s = document.createElement('span'); s.className = 'nemo'; s.setAttribute('aria-hidden', 'true'); s.textContent = img.dataset.e; img.replaceWith(s); }

const EMOJIS = ['💧','📚','🚶','🧘','📝','🏃','🥗','🎨','💊','🎸','🧹','🌱','☕','🍎','💪','🧴'];
const COLORS = [
  { k: 'indigo', c: '#5B4CF0' },
  { k: 'blue',   c: '#2F7FE6' },
  { k: 'violet', c: '#7B5CF5' },
  { k: 'green',  c: '#1E9E62' },
  { k: 'amber',  c: '#D9771A' },
  { k: 'coral',  c: '#E5534B' },
  { k: 'teal',   c: '#14969A' },
  { k: 'pink',   c: '#D6478E' },
];
const colorOf = (k) => (COLORS.find(x => x.k === k) || COLORS[0]).c;
const SUGGEST = [
  { name: 'Drink water', emoji: '💧', goal: '8 glasses', color: 'blue' },
  { name: 'Read', emoji: '📚', goal: '20 pages', color: 'amber' },
  { name: 'Go for a run', emoji: '🏃', goal: '5 km', color: 'coral' },
  { name: 'Meditate', emoji: '🧘', goal: '10 minutes', color: 'teal' },
  { name: 'Eat a salad', emoji: '🥗', goal: '', color: 'green' },
  { name: 'Practice guitar', emoji: '🎸', goal: '15 minutes', color: 'violet' },
  { name: 'Skincare', emoji: '🧴', goal: 'Morning and night', color: 'pink' },
];

/* ================= Dates ================= */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const todayK = () => keyOf(todayD());
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const daysBetween = (a, b) => Math.round((b - a) / 864e5);

/* ================= State ================= */
const STORE = 'rhythm.v1';
let S;
let ui = { tab: 'today', sel: null, range: 7, calY: null, calM: null, calSel: null };

function seed() {
  const t = todayD();
  const habits = [
    { id: 'h1', name: 'Drink water', emoji: '💧', goal: '8 glasses', color: 'blue', created: keyOf(addDays(t, -80)) },
    { id: 'h2', name: 'Read', emoji: '📚', goal: '20 pages', color: 'amber', created: keyOf(addDays(t, -80)) },
    { id: 'h3', name: 'Morning walk', emoji: '🚶', goal: '30 minutes', color: 'green', created: keyOf(addDays(t, -80)) },
    { id: 'h4', name: 'Meditate', emoji: '🧘', goal: '10 minutes', color: 'teal', created: keyOf(addDays(t, -45)) },
    { id: 'h5', name: 'Journal', emoji: '📝', goal: 'Before bed', color: 'pink', created: keyOf(addDays(t, -26)) },
  ];
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const log = {};
  // [probability, current streak length, done today?, forced run [start,len]]
  const plan = { h1: [.82, 12, true, [55, 21]], h2: [.7, 5, false, null], h3: [.66, 3, true, [30, 9]], h4: [.74, 9, true, null], h5: [.55, 0, false, null] };
  for (const h of habits) {
    const [p, cur, doneToday, run] = plan[h.id];
    const set = {};
    const start = daysBetween(parse(h.created), t);
    for (let i = start; i >= 0; i--) if (rnd() < p) set[keyOf(addDays(t, -i))] = 1;
    if (run) for (let i = 0; i < run[1]; i++) set[keyOf(addDays(t, -run[0] + i))] = 1;
    if (run) { delete set[keyOf(addDays(t, -run[0] - 1))]; delete set[keyOf(addDays(t, -run[0] + run[1]))]; }
    const off = doneToday ? 0 : 1;
    delete set[keyOf(t)];
    if (doneToday) set[keyOf(t)] = 1;
    for (let i = 0; i < cur; i++) set[keyOf(addDays(t, -(i + off)))] = 1;
    delete set[keyOf(addDays(t, -(cur + off)))];
    log[h.id] = set;
  }
  return { name: 'Sam', weekStart: 1, habits, log, sample: true };
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && Array.isArray(d.habits)) return d; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('Could not save. Storage may be full.'); } }
S = load(); save();

/* ================= Derived ================= */
const done = (h, k) => !!(S.log[h.id] && S.log[h.id][k]);
const activeOn = k => S.habits.filter(h => h.created <= k);
function streak(h) {
  let d = todayD();
  if (!done(h, keyOf(d))) d = addDays(d, -1);
  let n = 0;
  while (done(h, keyOf(d))) { n++; d = addDays(d, -1); }
  return n;
}
function best(h) {
  const ks = Object.keys(S.log[h.id] || {}).sort();
  let b = 0, run = 0, prev = null;
  for (const k of ks) { const d = parse(k); run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; b = Math.max(b, run); prev = d; }
  return b;
}
function rate(h, days) {
  const t = todayD(); let tot = 0, ok = 0;
  for (let i = days - 1; i >= 0; i--) {
    const k = keyOf(addDays(t, -i));
    if (k < h.created) continue;
    if (i === 0 && !done(h, k)) continue;
    tot++; if (done(h, k)) ok++;
  }
  return tot ? ok / tot : 0;
}
function dayRatio(k) { const a = activeOn(k); if (!a.length) return null; return a.filter(h => done(h, k)).length / a.length; }
function rangeRate(days, endOffset = 0) {
  const t = todayD(); let tot = 0, ok = 0;
  for (let i = days - 1 + endOffset; i >= endOffset; i--) {
    const k = keyOf(addDays(t, -i));
    for (const h of activeOn(k)) { if (i === 0 && !done(h, k)) continue; tot++; if (done(h, k)) ok++; }
  }
  return tot ? ok / tot : 0;
}
const pct = r => Math.round(r * 100);

/* ================= Shared pieces ================= */
function avatar() {
  const n = (S.name || '').trim();
  const initial = (n[0] || '?').toUpperCase();
  return `<span class="avatar"><img src="https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(n || 'Rhythm')}&backgroundColor=ffe7c7" alt="" width="44" height="44" onerror="this.replaceWith(document.createTextNode('${initial.replace(/['\\]/g, '')}'))"></span>`;
}
function ring(r, size, stroke, color, track) {
  const rad = (size - stroke) / 2, c = 2 * Math.PI * rad;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    ${r > 0 ? `<circle class="val" cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - r)}"/>` : ''}
  </svg>`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function chartCard(days, title = 'Daily completion') {
  const t = todayD(); const pts = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(t, -i), k = keyOf(d), a = activeOn(k);
    const n = a.filter(h => done(h, k)).length;
    pts.push({ d, k, n, tot: a.length, r: a.length ? n / a.length : 0 });
  }
  const gap = days > 10 ? 4 : 10;
  const avg = rangeRate(days);
  const bars = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<div class="bar ${last ? 'hi' : ''}" title="${fmt(p.d, { weekday: 'short', day: 'numeric', month: 'short' })}: ${p.n} of ${p.tot}">
      <i style="height:${Math.max(2, p.r * 100)}%"></i>${last ? `<span class="tip num" style="bottom:${Math.max(2, p.r * 100)}%">${p.n}/${p.tot}</span>` : ''}</div>`;
  }).join('');
  const xl = pts.map((p, i) => {
    const last = i === pts.length - 1;
    let lab = '';
    if (days <= 10) lab = fmt(p.d, { weekday: 'short' }).slice(0, 3);
    else if ((pts.length - 1 - i) % 7 === 0) lab = last ? 'Today' : fmt(p.d, { day: 'numeric', month: 'short' });
    return `<span class="${last ? 'hi' : ''}">${lab}</span>`;
  }).join('');
  return `<section class="card" aria-label="${title}: average ${pct(avg)}% over the last ${days} days">
    <div class="card-h"><h2>${title}</h2><span class="meta num">Avg ${pct(avg)}%</span></div>
    <div class="chart" style="--gap:${gap}px">
      <div class="y-ax"><span style="top:0">100%</span><span style="top:50%">50%</span><span style="top:100%">0</span></div>
      <div class="plot"><div class="grid-l" style="top:0"></div><div class="grid-l" style="top:50%"></div><div class="grid-l" style="top:100%;border-top-style:solid"></div><div class="bars">${bars}</div></div>
      <div class="x-ax">${xl}</div>
    </div>
  </section>`;
}

function level(r) { if (r === null) return ''; if (r === 0) return ''; if (r < .4) return 'l1'; if (r < .7) return 'l2'; if (r < 1) return 'l3'; return 'l4'; }
function monthGrid(y, m, { mini = false, sel = null } = {}) {
  const first = new Date(y, m, 1), dim = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() - S.weekStart + 7) % 7;
  const tk = todayK();
  const wds = [];
  for (let i = 0; i < 7; i++) wds.push(`<span class="wd" aria-hidden="true">${fmt(new Date(2024, 0, 7 + ((S.weekStart + i) % 7)), { weekday: 'narrow' })}</span>`);
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cell blank"></span>';
  for (let d = 1; d <= dim; d++) {
    const k = keyOf(new Date(y, m, d));
    const future = k > tk; const r = future ? null : dayRatio(k); const pre = !future && r === null;
    const cls = ['cell', future ? 'future' : pre ? 'pre' : level(r), k === tk ? 'today' : '', sel === k ? 'sel' : ''].join(' ');
    const a = activeOn(k);
    const lab = `${fmt(new Date(y, m, d), { weekday: 'long', day: 'numeric', month: 'long' })}${future || pre ? '' : `, ${a.filter(h => done(h, k)).length} of ${a.length} done`}`;
    if (mini || future || pre) cells += `<span class="${cls}" aria-label="${lab}" role="img">${d}</span>`;
    else cells += `<button class="${cls}" data-cal="${k}" aria-label="${lab}" aria-pressed="${sel === k}">${d}</button>`;
  }
  return `<div class="cal">${wds.join('')}${cells}</div>
    <div class="legend" aria-hidden="true"><span>Less</span><i></i><i class="cell l1" style="min-height:0"></i><i class="cell l2" style="min-height:0"></i><i class="cell l3" style="min-height:0"></i><i class="cell l4" style="min-height:0"></i><span>More</span></div>`;
}

/* ================= Views ================= */
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

function viewToday() {
  const tk = todayK();
  const k = ui.sel && ui.sel <= tk ? ui.sel : tk;
  const isToday = k === tk;
  const t = todayD();
  const start = addDays(t, -((t.getDay() - S.weekStart + 7) % 7));
  let strip = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), dk = keyOf(d), fut = dk > tk;
    const r = fut ? 0 : (dayRatio(dk) || 0);
    const sel = dk === k;
    strip += `<button class="day ${dk === tk ? 'is-today' : ''} ${sel ? 'is-sel' : ''}" data-day="${dk}" ${fut ? 'disabled' : ''} aria-pressed="${sel}" aria-label="${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${fut ? '' : `, ${pct(r)}% done`}">
      <span class="dow">${fmt(d, { weekday: 'narrow' })}</span>
      <span class="dring">${ring(fut ? 0 : r, 36, 3, sel ? '#fff' : 'var(--brand)', sel ? 'rgba(255,255,255,.28)' : '#E0DEEF')}<span class="dnum num">${d.getDate()}</span></span>
    </button>`;
  }
  const hs = activeOn(k);
  const n = hs.filter(h => done(h, k)).length;
  const r = hs.length ? n / hs.length : 0;
  const left = hs.length - n;
  const topStreak = S.habits.reduce((m, h) => Math.max(m, streak(h)), 0);
  const week = rangeRate(7);
  const sub = !hs.length ? 'No habits yet' : left === 0 ? 'All habits done' : `${left} habit${left === 1 ? '' : 's'} left${isToday ? ' today' : ''}`;
  const label = isToday ? 'Today' : fmt(parse(k), { weekday: 'long', day: 'numeric', month: 'short' });

  const rows = hs.map(h => {
    const on = done(h, k), st = streak(h), c = colorOf(h.color);
    const meta = [];
    if (h.goal) meta.push(esc(h.goal));
    meta.push(st > 0 ? `<span class="streak">${ic('flame')}<span class="num">${st} day${st === 1 ? '' : 's'}</span></span>` : `Best ${best(h)} day${best(h) === 1 ? '' : 's'}`);
    return `<div class="habit" style="--c:${c}">
      <button class="h-main" data-open="${h.id}" aria-label="${esc(h.name)}, details">
        <span class="ichip">${emo(h.emoji)}</span>
        <span class="h-text"><span class="h-name" style="display:block">${esc(h.name)}</span><span class="h-sub">${meta.join('<span class="dot" aria-hidden="true"></span>')}</span></span>
      </button>
      <button class="check ${on ? 'on' : ''}" data-toggle="${h.id}" data-k="${k}" aria-pressed="${on}" aria-label="${esc(h.name)} done"><span>${ic('check')}</span></button>
    </div>`;
  }).join('');

  const list = S.habits.length ? `<div class="habits">${rows}</div>` :
    `<div class="card empty">${emo('🌱').replace('width="30" height="30"', 'width="96" height="96"')}<h2>No habits yet</h2><p>Start with one or two things you want to do daily.</p><button class="btn" data-act="add">${ic('plus')}Add a habit</button></div>`;

  return `<div class="view">
    <header class="top">
      <div><p class="eyebrow">${fmt(t, { weekday: 'long', day: 'numeric', month: 'long' })}</p><h1>${greeting()}${S.name ? ', ' + esc(S.name) : ''}</h1></div>
      <button class="avatar-btn" data-go="settings" aria-label="Profile and settings" style="border-radius:999px">${avatar()}</button>
    </header>
    ${S.habits.length ? `<div class="week" aria-label="This week">${strip}</div>
    <section class="summary" aria-label="Progress">
      <div class="s-top">
        <div><p class="s-label">${label}</p><p class="s-fig num">${n}<small> of ${hs.length} done</small></p>${left === 0 ? `<p class="s-sub">All habits done</p>` : ""}</div>
        <div class="s-ring">${ring(r, 88, 8, '#fff', 'rgba(255,255,255,.22)')}<span class="pct num">${pct(r)}%</span></div>
      </div>
      <div class="s-stats">
        <div class="s-stat"><span class="chip">${ic('flame')}</span><div><b class="num">${topStreak} day${topStreak === 1 ? '' : 's'}</b><span>Longest streak</span></div></div>
        <div class="s-stat"><span class="chip">${ic('target')}</span><div><b class="num">${pct(week)}%</b><span>Last 7 days</span></div></div>
      </div>
    </section>` : ''}
    <section class="sec" aria-labelledby="habitsH">
      <div class="sec-h"><h2 id="habitsH">${isToday ? 'Habits' : 'Habits on ' + fmt(parse(k), { weekday: 'long' })}</h2>${isToday ? `<span class="eyebrow num" style="font-size:13px">${hs.length} daily</span>` : `<button class="link" data-day="${tk}">Back to today</button>`}</div>
      ${list}
    </section>
  </div>`;
}

function viewStats() {
  const d = ui.range;
  const cur = rangeRate(d), prev = rangeRate(d, d);
  const delta = Math.round((cur - prev) * 100);
  const t = todayD();
  let checks = 0, perfect = 0;
  for (let i = d - 1; i >= 0; i--) {
    const k = keyOf(addDays(t, -i)), a = activeOn(k), n = a.filter(h => done(h, k)).length;
    checks += n; if (a.length && n === a.length) perfect++;
  }
  const bestAll = S.habits.reduce((m, h) => Math.max(m, best(h)), 0);
  const bestH = S.habits.find(h => best(h) === bestAll);
  const sorted = [...S.habits].sort((a, b) => rate(b, d) - rate(a, d));
  const pill = delta > 0 ? `<span class="pill up num">▲ ${delta}%</span>` : delta < 0 ? `<span class="pill down num">▼ ${-delta}%</span>` : `<span class="pill flat">No change</span>`;
  return `<div class="view split">
    <header class="top"><div><p class="eyebrow">Last ${d} days</p><h1>Stats</h1></div>
      <div class="seg" role="group" aria-label="Range"><button data-range="7" aria-pressed="${d === 7}">Week</button><button data-range="30" aria-pressed="${d === 30}">Month</button></div></header>
    <div class="tiles">
      <div class="tile" style="--c:var(--brand)"><div class="tile-top"><span class="tchip">${ic('target')}</span>${pill}</div><div><p class="fig num">${pct(cur)}%</p><p class="lab">Completion rate</p></div></div>
      <div class="tile" style="--c:#E8590C"><div class="tile-top"><span class="tchip">${ic('flame')}</span>${bestH ? `<span class="pill flat" title="${esc(bestH.name)}">${esc(bestH.name)}</span>` : ''}</div><div><p class="fig num">${bestAll}<small> days</small></p><p class="lab">Best streak</p></div></div>
      <div class="tile" style="--c:#1E9E62"><div class="tile-top"><span class="tchip">${ic('check')}</span></div><div><p class="fig num">${checks}</p><p class="lab">Check-ins</p></div></div>
      <div class="tile" style="--c:#D9771A"><div class="tile-top"><span class="tchip">${ic('star')}</span></div><div><p class="fig num">${perfect}<small> of ${d}</small></p><p class="lab">Perfect days</p></div></div>
    </div>
    ${chartCard(d)}
    <section class="card" aria-labelledby="byH">
      <div class="card-h"><h2 id="byH">By habit</h2><span class="meta">Streak · rate</span></div>
      <div class="hlist">${sorted.length ? sorted.map(h => {
        const r = rate(h, d), st = streak(h);
        return `<button class="hrow" data-open="${h.id}" style="--c:${colorOf(h.color)}"><span class="ichip">${emo(h.emoji)}</span>
          <span class="hrow-body"><span class="hrow-top"><b>${esc(h.name)}</b><span class="num">${st > 0 ? `<span class="streak">${ic('flame')}${st}</span> · ` : ''}${pct(r)}%</span></span>
          <span class="meter"><i style="width:${pct(r)}%"></i></span></span></button>`;
      }).join('') : '<p class="foot-note" style="padding:12px 0">Add a habit to see stats.</p>'}</div>
    </section>
  </div>`;
}

function viewCalendar() {
  const t = todayD();
  if (ui.calY === null) { ui.calY = t.getFullYear(); ui.calM = t.getMonth(); }
  const y = ui.calY, m = ui.calM;
  const isCur = y === t.getFullYear() && m === t.getMonth();
  const sel = ui.calSel || todayK();
  const earliest = S.habits.reduce((a, h) => h.created < a ? h.created : a, todayK());
  const ed = parse(earliest);
  const canPrev = y > ed.getFullYear() || (y === ed.getFullYear() && m > ed.getMonth());
  // month summary
  const dim = new Date(y, m + 1, 0).getDate(); let tot = 0, ok = 0, perfect = 0;
  for (let d = 1; d <= dim; d++) { const k = keyOf(new Date(y, m, d)); if (k > todayK()) break; const a = activeOn(k); const n = a.filter(h => done(h, k)).length; tot += a.length; ok += n; if (a.length && n === a.length) perfect++; }
  const hs = activeOn(sel);
  const n = hs.filter(h => done(h, sel)).length;
  return `<div class="view split cal-v">
    <header class="top"><div><p class="eyebrow">Your history</p><h1>Calendar</h1></div></header>
    <section class="card" aria-labelledby="calT">
      <div class="cal-h"><div><h2 id="calT">${fmt(new Date(y, m, 1), { month: 'long', year: 'numeric' })}</h2><p class="eyebrow num" style="font-size:13px">${tot ? `${pct(ok / tot)}% · ${perfect} perfect day${perfect === 1 ? '' : 's'}` : 'No habits this month'}</p></div>
        <div class="cal-nav"><button class="icon-btn" data-month="-1" aria-label="Previous month" ${canPrev ? '' : 'disabled'}>${ic('left')}</button><button class="icon-btn" data-month="1" aria-label="Next month" ${isCur ? 'disabled' : ''}>${ic('right')}</button></div></div>
      ${monthGrid(y, m, { sel })}
    </section>
    <section class="card" aria-labelledby="dayT">
      <div class="card-h"><h2 id="dayT">${sel === todayK() ? 'Today' : fmt(parse(sel), { weekday: 'long', day: 'numeric', month: 'long' })}</h2><span class="meta num">${n} of ${hs.length} done</span></div>
      <div class="dayrows">${hs.length ? hs.map(h => {
        const on = done(h, sel);
        return `<div class="dayrow" style="--c:${colorOf(h.color)}"><span class="ichip">${emo(h.emoji)}</span><span class="nm">${esc(h.name)}${streak(h) ? `<span class="h-sub"><span class="streak">${ic('flame')}<span class="num">${streak(h)} days</span></span></span>` : h.goal ? `<span class="h-sub">${esc(h.goal)}</span>` : ''}</span>
          <button class="check ${on ? 'on' : ''}" data-toggle="${h.id}" data-k="${sel}" aria-pressed="${on}" aria-label="${esc(h.name)} done"><span>${ic('check')}</span></button></div>`;
      }).join('') : '<p class="foot-note" style="padding:8px 0">No habits on this day.</p>'}</div>
    </section>
  </div>`;
}

function viewSettings() {
  const total = Object.values(S.log).reduce((s, o) => s + Object.keys(o).length, 0);
  return `<div class="view">
    <header class="top"><div><p class="eyebrow">Profile and data</p><h1>Settings</h1></div></header>

      <div class="field" style="flex:1;min-width:0"><label for="nameIn">Your name</label><input class="input" id="nameIn" value="${esc(S.name || '')}" maxlength="24" autocomplete="given-name" placeholder="Name"></div></section>
    <p class="group-t">Preferences</p>

      <button class="row" data-act="import"><span class="tchip" style="--c:#1E9E62">${ic('upload')}</span><span class="rt"><b>Import data</b><span>Restore from an exported file</span></span><span class="chev">${ic('right')}</span></button>
      ${S.sample ? `<button class="row" data-act="fresh"><span class="tchip" style="--c:#D9771A">${ic('refresh')}</span><span class="rt"><b>Clear sample data</b><span>Remove the example habits</span></span><span class="chev">${ic('right')}</span></button>` : ''}
      <button class="row danger" data-act="reset"><span class="tchip" style="--c:#C62828">${ic('trash')}</span><span class="rt"><b>Delete all data</b><span>Habits and history on this device</span></span><span class="chev">${ic('right')}</span></button>
    </div>

}

function panel() {
  const t = todayD();
  const top = [...S.habits].map(h => ({ h, s: streak(h) })).sort((a, b) => b.s - a.s).slice(0, 3);
  return `${chartCard(7, 'This week')}
    <section class="card mini" aria-labelledby="pmT"><div class="card-h"><h2 id="pmT">${fmt(t, { month: 'long' })}</h2><button class="link" data-go="calendar" style="padding:0">Open calendar</button></div>${monthGrid(t.getFullYear(), t.getMonth(), { mini: true })}</section>
    ${top.length ? `<section class="card" aria-labelledby="tsT"><div class="card-h"><h2 id="tsT">Top streaks</h2></div><div class="hlist">${top.map(({ h, s }) =>
      `<button class="hrow" data-open="${h.id}" style="--c:${colorOf(h.color)}"><span class="ichip">${emo(h.emoji)}</span><span class="hrow-body"><span class="hrow-top"><b>${esc(h.name)}</b><span class="streak num">${ic('flame')}${s} day${s === 1 ? '' : 's'}</span></span><span class="meter"><i style="width:${Math.min(100, s / Math.max(1, best(h)) * 100)}%"></i></span></span></button>`).join('')}</div></section>` : ''}`;

/* ================= Render ================= */
const TABS = [['today', 'Today', 'today'], ['stats', 'Stats', 'stats'], ['calendar', 'Calendar', 'calendar'], ['settings', 'Settings', 'settings']];
function render(keepScroll = true) {
  const y = window.scrollY;
  const v = document.getElementById('view');
  v.innerHTML = ({ today: viewToday, stats: viewStats, calendar: viewCalendar, settings: viewSettings })[ui.tab]();
  const app = document.getElementById('app');
  v.classList.toggle('wide', ui.tab === 'stats' || ui.tab === 'calendar');
  app.classList.toggle('with-panel', ui.tab === 'today' && S.habits.length > 0);
  document.getElementById('panel').innerHTML = ui.tab === 'today' && S.habits.length ? panel() : '';
  const tk = todayK(); const left = activeOn(tk).filter(h => !done(h, tk)).length;
  document.getElementById('sideNav').innerHTML = TABS.map(([id, lab, i]) =>
    `<button class="nav-i" data-go="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>${ic(i)}${lab}${id === 'today' && left ? `<span class="count num">${left} left</span>` : ''}</button>`).join('');
  const tb = TABS.map(([id, lab, i]) => `<button class="tab" data-go="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>${ic(i)}<span>${lab}</span></button>`);
  tb.splice(2, 0, `<button class="fab" data-act="add" aria-label="New habit">${ic('plus')}</button>`);
  document.getElementById('tabbar').innerHTML = tb.join('');
  document.getElementById('sideFoot').innerHTML = `${avatar()}<div style="min-width:0"><b>${esc(S.name || 'You')}</b><span class="num">${S.habits.length} habit${S.habits.length === 1 ? '' : 's'}</span></div>`;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

/* ================= Sheets ================= */
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
let draft = null;
function openSheet(html) { sheetBody.innerHTML = html; if (!sheet.open) sheet.showModal(); const f = sheetBody.querySelector('[autofocus]'); if (f && matchMedia('(hover: hover)').matches) f.focus(); else sheetBody.focus(); sheetBody.scrollTop = 0; }
function closeSheet() { sheet.close(); }
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
const sheetHead = t => `<div class="grab" aria-hidden="true"></div><div class="sheet-h"><h2 id="sheetTitle">${t}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>`;

function editor(h) {

  renderEditor();
}
function renderEditor(err = '') {
  const d = draft, c = colorOf(d.color), isNew = !d.id;

      <div class="field"><label for="hName">Name</label><input class="input" id="hName" value="${esc(d.name)}" maxlength="40" placeholder="e.g. Stretch for 5 minutes" autocomplete="off" ${err ? 'aria-invalid="true" aria-describedby="hErr"' : ''} autofocus>${err ? `<p class="err" id="hErr">${err}</p>` : ''}</div>
      <div class="field"><label for="hGoal">Goal <span style="color:var(--text-2);font-weight:500">(optional)</span></label><input class="input" id="hGoal" value="${esc(d.goal || '')}" maxlength="24" placeholder="e.g. 10 minutes" autocomplete="off"></div>

}
function syncDraftFromInputs() {
  const n = document.getElementById('hName'), g = document.getElementById('hGoal');
  if (n) draft.name = n.value; if (g) draft.goal = g.value;
}

function detail(id) {
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const c = colorOf(h.color), st = streak(h), b = best(h), r = rate(h, 30), t = todayD(), tk = todayK();
  const end = addDays(t, (6 - (t.getDay() - S.weekStart + 7) % 7));
  const cWeekStart = addDays(parse(h.created), -((parse(h.created).getDay() - S.weekStart + 7) % 7));
  const weeks = Math.max(8, Math.min(16, Math.ceil((daysBetween(cWeekStart, end) + 1) / 7)));
  const start = addDays(end, -(weeks * 7 - 1));
  let cells = '', shown = 0;
  for (let i = 0; i < weeks * 7; i++) {
    const k = keyOf(addDays(start, i));
    const on = k <= tk && k >= h.created && done(h, k); if (on) shown++;
    cells += `<i class="${k > tk || k < h.created ? 'out' : on ? 'on' : ''}"></i>`;
  }
  const wl = [0, 2, 4].map(i => `<span style="grid-row:${i + 1}">${fmt(new Date(2024, 0, 7 + ((S.weekStart + i) % 7)), { weekday: 'narrow' })}</span>`).join('');
  openSheet(`<div class="grab" aria-hidden="true"></div>
    <div class="sheet-h" style="--c:${c}"><div class="det-head"><span class="ichip">${emo(h.emoji)}</span><div style="min-width:0"><h2 id="sheetTitle">${esc(h.name)}</h2><p>${h.goal ? esc(h.goal) + ' · ' : ''}Since ${fmt(parse(h.created), { day: 'numeric', month: 'short' })}</p></div></div>
      <button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
    <div class="det-stats">
      <div class="det-stat"><p class="fig num">${ic('flame')}${st}</p><p class="lab">Current streak</p></div>
      <div class="det-stat"><p class="fig num">${b}</p><p class="lab">Best streak</p></div>
      <div class="det-stat"><p class="fig num">${pct(r)}%</p><p class="lab">Last 30 days</p></div>
    </div>
    <div style="--c:${c}"><div class="card-h" style="margin-bottom:10px"><h3>Last ${weeks} weeks</h3><span class="meta num">${shown} check-ins</span></div>
      <div class="heat-wrap"><div class="heat-wd" aria-hidden="true">${wl}</div><div class="heat" role="img" aria-label="${shown} check-ins over the last ${weeks} weeks">${cells}</div></div>
      <div class="heat-ax" aria-hidden="true"><span>${fmt(start, { day: 'numeric', month: 'short' })}</span><span>Today</span></div></div>
    <div class="det-actions"><button class="btn ghost full" data-edit="${h.id}">${ic('edit')}Edit habit</button><button class="link danger-link" data-del="${h.id}">${ic('trash', 'style="width:16px;height:16px"')}Delete habit</button></div>`);
}

function confirmSheet(title, body, label, act, arg = '') {
  openSheet(`${sheetHead(title)}<p style="color:var(--text-2)">${body}</p>
    <div class="sheet-actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-confirm="${act}" data-arg="${arg}">${label}</button></div>`);
}

/* ================= Toast ================= */
let toastT;
function toast(msg, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${msg}</span>${action ? `<button data-undo>${action.label}</button>` : ''}`;
  el.classList.add('show');
  el._undo = action && action.fn;
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}

/* ================= Actions ================= */
function toggle(id, k, btn) {
  if (k > todayK()) return;
  const o = S.log[id] || (S.log[id] = {});
  if (o[k]) delete o[k]; else o[k] = 1;
  const hadFocus = btn && btn.matches(':focus-visible');
  save(); render();
  const nb = document.querySelector(`.main [data-toggle="${id}"][data-k="${k}"]`);
  if (nb && o[k]) nb.classList.add('pop');
  if (nb && hadFocus) nb.focus();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-undo]'); if (!t) return;
  const ds = t.dataset;
  if (ds.toggle) return toggle(ds.toggle, ds.k, t);
  if (ds.go) { ui.tab = ds.go; if (ds.go === 'today') ui.sel = null; render(false); return; }
  if (ds.day) { ui.sel = ds.day === todayK() ? null : ds.day; render(); return; }
  if (ds.range) { ui.range = +ds.range; render(); return; }
  if (ds.ws) { S.weekStart = +ds.ws; save(); render(); return; }
  if (ds.cal) { ui.calSel = ds.cal; render(); return; }
  if (ds.month) { let m = ui.calM + +ds.month, y = ui.calY; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.calM = m; ui.calY = y; ui.calSel = null; render(); return; }
  if (ds.open) return detail(ds.open);
  if (ds.edit) return editor(S.habits.find(h => h.id === ds.edit));
  if (ds.del) { const h = S.habits.find(x => x.id === ds.del); return confirmSheet('Delete habit?', `“${esc(h.name)}” and its ${Object.keys(S.log[h.id] || {}).length} check-ins will be removed.`, 'Delete', 'del', h.id); }
  if (ds.emo) { syncDraftFromInputs(); draft.emoji = ds.emo; renderEditor(); return; }
  if (ds.color) { syncDraftFromInputs(); draft.color = ds.color; renderEditor(); return; }
  if (ds.sug !== undefined) { const s = SUGGEST[+ds.sug]; Object.assign(draft, { name: s.name, emoji: s.emoji, goal: s.goal, color: s.color }); renderEditor(); return; }
  if ('undo' in ds) { const el = document.getElementById('toast'); if (el._undo) el._undo(); el.classList.remove('show'); return; }
  if (ds.confirm) {
    if (ds.confirm === 'del') {
      const i = S.habits.findIndex(h => h.id === ds.arg); const h = S.habits[i], lg = S.log[h.id];
      S.habits.splice(i, 1); delete S.log[h.id]; save(); closeSheet(); render();
      toast(`Deleted ${esc(h.name)}`, { label: 'Undo', fn: () => { S.habits.splice(i, 0, h); S.log[h.id] = lg; save(); render(); } });
    }
    if (ds.confirm === 'fresh' || ds.confirm === 'reset') {
      S = { name: ds.confirm === 'fresh' ? S.name : '', weekStart: S.weekStart, habits: [], log: {}, sample: false };
      save(); closeSheet(); ui = { tab: 'today', sel: null, range: 7, calY: null, calM: null, calSel: null }; render(false);
    }
    return;
  }
  switch (ds.act) {
    case 'add': return editor(null);
    case 'close': return closeSheet();
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `rhythm-${todayK()}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Data exported'); return;
    }
    case 'import': return document.getElementById('importFile').click();
    case 'fresh': return confirmSheet('Clear sample data?', 'The example habits and their history will be removed so you can start with your own.', 'Clear', 'fresh');
    case 'reset': return confirmSheet('Delete all data?', 'All habits and check-ins on this device will be permanently deleted.', 'Delete all', 'reset');
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'habitForm') return;
  e.preventDefault(); syncDraftFromInputs();
  const name = draft.name.trim();
  if (!name) { renderEditor('Give your habit a name.'); document.getElementById('hName').focus(); return; }
  if (S.habits.some(h => h.name.toLowerCase() === name.toLowerCase() && h.id !== draft.id)) { renderEditor('You already have a habit with this name.'); document.getElementById('hName').focus(); return; }
  if (draft.id) { Object.assign(S.habits.find(h => h.id === draft.id), { name, goal: draft.goal.trim(), emoji: draft.emoji, color: draft.color }); toast('Changes saved'); }
  else { const id = 'h' + Date.now().toString(36); S.habits.push({ id, name, goal: draft.goal.trim(), emoji: draft.emoji, color: draft.color, created: todayK() }); S.log[id] = {}; toast(`Added ${esc(name)}`); ui.tab = 'today'; ui.sel = null; }
  save(); closeSheet(); render();
});

document.addEventListener('change', e => {
  if (e.target.id === 'nameIn') { S.name = e.target.value.trim().slice(0, 24); save(); render(); }
  if (e.target.id === 'importFile') {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.habits) || typeof d.log !== 'object') throw new Error();
      S = { name: d.name || '', weekStart: d.weekStart === 0 ? 0 : 1, habits: d.habits, log: d.log, sample: false }; save(); render(); toast('Data imported');
    }).catch(() => toast('That file could not be read'));
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nameIn') e.target.blur(); });

// Refresh when the day changes or the tab becomes visible again
let lastDay = todayK();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayK() !== lastDay) { lastDay = todayK(); ui.sel = null; render(); } });
setInterval(() => { if (todayK() !== lastDay) { lastDay = todayK(); ui.sel = null; render(); } }, 60000);
window.addEventListener('storage', e => { if (e.key === STORE) { S = load(); render(); } });

render(false);
</script>
</body>
</html>
