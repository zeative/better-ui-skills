<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F0">
<title>Setlog · Workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean, warm grey canvas, white cards, one near-black summary card, orange accent */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F3F3F0; --surface: #FFFFFF; --surface-2: #F5F5F2; --line: #E7E7E2;
  --text: #16161A; --text-2: #63636B; --text-3: #9A9AA2;
  --brand: #FF5A1F; --brand-ink: #C2410C; --brand-tint: #FFEDE4; --on-brand: #1A0B04;
  --dark: #17171B; --dark-2: #232329;
  --ok: #11713A; --ok-tint: #E7F6EC; --warn: #B45309; --warn-tint: #FEF3E2; --bad: #B91C1C; --bad-tint: #FDECEC;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(23,20,16,.05), 0 1px 1px rgba(23,20,16,.03);
  --sh-2: 0 1px 2px rgba(23,20,16,.04), 0 8px 24px -12px rgba(23,20,16,.12);
  --sh-float: 0 12px 32px -8px rgba(23,20,16,.20);
  --c-chest: #EF5A4F; --c-back: #2F74E8; --c-legs: #7457F2; --c-shoulders: #0C9A99; --c-arms: #D98A06; --c-core: #1E9A62; --c-glutes: #D9488F;
  --tabbar-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { min-height: 100dvh; }
.side { display: none; }
main { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); }
.view { display: none; }
.view.on { display: block; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding: 6px 8px env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-2); border-radius: var(--r-sm); transition: color .15s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand-ink); }
.tab[aria-current="page"] svg { color: var(--brand); }
.tab:active { transform: scale(.96); }

/* ---------- header ---------- */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; min-height: 48px; }
.eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.title { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFD9C7; overflow: hidden; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--brand-ink); box-shadow: 0 0 0 2px var(--surface), var(--sh-1); }
.avatar img { width: 100%; height: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1); color: var(--text); }

.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--text); }
.chip-btn:hover { background: var(--surface-2); }

/* ---------- cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 16px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding: 0 4px; }
.section-head h2 { font-size: 18px; letter-spacing: -.01em; }
.section-head .aside { font-size: 14px; color: var(--text-2); font-weight: 500; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 10px 8px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: var(--r-md); transition: background-color .15s; min-height: 76px; }
.day:hover { background: var(--surface-2); }
.day .dl { font-size: 12px; color: var(--text-2); font-weight: 500; }
.day .dn { position: relative; width: 38px; height: 38px; display: grid; place-items: center; font-size: 15px; font-weight: 600; }
.day .dn svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.day.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--text); }
.day.sel .dl { color: var(--text); font-weight: 600; }
.day .dn.full { background: var(--brand); border-radius: 50%; color: var(--on-brand); }
.day .dn.full svg { display: none; }
.day .trk { stroke: var(--line); }
.day .rest-ring { stroke: var(--line); stroke-dasharray: 2 4; }
.day .today-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--brand); }
.day .today-dot.off { background: transparent; }

/* summary card */
.summary { position: relative; overflow: hidden; margin-top: 12px; background: var(--dark); color: #fff; border-radius: var(--r-lg); padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 20px 40px -18px rgba(23,23,27,.55); }
.sum-top { position: relative; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.sum-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.72); }
.sum-label .pill { height: 22px; padding: 0 8px; border-radius: var(--r-full); background: rgba(74,222,128,.16); color: #86EFAC; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.sum-title { font-size: 24px; letter-spacing: -.02em; margin-top: 6px; line-height: 1.2; }
.sum-sub { font-size: 14px; color: rgba(255,255,255,.72); margin-top: 4px; }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .rv b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.ring .rv b small { font-size: 15px; color: rgba(255,255,255,.6); font-weight: 500; }
.ring .rv span { font-size: 12px; color: rgba(255,255,255,.7); }
.ring .arc { transition: stroke-dasharray .5s cubic-bezier(.2,.8,.2,1); }
.sum-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.sum-stats div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.12); }
.sum-stats dt { font-size: 12px; color: rgba(255,255,255,.66); }
.sum-stats dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
.sum-stats dd small { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.66); }
.sum-next { position: relative; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); font-size: 14px; color: rgba(255,255,255,.75); display: flex; align-items: center; gap: 8px; }
.sum-next b { color: #fff; font-weight: 600; }

/* exercises */
.ex-list { display: grid; gap: 12px; }
.ex { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 14px 14px 14px; transition: box-shadow .2s; }
.ex-head { display: flex; align-items: center; gap: 12px; }
.ic-chip { width: 44px; height: 44px; border-radius: var(--r-sm); flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: color-mix(in srgb, var(--c) 88%, #000); }
.ic-chip svg { width: 22px; height: 22px; }
.ex-name { flex: 1; min-width: 0; }
.ex-name h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-name p { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.ex-check { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--text-3); transition: background-color .15s, border-color .15s, color .15s, transform .15s; }
.ex-check:hover { border-color: var(--text-3); color: var(--text-2); }
.ex-check:active { transform: scale(.92); }
.ex.done .ex-check { background: var(--brand); border-color: var(--brand); color: var(--on-brand); animation: pop .3s ease-out; }
.sets { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; margin-top: 14px; }
.set { position: relative; min-height: 52px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; transition: background-color .15s, border-color .15s, transform .15s; }
.set:hover:not(:disabled) { border-color: #D5D5CF; }
.set:active:not(:disabled) { transform: scale(.96); }
.set .sn { font-size: 12px; line-height: 1.4; color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
.set .sv { font-size: 14px; font-weight: 600; }
.set .sn svg { width: 12px; height: 12px; }
.set[aria-pressed="true"] { background: var(--brand-tint); border-color: #FFC9B3; color: var(--brand-ink); animation: pop .25s ease-out; }
.set[aria-pressed="true"] .sn { color: var(--brand-ink); }
.set[aria-pressed="true"] .sn svg { color: var(--brand); }
.set:disabled { cursor: default; }
@keyframes pop { 50% { transform: scale(1.06); } }

.notice { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--sh-1); font-size: 14px; color: var(--text-2); margin-bottom: 12px; }
.notice svg { color: var(--brand-ink); flex: none; }
.notice b { color: var(--text); font-weight: 600; }

/* preview list (rest day / plan) */
.rows { padding: 4px 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 15px; font-weight: 600; line-height: 1.3; }
.row .s { font-size: 13px; color: var(--text-2); }
.row .r { font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
.row .r small { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }

/* pills */
.status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-done { background: var(--ok-tint); color: var(--ok); }
.st-partial { background: var(--warn-tint); color: var(--warn); }
.st-missed { background: var(--bad-tint); color: var(--bad); }
.st-rest, .st-upcoming { background: var(--surface-2); color: var(--text-2); }
.st-live, .st-today { background: var(--brand-tint); color: var(--brand-ink); }
.delta { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; }
.delta.up { background: var(--ok-tint); color: var(--ok); }
.delta.down { background: var(--bad-tint); color: var(--bad); }
.delta.flat { background: var(--surface-2); color: var(--text-2); }

/* progress */
.vol-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lbl { font-size: 13px; color: var(--text-2); font-weight: 500; }
.big { white-space: nowrap; font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
.big small { font-size: 16px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.cmp { font-size: 13px; color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart { position: relative; margin-top: 20px; height: 168px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
.chart .grid { position: absolute; left: 0; right: 0; top: 0; bottom: 26px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.chart .grid i { border-top: 1px dashed var(--line); }
.bc { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
.bc .bv { font-size: 12px; font-weight: 600; color: var(--text-2); line-height: 16px; }
.bc .bt { width: 100%; max-width: 36px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.bc .b { width: 100%; border-radius: 8px 8px 4px 4px; background: #FFD3C0; min-height: 4px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.bc.cur .b { background: var(--brand); }
.bc.cur .bv { color: var(--text); }
.bc.fut .b { background: var(--surface-2); border: 1px dashed var(--line); }
.bc.rest .b { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 6px); min-height: 20px; }
.bc .bd { font-size: 12px; color: var(--text-2); font-weight: 500; height: 20px; display: grid; place-items: center; }
.bc.cur .bd { color: var(--brand-ink); font-weight: 700; }
.chart-empty { position: absolute; inset: 40px 0 auto; text-align: center; font-size: 14px; color: var(--text-2); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 148px; }
.tile .top { display: flex; align-items: center; gap: 10px; }
.tile .ic-chip { width: 36px; height: 36px; border-radius: var(--r-sm); }
.tile .ic-chip svg { width: 18px; height: 18px; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.tile .v small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.tile .foot { margin-top: auto; font-size: 13px; color: var(--text-2); }
.dots7 { display: flex; gap: 5px; margin-top: auto; }
.dots7 i { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.dots7 i.on { background: var(--brand); box-shadow: none; }
.minibar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: auto; }
.minibar i { display: block; height: 100%; border-radius: 4px; background: var(--c-back); }

.mg { display: grid; gap: 14px; }
.mg div { display: grid; grid-template-columns: 84px 1fr 28px; align-items: center; gap: 12px; font-size: 14px; }
.mg .tr { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.mg .tr i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
.mg div:not(:first-child) .tr i { background: #FFB596; }
.mg b { text-align: right; font-weight: 600; }
.seg i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 16px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend span { flex: 1; color: var(--text); }
.legend b { font-weight: 600; font-size: 14px; }

/* plan */
.plan-row { width: 100%; text-align: left; }
.plan-row:hover .t { color: var(--brand-ink); }
.plan-row .chev { color: var(--text-3); transition: transform .2s; flex: none; }
.plan-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.plan-ex { padding: 0 0 12px 56px; display: grid; gap: 8px; }
.plan-ex div { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }
.plan-ex span:first-child { min-width: 0; }
.plan-ex span:last-child { color: var(--text-2); white-space: nowrap; }
.daynum { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 600; color: var(--text-2); }
.daynum.today { background: var(--brand); color: var(--on-brand); }

/* profile */
.profile { display: flex; align-items: center; gap: 14px; }
.profile .avatar { width: 56px; height: 56px; }
.profile h2 { font-size: 18px; }
.profile p { font-size: 14px; color: var(--text-2); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
.set-row > div:first-child { min-width: 0; }
.segc { flex: none; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .t { font-size: 15px; font-weight: 600; }
.set-row .s { font-size: 13px; color: var(--text-2); }
.segc { display: inline-flex; padding: 3px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--line); }
.segc button { min-width: 40px; height: 36px; padding: 0 12px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .15s, color .15s; }
.segc button[aria-pressed="true"] { background: var(--dark); color: #fff; box-shadow: var(--sh-1); }
.link-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 0; text-align: left; font-size: 15px; font-weight: 600; }
.link-row + .link-row { border-top: 1px solid var(--line); }
.link-row .ic-chip { width: 36px; height: 36px; border-radius: var(--r-sm); }
.link-row .ic-chip svg { width: 18px; height: 18px; }
.link-row span.grow { flex: 1; }
.link-row small { display: block; font-size: 13px; font-weight: 400; color: var(--text-2); }
.link-row.danger { color: var(--bad); }
.link-row:hover span.grow { text-decoration: underline; text-underline-offset: 3px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; z-index: 30;
  background: var(--dark); color: #fff; border-radius: var(--r-full); padding: 10px 16px 10px 12px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
  box-shadow: var(--sh-float); transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .tick { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }

.desk-only { display: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.brand-mark { width: 32px; height: 32px; border-radius: var(--r-xs); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }

/* ---------- desktop ---------- */
@media (min-width: 900px) {
  .tabbar { display: none; }
  .app { display: grid; grid-template-columns: 248px 1fr; }
  .side { display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100dvh; padding: 24px 16px; background: var(--surface); border-right: 1px solid var(--line); }
  .side nav { display: grid; gap: 4px; }
  .side .tab { flex-direction: row; justify-content: flex-start; gap: 12px; height: 44px; padding: 0 12px; font-size: 15px; font-weight: 500; color: var(--text-2); }
  .side .tab:hover { background: var(--surface-2); color: var(--text); }
  .side .tab[aria-current="page"] { background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; }
  .side .me { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
  .side .me .avatar { width: 40px; height: 40px; }
  .side .me b { display: block; font-size: 14px; font-weight: 600; }
  .side .me span { font-size: 13px; color: var(--text-2); }
  .side .goal-card { padding: 16px; border-radius: var(--r-md); background: var(--surface-2); }
  .side .goal-card .lbl { margin-bottom: 4px; }
  .side .goal-card b { font-size: 20px; letter-spacing: -.01em; }
  .side .goal-card .dots7 { margin-top: 12px; }
  main { max-width: 1120px; width: 100%; padding: 32px 40px 48px; }
  .head .avatar-wrap { display: none; }
  .view.two.on { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .view.two > .col-main > .head { margin-bottom: 20px; }
  .desk-only { display: block; }
  .rail { position: sticky; top: 32px; display: grid; gap: 16px; padding-top: 68px; }
  .rail .chart { height: 150px; }
  .progress-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }

}

}

</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span>Setlog</div>
    <nav aria-label="Main" id="sideNav"></nav>

  </aside>

  <main id="main">
    <section class="view two" id="view-today" aria-labelledby="todayTitle"></section>
    <section class="view two" id="view-progress" aria-labelledby="progTitle"></section>
    <section class="view" id="view-plan" aria-labelledby="planTitle"></section>

  </main>

  <nav class="tabbar" aria-label="Main" id="tabbar"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- icons ---------- */
const P = {
  today: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  plan: '<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M8 14h2M14 14h2M8 17h2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  flame: '<path d="M12 21c-4 0-7-2.7-7-6.6 0-3 1.8-5 3.4-6.6.4 1.8 1.4 3 2.6 3.4C11 7.6 12.6 5 15 3c.4 3 4 5.6 4 10.6C19 18 16 21 12 21z"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  repeat: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  scale: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0l-3 3"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  // equipment
  barbell: '<path d="M2 12h20M6 7.5v9M9 6v12M15 6v12M18 7.5v9"/>',
  dumbbell: '<path d="M8.5 12h7"/><rect x="5" y="7.5" width="3.5" height="9" rx="1.2"/><rect x="15.5" y="7.5" width="3.5" height="9" rx="1.2"/><path d="M2.5 10v4M21.5 10v4"/>',
  bench: '<path d="M2.5 6.5h19M5.5 4.5v4M18.5 4.5v4M4 14h16M7 14v6M17 14v6M12 14v3"/>',
  cable: '<circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V15"/><path d="M8 15h8l-1 5H9z"/>',
  rope: '<circle cx="12" cy="4.5" r="2"/><path d="M12 6.5V11l-4 7M12 11l4 7"/><path d="M6.5 20.5h3M14.5 20.5h3"/>',
  rack: '<path d="M5 3v18M19 3v18M3 21h4M17 21h4M2 9.5h20"/><path d="M3 7.5v4M21 7.5v4"/>',
  steps: '<path d="M8 3c2 0 3 2.2 3 5s-1 5-3 5-3-2.2-3-5 1-5 3-5zM16 10c2 0 3 2.2 3 5s-1 5-3 5-3-2.2-3-5 1-5 3-5z"/>',
  machine: '<rect x="6" y="3" width="12" height="12" rx="2"/><path d="M6 7h12M6 11h12M12 15v5M8 20.5h8"/>',
  plate: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v3M12 18v3"/>',
  bar: '<path d="M3 4.5h18"/><path d="M9 4.5V9l1.5 2M15 4.5V9l-1.5 2"/><circle cx="12" cy="12.5" r="2"/><path d="M12 14.5v4M10 21.5l2-3 2 3"/>',
  person: '<circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v7M7 10h10M12 13.5l-3.5 7M12 13.5l3.5 7"/>',
  kettlebell: '<path d="M9 9.5V7a3 3 0 0 1 6 0v2.5"/><path d="M7.5 9.5h9l1.5 5a6 6 0 0 1-12 0z"/>',
  timer: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M10 2.5h4M18.5 6l1.5-1.5"/>',
};
const ic = (n, s = 20, w = 1.8) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- plan ---------- */
const G = { Chest: 'var(--c-chest)', Back: 'var(--c-back)', Legs: 'var(--c-legs)', Shoulders: 'var(--c-shoulders)', Arms: 'var(--c-arms)', Core: 'var(--c-core)', Glutes: 'var(--c-glutes)' };
const X = (id, name, group, sets, reps, kg, icon, unit = 'reps') => ({ id, name, group, sets, reps, kg, icon, unit });
const PLAN = [
  { name: 'Push', focus: 'Chest, shoulders and triceps', ex: [
    X('bench', 'Bench press', 'Chest', 4, 8, 60, 'bench'),
    X('ohp', 'Overhead press', 'Shoulders', 3, 8, 35, 'barbell'),
    X('incdb', 'Incline dumbbell press', 'Chest', 3, 10, 22, 'dumbbell'),
    X('fly', 'Cable fly', 'Chest', 3, 12, 15, 'cable'),
    X('tpd', 'Triceps pushdown', 'Arms', 3, 12, 25, 'rope') ] },
  { name: 'Legs', focus: 'Quads, hamstrings and calves', ex: [
    X('squat', 'Back squat', 'Legs', 4, 6, 80, 'rack'),
    X('rdl', 'Romanian deadlift', 'Legs', 3, 8, 70, 'barbell'),
    X('lunge', 'Walking lunge', 'Legs', 3, 10, 16, 'steps'),
    X('lpress', 'Leg press', 'Legs', 3, 12, 120, 'machine'),
    X('calf', 'Standing calf raise', 'Legs', 4, 15, 40, 'plate') ] },
  null,
  { name: 'Pull', focus: 'Back and biceps', ex: [
    X('dl', 'Deadlift', 'Back', 3, 5, 100, 'plate'),
    X('pullup', 'Pull-up', 'Back', 4, 6, 0, 'bar'),
    X('row', 'Barbell row', 'Back', 4, 8, 55, 'barbell'),
    X('facepull', 'Face pull', 'Shoulders', 3, 15, 20, 'rope'),
    X('hammer', 'Hammer curl', 'Arms', 3, 10, 14, 'dumbbell') ] },
  { name: 'Upper body', focus: 'Shoulders, back and arms', ex: [
    X('dbsp', 'Dumbbell shoulder press', 'Shoulders', 3, 10, 20, 'dumbbell'),
    X('latpd', 'Lat pulldown', 'Back', 3, 10, 50, 'cable'),
    X('dips', 'Dips', 'Arms', 3, 10, 0, 'person'),
    X('crow', 'Seated cable row', 'Back', 3, 12, 45, 'machine'),
    X('landmine', 'Landmine press', 'Shoulders', 3, 10, 25, 'barbell') ] },
  { name: 'Full body', focus: 'Strength and conditioning', ex: [
    X('fsquat', 'Front squat', 'Legs', 4, 6, 60, 'rack'),
    X('kbs', 'Kettlebell swing', 'Glutes', 3, 15, 24, 'kettlebell'),
    X('pushup', 'Push-up', 'Chest', 3, 15, 0, 'person'),
    X('carry', 'Farmer carry', 'Core', 3, 40, 32, 'steps', 'm'),
    X('plank', 'Plank', 'Core', 3, 45, 0, 'timer', 's') ] },
  { name: 'Lower body & core', focus: 'Glutes, hamstrings and core', ex: [
    X('hipthrust', 'Barbell hip thrust', 'Glutes', 4, 10, 90, 'barbell'),
    X('bss', 'Bulgarian split squat', 'Legs', 3, 8, 18, 'dumbbell'),
    X('legcurl', 'Lying leg curl', 'Legs', 3, 12, 35, 'machine'),
    X('hlr', 'Hanging leg raise', 'Core', 3, 12, 0, 'bar'),
    X('crunch', 'Cable crunch', 'Core', 3, 15, 30, 'cable') ] },
];

/* ---------- dates ---------- */
const DAY = 864e5;
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const wd = (d) => (d.getDay() + 6) % 7; // Monday = 0
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const TODAY = sod(new Date());
const TODAY_ISO = iso(TODAY);
const weekStart = (d) => add(d, -wd(d));

/* ---------- state ---------- */
const KEY = 'setlog.v1';
let S = load();
let view = 'today';
let sel = TODAY_ISO;
let openPlan = wd(TODAY);
let confirmClear = false;

function seed() {
  const logs = {};
  const full = (d) => { const p = PLAN[wd(d)]; if (!p) return; const l = {}; p.ex.forEach((e) => l[e.id] = Array(e.sets).fill(true)); logs[iso(d)] = l; };
  const ws = weekStart(TODAY), ti = wd(TODAY);
  for (let w = 3; w >= 1; w--) for (let i = 0; i < 7; i++) {
    const d = add(ws, i - 7 * w); const p = PLAN[i]; if (!p) continue;
    if (w === 1 && i === 4) continue;                     // missed Friday last week
    if (w === 2 && i === 5) continue;
    full(d);
    if (w === 1 && i === 5) { const last = p.ex[p.ex.length - 1]; logs[iso(d)][last.id] = Array(last.sets).fill(false); }
  }
  for (let i = 0; i < ti; i++) {
    const d = add(ws, i); const p = PLAN[i]; if (!p) continue;
    full(d);
    if (i === 1) { const last = p.ex[p.ex.length - 1]; logs[iso(d)][last.id] = [true, true, false, false].slice(0, last.sets); }
  }
  const tp = PLAN[ti];
  if (tp) { const l = {}; l[tp.ex[0].id] = Array(tp.ex[0].sets).fill(true); l[tp.ex[1].id] = Array(tp.ex[1].sets).fill(false); l[tp.ex[1].id][0] = true; logs[TODAY_ISO] = l; }
  return { logs, settings: { name: 'Sam Patel', units: 'kg', goal: 6, reminders: true } };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.logs && s.settings) return s; } catch (e) {}
  const s = seed(); localStorage.setItem(KEY, JSON.stringify(s)); return s;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- numbers ---------- */
const nf = new Intl.NumberFormat('en-GB');
const lb = () => S.settings.units === 'lb';
const wt = (kg) => lb() ? Math.round(kg * 2.20462 / 2.5) * 2.5 : kg;
const unitW = () => lb() ? 'lb' : 'kg';
const volFmt = (kg) => nf.format(Math.round(lb() ? kg * 2.20462 : kg));
const kFmt = (kg) => { const v = lb() ? kg * 2.20462 : kg; return v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v)); };
const repLabel = (e) => e.unit === 's' ? `${e.reps} s` : e.unit === 'm' ? `${e.reps} m` : `${e.reps} reps`;
const exMeta = (e) => {
  const load = e.kg ? `${nf.format(wt(e.kg))} ${unitW()}` : 'Bodyweight';
  const r = e.unit === 'reps' ? `${e.sets} × ${e.reps}` : `${e.sets} × ${e.reps} ${e.unit}`;
  return `${r} · ${load}`;
};

/* ---------- stats ---------- */
function dayStats(d) {
  const p = PLAN[wd(d)], key = iso(d), log = S.logs[key] || {};
  if (!p) return { rest: true, total: 0, done: 0, vol: 0, reps: 0, exDone: 0, status: 'rest' };
  let total = 0, done = 0, vol = 0, reps = 0, exDone = 0;
  const groups = {};
  p.ex.forEach((e) => {
    const arr = log[e.id] || [];
    const n = arr.filter(Boolean).length;
    total += e.sets; done += n;
    if (n === e.sets) exDone++;
    if (e.unit === 'reps') { reps += n * e.reps; vol += n * e.reps * e.kg; }
    if (n) groups[e.group] = (groups[e.group] || 0) + n;
  });
  let status;
  if (done === total) status = 'done';
  else if (key > TODAY_ISO) status = 'upcoming';
  else if (key === TODAY_ISO) status = done ? 'partial' : 'today';
  else status = done ? 'partial' : 'missed';
  return { rest: false, total, done, vol, reps, exDone, status, groups, plan: p };
}
function weekStats(ws, uptoIdx = 6) {
  const days = [];
  let workouts = 0, sets = 0, vol = 0, reps = 0, planned = 0; const groups = {};
  for (let i = 0; i < 7; i++) {
    const d = add(ws, i), s = dayStats(d); days.push({ d, ...s });
    if (i > uptoIdx) continue;
    if (!s.rest) planned++;
    if (s.status === 'done') workouts++;
    sets += s.done; vol += s.vol; reps += s.reps;
    for (const g in s.groups || {}) groups[g] = (groups[g] || 0) + s.groups[g];
  }
  return { days, workouts, sets, vol, reps, planned, groups };
}
function streaks() {
  let cur = 0, best = 0, run = 0, counting = true;
  for (let i = 0; i < 180; i++) {
    const d = add(TODAY, -i), s = dayStats(d);
    if (s.rest) continue;
    if (s.status === 'done') { run++; if (counting) cur = run; }
    else if (i === 0) { continue; }
    else { counting = false; best = Math.max(best, run); run = 0; }
  }
  return { cur, best: Math.max(best, run, cur) };
}

/* ---------- pieces ---------- */
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };
const first = () => (S.settings.name || 'there').split(' ')[0];
const avatarHTML = (cls = '') => `<span class="avatar ${cls}"><img alt="" width="44" height="44" src="https://api.dicebear.com/9.x/notionists/svg?seed=Sam%20Patel&backgroundColor=ffd9c7" onerror="this.replaceWith(document.createTextNode('${first()[0]}'))"></span>`;

function ringSVG(frac, size, r, stroke, track, color) {
  const c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, frac)) * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}" class="trk"/>
    ${frac > 0 ? `<circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${v.toFixed(1)} ${c.toFixed(1)}"/>` : ''}
  </svg>`;
}

function weekStrip() {
  const ws = weekStart(TODAY);
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = add(ws, i), s = dayStats(d), k = iso(d);
    const frac = s.rest ? 0 : s.done / s.total;
    const ring = s.rest
      ? `<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="17" fill="none" stroke-width="2" class="rest-ring"/></svg>`
      : ringSVG(frac, 38, 17, 2.5, 'var(--line)', 'var(--brand)');
    const label = `${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}: ${s.rest ? 'rest day' : `${s.plan.name}, ${s.done} of ${s.total} sets`}`;
    h += `<button class="day ${k === sel ? 'sel' : ''}" data-day="${k}" data-key="day-${k}" aria-label="${label}" ${k === sel ? 'aria-current="date"' : ''}>
      <span class="dl">${fmt(d, { weekday: 'short' }).slice(0, 3)}</span>
      <span class="dn num ${!s.rest && s.done === s.total ? 'full' : ''}">${ring}${d.getDate()}</span>
      <span class="today-dot ${k === TODAY_ISO ? '' : 'off'}"></span>
    </button>`;
  }
  return `<div class="card week" role="group" aria-label="This week">${h}</div>`;
}

function nextWorkout(from) {
  for (let i = 1; i <= 7; i++) { const d = add(from, i); if (PLAN[wd(d)]) return { d, p: PLAN[wd(d)] }; }
}

/* ---------- views ---------- */
function renderToday() {
  const d = parse(sel), s = dayStats(d), isToday = sel === TODAY_ISO, future = sel > TODAY_ISO;
  const dateLine = isToday ? fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }) : (future ? 'Coming up · ' : 'Log · ') + fmt(d, { day: 'numeric', month: 'long' });
  const title = isToday ? `${greet()}, ${first()}` : fmt(d, { weekday: 'long' });
  let head = `<header class="head">
    <div><p class="eyebrow">${isToday ? dateLine : dateLine}</p><h1 class="title" id="todayTitle">${title}</h1></div>
    ${isToday ? `<button class="avatar-wrap" data-tab="profile" aria-label="Profile">${avatarHTML()}</button>`
      : `<button class="chip-btn" data-day="${TODAY_ISO}">${ic('back', 16, 2)}Today</button>`}
  </header>`;

  let card, body;
  if (s.rest) {
    const n = nextWorkout(d);
    card = `<div class="summary">
      <div class="sum-top"><div>
        <span class="sum-label">${isToday ? 'Today' : fmt(d, { weekday: 'long' })}</span>
        <h2 class="sum-title">Rest day</h2>
        <p class="sum-sub">No training planned. A walk or light stretching is plenty.</p>
      </div><div class="ring" aria-hidden="true">${ringSVG(0, 88, 39, 7, 'rgba(255,255,255,.12)', 'var(--brand)')}<div class="rv">${ic('moon', 28, 1.6)}</div></div></div>
      <p class="sum-next">${ic('clock', 18)}Next: <b>${n.p.name}</b> on ${fmt(n.d, { weekday: 'long' })}</p>
    </div>`;
    body = `<div class="section"><div class="section-head"><h2>Up next · ${n.p.name}</h2><span class="aside">${n.p.ex.length} exercises</span></div>
      <div class="card rows">${n.p.ex.map((e) => `<div class="row"><span class="ic-chip" style="--c:${G[e.group]}">${ic(e.icon)}</span><div class="grow"><p class="t">${e.name}</p><p class="s">${e.group}</p></div><p class="r num">${exMeta(e)}</p></div>`).join('')}</div></div>`;
  } else {
    const p = s.plan, frac = s.done / s.total, mins = Math.round((s.total * 2.6 + 6) / 5) * 5;
    const complete = s.status === 'done';
    const label = isToday ? 'Today' : fmt(d, { weekday: 'long' });
    card = `<div class="summary">
      <div class="sum-top"><div style="min-width:0">
        <span class="sum-label">${label}${complete ? `<span class="pill">${ic('check', 12, 2.6)}Complete</span>` : ''}</span>
        <h2 class="sum-title">${p.name}</h2>
        <p class="sum-sub">${p.focus}</p>
      </div>
      <div class="ring" role="img" aria-label="${s.done} of ${s.total} sets done">${ringSVG(frac, 88, 39, 7, 'rgba(255,255,255,.12)', 'var(--brand)')}
        <div class="rv num"><b>${s.done}<small>/${s.total}</small></b><span>sets</span></div></div>
      </div>
      <dl class="sum-stats num">
        <div><dt>Exercises done</dt><dd>${s.exDone}<small> of ${p.ex.length}</small></dd></div>
        <div><dt>Volume</dt><dd>${volFmt(s.vol)}<small> ${unitW()}</small></dd></div>
        ${complete ? `<div><dt>Reps</dt><dd>${nf.format(s.reps)}</dd></div>` : `<div><dt>Est. time</dt><dd>${mins}<small> min</small></dd></div>`}
      </dl>
    </div>`;
    const log = S.logs[sel] || {};
    const left = p.ex.length - s.exDone;
    body = `<div class="section"><div class="section-head"><h2>Exercises</h2><span class="aside num">${complete ? 'All done' : `${left} left`}</span></div>
      ${future ? `<div class="notice">${ic('plan', 20)}<span>Scheduled for <b>${fmt(d, { weekday: 'long', day: 'numeric', month: 'short' })}</b>. You can tick sets off on the day.</span></div>` : ''}
      <div class="ex-list">${p.ex.map((e) => {
        const arr = log[e.id] || [], n = arr.filter(Boolean).length, all = n === e.sets;
        const sets = Array.from({ length: e.sets }, (_, i) => {
          const on = !!arr[i];
          return `<button class="set num" data-set="${e.id}:${i}" data-key="set-${e.id}-${i}" aria-pressed="${on}" ${future ? 'disabled' : ''} aria-label="${e.name}, set ${i + 1}, ${repLabel(e)}">
            <span class="sn">${on ? ic('check', 12, 3) : ''}Set ${i + 1}</span><span class="sv">${repLabel(e)}</span></button>`;
        }).join('');
        return `<article class="ex ${all ? 'done' : ''}">
          <div class="ex-head"><span class="ic-chip" style="--c:${G[e.group]}">${ic(e.icon)}</span>
            <div class="ex-name"><h3>${e.name}</h3><p class="num">${exMeta(e)}</p></div>
            <button class="ex-check" data-all="${e.id}" data-key="all-${e.id}" ${future ? 'disabled' : ''} aria-pressed="${all}" aria-label="${all ? 'Clear' : 'Complete'} all sets of ${e.name}">${ic('check', 20, 2.4)}</button>
          </div>
          <div class="sets" style="--n:${e.sets}">${sets}</div>
        </article>`;
      }).join('')}</div></div>`;
  }

  const rail = `<aside class="rail desk-only" aria-label="This week">${weekCard(true)}${streakTile()}${musclesHTML(true)}</aside>`;
  document.getElementById('view-today').innerHTML = `<div class="col-main">${head}${weekStrip()}${card}${body}</div>${rail}`;
}

function chartHTML(w) {
  const max = Math.max(1, ...w.days.map((x) => x.vol));
  const any = w.days.some((x) => x.vol > 0);
  const cols = w.days.map((x) => {
    const k = iso(x.d), cur = k === TODAY_ISO, fut = k > TODAY_ISO;
    const h = x.rest ? 0 : (x.vol / max) * 100;
    const cls = x.rest ? 'rest' : fut ? 'fut' : cur ? 'cur' : '';
    return `<div class="bc ${cls}"><div class="bt">${x.vol && !fut ? `<span class="bv num">${kFmt(x.vol)}</span>` : ''}<div class="b" style="height:${x.rest ? 16 : fut ? 10 : Math.max(h * .82, 3)}%"></div></div>
      <span class="bd">${fmt(x.d, { weekday: 'narrow' })}</span></div>`;
  }).join('');
  const desc = w.days.filter((x) => !x.rest).map((x) => `${fmt(x.d, { weekday: 'short' })} ${volFmt(x.vol)} ${unitW()}`).join(', ');
  return `<div class="chart" role="img" aria-label="Volume by day: ${desc}"><div class="grid"><i></i><i></i><i></i><i></i></div>${cols}
    ${any ? '' : '<p class="chart-empty">No sets logged yet this week</p>'}</div>`;
}

function weekCard(compact) {
  const ws = weekStart(TODAY), ti = wd(TODAY);
  const w = weekStats(ws), lw = weekStats(add(ws, -7), ti);
  const diff = lw.vol ? Math.round((w.vol - lw.vol) / lw.vol * 100) : 0;
  const dcls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const range = `${fmt(ws, { day: 'numeric' })}–${fmt(add(ws, 6), { day: 'numeric', month: 'short' })}`;
  return `<div class="card">
    <div class="vol-head"><div><p class="lbl">${compact ? 'Volume this week' : 'Total volume'}</p>
      <p class="big num">${volFmt(w.vol)} <small>${unitW()}</small></p></div>
      ${lw.vol ? `<span class="delta ${dcls} num">${diff > 0 ? '▲' : diff < 0 ? '▼' : ''} ${Math.abs(diff)}%</span>` : ''}</div>
    <p class="cmp num">${lw.vol ? `${volFmt(lw.vol)} ${unitW()} by ${fmt(TODAY, { weekday: 'long' })} last week` : 'Nothing logged last week'}</p>
    ${chartHTML(w)}
  </div>`;
}

function streakTile() {
  const st = streaks();
  return `<div class="tile" style="min-height:0">
    <div class="top"><span class="ic-chip" style="--c:var(--brand)">${ic('flame', 18)}</span><span class="lbl">Workout streak</span></div>
    <p class="v num">${st.cur} <small>${st.cur === 1 ? 'workout' : 'workouts'} in a row</small></p>
    <p class="foot num">Best: ${st.best} in a row</p></div>`;
}

function musclesHTML(compact) {
  const w = weekStats(weekStart(TODAY));
  const total = Object.values(w.groups).reduce((a, b) => a + b, 0);
  const order = Object.keys(G).filter((g) => w.groups[g]).sort((a, b) => w.groups[b] - w.groups[a]);
  const html = `<div class="${compact ? '' : 'section'}"><div class="section-head"><h2>${compact ? 'Muscle groups' : 'Sets by muscle group'}</h2><span class="aside num">${total} sets</span></div>
    <div class="card">${total ? `<div class="mg num" role="img" aria-label="${order.map((g) => `${g} ${w.groups[g]} sets`).join(', ')}">${order.map((g) => `<div><span>${g}</span><span class="tr"><i style="width:${w.groups[g] / w.groups[order[0]] * 100}%"></i></span><b>${w.groups[g]}</b></div>`).join('')}</div>`
      : '<p class="lbl">Tick off a few sets and your split shows up here.</p>'}</div></div>`;

  return html;
}

function renderProgress() {
  const ws = weekStart(TODAY), ti = wd(TODAY);
  const w = weekStats(ws), lw = weekStats(add(ws, -7), ti), lwFull = weekStats(add(ws, -7));
  const goal = S.settings.goal;
  const range = `${fmt(ws, { day: 'numeric', month: 'short' })} – ${fmt(add(ws, 6), { day: 'numeric', month: 'short' })}`;
  const setDiff = w.sets - lw.sets;
  const st = streaks();

  const tiles = `<div class="tiles">
    <div class="tile"><div class="top"><span class="ic-chip" style="--c:var(--brand)">${ic('target', 18)}</span><span class="lbl">Workouts</span></div>
      <p class="v num">${w.workouts}<small> of ${goal}</small></p>
      <div class="dots7" aria-hidden="true">${Array.from({ length: goal }, (_, i) => `<i class="${i < w.workouts ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="tile"><div class="top"><span class="ic-chip" style="--c:var(--c-back)">${ic('layers', 18)}</span><span class="lbl">Sets done</span></div>
      <p class="v num">${w.sets}</p>
      <p class="foot num"><span class="delta ${setDiff > 0 ? 'up' : setDiff < 0 ? 'down' : 'flat'}">${setDiff > 0 ? '▲' : setDiff < 0 ? '▼' : ''} ${Math.abs(setDiff)}</span> vs last week</p></div>
    <div class="tile"><div class="top"><span class="ic-chip" style="--c:var(--c-legs)">${ic('repeat', 18)}</span><span class="lbl">Reps</span></div>
      <p class="v num">${nf.format(w.reps)}</p>
      <p class="foot num">${nf.format(lwFull.reps)} all last week</p></div>
    <div class="tile"><div class="top"><span class="ic-chip" style="--c:var(--c-chest)">${ic('flame', 18)}</span><span class="lbl">Streak</span></div>
      <p class="v num">${st.cur}<small> workouts</small></p>
      <p class="foot num">Best: ${st.best} in a row</p></div>
  </div>`;

  const muscles = musclesHTML(false);

  const label = { done: 'Complete', partial: 'Partial', missed: 'Missed', rest: 'Rest', upcoming: 'Planned', today: 'Today', live: 'In progress' };
  const sessions = `<div class="section"><div class="section-head"><h2>Sessions</h2><span class="aside num">${w.workouts} of ${w.planned} so far</span></div>
    <div class="card rows">${w.days.map((x) => {
      const k = iso(x.d), name = x.rest ? 'Rest day' : x.plan.name;
      const stt = k === TODAY_ISO && x.status !== 'done' ? (x.done ? 'live' : 'today') : x.status;
      return `<button class="row plan-row" data-day="${k}" data-goto="today" aria-label="Open ${fmt(x.d, { weekday: 'long' })}">
        <span class="daynum num ${k === TODAY_ISO ? 'today' : ''}">${fmt(x.d, { weekday: 'short' }).slice(0, 3)}</span>
        <span class="grow"><span class="t" style="display:block">${name}</span><span class="s num" style="display:block">${x.rest ? fmt(x.d, { day: 'numeric', month: 'short' }) : `${x.done} of ${x.total} sets · ${volFmt(x.vol)} ${unitW()}`}</span></span>
        <span class="status st-${stt}">${label[stt]}</span></button>`;
    }).join('')}</div></div>`;

  document.getElementById('view-progress').innerHTML = `<div class="col-main" style="grid-column:1/-1">
    <header class="head"><div><p class="eyebrow num">${range}</p><h1 class="title" id="progTitle">This week</h1></div></header>
    <div class="progress-grid"><div>${weekCard(false)}${tiles}</div><div>${muscles}${sessions}</div></div></div>`;
}

function renderPlan() {
  const ti = wd(TODAY);
  const per = PLAN.filter(Boolean).length;
  const rows = PLAN.map((p, i) => {
    const d = add(weekStart(TODAY), i), name = p ? p.name : 'Rest day';
    const sets = p ? p.ex.reduce((a, e) => a + e.sets, 0) : 0;
    const head = `<span class="daynum num ${i === ti ? 'today' : ''}">${fmt(d, { weekday: 'short' }).slice(0, 3)}</span>
      <span class="grow"><span class="t" style="display:block">${name}</span><span class="s" style="display:block">${p ? `${p.ex.length} exercises · ${sets} sets` : 'Recovery'}</span></span>`;
    if (!p) return `<div class="row">${head}</div>`;
    const open = openPlan === i;
    return `<div><button class="row plan-row" data-plan="${i}" data-key="plan-${i}" aria-expanded="${open}">${head}<span class="chev">${ic('chev', 18)}</span></button>
      ${open ? `<div class="plan-ex">${p.ex.map((e) => `<div><span>${e.name}</span><span class="num">${exMeta(e)}</span></div>`).join('')}</div>` : ''}</div>`;
  }).join('');
  document.getElementById('view-plan').innerHTML = `<div class="narrow">
    <header class="head"><div><p class="eyebrow">${per} training days · 1 rest day</p><h1 class="title" id="planTitle">Weekly plan</h1></div></header>
    <div class="card rows plan-list">${rows}</div></div>`;
}

function renderProfile() {
  const s = S.settings;
  const totalWorkouts = Object.keys(S.logs).filter((k) => k <= TODAY_ISO && dayStats(parse(k)).status === 'done').length;
  document.getElementById('view-profile').innerHTML = `<div class="narrow">
    <header class="head"><div><p class="eyebrow">Account and preferences</p><h1 class="title" id="profTitle">Profile</h1></div></header>
    <div class="card profile">${avatarHTML()}<div><h2>${s.name}</h2><p class="num">${totalWorkouts} workouts logged</p></div></div>
    <div class="section"><div class="section-head"><h2>Training</h2></div>
      <div class="card" style="padding:4px 16px">
        <div class="set-row"><div><p class="t">Weekly goal</p><p class="s">Workouts per week</p></div>
          <div class="segc" role="group" aria-label="Weekly goal">${[3, 4, 5, 6].map((n) => `<button data-goal="${n}" data-key="goal-${n}" aria-pressed="${s.goal === n}">${n}</button>`).join('')}</div></div>
        <div class="set-row"><div><p class="t">Units</p><p class="s">Weights and volume</p></div>
          <div class="segc" role="group" aria-label="Units">${['kg', 'lb'].map((u) => `<button data-units="${u}" data-key="units-${u}" aria-pressed="${s.units === u}">${u}</button>`).join('')}</div></div>
        <div class="set-row"><div><p class="t">Workout reminder</p><p class="s">Daily at 7:00 am on training days</p></div>
          <div class="segc" role="group" aria-label="Workout reminder"><button data-rem="1" data-key="rem-1" aria-pressed="${s.reminders}">On</button><button data-rem="0" data-key="rem-0" aria-pressed="${!s.reminders}">Off</button></div></div>
      </div></div>
    <div class="section"><div class="section-head"><h2>Data</h2></div>
      <div class="card" style="padding:4px 16px">
        <button class="link-row" data-act="export" data-key="act-export"><span class="ic-chip" style="--c:var(--c-back)">${ic('download', 18)}</span><span class="grow">Export history<small>Download your log as a JSON file</small></span>${ic('chev', 18)}</button>
        <button class="link-row" data-act="reset-today" data-key="act-reset"><span class="ic-chip" style="--c:var(--c-arms)">${ic('reset', 18)}</span><span class="grow">Reset today’s workout<small>Untick every set for today</small></span>${ic('chev', 18)}</button>
        <button class="link-row danger" data-act="clear" data-key="act-clear"><span class="ic-chip" style="--c:var(--bad)">${ic('trash', 18)}</span><span class="grow">${confirmClear ? 'Tap again to delete everything' : 'Start fresh'}<small>${confirmClear ? 'This removes all logged workouts' : 'Delete all logged workouts'}</small></span>${ic('chev', 18)}</button>
      </div></div></div>`;
}

function renderChrome() {
  const tabs = [['today', 'Today', 'today'], ['progress', 'Progress', 'chart'], ['plan', 'Plan', 'plan'], ['profile', 'Profile', 'user']];
  const html = tabs.map(([id, l, i]) => `<button class="tab" data-tab="${id}" data-key="tab-${id}" ${view === id ? 'aria-current="page"' : ''}>${ic(i, 22)}<span>${l}</span></button>`).join('');
  document.getElementById('tabbar').innerHTML = html;
  document.getElementById('sideNav').innerHTML = html.replaceAll('data-key="tab-', 'data-key="side-');
  const w = weekStats(weekStart(TODAY));
  document.getElementById('sideGoal').innerHTML = `<p class="lbl">Weekly goal</p><b class="num">${w.workouts} of ${S.settings.goal} workouts</b>
    <div class="dots7" aria-hidden="true">${Array.from({ length: S.settings.goal }, (_, i) => `<i class="${i < w.workouts ? 'on' : ''}"></i>`).join('')}</div>`;
  document.getElementById('sideMe').innerHTML = `${avatarHTML()}<div><b>${S.settings.name}</b><span>${S.settings.units === 'kg' ? 'Metric' : 'Imperial'} · ${S.settings.goal} days a week</span></div>`;
}

function render() {
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  renderChrome();
  for (const v of ['today', 'progress', 'plan', 'profile']) document.getElementById('view-' + v).classList.toggle('on', v === view);
  if (view === 'today') renderToday();
  if (view === 'progress') renderProgress();
  if (view === 'plan') renderPlan();
  if (view === 'profile') renderProfile();
  if (key) { const el = document.querySelector(`[data-key="${key}"]`); if (el) el.focus({ preventScroll: true }); }
}

/* ---------- toast ---------- */
let tt;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="tick">${ic('check', 14, 3)}</span>${msg}`;
  t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const ds = b.dataset;
  if (ds.tab) { view = ds.tab; if (view === 'today') sel = TODAY_ISO; confirmClear = false; render(); window.scrollTo(0, 0); return; }
  if (ds.day) { sel = ds.day; if (ds.goto) { view = 'today'; window.scrollTo(0, 0); } render(); return; }
  if (ds.set || ds.all) {
    const p = PLAN[wd(parse(sel))]; if (!p) return;
    const before = dayStats(parse(sel)).status;
    const log = S.logs[sel] || (S.logs[sel] = {});
    if (ds.set) {
      const [id, i] = ds.set.split(':'); const e = p.ex.find((x) => x.id === id);
      const arr = log[id] || (log[id] = Array(e.sets).fill(false)); arr[+i] = !arr[+i];
    } else {
      const e = p.ex.find((x) => x.id === ds.all); const arr = log[e.id] || [];
      const all = arr.filter(Boolean).length === e.sets; log[e.id] = Array(e.sets).fill(!all);
    }
    save();
    const after = dayStats(parse(sel));
    if (after.status === 'done' && before !== 'done') toast(`${p.name} complete · ${after.total} sets, ${volFmt(after.vol)} ${unitW()}`);
    render(); return;
  }
  if (ds.plan) { openPlan = openPlan === +ds.plan ? -1 : +ds.plan; render(); return; }
  if (ds.goal) { S.settings.goal = +ds.goal; save(); render(); return; }
  if (ds.units) { S.settings.units = ds.units; save(); render(); return; }
  if (ds.rem) { S.settings.reminders = ds.rem === '1'; save(); render(); return; }
  if (ds.act === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `setlog-${TODAY_ISO}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('History exported'); return;
  }
  if (ds.act === 'reset-today') { delete S.logs[TODAY_ISO]; save(); toast('Today’s sets cleared'); render(); return; }
  if (ds.act === 'clear') {
    if (!confirmClear) { confirmClear = true; render(); return; }
    S.logs = {}; confirmClear = false; save(); toast('All history deleted'); render(); return;
  }
});

document.getElementById('brandMark').innerHTML = ic('barbell', 18, 2.2);
render();
</script>
</body>
</html>
