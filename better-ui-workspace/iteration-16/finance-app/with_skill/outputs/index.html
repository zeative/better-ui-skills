<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Tally · Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean. Cool light canvas, white cards, deep green brand on the balance card and active states. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F4F6; --surface: #FFFFFF; --surface-2: #F5F7F8; --line: #E6E9ED;
  --text: #101828; --text-2: #5D6778; --text-3: #687385;
  --brand: #0E6E55; --brand-2: #0A5844; --brand-tint: #E4F2ED; --on-brand: #FFFFFF;
  --ok: #157F3C; --ok-tint: #E6F6EC; --warn: #B45309; --warn-tint: #FEF3E2; --bad: #C92A2A; --bad-tint: #FDECEC;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16,24,40,.04), 0 1px 1px rgba(16,24,40,.03);
  --sh-2: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12);
  --sh-float: 0 12px 32px -8px rgba(16,24,40,.20);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.sidebar { display: none; }
main { padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; animation: fadeIn .22s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-2); min-height: 52px; justify-content: center; border-radius: var(--r-sm); transition: color .15s; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px -6px rgba(14,110,85,.6); transition: transform .15s ease-out; }
.tab-add:active { transform: scale(.94); }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 20px; }
.top .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); box-shadow: var(--sh-1); border: 1px solid var(--line); transition: background-color .15s, transform .15s; }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }
.icon-btn:active { transform: scale(.95); }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #CFEBDF; display: grid; place-items: center; font-weight: 600; color: var(--brand-2); flex: none; }
.avatar-btn img { width: 100%; height: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full); font-size: 14px; font-weight: 600;
  background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(16,24,40,.15), 0 6px 14px -6px rgba(14,110,85,.55);
  transition: transform .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { background: var(--brand-2); } }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; height: 52px; font-size: 16px; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); } }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.danger:hover { background: #FAD9D9; } }
.desk-only { display: none !important; }
.desk-side { display: none; }

/* ---------- Cards ---------- */
.stack { display: grid; gap: 16px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); border: 1px solid rgba(16,24,40,.04); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; min-height: 28px; }
.card-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.link { font-size: 14px; font-weight: 600; color: var(--brand); display: inline-flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 4px; margin: -6px 0; border-radius: var(--r-xs); }
.link .ic { width: 16px; height: 16px; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.pill.neutral::before, .pill.count::before { display: none; }

/* Balance card */
.balance { position: relative; overflow: hidden; color: #fff; border: 0;
  background: radial-gradient(120% 90% at 100% 0%, #158A6B 0%, transparent 60%), linear-gradient(160deg, #0F7559 0%, #0A5241 100%);
  box-shadow: 0 2px 4px rgba(10,82,65,.12), 0 18px 36px -16px rgba(10,82,65,.55); }
.bal-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.82); }
.acct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.82); }
.bal-figure { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 6px; }
.bal-figure .cents { color: rgba(255,255,255,.62); font-weight: 600; font-size: 24px; }
.delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; height: 26px; padding: 0 10px; border-radius: var(--r-full); background: rgba(255,255,255,.14); font-size: 12px; font-weight: 600; }
.delta .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.bal-chart { position: relative; height: 76px; margin: 12px -4px 0; }
.bal-chart svg { width: 100%; height: 100%; overflow: visible; }
.bal-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid #0F7559; box-shadow: 0 0 0 4px rgba(255,255,255,.22); transform: translate(-50%, -50%); }
.bal-axis { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.7); margin-top: 6px; }
.bal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.16); }
.bal-stat { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bal-stat .chip { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
.bal-stat .chip .ic { width: 18px; height: 18px; }
.bal-stat small { display: block; font-size: 12px; color: rgba(255,255,255,.75); }
.bal-stat b { display: block; font-size: 16px; font-weight: 600; }

/* Budget card */
.budget-fig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.budget-fig b { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.budget-fig span { font-size: 14px; color: var(--text-2); }
.meter { position: relative; height: 12px; border-radius: var(--r-full); background: var(--surface-2); margin: 16px 0 8px; box-shadow: inset 0 1px 2px rgba(16,24,40,.06); }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.meter > i.warn { background: #D97706; } .meter > i.bad { background: var(--bad); }
.meter-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--text-2); }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.budget-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.mini { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; }
.mini small { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; }
.mini b { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; }

/* Category breakdown */
.seg { display: flex; gap: 3px; height: 14px; margin-bottom: 8px; }
.seg i { border-radius: 4px; min-width: 6px; }
.seg i:first-child { border-radius: 7px 4px 4px 7px; } .seg i:last-child { border-radius: 4px 7px 7px 4px; }
.seg-total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 13px; color: var(--text-2); }
.seg-total b { font-size: 20px; color: var(--text); font-weight: 600; letter-spacing: -0.01em; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; }
.rows > li { position: relative; }
.rows > li + li::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; border-top: 1px solid var(--line); }
.row-btn { width: 100%; text-align: left; border-radius: var(--r-sm); transition: background-color .15s; }
@media (hover: hover) { .row-btn:hover { background: var(--surface-2); box-shadow: -8px 0 0 var(--surface-2), 8px 0 0 var(--surface-2); } }
.chip-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--text-2); line-height: 1.4; }
.row-end { text-align: right; flex: none; }
.row-amt { font-size: 16px; font-weight: 600; white-space: nowrap; }
.row-amt.in { color: var(--ok); }
.row-meta { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.row .chev { color: var(--text-3); width: 18px; height: 18px; }
.dot-key { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.cat-bar { display: block; height: 6px; border-radius: 6px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); }

.group-label { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 16px 0 4px; display: flex; justify-content: space-between; }
.group-label:first-child { padding-top: 0; }

/* Activity */
.spend-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.spend-head small { font-size: 13px; color: var(--text-2); font-weight: 500; }
.spend-head b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.bars-wrap { position: relative; margin-top: 16px; padding-left: 36px; }
.bars-grid { position: absolute; inset: 0 0 22px 36px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.bars-grid span { border-top: 1px dashed var(--line); position: relative; }
.bars-grid span em { position: absolute; left: -36px; top: -9px; font-size: 12px; font-style: normal; color: var(--text-3); width: 30px; text-align: right; }
.bars { position: relative; height: 128px; display: flex; align-items: flex-end; gap: 3px; }
.bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: color-mix(in srgb, var(--brand) 30%, var(--surface)); min-height: 3px; }
.bars i.today { background: var(--brand); }
.bars i.future { background: var(--surface-2); }
.bars i.peak { background: color-mix(in srgb, var(--brand) 55%, var(--surface)); }
.bars-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.chart-note { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.chart-note b { color: var(--text); font-weight: 600; }

.search { position: relative; margin: 20px 0 12px; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search .input { padding-left: 42px; }
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(14,110,85,.14); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px 8px; scrollbar-width: none; mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 40px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s, color .15s, border-color .15s; }
.fchip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (hover: hover) { .fchip:not([aria-pressed="true"]):hover { border-color: #CBD2DA; color: var(--text); } }
.fchip .count { font-size: 12px; opacity: .7; }
.fchip[aria-pressed="true"] .count { opacity: .9; }

/* Budget view */
.ring-wrap { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 128px; height: 128px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-center b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.ring-center small { font-size: 12px; color: var(--text-2); }
.ring-stats { display: grid; gap: 10px; flex: 1; min-width: 0; }
.ring-stats div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--text-2); }
.ring-stats div b { color: var(--text); font-weight: 600; }
.ring-stats hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Profile */
.profile { display: flex; align-items: center; gap: 16px; }
.profile .avatar-btn { width: 64px; height: 64px; font-size: 20px; }
.profile h2 { font-size: 20px; letter-spacing: -0.01em; }
.profile p { font-size: 14px; color: var(--text-2); }
.set-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 8px 0 -8px; }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 56px; width: 100%; text-align: left; padding: 6px 0; }
.set-rows > li + li::before { left: 48px; }
.set-row .chip-ic { width: 36px; height: 36px; border-radius: 10px; }
.set-row .chip-ic .ic { width: 18px; height: 18px; }
.set-row .label { flex: 1; font-size: 16px; font-weight: 500; }
.set-row .val { font-size: 14px; color: var(--text-2); }
.set-row .chev { color: var(--text-3); width: 18px; height: 18px; }
.set-row[disabled] { color: inherit; }
.set-row.danger .label { color: var(--bad); }
.switch { width: 46px; height: 28px; border-radius: var(--r-full); background: #D5DAE1; position: relative; flex: none; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(16,24,40,.25); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
[aria-checked="true"] .switch { background: var(--brand); }
[aria-checked="true"] .switch::after { transform: translateX(18px); }

/* Empty state */
.empty { text-align: center; padding: 24px 12px 8px; display: grid; justify-items: center; gap: 6px; }
.empty svg { width: 120px; height: 96px; margin-bottom: 8px; }
.empty h3 { font-size: 16px; }
.empty p { font-size: 14px; color: var(--text-2); max-width: 28ch; }
.empty .btn { margin-top: 10px; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(16,24,40,.42); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; max-height: 92dvh; overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--sh-float);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.grabber { width: 40px; height: 4px; border-radius: 4px; background: #D5DAE1; margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -0.01em; }
.sheet-head .icon-btn { box-shadow: none; background: var(--surface-2); border: 0; }
.field { display: grid; gap: 8px; margin-bottom: 18px; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 600; }
.err { font-size: 13px; color: var(--bad); font-weight: 500; }
.err:empty { display: none; }
.segctl { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: var(--surface-2); border-radius: var(--r-full); margin-bottom: 18px; }
.segctl button { height: 40px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .15s, color .15s; }
.segctl button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-2); }
.amount { display: flex; align-items: center; gap: 4px; height: 64px; border-radius: var(--r-md); border: 1px solid var(--line); padding: 0 16px; transition: border-color .15s, box-shadow .15s; }
.amount:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(14,110,85,.14); }
.amount span { font-size: 24px; font-weight: 600; color: var(--text-2); }
.amount input { border: 0; outline: none; width: 100%; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; background: transparent; font-variant-numeric: tabular-nums; }
.amount input::placeholder { color: #C5CBD3; }
.cat-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-opt { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--r-md); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--text-2); transition: border-color .15s, background-color .15s; }
.cat-opt .chip-ic { width: 36px; height: 36px; border-radius: 12px; }
.cat-opt .chip-ic .ic { width: 18px; height: 18px; }
.cat-opt[aria-checked="true"] { border-color: var(--brand); background: var(--brand-tint); color: var(--text); box-shadow: inset 0 0 0 1px var(--brand); }
.date-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-hero { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 4px 0 20px; }
.detail-hero .chip-ic { width: 56px; height: 56px; border-radius: 18px; margin-bottom: 6px; }
.detail-hero .chip-ic .ic { width: 26px; height: 26px; }
.detail-hero b { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.detail-hero span { font-size: 16px; color: var(--text-2); }
.kv { background: var(--surface-2); border-radius: var(--r-md); padding: 4px 16px; margin-bottom: 20px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 14px; }

/* ---------- Data ---------- */
const CATS = {

const SPEND_CATS = Object.keys(CATS).filter(k => k !== 'income');
const DEFAULT_BUDGETS = { groceries: 600, dining: 250, transport: 250, shopping: 300, bills: 350, entertainment: 60, health: 150, other: 100 };
// [days ago, time, description, category, amount]
const SAMPLE = [

  [19,'11:15','Home Depot','shopping',-36.48],[20,'00:40','Uber','transport',-14.90],

];
const KEY = 'tally.v1';
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function seedState() {
  const t = today();
  const tx = SAMPLE.map((s, i) => ({ id: 's' + i, date: iso(addDays(t, -s[0])), time: s[1], name: s[2], cat: s[3], amt: s[4] }));
  const sum = tx.reduce((a, x) => a + x.amt, 0);

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }

SPEND_CATS.forEach(k => { if (state.budgets[k] == null) state.budgets[k] = DEFAULT_BUDGETS[k]; });

/* ---------- Formatting ---------- */
const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const fmt0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money = v => fmt.format(v);
const money0 = v => fmt0.format(v);

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function dayLabel(s) {
  const d = parse(s), diff = Math.round((today() - d) / 864e5);

  if (diff === 1) return 'Yesterday';
  return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;
}
function timeLabel(t) { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; }

/* ---------- Derived ---------- */
const sorted = () => [...state.tx].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
const balance = () => state.opening + state.tx.reduce((a, x) => a + x.amt, 0);
function month() {
  const t = today(), y = t.getFullYear(), m = t.getMonth();
  const prefix = `${y}-${pad(m + 1)}`;
  const tx = state.tx.filter(x => x.date.startsWith(prefix));
  const byCat = Object.fromEntries(SPEND_CATS.map(k => [k, 0]));
  let spent = 0, income = 0;
  tx.forEach(x => { if (x.amt < 0) { spent -= x.amt; byCat[x.cat] = (byCat[x.cat] || 0) - x.amt; } else income += x.amt; });

  if (used > elapsed + 0.1) return { cls: 'warn', label: 'Spending fast' };
  return { cls: 'ok', label: 'On track' };

/* ---------- Charts ---------- */
function smooth(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function balanceChart() {
  const t = today(), cur = balance(), N = 30, vals = [];
  for (let i = N - 1; i >= 0; i--) {
    const day = iso(addDays(t, -i));
    vals.push(cur - state.tx.filter(x => x.date > day).reduce((a, x) => a + x.amt, 0));
  }
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 76;
  const pts = vals.map((v, i) => [i / (N - 1) * W, 8 + (1 - (v - min) / span) * (H - 16)]);
  const line = smooth(pts), last = pts[pts.length - 1];
  const start = addDays(t, -(N - 1));
  return {
    change: cur - vals[0],
    html: `<div class="bal-chart" role="img" aria-label="Balance over the last 30 days, from ${money0(vals[0])} to ${money0(cur)}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="balFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <path d="${line} L${W},${H} L0,${H}Z" fill="url(#balFill)"/>
        <path d="${line}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="bal-dot" style="left:${last[0] / W * 100}%;top:${last[1] / H * 100}%"></span>
    </div>

function renderActivity() {

  const top = Math.ceil(max / 50) * 50;
  const peakIdx = daily.indexOf(Math.max(...daily));
  const avg = mo.spent / mo.day;
  const list = sorted().filter(x => (filter === 'all' || x.cat === filter) && (!query || x.name.toLowerCase().includes(query.toLowerCase()) || CATS[x.cat].name.toLowerCase().includes(query.toLowerCase())));
  const groups = [];
  list.forEach(x => { const g = groups[groups.length - 1]; if (g && g.date === x.date) g.items.push(x); else groups.push({ date: x.date, items: [x] }); });
  const counts = {}; state.tx.forEach(x => counts[x.cat] = (counts[x.cat] || 0) + 1);

/* ---------- Sheet ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let lastFocus = null;
function openSheet(html, focusSel) {
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grabber" aria-hidden="true"></div>${html}`;
  scrim.classList.add('open'); sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => (sheet.querySelector(focusSel || 'input, button:not([data-close])') || sheet.querySelector('button'))?.focus(), 60);
}
function closeSheet() {
  scrim.classList.remove('open'); sheet.classList.remove('open');
  document.body.style.overflow = '';
  lastFocus?.focus?.();
}
const sheetHead = title => `<div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>`;
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (!sheet.classList.contains('open')) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('button:not([disabled]), input')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

      <div class="cat-pick" role="radiogroup" aria-labelledby="lCat">${SPEND_CATS.map(k => `<button type="button" class="cat-opt" role="radio" aria-checked="${k === cat}" data-cat="${k}">${chip(k)}${CATS[k].name}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel" id="lDate">Date</span>
      <div class="date-pick" role="radiogroup" aria-labelledby="lDate">${[0, 1, 2].map(o => `<button type="button" class="fchip" role="radio" aria-pressed="${o === 0}" aria-checked="${o === 0}" data-day="${o}">${o === 0 ? 'Today' : o === 1 ? 'Yesterday' : dayLabel(iso(addDays(today(), -2)))}</button>`).join('')}</div></div>
    <button class="btn block" type="submit" id="fSubmit">Add expense</button>
  </form>`, '#fAmt');

  const f = sheet.querySelector('#addForm');
  f.addEventListener('click', e => {
    const tb = e.target.closest('[data-type]'), cb = e.target.closest('[data-cat]'), db = e.target.closest('[data-day]');
    if (tb) { type = tb.dataset.type; f.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-checked', b === tb));
      f.querySelector('#catField').style.display = type === 'income' ? 'none' : '';
      f.querySelector('#lName').textContent = type === 'income' ? 'Source' : 'Merchant';
      f.querySelector('#fName').placeholder = type === 'income' ? 'e.g. Payroll deposit' : "e.g. Trader Joe's";
      f.querySelector('#fSubmit').textContent = type === 'income' ? 'Add income' : 'Add expense'; }
    if (cb) { cat = cb.dataset.cat; f.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-checked', b === cb)); }
    if (db) { dayOff = +db.dataset.day; f.querySelectorAll('[data-day]').forEach(b => { b.setAttribute('aria-checked', b === db); b.setAttribute('aria-pressed', b === db); }); }
  });
  const amtIn = f.querySelector('#fAmt');
  amtIn.addEventListener('input', () => { amtIn.value = amtIn.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1').replace(/(\.\d{2}).+/, '$1'); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const amt = parseFloat(amtIn.value), name = f.querySelector('#fName').value.trim();
    const eA = f.querySelector('#eAmt'), eN = f.querySelector('#eName');
    eA.textContent = !(amt > 0) ? 'Enter an amount greater than $0.' : amt > 1e6 ? 'Amount must be under $1,000,000.' : '';
    eN.textContent = name ? '' : (type === 'income' ? 'Add where this money came from.' : 'Add the merchant or a short description.');
    amtIn.closest('.amount').style.borderColor = eA.textContent ? 'var(--bad)' : '';
    f.querySelector('#fName').setAttribute('aria-invalid', !!eN.textContent);
    if (eA.textContent) { amtIn.focus(); return; }
    if (eN.textContent) { f.querySelector('#fName').focus(); return; }
    const now = new Date();
    state.tx.push({ id: 't' + Date.now(), date: iso(addDays(today(), -dayOff)), time: `${pad(now.getHours())}:${pad(now.getMinutes())}`, name,
      cat: type === 'income' ? 'income' : cat, amt: Math.round((type === 'income' ? amt : -amt) * 100) / 100 });
    save(); closeSheet(); render();
    toast(`${type === 'income' ? 'Income' : 'Expense'} of ${money(amt)} added`);
  });
}

function openTx(id) {
  const x = state.tx.find(t => t.id === id); if (!x) return;
  const d = parse(x.date);
  openSheet(`${sheetHead('Transaction')}
    <div class="detail-hero">${chip(x.cat)}<b class="num" style="color:${x.amt > 0 ? 'var(--ok)' : 'var(--text)'}">${signed(x.amt)}</b><span>${esc(x.name)}</span></div>
    <dl class="kv" style="margin-top:0">
      <div><dt>Category</dt><dd>${CATS[x.cat].name}</dd></div>
      <div><dt>Date</dt><dd>${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}</dd></div>
      <div><dt>Time</dt><dd>${timeLabel(x.time)}</dd></div>
      <div><dt>Account</dt><dd>Checking ••4821</dd></div>
    </dl>
    <div class="btn-row"><button class="btn danger" data-del="${x.id}">${ic('trash')} Delete</button><button class="btn ghost" data-close>Done</button></div>`, '[data-close]:last-child');
}

function openBudgetEdit(k) {
  const mo = month(), prev = lastMonthByCat()[k] || 0;
  openSheet(`${sheetHead(`${CATS[k].name} limit`)}
    <form id="budForm" novalidate>
      <div class="field"><label for="bAmt">Monthly limit</label>
        <div class="amount"><span>$</span><input id="bAmt" inputmode="numeric" value="${state.budgets[k]}" autocomplete="off" aria-describedby="bHint eBud"></div>
        <p class="hint num" id="bHint">Spent ${money(mo.byCat[k] || 0)} in ${mo.name}${prev ? ` · ${money(prev)} last month` : ''}</p>
        <p class="err" id="eBud"></p></div>
      <div class="date-pick" style="margin-bottom:20px">${[-50, -10, 10, 50].map(v => `<button type="button" class="fchip num" data-step="${v}">${v > 0 ? '+' : '−'}$${Math.abs(v)}</button>`).join('')}</div>
      <button class="btn block" type="submit">Save limit</button>
    </form>`, '#bAmt');
  const f = sheet.querySelector('#budForm'), inp = f.querySelector('#bAmt');
  inp.addEventListener('input', () => inp.value = inp.value.replace(/\D/g, '').slice(0, 6));
  f.addEventListener('click', e => { const s = e.target.closest('[data-step]'); if (s) inp.value = Math.max(0, (parseInt(inp.value) || 0) + +s.dataset.step); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = parseInt(inp.value);
    if (!(v >= 0) || inp.value === '') { f.querySelector('#eBud').textContent = 'Enter a whole dollar amount.'; inp.focus(); return; }
    state.budgets[k] = v; save(); closeSheet(); render(); toast(`${CATS[k].name} limit set to ${money0(v)}`);
  });
}

function confirmSheet(title, body, actionLabel, fn) {
  openSheet(`${sheetHead(title)}<p style="color:var(--text-2);font-size:16px;margin-bottom:24px">${body}</p>
    <div class="btn-row"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="confirmBtn">${actionLabel}</button></div>`, '[data-close]:not(.icon-btn)');
  sheet.querySelector('#confirmBtn').addEventListener('click', () => { fn(); closeSheet(); render(); });
}

/* ---------- Toast ---------- */
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg, action, fn) {
  toastEl.querySelector('span').textContent = msg;
  const b = toastEl.querySelector('button'); b.textContent = action || ''; b.onclick = () => { fn && fn(); toastEl.classList.remove('show'); };
  toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 4000);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.go) { if (sheet.classList.contains('open')) closeSheet(); return go(t.dataset.go, { focusSearch: t.hasAttribute('data-focus-search') }); }
  if (t.hasAttribute('data-add')) return openAdd();
  if (t.dataset.tx) return openTx(t.dataset.tx);
  if (t.dataset.filter) { filter = (view === 'activity' && filter === t.dataset.filter && filter !== 'all') ? 'all' : t.dataset.filter; return view === 'activity' ? renderActivity() : go('activity'); }
  if (t.hasAttribute('data-clear-filters')) { filter = 'all'; query = ''; return renderActivity(); }
  if (t.dataset.editBudget) return openBudgetEdit(t.dataset.editBudget);
  if (t.dataset.pref) { state.prefs[t.dataset.pref] = !state.prefs[t.dataset.pref]; save(); t.setAttribute('aria-checked', state.prefs[t.dataset.pref]); return; }
  if (t.dataset.del) {
    const i = state.tx.findIndex(x => x.id === t.dataset.del), [removed] = state.tx.splice(i, 1);
    save(); closeSheet(); render();
    return toast('Transaction deleted', 'Undo', () => { state.tx.push(removed); save(); render(); });
  }
  if (t.hasAttribute('data-export')) {
    const rows = [['Date', 'Time', 'Description', 'Category', 'Amount'], ...sorted().map(x => [x.date, x.time, x.name, CATS[x.cat].name, x.amt.toFixed(2)])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `tally-transactions-${iso(today())}.csv`; a.click();
    return toast(`Exported ${state.tx.length} transactions`);
  }
  if (t.hasAttribute('data-reset')) return confirmSheet('Restore sample data?', 'Your transactions and budget limits will be replaced with the example month.', 'Restore', () => { state = seedState(); save(); toast('Sample data restored'); });
  if (t.hasAttribute('data-clear')) return confirmSheet('Delete all transactions?', 'This removes every transaction from this device. Budget limits are kept. You can’t undo this.', 'Delete all', () => { state.opening = balance(); state.tx = []; save(); toast('All transactions deleted'); });
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    query = e.target.value; const pos = e.target.selectionStart;
    renderActivity(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});

render();
</script>
</body>
</html>
