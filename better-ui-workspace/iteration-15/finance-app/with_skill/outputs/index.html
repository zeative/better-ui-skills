<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<title>Sprout — Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean — cool off-white canvas, white cards, deep green brand on the summary card and active states, soft category tints. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F4F3; --surface: #FFFFFF; --surface-2: #F5F7F6; --line: #E6EAE8; --line-2: #EEF1EF;
  --text: #0F1A16; --text-2: #5D6B66; --text-3: #66736E;
  --brand: #0E7A57; --brand-deep: #0A5E43; --brand-tint: #E5F3EC; --on-brand: #FFFFFF;
  --ok: #11803F; --ok-tint: #E6F5EC; --warn: #B45F06; --warn-tint: #FDF1E1; --bad: #C8312B; --bad-tint: #FCEBEA;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(15,35,28,.05), 0 1px 1px rgba(15,35,28,.03);
  --sh-2: 0 1px 2px rgba(15,35,28,.04), 0 8px 24px -12px rgba(15,35,28,.12);
  --sh-float: 0 12px 32px -8px rgba(15,35,28,.20);
  --tabbar-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 680px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); }
.view[hidden] { display: none; }

.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; min-height: 44px; }
.topbar .titles { flex: 1; min-width: 0; }
.topbar .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.topbar h1 { font-size: 22px; letter-spacing: -0.015em; line-height: 1.25; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--surface); color: var(--text); box-shadow: var(--sh-1); border: 1px solid var(--line-2); position: relative; transition: transform .15s ease-out, background-color .15s ease-out; }
.icon-btn:active { transform: scale(.94); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }
.icon-btn .dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #E8711A; border: 2px solid var(--surface); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE3C7; overflow: hidden; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #7A4A12; }
.avatar img { width: 100%; height: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full); font-weight: 600; font-size: 15px; background: var(--brand); color: var(--on-brand);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(15,35,28,.18), 0 6px 16px -6px rgba(14,122,87,.55); transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { background: var(--brand-deep); transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; height: 52px; font-size: 16px; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); } }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.danger:hover { background: #F8DCDA; } }
.desk-only { display: none; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 500; color: var(--text-3); border-radius: var(--r-sm); transition: color .15s ease-out; }
.tab[aria-current="page"] { color: var(--brand); }
.tab[aria-current="page"] svg.i { stroke-width: 2.1; }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 1px 2px rgba(15,35,28,.2), 0 8px 18px -6px rgba(14,122,87,.6); transition: transform .15s ease-out; }
.tab-add:active { transform: scale(.94); }
.tab-add svg.i { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); border: 1px solid var(--line-2); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-size: 17px; letter-spacing: -0.01em; }
.card-head .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.link { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; color: var(--brand); min-height: 44px; padding: 0 4px 0 12px; margin-right: -4px; border-radius: var(--r-full); white-space: nowrap; transition: background-color .15s ease-out; }
@media (hover: hover) { .link:hover { background: var(--brand-tint); } }
.link svg.i { width: 16px; height: 16px; }

.home-grid { display: grid; gap: 16px; grid-template-areas: "summary" "budget" "recent" "cats"; }
.a-summary { grid-area: summary; } .a-budget { grid-area: budget; } .a-recent { grid-area: recent; } .a-cats { grid-area: cats; }

/* Summary card */
.summary { display: flex; flex-direction: column; position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; color: #fff;
  background: radial-gradient(120% 90% at 100% 0%, #1A9A6F 0%, transparent 55%), linear-gradient(160deg, #0E7A57, #0A5A41);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 4px rgba(10,70,50,.14), 0 18px 36px -16px rgba(10,80,56,.55); }
.summary::after { content: ""; position: absolute; width: 260px; height: 260px; right: -110px; top: -130px; border-radius: 50%; border: 1px solid rgba(255,255,255,.10); box-shadow: 0 0 0 40px rgba(255,255,255,.03); pointer-events: none; }
.summary .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 1; }
.summary .label { font-size: 14px; color: rgba(255,255,255,.82); font-weight: 500; }
.summary .figure { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-top: 4px; }
.summary .figure .cents { color: rgba(255,255,255,.66); font-weight: 600; font-size: 24px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; white-space: nowrap; }
.summary .pill { background: rgba(255,255,255,.16); color: #fff; margin-top: 8px; }
.summary .pill svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
.acct-chip { font-size: 12px; font-weight: 600; color: #fff; background: rgba(0,0,0,.16); border-radius: var(--r-full); padding: 6px 10px; white-space: nowrap; }
.spark { position: relative; margin: 16px 0 0; height: 96px; flex: 1 0 96px; }
.spark svg { width: 100%; height: 100%; overflow: visible; }
.spark-axis { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.75); margin-top: 6px; }
.summary .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.16); position: relative; z-index: 1; }
.mini { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mini .ic { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
.mini .ic svg.i { width: 18px; height: 18px; }
.mini .k { font-size: 13px; color: rgba(255,255,255,.8); }
.mini .v { font-size: 16px; font-weight: 600; }

/* Budget card */
.budget-figure { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget-figure strong { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.budget-figure span { font-size: 14px; color: var(--text-2); }
.bar { position: relative; height: 10px; border-radius: var(--r-full); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-2); margin-top: 14px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar .today { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--text); }
.bar-legend { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text-2); margin-top: 10px; }
.bar-legend b { color: var(--text); font-weight: 600; }
.watch { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--line-2); }
.watch-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 12px 0 4px; }

/* Icon chips & rows */
.chip-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 13%, #fff); color: var(--c); }
.chip-ic.sm { width: 36px; height: 36px; border-radius: 12px; }
.chip-ic.sm svg.i { width: 18px; height: 18px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: var(--r-sm); text-align: left; transition: background-color .15s ease-out; }
@media (hover: hover) { button.row:hover { background: var(--surface-2); } }
button.row:active { background: var(--line-2); }
.row .body { flex: 1; min-width: 0; }
.row .t { font-size: 15px; font-weight: 600; line-height: 1.3; }
.row .s { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.row .amt { font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
.row .amt.pos { color: var(--ok); }
.list > li + li { border-top: 1px solid var(--line-2); }
.watch-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.watch-row .body { flex: 1; min-width: 0; }
.watch-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.watch-row .top b { font-weight: 600; }
.watch-row .top span { color: var(--text-2); white-space: nowrap; }
.thin { height: 6px; border-radius: var(--r-full); background: var(--surface-2); margin-top: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2); }
.thin > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--brand)); }
.status { font-size: 12px; height: 24px; padding: 0 8px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.ok { background: var(--ok-tint); color: var(--ok); }
.status.warn { background: var(--warn-tint); color: var(--warn); }
.status.bad { background: var(--bad-tint); color: var(--bad); }

/* Donut */
.cats-wrap { display: grid; gap: 20px; }
.donut { position: relative; width: 188px; height: 188px; margin: 0 auto; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { transition: opacity .15s ease-out, stroke-width .15s ease-out; }
.donut .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .center .k { font-size: 13px; color: var(--text-2); }
.donut .center .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.donut .center .s { font-size: 12px; color: var(--text-3); }
.legend .row { min-height: 52px; padding: 6px 8px; }
.legend .pct { font-size: 13px; color: var(--text-2); font-weight: 500; width: 36px; text-align: right; }
.legend .t { font-size: 14px; white-space: nowrap; }
.legend .body { min-width: 0; }
.cats-wrap.dim circle[data-k]:not(.on) { opacity: .25; }

/* Segmented & chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; gap: 4px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-full); }
.seg button { height: 40px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .15s ease-out, color .15s ease-out; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--text); transition: background-color .15s ease-out, border-color .15s ease-out; }
.chip svg.i { width: 16px; height: 16px; color: var(--c, var(--text-2)); }
@media (hover: hover) { .chip:hover { background: var(--surface-2); } }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.chip[aria-pressed="true"] svg.i { color: #fff; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 500; text-align: center; line-height: 1.25; min-height: 84px; transition: border-color .15s ease-out, background-color .15s ease-out; }
.cat-opt .chip-ic { width: 36px; height: 36px; border-radius: 12px; }
.cat-opt .chip-ic svg.i { width: 18px; height: 18px; }
.cat-opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-tint); box-shadow: inset 0 0 0 1px var(--brand); }

/* Inputs */
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--text-2); }
.input { height: 48px; width: 100%; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 16px; transition: border-color .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
.input:focus { outline: none; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px var(--brand-tint); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.err { font-size: 13px; color: var(--bad); min-height: 0; }
.search { position: relative; }
.search svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search .input { padding-left: 44px; background: var(--surface); box-shadow: var(--sh-1); }
.amount-field { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 8px 0 4px; }
.amount-field span { font-size: 28px; font-weight: 600; color: var(--text-3); }
.amount-field input { width: 6.5ch; border: 0; background: transparent; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; text-align: left; padding: 0; height: 56px; font-variant-numeric: tabular-nums; }
.amount-field input:focus { outline: none; }
.amount-field input::placeholder { color: var(--text-3); }
.amount-line { height: 2px; width: 160px; margin: 0 auto; border-radius: 2px; background: var(--line); transition: background-color .15s ease-out; }
.amount-wrap:focus-within .amount-line { background: var(--brand); }

/* Activity */
.stack { display: grid; gap: 16px; }
.group-title { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 4px 4px 8px; }
.group-title span:last-child { font-weight: 500; }
.month-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); box-shadow: var(--sh-1); padding: 14px 16px; display: flex; gap: 12px; align-items: center; min-width: 0; }
.stat .k { font-size: 13px; color: var(--text-2); }
.stat .v { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.card.list-card { padding: 8px 20px; }
.activity-layout, .budget-layout, .profile-layout { display: grid; gap: 16px; }
@media (max-width: 959px) { #activitySide { order: -1; } }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 120px; position: relative; }
.bars .b { position: relative; height: 100%; display: flex; align-items: flex-end; }
.bars .b i { display: block; width: 100%; min-height: 3px; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--brand) 22%, #fff); transition: background-color .15s ease-out; }
.bars .b.now i { background: var(--brand); }
.bars .b:hover i { background: color-mix(in srgb, var(--brand) 55%, #fff); }
.bars .b.now:hover i { background: var(--brand-deep); }
.bars .avg { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--text-3); pointer-events: none; }
.bars-x { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-2); text-align: center; }
.chart-key { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key i { width: 14px; border-top: 1.5px dashed var(--text-3); }
.chart-key b { color: var(--text); font-weight: 600; }
@media (max-width: 639px) { .month-stats .mob-hide { display: none; } }

/* Budget view */
.budget-hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.ring .center span { font-size: 12px; color: var(--text-2); }
.kv { display: grid; gap: 10px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--text-2); }
.kv b { color: var(--text); font-weight: 600; }
.brow .body .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brow .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text-2); margin-top: 8px; }
.brow .chev { color: var(--text-3); }

/* Profile */
.profile-card { display: flex; align-items: center; gap: 16px; }
.profile-card .avatar { width: 64px; height: 64px; }
.profile-card h2 { font-size: 18px; }
.profile-card p { font-size: 14px; color: var(--text-2); }
.section-label { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 8px 4px -4px; }
.toggle { position: relative; width: 48px; height: 28px; border-radius: var(--r-full); background: #D5DBD8; flex: none; transition: background-color .2s ease-out; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.row[aria-checked="true"] .toggle { background: var(--brand); }
.row[aria-checked="true"] .toggle::after { transform: translateX(20px); }
.row .val { font-size: 14px; color: var(--text-2); white-space: nowrap; }
.row.danger .t { color: var(--bad); }

/* Empty */
.empty { text-align: center; padding: 20px 12px 12px; display: grid; justify-items: center; gap: 6px; }
.empty svg { width: 132px; height: 96px; margin-bottom: 8px; }
.empty h3 { font-size: 16px; }
.empty p { font-size: 14px; color: var(--text-2); max-width: 30ch; }
.empty .btn { margin-top: 10px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10,22,18,.42); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s ease-out; }
.backdrop.open { opacity: 1; }
.sheet { width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--sh-float); transform: translateY(24px); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.backdrop.open .sheet { transform: none; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 18px; }
.sheet-head .icon-btn { box-shadow: none; background: var(--surface-2); width: 40px; height: 40px; }
.sheet form, .sheet .stack { display: grid; gap: 18px; }
.detail-top { text-align: center; display: grid; justify-items: center; gap: 8px; padding: 4px 0 8px; }
.detail-top .chip-ic { width: 56px; height: 56px; border-radius: 18px; }
.detail-top .chip-ic svg.i { width: 26px; height: 26px; }
.detail-top .big { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.detail-top .t { font-size: 16px; font-weight: 600; }
.dl { margin: 0; background: var(--surface-2); border-radius: var(--r-md); padding: 4px 16px; }
.dl div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 14px; }
.dl div + div { border-top: 1px solid var(--line); }
.dl dt { color: var(--text-2); } .dl dd { margin: 0; font-weight: 600; text-align: right; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); z-index: 60; background: var(--text); color: #fff; font-size: 14px; font-weight: 500; padding: 12px 16px; border-radius: var(--r-full); box-shadow: var(--sh-float); opacity: 0; pointer-events: none; transition: opacity .2s ease-out, transform .2s ease-out; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: #8FE3BF; font-weight: 600; min-height: 32px; }

/* ---------- Wider screens ---------- */
@media (min-width: 640px) {
  .main { padding-left: 24px; padding-right: 24px; }
  .cats-wrap { grid-template-columns: 188px 1fr; align-items: center; gap: 28px; }
  .backdrop { align-items: center; padding: 24px; }
  .sheet { border-radius: 24px; padding-bottom: 24px; transform: translateY(12px) scale(.98); }
  .grabber { display: none; }
  .sheet-head { margin-top: 8px; }
}
@media (min-width: 960px) {

  .side-card { margin-top: auto; background: var(--surface-2); border-radius: var(--r-md); padding: 14px; display: grid; gap: 4px; }
  .side-card .k { font-size: 13px; color: var(--text-2); }
  .side-card .v { font-size: 18px; font-weight: 600; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 14px 8px 0; margin-top: 12px; border-top: 1px solid var(--line); }

  .side-user span { font-size: 13px; color: var(--text-2); }
  .main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 36px 48px; }

  .profile-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
}
@media (min-width: 1100px) {

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthName = today.toLocaleDateString('en-US', { month: 'long' });

function seedState() {
  const tx = SEED.map(([d, m, c, a], i) => ({ id: 's' + i, date: iso(new Date(Y, M, d <= 0 ? d : Math.max(1, Math.round(d * D / 15)))), merchant: m, cat: c, amount: a }));
  const sum = tx.reduce((s, t) => s + t.amount, 0);
  return { tx, budgets: { ...DEFAULT_BUDGETS }, base: +(CHECKING_TARGET - sum).toFixed(2), prefs: { alerts: true, weekly: true, round: false } };
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
if (!state || !Array.isArray(state.tx)) state = seedState();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

/* ---------- Derived data ---------- */
function derive() {
  const tx = [...state.tx].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const inMonth = tx.filter(t => { const d = parse(t.date); return d.getFullYear() === Y && d.getMonth() === M; });
  const byCat = Object.fromEntries(SPEND.map(k => [k, 0]));
  let income = 0, spent = 0;
  inMonth.forEach(t => { if (t.amount > 0) income += t.amount; else { spent += -t.amount; byCat[t.cat] = (byCat[t.cat] || 0) - t.amount; } });
  const checking = state.base + state.tx.reduce((s, t) => s + t.amount, 0);
  const budgetTotal = SPEND.reduce((s, k) => s + (+state.budgets[k] || 0), 0);
  // daily balance across the month so far
  const start = new Date(Y, M, D - 29);
  const before = state.base + state.tx.filter(t => t.date < iso(start)).reduce((s, t) => s + t.amount, 0);
  const series = []; let run = before + SAVINGS;
  for (let i = 0; i < 30; i++) { const k = iso(new Date(Y, M, D - 29 + i)); state.tx.forEach(t => { if (t.date === k) run += t.amount; }); series.push(run); }
  return { tx, inMonth, byCat, income, spent, checking, total: checking + SAVINGS, budgetTotal, series };
}

function splitMoney(v) {
  const s = money(v); const i = s.lastIndexOf('.');
  return `<span>${s.slice(0, i)}</span><span class="cents">${s.slice(i)}</span>`;
}
function relDay(s) {
  const d = parse(s); const diff = Math.round((today - d) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', diff < 7 ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
}
function txRow(t, showDate = true) {
  const pos = t.amount > 0;
  return `<li><button class="row" data-tx="${t.id}">${chip(t.cat)}<span class="body"><span class="t" style="display:block">${esc(t.merchant)}</span><span class="s" style="display:block">${CATS[t.cat].name}${showDate ? ' · ' + relDay(t.date) : ''}</span></span><span class="amt num ${pos ? 'pos' : ''}">${pos ? '+' : '−'}${money(Math.abs(t.amount))}</span></button></li>`;
}
function statusFor(spent, budget) {
  if (!budget) return '';
  const p = spent / budget;
  if (p > 1) return `<span class="pill status bad">Over by ${money(spent - budget)}</span>`;
  if (p >= .85) return `<span class="pill status warn">${Math.round(p * 100)}% used</span>`;
  return '';
}

function donutSVG(d, size = 100, sw = 14) {
  const r = 50 - sw / 2;
  let start = 0; const parts = [];
  const cats = SPEND.filter(k => d.byCat[k] > 0).sort((a, b) => d.byCat[b] - d.byCat[a]);
  const gap = cats.length > 1 ? .6 : 0;
  cats.forEach(k => {
    const p = d.byCat[k] / d.spent * 100;
    parts.push(`<circle data-k="${k}" cx="50" cy="50" r="${r}" fill="none" stroke="${CATS[k].color}" stroke-width="${sw}" pathLength="100" stroke-dasharray="${Math.max(.1, p - gap)} ${100 - p + gap}" stroke-dashoffset="${-start}"/>`);
    start += p;
  });
  return { svg: `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>${parts.join('')}</svg>`, cats };
}

      <div class="field"><span class="lab" id="dayLab">Date</span><div class="chips" role="group" aria-labelledby="dayLab">${[0, 1, 2, 3].filter(n => D - n >= 1).map(n => `<button type="button" class="chip" data-day="${n}" aria-pressed="${n === day}">${n > 1 ? '' : icon('calendar')}${dayLabel(n)}</button>`).join('')}</div></div>
      <button class="btn block" type="submit">Save transaction</button>
    </form>`, '#fAmount');
  const f = $('#addForm');
  f.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.type) { type = b.dataset.type; $$('[data-type]', f).forEach(x => x.setAttribute('aria-pressed', x === b)); $('#catField').hidden = type === 'income'; $('#fName').placeholder = type === 'income' ? 'e.g. Paycheck' : "e.g. Trader Joe's"; }
    if (b.dataset.pick) { cat = b.dataset.pick; $$('[data-pick]', f).forEach(x => x.setAttribute('aria-pressed', x === b)); }
    if (b.dataset.day) { day = +b.dataset.day; $$('[data-day]', f).forEach(x => x.setAttribute('aria-pressed', x === b)); }
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const amt = parseFloat($('#fAmount').value.replace(/[$,\s]/g, '')), name = $('#fName').value.trim();
    let ok = true;
    const setErr = (id, inp, msg) => { $(id).textContent = msg; inp.setAttribute('aria-invalid', !!msg); if (msg) ok = false; };
    setErr('#eAmount', $('#fAmount'), !(amt > 0) ? 'Enter an amount greater than $0' : amt > 1e6 ? 'That amount looks too large' : '');
    setErr('#eName', $('#fName'), name ? '' : 'Add a short description');
    if (!ok) { (f.querySelector('[aria-invalid="true"]'))?.focus(); return; }
    const t = { id: 'u' + Date.now(), date: iso(new Date(Y, M, D - day)), merchant: name, cat: type === 'income' ? 'income' : cat, amount: +(type === 'income' ? amt : -amt).toFixed(2) };
    state.tx.push(t); save(); render(); closeSheet();
    toast(`${type === 'income' ? 'Income' : 'Expense'} of ${money(amt)} added`);
    const b = +state.budgets[t.cat]; const s = derive().byCat[t.cat];
    if (state.prefs.alerts && b && t.amount < 0 && s > b) setTimeout(() => toast(`${CATS[t.cat].name} is over budget by ${money(s - b)}`), 2400);
  });
}
function openTx(id) {
  const t = state.tx.find(x => x.id === id); if (!t) return;
  const pos = t.amount > 0;
  openSheet(`${sheetHead('Transaction')}
    <div class="stack">
      <div class="detail-top">${chip(t.cat)}<p class="t">${esc(t.merchant)}</p><p class="big num" style="color:${pos ? 'var(--ok)' : 'var(--text)'}">${pos ? '+' : '−'}${money(Math.abs(t.amount))}</p></div>
      <dl class="dl"><div><dt>Category</dt><dd>${CATS[t.cat].name}</dd></div><div><dt>Date</dt><dd>${parse(t.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</dd></div><div><dt>Account</dt><dd>Everyday checking •••• 4821</dd></div><div><dt>Status</dt><dd>${t.id.startsWith('u') ? 'Added manually' : 'Posted'}</dd></div></dl>
      <div class="btn-row"><button class="btn danger" data-del="${t.id}">${icon('trash')}Delete</button><button class="btn ghost" data-action="close">Done</button></div>
    </div>`);
}
function openBudget(k) {
  const d = derive();
  openSheet(`${sheetHead(`${CATS[k].name} budget`)}
    <form id="budForm" novalidate>
      <div class="detail-top">${chip(k)}<p style="font-size:14px;color:var(--text-2)" class="num">Spent ${money(d.byCat[k])} so far in ${monthName}</p></div>
      <div class="field"><label for="fBud">Monthly limit</label><input class="input num" id="fBud" inputmode="decimal" value="${state.budgets[k]}"><p class="err" id="eBud"></p></div>
      <div class="chips" role="group" aria-label="Quick amounts">${[-50, -10, 10, 50].map(v => `<button type="button" class="chip" data-step="${v}">${v > 0 ? '+' : '−'}$${Math.abs(v)}</button>`).join('')}</div>
      <button class="btn block" type="submit">Save budget</button>
    </form>`, '#fBud');
  const f = $('#budForm'), inp = $('#fBud');
  f.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) inp.value = Math.max(0, (parseFloat(inp.value) || 0) + +b.dataset.step); });
  f.addEventListener('submit', e => {
    e.preventDefault(); const v = parseFloat(inp.value.replace(/[$,\s]/g, ''));
    if (!(v >= 0) || v > 1e6) { $('#eBud').textContent = 'Enter an amount of $0 or more'; inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
    state.budgets[k] = Math.round(v * 100) / 100; save(); render(); closeSheet(); toast(`${CATS[k].name} budget set to ${usd0.format(v)}`);
  });
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, undo) {
  const el = $('#toast'); el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-undo>Undo</button>' : ''}`;
  el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200);
  if (undo) $('[data-undo]', el).onclick = () => { undo(); el.classList.remove('show'); };
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) { if (e.target === backdrop) closeSheet(); return; }
  if (b.dataset.cat) { filter = b.dataset.cat; renderActivity(derive()); }
  if (b.dataset.tab) go(b.dataset.tab);
  if (b.dataset.tx) openTx(b.dataset.tx);
  if (b.dataset.budget) openBudget(b.dataset.budget);
  if (b.dataset.filter) { filter = b.dataset.filter; renderActivity(derive()); }
  if (b.dataset.pref) { state.prefs[b.dataset.pref] = !state.prefs[b.dataset.pref]; b.setAttribute('aria-checked', state.prefs[b.dataset.pref]); save(); }
  if (b.dataset.del) {
    const i = state.tx.findIndex(t => t.id === b.dataset.del); const [t] = state.tx.splice(i, 1);
    save(); render(); closeSheet(); toast(`${t.merchant} deleted`, () => { state.tx.push(t); save(); render(); });
  }
  const a = b.dataset.action;
  if (a === 'add') openAdd();
  if (a === 'close') closeSheet();
  if (a === 'clearfilter') { filter = 'all'; query = ''; $('#q').value = ''; renderActivity(derive()); }
  if (a === 'reset') { if (confirm('Replace all transactions and budgets with the sample month?')) { state = seedState(); save(); render(); toast('Sample data loaded'); } }
  if (a === 'clear') {
    if (confirm('Delete all transactions? This can’t be undone.')) { const cur = derive().checking; state.tx = []; state.base = +cur.toFixed(2); save(); render(); toast('All transactions cleared'); }
  }
  if (a === 'export') {
    const rows = [['Date', 'Description', 'Category', 'Amount'], ...[...state.tx].sort((x, y) => x.date.localeCompare(y.date)).map(t => [t.date, t.merchant, CATS[t.cat].name, t.amount.toFixed(2)])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    Object.assign(document.createElement('a'), { href: url, download: `sprout-transactions-${iso(today)}.csv` }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000); toast('CSV downloaded');
  }
});
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeSheet(); });
document.addEventListener('keydown', e => {
  if (backdrop.hidden) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Tab') {
    const f = $$('button:not([tabindex="-1"]), input', sheet).filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
$('#q').addEventListener('input', e => { query = e.target.value; renderActivity(derive()); });

/* ---------- Init ---------- */
$('#todayLabel').textContent = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
$('#monthLabel').textContent = $('#budgetMonth').textContent = `${monthName} ${Y}`;
const hr = now.getHours();
$('#h-home').textContent = `${hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening'}, Maya`;
$$('[data-avatar]').forEach(el => {
  const img = new Image(); img.alt = ''; img.width = 64; img.height = 64;
  img.onload = () => { el.textContent = ''; el.appendChild(img); };
  img.src = 'https://api.dicebear.com/9.x/notionists/svg?seed=Maya&backgroundColor=ffe3c7';
});
render();
go(['home', 'activity', 'budget', 'profile'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home', { keepScroll: true });
</script>
</body>
</html>
