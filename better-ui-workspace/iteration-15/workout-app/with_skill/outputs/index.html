<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<title>Setwise · Workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean. Cool grey canvas, white cards, near-black summary card and controls, one orange accent. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F2F3F5; --surface: #FFFFFF; --surface-2: #F5F6F8; --line: #E7E9EE;
  --text: #12131A; --text-2: #5A6272; --text-3: #8A92A1;
  --ink: #16171D; --ink-2: #26272F;
  --brand: #FF5A1F; --brand-tint: #FFEDE5; --on-brand: #16171D;
  --ok: #137336; --ok-tint: #E7F6EC; --warn: #B45309; --warn-tint: #FEF3E2; --bad: #C2271B; --bad-tint: #FDECEA;
  --c-push: #F0603F; --c-pull: #2F6FEB; --c-legs: #1F9D63; --c-core: #7C5CF0; --c-mob: #0E9A97; --c-carry: #C27A0C;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px -10px rgba(16,24,40,.10);
  --sh-2: 0 1px 2px rgba(16,24,40,.05), 0 10px 24px -10px rgba(16,24,40,.16);
  --sh-float: 0 12px 32px -8px rgba(16,24,40,.22);
  --tabbar-h: 72px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { display: flex; min-height: 100dvh; }
.content { flex: 1; min-width: 0; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px); }
.page { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
.cols { display: grid; gap: 16px; }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }

/* sidebar = bottom tab bar on phones */
.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96);
  backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav .nav-brand, .nav .nav-foot { display: none; }
.nav-list { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); margin: 0 auto; max-width: 560px; padding: 0 8px; }
.nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500;
  color: var(--text-2); border-radius: var(--r-sm); transition: color .15s ease-out, background-color .15s ease-out; }
.nav-item .ic { width: 22px; height: 22px; }
.nav-item[aria-current="page"] { color: var(--text); font-weight: 600; }
.nav-item[aria-current="page"] .ic { color: var(--brand); stroke-width: 2.1; }
.nav-item:active { transform: scale(.96); }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }

/* ---------- Header ---------- */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.head-date { font-size: 13px; color: var(--text-2); font-weight: 500; }
.head h1 { font-size: 24px; letter-spacing: -.02em; line-height: 1.25; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE3D3; overflow: hidden; flex: none; display: grid; place-items: center; font-weight: 600; }
.avatar img { width: 100%; height: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); box-shadow: var(--sh-1); display: grid; place-items: center; flex: none;
  transition: transform .15s ease-out, box-shadow .15s ease-out; }
@media (hover: hover) { .icon-btn:hover { box-shadow: var(--sh-2); } }
.icon-btn:active { transform: scale(.95); }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 8px; border-radius: var(--r-md); background: var(--surface);
  box-shadow: var(--sh-1); border: 1.5px solid transparent; height: 76px; justify-content: center; transition: transform .15s ease-out, border-color .15s ease-out; }
.day:active { transform: scale(.96); }
.day-l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.day-n { font-size: 16px; font-weight: 600; }
.day-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
.day-dot.done { background: var(--brand); }
.day-dot.part { border: 2px solid var(--brand); }
.day-dot.plan { background: #D5D9E0; }
.day-dot.rest { background: transparent; }
.day[aria-pressed="true"] { background: var(--ink); color: #fff; }
.day[aria-pressed="true"] .day-l { color: rgba(255,255,255,.72); }
.day[aria-pressed="true"] .day-dot.plan { background: rgba(255,255,255,.35); }
.day.is-today { background: var(--ink); color: #fff; }
.day.is-today .day-l { color: rgba(255,255,255,.72); }
.day.is-today .day-dot.plan { background: rgba(255,255,255,.35); }

.day.is-today[aria-pressed="false"] { background: var(--surface); color: #C2410C; border-color: #FFC9B3; }
.day.is-today[aria-pressed="false"] .day-l { color: #C2410C; }

/* ---------- Summary card ---------- */
.hero { position: relative; overflow: hidden; background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 20px; box-shadow: 0 2px 4px rgba(16,24,40,.08), 0 20px 40px -18px rgba(16,24,40,.45); }
.hero::before { content: ""; position: absolute; right: -80px; top: -90px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,90,31,.18), transparent); pointer-events: none; }
.hero-top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.hero-label { font-size: 13px; color: rgba(255,255,255,.72); font-weight: 500; }
.hero-title { font-size: 28px; letter-spacing: -.02em; line-height: 1.2; margin-top: 2px; }
.hero-sub { font-size: 14px; color: rgba(255,255,255,.72); margin-top: 4px; }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: rgba(255,255,255,.12); }
.ring .bar { stroke: var(--brand); stroke-linecap: round; transition: stroke-dasharray .5s cubic-bezier(.2,.8,.2,1); }
.ring-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.ring-val small { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.72); margin-left: 1px; }
.hero-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.hero-stats div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.12); }
.hero-stats span { display: block; font-size: 12px; color: rgba(255,255,255,.72); }
.hero-stats b { font-size: 16px; font-weight: 600; }
.hero-days { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; width: 100%; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.hd { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.72); }
.hd i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--on-brand); }
.hd i .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.hd.done i { background: var(--brand); }
.hd.part i { background: rgba(255,90,31,.25); color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); }
.hd.future i { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); }
.hd.rest i { background: transparent; }
.hero-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: var(--brand); color: var(--on-brand); font-size: 13px; font-weight: 600; border-radius: var(--r-full); padding: 4px 10px 4px 6px; }
.hero-done { padding-left: 8px; } .hero-done .ic { width: 16px; height: 16px; stroke-width: 2.6; }

/* ---------- Sections and cards ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.sec-head h2 { font-size: 18px; letter-spacing: -.01em; }
.link { text-decoration: none; font-size: 14px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; border-radius: var(--r-xs); }
.link .ic { width: 16px; height: 16px; }
@media (hover: hover) { .link:hover { color: #C2410C; } }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 16px; }
.card-title { font-size: 16px; font-weight: 600; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }

.chip { --c: var(--c-push); width: 44px; height: 44px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 13%, #fff); color: var(--c); }
.chip .ic { width: 22px; height: 22px; }

/* exercise card */
.ex { padding: 14px 14px 14px; transition: box-shadow .2s ease-out; }
.ex-head { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: var(--r-sm); min-height: 48px; }
.ex-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.ex-info { flex: 1; min-width: 0; }
.ex-count { font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border-radius: var(--r-full); padding: 4px 10px; flex: none; }
.ex-count.done { background: var(--ok-tint); color: var(--ok); display: inline-flex; align-items: center; gap: 4px; padding-left: 8px; }
.ex-count.done .ic { width: 14px; height: 14px; stroke-width: 2.6; }
.sets { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.set { position: relative; height: 56px; border-radius: var(--r-sm); border: 1px solid var(--line); display: flex; flex-direction: column;
  align-items: center; justify-content: center; line-height: 1.15; transition: background-color .15s ease-out, border-color .15s ease-out, transform .15s ease-out; }
.set b { font-size: 16px; font-weight: 600; }
.set span { font-size: 12px; color: var(--text-2); font-weight: 500; }
@media (hover: hover) { .set:hover { border-color: #CBD0D8; } }
.set:active { transform: scale(.95); }
.set { background: var(--surface); }
.set .tick { position: absolute; top: 6px; right: 6px; color: #D9480F; display: none; }
.set .tick svg { width: 14px; height: 14px; stroke-width: 3; }
.set.next { border: 1.5px solid var(--ink); }
.set[aria-pressed="true"] { background: var(--brand-tint); border-color: #FFC9B3; }
.set[aria-pressed="true"] span { color: #8A3A12; }
.set[aria-pressed="true"] .tick { display: block; }
.set.pop { animation: pop .28s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { 40% { transform: scale(1.06); } }

.add-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: var(--r-lg);
  border: 1.5px dashed #CDD2DA; color: var(--text-2); font-weight: 600; font-size: 15px; transition: border-color .15s ease-out, color .15s ease-out; }
@media (hover: hover) { .add-row:hover { border-color: var(--text-2); color: var(--text); } }

/* rest day */
.rest-card { text-align: center; padding: 28px 20px 24px; }
.chip.big { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 12px; }
.chip.big .ic { width: 32px; height: 32px; }
.rest-card h3 { font-size: 20px; }
.rest-card p { margin-top: 4px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 15px;
  background: var(--ink); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(16,24,40,.2), 0 8px 18px -8px rgba(16,24,40,.5);
  transition: transform .15s ease-out, box-shadow .15s ease-out, opacity .15s ease-out; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--text); box-shadow: none; }
.btn .ic { width: 18px; height: 18px; }

/* this week card */
.wk-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.wk-fig { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.wk-fig small { font-size: 16px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 12px; }
.segs i { height: 8px; border-radius: 4px; background: #E6E8EC; }
.segs i.on { background: var(--brand); }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.mini { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.mini .chip { width: 36px; height: 36px; border-radius: 10px; }
.mini .chip .ic { width: 18px; height: 18px; }
.mini span { display: block; font-size: 12px; color: var(--text-2); }
.mini b { font-size: 15px; font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: var(--r-full); padding: 3px 8px; white-space: nowrap; }
.pill.up { background: var(--ok-tint); color: var(--ok); }
.pill.down { background: var(--bad-tint); color: var(--bad); }
.pill.part { background: var(--warn-tint); color: #92400E; }
.pill.flat { background: var(--surface-2); color: var(--text-2); }

/* rows (plan, PBs, settings) */
.list { padding: 4px 16px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 0; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
.row-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.row-end { text-align: right; flex: none; }
.row-end b { display: block; font-size: 16px; font-weight: 600; }
.row .chev { color: var(--text-3); }
button.row { border-radius: 0; }
@media (hover: hover) { button.row:hover .row-title { color: #C2410C; } }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-full); background: var(--brand-tint); color: #A8380E; margin-left: 6px; vertical-align: 2px; }
.dayname { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; color: var(--text-2); }

/* charts */
.chart { position: relative; margin-top: 12px; padding-top: 24px; }
.bars { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; height: 150px; align-items: end; position: relative; }
.bars::before { content: ""; position: absolute; inset: 0 0 0 0; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 50px); pointer-events: none; }
.bar { position: relative; border-radius: 8px 8px 4px 4px; background: #DDE1E7; min-height: 4px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.bar.hi { background: var(--brand); }
.bar.empty { background: transparent; border: 1.5px dashed #D3D7DE; }
.bar-v { background: var(--surface); padding: 0 3px; border-radius: 4px; z-index: 1; position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text-2); }
.bar.hi .bar-v { color: var(--text); }
.bar-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; white-space: nowrap; margin-top: 8px; font-size: 12px; color: var(--text-2); text-align: center; font-weight: 500; }
.bar-x .on { color: var(--text); font-weight: 600; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--text-3); pointer-events: none; }
.goal-line span { position: absolute; right: 0; top: -22px; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface); padding: 0 4px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 16px; display: grid; gap: 10px; }
.tile-top { display: flex; justify-content: space-between; align-items: center; }
.tile .chip { width: 40px; height: 40px; }
.tile .chip .ic { width: 20px; height: 20px; }
.tile-l { font-size: 13px; color: var(--text-2); }
.tile-v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile-v small { font-size: 14px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }

/* settings */
.profile { display: flex; align-items: center; gap: 14px; }
.profile .avatar { width: 56px; height: 56px; }
.toggle { position: relative; width: 52px; height: 32px; border-radius: var(--r-full); background: #D5D9E0; flex: none; transition: background-color .2s ease-out; }
.toggle::before { content: ""; position: absolute; inset: -6px -2px; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.toggle[aria-checked="true"] { background: var(--ink); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; gap: 2px; }
.seg button { min-width: 44px; height: 40px; padding: 0 10px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; color: var(--text-2); }
.seg.full { display: grid; grid-auto-columns: 1fr; width: 100%; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(16,24,40,.12); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; }
.stepper button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 2px rgba(16,24,40,.1); }
.stepper button .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.stepper button:active { transform: scale(.92); }
.stepper output { min-width: 44px; text-align: center; font-weight: 600; font-size: 15px; }
.danger { color: var(--bad); }
.row.danger .row-title { color: var(--bad); }
.chip.danger { --c: var(--bad); }
.footnote { font-size: 13px; color: var(--text-2); text-align: center; padding: 4px 0 8px; }

/* rest timer */
.timer { position: fixed; z-index: 25; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px); width: min(calc(100% - 32px), 528px);
  transform: translate(-50%, 0); background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 10px 10px 10px 16px; box-shadow: var(--sh-float);
  display: flex; align-items: center; gap: 12px; overflow: hidden; transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease-out; }
.timer[hidden] { display: flex; transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
.timer-ic { color: var(--brand); }
.timer-main { flex: 1; min-width: 0; }
.timer-l { font-size: 12px; color: rgba(255,255,255,.72); }
.timer-v { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.timer-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); transition: width .25s linear; }

<script>
(() => {
/* ---------- Icons ---------- */
const P = {

  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const GROUPS = { push: ['Push', '--c-push'], pull: ['Pull', '--c-pull'], legs: ['Legs', '--c-legs'], core: ['Core', '--c-core'], mob: ['Mobility', '--c-mob'], carry: ['Carry', '--c-carry'] };
const chip = (g, cls = '') => `<span class="chip ${cls}" style="--c:var(${GROUPS[g][1]})">${ic(g)}</span>`;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Plan ---------- */
const E = (name, group, sets, reps, kg = 0, unit = 'reps') => ({ name, group, sets, reps, kg, unit });
// index 0 = Monday
const PLAN = [
  { name: 'Push', ex: [E('Bench press', 'push', 4, 8, 60), E('Overhead press', 'push', 3, 10, 35), E('Incline dumbbell press', 'push', 3, 10, 22), E('Lateral raise', 'push', 3, 15, 8), E('Triceps pushdown', 'push', 3, 12, 25)] },
  { name: 'Pull', ex: [E('Deadlift', 'pull', 3, 5, 100), E('Pull-up', 'pull', 4, 8), E('Barbell row', 'pull', 4, 8, 55), E('Face pull', 'pull', 3, 15, 20), E('Hammer curl', 'pull', 3, 12, 14)] },
  { name: 'Legs', ex: [E('Back squat', 'legs', 4, 6, 80), E('Romanian deadlift', 'legs', 3, 10, 70), E('Walking lunge', 'legs', 3, 12, 16), E('Leg curl', 'legs', 3, 12, 35), E('Calf raise', 'legs', 4, 15, 40)] },
  { name: 'Mobility', ex: [E('Hip flexor stretch', 'mob', 2, 45, 0, 'sec'), E('Cat-cow', 'mob', 2, 10), E("World's greatest stretch", 'mob', 2, 6), E('Plank', 'core', 3, 45, 0, 'sec')] },
  { name: 'Upper body', ex: [E('Incline bench press', 'push', 4, 8, 50), E('Chin-up', 'pull', 3, 8), E('Seated cable row', 'pull', 3, 12, 50), E('Dumbbell shoulder press', 'push', 3, 10, 18), E('Cable fly', 'push', 3, 15, 12)] },
  null,
  { name: 'Full body', ex: [E('Front squat', 'legs', 4, 6, 60), E('Bench press', 'push', 3, 8, 62.5), E('Pull-up', 'pull', 3, 8), E('Dumbbell row', 'pull', 3, 10, 26), E("Farmer's carry", 'carry', 3, 40, 24, 'sec'), E('Hanging leg raise', 'core', 3, 12)] },
];
const LIBRARY = [E('Back squat', 'legs', 4, 6, 80), E('Bench press', 'push', 4, 8, 60), E('Deadlift', 'pull', 3, 5, 100), E('Push-up', 'push', 3, 15), E('Lat pulldown', 'pull', 3, 12, 45), E('Leg press', 'legs', 3, 12, 120), E('Bicep curl', 'pull', 3, 12, 12), E('Plank', 'core', 3, 45, 0, 'sec'), E('Hip thrust', 'legs', 3, 10, 80)];

/* ---------- Dates ---------- */
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = (d) => (d.getDay() + 6) % 7; // Monday = 0
const startOfWeek = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -dow(x)); };
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TODAY_KEY = keyOf(TODAY);
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const nf = (n) => Math.round(n).toLocaleString('en-GB');
const kgf = (n) => (Math.round(n * 10) / 10).toLocaleString('en-GB');

/* ---------- State ---------- */
const STORE = 'setwise.v1';
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.logs) return s; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function fresh(withLogs) { return { name: 'Sam', goal: 5, restOn: true, restSecs: 90, logs: withLogs || {} }; }

function instantiate(tpl, scale = 1) {
  return { name: tpl.name, ex: tpl.ex.map(e => ({ name: e.name, group: e.group, unit: e.unit,
    sets: Array.from({ length: e.sets }, () => ({ reps: e.reps, kg: e.kg ? Math.round(e.kg * scale / 2.5) * 2.5 : 0, done: false })) })) };
}
function seed() {
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const logs = {};
  const wk0 = startOfWeek(TODAY);
  for (let w = 8; w >= 0; w--) {
    for (let i = 0; i < 7; i++) {
      const d = addDays(wk0, -7 * w + i);
      if (d > TODAY || !PLAN[i]) continue;
      const scale = 1 - w * 0.012;
      const day = instantiate(PLAN[i], scale);
      const isToday = keyOf(d) === TODAY_KEY;
      let completion;
      if (isToday) completion = 'today';
      else if (w === 0) completion = i === 2 ? 'partial' : 'full';
      else { const x = rnd(); completion = x < .12 ? 'skip' : x < .22 ? 'partial' : 'full'; }
      if (completion === 'skip') continue;
      let budget = completion === 'today' ? 8 : completion === 'partial' ? Math.ceil(day.ex.reduce((a, e) => a + e.sets.length, 0) * .45) : Infinity;
      day.ex.forEach(e => e.sets.forEach(s => { if (budget > 0) { s.done = true; budget--; } }));
      logs[keyOf(d)] = day;
    }
  }
  return fresh(logs);
}

function planFor(d) { return PLAN[dow(d)]; }
function getDay(key) { if (S.logs[key]) return S.logs[key]; const t = planFor(fromKey(key)); return t ? instantiate(t) : null; }
function own(key) { if (!S.logs[key]) { const d = getDay(key); S.logs[key] = d || { name: 'Extra workout', ex: [] }; } return S.logs[key]; }

const stats = (day) => {
  let sets = 0, done = 0, vol = 0, exDone = 0;
  if (day) day.ex.forEach(e => {
    let d = 0;
    e.sets.forEach(s => { sets++; if (s.done) { done++; d++; if (s.unit !== 'sec' && e.unit !== 'sec') vol += s.reps * s.kg; else vol += 0; } });
    if (e.sets.length && d === e.sets.length) exDone++;
  });
  return { sets, done, vol, exDone, exTotal: day ? day.ex.length : 0 };
};
function weekStats(weekStart, uptoIdx = 6) {
  let workouts = 0, sets = 0, vol = 0; const daily = [];
  for (let i = 0; i < 7; i++) {
    const k = keyOf(addDays(weekStart, i));
    const st = stats(S.logs[k]);
    daily.push(st.vol);
    if (i > uptoIdx) continue;
    if (st.sets && st.done === st.sets) workouts++;
    sets += st.done; vol += st.vol;
  }
  return { workouts, sets, vol, daily };
}

/* ---------- UI state ---------- */
let tab = (location.hash || '#today').slice(1);
if (!['today', 'plan', 'progress', 'settings'].includes(tab)) tab = 'today';
let selKey = TODAY_KEY;
let confirmClear = null;
let nextSet = null;

const TABS = [['today', 'Today'], ['plan', 'Plan'], ['progress', 'Progress'], ['settings', 'Settings']];
const avatarURL = () => `https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(S.name || 'Sam')}&backgroundColor=ffe3d3`;
const avatar = () => `<span class="avatar" aria-hidden="true"><img src="${avatarURL()}" alt="" width="44" height="44" onerror="this.replaceWith(document.createTextNode('${esc((S.name || 'S')[0])}'))"></span>`;

  document.getElementById('nav').innerHTML = TABS.map(([id, label]) =>

function render() {

/* ---------- Today ---------- */
function greet() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function setLabel(e, s) {
  if (e.unit === 'sec') return { big: `${s.reps}s`, small: s.kg ? `${kgf(s.kg)} kg` : 'Hold' };
  return { big: s.reps, small: s.kg ? `${kgf(s.kg)} kg` : 'BW' };
}
function exMeta(e) {
  const s0 = e.sets[0]; if (!s0) return 'No sets';
  const top = Math.max(...e.sets.map(s => s.kg));
  const reps = e.unit === 'sec' ? `${s0.reps} s` : s0.reps;
  return `${e.sets.length} × ${reps} · ${top ? kgf(top) + ' kg' : e.unit === 'sec' ? 'Hold' : 'Bodyweight'}`;
}
function viewToday() {
  const ws = startOfWeek(TODAY);
  const sel = fromKey(selKey);
  const day = getDay(selKey);
  const st = stats(day);
  const isToday = selKey === TODAY_KEY;
  const strip = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(ws, i), k = keyOf(d), st2 = stats(S.logs[k]);
    const planned = PLAN[i] || (S.logs[k] && S.logs[k].ex.length);
    const cls = st2.sets && st2.done === st2.sets ? 'done' : st2.done ? 'part' : planned ? 'plan' : 'rest';
    const label = `${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}, ${cls === 'done' ? 'completed' : cls === 'part' ? 'partly done' : cls === 'plan' ? (PLAN[i] ? PLAN[i].name : 'workout') : 'rest day'}`;
    return `<button type="button" class="day ${k === TODAY_KEY ? 'is-today' : ''}" data-act="pick-day" data-key="${k}" aria-pressed="${k === selKey}" aria-label="${label}">
      <span class="day-l">${fmt(d, { weekday: 'narrow' })}</span><span class="day-n num">${d.getDate()}</span><span class="day-dot ${cls}"></span></button>`;
  }).join('');

  let workout;
  if (!day || !day.ex.length) {
    const next = nextPlanned(sel);
    workout = `<section class="card rest-card"><span class="chip big" style="--c:var(--c-core)">${ic('moon')}</span><h3>Rest day</h3>

      <button type="button" class="btn" data-act="add-ex" style="margin-top:16px">${ic('plus')}Log a workout</button></section>`;
  } else {
    const pct = st.sets ? Math.round(st.done / st.sets * 100) : 0;
    const left = Math.max(0, Math.round((st.sets - st.done) * 2.5));
    const C = 2 * Math.PI * 40;
    const dayWord = isToday ? "Today's workout" : `${fmt(sel, { weekday: 'long' })}'s workout`;
    const complete = st.sets && st.done === st.sets;
    workout = `<section class="hero" aria-label="Workout summary">
        <div class="hero-top"><div style="min-width:0">
          <p class="hero-label">${dayWord}</p><h2 class="hero-title">${esc(day.name)}</h2>
          ${complete ? `<span class="hero-done">${ic('check')}Workout complete</span>` : `<p class="hero-sub num">${st.done} of ${st.sets} sets · about ${left} min left</p>`}
        </div>
        <div class="ring" role="img" aria-label="${pct}% of sets done"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"/><circle class="bar" cx="50" cy="50" r="40" stroke-dasharray="${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"/></svg><span class="ring-val num">${pct}<small>%</small></span></div></div>
        <div class="hero-stats num"><div><span>Sets</span><b>${st.done}/${st.sets}</b></div><div><span>Exercises</span><b>${st.exDone}/${st.exTotal}</b></div><div><span>Volume</span><b>${nf(st.vol)} kg</b></div></div>
      </section>

      ${(() => { nextSet = null; day.ex.some((e, i) => e.sets.some((s, j) => !s.done && (nextSet = [i, j]))); return day.ex.map((e, i) => exCard(e, i)).join(''); })()}
      <button type="button" class="add-row" data-act="add-ex">${ic('plus')}Add exercise</button>`;
  }

  const header = `<header class="head">
      <div><p class="head-date">${fmt(TODAY, { weekday: 'long', day: 'numeric', month: 'long' })}</p><h1>${greet()}, ${esc(S.name)}</h1></div>
      ${headAvatar()}</header>`;

  return `<div class="page">${header}
    <div class="cols"><div class="col">
      <nav class="week" aria-label="This week">${strip}</nav>
      ${workout}
    </div>
    <aside class="col aside" aria-label="Weekly progress">${weekCard()}${volumeChart(weekStats(ws, dow(TODAY)), dow(TODAY), 'only-wide')}${nextCard()}</aside></div></div>`;
}
function exCard(e, i) {

      ${chip(e.group)}<span class="ex-info"><span class="ex-name" style="display:block">${esc(e.name)}</span><span class="ex-meta num" style="display:block">${exMeta(e)}</span></span>

      ${e.sets.map((s, j) => { const l = setLabel(e, s); return `<button type="button" class="set num ${nextSet && nextSet[0] === i && nextSet[1] === j ? 'next' : ''}" data-act="tick" data-i="${i}" data-j="${j}" aria-pressed="${s.done}" aria-label="Set ${j + 1}: ${l.big} ${e.unit === 'sec' ? '' : 'reps'} at ${l.small}"><b>${l.big}</b><span>${l.small}</span><i class="tick">${ic('check')}</i></button>`; }).join('')}

function nextPlanned(from) {

}
function weekCard() {

}
function nextCard() {

/* ---------- Plan ---------- */

/* ---------- Progress ---------- */
function viewProgress() {
  const ws = startOfWeek(TODAY), ti = dow(TODAY);
  const w = weekStats(ws, ti), last = weekStats(addDays(ws, -7), ti);
  const d = (a, b) => (b ? Math.round((a - b) / b * 100) : null);
  const deltaPill = (v) => v === null ? '<span class="pill flat">New</span>' : `<span class="pill ${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '▲' : v < 0 ? '▼' : ''} ${Math.abs(v)}%</span>`;
  const mins = w.sets * 2.5;
  // weeks on target
  let streak = 0;
  for (let n = w.workouts >= S.goal ? 0 : 1; n < 52; n++) { if (weekStats(addDays(ws, -7 * n)).workouts >= S.goal) streak++; else break; }

  const volChart = volumeChart(w, ti);
  const weeks = Array.from({ length: 8 }, (_, n) => { const s = addDays(ws, -7 * (7 - n)); return { s, c: weekStats(s).workouts }; });
  const maxW = Math.max(S.goal, ...weeks.map(x => x.c), 1) + 1;
  const wkBars = weeks.map((x, i) => `<div class="bar ${i === 7 ? 'hi' : ''}" style="height:${Math.max(3, x.c / maxW * 100)}%"><span class="bar-v num">${x.c}</span></div>`).join('');
  const wkX = weeks.map((x, i) => `<span class="${i === 7 ? 'on' : ''}">${i === 7 ? 'Now' : fmt(x.s, { day: 'numeric', month: 'numeric' })}</span>`).join('');

  // personal bests
  const best = {};
  Object.keys(S.logs).sort().forEach(k => S.logs[k].ex.forEach(e => e.sets.forEach(s => {
    if (!s.done || !s.kg || e.unit === 'sec') return;
    const b = best[e.name];
    if (!b || s.kg > b.kg) best[e.name] = { kg: s.kg, reps: s.reps, key: k, group: e.group, prev: b ? b.kg : null };
  })));
  const pbs = Object.entries(best).sort((a, b) => b[1].kg - a[1].kg).slice(0, 5);
  const recent = (k) => (TODAY - fromKey(k)) / 864e5 <= 7;
  const pbList = pbs.length ? pbs.map(([n, b]) => `<div class="row">${chip(b.group)}<div class="row-main"><div class="row-title" style="font-size:15px">${esc(n)}</div><div class="row-sub num">${b.reps} reps · ${fmt(fromKey(b.key), { day: 'numeric', month: 'short' })}</div></div>
      <div class="row-end"><b class="num">${kgf(b.kg)} kg</b>${recent(b.key) && b.prev ? `<span class="pill up num" style="margin-top:2px">New PB</span>` : ''}</div></div>`).join('')
    : `<div class="empty"><span class="chip big" style="--c:var(--brand)">${ic('trophy')}</span><p class="card-title">No personal bests yet</p><p class="muted small">Tick off a weighted set and your best lifts show up here.</p></div>`;

  const hero = `<section class="hero" aria-label="This week">
      <div class="hero-top"><div><p class="hero-label">Workouts this week</p>
        <h2 class="hero-title num">${w.workouts} of ${S.goal}</h2>
        <p class="hero-sub">${w.workouts >= S.goal ? 'Weekly goal reached' : `${S.goal - w.workouts} more to reach your goal`}</p></div>
        <div class="ring" role="img" aria-label="${Math.min(100, Math.round(w.workouts / S.goal * 100))}% of weekly goal"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"/><circle class="bar" cx="50" cy="50" r="40" stroke-dasharray="${(Math.min(1, w.workouts / S.goal) * 251.3).toFixed(1)} 251.3"/></svg><span class="ring-val num">${Math.min(100, Math.round(w.workouts / S.goal * 100))}<small>%</small></span></div></div>
      <div class="hero-days">${Array.from({ length: 7 }, (_, i) => { const k = keyOf(addDays(ws, i)), st = stats(S.logs[k]); const c = st.sets && st.done === st.sets ? 'done' : st.done ? 'part' : i > ti ? 'future' : PLAN[i] ? 'miss' : 'rest';
          return `<div class="hd ${c}" title="${fmt(addDays(ws, i), { weekday: 'long' })}"><i>${c === 'done' || c === 'part' ? ic('check') : ''}</i><span>${fmt(addDays(ws, i), { weekday: 'narrow' })}</span></div>`; }).join('')}</div></section>`;

  const tiles = `<div class="tiles">
      ${tile('trend', 'var(--brand)', 'Volume', `${nf(w.vol)}<small> kg</small>`, deltaPill(d(w.vol, last.vol)))}
      ${tile('layers', 'var(--c-pull)', 'Sets done', `${w.sets}`, deltaPill(d(w.sets, last.sets)))}
      ${tile('clock', 'var(--c-legs)', 'Est. time', `${Math.floor(mins / 60)}<small>h</small> ${Math.round(mins % 60)}<small>m</small>`, `<span class="pill flat num">${w.workouts} workouts</span>`)}
      ${tile('flame', 'var(--c-core)', 'Weeks on target', `${streak}`, streak ? '<span class="pill up">On track</span>' : '<span class="pill flat">Start one</span>')}
    </div>`;

  const wkChart = `<section class="card" aria-labelledby="wT"><div class="sec-head" style="margin:0"><h2 id="wT" class="card-title">Workouts per week</h2><span class="muted small">Last 8 weeks</span></div><div class="legend"><span><i style="background:var(--brand)"></i>This week</span><span><i style="background:transparent;border-top:1.5px dashed var(--text-3);border-radius:0;height:0;width:14px;vertical-align:3px"></i>Goal of ${S.goal}</span></div>
      <div class="chart" role="img" aria-label="Workouts per week over the last 8 weeks against a goal of ${S.goal}"><div class="bars" style="--n:8">${wkBars}<div class="goal-line" style="bottom:${S.goal / maxW * 100}%"></div></div><div class="bar-x" style="--n:8">${wkX}</div></div></section>`;
  const pbCard = `<section class="card list" aria-labelledby="pT"><div class="sec-head" style="margin:8px 0 0"><h2 id="pT" class="card-title">Personal bests</h2><span class="muted small">Heaviest set</span></div>${pbList}</section>`;

  return `<div class="page"><header class="head"><div><p class="head-date">Week ${isoWeek(TODAY)}</p><h1>Progress</h1></div>${headAvatar()}</header>
    <div class="prog">${hero}${volChart}${tiles}${wkChart}${pbCard}</div></div>`;
}
function volumeChart(w, ti, extraCls = '') {
  const ws = startOfWeek(TODAY), maxD = Math.max(1, ...w.daily);

  }).join('');
  const dayX = Array.from({ length: 7 }, (_, i) => `<span class="${i === ti ? 'on' : ''}">${fmt(addDays(ws, i), { weekday: 'short' }).slice(0, 3)}</span>`).join('');

      <div class="chart" role="img" aria-label="Daily volume this week, highest ${nf(maxD)} kg"><div class="bars" style="--n:7">${dayBars}</div><div class="bar-x" style="--n:7">${dayX}</div></div></section>`;
}
function tile(i, c, l, v, extra) {
  return `<div class="tile"><div class="tile-top"><span class="chip" style="--c:${c}">${ic(i)}</span>${extra}</div><div><div class="tile-l">${l}</div><div class="tile-v num">${v}</div></div></div>`;
}
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

/* ---------- Settings ---------- */

  const seg = (act, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur == v}">${l}</button>`).join('')}</div>`;

        <button type="button" class="toggle" role="switch" aria-checked="${S.restOn}" aria-labelledby="rtL" data-act="rest-on"></button></div>

        ${seg('rest-secs', [[60, '1:00'], [90, '1:30'], [120, '2:00']], S.restSecs)}</div>

    <section class="card list" aria-label="Data">

      <button type="button" class="row danger" data-act="clear"><span class="chip danger">${ic('trash')}</span><span class="row-main"><span class="row-title" style="display:block">${confirmClear === 'clear' ? 'Tap again to confirm' : 'Clear sample data'}</span><span class="row-sub" style="display:block">Deletes your log, keeps your plan</span></span></button>

    </section>

}

/* ---------- Sheets ---------- */
let sheetCtx = null, lastFocus = null;
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html, ctx) {

  sheet.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`;
  sheet.hidden = false; scrim.hidden = false;

}
function closeSheet() {

  setTimeout(() => { sheet.hidden = true; scrim.hidden = true; sheet.innerHTML = ''; }, 260);
  sheetCtx = null; lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
const stepper = (act, j, val, label) => `<div><div class="stepper"><button type="button" data-act="${act}" data-j="${j}" data-v="-1" aria-label="Decrease ${label}">${ic('minus')}</button><output class="num">${val}</output><button type="button" data-act="${act}" data-j="${j}" data-v="1" aria-label="Increase ${label}">${ic('plus')}</button></div><span class="unit">${label}</span></div>`;
function editSheet() {
  const e = own(selKey).ex[sheetCtx.i];
  const st = (act, j, val, label) => `<div class="stepper"><button type="button" data-act="${act}" data-j="${j}" data-v="-1" aria-label="Decrease ${label}, set ${j + 1}">${ic('minus')}</button><output class="num">${val}</output><button type="button" data-act="${act}" data-j="${j}" data-v="1" aria-label="Increase ${label}, set ${j + 1}">${ic('plus')}</button></div>`;
  const rows = `<div class="set-edit hdr"><span style="text-align:center">Set</span><span style="text-align:center">${e.unit === 'sec' ? 'Seconds' : 'Reps'}</span><span style="text-align:center">Weight (kg)</span></div>` + e.sets.map((s, j) => `<div class="set-edit">
      <button type="button" class="check" data-act="s-done" data-j="${j}" aria-pressed="${s.done}" aria-label="Set ${j + 1} done"><span class="n">${j + 1}</span>${ic('check')}</button>
      ${st('s-reps', j, s.reps, e.unit === 'sec' ? 'seconds' : 'reps')}${st('s-kg', j, s.kg ? kgf(s.kg) : 'BW', 'weight')}</div>`).join('');
  return `<div class="sheet-head">${chip(e.group)}<h2 id="sheetTitle">${esc(e.name)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
    ${rows}
    <div class="sheet-tools"><button type="button" class="link" data-act="s-add">${ic('plus')}Add set</button><button type="button" class="link" data-act="s-remove" ${e.sets.length < 2 ? 'disabled' : ''}>${ic('minus')}Remove last set</button></div>
    <button type="button" class="btn block" data-act="close" style="margin-top:8px">Done</button>
    <button type="button" class="link danger del" data-act="ex-del">${ic('trash')}${sheetCtx.confirm ? 'Tap again to delete' : 'Delete exercise'}</button>`;
}
function addSheet() {
  const c = sheetCtx.draft;
  const have = new Set((getDay(selKey) || { ex: [] }).ex.map(e => e.name));
  const sugg = LIBRARY.filter(e => !have.has(e.name)).slice(0, 6);
  return `<div class="sheet-head"><h2 id="sheetTitle">Add exercise</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div>
    <div class="field"><span class="lab">Suggestions</span><div class="sugg">${sugg.map(e => `<button type="button" data-act="a-pick" data-n="${esc(e.name)}" aria-pressed="${c.name === e.name}">${chip(e.group)}${esc(e.name)}</button>`).join('')}</div></div>
    <div class="field"><label for="exName">Exercise name</label><input id="exName" class="input" value="${esc(c.name)}" placeholder="e.g. Dips" maxlength="40" autocomplete="off">${sheetCtx.err ? `<span class="field-err">Enter a name for the exercise</span>` : ''}</div>
    <div class="field"><span class="lab" id="mgL">Muscle group</span><div class="seg full" role="group" aria-labelledby="mgL">${['push', 'pull', 'legs', 'core'].map(g => `<button type="button" data-act="a-group" data-v="${g}" aria-pressed="${c.group === g}">${GROUPS[g][0]}</button>`).join('')}</div></div>
    <div class="card list" style="background:var(--surface-2);box-shadow:none;padding:0 14px">${[['a-sets', c.sets, 'Sets'], ['a-reps', c.unit === 'sec' ? c.reps + ' s' : c.reps, c.unit === 'sec' ? 'Seconds per set' : 'Reps per set'], ['a-kg', c.kg ? kgf(c.kg) + ' kg' : 'Bodyweight', 'Weight']].map(([a, v, l]) =>
      `<div class="row" style="min-height:60px"><span class="row-main row-title" style="font-size:15px">${l}</span><div class="stepper" style="background:var(--surface)"><button type="button" data-act="${a}" data-j="0" data-v="-1" aria-label="Decrease ${l.toLowerCase()}">${ic('minus')}</button><output class="num" style="min-width:92px">${v}</output><button type="button" data-act="${a}" data-j="0" data-v="1" aria-label="Increase ${l.toLowerCase()}">${ic('plus')}</button></div></div>`).join('')}</div>
    <button type="button" class="btn block" data-act="a-save" style="margin-top:12px">Add to workout</button>`;
}
function rerenderSheet() { const y = sheet.scrollTop; const a = document.activeElement && document.activeElement.dataset; sheet.innerHTML = `<div class="grab" aria-hidden="true"></div>` + (sheetCtx.type === 'edit' ? editSheet() : addSheet()); sheet.scrollTop = y;
  if (a && a.act) { const el = sheet.querySelector(`[data-act="${a.act}"]${a.j != null ? `[data-j="${a.j}"]` : ''}${a.v != null ? `[data-v="${a.v}"]` : ''}${a.n != null ? `[data-n="${CSS.escape(a.n)}"]` : ''}`); el && el.focus({ preventScroll: true }); } }

/* ---------- Rest timer ---------- */
const T = { end: 0, total: 0, id: 0 };
const timerEl = document.getElementById('timer');
function startTimer(secs, label) {
  T.total = secs; T.end = Date.now() + secs * 1000;
  document.getElementById('timerL').textContent = label;
  timerEl.hidden = false; clearInterval(T.id); T.id = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer() {
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  document.getElementById('timerV').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  document.getElementById('timerBar').style.width = `${(1 - left / T.total) * 100}%`;
  if (left <= 0) { stopTimer(); navigator.vibrate && navigator.vibrate([120, 60, 120]); }
}
function stopTimer() { clearInterval(T.id); timerEl.hidden = true; }

/* ---------- Events ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act], [data-tab]'); if (!t) return;
  const a = t.dataset.act;
  if (t.dataset.tab) { tab = t.dataset.tab; if (tab === 'today') selKey = TODAY_KEY; return; }
  if (a !== 'clear' && a !== 'restore') confirmClear = null;
  const i = +t.dataset.i, j = +t.dataset.j, v = +t.dataset.v;
  switch (a) {
    case 'pick-day': selKey = t.dataset.key; if (selKey !== TODAY_KEY) stopTimer(); render(); break;
    case 'pick-day-tab': selKey = t.dataset.key; tab = 'today'; history.replaceState(null, '', '#today'); render(); scrollTo(0, 0); break;
    case 'tick': {
      const day = own(selKey), e = day.ex[i], s = e.sets[j];
      s.done = !s.done; save();
      const remaining = day.ex.reduce((n, x) => n + x.sets.filter(y => !y.done).length, 0);
      render();
      const el = document.querySelector(`.set[data-i="${i}"][data-j="${j}"]`); if (el) { el.classList.add('pop'); el.focus({ preventScroll: true }); }
      if (s.done && S.restOn && remaining > 0 && selKey === TODAY_KEY) {
        const nextEx = e.sets.some(y => !y.done) ? e.name : (day.ex.find(x => x.sets.some(y => !y.done)) || e).name;
        startTimer(S.restSecs, `Rest · next: ${nextEx}`);
      } else if (!remaining) stopTimer();
      break; }
    case 'edit-ex': own(selKey); openSheet('', { type: 'edit', i }); rerenderSheet(); break;
    case 'add-ex': openSheet('', { type: 'add', draft: { name: '', group: 'push', sets: 3, reps: 10, kg: 20, unit: 'reps' } }); rerenderSheet(); sheet.querySelector('#exName').focus(); break;
    case 'close': closeSheet(); render(); break;
    case 's-reps': case 's-kg': case 's-done': {
      const s = own(selKey).ex[sheetCtx.i].sets[j], e = own(selKey).ex[sheetCtx.i];
      if (a === 's-reps') s.reps = Math.max(1, s.reps + v * (e.unit === 'sec' ? 5 : 1));
      if (a === 's-kg') s.kg = Math.max(0, s.kg + v * (s.kg >= 20 || (s.kg === 20 && v > 0) ? 2.5 : 1));
      if (a === 's-done') s.done = !s.done;
      save(); rerenderSheet(); break; }
    case 's-add': { const e = own(selKey).ex[sheetCtx.i]; const l = e.sets[e.sets.length - 1] || { reps: 10, kg: 0 }; e.sets.push({ reps: l.reps, kg: l.kg, done: false }); save(); rerenderSheet(); break; }
    case 's-remove': { const e = own(selKey).ex[sheetCtx.i]; if (e.sets.length > 1) e.sets.pop(); save(); rerenderSheet(); break; }
    case 'ex-del': if (!sheetCtx.confirm) { sheetCtx.confirm = true; rerenderSheet(); } else { own(selKey).ex.splice(sheetCtx.i, 1); save(); closeSheet(); render(); } break;
    case 'a-pick': { const e = LIBRARY.find(x => x.name === t.dataset.n); Object.assign(sheetCtx.draft, { name: e.name, group: e.group, sets: e.sets, reps: e.reps, kg: e.kg, unit: e.unit }); sheetCtx.err = false; rerenderSheet(); break; }
    case 'a-group': sheetCtx.draft.group = t.dataset.v; rerenderSheet(); break;
    case 'a-sets': sheetCtx.draft.sets = Math.min(10, Math.max(1, sheetCtx.draft.sets + v)); rerenderSheet(); break;
    case 'a-reps': sheetCtx.draft.reps = Math.max(1, sheetCtx.draft.reps + v * (sheetCtx.draft.unit === 'sec' ? 5 : 1)); rerenderSheet(); break;
    case 'a-kg': { const k = sheetCtx.draft.kg; sheetCtx.draft.kg = Math.max(0, k + v * (k >= 20 && !(k === 20 && v < 0) ? 2.5 : 1)); rerenderSheet(); break; }
    case 'a-save': {
      const c = sheetCtx.draft; c.name = c.name.trim();
      if (!c.name) { sheetCtx.err = true; rerenderSheet(); sheet.querySelector('#exName').focus(); break; }
      const day = own(selKey);
      day.ex.push({ name: c.name, group: c.group, unit: c.unit, sets: Array.from({ length: c.sets }, () => ({ reps: c.reps, kg: c.kg, done: false })) });
      save(); closeSheet(); render(); break; }
    case 'timer-add': T.end += 30000; T.total += 30; tickTimer(); break;
    case 'timer-skip': stopTimer(); break;
    case 'goal': S.goal = Math.min(7, Math.max(1, S.goal + v)); save(); render(); break;
    case 'rest-on': S.restOn = !S.restOn; if (!S.restOn) stopTimer(); save(); render(); document.querySelector('[data-act="rest-on"]').focus(); break;
    case 'rest-secs': S.restSecs = v; save(); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = `setwise-${TODAY_KEY}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break; }
    case 'clear': case 'restore':
      if (confirmClear !== a) { confirmClear = a; render(); document.querySelector(`[data-act="${a}"]`).focus(); break; }
      confirmClear = null; S = a === 'clear' ? Object.assign(fresh(), { name: S.name, goal: S.goal, restOn: S.restOn, restSecs: S.restSecs, logs: {} }) : Object.assign(seed(), { name: S.name }); save(); stopTimer(); render(); break;
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'exName' && sheetCtx) { sheetCtx.draft.name = ev.target.value; if (sheetCtx.err && ev.target.value.trim()) { sheetCtx.err = false; } }
  if (ev.target.id === 'nameIn') { S.name = ev.target.value.trim() || 'Sam'; save(); renderNav(); }
});
document.addEventListener('keydown', (ev) => {
  if (!sheetCtx) return;
  if (ev.key === 'Escape') { closeSheet(); render(); }
  if (ev.key === 'Enter' && ev.target.id === 'exName') sheet.querySelector('[data-act="a-save"]').click();
  if (ev.key === 'Tab') { const f = [...sheet.querySelectorAll('button:not(:disabled), input')]; if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); } }
});
scrim.addEventListener('click', () => { closeSheet(); render(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { tab = h; if (h === 'today' && selKey !== TODAY_KEY && !document.activeElement?.dataset?.key) selKey = TODAY_KEY; render(); scrollTo(0, 0); } });
render();
})();
</script>
</body>
</html>
