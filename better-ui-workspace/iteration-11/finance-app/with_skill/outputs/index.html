<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<title>Penny – Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean. Cool-neutral canvas, white cards, deep green brand on the balance card,
   buttons and active states; soft category tints on small icon chips and chart series only. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F1F4F3; --surface: #FFFFFF; --surface-2: #F5F7F6; --line: #E6EAE8;
  --text: #0F1A17; --text-2: #5B6B66; --text-3: #8D9A96;
  --brand: #0D7A5A; --brand-deep: #095640; --brand-tint: #E5F3EE; --on-brand: #FFFFFF;
  --ok: #15803D; --ok-tint: #E7F6EC; --warn: #B45309; --warn-tint: #FDF2DF; --bad: #C2312A; --bad-tint: #FCEBEA;
  --r-xs: 6px; --r-sm: 12px; --r-md: 20px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16,32,28,.04), 0 8px 24px -14px rgba(16,32,28,.12);
  --sh-2: 0 1px 2px rgba(16,32,28,.05), 0 10px 24px -10px rgba(16,32,28,.16);
  --sh-float: 0 12px 32px -8px rgba(16,32,28,.20);
  --sh-brand: 0 2px 4px rgba(9,86,64,.18), 0 18px 36px -14px rgba(9,86,64,.45);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11"; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
legend { padding: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(112px + env(safe-area-inset-bottom)); }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; min-height: 48px; }
.top-l { min-width: 0; }
.eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.top .btn { box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(9,86,64,.2), 0 4px 10px -4px rgba(13,122,90,.45); }
.top-r { display: flex; align-items: center; gap: 10px; }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #DCEFE7; display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); flex: none; font-weight: 600; color: var(--brand-deep); }
.avatar-btn img { width: 100%; height: 100%; }
.desk-only { display: none !important; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full);
  font-weight: 600; font-size: 15px; background: var(--brand); color: var(--on-brand);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(9,86,64,.25), 0 6px 16px -6px rgba(13,122,90,.6);
  transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; white-space: nowrap; }
@media (hover: hover) { .btn:hover { background: #0B6D50; transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; height: 52px; font-size: 16px; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(16,32,28,.05); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); } }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.danger:hover { background: #F8DCDA; } }
.link { text-decoration: none; color: var(--brand); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px; margin-right: -4px; border-radius: var(--r-sm); }
@media (hover: hover) { .link:hover { color: var(--brand-deep); } }
.link .ic { width: 16px; height: 16px; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-1); border: 1px solid rgba(16,32,28,.04); }
.pad { padding: 20px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 44px; }
.sec-h h2 { font-size: 18px; letter-spacing: -0.01em; }
.card .sec-h { margin-top: -10px; margin-bottom: 8px; }
.stack { display: grid; gap: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ---------- Balance card ---------- */
.balance { position: relative; overflow: hidden; color: var(--on-brand); border-radius: var(--r-lg); padding: 20px 20px 18px;
  background: radial-gradient(120% 90% at 100% 0%, #13946E 0%, rgba(19,148,110,0) 55%), linear-gradient(160deg, #0D7A5A 0%, #085038 100%);
  box-shadow: var(--sh-brand), inset 0 1px 0 rgba(255,255,255,.14); }
.balance::after { content: ""; position: absolute; width: 260px; height: 260px; right: -110px; top: -140px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.10); box-shadow: 0 0 0 36px rgba(255,255,255,.035); pointer-events: none; }
.bal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bal-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.86); }
.bal-fig { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.bal-fig .cents { color: rgba(255,255,255,.72); font-weight: 600; }
.bal-pill { background: rgba(255,255,255,.16); color: #fff; height: 28px; padding: 0 10px; margin-top: 8px; }
.bal-pill .ic { width: 14px; height: 14px; }
.bal-acct { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.86); white-space: nowrap; padding-top: 1px; }
.bal-chart { position: relative; height: 84px; margin: 14px -4px 4px; }
.bal-chart svg { width: 100%; height: 100%; overflow: visible; }
.bal-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%);
  box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
.bal-axis { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.8); }
.bal-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.16); }
.bal-stat { display: flex; align-items: center; gap: 10px; }
.bal-stat + .bal-stat { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.16); }
.bal-stat .bi { width: 36px; height: 36px; border-radius: var(--r-sm); background: rgba(255,255,255,.14); display: grid; place-items: center; }
.bal-stat .bi .ic { width: 18px; height: 18px; }
.bal-stat small { display: block; font-size: 12px; color: rgba(255,255,255,.82); }
.bal-stat b { font-size: 16px; font-weight: 600; }

/* ---------- Budget ---------- */
.bud-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bud-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.bud-fig { margin-top: 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.bud-fig span { font-size: 15px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.bud-sub { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.meter { position: relative; margin-top: 18px; }
.meter-track { height: 12px; border-radius: var(--r-full); background: var(--surface-2); box-shadow: inset 0 1px 2px rgba(16,32,28,.06); overflow: hidden; }
.meter-fill { height: 100%; border-radius: inherit; background: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.meter-fill.warn { background: #D97706; }
.meter-fill.bad { background: var(--bad); }
.meter-pace { position: absolute; top: -4px; width: 2px; height: 20px; background: var(--text-3); border-radius: 2px; }
.meter-lbl { position: absolute; top: 22px; transform: translateX(-50%); font-size: 12px; color: var(--text-2); white-space: nowrap; font-weight: 500; }
.bud-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 36px; }
.mini { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.mini small { display: block; font-size: 13px; color: var(--text-2); }
.mini b { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

/* ---------- Category donut ---------- */
.cat-wrap { display: grid; grid-template-columns: 132px 1fr; gap: 20px; align-items: center; }
.donut { position: relative; width: 132px; height: 132px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c small { font-size: 12px; color: var(--text-2); }
.donut-c b { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.legend { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; min-width: 0; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; font-size: 14px; min-height: 26px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .nm { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .v { font-weight: 600; }
.cat-bar { display: flex; height: 8px; border-radius: var(--r-full); overflow: hidden; gap: 2px; margin-top: 20px; }

/* ---------- Lists ---------- */
.list { padding: 4px 0; }
.row { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 16px;
  position: relative; transition: background-color .15s ease-out; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 72px; right: 16px; border-top: 1px solid var(--line); }
@media (hover: hover) { button.row:hover { background: var(--surface-2); } }
button.row:active { background: #EDF1EF; }
.chip { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 13%, var(--surface)); font-size: 22px; line-height: 1; }
.chip img { width: 26px; height: 26px; }
.row-main { min-width: 0; display: grid; }
.row-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
.amt.pos { color: var(--ok); }
.amt small { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }

.day { margin-top: 20px; }
.day-h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 4px 8px; }

/* Budget rows */
.brow { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 8px; align-items: center;
  width: 100%; padding: 14px 16px; position: relative; transition: background-color .15s ease-out; }
.brow + .brow::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; border-top: 1px solid var(--line); }
@media (hover: hover) { .brow:hover { background: var(--surface-2); } }
.brow .chip { grid-row: span 2; }
.brow .bar { grid-column: 2 / 4; height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; }
.brow .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); }

/* ---------- Forms & filters ---------- */
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px;
  transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.search .input { padding-left: 42px; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,122,90,.14); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.fchip { height: 36px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none; transition: background-color .15s ease-out, color .15s ease-out; }
.fchip[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
@media (hover: hover) { .fchip:not([aria-pressed="true"]):hover { background: var(--surface-2); } }
.fchip img { width: 18px; height: 18px; }
.summary-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--text-2); margin-top: 16px; padding: 0 4px; }
.summary-line b { color: var(--text); font-weight: 600; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 616px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; height: 68px; padding: 0 6px; border-radius: 24px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: var(--sh-float); border: 1px solid rgba(16,32,28,.05); }
.tab { display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--text-2); min-height: 52px; align-content: center; border-radius: 16px; transition: color .15s ease-out; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 600; }
.tab .ic { width: 22px; height: 22px; }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px -6px rgba(13,122,90,.7); transition: transform .15s ease-out; }
.tab-add:active { transform: scale(.94); }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.2; }

/* ---------- Sheet ---------- */
dialog.sheet { width: 100%; max-width: 520px; margin: auto auto 0; border: 0; padding: 0; border-radius: 24px 24px 0 0; background: var(--surface); color: var(--text);
  box-shadow: 0 -10px 40px -10px rgba(16,32,28,.3); max-height: 92dvh; overflow: auto; }
dialog.sheet[open] { animation: up .28s cubic-bezier(.2,.8,.2,1); }
dialog::backdrop { background: rgba(10,22,18,.42); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-in { padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 8px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-h h2 { font-size: 20px; letter-spacing: -0.01em; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); background: var(--surface-2); }
@media (hover: hover) { .icon-btn:hover { color: var(--text); background: #E9EEEC; } }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: var(--r-full); padding: 4px; margin-bottom: 16px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: grid; place-items: center; height: 40px; border-radius: var(--r-full); font-weight: 600; font-size: 15px; color: var(--text-2); transition: background-color .15s, color .15s; cursor: pointer; }
.seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16,32,28,.08), 0 2px 8px -2px rgba(16,32,28,.1); }
.seg input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.amount-field { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 12px 0 4px; }
.amount-field span { font-size: 32px; font-weight: 600; color: var(--text-3); }
.amount-field input { width: 100%; text-align: center !important; border: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; text-align: left; padding: 0; background: none; font-variant-numeric: tabular-nums; }
.amount-field input:focus { outline: none; }
.amount-field input::placeholder { color: var(--text-3); }
.amount-line { height: 2px; width: 160px; margin: 0 auto 16px; border-radius: 2px; background: var(--line); transition: background-color .15s; }
.amount-field:focus-within + .amount-line { background: var(--brand); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span, .legend-t { font-size: 14px; font-weight: 600; }
.err { font-size: 13px; color: var(--bad); font-weight: 500; min-height: 0; }
.err:empty { display: none; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.cat-opt { position: relative; }
.cat-opt input { position: absolute; opacity: 0; inset: 0; }
.cat-opt span { display: grid; justify-items: center; gap: 4px; padding: 10px 2px 8px; border-radius: 14px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: border-color .15s, background-color .15s, color .15s; text-align: center; }
.cat-opt img { width: 26px; height: 26px; }
.cat-opt .fb { font-size: 22px; line-height: 26px; }
.cat-opt input:checked + span { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-deep); font-weight: 600; }
.cat-opt input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.sheet-actions { display: grid; gap: 10px; margin-top: 8px; }

/* ---------- Settings ---------- */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row p { font-size: 14px; color: var(--text-2); }
.set-row h3 { font-size: 15px; }

/* ---------- Empty state & toast ---------- */
.empty { text-align: center; padding: 32px 20px; display: grid; justify-items: center; gap: 6px; }
.empty img, .empty .fb { width: 88px; height: 88px; font-size: 64px; line-height: 88px; margin-bottom: 8px; }
.empty h3 { font-size: 17px; }
.empty p { font-size: 14px; color: var(--text-2); max-width: 32ch; margin-bottom: 10px; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: #fff; padding: 12px 18px; border-radius: var(--r-full); font-size: 14px; font-weight: 500; box-shadow: var(--sh-float);
  transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.ov { display: grid; gap: 16px; }
.ov-col { display: grid; gap: 16px; align-content: start; }

/* ---------- Desktop ---------- */
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 252px minmax(0,1fr); }
  .sidebar { display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; padding: 24px 16px; background: var(--surface); border-right: 1px solid var(--line); }
  .sidebar .brand { padding: 0 8px; margin-bottom: 28px; }
  .nav { display: grid; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; font-weight: 500; font-size: 15px;
    transition: background-color .15s, color .15s; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }

<script>
(() => {
const KEY = 'penny.v1';
const CATS = {
  groceries:     { name: 'Groceries',     e: '🛒', c: '#0D9488' },
  dining:        { name: 'Dining out',    e: '🍔', c: '#F59E0B' },
  transport:     { name: 'Transport',     e: '🚗', c: '#3B82F6' },
  shopping:      { name: 'Shopping',      e: '🛍️', c: '#DB2777' },
  housing:       { name: 'Rent',          e: '🏠', c: '#7C3AED' },
  bills:         { name: 'Bills',         e: '🧾', c: '#64748B' },
  entertainment: { name: 'Entertainment', e: '🎬', c: '#EA580C' },
  health:        { name: 'Health',        e: '💊', c: '#E11D48' },
  income:        { name: 'Income',        e: '💰', c: '#15803D' },
};
const EXP = Object.keys(CATS).filter(k => k !== 'income');

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const uid = () => Math.random().toString(36).slice(2, 10);
const cur = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const cur0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money = (n, sign) => (sign && n > 0 ? '+' : n < 0 ? '−' : '') + cur.format(Math.abs(n));
const money0 = n => (n < 0 ? '−' : '') + cur0.format(Math.abs(n));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const e3d = e => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' + [...e].map(c => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e, s = 26) => `<img src="${e3d(e)}" alt="" width="${s}" height="${s}" loading="lazy" data-e="${e}" onerror="const s=document.createElement('span');s.className='fb';s.textContent=this.dataset.e;this.replaceWith(s)">`;
const MERCH = { 'Starbucks': '☕', 'Chipotle': '🌯', 'DoorDash': '🥡', 'Uber Eats': '🥡', 'Sweetgreen': '🥗', 'Panera Bread': '🥪', 'Uber': '🚕', 'Lyft': '🚕', 'Shell': '⛽', 'Chevron': '⛽', 'Amazon': '📦', 'The Home Depot': '🔨', 'Barnes & Noble': '📚', 'AMC Theatres': '🎬', 'CVS Pharmacy': '💊', 'Walgreens': '💊' };
const chip = (cat, e) => `<span class="chip" style="--c:${CATS[cat].c}" aria-hidden="true">${emo(e || CATS[cat].e)}</span>`;
const fmtDay = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const dayLabel = s => { const d = parse(s), t = today(); const diff = Math.round((t - d) / 864e5);
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : fmtDay(d); };
const sortTx = a => a.sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time));
const ic = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ---------- sample data ---------- */
function sample() {
  const t = today();
  const txns = [];
  const add = (d, merchant, cat, amount, time, e) => { if (d <= t) txns.push({ id: uid(), date: iso(d), time, merchant, cat, amount, ...(e ? { e } : {}) }); };
  const recurring = [
    { name: 'Rent payment', cat: 'housing', amount: -1650, dom: 1, e: '🏠', time: '09:02' },
    { name: 'Verizon Wireless', cat: 'bills', amount: -65, dom: 3, e: '📱', time: '06:14' },
    { name: 'Netflix', cat: 'entertainment', amount: -15.49, dom: 6, e: '🍿', time: '04:31' },
    { name: 'Con Edison', cat: 'bills', amount: -84.37, dom: 9, e: '💡', time: '07:48' },
    { name: 'Spotify', cat: 'entertainment', amount: -11.99, dom: 12, e: '🎧', time: '05:03' },
    { name: 'Xfinity Internet', cat: 'bills', amount: -70, dom: 18, e: '🌐', time: '06:40' },
    { name: 'State Farm Insurance', cat: 'bills', amount: -128.5, dom: 22, e: '🛡️', time: '10:17' },
    { name: 'Planet Fitness', cat: 'health', amount: -24.99, dom: 26, e: '🏋️', time: '05:55' },
  ];
  for (let m = -2; m <= 0; m++) {
    for (const r of recurring) add(new Date(t.getFullYear(), t.getMonth() + m, r.dom), r.name, r.cat, r.amount, r.time, r.e);
    for (const dom of [1, 15]) add(new Date(t.getFullYear(), t.getMonth() + m, dom), 'Paycheck', 'income', 2840, '06:05');
  }
  const recent = [
    [0, 'Starbucks', 'dining', -6.45, '08:12'], [0, 'Uber', 'transport', -14.2, '07:41'],
    [1, 'Whole Foods Market', 'groceries', -84.32, '18:22'], [2, 'Chipotle', 'dining', -12.85, '12:48'],
    [2, 'Amazon', 'shopping', -39.99, '21:05'], [3, 'Shell', 'transport', -48.1, '17:30'],
    [3, 'DoorDash', 'dining', -42.6, '19:55'], [4, "Trader Joe's", 'groceries', -61.27, '11:14'],
    [4, 'AMC Theatres', 'entertainment', -28.5, '20:10'], [5, 'CVS Pharmacy', 'health', -18.74, '09:36'],
    [6, 'Target', 'shopping', -72.48, '14:02'], [6, 'Starbucks', 'dining', -5.95, '08:20'],
    [7, 'Costco', 'groceries', -146.9, '10:45'], [8, 'Uber Eats', 'dining', -31.4, '20:31'],
    [9, 'Lyft', 'transport', -18.6, '23:12'], [9, 'Starbucks', 'dining', -5.45, '08:05'],
    [10, 'Kroger', 'groceries', -54.12, '17:50'], [10, 'Sweetgreen', 'dining', -15.25, '12:30'],
    [11, 'Chevron', 'transport', -44.3, '08:44'], [11, 'Shake Shack', 'dining', -23.15, '19:02'],
    [12, 'The Home Depot', 'shopping', -64.2, '15:18'], [13, 'Barnes & Noble', 'entertainment', -22.4, '16:40'],
    [13, 'Starbucks', 'dining', -6.45, '08:10'], [14, 'Whole Foods Market', 'groceries', -96.18, '18:05'],
  ];
  for (const [d, m, c, a, tm] of recent) add(addDays(t, -d), m, c, a, tm);
  const cycle = [['Whole Foods Market', 'groceries', -78.4], ['Starbucks', 'dining', -5.95], ['Shell', 'transport', -46.2], ['Amazon', 'shopping', -27.99],
    ['Chipotle', 'dining', -13.1], ["Trader Joe's", 'groceries', -58.6], ['Target', 'shopping', -41.3], ['Lyft', 'transport', -16.8],
    ['DoorDash', 'dining', -34.75], ['Walgreens', 'health', -12.49], ['Kroger', 'groceries', -66.05], ['Panera Bread', 'dining', -14.6]];
  for (let i = 0, d = 15; d <= 62; i++, d += (i % 3 === 0 ? 2 : 1)) {
    const [m, c, a] = cycle[i % cycle.length];
    const k = 1 + (((i * 37) % 21) - 10) / 100;
    add(addDays(t, -d), m, c, Math.round(a * k * 100) / 100, `${pad(8 + (i * 5) % 13)}:${pad((i * 17) % 60)}`);
  }
  const sum = txns.reduce((s, x) => s + x.amount, 0);
  return {
    name: 'Sam', opening: Math.round((8412.36 - sum) * 100) / 100, txns: sortTx(txns), recurring,
    budgets: { groceries: 600, dining: 280, transport: 220, shopping: 250, housing: 1650, bills: 380, entertainment: 90, health: 120 },
  };
}
const blank = () => ({ name: 'Sam', opening: 0, txns: [], recurring: [], budgets: { groceries: 600, dining: 280, transport: 220, shopping: 250, housing: 1650, bills: 380, entertainment: 90, health: 120 } });

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.txns)) S = sample();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
save();

/* ---------- derived ---------- */
function stats() {
  const t = today(), ym = iso(t).slice(0, 7);
  const month = S.txns.filter(x => x.date.startsWith(ym));
  const spent = -month.filter(x => x.amount < 0).reduce((s, x) => s + x.amount, 0);
  const income = month.filter(x => x.amount > 0).reduce((s, x) => s + x.amount, 0);
  const balance = S.opening + S.txns.reduce((s, x) => s + x.amount, 0);
  const byCat = {};
  for (const x of month) if (x.amount < 0) byCat[x.cat] = (byCat[x.cat] || 0) - x.amount;
  const budget = EXP.reduce((s, k) => s + (S.budgets[k] || 0), 0);
  const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  const day = t.getDate();
  return { t, month, spent, income, balance, byCat, budget, dim, day, left: budget - spent, daysLeft: dim - day + 1,
    monthName: t.toLocaleDateString('en-US', { month: 'long' }) };
}

/* ---------- components ---------- */
function bigMoney(n) {
  const s = cur.format(Math.abs(n)); const i = s.lastIndexOf('.');
  return `${n < 0 ? '−' : ''}${s.slice(0, i)}<span class="cents">${s.slice(i)}</span>`;
}

function balanceCard(st) {
  const days = Math.max(st.day, 2), pts = [];
  const sorted = [...S.txns].sort((a, b) => a.date.localeCompare(b.date));
  for (let i = days - 1; i >= 0; i--) {
    const d = iso(addDays(st.t, -i));
    pts.push(S.opening + sorted.filter(x => x.date <= d).reduce((s, x) => s + x.amount, 0));
  }
  const lo = Math.min(...pts), hi = Math.max(...pts), r0 = hi - lo || 1;
  const min = lo - r0 * .45, max = hi + r0 * .1, span = max - min;
  const W = 300, H = 100;
  const xy = pts.map((v, i) => [i / (days - 1) * W, 8 + (1 - (v - min) / span) * (H - 16)]);
  let d = `M${xy[0][0]},${xy[0][1]}`;
  for (let i = 1; i < xy.length; i++) {
    const p0 = xy[i - 2] || xy[i - 1], p1 = xy[i - 1], p2 = xy[i], p3 = xy[i + 1] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const last = xy[xy.length - 1];
  const net = st.income - st.spent;
  const start = addDays(st.t, -(days - 1)), mid = addDays(st.t, -Math.floor((days - 1) / 2));
  const md = x => x.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `<section class="balance" aria-labelledby="balLbl">
    <div class="bal-top">
      <div><p class="bal-label" id="balLbl">Total balance</p><p class="bal-fig num">${bigMoney(st.balance)}</p>
      <span class="pill bal-pill num">${ic(net >= 0 ? 'up' : 'down')}${net >= 0 ? '+' : ''}${money0(net)} net</span></div>
      <span class="bal-acct">This month</span>
    </div>
    <div class="bal-chart" role="img" aria-label="Balance this month, from ${money0(pts[0])} to ${money0(pts[pts.length - 1])}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="balFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 ${H * .33}H${W}M0 ${H * .66}H${W}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
        <path d="${d} L${W},${H} L0,${H}Z" fill="url(#balFill)"/>
        <path d="${d}" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="bal-dot" style="left:${last[0] / W * 100}%;top:${last[1] / H * 100}%"></span>
    </div>
    <div class="bal-axis num" aria-hidden="true"><span>${md(start)}</span><span>${md(mid)}</span><span>Today</span></div>
    <div class="bal-stats">
      <div class="bal-stat"><span class="bi">${ic('down')}</span><span><small>Income</small><b class="num">${money0(st.income)}</b></span></div>
      <div class="bal-stat"><span class="bi">${ic('up')}</span><span><small>Spent</small><b class="num">${money0(st.spent)}</b></span></div>
    </div>
  </section>`;
}

function budgetCard(st) {
  const pct = st.budget ? Math.min(st.spent / st.budget, 1) : 0;
  const pace = st.day / st.dim;
  const over = st.left < 0;
  const ahead = st.spent / (st.budget || 1) > pace + 0.05;
  const cls = over ? 'bad' : ahead ? 'warn' : '';
  const status = over ? `<span class="pill bad"><span class="dot"></span>Over budget</span>`
    : ahead ? `<span class="pill warn"><span class="dot"></span>Spending fast</span>`
    : `<span class="pill ok"><span class="dot"></span>On track</span>`;
  const due = S.recurring.filter(r => r.amount < 0 && r.dom > st.day && r.dom <= st.dim).reduce((s, r) => s - r.amount, 0);
  const perDay = Math.max(st.left - due, 0) / st.daysLeft;
  return `<section class="card pad" aria-labelledby="budH">
    <div class="bud-head"><h2 id="budH">${st.monthName} budget</h2>${status}</div>
    <p class="bud-fig num">${money0(Math.abs(st.left))} <span>${over ? 'over' : 'left'} of ${money0(st.budget)}</span></p>
    <p class="bud-sub">${Math.round(pct * 100)}% spent · ${st.daysLeft} ${st.daysLeft === 1 ? 'day' : 'days'} to go</p>
    <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${st.budget}" aria-valuenow="${Math.round(st.spent)}" aria-label="Budget spent">
      <div class="meter-track"><div class="meter-fill ${cls}" style="width:${pct * 100}%"></div></div>
      <div class="meter-pace" style="left:calc(${pace * 100}% - 1px)"></div>
      <span class="meter-lbl" style="left:${pace * 100}%">Today</span>
    </div>
    <div class="bud-grid">
      <div class="mini"><small>Safe to spend</small><b class="num">${money0(perDay)}<span style="font-size:13px;font-weight:500;color:var(--text-2)"> /day</span></b></div>
      <div class="mini"><small>Bills still due</small><b class="num">${money0(due)}</b></div>
    </div>
  </section>`;
}

function categoryCard(st, link = true) {
  const entries = Object.entries(st.byCat).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return `<section class="card pad"><div class="sec-h"><h2>Spending by category</h2></div>${emptyBlock('📊', 'No spending yet', `Expenses you add in ${st.monthName} show up here by category.`)}</section>`;
  const top = entries.slice(0, 6);
  const rest = entries.slice(6).reduce((s, [, v]) => s + v, 0);
  if (rest > 0) top.push(['other', rest]);
  const color = k => k === 'other' ? '#CBD5D1' : CATS[k].c;
  const name = k => k === 'other' ? 'Other' : CATS[k].name;
  const C = 2 * Math.PI * 42, gap = top.length > 1 ? 2.5 : 0;
  let off = 0;
  const segs = top.map(([k, v]) => {
    const len = v / st.spent * C;
    const s = `<circle cx="50" cy="50" r="42" fill="none" stroke="${color(k)}" stroke-width="13" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len; return s;
  }).join('');
  return `<section class="card pad" aria-labelledby="catH">
    <div class="sec-h"><h2 id="catH">Spending by category</h2>${link ? `<a class="link" href="#/budget">See all${ic('chev')}</a>` : ''}</div>
    <div class="cat-wrap">
      <div class="donut" role="img" aria-label="${esc(name(top[0][0]))} is the largest category at ${Math.round(top[0][1] / st.spent * 100)}% of ${money0(st.spent)} spent">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="13"/>${segs}</svg>
        <div class="donut-c"><small>Spent</small><b class="num">${money0(st.spent)}</b></div>
      </div>
      <ul class="legend">${top.map(([k, v]) => `<li><span class="sw" style="background:${color(k)}"></span><span class="nm">${name(k)}</span><span class="v num">${money0(v)}</span></li>`).join('')}</ul>
    </div>
  </section>`;
}

function txRow(x) {
  const c = CATS[x.cat] || CATS.shopping;
  return `<button class="row" data-tx="${x.id}" aria-label="${esc(x.merchant)}, ${money(x.amount, true)}, ${dayLabel(x.date)}">
    ${chip(x.cat in CATS ? x.cat : 'shopping', x.e || MERCH[x.merchant])}
    <span class="row-main"><span class="row-name">${esc(x.merchant)}</span><span class="row-sub">${c.name} · ${fmtTime(x.time)}</span></span>
    <span class="amt num ${x.amount > 0 ? 'pos' : ''}">${money(x.amount, true)}</span>
  </button>`;
}

function recentCard(n) {
  const rows = S.txns.slice(0, n);
  return `<section aria-labelledby="recH">
    <div class="sec-h"><h2 id="recH">Recent transactions</h2>${rows.length ? `<a class="link" href="#/activity">See all${ic('chev')}</a>` : ''}</div>
    <div class="card list">${rows.length ? rows.map(txRow).join('') : emptyBlock('🧾', 'No transactions yet', 'Add your first expense or paycheck to start tracking your balance.', true)}</div>
  </section>`;
}

function upcoming(st) {
  const t = st.t;
  const list = S.recurring.filter(r => r.amount < 0).map(r => {
    let d = new Date(t.getFullYear(), t.getMonth(), r.dom);
    if (d <= t) d = new Date(t.getFullYear(), t.getMonth() + 1, r.dom);
    return { ...r, d, days: Math.round((d - t) / 864e5) };
  }).sort((a, b) => a.d - b.d).slice(0, 3);
  if (!list.length) return '';
  const total = list.reduce((s, r) => s - r.amount, 0);
  return `<section aria-labelledby="upH">
    <div class="sec-h"><h2 id="upH">Upcoming bills</h2><span class="pill neutral num">${money0(total)} due</span></div>
    <div class="card list">${list.map(r => `<div class="row">${chip(r.cat, r.e)}
      <span class="row-main"><span class="row-name">${esc(r.name)}</span><span class="row-sub">${fmtDay(r.d)}</span></span>
      <span class="amt num">${money(r.amount)}<small>${r.days === 1 ? 'Tomorrow' : `In ${r.days} days`}</small></span></div>`).join('')}</div>
  </section>`;
}

function emptyBlock(e, h, p, action) {
  return `<div class="empty">${emo(e, 88)}<h3>${h}</h3><p>${p}</p>${action ? `<button class="btn" data-add>${ic('plus')}Add transaction</button>` : ''}</div>`;
}

/* ---------- views ---------- */
let filter = 'all', query = '';
const views = {
  overview(st) {
    const h = new Date().getHours();
    setHead(st.t.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }), `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, ${esc(S.name)}`);
    const wide = matchMedia('(min-width:1024px)').matches;
    if (wide) return `<div class="ov"><div class="ov-col">${balanceCard(st)}${recentCard(7)}</div><div class="ov-col">${budgetCard(st)}${categoryCard(st)}${upcoming(st)}</div></div>`;
    return `<div class="ov">${balanceCard(st)}${budgetCard(st)}${categoryCard(st)}${recentCard(5)}${upcoming(st)}</div>`;
  },
  activity(st) {
    setHead('All transactions', 'Activity');
    const cats = [...new Set(S.txns.map(x => x.cat))].sort((a, b) => Object.keys(CATS).indexOf(a) - Object.keys(CATS).indexOf(b));
    const q = query.toLowerCase();
    const rows = S.txns.filter(x => (filter === 'all' || x.cat === filter) && (!q || x.merchant.toLowerCase().includes(q) || CATS[x.cat]?.name.toLowerCase().includes(q)));
    const groups = [];
    for (const x of rows) { const g = groups[groups.length - 1]; if (g && g.date === x.date) g.items.push(x); else groups.push({ date: x.date, items: [x] }); }
    const total = rows.reduce((s, x) => s + x.amount, 0);
    const list = !S.txns.length ? `<div class="card" style="margin-top:20px">${emptyBlock('🧾', 'No transactions yet', 'Add your first expense or paycheck to start tracking your balance.', true)}</div>`
      : !rows.length ? `<div class="card" style="margin-top:20px">${emptyBlock('🔍', 'No matches', 'Try a different search or category.')}</div>`
      : groups.map(g => { const net = g.items.reduce((s, x) => s + x.amount, 0);
          return `<section class="day"><h2 class="day-h"><span>${dayLabel(g.date)}</span><span class="num">${money(net, true)}</span></h2><div class="card list">${g.items.map(txRow).join('')}</div></section>`; }).join('');
    const inc = rows.filter(x => x.amount > 0).reduce((s, x) => s + x.amount, 0), out = rows.filter(x => x.amount < 0).reduce((s, x) => s + x.amount, 0);
    return `<div class="tx-layout"><div>
      <div class="search"><label class="sr-only" for="q">Search transactions</label>${ic('search')}<input class="input" id="q" type="search" placeholder="Search merchant or category" value="${esc(query)}" autocomplete="off"></div>
      <div class="filters" role="group" aria-label="Filter by category">
        <button class="fchip" data-filter="all" aria-pressed="${filter === 'all'}">All</button>
        ${cats.map(k => `<button class="fchip" data-filter="${k}" aria-pressed="${filter === k}">${emo(CATS[k].e, 18)}${CATS[k].name}</button>`).join('')}
      </div>
      ${rows.length ? `<p class="summary-line"><span>${rows.length} ${rows.length === 1 ? 'transaction' : 'transactions'}</span><span>In <b class="num" style="color:var(--ok)">${money0(inc)}</b> · Out <b class="num">${money0(-out)}</b></span></p>` : ''}
      ${list}
    </div>
    <aside class="tx-side card pad" aria-label="Totals for shown transactions">
      <div class="sec-h"><h2>Totals</h2></div>
      <div class="stack">
        <div class="mini"><small>Money in</small><b class="num" style="color:var(--ok)">${money(inc, true)}</b></div>
        <div class="mini"><small>Money out</small><b class="num">${money(out)}</b></div>
        <div class="mini"><small>Average expense</small><b class="num">${money(rows.filter(x => x.amount < 0).length ? out / rows.filter(x => x.amount < 0).length : 0)}</b></div>
      </div>
    </aside></div>`;
  },
  budget(st) {
    setHead(`${st.monthName} ${st.t.getFullYear()}`, 'Budget');
    const rows = EXP.map(k => ({ k, spent: st.byCat[k] || 0, limit: S.budgets[k] || 0 })).sort((a, b) => (b.limit ? b.spent / b.limit : 0) - (a.limit ? a.spent / a.limit : 0));
    const wide = matchMedia('(min-width:1024px)').matches;
    return `<div class="bud-layout"><div class="stack">${budgetCard(st)}${wide ? categoryCard(st, false) + upcoming(st) : ''}</div>
      <section aria-labelledby="bcH"><div class="sec-h"><h2 id="bcH">Category budgets</h2></div>
      <div class="card list">${rows.map(r => {
        const p = r.limit ? r.spent / r.limit : 0;
        const pill = r.spent > r.limit ? `<span class="pill bad num">${money0(r.spent - r.limit)} over</span>` : p >= 1 ? `<span class="pill neutral">Fully used</span>` : p >= .85 ? `<span class="pill warn num">${Math.round(p * 100)}%</span>` : `<span class="pill neutral num">${Math.round(p * 100)}%</span>`;
        return `<button class="brow" data-budget="${r.k}" style="--c:${CATS[r.k].c}" aria-label="${CATS[r.k].name}: ${money0(r.spent)} of ${money0(r.limit)}. Edit budget">
          ${chip(r.k)}<span class="row-main"><span class="row-name">${CATS[r.k].name}</span><span class="row-sub num">${money0(r.spent)} of ${money0(r.limit)}</span></span>${pill}
          <span class="bar"><i style="width:${Math.min(p, 1) * 100}%;background:${r.spent > r.limit ? 'var(--bad)' : p >= .85 && p < 1 ? '#D97706' : 'var(--brand)'}"></i></span></button>`; }).join('')}</div></section>${wide ? '' : upcoming(st)}</div>`;
  },
  settings() {
    setHead('Preferences and data', 'Settings');
    return `<div class="stack" style="max-width:640px">
      <section class="card pad" aria-labelledby="pH"><div class="sec-h"><h2 id="pH">Profile</h2></div>
        <label class="field" style="margin:0"><span>Your name</span><input class="input" id="fName" value="${esc(S.name)}" maxlength="24" autocomplete="given-name"></label></section>
      <section class="card" aria-labelledby="dH"><div class="set-row"><h2 id="dH" style="font-size:18px">Data</h2></div>
        <div class="set-row"><div><h3>Restore sample data</h3><p>Replace everything with example transactions and bills.</p></div><button class="btn ghost" id="restore">Restore</button></div>
        <div class="set-row"><div><h3>Clear all data</h3><p>Delete every transaction, bill and balance. Budgets are kept.</p></div><button class="btn danger" id="clear">Clear</button></div>
        <div class="set-row"><div><h3>Storage</h3><p>Everything is saved in this browser only. Amounts are in US dollars.</p></div></div>
      </section></div>`;
  },
};

function setHead(eyebrow, title) { $('#eyebrow').textContent = eyebrow; $('#title').innerHTML = title; }

function route() { const r = location.hash.replace('#/', '') || 'overview'; return views[r] ? r : 'overview'; }

function render() {
  const st = stats(), r = route();
  $('#view').innerHTML = views[r](st);
  document.title = (r === 'overview' ? 'Home' : $('#title').textContent) + ' – Penny';
  document.querySelectorAll('[data-route]').forEach(a => a.dataset.route === r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const av = `<img src="https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(S.name)}&backgroundColor=dcefe7" alt="" width="44" height="44" onerror="this.replaceWith(document.createTextNode('${esc(S.name.charAt(0).toUpperCase())}'))">`;
  document.querySelectorAll('[data-avatar]').forEach(el => { if (el.dataset.seed !== S.name) { el.innerHTML = av; el.dataset.seed = S.name; } });
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = S.name);
}

/* ---------- toast ---------- */
let tt;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------- transaction sheet ---------- */
const txSheet = $('#txSheet'), form = $('#txForm');
$('#catGrid').innerHTML = EXP.map((k, i) => `<label class="cat-opt"><input type="radio" name="cat" value="${k}" ${i === 0 ? 'checked' : ''}><span>${emo(CATS[k].e)}${CATS[k].name}</span></label>`).join('');
let editing = null;
function syncKind() { $('#catSet').hidden = form.kind.value === 'income'; }
form.querySelectorAll('[name=kind]').forEach(r => r.addEventListener('change', syncKind));
$('#fAmount').addEventListener('blur', e => { const v = parseFloat(e.target.value.replace(/[$,\s]/g, '')); if (v > 0) e.target.value = '$' + v.toFixed(2); });
$('#fAmount').addEventListener('input', e => { const v = e.target.value.replace(/[^0-9.,]/g, ''); e.target.value = v ? '$' + v : ''; });
function openTx(id) {
  editing = id ? S.txns.find(x => x.id === id) : null;
  form.reset(); ['eAmount', 'eMerchant'].forEach(i => $('#' + i).textContent = '');
  $('#fAmount').removeAttribute('aria-invalid'); $('#fMerchant').removeAttribute('aria-invalid');
  $('#txTitle').textContent = editing ? 'Edit transaction' : 'Add transaction';
  $('#txSave').textContent = editing ? 'Save changes' : 'Add transaction';
  $('#txDelete').hidden = !editing;
  $('#fDate').value = editing ? editing.date : iso(today());
  $('#fDate').max = iso(today());
  if (editing) {
    form.kind.value = editing.amount > 0 ? 'income' : 'expense';
    $('#fAmount').value = '$' + Math.abs(editing.amount).toFixed(2);
    $('#fMerchant').value = editing.merchant;
    if (editing.amount < 0) form.cat.value = editing.cat;
  }
  syncKind();
  txSheet.showModal();
  if (!editing) setTimeout(() => $('#fAmount').focus(), 50);
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const amt = parseFloat($('#fAmount').value.replace(/[$,\s]/g, ''));
  const merchant = $('#fMerchant').value.trim();
  let ok = true;
  if (!(amt > 0) || amt > 1e7) { $('#eAmount').textContent = 'Enter an amount greater than $0.'; $('#fAmount').setAttribute('aria-invalid', 'true'); ok = false; }
  else { $('#eAmount').textContent = ''; $('#fAmount').removeAttribute('aria-invalid'); }
  if (!merchant) { $('#eMerchant').textContent = 'Add a short description, like the store name.'; $('#fMerchant').setAttribute('aria-invalid', 'true'); ok = false; }
  else { $('#eMerchant').textContent = ''; $('#fMerchant').removeAttribute('aria-invalid'); }
  if (!ok) { (amt > 0 ? $('#fMerchant') : $('#fAmount')).focus(); return; }
  const income = form.kind.value === 'income';
  const date = $('#fDate').value || iso(today());
  const rec = { merchant, cat: income ? 'income' : form.cat.value, amount: Math.round((income ? amt : -amt) * 100) / 100, date };
  if (editing) { if (editing.cat !== rec.cat) delete editing.e; Object.assign(editing, rec); }
  else { const n = new Date(); S.txns.push({ id: uid(), time: `${pad(n.getHours())}:${pad(n.getMinutes())}`, ...rec }); }
  sortTx(S.txns); save(); txSheet.close(); render();
  toast(editing ? 'Transaction updated' : 'Transaction added');
});
$('#txDelete').addEventListener('click', () => {
  if (!editing) return;
  S.txns = S.txns.filter(x => x !== editing); save(); txSheet.close(); render(); toast('Transaction deleted');
});

/* ---------- budget sheet ---------- */
const budSheet = $('#budSheet'); let budCat = null;
function openBudget(k) {
  budCat = k; const st = stats();
  $('#budTitle').textContent = `${CATS[k].name} budget`;
  $('#fLimit').value = S.budgets[k] || ''; $('#eLimit').textContent = '';
  $('#budHint').textContent = `${money0(st.byCat[k] || 0)} spent so far in ${st.monthName}.`;
  budSheet.showModal(); setTimeout(() => $('#fLimit').select(), 50);
}
$('#budForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = parseFloat($('#fLimit').value.replace(/[$,\s]/g, ''));
  if (!(v >= 0) || v > 1e7) { $('#eLimit').textContent = 'Enter a monthly amount, like 300.'; $('#fLimit').focus(); return; }
  S.budgets[budCat] = Math.round(v); save(); budSheet.close(); render(); toast(`${CATS[budCat].name} budget saved`);
});

/* close on backdrop click / close buttons */
for (const d of [txSheet, budSheet]) {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
}

/* ---------- delegated events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-tx],[data-budget],[data-filter],#restore,#clear');
  if (!t) return;
  if (t.matches('[data-add]')) openTx();
  else if (t.dataset.tx) openTx(t.dataset.tx);
  else if (t.dataset.budget) openBudget(t.dataset.budget);
  else if (t.dataset.filter) { filter = t.dataset.filter; render(); document.querySelector(`[data-filter="${filter}"]`)?.focus(); }
  else if (t.id === 'restore') { const n = S.name; S = sample(); S.name = n; save(); render(); toast('Sample data restored'); }
  else if (t.id === 'clear') {
    if (t.dataset.armed) { const b = S.budgets, n = S.name; S = blank(); S.budgets = b; S.name = n; save(); render(); toast('All data cleared'); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap to confirm'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Clear'; } }, 3000); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'fName') { S.name = e.target.value.trim() || 'Sam'; save(); document.querySelectorAll('[data-name]').forEach(el => el.textContent = S.name); }
});
document.addEventListener('change', e => { if (e.target.id === 'fName') render(); });
addEventListener('hashchange', () => { scrollTo(0, 0); render(); });
let wasWide = matchMedia('(min-width:1024px)').matches;
addEventListener('resize', () => { const w = matchMedia('(min-width:1024px)').matches; if (w !== wasWide) { wasWide = w; render(); } });
render();
})();
</script>
</body>
</html>
