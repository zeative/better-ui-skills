<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady">
<title>Steady · Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — pale lilac canvas, white cards, violet brand, soft category tints with 3D item icons */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F3F2FA; --surface: #FFFFFF; --surface-2: #F6F5FB; --line: #ECEAF4;
  --text: #16142B; --text-2: #625F7A; --text-3: #9895AD;
  --brand: #6A4DF4; --brand-2: #8B6CFF; --brand-tint: #EFEBFF; --brand-ink: #4B32C9; --on-brand: #FFFFFF;
  --ok: #15803D; --ok-tint: #E7F6EC; --warn: #B45309; --warn-tint: #FEF3E2; --bad: #D92D20; --bad-tint: #FDECEA;
  --flame: #F06A1D;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(30,22,70,.04), 0 6px 18px -10px rgba(30,22,70,.10);
  --sh-2: 0 1px 2px rgba(30,22,70,.05), 0 10px 24px -10px rgba(30,22,70,.16);
  --sh-float: 0 12px 32px -8px rgba(30,22,70,.20);
  --sh-brand: 0 1px 2px rgba(74,50,201,.2), 0 14px 28px -16px rgba(74,50,201,.45);
  --tab-h: 64px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); }
.view { display: none; }
.view.on { display: block; }
.stack { display: grid; gap: 20px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.top .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.top-actions { display: flex; gap: 8px; }
.round-btn { width: 44px; height: 44px; border-radius: var(--r-full); background: var(--surface); display: grid; place-items: center; box-shadow: var(--sh-1);
  color: var(--text); transition: transform .15s ease-out, box-shadow .15s ease-out; }
.round-btn:active { transform: scale(.94); }
@media (hover: hover) { .round-btn:hover { box-shadow: var(--sh-2); } }
.avatar { width: 44px; height: 44px; border-radius: var(--r-full); background: #FFE3CF; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #9A4A14; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: grid; justify-items: center; gap: 6px; padding: 10px 0 10px; border-radius: var(--r-md); background: transparent; color: var(--text-2);
  transition: background-color .15s ease-out, transform .15s ease-out; min-height: 44px; }
.day .dl { font-size: 12px; font-weight: 500; }
.day .dn { font-size: 15px; font-weight: 600; color: var(--text); width: 38px; height: 38px; display: grid; place-items: center; position: relative; }
.day .dn svg { position: absolute; inset: 0; width: 38px; height: 38px; transform: rotate(-90deg); }
.day .dn svg circle { fill: none; stroke-width: 3; }
.day .dn .bg { stroke: var(--line); }
.day .dn .fg { stroke: var(--brand); stroke-linecap: round; transition: stroke-dasharray .3s ease-out; }
.day .dn span { position: relative; }
@media (hover: hover) { .day:not(:disabled):not(.sel):hover { background: color-mix(in srgb, var(--surface) 70%, transparent); } }
.day:active:not(:disabled) { transform: scale(.96); }
.day.sel { background: var(--surface); box-shadow: var(--sh-1); color: var(--brand-ink); }
.day.sel .dl { color: var(--brand-ink); }
.day.today .dl::after { content: ""; }
.day:disabled { cursor: default; opacity: .45; }
.day.full .dn { color: var(--on-brand); }
.day.full .dn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--brand); }

/* Summary card */
.summary { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; color: var(--on-brand);
  background: radial-gradient(120% 140% at 100% 0%, var(--brand-2) 0%, var(--brand) 45%, #5636E0 100%); box-shadow: var(--sh-brand); }
.sum-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
.sum-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.82); }
.sum-fig { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.sum-fig small { font-size: 20px; font-weight: 600; color: rgba(255,255,255,.72); }
.sum-sub { font-size: 14px; color: rgba(255,255,255,.86); margin-top: 2px; }
.ring { width: 84px; height: 84px; position: relative; flex: none; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: rgba(255,255,255,.2); }
.ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dasharray .45s cubic-bezier(.2,.8,.2,1); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 600; }
.sum-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; position: relative; background: rgba(255,255,255,.12); border-radius: var(--r-md); }
.sum-stat { display: flex; align-items: center; gap: 10px; padding: 12px; white-space: nowrap; min-width: 0; }
.sum-stat + .sum-stat { border-left: 1px solid rgba(255,255,255,.16); }
.sum-stat .chip3d { width: 36px; height: 36px; border-radius: var(--r-sm); background: rgba(255,255,255,.18); font-size: 18px; }
.sum-stat .k { font-size: 12px; color: rgba(255,255,255,.82); line-height: 1.3; }
.sum-stat .v { font-size: 16px; font-weight: 600; line-height: 1.3; }

/* Section */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.sec-head .meta { font-size: 14px; color: var(--text-2); }
.link-btn { font-size: 14px; font-weight: 600; color: var(--brand-ink); padding: 10px 4px; margin: -10px -4px; border-radius: var(--r-xs); }
@media (hover: hover) { .link-btn:hover { color: var(--brand); } }

/* Habit list */
.list { display: grid; gap: 10px; }
.habit { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: var(--r-md); padding: 12px 12px 12px 12px; box-shadow: var(--sh-1);
  transition: box-shadow .15s ease-out, transform .15s ease-out; }
.habit-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: var(--r-sm); padding: 2px 0; }
@media (hover: hover) { .habit:hover { box-shadow: var(--sh-2); } }
.chip3d { width: 48px; height: 48px; flex: none; border-radius: var(--r-md); display: grid; place-items: center; background: color-mix(in srgb, var(--c, #8B6CFF) 16%, var(--surface)); font-size: 24px; line-height: 1; }
.chip3d img { width: 62%; height: 62%; object-fit: contain; }
.habit-text { min-width: 0; }
.habit-name { font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.habit-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); margin-top: 2px; white-space: nowrap; }
.habit-meta .fl { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-weight: 500; }
.habit-meta .fl b { color: var(--text); font-weight: 600; }
.habit-meta .fl svg { width: 14px; height: 14px; fill: var(--flame); stroke: none; }
.habit-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.check { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid #DAD7E8; color: transparent; background: var(--surface);
  transition: background-color .18s ease-out, border-color .18s ease-out, transform .18s ease-out, color .18s ease-out; }
.check svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .check:hover { border-color: var(--brand); color: color-mix(in srgb, var(--brand) 40%, transparent); } }
.check:active { transform: scale(.9); }
.check[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 14px -6px rgba(106,77,244,.7); }
.check.pop { animation: pop .32s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* Empty state */
.empty { background: var(--surface); border-radius: var(--r-lg); padding: 32px 24px; text-align: center; box-shadow: var(--sh-1); display: grid; justify-items: center; gap: 8px; }
.empty .art { width: 112px; height: 112px; border-radius: 32px; background: var(--brand-tint); display: grid; place-items: center; font-size: 56px; margin-bottom: 8px; }
.empty .art img { width: 76px; height: 76px; }
.empty h3 { font-size: 18px; font-weight: 600; }
.empty p { font-size: 14px; color: var(--text-2); max-width: 30ch; }
.empty .btn { margin-top: 12px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: var(--r-full); font-size: 15px; font-weight: 600;
  background: var(--brand); color: var(--on-brand); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(74,50,201,.3), 0 8px 18px -8px rgba(106,77,244,.7);
  transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { background: #5E40EA; } }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--text); box-shadow: none; }
@media (hover: hover) { .btn.ghost:hover { background: #ECEAF4; } }
.link-del { height: 44px; font-size: 15px; font-weight: 600; color: var(--bad); border-radius: var(--r-full); }
@media (hover: hover) { .link-del:hover { background: var(--bad-tint); } }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
@media (hover: hover) { .btn.danger:hover { background: #FAD9D5; } }
.btn svg { width: 20px; height: 20px; }

/* Cards (progress) */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-1); }
.card h2 { font-size: 16px; font-weight: 600; }
.card .card-sub { font-size: 13px; color: var(--text-2); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r-md); padding: 14px; box-shadow: var(--sh-1); display: grid; gap: 10px; align-content: start; }
.tile .ic-chip { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.tile .ic-chip svg { width: 20px; height: 20px; }
.tile .k { font-size: 12px; color: var(--text-2); line-height: 1.35; font-weight: 500; }
.tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }

/* Bar chart */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }
.pill.ok { background: var(--ok-tint); color: #136C34; }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.bars { position: relative; height: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; padding-top: 22px; }
.bars .grid { position: absolute; inset: 22px 0 26px 0; display: grid; grid-template-rows: repeat(2, 1fr); pointer-events: none; }
.bars .grid i { border-top: 1px dashed var(--line); }
.bars .grid i:last-child { border-bottom: 1px solid var(--line); }
.bar-col { display: grid; justify-items: center; gap: 8px; height: 100%; grid-template-rows: 1fr auto; position: relative; z-index: 1; }
.bar-wrap { width: 100%; max-width: 30px; height: 100%; display: flex; align-items: flex-end; position: relative; }
.bar { width: 100%; border-radius: 8px 8px 4px 4px; background: #DCD5FF; min-height: 4px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
.bar-col.cur .bar { background: var(--brand); }
.bar-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.bar-col.cur .bar-val { color: var(--brand-ink); }
.bar-col .bl { font-size: 12px; color: var(--text-2); font-weight: 500; height: 18px; }
.bar-col.cur .bl { color: var(--text); font-weight: 600; }

/* Heatmap */
.heat { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; }
.heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.heat-days span { display: flex; align-items: center; height: 100%; line-height: 1; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat-grid i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(30,22,70,.03); }
.heat-grid i[data-l="1"] { background: #E3DDFF; }
.heat-grid i[data-l="2"] { background: #BBA9FF; }
.heat-grid i[data-l="3"] { background: #8E73FF; }
.heat-grid i[data-l="4"] { background: var(--brand); }
.heat-grid i.future { background: transparent; box-shadow: none; }
.heat-grid i.is-today { outline: 2px solid var(--brand-2); outline-offset: 1px; }
.heat-months { grid-column: 2; display: grid; grid-auto-flow: column; font-size: 12px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: block; }

/* Streak ranking */
.rank { display: grid; }
.rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: left; width: 100%; border-radius: var(--r-sm); }
.rank-row + .rank-row { border-top: 1px solid var(--line); }
.rank-row .chip3d { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; }
.rank-row .grow { flex: 1; min-width: 0; }
.rank-row .n { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.rank-bar { display: block; height: 6px; border-radius: var(--r-full); background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.rank-bar i { display: block; height: 100%; border-radius: var(--r-full); background: var(--brand); }
.rank-row .r { text-align: right; flex: none; }
.rank-row .r b { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.rank-row .r b svg { width: 14px; height: 14px; fill: var(--flame); }
.rank-row .r span { font-size: 12px; color: var(--text-2); }
@media (hover: hover) { .rank-row:hover { background: var(--surface-2); } }

/* Settings */
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; }
.group-title { font-size: 13px; color: var(--text-2); font-weight: 500; margin: 0 4px 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 60px; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
button.row { transition: background-color .15s ease-out; }
@media (hover: hover) { button.row:hover { background: var(--surface-2); } }
.row .ic-chip { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); flex: none; }
.row .ic-chip svg { width: 20px; height: 20px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 15px; font-weight: 500; }
.row .s { font-size: 13px; color: var(--text-2); }
.row .chev { color: var(--text-3); width: 18px; height: 18px; }
.row.danger .t { color: var(--bad); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.input { height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 16px; width: 100%;
  transition: border-color .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
.input:focus { outline: none; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.input.err { border-color: var(--bad); }
.err-msg { font-size: 13px; color: var(--bad); }
.row .input { height: 40px; max-width: 180px; }
.foot-note { font-size: 13px; color: var(--text-3); text-align: center; margin-top: 8px; }

/* Tab bar */
.tabbar::before { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--canvas) 45%, transparent); z-index: -1; pointer-events: none; }
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 360px; margin: 0 auto; height: var(--tab-h);
  background: rgba(255,255,255,.92); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-radius: var(--r-lg); box-shadow: var(--sh-float), inset 0 0 0 1px rgba(255,255,255,.8); display: grid; grid-template-columns: 1fr 88px 1fr; align-items: center; z-index: 20; padding: 0 6px; }
.tab { display: grid; justify-items: center; gap: 2px; color: var(--text-2); font-size: 12px; font-weight: 600; padding: 8px 0; border-radius: var(--r-sm); min-height: 48px; align-content: center; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
@media (hover: hover) { .tab:not([aria-current="page"]):hover { color: var(--text-2); } }
.fab { width: 52px; height: 52px; border-radius: var(--r-md); justify-self: center; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 10px 20px -8px rgba(106,77,244,.8), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .15s ease-out; }
.fab:active { transform: scale(.94); }
.fab svg { width: 26px; height: 26px; stroke-width: 2.2; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(22,20,43,.38); opacity: 0; pointer-events: none; transition: opacity .2s ease-out; z-index: 40; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 50; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  max-height: 92dvh; overflow-y: auto; box-shadow: 0 -12px 40px -12px rgba(22,20,43,.3); visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.sheet:focus { outline: none; }
.grabber { width: 40px; height: 5px; border-radius: var(--r-full); background: #DCD9E8; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.close-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
@media (hover: hover) { .close-btn:hover { background: #ECEAF4; color: var(--text); } }
.close-btn svg { width: 20px; height: 20px; }
.form { display: grid; gap: 20px; }

let view = 'today';
let detId = null, detMonth = null, editId = null, pickedEmoji = '💧';
let lastFocus = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.habits)) return s; } catch (e) {}
  return sampleState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Could not save — storage is full or blocked'); } }

function sampleState() {
  const t = today();
  // deterministic pseudo-random
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const defs = [
    { name: 'Drink 2L of water', emoji: '💧', rate: .8, streak: 12, todayDone: true },
    { name: 'Read 20 pages', emoji: '📚', rate: .65, streak: 5, todayDone: true },
    { name: 'Morning walk', emoji: '👟', rate: .7, streak: 3, todayDone: false },
    { name: 'Meditate 10 min', emoji: '🧘', rate: .55, streak: 21, todayDone: true },
    { name: 'No phone after 10pm', emoji: '📵', rate: .5, streak: 0, todayDone: false },
  ];
  const habits = defs.map((d, i) => {
    const id = 'h' + (i + 1);
    const created = keyOf(addDays(t, -62 + i * 3));
    const log = {};
    for (let n = 60 - i * 3; n >= 1; n--) if (rnd() < d.rate) log[keyOf(addDays(t, -n))] = 1;
    // force current streak ending yesterday (or today)
    const offset = d.todayDone ? 1 : 0; // today's tick counts towards streak
    const runEnd = d.streak - offset; // number of days before today in the run
    for (let n = 1; n <= runEnd; n++) log[keyOf(addDays(t, -n))] = 1;
    delete log[keyOf(addDays(t, -(runEnd + 1)))];
    if (d.streak === 0) delete log[keyOf(addDays(t, -1))];
    if (d.todayDone) log[keyOf(t)] = 1;
    return { id, name: d.name, emoji: d.emoji, created, log };
  });
  return { name: 'Sam', habits, sample: true };
}

/* ---------- Stats ---------- */
const isDone = (h, k) => !!h.log[k];
function currentStreak(h) {
  let d = today(); let n = 0;
  if (!isDone(h, keyOf(d))) d = addDays(d, -1); // today not done yet: streak is still alive from yesterday
  while (isDone(h, keyOf(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(h) {
  const keys = Object.keys(h.log).filter((k) => h.log[k]).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) {
    const d = fromKey(k);
    run = prev && keyOf(addDays(prev, 1)) === k ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  }
  return best;
}
const activeOn = (h, k) => h.created <= k;
function dayStats(k) {
  const hs = state.habits.filter((h) => activeOn(h, k));
  const done = hs.filter((h) => isDone(h, k)).length;
  return { done, total: hs.length };
}
function rate(h, days) {
  const t = today(); let done = 0, tot = 0;
  for (let i = 0; i < days; i++) { const k = keyOf(addDays(t, -i)); if (!activeOn(h, k)) continue; tot++; if (isDone(h, k)) done++; }
  return tot ? done / tot : 0;
}

/* ---------- Render: today ---------- */
function greeting() {
  const h = new Date().getHours();
  const part = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return state.name ? `${part}, ${state.name}` : part;
}
function ringSvg(size, r, pct, cls = '') {
  const c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="bg" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="fg ${cls}" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-dasharray="${(pct * c).toFixed(2)} ${c.toFixed(2)}"${pct ? '' : ' opacity="0"'}/></svg>`;
}

function renderHeader() {
  const t = today();
  $('#todayDate').textContent = fmt(t, { weekday: 'long', day: 'numeric', month: 'long' });
  $('#todayTitle').textContent = greeting();
  const initials = (state.name || '?').trim().slice(0, 1).toUpperCase() || '?';
  $$('[data-initials]').forEach((el) => (el.textContent = initials));
  $$('[data-name]').forEach((el) => (el.textContent = state.name || 'You'));
}

function renderWeek() {
  const t = today(); const s = startOfWeek(t); const tk = keyOf(t);
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(s, i); const k = keyOf(d);
    const future = k > tk;
    const { done, total } = dayStats(k);
    const pct = total ? done / total : 0;
    const full = total > 0 && done === total && !future;
    const label = `${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${future ? '' : `, ${done} of ${total} done`}`;
    html += `<button class="day${k === selDay ? ' sel' : ''}${k === tk ? ' today' : ''}${full ? ' full' : ''}" data-day="${k}" ${future ? 'disabled' : ''} aria-pressed="${k === selDay}" aria-label="${label}">
      <span class="dl">${k === tk ? 'Today' : fmt(d, { weekday: 'short' }).slice(0, 3)}</span>
      <span class="dn num">${future || full ? '' : ringSvg(38, 17, pct)}<span>${d.getDate()}</span></span></button>`;
  }
  $('#week').innerHTML = html;
}

function renderSummary() {
  $('#summary').hidden = !state.habits.length;
  $('#week').hidden = !state.habits.length;
  const k = selDay; const isToday = k === keyOf(today());
  const { done, total } = dayStats(k);
  const pct = total ? done / total : 0;
  const left = total - done;
  const sub = !total ? 'Add a habit to get started' : left === 0 ? 'Everything done. Nice work.' : `${left} habit${left === 1 ? '' : 's'} left ${isToday ? 'today' : 'on this day'}`;
  // perfect days this week & longest current streak
  const s = startOfWeek(today()); let perfect = 0;
  for (let i = 0; i < 7; i++) { const dk = keyOf(addDays(s, i)); if (dk > keyOf(today())) break; const st = dayStats(dk); if (st.total && st.done === st.total) perfect++; }
  const streaks = state.habits.map((h) => currentStreak(h));
  const topStreak = streaks.length ? Math.max(...streaks) : 0;
  const label = isToday ? 'Today' : fmt(fromKey(k), { weekday: 'long', day: 'numeric', month: 'short' });
  $('#summary').innerHTML = `
    <div class="sum-row">
      <div>
        <p class="sum-label">${label}</p>
        <p class="sum-fig num">${done}<small> / ${total} done</small></p>
        <p class="sum-sub">${sub}</p>
      </div>
      <div class="ring" role="img" aria-label="${Math.round(pct * 100)} percent complete">${ringSvg(84, 37, pct)}<b class="num">${Math.round(pct * 100)}%</b></div>
    </div>
    <div class="sum-stats">
      <div class="sum-stat"><span class="chip3d">${emo('🔥')}</span><div><p class="k">Top streak</p><p class="v num">${topStreak} day${topStreak === 1 ? '' : 's'}</p></div></div>
      <div class="sum-stat"><span class="chip3d">${emo('⭐')}</span><div><p class="k">Perfect days</p><p class="v num">${perfect} of 7</p></div></div>
    </div>`;
}

function renderList() {
  const k = selDay; const list = $('#list');
  const hs = state.habits.filter((h) => activeOn(h, k) || k === keyOf(today()));
  const { done, total } = dayStats(k);
  $('#navCount').textContent = state.habits.length ? `${dayStats(keyOf(today())).done}/${dayStats(keyOf(today())).total}` : '';
  if (!state.habits.length) {
    list.innerHTML = `<div class="empty"><div class="art">${emo('🌱').replace('width="28" height="28"', 'width="76" height="76"')}</div>
      <h3>No habits yet</h3><p>Add something small you want to do every day, like drinking water or reading.</p>
      <button class="btn" data-add><svg class="ic"><use href="#i-plus"/></svg>Add your first habit</button></div>`;
    return;
  }
  if (!hs.length) { list.innerHTML = `<div class="empty"><h3>Nothing to track on this day</h3><p>Your habits started after this date.</p></div>`; return; }
  list.innerHTML = hs.map((h) => {
    const d = isDone(h, k); const st = currentStreak(h);
    const streakTxt = st > 0
      ? `<span class="fl"><svg><use href="#i-flame"/></svg><span><b class="num">${st}</b> day streak</span></span>`
      : `<span>No streak yet</span>`;
    const best = bestStreak(h);
    return `<div class="habit${d ? ' done' : ''}" style="--c:${colorFor(h.emoji)}">
      <button class="habit-main" data-open="${h.id}" aria-label="${esc(h.name)}, details">
        <span class="chip3d">${emo(h.emoji)}</span>
        <span class="habit-text"><span class="habit-name">${esc(h.name)}</span>
        <span class="habit-meta">${streakTxt}<span class="dot"></span><span>Best <span class="num">${best}</span></span></span></span>
      </button>
      <button class="check" data-toggle="${h.id}" aria-pressed="${d}" aria-label="Mark ${esc(h.name)} done"><svg><use href="#i-check"/></svg></button>
    </div>`;
  }).join('');
}

/* ---------- Render: progress ---------- */
function progressHTML() {
  const t = today(); const tk = keyOf(t);
  if (!state.habits.length) {
    return `<div class="card"><div class="empty" style="box-shadow:none;padding:12px 0"><h3>Progress shows up here</h3><p>Tick off habits for a few days to see streaks and trends.</p></div></div>`;
  }
  // 7-day bars
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = addDays(t, -i); const k = keyOf(d); days.push({ d, k, ...dayStats(k) }); }
  const sum7 = days.reduce((a, b) => a + b.done, 0), tot7 = days.reduce((a, b) => a + b.total, 0);
  const prev = []; for (let i = 13; i >= 7; i--) prev.push(dayStats(keyOf(addDays(t, -i))));
  const psum = prev.reduce((a, b) => a + b.done, 0), ptot = prev.reduce((a, b) => a + b.total, 0);
  const r7 = tot7 ? sum7 / tot7 : 0, rp = ptot ? psum / ptot : 0;
  const delta = Math.round((r7 - rp) * 100);
  const maxH = Math.max(1, ...days.map((x) => x.total));
  const bars = days.map((x) => {
    const h = (x.done / maxH) * 100;
    return `<div class="bar-col${x.k === tk ? ' cur' : ''}"><div class="bar-wrap"><span class="bar-val num" style="bottom:calc(${h}% + 4px)">${x.done}</span><div class="bar" style="height:${h}%"></div></div>
      <span class="bl">${x.k === tk ? 'Today' : fmt(x.d, { weekday: 'short' }).slice(0, 3)}</span></div>`;
  }).join('');
  const deltaPill = ptot ? `<span class="pill ${delta >= 0 ? 'ok' : 'bad'} num">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}%</span>` : '';

  // tiles
  const monthStart = new Date(t.getFullYear(), t.getMonth(), 1); let perfectMonth = 0;
  for (let d = monthStart; keyOf(d) <= tk; d = addDays(d, 1)) { const s = dayStats(keyOf(d)); if (s.total && s.done === s.total) perfectMonth++; }
  const allBest = Math.max(0, ...state.habits.map(bestStreak));
  const totalChecks = state.habits.reduce((a, h) => a + Object.values(h.log).filter(Boolean).length, 0);

  // heatmap: last 15 weeks ending this week
  const weeks = 15; const s0 = addDays(startOfWeek(t), -(weeks - 1) * 7);
  let cells = ''; let months = ''; let lastM = -1;
  for (let w = 0; w < weeks; w++) {
    const ws = addDays(s0, w * 7);
    const m = ws.getMonth();
    months += `<span>${m !== lastM && ws.getDate() <= 7 ? fmt(ws, { month: 'short' }) : ''}</span>`;
    if (ws.getDate() <= 7) lastM = m;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i); const k = keyOf(d);
      if (k > tk) { cells += `<i class="future"></i>`; continue; }
      const st = dayStats(k); const p = st.total ? st.done / st.total : 0;
      const l = !st.total || p === 0 ? 0 : p < .34 ? 1 : p < .67 ? 2 : p < 1 ? 3 : 4;
      cells += `<i data-l="${l}"${k === tk ? ' class="is-today"' : ''} title="${fmt(d, { day: 'numeric', month: 'short' })}: ${st.done} of ${st.total}"></i>`;
    }
  }

  // streak ranking
  const ranked = state.habits.map((h) => ({ h, cur: currentStreak(h), best: bestStreak(h), r: rate(h, 30) })).sort((a, b) => b.cur - a.cur || b.best - a.best);
  const rows = ranked.map(({ h, cur, best, r }) => `<button class="rank-row" data-open="${h.id}" style="--c:${colorFor(h.emoji)}">
      <span class="chip3d">${emo(h.emoji)}</span>
      <span class="grow"><span class="n">${esc(h.name)}</span><span class="rank-bar" aria-hidden="true"><i style="width:${Math.round(r * 100)}%"></i></span></span>
      <span class="r"><b class="num">${cur ? `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame"/></svg>${cur}` : "–"}</b><span class="num">${Math.round(r * 100)}% · 30d</span></span>
    </button>`).join('');

  return `
    <div class="tiles">
      <div class="tile" style="--c:#6A4DF4"><span class="ic-chip"><svg class="ic"><use href="#i-target"/></svg></span><span class="k">7-day rate</span><span class="v num">${Math.round(r7 * 100)}<small>%</small></span></div>
      <div class="tile" style="--c:#E0951A"><span class="ic-chip"><svg class="ic"><use href="#i-star"/></svg></span><span class="k">Perfect days</span><span class="v num">${perfectMonth}<small> days</small></span></div>
      <div class="tile" style="--c:#F06A1D"><span class="ic-chip"><svg class="ic"><use href="#i-trophy"/></svg></span><span class="k">Best streak</span><span class="v num">${allBest}<small> days</small></span></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Last 7 days</h2><p class="card-sub num">${sum7} of ${tot7} check-ins${ptot ? " · vs the week before" : ""}</p></div>${deltaPill}</div>
      <div class="bars" role="img" aria-label="Habits completed per day over the last 7 days: ${days.map((x) => x.done).join(', ')}">
        <div class="grid"><i></i><i></i></div>${bars}</div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Streaks</h2><p class="card-sub">Current streak and 30-day completion</p></div></div>
      <div class="rank">${rows}</div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Last 15 weeks</h2><p class="card-sub num">${totalChecks} check-ins in total</p></div>
        <div class="legend" aria-hidden="true">Less<i style="background:var(--surface-2)"></i><i style="background:#E3DDFF"></i><i style="background:#BBA9FF"></i><i style="background:#8E73FF"></i><i style="background:var(--brand)"></i>More</div></div>
      <div class="heat" role="img" aria-label="Daily completion for the last 15 weeks">
        <div class="heat-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>
        <div class="heat-grid">${cells}</div>
        <div class="heat-months" style="grid-template-columns:repeat(${weeks},1fr)">${months}</div>
      </div>
    </div>`;
}

function render() {
  renderHeader(); renderWeek(); renderSummary(); renderList();
  $('#progDate').textContent = fmt(today(), { month: 'long', year: 'numeric' });
  const p = progressHTML();
  if (window.matchMedia('(min-width: 1024px)').matches) { $('#deskProgress').innerHTML = p; $('#mobProgress').innerHTML = ''; }
  else { $('#mobProgress').innerHTML = view === 'progress' ? p : ''; $('#deskProgress').innerHTML = ''; }
}

/* ---------- Navigation ---------- */
function go(v) {
  if (v === 'progress' && window.matchMedia('(min-width: 1024px)').matches) v = 'today';
  view = v;
  $$('.view').forEach((el) => el.classList.toggle('on', el.dataset.view === v));
  $$('.tab[data-go], .nav [data-go]').forEach((b) => { if (b.dataset.go === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (v === 'settings') $('#nameInput').value = state.name || '';
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- Toggle ---------- */
function toggle(id, k, btn) {
  const h = state.habits.find((x) => x.id === id); if (!h) return;
  if (h.log[k]) delete h.log[k]; else h.log[k] = 1;
  save();
  const wasDone = !!h.log[k];
  render();
  if (btn) { const nb = $(`[data-toggle="${id}"]`); if (nb && wasDone) { nb.classList.add('pop'); nb.focus({ preventScroll: true }); } else if (nb) nb.focus({ preventScroll: true }); }
  if (wasDone) {
    const { done, total } = dayStats(k);
    if (done === total && total > 1) toast(k === keyOf(today()) ? 'All habits done today' : 'All habits done on this day');
  }
}

/* ---------- Sheets ---------- */
function openSheet(el) {
  lastFocus = document.activeElement;
  $('#scrim').classList.add('on'); el.classList.add('on');
  document.body.style.overflow = 'hidden';
  el.scrollTop = 0; $$('.sugg', el).forEach((s) => (s.scrollLeft = 0));
  // focus the dialog itself so phones don't pop the keyboard and no ring appears on the close button
  setTimeout(() => el.focus({ preventScroll: true }), 60);
}
function closeSheets() {
  $$('.sheet.on').forEach((s) => s.classList.remove('on'));
  $('#scrim').classList.remove('on');
  document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}

function renderEmojiGrid() {
  $('#emojiGrid').innerHTML = ICONS.map(([e, c]) => `<button type="button" class="emoji-opt" role="radio" aria-checked="${e === pickedEmoji}" data-emoji="${e}" style="--c:${c}" aria-label="${e}">${emo(e)}</button>`).join('');
}
function openAdd(id = null) {
  closeSheets();
  editId = id;
  const h = id && state.habits.find((x) => x.id === id);
  $('#addTitle').textContent = h ? 'Edit habit' : 'New habit';
  $('#addSubmit').textContent = h ? 'Save changes' : 'Add habit';
  $('#habitName').value = h ? h.name : '';
  $('#habitName').classList.remove('err'); $('#nameErr').hidden = true;
  pickedEmoji = h ? h.emoji : '💧';
  const existing = new Set(state.habits.map((x) => x.name.toLowerCase()));
  const sug = SUGG.filter(([n]) => !existing.has(n.toLowerCase()));
  $('#suggField').hidden = !!h || !sug.length;
  $('#sugg').innerHTML = sug.map(([n, e]) => `<button type="button" data-sugg="${esc(n)}" data-e="${e}">${emo(e).replace('width="28" height="28"', 'width="24" height="24"')}${esc(n)}</button>`).join('');
  renderEmojiGrid();
  openSheet($('#addSheet'));
}

function renderDetail() {
  const h = state.habits.find((x) => x.id === detId); if (!h) return;
  const c = colorFor(h.emoji);
  $('#detSheet').style.setProperty('--c', c);
  const cur = currentStreak(h), best = bestStreak(h), r = rate(h, 30);
  $('#detTop').innerHTML = `<span class="chip3d" style="--c:${c}">${emo(h.emoji)}</span><div><h2 id="detTitle">${esc(h.name)}</h2><p>Daily · started ${fmt(fromKey(h.created), { day: "numeric", month: "short" })}</p></div>`;
  $('#detStats').innerHTML = `
    <div class="det-stat"><p class="k">Current</p><p class="v num">${cur}<small> days</small></p></div>
    <div class="det-stat"><p class="k">Best</p><p class="v num">${best}<small> days</small></p></div>
    <div class="det-stat"><p class="k">30-day rate</p><p class="v num">${Math.round(r * 100)}<small>%</small></p></div>`;
  const t = today(); const m = detMonth;
  $('#detMonth').textContent = fmt(m, { month: 'long', year: 'numeric' });
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const nDays = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const wd = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let html = wd.map((d) => `<span class="wd" aria-hidden="true">${d}</span>`).join('');
  for (let i = 0; i < lead; i++) html += `<span class="blank"></span>`;
  const tk = keyOf(t);
  for (let d = 1; d <= nDays; d++) {
    const dt = new Date(m.getFullYear(), m.getMonth(), d); const k = keyOf(dt);
    const on = isDone(h, k); const fut = k > tk;
    html += `<button class="num${on ? ' on' : ''}${k === tk ? ' today' : ''}" data-cal="${k}" ${fut ? 'disabled' : ''} aria-pressed="${on}" aria-label="${fmt(dt, { day: 'numeric', month: 'long' })}${on ? ', done' : ''}">${d}</button>`;
  }
  $('#detCal').innerHTML = html;
  $('#mNext').disabled = m.getFullYear() === t.getFullYear() && m.getMonth() === t.getMonth();
  $('#mPrev').disabled = keyOf(new Date(m.getFullYear(), m.getMonth(), 0)) < h.created && keyOf(first) <= h.created;
}
function openDetail(id) {
  closeSheets();
  detId = id; const t = today(); detMonth = new Date(t.getFullYear(), t.getMonth(), 1);
  renderDetail(); openSheet($('#detSheet'));
}

/* ---------- Toast ---------- */
let toastTimer, undoFn = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 2200);
}
$('#toastUndo').addEventListener('click', () => { if (undoFn) undoFn(); $('#toast').classList.remove('on'); undoFn = null; });

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-close]'); if (!t) return;
  if (t.dataset.toggle) return toggle(t.dataset.toggle, selDay, t);
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.dataset.day) { selDay = t.dataset.day; render(); const b = $(`[data-day="${selDay}"]`); b && b.focus({ preventScroll: true }); return; }
  if (t.dataset.go) { closeSheets(); return go(t.dataset.go); }
  if (t.hasAttribute('data-add')) return openAdd();
  if (t.hasAttribute('data-close')) return closeSheets();
  if (t.dataset.emoji) { pickedEmoji = t.dataset.emoji; $$('.emoji-opt').forEach((b) => b.setAttribute('aria-checked', b.dataset.emoji === pickedEmoji)); return; }
  if (t.dataset.sugg) { $('#habitName').value = t.dataset.sugg; pickedEmoji = t.dataset.e; renderEmojiGrid(); $('#habitName').classList.remove('err'); $('#nameErr').hidden = true; return; }
  if (t.dataset.cal) {
    const h = state.habits.find((x) => x.id === detId); const k = t.dataset.cal;
    if (h.log[k]) delete h.log[k]; else h.log[k] = 1;
    if (k < h.created) h.created = k;
    save(); renderDetail(); render(); const nb = $(`[data-cal="${k}"]`); nb && nb.focus({ preventScroll: true }); return;
  }
});
$('#scrim').addEventListener('click', closeSheets);
$('#mPrev').addEventListener('click', () => { detMonth = new Date(detMonth.getFullYear(), detMonth.getMonth() - 1, 1); renderDetail(); });
$('#mNext').addEventListener('click', () => { detMonth = new Date(detMonth.getFullYear(), detMonth.getMonth() + 1, 1); renderDetail(); });
$('#detEdit').addEventListener('click', () => openAdd(detId));
$('#detDelete').addEventListener('click', () => {
  const idx = state.habits.findIndex((x) => x.id === detId); if (idx < 0) return;
  const [removed] = state.habits.splice(idx, 1); save(); closeSheets(); render();
  toast(`Deleted “${removed.name.length > 22 ? removed.name.slice(0, 21) + '…' : removed.name}”`, () => { state.habits.splice(idx, 0, removed); save(); render(); });
});

$('#addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('#habitName').value.trim();
  if (!name) { $('#habitName').classList.add('err'); $('#nameErr').hidden = false; $('#habitName').focus(); return; }
  if (editId) { const h = state.habits.find((x) => x.id === editId); h.name = name; h.emoji = pickedEmoji; save(); closeSheets(); render(); toast('Habit updated'); return; }
  state.habits.push({ id: 'h' + Date.now().toString(36), name, emoji: pickedEmoji, created: keyOf(today()), log: {} });
  selDay = keyOf(today());
  save(); closeSheets(); if (view !== 'today') go('today'); else render(); toast('Habit added');
});
$('#habitName').addEventListener('input', () => { $('#habitName').classList.remove('err'); $('#nameErr').hidden = true; });

$('#nameInput').addEventListener('input', (e) => { state.name = e.target.value.trim(); save(); renderHeader(); });
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `steady-habits-${keyOf(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#sampleBtn').addEventListener('click', () => {
  if (state.habits.length && !confirm('Replace your habits with sample data?')) return;
  const name = state.name; state = sampleState(); if (name) state.name = name; save(); selDay = keyOf(today()); go('today'); toast('Sample data loaded');
});
$('#clearBtn').addEventListener('click', () => {
  if (!confirm('Remove all habits and history? This cannot be undone.')) return;
  state = { name: state.name, habits: [], sample: false }; save(); selDay = keyOf(today()); go('today'); toast('All data cleared');
});

document.addEventListener('keydown', (e) => {
  const open = $('.sheet.on'); if (!open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheets(); return; }
  if (e.key === 'Tab') {
    const f = $$('button:not([disabled]), input, [tabindex]:not([tabindex="-1"])', open).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// Day rollover & layout changes
let lastDay = keyOf(today());
function checkDay() { const k = keyOf(today()); if (k !== lastDay) { if (selDay === lastDay) selDay = k; lastDay = k; render(); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);
window.matchMedia('(min-width: 1024px)').addEventListener('change', () => go(view));

if (!localStorage.getItem(KEY)) save();
go('today');
})();
</script>
</body>
</html>
