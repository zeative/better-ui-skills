<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dasbor · Kopi Lereng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
Direction: Surat jalan, bukan brosur. Pemilik toko membuka ini di meja kemas untuk tahu
           berapa yang masuk hari ini dan apa yang harus dikemas sebelum kurir datang.
           Putih, rapat, bergaris, angka rata kanan.
Type:      IBM Plex Sans (teks, angka tabular) + IBM Plex Mono hanya untuk nomor pesanan.
           Skala 12 / 13 / 14 / 16 / 20 / 44.
Colour:    Kertas putih, tinta cokelat-hitam, satu aksen merah ceri kopi yang hanya berarti
           "sekarang": batang hari ini, pekerjaan yang menunggu, stok menipis.
           Hijau hanya untuk status terkirim dan kenaikan.
Shape:     Datar dengan garis; radius 6 untuk kontrol, 2 untuk batang; tanpa bayangan
           kecuali toast.
Signature: Kilogram di samping rupiah. Toko ini berpikir dalam kg biji kopi dan stok,
           jadi kg muncul di ringkasan, grafik, dan produk terlaris.
Emphasis:  (1) omzet hari ini, (2) daftar "perlu dikerjakan", (3) batang hari ini.
Not doing: sidebar berisi tautan mati, empat kartu statistik sama besar, latar krem dan
           serif "kopi", ikon di tiap judul, kartu di sekeliling tiap bagian.
*/
:root {
  color-scheme: light;
  --surface: #ffffff;
  --surface-sunken: #f5f3f1;
  --ink: #1e1a18;
  --ink-muted: #6a625e;
  --border: #e4e0dc;
  --bar: #8f8782;
  --accent: #a3243b;
  --accent-soft: #fbeef0;
  --success: #1b6e45;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-display: 44px;
  --r-control: 6px; --r-bar: 2px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font: 400 var(--fs-md)/1.4 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, dl, dd, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.muted { color: var(--ink-muted); }
.nowrap { white-space: nowrap; }

.page { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 48px; }

.top {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: 4px 24px; padding: 16px 0; border-bottom: 1px solid var(--ink);
}
.top h1 { font-size: var(--fs-lg); font-weight: 600; }
.top h1 span { font-weight: 400; color: var(--ink-muted); }
.top p { font-size: var(--fs-sm); color: var(--ink-muted); }

.layout { display: grid; gap: 32px; padding-top: 24px; }
.layout > section { min-width: 0; }
@media (min-width: 1100px) {
  .layout {
    grid-template-columns: 320px minmax(0, 1fr); column-gap: 48px; row-gap: 0;
    grid-template-areas: "summary chart" "todo chart" "products orders";
    grid-template-rows: auto 1fr auto;
  }
  .summary { grid-area: summary; }
  .todo { grid-area: todo; margin-top: 24px; }
  .chart { grid-area: chart; }
  .orders { grid-area: orders; margin-top: 40px; }
  .products { grid-area: products; margin-top: 40px; }
}

.head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px 16px; min-height: 32px; margin-bottom: 12px;
}
h2 { font-size: var(--fs-lg); font-weight: 600; line-height: 1.25; }
.head .muted { font-size: var(--fs-sm); }

/* Ringkasan hari ini */
.summary h2 { font-size: var(--fs-md); font-weight: 400; color: var(--ink-muted); }
.omzet {
  font-size: clamp(36px, 10vw, var(--fs-display)); font-weight: 600; line-height: 1.1;
  letter-spacing: -0.02em; white-space: nowrap; margin-top: 4px;
}
.delta { margin-top: 8px; font-size: var(--fs-sm); color: var(--ink-muted); }
.delta strong { font-weight: 600; color: var(--success); }
.delta strong.down { color: var(--accent); }
.facts { margin-top: 16px; border-top: 1px solid var(--border); }
.facts div {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.facts dt { color: var(--ink-muted); }
.facts dd { font-weight: 500; white-space: nowrap; }

/* Perlu dikerjakan */
.todo ul { border-top: 1px solid var(--ink); }
.todo li { border-bottom: 1px solid var(--border); }
.todo-item {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; min-height: 56px; padding: 8px 0; text-align: left;
  background: none; border: 0; border-radius: 0;
}
.todo-count {
  font-size: var(--fs-xl); font-weight: 600; color: var(--accent); text-align: right; line-height: 1;
}
.todo-item b { display: block; font-weight: 500; }
.todo-item small { display: block; font-size: var(--fs-sm); color: var(--ink-muted); }
.todo-go { font-size: var(--fs-sm); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
@media (hover: hover) { button.todo-item:hover { background: var(--surface-sunken); } }
button.todo-item:active { background: var(--border); }
.todo-done { padding: 16px 0; color: var(--ink-muted); }

/* Kontrol */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-control); padding: 2px; gap: 2px; }
.seg button, .chip, .btn {
  min-height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid transparent;
  background: none; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap;
  transition: background-color 120ms ease-out;
}
.seg button { color: var(--ink-muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.chip { border-color: var(--border); border-radius: var(--r-control); color: var(--ink-muted); }
.chip span { margin-left: 4px; font-weight: 400; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn { border-color: var(--ink); border-radius: var(--r-control); }
.btn:active { background: var(--ink-muted); border-color: var(--ink-muted); color: var(--surface); }
@media (hover: hover) {
  .seg button[aria-pressed="false"]:hover, .chip[aria-pressed="false"]:hover { background: var(--surface-sunken); color: var(--ink); }
  .btn:hover { background: var(--ink); color: var(--surface); }
}

/* Grafik */
.chart { display: flex; flex-direction: column; }
.chart-note { font-size: var(--fs-sm); color: var(--ink-muted); margin-bottom: 16px; }
.plot {
  flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(6px, 2vw, 24px);
  align-items: end; min-height: 260px; border-bottom: 1px solid var(--ink); padding: 0 clamp(0px, 1vw, 16px);
}
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.col .val { font-size: var(--fs-xs); color: var(--ink-muted); margin-bottom: 4px; white-space: nowrap; }
.col .bar {
  width: 100%; max-width: 64px; background: var(--bar); border-radius: var(--r-bar) var(--r-bar) 0 0;
  height: calc(var(--h) * (100% - 24px)); min-height: 2px;
  transition: height 200ms ease-out;
}
.col.today .val { color: var(--accent); font-weight: 600; }
.col.today .bar { background: var(--accent); }
.axis {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(6px, 2vw, 24px);
  padding: 8px clamp(0px, 1vw, 16px) 0; text-align: center; font-size: var(--fs-xs); color: var(--ink-muted);
}
.axis b { display: block; font-weight: 500; color: var(--ink); font-size: var(--fs-sm); }
.axis .today b { color: var(--accent); font-weight: 600; }

/* Pesanan */
.orders { container-type: inline-size; }
.otable { border-top: 1px solid var(--ink); margin-top: 12px; }
.orow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px;
  grid-template-areas: "who total" "items items" "status act";
  padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center;
}
.ohead { display: none; }
.c-who { grid-area: who; min-width: 0; }
.c-items { grid-area: items; min-width: 0; }
.c-total { grid-area: total; text-align: right; font-weight: 500; white-space: nowrap; align-self: start; }
.c-status { grid-area: status; }
.c-act { grid-area: act; text-align: right; }
.c-who b { display: block; font-size: var(--fs-lg); font-weight: 500; overflow-wrap: anywhere; }
.c-who small { display: block; font-size: var(--fs-sm); color: var(--ink-muted); }
.c-who code { font-family: var(--mono); font-size: var(--fs-sm); }
.c-items li { display: flex; gap: 8px; }
.c-items .qty { flex: none; min-width: 64px; white-space: nowrap; }
.orow .btn { min-height: 44px; padding: 0 16px; font-size: var(--fs-md); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
.status.pack { font-weight: 600; }
.status.pack i { background: var(--accent); }
.status.shipped i { background: var(--success); }
.status.unpaid { color: var(--ink-muted); }
.status.unpaid i { background: none; border: 1.5px solid var(--ink-muted); }
.status.cancelled { color: var(--ink-muted); }
.status.cancelled i { background: none; border-top: 1.5px solid var(--ink-muted); border-radius: 0; height: 0; }
.orow.is-cancelled .c-total { text-decoration: line-through; font-weight: 400; color: var(--ink-muted); }
.orow.is-cancelled .c-items, .orow.is-cancelled .c-who b { color: var(--ink-muted); }
.empty { padding: 32px 0; border-bottom: 1px solid var(--border); color: var(--ink-muted); }
.empty b { display: block; color: var(--ink); font-weight: 500; }
.more { margin-top: 16px; }

@container (min-width: 720px) {
  .orow {
    grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) 104px 120px 124px;
    grid-template-areas: "who items total status act"; gap: 16px; align-items: start; padding: 10px 0;
  }
  .ohead {
    display: grid; padding: 8px 0; font-size: var(--fs-sm); color: var(--ink-muted); border-bottom: 1px solid var(--border);
  }
  .ohead .c-total { font-weight: 400; }
  .c-who b { font-size: var(--fs-md); }
  .c-status { padding-top: 1px; }
  .c-act { margin: -4px 0; }
  .orow .btn { min-height: 32px; padding: 0 12px; font-size: var(--fs-sm); }
}

/* Produk terlaris */
.products ol { border-top: 1px solid var(--ink); }
.products li { padding: 12px 0; border-bottom: 1px solid var(--border); }
.p-line { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.p-line b { font-weight: 500; min-width: 0; }
.p-line span { white-space: nowrap; font-weight: 500; }
.p-track { height: 4px; background: var(--surface-sunken); border-radius: var(--r-bar); margin: 8px 0; }
.p-track i { display: block; height: 100%; width: calc(var(--w) * 100%); background: var(--bar); border-radius: var(--r-bar); }
.p-meta { display: flex; justify-content: space-between; gap: 16px; font-size: var(--fs-sm); color: var(--ink-muted); }
.p-meta .low { color: var(--accent); font-weight: 600; }

footer {
  margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center;
  font-size: var(--fs-sm); color: var(--ink-muted);
}
footer p { max-width: 65ch; }
.link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: var(--fs-sm); }

.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 16px; width: max-content; max-width: calc(100vw - 32px);
  padding: 4px 8px 4px 16px; background: var(--ink); color: var(--surface); border-radius: var(--r-control);
  box-shadow: 0 1px 2px rgb(30 26 24 / .2), 0 8px 24px rgb(30 26 24 / .18);
}
.toast[hidden] { display: none; }
.toast button {
  min-height: 44px; padding: 0 8px; background: none; border: 0; color: var(--surface);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}
.toast :focus-visible { outline-color: var(--surface); }

@media (max-width: 719px) {
  .seg button, .chip { min-height: 44px; padding: 0 16px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; }
  .chip { text-align: left; }
  .todo-item { min-height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Kopi Lereng <span>· Dasbor</span></h1>
    <p><span id="date"></span> · data per pukul 14.35</p>
  </header>

  <main class="layout">
    <section class="summary" aria-labelledby="h-summary">
      <h2 id="h-summary">Omzet hari ini</h2>
      <p class="omzet" id="omzet"></p>
      <p class="delta" id="delta"></p>
      <dl class="facts" id="facts"></dl>
    </section>

    <section class="todo" aria-labelledby="h-todo">
      <div class="head"><h2 id="h-todo">Perlu dikerjakan</h2></div>
      <div id="todo"></div>
    </section>

    <section class="chart" aria-labelledby="h-chart">
      <div class="head">
        <h2 id="h-chart">Penjualan 7 hari terakhir</h2>
        <div class="seg" role="group" aria-label="Satuan grafik">
          <button type="button" data-metric="rev" aria-pressed="true">Omzet</button>
          <button type="button" data-metric="kg" aria-pressed="false">Kilogram</button>
        </div>
      </div>
      <p class="chart-note" id="chart-note"></p>
      <div class="plot" id="plot" aria-hidden="true"></div>
      <div class="axis" id="axis" aria-hidden="true"></div>
      <table class="sr-only" id="chart-table"></table>
    </section>

    <section class="orders" aria-labelledby="h-orders">
      <div class="head">
        <h2 id="h-orders">Pesanan terbaru</h2>
        <span class="muted">Hari ini, terbaru di atas</span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Saring pesanan menurut status"></div>
      <div id="orders"></div>
    </section>

    <section class="products" aria-labelledby="h-products">
      <div class="head">
        <h2 id="h-products">Produk terlaris</h2>
        <span class="muted">7 hari, menurut omzet</span>
      </div>
      <ol id="products"></ol>
    </section>
  </main>

  <footer>
    <p>Semua angka di halaman ini data contoh. Omzet menghitung pesanan yang sudah dibayar, tanpa ongkos kirim.</p>
    <button type="button" class="link" id="reset">Kembalikan data contoh</button>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button type="button" id="toast-undo">Urungkan</button>
</div>

<script>
(() => {
  // ---------- Data contoh ----------
  // prev: unit terjual per hari untuk 6 hari sebelum hari ini (terlama → kemarin)
  const PRODUCTS = [
    { id: 'gayo',      name: 'Gayo Wine Natural',           p200: 118000, p1k: 540000, stock: 1.2,  prev200: [6,4,5,7,6,8], prev1k: [1,0,1,1,0,1] },
    { id: 'bajawa',    name: 'Flores Bajawa Full Washed',   p200: 96000,  p1k: 430000, stock: 8.6,  prev200: [4,3,4,3,5,4], prev1k: [0,1,0,1,0,1] },
    { id: 'toraja',    name: 'Toraja Sapan Honey',          p200: 108000, p1k: 495000, stock: 5.4,  prev200: [3,2,3,2,3,4], prev1k: [0,0,1,0,0,0] },
    { id: 'kintamani', name: 'Bali Kintamani Natural',      p200: 92000,  p1k: 415000, stock: 6.8,  prev200: [3,2,2,3,2,3], prev1k: [0,0,0,0,1,0] },
    { id: 'preanger',  name: 'Java Preanger Washed',        p200: 89000,  p1k: 400000, stock: 4.0,  prev200: [2,1,2,1,2,2], prev1k: [0,0,0,0,0,0] },
    { id: 'blend',     name: 'House Blend Espresso Lereng', p200: 62000,  p1k: 265000, stock: 14.5, prev200: [3,2,2,3,2,3], prev1k: [2,3,2,3,4,3] },
    { id: 'robusta',   name: 'Robusta Temanggung',          p200: 42000,  p1k: 165000, stock: 11.0, prev200: [2,1,1,2,1,2], prev1k: [1,1,0,1,1,1] },
  ];
  const PREV_ORDERS = [17, 12, 14, 16, 15, 19];
  const YESTERDAY_SAME_TIME = 3610000;
  const PICKUP = '16.00';
  // item: [produk, ukuran ('200' | '1k'), jumlah]
  const ORDERS = [
    { id: 'KL-3407', time: '07.12', name: 'Rina Kusumawati', city: 'Bandung', status: 'shipped', items: [['gayo','200',2]] },
    { id: 'KL-3408', time: '07.48', name: 'Kedai Teduh', city: 'Yogyakarta', status: 'shipped', items: [['blend','1k',3], ['robusta','1k',1]] },
    { id: 'KL-3409', time: '08.05', name: 'Dimas Prasetyo', city: 'Surabaya', status: 'shipped', items: [['bajawa','200',1], ['kintamani','200',1]] },
    { id: 'KL-3410', time: '08.41', name: 'Maria Situmorang', city: 'Medan', status: 'ready', items: [['toraja','200',2]] },
    { id: 'KL-3411', time: '09.17', name: 'Andi Pratama', city: 'Makassar', status: 'ready', items: [['gayo','1k',1]] },
    { id: 'KL-3412', time: '09.50', name: 'Putu Ayu Wulandari', city: 'Denpasar', status: 'cancelled', items: [['preanger','200',1]] },
    { id: 'KL-3413', time: '10.22', name: 'Fajar Nugroho', city: 'Semarang', status: 'pack', items: [['blend','200',2], ['robusta','200',1]] },
    { id: 'KL-3414', time: '10.58', name: 'Siti Nurhaliza Rahmawati Kartadinata', city: 'Jakarta Selatan', status: 'pack', items: [['gayo','200',1], ['bajawa','200',1], ['toraja','200',1]] },
    { id: 'KL-3415', time: '11.34', name: 'Bayu Saputra', city: 'Malang', status: 'pack', items: [['kintamani','200',2]] },
    { id: 'KL-3416', time: '12.06', name: 'Kopi Sudut Gang', city: 'Bogor', status: 'pack', items: [['blend','1k',2]] },
    { id: 'KL-3417', time: '12.51', name: 'Hendra Wijaya', city: 'Tangerang', status: 'unpaid', items: [['gayo','200',2]] },
    { id: 'KL-3418', time: '13.19', name: 'Nadia Putri', city: 'Depok', status: 'pack', items: [['bajawa','1k',1]] },
    { id: 'KL-3419', time: '13.55', name: 'Agus Setiawan', city: 'Solo', status: 'pack', items: [['preanger','200',2], ['gayo','200',1]] },
    { id: 'KL-3420', time: '14.28', name: 'Theresia Lumban Gaol', city: 'Pematangsiantar', status: 'unpaid', items: [['toraja','200',1]] },
  ];
  const STATUS = { unpaid: 'Belum dibayar', pack: 'Perlu dikemas', ready: 'Siap dijemput', shipped: 'Dikirim', cancelled: 'Dibatalkan' };
  const FILTERS = [['all', 'Semua'], ['pack', 'Perlu dikemas'], ['ready', 'Siap dijemput'], ['unpaid', 'Belum dibayar']];
  const PAGE = 8;

  // ---------- Util ----------
  const $ = id => document.getElementById(id);
  const NB = ' ';
  const num = (n, d = 0) => n.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
  const rp = n => 'Rp' + NB + num(n);
  const jt = n => num(n / 1e6, 1) + NB + 'jt';
  const kg = n => num(n, 1) + NB + 'kg';
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const price = ([pid, size, q]) => q * (size === '1k' ? byId[pid].p1k : byId[pid].p200);
  const weight = ([, size, q]) => q * (size === '1k' ? 1 : 0.2);
  const total = o => o.items.reduce((s, it) => s + price(it), 0);
  const paid = o => o.status !== 'unpaid' && o.status !== 'cancelled';

  // ---------- Status tersimpan ----------
  const KEY = 'kopi-lereng-contoh-status';
  const initial = Object.fromEntries(ORDERS.map(o => [o.id, o.status]));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(ORDERS.map(o => [o.id, o.status])))); } catch (e) {} };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    ORDERS.forEach(o => { if (STATUS[saved[o.id]]) o.status = saved[o.id]; });
  } catch (e) {}

  let filter = 'all', expanded = false, metric = 'rev';

  // ---------- Hitungan ----------
  const now = new Date();
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(now); d.setDate(now.getDate() - (6 - i));
    const isToday = i === 6;
    let rev = 0, w = 0;
    if (!isToday) PRODUCTS.forEach(p => {
      rev += p.prev200[i] * p.p200 + p.prev1k[i] * p.p1k;
      w += p.prev200[i] * 0.2 + p.prev1k[i];
    });
    return { d, isToday, rev, kg: w, orders: PREV_ORDERS[i] };
  });
  const todayPaid = ORDERS.filter(paid);
  const today = days[6];
  today.rev = todayPaid.reduce((s, o) => s + total(o), 0);
  today.kg = todayPaid.reduce((s, o) => s + o.items.reduce((a, it) => a + weight(it), 0), 0);
  today.orders = todayPaid.length;

  const week = PRODUCTS.map(p => {
    let rev = 0, w = 0;
    for (let i = 0; i < 6; i++) { rev += p.prev200[i] * p.p200 + p.prev1k[i] * p.p1k; w += p.prev200[i] * 0.2 + p.prev1k[i]; }
    todayPaid.forEach(o => o.items.forEach(it => { if (it[0] === p.id) { rev += price(it); w += weight(it); } }));
    return { ...p, rev, kg: w, perDay: w / 7 };
  }).sort((a, b) => b.rev - a.rev);

  // ---------- Render ----------
  function renderSummary() {
    $('date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('omzet').textContent = rp(today.rev);
    const diff = (today.rev - YESTERDAY_SAME_TIME) / YESTERDAY_SAME_TIME;
    const up = diff >= 0;
    $('delta').innerHTML = `<strong class="${up ? '' : 'down'}">${up ? 'Naik' : 'Turun'} ${num(Math.abs(diff) * 100, 1)}%</strong> dari kemarin pada jam yang sama (${rp(YESTERDAY_SAME_TIME)})`;
    const avg = Math.round(today.rev / today.orders / 1000) * 1000;
    $('facts').innerHTML = [
      ['Pesanan dibayar', num(today.orders)],
      ['Biji kopi terjual', kg(today.kg)],
      ['Rata-rata per pesanan', rp(avg)],
    ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  }

  function renderTodo() {
    const pack = ORDERS.filter(o => o.status === 'pack');
    const unpaid = ORDERS.filter(o => o.status === 'unpaid');
    const low = week.filter(p => p.stock < p.perDay * 2);
    const rows = [];
    if (pack.length) rows.push(`<li><button type="button" class="todo-item" data-go="pack">
      <span class="todo-count">${pack.length}</span>
      <span><b>Pesanan perlu dikemas</b><small>Kurir menjemput pukul ${PICKUP}</small></span>
      <span class="todo-go">Lihat</span></button></li>`);
    if (unpaid.length) rows.push(`<li><button type="button" class="todo-item" data-go="unpaid">
      <span class="todo-count">${unpaid.length}</span>
      <span><b>Pesanan belum dibayar</b><small>${rp(unpaid.reduce((s, o) => s + total(o), 0))} menunggu transfer</small></span>
      <span class="todo-go">Lihat</span></button></li>`);
    low.forEach(p => rows.push(`<li><div class="todo-item">
      <span class="todo-count">!</span>
      <span><b>Stok ${esc(p.name)} tinggal ${kg(p.stock)}</b><small>Rata-rata keluar ${kg(p.perDay)} per hari</small></span>
      <span></span></div></li>`));
    $('todo').innerHTML = rows.length ? `<ul>${rows.join('')}</ul>`
      : `<p class="todo-done">Tidak ada yang menunggu. Semua pesanan lunas sudah dikemas.</p>`;
  }

  function renderChart() {
    const val = d => metric === 'rev' ? d.rev : d.kg;
    const lab = d => metric === 'rev' ? jt(d.rev) : kg(d.kg);
    const max = Math.max(...days.map(val));
    const sum = days.reduce((s, d) => s + val(d), 0);
    const prevAvg = days.slice(0, 6).reduce((s, d) => s + val(d), 0) / 6;
    $('chart-note').textContent = metric === 'rev'
      ? `Total ${rp(sum)}. Rata-rata 6 hari penuh ${rp(Math.round(prevAvg / 1000) * 1000)} per hari; hari ini masih berjalan.`
      : `Total ${kg(sum)} biji kopi. Rata-rata 6 hari penuh ${kg(prevAvg)} per hari; hari ini masih berjalan.`;
    $('plot').innerHTML = days.map(d =>
      `<div class="col${d.isToday ? ' today' : ''}"><span class="val">${lab(d)}</span><span class="bar" style="--h:${(val(d) / max).toFixed(4)}"></span></div>`).join('');
    $('axis').innerHTML = days.map(d =>
      `<div class="${d.isToday ? 'today' : ''}"><b>${d.isToday ? 'Hari ini' : d.d.toLocaleDateString('id-ID', { weekday: 'short' })}</b>${d.d.getDate()}/${d.d.getMonth() + 1}</div>`).join('');
    $('chart-table').innerHTML = `<caption>Penjualan per hari, 7 hari terakhir</caption>
      <tr><th>Hari</th><th>Omzet</th><th>Kilogram</th><th>Pesanan dibayar</th></tr>` + days.map(d =>
      `<tr><td>${d.d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' })}${d.isToday ? ' (sampai 14.35)' : ''}</td><td>${rp(d.rev)}</td><td>${kg(d.kg)}</td><td>${d.orders}</td></tr>`).join('');
    document.querySelectorAll('[data-metric]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric === metric)));
  }

  function renderOrders() {
    const count = f => f === 'all' ? ORDERS.length : ORDERS.filter(o => o.status === f).length;
    $('chips').innerHTML = FILTERS.map(([f, label]) =>
      `<button type="button" class="chip" data-filter="${f}" aria-pressed="${f === filter}">${label}<span>${count(f)}</span></button>`).join('');
    const list = ORDERS.filter(o => filter === 'all' || o.status === filter).reverse();
    if (!list.length) {
      const msg = {
        pack: ['Tidak ada pesanan yang perlu dikemas.', 'Pesanan baru yang sudah dibayar akan muncul di sini.'],
        ready: ['Belum ada paket yang siap dijemput.', 'Tandai pesanan sebagai dikemas agar masuk daftar jemput kurir.'],
        unpaid: ['Tidak ada pesanan yang menunggu pembayaran.', ''],
      }[filter] || ['Belum ada pesanan hari ini.', ''];
      $('orders').innerHTML = `<div class="otable"><p class="empty"><b>${msg[0]}</b>${msg[1]}</p></div>`;
      return;
    }
    const shown = expanded || filter !== 'all' ? list : list.slice(0, PAGE);
    const rows = shown.map(o => `
      <div class="orow${o.status === 'cancelled' ? ' is-cancelled' : ''}" role="row">
        <div class="c-who" role="cell"><b>${esc(o.name)}</b><small><code>${o.id}</code> · ${o.time} <span class="nowrap">· ${esc(o.city)}</span></small></div>
        <div class="c-items" role="cell"><ul>${o.items.map(it =>
          `<li><span class="qty">${it[2]}${NB}×${NB}${it[1] === '1k' ? '1' + NB + 'kg' : '200' + NB + 'g'}</span><span>${esc(byId[it[0]].name)}</span></li>`).join('')}</ul></div>
        <div class="c-total" role="cell">${rp(total(o))}</div>
        <div class="c-status" role="cell"><span class="status ${o.status}"><i></i>${STATUS[o.status]}</span></div>
        <div class="c-act" role="cell">${o.status === 'pack'
          ? `<button type="button" class="btn" data-pack="${o.id}" aria-label="Tandai ${o.id} sudah dikemas">Tandai dikemas</button>` : ''}</div>
      </div>`).join('');
    const rest = list.length - shown.length;
    $('orders').innerHTML = `
      <div class="otable" role="table" aria-labelledby="h-orders">
        <div class="orow ohead" role="row">
          <div class="c-who" role="columnheader">Pembeli</div><div class="c-items" role="columnheader">Isi pesanan</div>
          <div class="c-total" role="columnheader">Total</div><div class="c-status" role="columnheader">Status</div>
          <div class="c-act" role="columnheader"><span class="sr-only">Tindakan</span></div>
        </div>${rows}
      </div>
      ${rest > 0 ? `<button type="button" class="btn more" id="more">Tampilkan ${rest} pesanan lainnya</button>`
        : expanded && filter === 'all' && list.length > PAGE ? `<button type="button" class="btn more" id="more">Tampilkan ${PAGE} terbaru saja</button>` : ''}`;
  }

  function renderProducts() {
    const top = week.slice(0, 5), max = top[0].rev;
    $('products').innerHTML = top.map(p => {
      const low = p.stock < p.perDay * 2;
      return `<li>
        <div class="p-line"><b>${esc(p.name)}</b><span>${rp(p.rev)}</span></div>
        <div class="p-track" aria-hidden="true"><i style="--w:${(p.rev / max).toFixed(4)}"></i></div>
        <div class="p-meta"><span>${kg(p.kg)} terjual</span><span class="${low ? 'low' : ''}">Stok ${kg(p.stock)}${low ? ', menipis' : ''}</span></div>
      </li>`;
    }).join('');
  }

  // ---------- Interaksi ----------
  let undo = null, toastTimer;
  function toast(text, onUndo) {
    undo = onUndo;
    $('toast-text').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; undo = null; }, 7000);
  }
  function setStatus(id, status) {
    ORDERS.find(o => o.id === id).status = status;
    save(); renderTodo(); renderOrders();
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.metric) { metric = t.dataset.metric; renderChart(); }
    else if (t.dataset.filter) { filter = t.dataset.filter; renderOrders(); }
    else if (t.dataset.go) {
      filter = t.dataset.go; renderOrders();
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelector('.orders').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      document.querySelector(`[data-filter="${filter}"]`).focus({ preventScroll: true });
    }
    else if (t.dataset.pack) {
      const id = t.dataset.pack;
      setStatus(id, 'ready');
      toast(`${id} siap dijemput.`, () => setStatus(id, 'pack'));
    }
    else if (t.id === 'more') { expanded = !expanded; renderOrders(); }
    else if (t.id === 'toast-undo') { if (undo) undo(); $('toast').hidden = true; undo = null; }
    else if (t.id === 'reset') {
      ORDERS.forEach(o => { o.status = initial[o.id]; });
      try { localStorage.removeItem(KEY); } catch (err) {}
      filter = 'all'; expanded = false; $('toast').hidden = true;
      renderTodo(); renderOrders();
    }
  });

  renderSummary(); renderTodo(); renderChart(); renderOrders(); renderProducts();
})();
</script>
</body>
</html>
