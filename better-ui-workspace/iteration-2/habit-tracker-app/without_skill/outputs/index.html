<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1d211e;
    --muted: #6d746f;
    --line: #e4e1d9;
    --accent: #23854e;
    --accent-soft: #e2f1e7;
    --on-accent: #ffffff;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131614;
      --card: #1d211f;
      --text: #eef1ee;
      --muted: #98a19b;
      --line: #2e3431;
      --accent: #4cc27f;
      --accent-soft: #1f3528;
      --on-accent: #0c1a11;
      --danger: #ff7b6b;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(40px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }

  /* Header */
  .date { color: var(--muted); font-size: 14px; margin: 0; }
  h1 { font-size: 28px; line-height: 1.15; margin: 2px 0 14px; letter-spacing: -.02em; }
  .bar {
    height: 8px; border-radius: 99px; background: var(--line); overflow: hidden;
  }
  .bar > div {
    height: 100%; width: 0; border-radius: 99px; background: var(--accent);
    transition: width .3s ease;
  }

  /* Add form */
  .add { display: flex; gap: 8px; margin: 20px 0; }
  .add input, .sheet input {
    flex: 1; min-width: 0; height: 48px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card);
  }
  .add input::placeholder { color: var(--muted); }
  .btn {
    height: 48px; padding: 0 18px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-weight: 600;
  }
  .btn.plain { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .btn.danger.armed { background: var(--danger); color: var(--card); border-color: var(--danger); }

  /* Habit cards */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .habit {
    background: var(--card); border-radius: 16px; padding: 14px 14px 10px;
    box-shadow: var(--shadow);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .check {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--line); background: transparent; color: transparent;
    display: grid; place-items: center;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .check svg { width: 26px; height: 26px; }
  .check:active { transform: scale(.92); }
  .check[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .done .name { color: var(--muted); }
  .streak { font-size: 14px; color: var(--muted); margin-top: 1px; }
  .streak b { color: var(--text); font-weight: 600; }
  .streak .flame.cold { filter: grayscale(1); opacity: .6; }
  .more {
    flex: none; width: 44px; height: 44px; margin-right: -6px;
    border: 0; border-radius: 50%; background: transparent; color: var(--muted);
    font-size: 22px; line-height: 1;
  }

  /* Last 7 days */
  .week { display: flex; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .day {
    flex: 1; min-width: 0; min-height: 52px; padding: 2px 0;
    border: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; color: var(--muted);
  }
  .day .dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
    background: transparent; border: 1.5px solid var(--line); color: var(--muted);
  }
  .day .dot svg { width: 16px; height: 16px; }
  .day[aria-pressed="true"] .dot {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  .day.today { color: var(--text); font-weight: 700; }
  .day.today[aria-pressed="false"] .dot { border-color: var(--accent); color: var(--text); }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .note { color: var(--danger); font-size: 14px; margin: 0 0 12px; }

  /* Edit sheet */
  dialog.sheet {
    border: 0; padding: 20px; width: 100%; max-width: 560px;
    background: var(--card); color: var(--text);
    border-radius: 20px 20px 0 0;
    margin: auto auto 0;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
  @media (min-width: 600px) {
    dialog.sheet { margin: auto; border-radius: 20px; padding-bottom: 20px; }
  }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .sheet input { width: 100%; background: var(--bg); }
  .sheet .row { display: flex; gap: 8px; margin-top: 12px; }
  .sheet .row .btn { flex: 1; padding: 0 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="date" id="date"></p>
    <h1 id="summary">Habits</h1>
    <div class="bar" aria-hidden="true"><div id="bar"></div></div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newName" type="text" maxlength="60" placeholder="New habit, e.g. Read 10 pages"
           aria-label="New habit name" enterkeyhint="done">
    <button class="btn" type="submit">Add</button>
  </form>

  <p class="note" id="note" hidden>Your browser is blocking storage, so habits won't be saved after you close this page.</p>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <strong>No habits yet</strong>
    Add your first one above, then tick it off each day to build a streak.
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form id="editForm" autocomplete="off">
    <h2 id="sheetTitle">Edit habit</h2>
    <input id="editName" type="text" maxlength="60" aria-label="Habit name" enterkeyhint="done">
    <div class="row">
      <button class="btn danger" type="button" id="deleteBtn">Delete</button>
      <button class="btn plain" type="button" id="cancelBtn">Cancel</button>
      <button class="btn" type="submit">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STORE = 'habit-tracker-v1';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const $ = id => document.getElementById(id);

  // ---------- dates (local time, keyed as YYYY-MM-DD) ----------
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

  // ---------- storage ----------
  let habits = [];
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE));
      habits = Array.isArray(data) ? data.filter(h => h && h.id && typeof h.name === 'string') : [];
      habits.forEach(h => { if (!h.days || typeof h.days !== 'object') h.days = {}; });
    } catch { habits = []; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(habits)); $('note').hidden = true; }
    catch { $('note').hidden = false; }
  }

  // ---------- streaks ----------
  // Current streak: consecutive days ending today, or ending yesterday if
  // today isn't ticked yet (the streak is still alive until the day is over).
  function currentStreak(h, today) {
    let d = h.days[keyOf(today)] ? today : addDays(today, -1);
    let n = 0;
    while (h.days[keyOf(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestStreak(h) {
    const keys = Object.keys(h.days).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      run = prev && keyOf(addDays(fromKey(prev), 1)) === k ? run + 1 : 1;
      if (run > best) best = run;
      prev = k;
    }
    return best;
  }

  // ---------- rendering ----------
  let renderedDay = '';
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    const today = new Date();
    const todayKey = keyOf(today);
    renderedDay = todayKey;
    const focusId = document.activeElement && document.activeElement.dataset.fid;

    $('date').textContent = today.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    const total = habits.length;
    const doneCount = habits.filter(h => h.days[todayKey]).length;
    $('summary').textContent =
      total === 0 ? 'Habits' :
      doneCount === total ? 'All done for today 🎉' :
      `${doneCount} of ${total} done today`;
    $('bar').style.width = total ? `${(doneCount / total) * 100}%` : '0%';

    const list = $('list');
    list.textContent = '';
    $('empty').hidden = total > 0;

    for (const h of habits) {
      const doneToday = !!h.days[todayKey];
      const li = el('li', 'habit' + (doneToday ? ' done' : ''));

      const top = el('div', 'top');
      const check = el('button', 'check');
      check.type = 'button';
      check.innerHTML = CHECK;
      check.setAttribute('aria-pressed', doneToday);
      check.setAttribute('aria-label', `${h.name}: mark today ${doneToday ? 'not done' : 'done'}`);
      check.dataset.fid = `${h.id}|${todayKey}|main`;
      check.onclick = () => toggle(h.id, todayKey);

      const info = el('div', 'info');
      info.append(el('div', 'name', h.name));
      const cur = currentStreak(h, today), best = bestStreak(h);
      const streak = el('div', 'streak');
      if (cur > 0) {
        const flame = el('span', 'flame' + (doneToday ? '' : ' cold'), '🔥 ');
        streak.append(flame, el('b', '', `${cur} day${cur === 1 ? '' : 's'}`));
        streak.append(doneToday ? '' : ' · tick today to keep it');
        if (doneToday && best > cur) streak.append(` · best ${best}`);
      } else {
        streak.append(best > 0 ? `No streak right now · best ${best}` : 'No streak yet');
      }
      info.append(streak);

      const more = el('button', 'more', '⋯');
      more.type = 'button';
      more.setAttribute('aria-label', `Edit ${h.name}`);
      more.dataset.fid = `${h.id}|more`;
      more.onclick = () => openSheet(h.id);

      top.append(check, info, more);

      const week = el('div', 'week');
      for (let i = 6; i >= 0; i--) {
        const d = addDays(today, -i), k = keyOf(d), on = !!h.days[k];
        const b = el('button', 'day' + (i === 0 ? ' today' : ''));
        b.type = 'button';
        b.setAttribute('aria-pressed', on);
        b.setAttribute('aria-label',
          `${d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })}: ${on ? 'done' : 'not done'}`);
        b.dataset.fid = `${h.id}|${k}`;
        b.append(el('span', '', d.toLocaleDateString(undefined, { weekday: 'narrow' })));
        const dot = el('span', 'dot');
        if (on) dot.innerHTML = CHECK; else dot.textContent = d.getDate();
        b.append(dot);
        b.onclick = () => toggle(h.id, k);
        week.append(b);
      }

      li.append(top, week);
      list.append(li);
    }

    if (focusId) {
      const again = [...document.querySelectorAll('[data-fid]')].find(e => e.dataset.fid === focusId);
      if (again) again.focus();
    }
  }

  // ---------- actions ----------
  function toggle(id, dayKey) {
    const h = habits.find(x => x.id === id);
    if (!h) return;
    if (h.days[dayKey]) delete h.days[dayKey]; else h.days[dayKey] = 1;
    if (navigator.vibrate) navigator.vibrate(10);
    save(); render();
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('newName');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    habits.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name, days: {} });
    input.value = '';
    save(); render();
  });

  // ---------- edit sheet ----------
  const sheet = $('sheet'), deleteBtn = $('deleteBtn');
  let editingId = null;

  function openSheet(id) {
    const h = habits.find(x => x.id === id);
    if (!h) return;
    editingId = id;
    $('editName').value = h.name;
    deleteBtn.classList.remove('armed');
    deleteBtn.textContent = 'Delete';
    sheet.showModal();
  }
  $('editForm').addEventListener('submit', e => {
    e.preventDefault();
    const h = habits.find(x => x.id === editingId);
    const name = $('editName').value.trim();
    if (h && name) { h.name = name; save(); }
    sheet.close(); render();
  });
  $('cancelBtn').onclick = () => sheet.close();
  deleteBtn.onclick = () => {
    if (!deleteBtn.classList.contains('armed')) {
      deleteBtn.classList.add('armed');
      deleteBtn.textContent = 'Really delete?';
      return;
    }
    habits = habits.filter(x => x.id !== editingId);
    save(); sheet.close(); render();
  };
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

  // ---------- keep fresh ----------
  const refreshIfNewDay = () => { if (keyOf(new Date()) !== renderedDay) render(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfNewDay(); });
  setInterval(refreshIfNewDay, 60000);
  window.addEventListener('storage', e => { if (e.key === STORE) { load(); render(); } });

  load();
  render();
})();
</script>
</body>
</html>
