<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<title>Tally · Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — pale lilac canvas, white cards (radius 20), violet brand on the summary card,
   check buttons and active states; habit colours only on small icon chips and their own data marks. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F4F3FA; --surface: #FFFFFF; --surface-2: #F6F5FB; --line: #ECEAF3; --line-2: #DCD9E8;
  --text: #16142B; --text-2: #625F78; --text-3: #9895AC;
  --brand: #5B4CF0; --brand-600: #4A3AE0; --brand-tint: #EEECFE; --on-brand: #FFFFFF;
  --ok: #15803D; --ok-tint: #E8F7EE; --warn: #B45309; --warn-tint: #FEF4E2; --bad: #DC2626; --bad-tint: #FDECEC;
  --flame: #F06A1D;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(22,20,43,.04), 0 1px 1px rgba(22,20,43,.03);
  --sh-2: 0 1px 2px rgba(22,20,43,.04), 0 8px 24px -12px rgba(22,20,43,.12);
  --sh-float: 0 12px 32px -8px rgba(22,20,43,.20);
  --sh-brand: 0 1px 2px rgba(74,58,224,.18), 0 10px 24px -14px rgba(74,58,224,.5);
  --tab-h: 72px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 600px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; min-height: 76px; }
.topbar .eyebrow { font-size: 13px; font-weight: 500; color: var(--text-2); }
.topbar h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--surface), var(--sh-2); }
.avatar-btn svg, .avatar svg { width: 100%; height: 100%; }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 56px; justify-content: center; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 500; color: var(--text-2); transition: color .15s ease-out, transform .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab:active { transform: scale(.94); }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: var(--sh-brand); transition: transform .15s ease-out, background-color .15s ease-out; }
.tab-add .ic { width: 24px; height: 24px; stroke-width: 2.2; }
.tab-add:hover { background: var(--brand-600); }
.tab-add:active { transform: scale(.94); }

/* ---------- Generic ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 18px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 17px; letter-spacing: -0.01em; }
.section-head .meta { font-size: 14px; color: var(--text-2); }
.link { font-size: 14px; font-weight: 600; color: var(--brand); border-radius: 8px; padding: 4px 2px; }
.link:hover { color: var(--brand-600); text-decoration: underline; text-underline-offset: 3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 12px;
  font-size: 16px; font-weight: 600; background: var(--brand); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(22,20,43,.2), 0 8px 18px -8px rgba(91,76,240,.7);
  transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out, opacity .15s; }
.btn:hover { background: var(--brand-600); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line-2); box-shadow: var(--sh-1); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger-ghost { background: var(--surface); color: var(--bad); border: 1px solid var(--line-2); box-shadow: var(--sh-1); }
.btn.danger-ghost:hover { background: var(--bad-tint); }
.btn.done-state { background: var(--brand-tint); color: var(--brand); box-shadow: none; }
.btn.done-state:hover { background: color-mix(in srgb, var(--brand) 18%, var(--surface)); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: var(--surface);
  box-shadow: var(--sh-1); border: 1px solid var(--line); transition: background-color .15s, transform .15s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.95); }

/* Emoji chips */
.chip-ic { --c: var(--brand); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.chip-ic img { width: 28px; height: 28px; }
.chip-ic .emo-fb { font-size: 22px; line-height: 1; }
.chip-ic.lg { width: 56px; height: 56px; border-radius: 16px; }
.chip-ic.lg img { width: 36px; height: 36px; }
.chip-ic.lg .emo-fb { font-size: 28px; }
.chip-ic.sm { width: 36px; height: 36px; border-radius: 12px; }
.chip-ic.sm img { width: 22px; height: 22px; }
.chip-ic.sm .emo-fb { font-size: 18px; }

/* ---------- Week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 9px; border-radius: 16px; background: var(--surface);
  box-shadow: var(--sh-1); transition: background-color .15s, transform .15s; min-height: 72px; }
.day:hover:not([disabled]) { background: var(--surface-2); }
.day:active:not([disabled]) { transform: scale(.96); }
.day .dl { font-size: 12px; font-weight: 500; color: var(--text-2); }
.day .dn { font-size: 16px; font-weight: 600; }
.day .dot { width: 22px; height: 4px; border-radius: 4px; margin-top: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.day .dot i { display: block; height: 100%; width: var(--p); background: var(--brand); border-radius: 4px; }
.day.is-today .dn { color: var(--brand); }
.day[aria-pressed="true"] { background: var(--brand); box-shadow: var(--sh-brand); }
.day[aria-pressed="true"] .dl { color: rgba(255,255,255,.85); }
.day[aria-pressed="true"] .dn { color: #fff; }
.day[aria-pressed="true"] .dot { background: rgba(255,255,255,.3); box-shadow: none; }
.day[aria-pressed="true"] .dot i { background: #fff; }
.day[disabled] .dot { opacity: .5; }
.day[disabled] { background: transparent; box-shadow: none; cursor: default; }
.day[disabled] .dl, .day[disabled] .dn { color: var(--text-3); }

/* ---------- Summary card ---------- */
.summary { position: relative; overflow: clip; border-radius: var(--r-xl); padding: 20px; color: #fff;
  background: radial-gradient(120% 90% at 100% 0%, #7A6CFF 0%, transparent 55%), linear-gradient(140deg, #6152F3 0%, #4A3AE0 100%);
  box-shadow: var(--sh-brand); }
.summary-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.summary .label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.88); }
.summary .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.summary .big small { font-size: 20px; font-weight: 600; color: rgba(255,255,255,.8); letter-spacing: 0; }
.summary .sub { font-size: 14px; color: rgba(255,255,255,.88); margin-top: 2px; }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
.ring .ring-fg { transition: stroke-dasharray .5s cubic-bezier(.2,.8,.2,1); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.summary-stats { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.2); }
.summary-stats div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.2); }
.summary-stats .k { font-size: 13px; color: rgba(255,255,255,.85); }
.summary-stats .v { font-size: 18px; font-weight: 600; margin-top: 1px; }

/* ---------- Habit rows ---------- */
.list { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: var(--r-lg); padding: 12px 12px 12px 14px;
  box-shadow: var(--sh-1); border: 1px solid transparent; transition: box-shadow .15s, transform .15s; min-height: 72px; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: 12px; padding: 2px 0; }
.row-main:active { transform: scale(.99); }
@media (hover: hover) { .row:hover { box-shadow: var(--sh-2); } }
.row-text { min-width: 0; }
.row-name { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--text-2); margin-top: 2px; }
.row-sub .ic { width: 15px; height: 15px; }
.row-sub .flame { color: var(--flame); }
.row-sub b { font-weight: 600; color: var(--text); }
.check { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 2px solid var(--line-2);
  background: var(--surface); color: transparent; transition: background-color .18s ease-out, border-color .18s ease-out, transform .15s ease-out; }
.check .ic { width: 22px; height: 22px; stroke-width: 2.6; }
@media (hover: hover) { .check:hover { border-color: var(--c, var(--brand)); color: color-mix(in srgb, var(--c, var(--brand)) 45%, transparent); } }
.check:active { transform: scale(.9); }
.check[aria-pressed="true"] { background: var(--c, var(--brand)); border-color: var(--c, var(--brand)); color: #fff; }
.check.pop { animation: pop .38s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { 0% { transform: scale(.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.row.done .row-name { color: var(--text); }

/* ---------- Empty ---------- */
.empty { text-align: center; padding: 32px 20px 28px; }
.empty .art { width: 112px; height: 112px; margin: 0 auto 12px; border-radius: 32px; display: grid; place-items: center; background: var(--brand-tint); }
.empty .art img { width: 76px; height: 76px; }
.empty .art .emo-fb { font-size: 56px; }
.empty h2 { font-size: 20px; letter-spacing: -0.01em; }
.empty p { color: var(--text-2); font-size: 15px; margin: 6px auto 18px; max-width: 30ch; }
.sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; text-align: left; }
.sugg button { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border-radius: var(--r-full);
  background: var(--surface); border: 1px solid var(--line-2); font-size: 14px; font-weight: 500; transition: background-color .15s, border-color .15s; }
.sugg button:hover { background: var(--surface-2); border-color: var(--brand); }
.sugg img, .sugg .emo-fb { width: 22px; height: 22px; font-size: 17px; line-height: 22px; text-align: center; }

/* ---------- Charts / progress ---------- */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; margin-top: 8px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-col .val { font-size: 12px; font-weight: 600; color: var(--text-2); }
.bar-col .track { width: 100%; max-width: 30px; flex: 1; display: flex; align-items: flex-end; border-radius: 8px; background: var(--surface-2); }
.bar-col .fill { width: 100%; border-radius: 8px; background: color-mix(in srgb, var(--brand) 28%, var(--surface)); min-height: 4px; }
.bar-col.hi .fill { background: var(--brand); }
.bar-col.hi .val { color: var(--brand); }
.bar-col.future .track { background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--line) 4px 5px); }
.bar-col .lbl { font-size: 12px; color: var(--text-2); font-weight: 500; }
.bar-col.today .lbl { color: var(--brand); font-weight: 600; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile { padding: 16px; display: flex; flex-direction: column; }
.tile .t-head { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.tile .t-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.tile .t-ic .ic { width: 18px; height: 18px; }
.tile .t-val { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 12px; line-height: 1.1; }
.tile .t-val small { font-size: 15px; font-weight: 600; color: var(--text-2); letter-spacing: 0; }
.tile .t-note { font-size: 13px; color: var(--text-2); margin-top: 4px; overflow-wrap: anywhere; }
.mini-dots { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 12px; }
.mini-dots i { aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.mini-dots i.on { background: var(--brand); box-shadow: none; }

.month-chart { margin-top: 18px; position: relative; z-index: 1; }
.month-chart svg { width: 100%; height: 72px; }
.month-axis .lg { display: inline-flex; align-items: center; gap: 6px; }
.month-axis .lg i { width: 8px; height: 8px; border-radius: 2px; background: #fff; }
.month-axis { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.85); margin-top: 6px; }
.delta { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; letter-spacing: 0;
  background: #E8F7EE; color: #15803D; vertical-align: 8px; margin-left: 6px; }
.delta.down { background: #FDECEC; color: #B91C1C; }

.streak-row { display: grid; grid-template-columns: auto 1fr 88px; gap: 14px; align-items: center; padding: 12px 0; }
.streak-row + .streak-row { border-top: 1px solid var(--line); }
.streak-row .name { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.pbar { height: 6px; border-radius: 6px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 6px; background: var(--c, var(--brand)); }
.streak-row .fig { text-align: right; }
.streak-row .fig b { white-space: nowrap; display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 16px; font-weight: 600; }
.streak-row .fig b .ic { width: 16px; height: 16px; color: var(--flame); }
.streak-row .fig span { font-size: 13px; color: var(--text-2); }
.card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-title h2, .card-title h3 { font-size: 16px; }
.card-title .meta { font-size: 13px; color: var(--text-2); }

/* ---------- Calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.cal-head .meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.cal-nav { display: flex; gap: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.cal-dow { font-size: 12px; font-weight: 500; color: var(--text-2); text-align: center; padding-bottom: 2px; }
.cal-day { aspect-ratio: 1; min-height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; font-weight: 600;
  background: var(--surface-2); color: var(--text); position: relative; transition: transform .12s, box-shadow .12s; }
.cal-day:hover:not([disabled]) { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brand) 40%, transparent); }
.cal-day:active:not([disabled]) { transform: scale(.94); }
.cal-day.l1 { background: color-mix(in srgb, var(--brand) 14%, var(--surface)); }
.cal-day.l2 { background: color-mix(in srgb, var(--brand) 30%, var(--surface)); }
.cal-day.l3 { background: color-mix(in srgb, var(--brand) 55%, var(--surface)); color: #fff; }
.cal-day.l4 { background: var(--brand); color: #fff; }
.cal-day.is-today::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.cal-day[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand); }
.cal-day[disabled] { background: var(--surface-2); opacity: .55; color: var(--text-3); cursor: default; font-weight: 500; }
.cal-day.blank { visibility: hidden; }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 14px; font-size: 12px; color: var(--text-2); }
.legend i { width: 12px; height: 12px; border-radius: 4px; }
.legend span { margin: 0 4px; }

/* ---------- Settings ---------- */
.profile { display: flex; align-items: center; gap: 16px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex: none; }
.field { display: grid; gap: 6px; flex: 1; min-width: 0; }
.field label, .field .flabel { font-size: 13px; font-weight: 600; color: var(--text-2); }
.input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 14px; font-size: 16px;
  box-shadow: inset 0 1px 2px rgba(22,20,43,.04); transition: border-color .15s, box-shadow .15s, background-color .15s; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
.group { padding: 6px; }
.set-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px; border-radius: 12px; text-align: left; transition: background-color .15s; min-height: 60px; }
.set-row:hover { background: var(--surface-2); }
.set-row .t { flex: 1; min-width: 0; }
.set-row .t b { display: block; font-size: 15px; font-weight: 600; }
.set-row .t span { display: block; font-size: 13px; color: var(--text-2); }
.set-row .s-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.set-row .chev { color: var(--text-3); }
.set-row.danger b { color: var(--bad); }
.set-row + .set-row { margin-top: 2px; }
.foot-note { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); margin: 6px 10px 0; padding: 12px 0 8px; border-top: 1px solid var(--line); }
.foot-note .ic { width: 16px; height: 16px; }

/* ---------- Sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(22,20,43,.42); animation: fade .2s ease-out; }
.sheet { --sp: 20px; position: relative; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface);
  border-radius: 28px 28px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--sh-float); animation: up .28s cubic-bezier(.2,.8,.2,1); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -0.01em; }
.sheet .field + .field { margin-top: 18px; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emoji-opt { aspect-ratio: 1; min-height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 2px solid transparent; transition: border-color .15s, background-color .15s; }
.emoji-opt img { width: 60%; height: 60%; }
.emoji-opt .emo-fb { font-size: 20px; }
.emoji-opt:hover { background: var(--brand-tint); }
.emoji-opt[aria-checked="true"] { border-color: var(--brand); background: var(--brand-tint); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--c); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); transition: box-shadow .15s, transform .15s; }
.swatch .ic { width: 18px; height: 18px; color: #fff; stroke-width: 2.6; opacity: 0; }

.swatch[aria-checked="true"] .ic { opacity: 1; }
.swatch:active { transform: scale(.94); }
.sugg button { padding-right: 10px; white-space: nowrap; }
.sheet-actions { margin-top: 24px; display: grid; gap: 10px; }
.err { font-size: 13px; color: var(--bad); }

.detail-head { display: flex; align-items: center; gap: 14px; }
.detail-head h2 { font-size: 20px; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; }
.detail-head p { font-size: 14px; color: var(--text-2); }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.stat3 div { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat3 .k { font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat3 .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.stat3 .v small { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 0; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-template-columns: repeat(var(--w, 15), minmax(0, 22px)); gap: 4px; margin-top: 10px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.heat i.on { background: var(--c, var(--brand)); box-shadow: none; }
.heat i.none { background: var(--surface-2); box-shadow: none; opacity: .6; }
.heat i.future { background: transparent; box-shadow: none; }
.heat-wrap { display: grid; grid-template-columns: 16px auto; justify-content: start; column-gap: 6px; margin-top: 10px; }
.heat-wrap .months { grid-column: 2; display: grid; grid-template-columns: repeat(var(--w), minmax(0, 22px)); gap: 4px; font-size: 12px; color: var(--text-2); height: 18px; }
.heat-wrap .months span { white-space: nowrap; }
.heat-wrap .dows { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 11px; color: var(--text-2); align-items: center; }
.heat-wrap .heat { margin-top: 0; }
.heat i { width: 100%; }
.pb { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--brand); }
.heat-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; }
.heat-head h3 { font-size: 15px; }
.heat-head span { font-size: 13px; color: var(--text-2); }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  z-index: 60; display: flex; align-items: center; gap: 14px; background: var(--text); color: #fff; padding: 10px 10px 10px 18px; border-radius: 16px; font-size: 14px;
  box-shadow: var(--sh-float); transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { height: 36px; padding: 0 12px; border-radius: 10px; font-weight: 600; color: #C9C2FF; }
.toast button:hover { background: rgba(255,255,255,.1); }

@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.view-enter { animation: vin .25s ease-out; }
@keyframes vin { from { opacity: 0; transform: translateY(6px); } }

.only-desk { display: none; }
.today-grid, .hist-grid { display: grid; gap: 0; }
.prog-grid { display: flex; flex-direction: column; }
.pcol { display: contents; }

  .side-link:hover { background: var(--surface-2); color: var(--text); }

  .side-link[aria-current="page"] .count { background: var(--surface); color: var(--brand); }
  .side-link .count:empty { display: none; }
  .side-new { margin-top: 20px; }
  .side-user { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface-2); text-align: left; width: 100%; transition: background-color .15s; }
  .side-user:hover { background: var(--brand-tint); }
  .side-user .avatar { width: 40px; height: 40px; }
  .side-user b { display: block; font-size: 14px; font-weight: 600; }
  .side-user span { display: block; font-size: 12px; color: var(--text-2); }
  .main { max-width: 1160px; width: 100%; padding: 28px 32px 48px; margin: 0 auto; }
  .topbar { padding: 4px 0 24px; }
  .topbar h1 { font-size: 28px; }
  .avatar-btn { display: none; }
  .only-desk { display: block; }
  .only-mob { display: none; }
  .col-side { display: none; }
  .settings-wrap { max-width: 620px; }
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { --sp: 28px; border-radius: 24px; padding: 24px 28px 28px; max-height: 88dvh; animation: pop-in .22s cubic-bezier(.2,.8,.2,1); }
  .grabber { display: none; }
  .toast { bottom: 32px; }
  .card { padding: 20px; }
}
@media (min-width: 1100px) {

@media (prefers-reduced-motion: reduce) {

<script>
(() => {
'use strict';
/* ---------- Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (a, b) => Math.round((a - b) / 864e5);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const COLORS = { violet: '#7B61FF', blue: '#2F80ED', teal: '#0E9F9A', green: '#1FA45B', amber: '#E8930C', pink: '#E5487D' };
const EMOJIS = ['💧', '📚', '👟', '🧘', '💊', '📵', '🏃', '🥗', '✍️', '🎸', '🛏️', '🦷', '🍎', '☀️', '🧠', '💪'];
const SUGGESTIONS = [
  { name: 'Drink 2L of water', emoji: '💧', color: 'blue' },
  { name: 'Read 20 pages', emoji: '📚', color: 'amber' },
  { name: 'Walk 8,000 steps', emoji: '👟', color: 'green' },
  { name: 'Meditate 10 min', emoji: '🧘', color: 'violet' },
  { name: 'Take vitamins', emoji: '💊', color: 'pink' },
  { name: 'No phone in bed', emoji: '📵', color: 'teal' },
  { name: 'Floss', emoji: '🦷', color: 'blue' },
  { name: 'Journal', emoji: '✍️', color: 'amber' },
];

/* 3D emoji from a pinned CDN, native emoji fallback when offline */
let emojiCdnFailed = false;
const emojiUrl = (e) => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' + [...e].map((c) => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e) => emojiCdnFailed ? `<span class="emo-fb" aria-hidden="true">${e}</span>` : `<img src="${emojiUrl(e)}" data-e="${e}" alt="" width="28" height="28" decoding="async">`;
document.addEventListener('error', (ev) => {
  const t = ev.target;
  if (t && t.tagName === 'IMG' && t.dataset.e) {
    emojiCdnFailed = true;
    const s = document.createElement('span'); s.className = 'emo-fb'; s.setAttribute('aria-hidden', 'true'); s.textContent = t.dataset.e; t.replaceWith(s);
  }
}, true);
const chip = (h, size = '') => `<span class="chip-ic ${size}" style="--c:${COLORS[h.color] || COLORS.violet}">${emo(h.emoji)}</span>`;

const avatarSvg = () => `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="avc"><circle cx="20" cy="20" r="20"/></clipPath></defs>
  <g clip-path="url(#avc)"><rect width="40" height="40" fill="#FFE3C8"/><path d="M6 42c0-9 6-13 14-13s14 4 14 13z" fill="#5B4CF0"/>
  <rect x="17" y="23" width="6" height="7" rx="3" fill="#C98E62"/><circle cx="20" cy="17" r="7.5" fill="#C98E62"/>
  <path d="M11.5 18c-1-7 3.5-11 8.5-11s9.5 3.5 8.5 11c-1.5-3.5-4.5-5.5-8.5-5.5S13 14.5 11.5 18z" fill="#2B2118"/></g></svg>`;

/* ---------- State ---------- */
const STORE = 'tally.v1';
let state;
const uid = () => Math.random().toString(36).slice(2, 10);

function makeSample() {
  let seed = 20261115;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const t0 = today();
  const defs = [
    { name: 'Drink 2L of water', emoji: '💧', color: 'blue', streak: 23, doneToday: true, p: .82, age: 70 },
    { name: 'Read 20 pages', emoji: '📚', color: 'amber', streak: 12, doneToday: false, p: .7, age: 70 },
    { name: 'Walk 8,000 steps', emoji: '👟', color: 'green', streak: 5, doneToday: true, p: .66, age: 62 },
    { name: 'Meditate 10 min', emoji: '🧘', color: 'violet', streak: 0, doneToday: false, p: .6, age: 48 },
    { name: 'Take vitamins', emoji: '💊', color: 'pink', streak: 41, doneToday: true, p: .9, age: 70 },
  ];
  const habits = [], log = {};
  defs.forEach((d) => {
    const id = uid();
    habits.push({ id, name: d.name, emoji: d.emoji, color: d.color, created: keyOf(addDays(t0, -d.age)), sample: true });
    const days = [];
    const end = d.doneToday ? 0 : 1;
    for (let i = 0; i <= d.age; i++) {
      let done;
      if (i === 0) done = d.doneToday;
      else if (i >= end && i < end + d.streak) done = true;
      else if (i === end + d.streak) done = false;
      else done = rnd() < d.p;
      if (done) days.push(keyOf(addDays(t0, -i)));
    }
    log[id] = days;
  });
  return { name: 'Sam', habits, log, sample: true };
}

function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.habits)) return s; } } catch (e) { /* ignore */ }
  return makeSample();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { toast('Couldn’t save. Storage may be full or disabled.'); } }
state = load();
save();

/* ---------- Derived data ---------- */
const sets = new Map();
const setOf = (id) => { if (!sets.has(id)) sets.set(id, new Set(state.log[id] || [])); return sets.get(id); };
const resetSets = () => sets.clear();
const isDone = (h, k) => setOf(h.id).has(k);
const existsOn = (h, k) => h.created <= k;

function toggle(h, k) {
  const s = setOf(h.id);
  const on = !s.has(k);
  on ? s.add(k) : s.delete(k);
  state.log[h.id] = [...s].sort();
  save();
  return on;
}

function streaks(h) {
  const s = setOf(h.id);
  let cur = 0, d = today();
  if (!s.has(keyOf(d))) d = addDays(d, -1);
  while (s.has(keyOf(d))) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  [...s].sort().forEach((k) => { const dt = parseKey(k); run = prev && dayDiff(dt, prev) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = dt; });
  return { cur, best };
}
function dayStats(k) {
  const hs = state.habits.filter((h) => existsOn(h, k));
  const done = hs.filter((h) => isDone(h, k)).length;
  return { done, total: hs.length, ratio: hs.length ? done / hs.length : 0 };
}
function rangeStats(fromOffset, toOffset) {
  let done = 0, total = 0, perfect = 0;
  for (let i = fromOffset; i <= toOffset; i++) {
    const s = dayStats(keyOf(addDays(today(), -i)));
    done += s.done; total += s.total; if (s.total && s.done === s.total) perfect++;
  }
  return { done, total, pct: total ? Math.round(done / total * 100) : 0, perfect };
}
function habitPct(h, days) {
  let d = 0, t = 0;
  for (let i = 0; i < days; i++) { const k = keyOf(addDays(today(), -i)); if (existsOn(h, k)) { t++; if (isDone(h, k)) d++; } }
  return t ? Math.round(d / t * 100) : 0;
}

/* ---------- UI state ---------- */
let view = (location.hash || '#today').slice(1);
if (!['today', 'progress', 'history', 'settings'].includes(view)) view = 'today';
let selected = keyOf(today());
let calMonth = new Date(today().getFullYear(), today().getMonth(), 1);
let histSelected = keyOf(today());
let justChecked = null;

/* ---------- Components ---------- */
function habitRow(h, k) {
  const done = isDone(h, k);
  const { cur, best } = streaks(h);
  const isToday = k === keyOf(today());
  let sub;
  if (cur > 0) sub = `${icon('flame', 'flame')}<span><b class="num">${cur}-day</b> streak</span>`;
  else if (best > 0) sub = `<span>No streak · best <b class="num">${plural(best, 'day')}</b></span>`;
  else sub = `<span>Every day</span>`;
  const dLabel = isToday ? 'today' : fmt(parseKey(k), { weekday: 'long', day: 'numeric', month: 'long' });
  return `<li class="row ${done ? 'done' : ''}">
    <button class="row-main" data-detail="${h.id}" aria-label="${esc(h.name)} details">
      ${chip(h)}
      <span class="row-text"><span class="row-name">${esc(h.name)}</span><span class="row-sub">${sub}</span></span>
    </button>
    <button style="--c:${COLORS[h.color] || COLORS.violet}" class="check ${justChecked === h.id + k && done ? 'pop' : ''}" data-toggle="${h.id}" data-day="${k}" aria-pressed="${done}"
      aria-label="${esc(h.name)}: ${done ? 'done' : 'not done'} ${dLabel}">${icon('check')}</button>
  </li>`;
}

function emptyState() {
  return `<div class="card empty">
    <div class="art">${emojiCdnFailed ? '<span class="emo-fb">🌱</span>' : `<img src="${emojiUrl('🌱')}" data-e="🌱" alt="" width="76" height="76">`}</div>
    <h2>No habits yet</h2>
    <p>Add something small you want to do every day. Tick it off and your streak starts.</p>
    <button class="btn" data-action="add">${icon('plus')}Add a habit</button>
    <div class="sugg" style="margin-top:20px">${SUGGESTIONS.slice(0, 4).map((s, i) => `<button data-quick="${i}">${emo(s.emoji)}${esc(s.name)}</button>`).join('')}</div>
  </div>`;
}

function ringSvg(ratio, size = 88, stroke = 8, fg = '#fff', bg = 'rgba(255,255,255,.22)') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${stroke}"/>
    <circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${fg}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(ratio * c).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}

function weekBars() {
  const mon = mondayOf(today()), tk = keyOf(today());
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = keyOf(d), future = k > tk;
    const s = dayStats(k);
    cols.push(`<div class="bar-col ${future ? 'future' : ''} ${k === tk ? 'today' : ''} ${!future && s.total && s.done === s.total ? 'hi' : ''}">
      <span class="val num">${future || !s.total ? '–' : `${s.done}/${s.total}`}</span>
      <span class="track"><span class="fill" style="height:${future ? 0 : Math.max(4, s.ratio * 100)}%;${future ? 'min-height:0' : ''}"></span></span>
      <span class="lbl">${fmt(d, { weekday: 'narrow' })}</span></div>`);
  }
  return `<div class="bars" role="img" aria-label="Habits done each day this week">${cols.join('')}</div>`;
}

function topStreaks(limit) {
  const all = state.habits.map((h) => ({ h, ...streaks(h) }));
  const scale = Math.max(1, ...all.map((x) => x.best));
  const list = all.sort((a, b) => b.cur - a.cur || b.best - a.best).slice(0, limit);
  return list.map(({ h, cur, best }) => `<div class="streak-row">
      ${chip(h, 'sm')}
      <div style="min-width:0"><div class="name">${esc(h.name)}</div><div class="pbar" aria-hidden="true"><i style="--c:${COLORS[h.color]};width:${Math.round(cur / scale * 100)}%"></i></div></div>
      <div class="fig num"><b>${cur > 0 ? icon('flame') : ''}${plural(cur, 'day')}</b><span>Best ${best}</span></div>
    </div>`).join('');
}

/* ---------- Views ---------- */
function renderToday() {
  const tk = keyOf(today());
  if (selected > tk) selected = tk;
  const mon = mondayOf(today());
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = keyOf(d), future = k > tk, s = dayStats(k);
    const pct = !future && s.total ? Math.round(s.ratio * 100) : 0;
    week.push(`<button class="day ${k === tk ? 'is-today' : ''}" data-select="${k}" aria-pressed="${k === selected}" ${future ? 'disabled' : ''}
      aria-label="${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${future ? '' : `, ${s.done} of ${s.total} done`}">
      <span class="dl">${fmt(d, { weekday: 'short' }).slice(0, 3)}</span><span class="dn num">${d.getDate()}</span><span class="dot" style="--p:${pct}%"><i></i></span></button>`);
  }
  const habits = state.habits.filter((h) => existsOn(h, selected));
  const s = dayStats(selected);
  const isToday = selected === tk;
  const dayName = isToday ? 'Today' : fmt(parseKey(selected), { weekday: 'long', day: 'numeric', month: 'short' });
  const left = s.total - s.done;
  const wk = (() => { let p = 0; for (let i = 0; i < 7; i++) { const k = keyOf(addDays(mon, i)); if (k > tk) break; const x = dayStats(k); if (x.total && x.done === x.total) p++; } return p; })();
  const longest = state.habits.map((h) => ({ h, cur: streaks(h).cur })).sort((a, b) => b.cur - a.cur)[0];

  if (!state.habits.length) return `<div class="view-enter">${emptyState()}</div>`;

  const summary = `<section class="summary" aria-label="${dayName} summary">
    <div class="summary-top">
      <div>
        <p class="label">${dayName}</p>
        <p class="big num">${s.done} <small>of ${s.total} done</small></p>
        <p class="sub">${s.total === 0 ? 'No habits on this day' : left === 0 ? 'Every habit done' : `${plural(left, 'habit')} left${isToday ? ' today' : ''}`}</p>
      </div>
      <div class="ring">${ringSvg(s.ratio)}<span class="num">${Math.round(s.ratio * 100)}%</span></div>
    </div>
    <div class="summary-stats">
      <div><p class="k">Perfect days this week</p><p class="v num">${wk}</p></div>
      <div><p class="k">Longest streak</p><p class="v num">${longest && longest.cur ? plural(longest.cur, 'day') : '–'}</p></div>
    </div>
  </section>`;

  const list = `<section class="section">
    <div class="section-head">
      <h2>${isToday ? 'Your habits' : esc(fmt(parseKey(selected), { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>
      ${isToday ? '' : `<button class="link" data-select="${tk}">Back to today</button>`}
    </div>
    ${habits.length ? `<ul class="list" style="list-style:none;margin:0;padding:0">${habits.map((h) => habitRow(h, selected)).join('')}</ul>`
      : `<div class="card" style="color:var(--text-2);font-size:15px">None of your habits had started yet on this day.</div>`}
  </section>`;

  const side = `<div class="col-side only-desk">
    <section class="card"><div class="card-title"><h2>This week</h2><span class="meta">${fmt(mon, { day: 'numeric', month: 'short' })} – ${fmt(addDays(mon, 6), { day: 'numeric', month: 'short' })}</span></div>${weekBars()}</section>
    <section class="card" style="padding-bottom:8px"><div class="card-title"><h2>Current streaks</h2><button class="link" data-view="progress">Progress</button></div>${topStreaks(99)}</section>
  </div>`;

  return `<div class="today-grid view-enter"><div><div class="week" role="group" aria-label="This week">${week.join('')}</div>${summary}${list}</div>${side}</div>`;
}

function renderProgress() {
  if (!state.habits.length) return `<div class="view-enter">${emptyState()}</div>`;
  const last = rangeStats(0, 29), prev = rangeStats(30, 59);
  const delta = prev.total ? last.pct - prev.pct : null;
  // 30-day bars, oldest first
  const vals = []; for (let i = 29; i >= 0; i--) vals.push(dayStats(keyOf(addDays(today(), -i))).ratio);
  const W = 300, H = 72, bw = 6, gap = (W - bw * 30) / 29;
  const bars = vals.map((v, i) => { const h = Math.max(3, v * (H - 2)); return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="#fff" fill-opacity="${v === 1 ? .95 : .4}"/>`; }).join('');
  const all = state.habits.map((h) => ({ h, ...streaks(h) }));
  const bestH = all.slice().sort((a, b) => b.best - a.best)[0];
  const perfDots = []; for (let i = 13; i >= 0; i--) { const s = dayStats(keyOf(addDays(today(), -i))); perfDots.push(`<i class="${s.total && s.done === s.total ? 'on' : ''}"></i>`); }

  // weekday consistency, last 8 weeks
  const wd = Array.from({ length: 7 }, () => ({ d: 0, t: 0 }));
  for (let i = 0; i < 56; i++) { const dt = addDays(today(), -i); const s = dayStats(keyOf(dt)); const idx = (dt.getDay() + 6) % 7; wd[idx].d += s.done; wd[idx].t += s.total; }
  const wdPct = wd.map((x) => x.t ? Math.round(x.d / x.t * 100) : 0);
  const maxI = wdPct.indexOf(Math.max(...wdPct));
  const mon = mondayOf(today());
  const wdCols = wdPct.map((p, i) => `<div class="bar-col ${i === maxI ? 'hi' : ''}"><span class="val num">${p}%</span><span class="track"><span class="fill" style="height:${Math.max(4, p)}%"></span></span><span class="lbl">${fmt(addDays(mon, i), { weekday: 'narrow' })}</span></div>`).join('');
  const bestDay = fmt(addDays(mon, maxI), { weekday: 'long' });

  return `<div class="prog-grid view-enter">
    <div class="pcol">
    <div class="o1">
      <section class="summary" aria-label="Last 30 days">
        <div class="summary-top">
          <div><p class="label">Completion · last 30 days</p><p class="big num">${last.pct}<small>%</small>${delta !== null ? `<span class="delta ${delta < 0 ? 'down' : ''}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} pts</span>` : ''}</p>
            <p class="sub num">${last.done} of ${last.total} check-ins${delta !== null ? ' · vs previous 30 days' : ''}</p></div>
        </div>
        <div class="month-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily completion over the last 30 days, ${last.pct}% overall">${bars}</svg>
          <div class="month-axis"><span>${fmt(addDays(today(), -29), { day: 'numeric', month: 'short' })}</span><span class="lg"><i></i>Perfect day</span><span>Today</span></div></div>
      </section>
    </div>
    <div class="o3">
      <section class="section card">
        <div class="card-title"><h2>By day of week</h2><span class="meta">Last 8 weeks</span></div>
        <p style="font-size:14px;color:var(--text-2);margin-top:4px">Most consistent on ${bestDay}s</p>
        <div class="bars" role="img" aria-label="Completion by weekday, best on ${bestDay}">${wdCols}</div>
      </section>
    </div>
    </div>
    <div class="pcol">
    <div class="o2">
      <div class="tiles">
        <div class="card tile">
          <div class="t-head"><span class="t-ic" style="background:var(--ok-tint);color:var(--ok)">${icon('star')}</span>Perfect days</div>
          <div class="t-val num">${last.perfect} <small>in 30 days</small></div>
          <div class="mini-dots" role="img" aria-label="Perfect days in the last 14 days">${perfDots.join('')}</div><div class="t-note">Last 14 days</div>
        </div>
        <div class="card tile">
          <div class="t-head"><span class="t-ic" style="background:var(--warn-tint);color:var(--warn)">${icon('trophy')}</span>Best streak</div>
          <div class="t-val num">${bestH.best} <small>days</small></div>
          <div class="t-note">${esc(bestH.h.name)}</div>
        </div>
      </div>
    </div>
    <div class="o4">
      <section class="section card" style="padding-bottom:8px">
        <div class="card-title"><h2>Streaks</h2><span class="meta">Current · best</span></div>
        ${topStreaks(99)}
      </section>
    </div>
    </div>
  </div>`;
}

function renderHistory() {
  if (!state.habits.length) return `<div class="view-enter">${emptyState()}</div>`;
  const tk = keyOf(today());
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), daysIn = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const mon = mondayOf(today());
  const dows = Array.from({ length: 7 }, (_, i) => `<span class="cal-dow" aria-hidden="true">${fmt(addDays(mon, i), { weekday: 'narrow' })}</span>`).join('');
  let cells = '', perfect = 0, done = 0, total = 0;
  for (let i = 0; i < lead; i++) cells += `<span class="cal-day blank" aria-hidden="true"></span>`;
  for (let d = 1; d <= daysIn; d++) {
    const dt = new Date(y, m, d), k = keyOf(dt), future = k > tk, s = dayStats(k);
    let lvl = '';
    if (!future && s.total) { done += s.done; total += s.total; if (s.done === s.total) perfect++; lvl = s.ratio === 0 ? '' : s.ratio < .5 ? 'l1' : s.ratio < .8 ? 'l2' : s.ratio < 1 ? 'l3' : 'l4'; }
    cells += `<button class="cal-day num ${lvl} ${k === tk ? 'is-today' : ''}" data-hist="${k}" aria-pressed="${k === histSelected}" ${future ? 'disabled' : ''}
      aria-label="${fmt(dt, { weekday: 'long', day: 'numeric', month: 'long' })}${future || !s.total ? '' : `, ${s.done} of ${s.total} done`}">${d}</button>`;
  }
  const atCurrent = y === today().getFullYear() && m === today().getMonth();
  const earliest = state.habits.reduce((a, h) => h.created < a ? h.created : a, tk);
  const canPrev = keyOf(first) > earliest;
  const sel = parseKey(histSelected), ss = dayStats(histSelected);
  const hs = state.habits.filter((h) => existsOn(h, histSelected));
  const legend = ['var(--surface-2)', 'color-mix(in srgb, var(--brand) 14%, #fff)', 'color-mix(in srgb, var(--brand) 30%, #fff)', 'color-mix(in srgb, var(--brand) 55%, #fff)', 'var(--brand)'];

  return `<div class="hist-grid view-enter">
    <section class="card">
      <div class="cal-head">
        <div><h2>${fmt(first, { month: 'long', year: 'numeric' })}</h2><p class="meta num">${total ? `${plural(perfect, 'perfect day')} · ${Math.round(done / total * 100)}% complete` : 'No check-ins this month'}</p></div>
        <div class="cal-nav">
          <button class="icon-btn" data-month="-1" aria-label="Previous month" ${canPrev ? '' : 'disabled style="opacity:.4;cursor:default"'}>${icon('left')}</button>
          <button class="icon-btn" data-month="1" aria-label="Next month" ${atCurrent ? 'disabled style="opacity:.4;cursor:default"' : ''}>${icon('right')}</button>
        </div>
      </div>
      <div class="cal-grid">${dows}${cells}</div>
      <div class="legend" aria-hidden="true"><span>Less</span>${legend.map((c) => `<i style="background:${c}"></i>`).join('')}<span>More</span></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>${esc(fmt(sel, { weekday: 'long', day: 'numeric', month: 'long' }))}</h2><span class="meta num">${ss.done} of ${ss.total}</span></div>
      ${hs.length ? `<ul class="list" style="list-style:none;margin:0;padding:0">${hs.map((h) => habitRow(h, histSelected)).join('')}</ul>`
        : `<div class="card" style="color:var(--text-2);font-size:15px">None of your habits had started yet on this day.</div>`}
    </section>
  </div>`;
}

function renderSettings() {
  return `<div class="settings-wrap view-enter">
    <section><div class="section-head"><h2>Profile</h2></div><div class="card">
      <div class="profile"><span class="avatar">${avatarSvg()}</span>
        <div class="field"><label for="name-in">Your name</label><input class="input" id="name-in" maxlength="24" autocomplete="given-name" value="${esc(state.name || '')}" placeholder="Your first name"></div>
      </div>
    </div></section>
    <section class="section settings-data">
      <div class="section-head"><h2>Data</h2></div>
      <div class="card group">
        <button class="set-row" data-action="export"><span class="s-ic" style="background:var(--brand-tint);color:var(--brand)">${icon('download')}</span>
          <span class="t"><b>Export data</b><span>Save a JSON backup of your habits</span></span>${icon('right', 'chev')}</button>
        ${state.habits.some((h) => h.sample) ? `<button class="set-row" data-action="clear-sample"><span class="s-ic" style="background:var(--warn-tint);color:var(--warn)">${icon('broom')}</span>
          <span class="t"><b>Clear sample data</b><span>Remove the example habits and start fresh</span></span>${icon('right', 'chev')}</button>` : ''}
        <button class="set-row danger" data-action="wipe"><span class="s-ic" style="background:var(--bad-tint);color:var(--bad)">${icon('trash')}</span>
          <span class="t"><b>Delete all data</b><span>Remove every habit and check-in</span></span>${icon('right', 'chev')}</button>
        <p class="foot-note">${icon('lock')}Saved in this browser on this device only.</p>
      </div>
    </section>

}

function greeting() {
  const h = new Date().getHours();
  const part = h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return state.name ? `${part}, ${state.name}` : part;
}

function render() {
  resetSets();
  const titles = { today: greeting(), progress: 'Progress', history: 'History', settings: 'Settings' };
  $('#title').textContent = titles[view];
  $('#eyebrow').textContent = view === 'today' ? fmt(today(), { weekday: 'long', day: 'numeric', month: 'long' })
    : '';
  $('#eyebrow').hidden = view !== 'today';
  document.querySelector('.avatar-btn').hidden = view === 'settings';
  const html = { today: renderToday, progress: renderProgress, history: renderHistory, settings: renderSettings }[view]();
  $('#view').innerHTML = html;
  document.querySelectorAll('.tab, .side-link').forEach((b) => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('[data-avatar]').forEach((el) => { el.innerHTML = avatarSvg(); });
  document.querySelectorAll('[data-username]').forEach((el) => { el.textContent = state.name || 'You'; });
  const ts = dayStats(keyOf(today()));
  $('#side-count').textContent = state.habits.length ? `${ts.done}/${ts.total}` : '';
  $('#side-user-sub').textContent = state.habits.length ? `${plural(state.habits.length, 'habit')}` : 'No habits yet';
  justChecked = null;
}

function go(v) {
  if (v === view) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  view = v; history.replaceState(null, '', '#' + v); render(); window.scrollTo(0, 0);
}

/* ---------- Sheet ---------- */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $('#sheet-body').innerHTML = `<div class="grabber" aria-hidden="true"></div>${html}`;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  const f = $('#sheet-body').querySelector('[autofocus], input, button:not([data-close])') || $('#sheet-body button');
  setTimeout(() => f && f.focus({ preventScroll: true }), 30);
}
function closeSheet() {
  $('#sheet').hidden = true; document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}

let form = null;
function openForm(h, preset) {
  form = h ? { id: h.id, name: h.name, emoji: h.emoji, color: h.color } : { id: null, name: preset?.name || '', emoji: preset?.emoji || '💧', color: preset?.color || 'violet' };
  drawForm();
}
function drawForm() {
  const editing = !!form.id;
  openSheet(`<div class="sheet-head"><h2 id="sheet-title">${editing ? 'Edit habit' : 'New habit'}</h2>
      <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <form id="habit-form" novalidate>
      <div class="field"><label for="h-name">Name</label>
        <input class="input" id="h-name" maxlength="40" placeholder="e.g. Read 20 pages" value="${esc(form.name)}" autocomplete="off" required>
        <span class="err" id="h-err" hidden>Give your habit a name.</span></div>
      ${editing ? '' : `<div class="field"><span class="flabel">Suggestions</span><div class="sugg">${SUGGESTIONS.slice(0, 6).map((s, i) => `<button type="button" data-sugg="${i}">${emo(s.emoji)}${esc(s.name)}</button>`).join('')}</div></div>`}
      <div class="field"><span class="flabel" id="lbl-icon">Icon</span>
        <div class="emoji-grid" role="radiogroup" aria-labelledby="lbl-icon">${EMOJIS.map((e) => `<button type="button" class="emoji-opt" role="radio" aria-checked="${e === form.emoji}" data-emoji="${e}" aria-label="${e}">${emo(e)}</button>`).join('')}</div></div>
      <div class="field"><span class="flabel" id="lbl-col">Colour</span>
        <div class="swatches" role="radiogroup" aria-labelledby="lbl-col">${Object.entries(COLORS).map(([n, c]) => `<button type="button" class="swatch" role="radio" style="--c:${c}" aria-checked="${n === form.color}" data-color="${n}" aria-label="${n}">${icon('check')}</button>`).join('')}</div></div>
      <div class="sheet-actions"><button class="btn block" type="submit">${editing ? 'Save changes' : 'Add habit'}</button></div>
    </form>`);
  const inp = $('#h-name');
  inp.addEventListener('input', () => { form.name = inp.value; $('#h-err').hidden = true; });
  $('#habit-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = inp.value.trim();
    if (!name) { $('#h-err').hidden = false; inp.focus(); return; }
    if (form.id) {
      const h = state.habits.find((x) => x.id === form.id); Object.assign(h, { name, emoji: form.emoji, color: form.color });
      save(); closeSheet(); render(); toast('Habit updated');
    } else {
      const h = { id: uid(), name, emoji: form.emoji, color: form.color, created: keyOf(today()) };
      state.habits.push(h); state.log[h.id] = []; save(); closeSheet();
      selected = keyOf(today()); if (view === 'settings') view = 'today', history.replaceState(null, '', '#today');
      render(); toast(`Added “${name}”`);
    }
  });
}

function openDetail(h) {
  const { cur, best } = streaks(h);
  const pct = habitPct(h, 30);
  const tk = keyOf(today());
  const weeks = Math.max(8, Math.min(15, Math.floor(dayDiff(mondayOf(today()), mondayOf(parseKey(h.created))) / 7) + 1));
  const start = addDays(mondayOf(today()), -(weeks - 1) * 7);
  let cells = '', count = 0, months = '', lastM = -1;
  for (let w = 0; w < weeks; w++) {
    const wd = addDays(start, w * 7);
    const m = addDays(wd, 6).getMonth();
    months += `<span>${m !== lastM && w < weeks - 1 ? fmt(addDays(wd, 6), { month: 'short' }) : ''}</span>`; lastM = m;
  }
  for (let i = 0; i < weeks * 7; i++) {
    const k = keyOf(addDays(start, i));
    const cls = k > tk ? 'future' : !existsOn(h, k) ? 'none' : isDone(h, k) ? 'on' : '';
    if (cls === 'on') count++;
    cells += `<i class="${cls}"></i>`;
  }
  const dows = [0, 1, 2, 3, 4, 5, 6].map((i) => `<span>${[0, 2, 4].includes(i) ? fmt(addDays(mondayOf(today()), i), { weekday: 'narrow' }) : ''}</span>`).join('');
  const doneToday = isDone(h, tk);
  openSheet(`<div class="sheet-head"><div class="detail-head">${chip(h, 'lg')}<div><h2 id="sheet-title">${esc(h.name)}</h2>
      <p>Every day · since ${fmt(parseKey(h.created), { day: 'numeric', month: 'short' })}</p></div></div>
      <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="stat3">
      <div><p class="k">Current streak</p><p class="v num">${cur} <small>${cur === 1 ? 'day' : 'days'}</small></p>${cur > 0 && cur === best ? '<span class="pb">Personal best</span>' : ''}</div>
      <div><p class="k">Best streak</p><p class="v num">${best} <small>${best === 1 ? 'day' : 'days'}</small></p></div>
      <div><p class="k">Last 30 days</p><p class="v num">${pct}<small>%</small></p></div>
    </div>
    <div class="heat-head"><h3>Last ${weeks} weeks</h3><span class="num">${plural(count, 'check-in')}</span></div>
    <div class="heat-wrap" style="--w:${weeks};--c:${COLORS[h.color]}"><div class="months" aria-hidden="true">${months}</div><div class="dows" aria-hidden="true">${dows}</div>
      <div class="heat" role="img" aria-label="${count} check-ins in the last ${weeks} weeks">${cells}</div></div>
    <div class="sheet-actions" style="margin-top:20px">
      <button class="btn block ${doneToday ? 'done-state' : ''}" data-detail-toggle="${h.id}" aria-pressed="${doneToday}">${icon('check')}${doneToday ? 'Done today' : 'Mark done today'}</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn ghost" data-edit="${h.id}">${icon('edit')}Edit</button>
        <button class="btn danger-ghost" data-delete="${h.id}">${icon('trash')}Delete</button>
      </div>
    </div>`);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actionLabel, onAction) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
  if (actionLabel) t.querySelector('button').onclick = () => { onAction(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 5000 : 2200);
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-close]');
  if (!el) return;
  const d = el.dataset;
  if ('close' in d) return closeSheet();
  if (d.view) return go(d.view);
  if (d.toggle) {
    const h = state.habits.find((x) => x.id === d.toggle); if (!h) return;
    const on = toggle(h, d.day); if (on) justChecked = h.id + d.day;
    if (on && navigator.vibrate) navigator.vibrate(8);
    render();
    const btn = document.querySelector(`[data-toggle="${h.id}"][data-day="${d.day}"]`); if (btn) btn.focus({ preventScroll: true });
    return;
  }
  if (d.select) { selected = d.select; render(); return; }
  if (d.hist) { histSelected = d.hist; render(); return; }
  if (d.month) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(d.month), 1); render(); return; }
  if (d.detail) { const h = state.habits.find((x) => x.id === d.detail); if (h) openDetail(h); return; }
  if (d.detailToggle) { const h = state.habits.find((x) => x.id === d.detailToggle); toggle(h, keyOf(today())); resetSets(); render(); openDetail(h); return; }
  if (d.edit) { const h = state.habits.find((x) => x.id === d.edit); openForm(h); return; }
  if (d.delete) {
    const idx = state.habits.findIndex((x) => x.id === d.delete); const h = state.habits[idx]; const days = state.log[h.id];
    state.habits.splice(idx, 1); delete state.log[h.id]; save(); closeSheet(); render();
    toast(`Deleted “${h.name}”`, 'Undo', () => { state.habits.splice(idx, 0, h); state.log[h.id] = days; save(); render(); });
    return;
  }
  if (d.quick) { openForm(null, SUGGESTIONS[d.quick]); return; }
  if (d.sugg) { const s = SUGGESTIONS[d.sugg]; Object.assign(form, { name: s.name, emoji: s.emoji, color: s.color }); drawForm(); return; }
  if (d.emoji) { form.emoji = d.emoji; form.name = $('#h-name').value; el.parentElement.querySelectorAll('[role=radio]').forEach((b) => b.setAttribute('aria-checked', b === el)); return; }
  if (d.color) { form.color = d.color; el.parentElement.querySelectorAll('[role=radio]').forEach((b) => b.setAttribute('aria-checked', b === el)); return; }
  if (d.action === 'add') { openForm(null); return; }
  if (d.action === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tally-habits-${keyOf(today())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Export downloaded'); return;
  }
  if (d.action === 'clear-sample') {
    if (!confirm('Remove the example habits and their history?')) return;
    state.habits.filter((h) => h.sample).forEach((h) => delete state.log[h.id]);
    state.habits = state.habits.filter((h) => !h.sample); state.sample = false; save(); go('today'); render(); toast('Sample data cleared'); return;
  }
  if (d.action === 'wipe') {
    if (!confirm('Delete all habits and history? This can’t be undone.')) return;
    state = { name: state.name, habits: [], log: {}, sample: false }; save(); go('today'); render(); toast('All data deleted'); return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'name-in') {
    state.name = e.target.value.trim(); save();
    document.querySelectorAll('[data-username]').forEach((el) => { el.textContent = state.name || 'You'; });
  }
});

document.addEventListener('keydown', (e) => {
  if ($('#sheet').hidden) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...$('#sheet-body').querySelectorAll('button, input')].filter((x) => !x.disabled && x.offsetParent);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// Roll over to a new day if the app stays open past midnight
let lastDay = keyOf(today());
const checkDay = () => { const k = keyOf(today()); if (k !== lastDay) { lastDay = k; selected = k; histSelected = k; calMonth = new Date(today().getFullYear(), today().getMonth(), 1); render(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (['today','progress','history','settings'].includes(v) && v !== view) { view = v; render(); window.scrollTo(0, 0); } });
window.addEventListener('storage', (e) => { if (e.key === STORE) { state = load(); render(); } });

render();
})();
</script>
</body>
</html>
