<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F1">
<title>Setwise · Today's workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean — warm light-grey canvas, white cards, one near-black summary card, orange brand for progress, ticks and active states. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F4F4F1; --surface: #FFFFFF; --surface-2: #F6F6F3; --line: #EAE9E4; --line-2: #DEDDD7;
  --text: #16161A; --text-2: #66666E; --text-3: #9A9AA2;
  --brand: #F0531C; --brand-ink: #C2410C; --brand-tint: #FFEEE6; --brand-line: #FFC9B3;
  --dark: #17171C; --dark-2: #24242B;
  --ok: #15803D; --ok-tint: #E8F7EE; --bad: #C81E1E; --bad-tint: #FDECEC;
  --c-orange: #EA580C; --c-violet: #7C5CFA; --c-blue: #2F7CF6; --c-green: #16A37A; --c-pink: #DB2777; --c-amber: #D97706; --c-teal: #0E9F9A;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(28,24,20,.05), 0 1px 1px rgba(28,24,20,.03);
  --sh-2: 0 1px 2px rgba(28,24,20,.04), 0 8px 24px -12px rgba(28,24,20,.12);
  --sh-float: 0 12px 32px -8px rgba(28,24,20,.20);
  --tabbar-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.main { padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }
.screen[hidden] { display: none; }

.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav .brand, .nav .next { display: none; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 600px; margin: 0 auto; height: var(--tabbar-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; color: var(--text-2); font-size: 12px; font-weight: 500; transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand-ink); }
.tab[aria-current="page"] .ic { stroke-width: 2; color: var(--brand); }
.tab:active .ic { transform: scale(.92); }

/* ---------- Header ---------- */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 16px; }
.head .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE3D3; flex: none; overflow: hidden; display: grid; place-items: center; font-weight: 600; color: var(--brand-ink); border: 0; padding: 0; box-shadow: 0 0 0 2px var(--surface), var(--sh-1); }
.avatar img { width: 100%; height: 100%; }

/* ---------- Week strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 8px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--sh-1); }
.day .d { font-size: 12px; color: var(--text-2); font-weight: 500; }
.day .n { font-size: 16px; font-weight: 600; }
.day .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px; }
.day.trained .dot { background: var(--brand); }
.day.future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.day.future .n { color: var(--text-2); }
.day.is-today { background: var(--dark); color: #fff; box-shadow: var(--sh-2); }
.day.is-today .d { color: rgba(255,255,255,.72); }
.day.is-today .dot { background: rgba(255,255,255,.3); }
.day.is-today.trained .dot { background: #FF7A45; }

/* ---------- Summary card ---------- */
.summary { position: relative; overflow: hidden; background: var(--dark); color: #fff; border-radius: var(--r-lg); padding: 20px; box-shadow: 0 2px 4px rgba(20,16,12,.08), 0 18px 36px -16px rgba(20,16,12,.45); isolation: isolate; }
.summary::before { content: ""; position: absolute; z-index: -1; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,83,28,.30), rgba(240,83,28,0)); }
.summary .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.summary .label { font-size: 14px; color: rgba(255,255,255,.72); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { background: rgba(255,122,69,.16); color: #FF9A70; }
.pill.idle { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
.pill.done { background: rgba(74,222,128,.14); color: #6EE7A0; }
.summary .mid { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; }
.summary .big { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.summary .big small { font-size: 18px; font-weight: 500; color: rgba(255,255,255,.72); letter-spacing: 0; }
.summary .sub { font-size: 14px; color: rgba(255,255,255,.72); margin-top: 4px; }
.ring { width: 84px; height: 84px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: rgba(255,255,255,.1); }
.ring .bar { stroke: var(--brand); stroke-linecap: round; transition: stroke-dasharray .5s cubic-bezier(.2,.8,.2,1); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.summary .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
.summary .stats div + div { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.1); }
.summary .stats dt { font-size: 12px; color: rgba(255,255,255,.66); }
.summary .stats dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
.summary dl { margin: 0; }

/* ---------- Sections and cards ---------- */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }
.sec-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.sec-head .meta { font-size: 14px; color: var(--text-2); }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-2); }

.ex-list { display: grid; gap: 12px; }
.ex { padding: 0; overflow: hidden; }
.ex-top { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 12px 12px 16px; background: none; border: 0; text-align: left; border-radius: var(--r-lg) var(--r-lg) 0 0; transition: background-color .15s ease-out; }
@media (hover: hover) { .ex-top:hover { background: var(--surface-2); } }
.chip-ic { --c: var(--c-orange); width: 44px; height: 44px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: color-mix(in srgb, var(--c) 88%, #000); }
.chip-ic .ic { width: 22px; height: 22px; }
.ex-name { flex: 1; min-width: 0; }
.ex-name b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-name span { display: block; font-size: 14px; color: var(--text-2); margin-top: 2px; }
.count { font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); height: 26px; padding: 0 10px; border-radius: var(--r-full); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.count.full { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
.count.full .ic { width: 14px; height: 14px; stroke-width: 2.5; }
.ex-top > .ic { color: var(--text-3); }
.sets { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 8px; padding: 0 16px 16px; }
.set { container-type: inline-size; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 60px; padding: 10px 10px 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); text-align: left; transition: background-color .15s ease-out, border-color .15s ease-out, transform .1s ease-out; }
.set:active { transform: scale(.97); }
@media (hover: hover) { .set:hover { border-color: var(--line-2); } }
.set .r { font-size: 16px; font-weight: 600; line-height: 1.25; }
.set .r small { font-size: 13px; font-weight: 500; color: var(--text-2); }
@container (max-width: 88px) { .set .r small { display: none; } }
.set .w { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.set .tick { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; background: var(--surface); transition: background-color .15s ease-out, border-color .15s ease-out; }
.set .tick .ic { width: 12px; height: 12px; stroke-width: 3; color: #fff; opacity: 0; transform: scale(.5); transition: opacity .15s ease-out, transform .2s cubic-bezier(.3,1.6,.5,1); }
.set[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand-line); }
.set[aria-pressed="true"] .tick { background: var(--brand); border-color: var(--brand); }
.set[aria-pressed="true"] .tick .ic { opacity: 1; transform: scale(1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); border: 0; font-weight: 600; font-size: 16px; background: var(--dark); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(20,16,12,.2), 0 8px 18px -8px rgba(20,16,12,.5); transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
@media (hover: hover) { .btn:hover { transform: translateY(-1px); } }
.btn:active { transform: scale(.98); }
.btn:disabled { background: var(--line-2); color: var(--text-2); box-shadow: none; cursor: not-allowed; transform: none; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.brand { background: var(--brand-ink); }
.btn.danger { background: var(--bad); }
.btn .ic { width: 18px; height: 18px; stroke-width: 2.25; }
.finish { margin-top: 16px; }
.finish-note { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 10px; }
.link { background: none; border: 0; padding: 4px 2px; color: var(--brand-ink); font-weight: 600; font-size: 14px; border-radius: 6px; }

/* ---------- This week ---------- */
.week-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.week-top .fig { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.week-top .fig small { font-size: 16px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.week-top p { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.streak { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 8px; border-radius: var(--r-full); background: var(--brand-tint); color: var(--brand-ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.streak .ic { width: 16px; height: 16px; color: var(--brand); }
.goalbar { display: grid; grid-template-columns: repeat(var(--g, 4), 1fr); gap: 4px; margin: 14px 0 4px; }
.goalbar i { height: 6px; border-radius: var(--r-full); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.goalbar i.on { background: var(--brand); box-shadow: none; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 148px; margin-top: 18px; align-items: end; }
.bcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.bcol .v { font-size: 12px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.bcol .b { width: 100%; max-width: 32px; border-radius: 8px; background: #FFD8C7; min-height: 4px; }
.bcol .b.rest { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); height: 4px; }
.bcol .b.now { background: var(--brand); }
.bcol .b.now.partial { background: repeating-linear-gradient(135deg, var(--brand) 0 6px, #FF7E4F 6px 10px); }
.bcol .d { font-size: 12px; color: var(--text-2); font-weight: 500; }
.bcol .d.cur { color: var(--text); font-weight: 600; }
.wstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.wstat { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; }
.wstat .chip-ic { width: 36px; height: 36px; border-radius: 10px; }
.wstat .chip-ic .ic { width: 18px; height: 18px; }
.wstat dt { font-size: 12px; color: var(--text-2); }
.wstat dd { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
.wstat dl { margin: 0; min-width: 0; }
.delta { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-full); margin-left: 4px; vertical-align: 2px; }
.delta.up { background: var(--ok-tint); color: var(--ok); }
.delta.down { background: var(--bad-tint); color: var(--bad); }

/* ---------- Today layout ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr); }
.today .side { display: contents; }
.today .a-head { order: 1; } .today .a-strip { order: 2; } .today .a-summary { order: 3; } .today .a-list { order: 4; } .today .a-week { order: 5; }

/* ---------- Page titles for other tabs ---------- */
.page-title { padding: 4px 0 16px; }
.page-title h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.page-title p { font-size: 14px; color: var(--text-2); margin-top: 2px; }

/* Progress */
.prog { display: grid; gap: 12px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head h2 { font-size: 16px; font-weight: 600; }
.card-head .k { font-size: 14px; color: var(--text-2); }
.kfig { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.2; }
.kfig small { font-size: 14px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.vchart { position: relative; margin-top: 16px; height: 168px; }
.vchart .grid { position: absolute; inset: 8px 0 24px 0; pointer-events: none; }
.vchart .grid span { position: absolute; left: 36px; right: 0; border-top: 1px dashed var(--line-2); }
.vchart .grid span:last-child { border-top-style: solid; }
.vchart .grid em { position: absolute; left: -36px; top: 0; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--text-2); line-height: 1; }
.vchart .cols { position: absolute; inset: 0 0 0 44px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; }
.vchart .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.vchart .col .b { width: 100%; max-width: 28px; border-radius: 7px 7px 4px 4px; background: #E9E6E0; }
.vchart .col .b.cur { background: repeating-linear-gradient(135deg, var(--brand) 0 6px, #FF7E4F 6px 10px); }
.vchart .col .d { font-size: 12px; color: var(--text-2); white-space: nowrap; height: 18px; }
.legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 10px; }
.tile .t-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile .t-fig { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.tile .t-fig small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.tile .t-sub { font-size: 13px; color: var(--text-2); }
.heat { display: grid; grid-template-columns: 32px repeat(8, minmax(0, 36px)); justify-content: space-between; gap: 6px; margin-top: 14px; }
.heat .hl { font-size: 12px; color: var(--text-2); display: flex; align-items: center; }
.heat .c { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.heat .c.l1 { background: #FFE2D5; box-shadow: none; } .heat .c.l2 { background: #FFB896; box-shadow: none; }
.heat .c.l3 { background: #FF8A57; box-shadow: none; } .heat .c.l4 { background: var(--brand); box-shadow: none; }
.heat .c.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: .5; }
.heat .c.tod { outline: 2px solid var(--dark); outline-offset: 1px; }
.heat .hx { font-size: 12px; color: var(--text-2); text-align: center; white-space: nowrap; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .r-main { flex: 1; min-width: 0; }
.row .r-main b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.row .r-main span { display: block; font-size: 14px; color: var(--text-2); }
.row .r-end { text-align: right; flex: none; }
.row .r-end b { display: block; font-size: 16px; font-weight: 600; }
.row .r-end span { display: block; font-size: 13px; color: var(--text-2); }
.emo { width: 44px; height: 44px; border-radius: var(--r-sm); display: grid; place-items: center; background: #FFF3D6; flex: none; font-size: 24px; }
.emo img { width: 28px; height: 28px; }

/* History */
.hgroup + .hgroup { margin-top: 20px; }
.hgroup h2 { font-size: 14px; font-weight: 600; color: var(--text-2); margin: 0 4px 8px; display: flex; justify-content: space-between; }
.hgroup .card { padding: 4px 16px; }
.empty { text-align: center; padding: 40px 24px; }
.empty img, .empty .em { width: 96px; height: 96px; margin: 0 auto 16px; font-size: 64px; display: grid; place-items: center; }
.empty h2 { font-size: 18px; font-weight: 600; }
.empty p { font-size: 14px; color: var(--text-2); margin: 6px auto 20px; max-width: 32ch; }

/* Profile */
.profile { display: flex; align-items: center; gap: 16px; }
.profile .avatar { width: 64px; height: 64px; font-size: 22px; }
.profile b { display: block; font-size: 18px; font-weight: 600; }
.profile span { font-size: 14px; color: var(--text-2); }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; }
.pstats div + div { border-left: 1px solid var(--line); }
.pstats b { display: block; font-size: 18px; font-weight: 600; }
.pstats span { font-size: 13px; color: var(--text-2); }
.group-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin: 24px 4px 8px; }
.srow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 0; background: none; border: 0; text-align: left; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow .chip-ic { width: 36px; height: 36px; border-radius: 10px; }
.srow .chip-ic .ic { width: 18px; height: 18px; }
.srow .s-main { flex: 1; min-width: 0; }
.srow .s-main b { display: block; font-size: 16px; font-weight: 500; }
.srow .s-main span { display: block; font-size: 13px; color: var(--text-2); }
.srow > .ic { color: var(--text-3); }
button.srow { border-radius: 10px; }
@media (hover: hover) { button.srow:hover .s-main b { color: var(--brand-ink); } }
.srow.danger .s-main b { color: var(--bad); }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: var(--r-full); box-shadow: inset 0 0 0 1px var(--line); }

        <div class="mid">

          <div class="ring" role="img" aria-label="${pct}% complete"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"/><circle class="bar" cx="50" cy="50" r="40" stroke-dasharray="${C * pct / 100} ${C}"/></svg><span class="num">${pct}%</span></div>
        </div>
        <dl class="stats">

          <div><dt>Exercises</dt><dd class="num">${exDone} / ${P.ex.length}</dd></div>
          <div><dt>${S.finished ? 'Duration' : 'Time left'}</dt><dd class="num">${S.finished ? dur(entryFrom(S).minutes) : left ? '~' + left + ' min' : 'Done'}</dd></div>
        </dl>
      </section>

      <section class="a-week" aria-labelledby="wkTitle">
        <div class="sec-head"><h2>This week</h2><span class="meta">${dMonth(MON)} – ${dMonth(addDays(MON, 6))}</span></div>

          <div class="bars" role="img" aria-label="Volume per day this week, ${fmt(wVol)} kg in total">

/* ---------------- Rendering: Progress ---------------- */
function renderProgress() {
  const all = historyAll();
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const s = addDays(MON, -7 * (7 - i)), e = addDays(s, 7);
    const items = all.filter(h => { const d = parse(h.date); return d >= s && d < e; });
    let vol = items.reduce((a, h) => a + h.volume, 0);
    if (i === 7 && !S.finished) vol += volumeOf(S);
    return { s, vol, n: items.length, min: items.reduce((a, h) => a + h.minutes, 0), cur: i === 7 };
  });
  const complete = weeks.slice(0, 7).filter(w => w.vol);
  const avg = complete.length ? complete.reduce((a, w) => a + w.vol, 0) / complete.length : 0;
  const first = complete.slice(0, 3), last = complete.slice(-3);
  const trend = first.length && last.length ? Math.round((last.reduce((a, w) => a + w.vol, 0) / last.length) / (first.reduce((a, w) => a + w.vol, 0) / first.length) * 100 - 100) : 0;
  const maxV = Math.max(1, ...weeks.map(w => w.vol)), top = Math.ceil(maxV / 10000) * 10000 || 10000;
  const count = all.length, mins = all.reduce((a, h) => a + h.minutes, 0);
  const avgMin = count ? Math.round(mins / count) : 0;
  const goalWeeks = weeks.slice(0, 7).filter(w => w.n >= S.goal).length;

  const byDay = {}; all.forEach(h => byDay[h.date] = (byDay[h.date] || 0) + h.volume);
  if (!S.finished && doneSets(S).length) byDay[TODAY] = (byDay[TODAY] || 0) + volumeOf(S);
  const lvl = v => !v ? '' : v < 4500 ? 'l1' : v < 6500 ? 'l2' : v < 9000 ? 'l3' : 'l4';
  const dayNames = ['Mon', '', 'Wed', '', 'Fri', '', 'Sun'];
  let heat = '';
  for (let r = 0; r < 7; r++) {
    heat += `<span class="hl">${dayNames[r]}</span>`;
    for (let w = 0; w < 8; w++) {
      const d = addDays(MON, -7 * (7 - w) + r), k = iso(d);
      heat += `<span class="c ${d > NOW && k !== TODAY ? 'fut' : lvl(byDay[k])} ${k === TODAY ? 'tod' : ''}" title="${dShort(d)}${byDay[k] ? ' · ' + fmt(byDay[k]) + ' kg' : ''}"></span>`;
    }
  }

  const pbs = count ? [
    { name: 'Deadlift', v: '105 kg × 5', when: 9 }, { name: 'Back squat', v: '85 kg × 6', when: 4 },
    { name: 'Bench press', v: '62.5 kg × 8', when: 14 }, { name: 'Overhead press', v: '37.5 kg × 8', when: 21 },
  ] : [];
  const ago = n => n < 7 ? `${n} days ago` : `${Math.round(n / 7)} week${n >= 11 ? 's' : ''} ago`;

  $('screen-progress').innerHTML = `
    <header class="page-title"><h1>Progress</h1><p>Last 8 weeks</p></header>
    <div class="prog">
      <section class="card wide a-chart" aria-labelledby="volT">
        <div class="card-head"><div><h2 id="volT">Weekly volume</h2><div class="kfig num">${fmt(Math.round(avg / 10) * 10)} kg <small>/ week</small></div><p class="k">Average volume, last 7 weeks</p></div>
          ${complete.length > 1 ? `<span class="delta ${trend >= 0 ? 'up' : 'down'}" style="margin-top:6px;white-space:nowrap">${trend >= 0 ? '+' : ''}${trend}% in 8 wks</span>` : ''}</div>
        <div class="vchart" role="img" aria-label="Weekly volume for the last 8 weeks, averaging ${fmt(avg)} kg">
          <div class="grid">${[1, .5, 0].map(f => `<span style="top:${(1 - f) * 100}%"><em class="num">${fmtK(top * f)}</em></span>`).join('')}</div>
          <div class="cols">${weeks.map((w, i) => `<div class="col"><span class="b ${w.cur ? 'cur' : ''}" style="height:${Math.max(w.vol ? 4 : 0, w.vol / top * 136)}px"></span><span class="d">${w.cur ? 'Now' : i % 2 ? '' : dMonth(w.s)}</span></div>`).join('')}</div>
        </div>
        <div class="legend"><span><i style="background:#E9E6E0"></i>Completed weeks</span><span><i style="background:var(--brand)"></i>This week so far</span></div>
      </section>

      <div class="tiles a-tiles">
        <section class="card tile"><span class="chip-ic" style="--c:var(--c-violet)">${ic('target')}</span><span class="t-label">Goal weeks</span>
          <span class="t-fig num">${goalWeeks} <small>of 7</small></span><span class="t-sub">${S.goal}+ workouts a week</span></section>
        <section class="card tile"><span class="chip-ic" style="--c:var(--c-blue)">${ic('clock')}</span><span class="t-label">Avg session</span>
          <span class="t-fig num">${avgMin} <small>min</small></span><span class="t-sub">${count} workouts logged</span></section>
      </div>

      <section class="card a-heat" aria-labelledby="conT">
        <div class="card-head"><div><h2 id="conT">Consistency</h2><p class="k">${weeks.reduce((a, w) => a + w.n, 0)} workouts in 8 weeks</p></div></div>
        <div class="heat" role="img" aria-label="Calendar of training days over the last 8 weeks">${heat}</div>
        <div class="legend"><span>Less</span><span><i style="background:#FFE2D5"></i><i style="background:#FFB896"></i><i style="background:#FF8A57"></i><i style="background:var(--brand)"></i>More</span></div>
      </section>

      <section class="card a-pb" aria-labelledby="pbT">
        <div class="card-head"><h2 id="pbT">Personal bests</h2><span class="k">Heaviest set</span></div>
        ${pbs.length ? `<ul class="rows">${pbs.map(p => `<li class="row"><span class="emo">${emo('🏆')}</span><span class="r-main"><b>${p.name}</b><span>${ago(p.when)}</span></span><span class="r-end"><b class="num">${p.v}</b></span></li>`).join('')}</ul>`
          : `<p class="k" style="padding:16px 0 4px">Your best sets will show up here once you log a few workouts.</p>`}
      </section>
    </div>`;
}

/* ---------------- Rendering: History ---------------- */
function renderHistory() {
  const all = [...historyAll()].sort((a, b) => b.date.localeCompare(a.date));
  if (!all.length) {
    $('screen-history').innerHTML = `<header class="page-title"><h1>History</h1><p>No workouts yet</p></header>

      <button class="btn" data-go="today">Go to today's workout</button></div>`;
    return;
  }
  const groups = new Map();
  for (const h of all) {
    const wAgo = Math.round(daysBetween(monday(parse(h.date)), MON) / 7);
    const label = wAgo === 0 ? 'This week' : wAgo === 1 ? 'Last week' : `${dMonth(monday(parse(h.date)))} – ${dMonth(addDays(monday(parse(h.date)), 6))}`;
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(h);
  }
  $('screen-history').innerHTML = `<header class="page-title"><h1>History</h1><p>${all.length} workouts · ${fmt(all.reduce((a, h) => a + h.volume, 0))} kg lifted</p></header>
    <div class="history-wrap">${[...groups].map(([label, items]) => `<section class="hgroup"><h2><span>${label}</span><span class="num">${fmtK(items.reduce((a, h) => a + h.volume, 0))} kg</span></h2>

}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function renderAll() { renderToday(); renderProgress(); renderHistory(); renderProfile(); }

/* ---------------- Sheet ---------------- */
let sheetFor = null, lastFocus = null;
function openSheet(html, onRender) {
  lastFocus = document.activeElement;
  $('sheet').innerHTML = `<div class="grab"></div>` + html;
  $('sheet').classList.add('open'); $('scrim').classList.add('open');
  onRender?.();
  setTimeout(() => $('sheet').querySelector('[data-close]')?.focus(), 30);
}
function closeSheet() {
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); sheetFor = null;
  lastFocus?.focus?.();
}
function renderExerciseSheet(id) {
  const e = PROGRAM[S.type].ex.find(x => x.id === id), sets = S.sets[id];
  sheetFor = id;
  const body = `
    <div class="sh-head"><span class="chip-ic" style="--c:${e.c}">${ic(e.icon)}</span><div class="t"><h2 id="sheetTitle">${e.name}</h2><span>${e.group} · ${sets.filter(x => x.done).length} of ${sets.length} sets done</span></div>
      <button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="srows-head"><span>Set</span><span>Weight</span><span>Reps</span></div>
    ${sets.map((x, i) => `<div class="srow-ed">
      <button class="sticks num" data-ex="${id}" data-i="${i}" aria-pressed="${x.done}" aria-label="Set ${i + 1} ${x.done ? 'done' : 'not done'}">${x.done ? ic('check') : i + 1}</button>
      ${e.kg ? `<div class="step"><button data-adj="kg" data-i="${i}" data-d="-1" aria-label="Less weight, set ${i + 1}">${ic('minus')}</button><output class="num">${kgStr(x.kg).replace(' kg', '')} <small>kg</small></output><button data-adj="kg" data-i="${i}" data-d="1" aria-label="More weight, set ${i + 1}">${ic('plus')}</button></div>`
        : `<div class="step static"><output>Bodyweight</output></div>`}
      <div class="step"><button data-adj="reps" data-i="${i}" data-d="-1" aria-label="Fewer reps, set ${i + 1}">${ic('minus')}</button><output class="num">${x.reps}</output><button data-adj="reps" data-i="${i}" data-d="1" aria-label="More reps, set ${i + 1}">${ic('plus')}</button></div>
    </div>`).join('')}
    <div class="sh-actions"><button class="btn ghost" data-act="add-set">${ic('plus')}Add set</button><button class="btn" data-close>Done</button></div>`;
  if ($('sheet').classList.contains('open') && sheetFor === id) {
    const f = document.activeElement?.closest('[data-adj],[data-ex],[data-act]');
    const sel = f ? (f.dataset.adj ? `[data-adj="${f.dataset.adj}"][data-i="${f.dataset.i}"][data-d="${f.dataset.d}"]` : f.dataset.act ? `[data-act="${f.dataset.act}"]` : `.sticks[data-i="${f.dataset.i}"]`) : null;
    $('sheet').innerHTML = `<div class="grab"></div>` + body;
    if (sel) $('sheet').querySelector(sel)?.focus();
  } else openSheet(body);
}
function confirmSheet({ title, text, action, label }) {
  openSheet(`<div class="sh-head"><div class="t"><h2 id="sheetTitle">${title}</h2></div><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="confirm"><p>${text}</p></div>
    <div class="sh-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" data-act="${action}">${label}</button></div>`);
}

/* ---------------- Toast ---------------- */
let tt;
function toast(msg) {
  const t = $('toast'); t.innerHTML = ic('check') + msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------------- Events ---------------- */
function setTab(tab) {
  document.querySelectorAll('.tab').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 'screen-' + tab);
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + tab);
}
function update() { save(); renderAll(); if (sheetFor) renderExerciseSheet(sheetFor); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-close]'); if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.go) { closeSheet(); return setTab(t.dataset.go); }
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.open) return renderExerciseSheet(t.dataset.open);
  if (t.dataset.ex) {
    const set = S.sets[t.dataset.ex][+t.dataset.i]; set.done = !set.done;
    const wasAll = allSets(S).every(x => x.done);
    update();
    const same = document.querySelector(`#screen-today .set[data-ex="${t.dataset.ex}"][data-i="${t.dataset.i}"]`);
    if (!sheetFor && same) same.focus({ preventScroll: true });
    if (set.done && wasAll && !S.finished) toast('All sets done. Tap Finish to save it.');
    return;
  }
  if (t.dataset.adj) {
    const e = PROGRAM[S.type].ex.find(x => x.id === sheetFor), x = S.sets[sheetFor][+t.dataset.i], d = +t.dataset.d;
    if (t.dataset.adj === 'kg') x.kg = Math.max(0, Math.round((x.kg + d * e.step) * 100) / 100);
    else x.reps = Math.max(1, Math.min(50, x.reps + d));
    return update();
  }
  if (t.dataset.goal) { S.goal = +t.dataset.goal; return update(); }
  switch (t.dataset.act) {
    case 'add-set': { const arr = S.sets[sheetFor], l = arr.at(-1); if (arr.length < 8) arr.push({ kg: l.kg, reps: l.reps, done: false }); return update(); }
    case 'finish': S.finished = true; update(); return toast(`${PROGRAM[S.type].name} saved · ${fmt(volumeOf(S))} kg`);
    case 'unfinish': S.finished = false; return update();
    case 'reset-today': return confirmSheet({ title: "Reset today's workout?", text: 'Every set will be unticked. Weights and reps you changed stay as they are.', action: 'do-reset', label: 'Reset' });
    case 'do-reset': allSets(S).forEach(x => x.done = false); S.finished = false; update(); closeSheet(); return toast("Today's workout reset");
    case 'clear': return confirmSheet({ title: 'Clear sample data?', text: 'This removes the example history and unticks today’s sets so you can start with your own workouts.', action: 'do-clear', label: 'Clear data' });
    case 'do-clear': S.history = []; S.sets = freshSets(S.type, 0); S.finished = false; update(); closeSheet(); return toast('Sample data cleared');
  }
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', ev => {
  if (!$('sheet').classList.contains('open')) return;
  if (ev.key === 'Escape') return closeSheet();
  if (ev.key === 'Tab') {
    const f = [...$('sheet').querySelectorAll('button:not([disabled])')]; if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f.at(-1).focus(); }
    else if (!ev.shiftKey && document.activeElement === f.at(-1)) { ev.preventDefault(); f[0].focus(); }
  }
});

renderAll();
const start = location.hash.slice(1);
if (['today', 'progress', 'history', 'profile'].includes(start)) setTab(start);
</script>
</body>
</html>
