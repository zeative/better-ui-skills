<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E5DB">
<title>Loaded · workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Idea: every set you tick slides a plate onto the bar.
   Motif: the loaded barbell sleeve (hero), echoed as round plate tick buttons,
   plate stacks on a rack for the week, a knurled steel rule, a stencil "done" stamp.
   Kit: citrus, tuned. Lead: rubber black. Accent: bumper-plate orange. Base: chalk. */
:root{
  --bg:#E9E5DB; --surface:#FCFBF7; --surface-2:#F0EDE4; --sunk:#E1DDD1;
  --ink:#16171B; --ink-2:#4E4F55; --ink-3:#696A70;
  --line:rgba(22,23,27,.11); --line-2:rgba(22,23,27,.2);
  --rubber:#17181C; --rubber-2:#24262C; --on-rubber:#F5F2EA; --on-rubber-2:#B1B1B6;
  --accent:#FF4E1F; --accent-hi:#FF7A4A; --accent-lo:#D8370B; --accent-ink:#1C0A03; --accent-text:#B9300A;
  --steel-1:#F4F3EE; --steel-2:#A3A29B; --steel-3:#D6D5CE;
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-pill:999px;
  --hard:0 4px 0 var(--ink);
  --sh-1:0 1px 2px rgba(42,32,14,.07), 0 1px 1px rgba(42,32,14,.04);
  --sh-2:0 1px 2px rgba(42,32,14,.06), 0 8px 18px -6px rgba(42,32,14,.14);
  --sh-3:0 2px 4px rgba(42,32,14,.06), 0 16px 32px -10px rgba(42,32,14,.2), 0 32px 60px -24px rgba(42,32,14,.16);
  --sh-4:0 4px 8px rgba(20,14,6,.1), 0 24px 44px -14px rgba(20,14,6,.38), 0 56px 90px -34px rgba(20,14,6,.4);
  --display:"Big Shoulders Display","Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--text);font-size:16px;line-height:1.5;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,78,31,.13), transparent 65%),
    radial-gradient(var(--line) 1px, transparent 1.4px) 0 0/18px 18px,
    var(--bg);
  min-height:100dvh}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.app{max-width:1180px;margin:0 auto;padding:14px 16px calc(106px + env(safe-area-inset-bottom))}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:120px;z-index:10;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 78%)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:8px}
.date{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);font-size:14px;font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:transform .15s ease-out}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);color:var(--on-rubber);padding:20px 20px 18px;
  background:
    radial-gradient(75% 60% at 78% 62%, rgba(255,78,31,.3), transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
    linear-gradient(180deg, #1F2025, var(--rubber));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), var(--sh-4)}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.hero .focus{color:var(--on-rubber-2);font-size:14px;margin-top:6px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:var(--r-pill);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill.live{background:rgba(255,255,255,.1);color:var(--on-rubber);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pill.live i{width:7px;height:7px;border-radius:50%;background:var(--on-rubber);box-shadow:0 0 0 4px rgba(255,255,255,.16)}
.pill.fin{background:var(--accent);color:var(--accent-ink);padding-left:8px}
.pill.fin svg{width:15px;height:15px}
.count{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:14px}
.fig{display:flex;align-items:baseline;gap:6px;line-height:.8}
.fig .big{font-family:var(--display);font-weight:900;font-size:124px;line-height:.8;margin-left:-5px;color:var(--accent);letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.fig b{font-family:var(--display);font-weight:800;font-size:48px;line-height:.8;color:var(--on-rubber);font-variant-numeric:tabular-nums}
.frac .cap{display:block;margin-top:10px;font-size:13px;color:var(--on-rubber-2);white-space:nowrap}
.facts{margin:0;min-width:104px;text-align:right}
.facts div+div{margin-top:10px}
.facts dt{font-size:12px;color:var(--on-rubber-2);line-height:1.2}
.facts dd{margin:3px 0 0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--on-rubber);font-variant-numeric:tabular-nums;white-space:nowrap}
.facts dd small{font-family:var(--text);font-size:13px;font-weight:600;color:var(--on-rubber-2);margin-left:4px}
.bar-wrap{margin:6px -20px -4px -20px}
.bar-wrap svg{width:100%;height:auto;overflow:visible}
.plate-in{animation:slideOn .5s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes slideOn{from{transform:translateX(46px);opacity:0}to{transform:none;opacity:1}}
.plate-next{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-pill);border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;box-shadow:var(--hard);transition:transform .12s ease-out, box-shadow .12s ease-out}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.quiet{background:var(--surface);color:var(--ink)}
.hero .btn{border-color:#000;box-shadow:0 4px 0 #000;margin-top:16px}

/* ---------- sections ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.sec-head span{font-size:13px;color:var(--ink-2);font-weight:500}

/* ---------- exercise cards ---------- */
.list{display:grid;gap:12px}
.ex{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:inset 0 1px 0 #fff, var(--sh-2)}
.ex.done{box-shadow:inset 0 1px 0 #fff, var(--sh-1)}
.ex.current{color:var(--on-rubber);border-color:#000;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 1px, transparent 1px 8px),repeating-linear-gradient(-45deg, rgba(255,255,255,.03) 0 1px, transparent 1px 8px),linear-gradient(180deg,#26282E,var(--rubber));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), var(--sh-4)}
.ex-head{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.thumb{width:60px;height:60px;border-radius:var(--r-sm);background:linear-gradient(180deg,#F3F0E7,#E4E0D4);box-shadow:inset 0 1px 0 #fff, inset 0 0 0 1px var(--line)}
.thumb .i{fill:url(#gI)} .thumb .is{stroke:#26282E;fill:none} .thumb .a{fill:url(#gA)} .thumb .as{stroke:var(--accent);fill:none} .thumb .s{fill:url(#gS)} .thumb .ss{stroke:#9B9A92;fill:none} .thumb .h{fill:#fff;opacity:.45}
.ex h3{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.ex .meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.ex.current .meta{color:var(--on-rubber-2)}
.ex .tally{display:inline-flex;align-items:baseline;height:28px;padding:5px 10px 0;border-radius:var(--r-pill);background:#ECE8DD;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.ex.current .tally{background:rgba(255,255,255,.12)}
.ex .tally small{font-size:15px;color:var(--ink-2);font-weight:700}
.ex.current .tally small{color:var(--on-rubber-2)}
.donetag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 7px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.donetag svg{width:15px;height:15px}
.upnext{display:inline-flex;align-items:center;height:20px;padding:0 7px;margin-left:8px;border-radius:6px;background:var(--on-rubber);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.sets{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}
.set{display:grid;justify-items:center;gap:9px;padding:12px 0 11px;border-radius:var(--r-sm);background:#ECE8DD;border:1px solid rgba(22,23,27,.13);transition:background-color .15s ease-out}
.set[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 9%, var(--surface));border-color:color-mix(in srgb, var(--accent) 28%, transparent)}
.ex.current .set{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.ex.current .set[aria-pressed="true"]{background:transparent;border-color:rgba(255,122,74,.6)}
.ex.current .set.is-next{background:var(--surface);border-color:var(--surface);color:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.plate{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--on-rubber);
  background:radial-gradient(circle at 50% 50%, #3B3E47 0 15px, transparent 15.5px), linear-gradient(180deg,#3A3C45,#17181C);
  border:2px solid #000;box-shadow:0 4px 0 #000;transition:transform .12s ease-out, box-shadow .12s ease-out}
.plate::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.26)}
.plate b{position:relative;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.plate b small{font-size:13px;font-weight:700}
.plate svg{position:absolute;right:-7px;top:-7px;width:22px;height:22px;padding:4px;border-radius:50%;background:var(--ink);color:#fff;box-shadow:0 0 0 2px var(--surface);display:none}
.ex.current .plate svg{background:#000;box-shadow:0 0 0 2px #3A2520}
.ex.current .set:not(.is-next):not([aria-pressed="true"]) .plate{box-shadow:0 4px 0 #000, 0 0 0 1.5px rgba(255,255,255,.3)}
.ex.done .sets{margin-top:12px}
.ex.done .set{padding:7px 0;gap:0;background:#ECE8DD;border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.ex.done .set .kg,.ex.done .set[aria-pressed="true"] .plate svg{display:none}
.ex.done .plate,.ex.done .set[aria-pressed="true"]:hover .plate{width:34px;height:34px;transform:none;box-shadow:0 2px 0 #000;background:radial-gradient(circle at 35% 28%, var(--accent-hi), var(--accent) 60%)}
.ex.done .plate::before{inset:3px}
.ex.done .plate b{font-size:17px}
.set:active .plate{transform:translateY(4px);box-shadow:0 0 0 #000}
.set[aria-pressed="true"] .plate,.ex.current .set[aria-pressed="true"] .plate{background:radial-gradient(circle at 50% 50%, var(--accent-hi) 0 15px, transparent 15.5px),radial-gradient(circle at 35% 28%, var(--accent-hi), var(--accent) 60%);transform:translateY(3px);box-shadow:0 1px 0 #000}
.set[aria-pressed="true"] .plate::before{border:1.5px solid rgba(28,10,3,.3)}
.is-next .plate{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateY(2px)}}
.set[aria-pressed="true"] .plate b{color:var(--accent-ink)}
.set[aria-pressed="true"] .plate svg{display:block}
.set.pop .plate{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:translateY(4px) scale(.82)}60%{transform:translateY(3px) scale(1.1)}100%{transform:translateY(3px) scale(1)}}
.set .kg{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1;font-variant-numeric:tabular-nums}
.ex.current .set:not(.is-next) .kg{color:var(--on-rubber-2)}
@media (hover:hover){.set:hover .plate{transform:translateY(-1px);box-shadow:0 5px 0 #000;animation:none}.set[aria-pressed="true"]:hover .plate{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.icon-btn:hover{transform:translateY(-1px)}}

/* ---------- next-set dock ---------- */
.dock{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:8px 8px 8px 20px;border-radius:var(--r-pill);
  color:var(--on-rubber);background:linear-gradient(180deg,#2A2C33,var(--rubber));border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 24px -8px rgba(20,14,6,.5), 0 30px 50px -20px rgba(20,14,6,.5)}
.dock .label{color:var(--on-rubber-2);display:block}
.dock strong{display:block;font-size:16px;font-weight:700;line-height:1.25;margin-top:1px}
.dock strong span{color:var(--on-rubber-2);font-weight:500;white-space:nowrap}
.ring{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%), rgba(255,255,255,.16) 0)}
.ring::before{content:"";grid-area:1/1;width:66px;height:66px;border-radius:50%;background:#1C1D22}
.go{grid-area:1/1;width:54px;height:54px;border-radius:50%;border:2px solid #000;display:grid;place-items:center;color:var(--ink);position:relative;
  background:linear-gradient(180deg,#FFFFFF,#DDD9CD);box-shadow:0 3px 0 #000, inset 0 1px 0 #fff;transition:transform .12s ease-out, box-shadow .12s ease-out;margin-bottom:3px}
.go:active{transform:translateY(3px);box-shadow:0 0 0 #000;color:var(--accent-ink);background:radial-gradient(circle at 35% 28%, var(--accent-hi), var(--accent) 60%)}
.go svg{width:26px;height:26px;position:relative}
.go.fin{background:radial-gradient(circle at 35% 28%, var(--accent-hi), var(--accent) 60%);color:var(--accent-ink);transform:translateY(3px);box-shadow:0 0 0 #000}
[hidden]{display:none!important}
.up-head{display:none}

/* ---------- week ---------- */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px 18px;box-shadow:inset 0 1px 0 #fff, var(--sh-2)}
.week{display:flex;flex-direction:column}
.wk-r{flex:1;display:flex;flex-direction:column;min-width:0}
.vol{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.vol .wfig{white-space:nowrap;font-family:var(--display);font-weight:900;font-size:64px;line-height:.82;font-variant-numeric:tabular-nums}
.vol .wfig small{font-size:26px;font-weight:800;color:var(--ink-3);margin-left:4px}
.vol .cap{font-size:13px;color:var(--ink-2);margin-top:8px}
.sess{text-align:right}
.sess b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sess b small{font-size:17px;color:var(--ink-3)}
.sess p{font-size:13px;color:var(--ink-2);margin-top:6px}
.prog{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(42,32,14,.08)}
.track{position:relative;height:10px;border-radius:var(--r-pill);background:var(--sunk);box-shadow:inset 0 0 0 1.25px var(--line-2)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 45%,var(--accent-lo));box-shadow:inset 0 0 0 1.25px rgba(0,0,0,.45)}
.prog p{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.prog p span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.prog p span i{width:16px;height:6px;border-radius:3px;background:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.prog p span i.g{background:transparent;box-shadow:inset 0 0 0 1.25px var(--ink-3)}
.prog p b{margin-left:auto;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;color:var(--ink)}
.rack{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;min-height:182px;margin-top:18px;padding:0 4px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.col .n{font-family:var(--display);font-weight:800;font-size:20px;line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.col .n small{font-size:15px;color:var(--ink-3)}
.col .n.dim{color:var(--ink-3)}
.col .p{width:100%;max-width:60px;height:6px;border-radius:3px;background:linear-gradient(180deg,var(--accent-hi),var(--accent) 50%,var(--accent-lo));box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.col .p.ghost{background:transparent;box-shadow:inset 0 0 0 1.25px var(--line-2)}
.col .restblk{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line-2);background:radial-gradient(circle,var(--line-2) 0 2px,transparent 2.5px);margin-bottom:2px}
.knurl{height:8px;border-radius:6px;margin-top:3px;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,.22) 0 1px, transparent 1px 4px),repeating-linear-gradient(-45deg, rgba(0,0,0,.22) 0 1px, transparent 1px 4px),linear-gradient(180deg,var(--steel-1),var(--steel-2) 55%,var(--steel-3));
  box-shadow:0 1px 0 rgba(0,0,0,.25), 0 3px 5px -2px rgba(0,0,0,.3)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;padding:0 4px;text-align:center}
.days div{font-size:12px;line-height:1.3;color:var(--ink-2)}
.days b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.days .today b{background:var(--ink);color:var(--surface);border-radius:6px;width:fit-content;margin:0 auto;padding:0 6px}

.note{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 12px 14px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff, var(--sh-1);font-size:13px;color:var(--ink-2)}
.note>span{flex:1}
.note>svg{flex:none;width:36px;height:36px;margin-bottom:4px}
.note .btn{height:44px;font-size:14px;padding:0 16px;flex:none}
.restcard{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);padding:22px 18px;font-size:15px;color:var(--ink-2)}
.restcard b{color:var(--ink)}

/* ---------- wider screens ---------- */
.nx{display:inline}
@media (min-width:700px){
  .app{padding:22px 28px 130px}
  .list{grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .hero{padding:28px 28px 22px}
  .hero-text{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .hero h1{font-size:48px}
  .hero .focus{font-size:15px;margin-top:8px}
  .count{margin-top:0;gap:28px}
  .bar-wrap{margin:14px -28px -2px}
  .dock{max-width:none;left:28px;right:28px}
  .week{display:grid;grid-template-columns:300px 1fr;gap:0 28px;align-items:stretch}

/* ---------- dates & state ---------- */

const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

let state;
function seed(){
  // A 5-day push / pull / legs rotation, arranged so the first day you open it is a training day.
  const rot = ['legs', null, 'push', 'pull', null, 'push', 'pull'];
  const plan = {}; rot.forEach((k,o) => plan[(now.getDay()+o)%7] = k);
  const log = {};
  for (let d = new Date(monday); iso(d) < todayIso; d = addDays(d,1)) {

  let left = 9;
  log[todayIso] = blank('legs').map(a => a.map(() => left-- > 0));

}

const keyFor = d => state.over[iso(d)] || state.plan[d.getDay()] || null;
function logFor(d, key){
  const l = state.log[iso(d)];

}
const stats = (key, l) => {
  let done = 0, total = 0, vol = 0;
  SESSIONS[key].ex.forEach((e,i) => l[i].forEach(v => { total++; if (v) { done++; vol += e.kg ? e.reps*e.kg : 0; } }));

};
const setLabel = e => e.unit ? e.reps+' s hold' : e.reps+' reps';

/* ---------- hero barbell ---------- */
function barSVG(key, l, nextFlat, justFlat){
  const vw = window.innerWidth, band = vw >= 1000 ? 2 : vw >= 700 ? 1 : 0;
  const G = [ {W:372, H:172, cy:84,  x0:82,  x1:356, gap:2,   gg:9,  lo:46, hi:74, fs:10.5, tw:38, th:16, tf:9.5},

  </defs>
  <ellipse cx="${(G.x0+G.x1)/2}" cy="${base-5}" rx="${(G.x1-G.x0)*.52}" ry="4.5" fill="#000" opacity=".6" filter="url(#bl)"/>

      x += G.gg - G.gap;
    });
  }

}

  $('hero').innerHTML = `
    <div class="hero-text">
      <div><h1>${S.name}</h1><p class="focus">${S.focus}</p></div>
      <div class="count">
        <div class="frac"><p class="fig" aria-label="${st.done} of ${st.total} sets done"><span class="big">${st.done}</span><b>/${st.total}</b></p><span class="cap">sets on the bar</span></div>
        <dl class="facts"><div><dt>Lifted</dt><dd>${fmt(st.vol)}<small>kg</small></dd></div><div><dt>Lifts done</dt><dd>${exDone}<small>of ${S.ex.length}</small></dd></div></dl>
      </div>
    </div>
    <div class="bar-wrap">${barSVG(key, l, nextFlat, justFlat)}</div>`;

  $('liftsSub').textContent = `${S.ex.length} lifts · ${st.total} sets`;
  $('list').innerHTML = S.ex.map((e,i) => {
    const d = l[i].filter(Boolean).length, all = d === e.sets, cur = next && next.i === i;
    return `<article class="ex${all ? ' done' : ''}${cur ? ' current' : ''}">
      <div class="ex-head">
        <svg class="thumb" viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(5 4) scale(.79)"><ellipse cx="24" cy="46" rx="18" ry="2.4" fill="#000" opacity=".16"/>${ICONS[e.icon]}</g></svg>
        <div><h3>${e.n}${cur ? '<span class="upnext">Next</span>' : ''}</h3>
          <p class="meta">${e.sets} × ${e.unit ? e.reps+' s' : e.reps}${e.kg ? ' · '+e.kg+' kg' : e.unit ? ' · hold' : ' · bodyweight'}</p></div>
        ${all ? `<span class="donetag">${CHECK}Done</span>` : `<span class="tally" aria-label="${d} of ${e.sets} sets done">${d}<small>/${e.sets}</small></span>`}
      </div>
      <div class="sets">${l[i].map((v,j) => `
        <button class="set${cur && next.j === j ? ' is-next' : ''}${just === i+'-'+j && v ? ' pop' : ''}" data-set="${i}-${j}" aria-pressed="${v}" aria-label="${e.n}, set ${j+1}: ${setLabel(e)}${e.kg ? ' at '+e.kg+' kg' : ''}">
          <span class="plate"><b>${e.reps}${e.unit ? '<small>s</small>' : ''}</b>${CHECK}</span>
          <span class="kg">${kgLabel(e)}</span>
        </button>`).join('')}</div>
    </article>`;
  }).join('');

  const dock = $('dock'); dock.hidden = false;
  dock.classList.toggle('finished', !next);
  dock.innerHTML = next
    ? `<div><span class="label"><span class="nx">Next · </span>Set ${next.j+1} of ${next.e.sets}</span><strong>${next.e.n} <span>${next.e.unit ? next.e.reps+' s' : next.e.reps+' × '+(next.e.kg ? next.e.kg+' kg' : 'bodyweight')}</span></strong></div>
       <span class="ring" style="--p:${Math.round(next.j/next.e.sets*100)}"><button class="go" data-set="${next.i}-${next.j}" data-dock aria-label="Tick off ${next.e.n} set ${next.j+1}">${CHECK}</button></span>`
    : `<div><span class="label">Session complete</span><strong>${st.total} sets on the bar. <span>${fmt(st.vol)} kg moved</span></strong></div><span class="ring" style="--p:100"><span class="go fin" aria-hidden="true">${CHECK}</span></span>`;
  $('upSub').textContent = next ? `lift ${next.i+1} of ${S.ex.length}` : 'all done';
}

function renderRest(){
  let nd = null; for (let o = 1; o <= 7 && !nd; o++) { const d = addDays(now,o); if (state.plan[d.getDay()]) nd = d; }
  const nk = state.plan[nd.getDay()];
  $('hero').innerHTML = `
    <div class="hero-text">
      <div><h1>Rest day</h1><p class="focus">Nothing to load. ${SESSIONS[nk].name} is next, on ${DOW[nd.getDay()]} ${nd.getDate()} ${MON[nd.getMonth()]}.</p></div>
      <div class="count"><button class="btn" id="trainBtn">Train anyway</button></div>
    </div>
    <div class="bar-wrap">${barSVG(null)}</div>`;
  $('liftsSub').textContent = 'none planned';
  $('list').innerHTML = `<div class="restcard"><b>No lifts today.</b> Your next session is ${SESSIONS[nk].name.toLowerCase()} with ${SESSIONS[nk].ex.length} lifts. Tap “Train anyway” above if you'd like to bring it forward.</div>`;
  $('dock').hidden = true;
  $('trainBtn').onclick = () => { state.over[todayIso] = nk; save(); render(); };
}

function renderWeek(){
  let vol = 0, sets = 0, planned = 0, sessDone = 0, sessPlan = 0, cols = '', days = '', dots = '';
  for (let o = 0; o < 7; o++) {
    const d = addDays(monday,o), di = iso(d), key = keyFor(d), isToday = di === todayIso, past = di < todayIso;
    days += `<div class="${isToday ? 'today' : ''}"><b>${DOW[d.getDay()]}</b>${key ? SESSIONS[key].name.split(' ')[0] : 'Rest'}</div>`;
    if (!key) { cols += `<div class="col"><i class="restblk"></i></div>`; continue; }
    const st = stats(key, logFor(d, key));
    vol += st.vol; sets += st.done; planned += st.total; sessPlan++;
    const full = st.done === st.total; if (full) sessDone++;
    dots += `<i class="${full ? 'on' : ''}"></i>`;
    let p = ''; for (let k = st.total; k > 0; k--) p += `<i class="p${k > st.done ? ' ghost' : ''}"></i>`;
    cols += `<div class="col"><span class="n${st.done ? '' : ' dim'}">${past || isToday ? st.done : st.total}</span>${p}</div>`;
  }
  $('weekSub').textContent = `${monday.getDate()} ${MON[monday.getMonth()]} – ${addDays(monday,6).getDate()} ${MON[addDays(monday,6).getMonth()]}`;
  $('week').innerHTML = `
    <div class="wk-l"><div class="vol">
      <div><div class="wfig">${fmt(vol)}<small>kg</small></div><p class="cap">lifted so far this week</p></div>
      <div class="sess"><b>${sessDone}<small>/${sessPlan}</small></b><p>sessions</p></div>
    </div>
    <div class="prog">
      <div class="track" aria-hidden="true"><i style="width:${planned ? Math.max(4, Math.round(sets/planned*100)) : 0}%"></i></div>
      <p><span><i></i>${sets} sets done</span><span><i class="g"></i>${planned - sets} to go</span><b>${planned ? Math.round(sets/planned*100) : 0}%</b></p>
    </div>
    </div><div class="wk-r">
    <div class="rack" role="img" aria-label="Sets finished each day this week: ${sets} of ${planned} planned">${cols}</div>
    <div class="knurl" aria-hidden="true"></div>
    <div class="days">${days}</div></div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-set]'); if (!b) return;
  const key = keyFor(now); if (!key) return;
  const [i,j] = b.dataset.set.split('-').map(Number);
  const l = logFor(now, key);
  l[i][j] = !l[i][j];
  state.log[todayIso] = l; save();
  just = l[i][j] ? i+'-'+j : null;
  if (l[i][j] && navigator.vibrate) { try { navigator.vibrate(12); } catch(e) {} }
  const fromDock = b.hasAttribute('data-dock');
  render();
  const again = fromDock ? document.querySelector('.go') : document.querySelector(`.set[data-set="${i}-${j}"]`);
  if (again) again.focus({preventScroll:true});
});
$('resetBtn').addEventListener('click', () => {
  if (!confirm("Clear today's ticks and start this session again?")) return;
  delete state.log[todayIso]; save(); render();
});
$('freshBtn').addEventListener('click', () => {
  state.log = {}; state.over = {}; state.sample = false; save(); render();
  window.scrollTo({top:0, behavior:'smooth'});
});
const bandOf = () => window.innerWidth >= 1000 ? 2 : window.innerWidth >= 700 ? 1 : 0;
let wasWide = bandOf();
window.addEventListener('resize', () => { const w = bandOf(); if (w !== wasWide) { wasWide = w; render(); } });
render();
})();
</script>
</body>
</html>
