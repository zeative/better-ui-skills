<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<title>Tally · Personal finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — light grey canvas, near-black brand, pink / butter / sky blocks for accounts and actions */
:root {
  --font: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F4F4F4; --surface: #FFFFFF; --surface-2: #F5F5F6; --line: rgba(13,13,13,.08); --line-2: rgba(13,13,13,.14);
  --text: #0D0D0D; --text-2: #5C5C64; --text-3: #8E8E96;
  --brand: #0D0D0D; --on-brand: #FFFFFF;
  --pink: #FFD6E0; --butter: #FFEDB0; --sky: #D3E8FF;
  --ok: #157A3A; --ok-tint: #E4F5E9; --warn: #9A5300; --warn-tint: #FFF0DA; --bad: #C0261D; --bad-tint: #FDE8E6;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(13,13,13,.04), 0 1px 1px rgba(13,13,13,.03);
  --sh-2: 0 1px 2px rgba(13,13,13,.04), 0 10px 24px -14px rgba(13,13,13,.16);
  --sh-float: 0 12px 32px -8px rgba(13,13,13,.24);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; font-weight: 500; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
svg, img { display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num, .money { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 24px; height: 24px; }

/* ---------- shell ---------- */
.shell { min-height: 100dvh; }
.sidebar { display: none; }
.main-wrap { max-width: 980px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); }
.d-only { display: none !important; }

/* header */
.hdr-row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; }
.sub { font-size: 14px; color: var(--text-2); font-weight: 500; }
.hdr-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.greet { margin: 16px 0 20px; }
.greet h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: inherit; }
.brand-mark { width: 32px; height: 32px; border-radius: var(--r-xs); background: var(--brand); display: grid; place-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1); position: relative;
  transition: transform .15s ease-out, background-color .15s ease-out; }
.icon-btn:hover { background: #fff; }
.icon-btn:active { transform: scale(.95); }
.icon-btn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 2px var(--surface); }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; }
.avatar-btn svg { width: 100%; height: 100%; }
.page-head { margin-bottom: 20px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-2); }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-size: 18px; letter-spacing: -0.01em; flex: 1; }
.link { text-decoration: none; font-size: 14px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 2px; padding: 8px 0 8px 8px; margin: -8px 0; border-radius: var(--r-xs); }
.link:hover { color: var(--text); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-full); white-space: nowrap; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }

/* home layout */
.home { display: flex; flex-direction: column; gap: 16px; }
.col { display: contents; }
.o1 { order: 1 } .o2 { order: 2 } .o3 { order: 3 } .o4 { order: 4 } .o5 { order: 5 } .o6 { order: 6 } .o7 { order: 7 }

/* balance card */
.balance { background: var(--brand); color: #fff; position: relative; overflow: hidden; padding: 20px 20px 18px;
  box-shadow: 0 2px 4px rgba(13,13,13,.1), 0 24px 48px -20px rgba(13,13,13,.45); }
.bal-label { font-size: 14px; color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 8px; }
.bal-fig { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.bal-fig .muted, .fig .muted { opacity: .55; }
.bal-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.72); }
.balance .pill.ok { background: rgba(134,239,172,.16); color: #9BEFB8; }
.balance .pill.neutral { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
.balance .pill.bad { background: rgba(255,140,130,.16); color: #FFB1A8; }
.bal-chart { position: relative; height: 84px; margin: 18px 0 6px; }
.bal-chart svg { width: 100%; height: 100%; overflow: visible; }
.bal-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 2.5px solid var(--pink); transform: translate(-50%,-50%); }
.bal-tip { position: absolute; transform: translate(calc(-100% - 14px), -50%); background: var(--pink); color: var(--text); font-size: 12px; font-weight: 600;
  padding: 3px 8px; border-radius: var(--r-xs); white-space: nowrap; }
.bal-axis { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.6); }
.bal-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
.qa { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.85); padding: 4px 0; border-radius: var(--r-sm); }
.qa-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--text); transition: transform .15s ease-out; }
.qa:hover .qa-ic { transform: translateY(-2px); }
.qa:active .qa-ic { transform: scale(.94); }
.b-pink { background: var(--pink); } .b-butter { background: var(--butter); } .b-sky { background: var(--sky); }

/* accounts */
.accts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -20px; padding: 2px 20px 6px; scroll-padding-inline: 20px; scrollbar-width: none; }
.accts::-webkit-scrollbar { display: none; }
.acct { scroll-snap-align: start; border-radius: var(--r-lg); padding: 16px; min-height: 132px; display: flex; flex-direction: column; color: var(--text); position: relative; overflow: hidden;
  transition: transform .15s ease-out, box-shadow .15s ease-out; box-shadow: var(--sh-1); }
.acct:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.acct:active { transform: scale(.98); }
.acct-top { display: flex; align-items: center; justify-content: space-between; }
.acct-ic { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.6); display: grid; place-items: center; }
.acct-mask { font-size: 13px; color: rgba(13,13,13,.62); letter-spacing: .04em; }
.acct-name { margin-top: auto; padding-top: 16px; font-size: 14px; color: rgba(13,13,13,.7); }
.acct-bal { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.acct-net { display: flex; margin-left: auto; margin-right: 8px; }
.acct-net i { width: 18px; height: 18px; border-radius: 50%; background: rgba(13,13,13,.18); }
.acct-net i + i { margin-left: -7px; background: rgba(13,13,13,.32); }

/* budget card */
.budget-fig { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.fig { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.fig-sm { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.of { font-size: 14px; color: var(--text-2); }
.prog { position: relative; height: 12px; border-radius: var(--r-full); background: var(--surface-2); margin: 16px 0 10px; box-shadow: inset 0 1px 2px rgba(13,13,13,.06); }
.prog > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--brand); }
.prog > span.over { background: var(--bad); }
.prog .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--text); opacity: .35; }
.prog-legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.stat .k { font-size: 13px; color: var(--text-2); }
.stat .v { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

/* spending */
.seg { display: flex; gap: 3px; height: 14px; margin: 14px 0 6px; }
.seg span { border-radius: var(--r-full); min-width: 6px; transition: flex-grow .3s ease-out; }
.cat-list { list-style: none; margin: 8px 0 0; padding: 0; }
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.cat-name { font-size: 16px; font-weight: 500; line-height: 1.3; }
.cat-sub { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.cat-sub .sw { width: 8px; height: 8px; border-radius: 50%; }
.cat-amt { text-align: right; font-size: 16px; font-weight: 600; }
.cat-amt small { display: block; font-size: 13px; color: var(--text-2); font-weight: 500; }

/* chips */
.chip-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--tint); color: var(--ink); flex: none; }

/* transactions */
.tx-group + .tx-group { margin-top: 8px; }
.tx-day { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); padding: 8px 0 4px; }
.tx { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: var(--r-sm);
  transition: background-color .12s ease-out; min-height: 60px; }
.tx:hover { background: var(--surface-2); }
.tx:active { background: #EDEDEF; }
.tx-main { min-width: 0; display: flex; flex-direction: column; }
.tx-name { font-size: 16px; font-weight: 500; line-height: 1.3; }
.tx-sub { font-size: 13px; color: var(--text-2); }
.tx-amt { font-size: 16px; font-weight: 600; white-space: nowrap; }
.tx-amt.in { color: var(--ok); }
.tx-amt.xfer { color: var(--text-2); }

/* upcoming */
.bill { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
.bill + .bill { border-top: 1px solid var(--line); }
.date-tile { width: 44px; height: 48px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.date-tile b { font-size: 18px; font-weight: 600; }
.date-tile span { font-size: 12px; color: var(--text-2); }
.bill .soon { color: var(--warn); }

/* goal */
.goal { background: var(--butter); position: relative; overflow: visible; margin-top: 24px; box-shadow: var(--sh-1); }
.goal-art { position: absolute; right: 12px; top: -28px; width: 104px; height: 104px; display: grid; place-items: center; font-size: 72px; line-height: 1; }
.goal-art img { width: 104px; height: 104px; filter: drop-shadow(0 10px 14px rgba(120,80,0,.22)); }
.goal .sub { color: rgba(13,13,13,.68); }
.goal h2 { font-size: 18px; padding-right: 110px; }
.goal .prog { background: rgba(255,255,255,.7); box-shadow: none; }
.goal .prog-legend { color: rgba(13,13,13,.68); }

/* empty */
.empty { text-align: center; padding: 24px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg.art { width: 132px; height: auto; margin-bottom: 8px; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--text-2); font-size: 14px; max-width: 30ch; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-full); font-weight: 600; font-size: 16px;
  background: var(--brand); color: var(--on-brand); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(13,13,13,.2), 0 8px 18px -8px rgba(13,13,13,.5);
  transition: transform .15s ease-out, box-shadow .15s ease-out, opacity .15s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.danger { background: var(--bad-tint); color: var(--bad); box-shadow: none; }
.btn.full { width: 100%; }
.btn.sm { height: 44px; font-size: 15px; padding: 0 18px; }

/* filters / chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chipb { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--text); transition: background-color .12s ease-out; flex: none; }
.chipb:hover { background: #FAFAFA; }
.chipb[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: none; }
.chipb .sw { width: 12px; height: 12px; border-radius: 50%; }
.chipb .n { color: var(--text-2); font-weight: 500; }
.chipb[aria-pressed="true"] .n { color: rgba(255,255,255,.7); }
.search { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: var(--r-full); background: var(--surface); box-shadow: var(--sh-1); color: var(--text-2); }
.search input { height: 100%; border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 16px; color: var(--text); font-weight: 500; }
.search input::placeholder { color: var(--text-3); }
.search:focus-within { box-shadow: 0 0 0 2px var(--brand); }
.kbd { font-size: 12px; border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 0 6px; color: var(--text-2); }

/* activity */
.act-grid { display: grid; gap: 16px; }
.inout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inout .card { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.inout .k { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }
.mini-ic { width: 28px; height: 28px; border-radius: var(--r-xs); display: grid; place-items: center; }
.rank { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; }
.rank + .rank { border-top: 1px solid var(--line); }
.rank .bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.rank .bar span { display: block; height: 100%; border-radius: inherit; }
.rank .nm { font-size: 15px; } .rank .am { font-size: 15px; font-weight: 600; }
.rank .ct { font-size: 13px; color: var(--text-2); }

/* budget screen */
.month-nav { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r-full); padding: 4px; box-shadow: var(--sh-1); }
.month-nav button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.month-nav button:hover:not(:disabled) { background: var(--surface-2); }
.month-nav button:disabled { opacity: .3; cursor: default; }
.month-nav span { font-size: 15px; font-weight: 600; min-width: 92px; text-align: center; }
.ring-wrap { display: grid; grid-template-columns: 148px 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-c .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.ring-c .k { font-size: 13px; color: var(--text-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; font-size: 14px; color: var(--text-2); }
.kv + .kv { border-top: 1px solid var(--line); }
.kv b { color: var(--text); font-size: 16px; font-weight: 600; }
.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; align-items: end; height: 168px; padding-top: 32px; position: relative; }
.weeks .paceline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--line-2); }
.weeks .paceline span { position: absolute; right: 0; top: -22px; font-size: 12px; color: var(--text-2); background: var(--surface); padding-left: 6px; }
.wk { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.wk-bar { width: 100%; max-width: 56px; border-radius: var(--r-sm); background: var(--brand); min-height: 8px; position: relative; }
.wk-bar.cur { background: repeating-linear-gradient(-45deg, var(--brand) 0 3px, #FFB3C6 3px 8px); }
.wk-bar.future { background: #E6E6EA; min-height: 6px; }
.wk-bar.past { background: #3A3A40; }
.wk-tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--brand); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-xs); white-space: nowrap; }
.wk-tip::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--brand); }
.wk-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-2); }
.wk-labels b { display: block; color: var(--text); font-weight: 600; font-size: 13px; }
.bud-row { width: 100%; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 12px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: var(--r-sm); }
.bud-row:hover { background: var(--surface-2); }
.bud-row + .bud-row { background: linear-gradient(var(--line), var(--line)) 8px 0 / calc(100% - 16px) 1px no-repeat; }
.bud-row + .bud-row:hover { background: var(--surface-2); }
.bud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bud-top .nm { font-size: 16px; font-weight: 500; }
.bud-top .am { font-size: 15px; font-weight: 600; white-space: nowrap; }
.bud-top .am span { color: var(--text-2); font-weight: 500; }
.bud-bar { height: 8px; border-radius: 8px; background: var(--surface-2); margin: 8px 0 6px; overflow: hidden; }
.bud-bar span { display: block; height: 100%; border-radius: inherit; }
.bud-foot { font-size: 13px; color: var(--text-2); display: flex; justify-content: space-between; }
.bud-foot .over { color: var(--bad); font-weight: 600; }

/* profile */
.prof { display: flex; align-items: center; gap: 16px; }
.prof .avatar-lg { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex: none; }
.prof h2 { font-size: 20px; }
.prof-stats { display: none; margin-left: auto; gap: 32px; }
.prof-stats > div { display: flex; flex-direction: column; padding-left: 24px; border-left: 1px solid var(--line); }
.prof-stats b { font-size: 20px; font-weight: 600; }
@media (min-width: 900px) { .prof-stats { display: flex; } }
.set-group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 4px 16px; }
.set-title { font-size: 14px; color: var(--text-2); font-weight: 600; margin: 24px 4px 8px; }
.set-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .lbl { flex: 1; min-width: 0; }
.set-row .lbl b { display: block; font-weight: 500; font-size: 16px; }

const pad = n => String(n).padStart(2, '0');

const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();

  const d = parseISO(iso), diff = Math.round((TODAY - d) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
};

const KEY = 'tally.v1';
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function seed() {
  const tx = [];
  const start = addDays(TODAY, -62);
  for (let k = 2; k >= 0; k--) {
    const y = TODAY.getFullYear(), m = TODAY.getMonth() - k;
    const base = new Date(y, m, 1);
    RECURRING.forEach(r => {
      const d = new Date(base.getFullYear(), base.getMonth(), Math.min(r.day, dim(base.getFullYear(), base.getMonth())));
      if (d > TODAY || d < start) return;
      const amount = Array.isArray(r.amount) ? r.amount[k] : r.amount;
      tx.push({ id: uid(), date: isoOf(d), merchant: r.merchant, cat: r.type === 'expense' ? r.cat : r.type, amount, account: r.account, to: r.to, type: r.type });
    });
  }
  VARIABLE.forEach(([ago, merchant, cat, amount, account]) => {
    tx.push({ id: uid(), date: isoOf(addDays(TODAY, -ago)), merchant, cat, amount, account, type: 'expense' });
  });
  sortTx(tx);
  const net = { checking: 0, savings: 0, card: 0 };
  tx.forEach(t => applyNet(net, t, 1));
  const opening = {};
  for (const a in TARGETS) opening[a] = +(TARGETS[a] - net[a]).toFixed(2);
  return { v: 1, tx, opening, budgets: { ...DEFAULT_BUDGETS }, prefs: { currency: 'USD', billReminders: true, overAlerts: true, weekly: false }, name: 'Maya Torres', email: 'maya.torres@fastmail.com' };
}
function applyNet(net, t, s) {
  if (t.type === 'expense') net[t.account] -= t.amount * s;
  else if (t.type === 'income') net[t.account] += t.amount * s;
  else { net[t.account] -= t.amount * s; net[t.to] += t.amount * s; }
}
const sortTx = list => list.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);

const bigMoney = (n) => {
  const parts = NF.formatToParts(Math.abs(n));

  parts.forEach(p => {
    if (p.type === 'decimal' || p.type === 'fraction') out += `<span class="muted">${p.value}</span>`;
    else out += p.value;

  return out;
};

function balances() {

const total = b => Object.values(b).reduce((a, v) => a + v, 0);
function monthStats(y, m, uptoDay = 31) {
  const pre = `${y}-${pad(m + 1)}-`;
  const byCat = {}, cnt = {};
  let spent = 0, income = 0;
  S.tx.forEach(t => {
    if (!t.date.startsWith(pre) || +t.date.slice(8) > uptoDay) return;
    if (t.type === 'expense') { spent += t.amount; byCat[t.cat] = (byCat[t.cat] || 0) + t.amount; cnt[t.cat] = (cnt[t.cat] || 0) + 1; }
    else if (t.type === 'income') income += t.amount;
  });
  return { spent, income, byCat, cnt };
}
const budgetTotal = () => Object.values(S.budgets).reduce((a, v) => a + v, 0);
function trend(days = 30) {
  const pts = []; let cur = total(balances());
  const byDate = {};
  S.tx.forEach(t => { const d = t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0; byDate[t.date] = (byDate[t.date] || 0) + d; });
  for (let i = 0; i <= days; i++) {
    const iso = isoOf(addDays(TODAY, -i));
    pts.unshift(cur);
    cur -= byDate[iso] || 0;
  }
  return pts;
}
function upcoming() {
  const b = balances(), out = [];
  if (!S.tx.length) return out;
  RECURRING.filter(r => r.type === 'expense' || r.payCard).forEach(r => {
    let d = new Date(TODAY.getFullYear(), TODAY.getMonth(), r.day);
    if (d <= TODAY) d = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, r.day);
    const amount = r.payCard ? Math.max(0, -b.card) : (Array.isArray(r.amount) ? r.amount[0] : r.amount);
    if (amount <= 0) return;
    out.push({ ...r, date: d, amount, days: Math.round((d - TODAY) / 864e5) });
  });
  return out.sort((a, b) => a.date - b.date);
}

function viewBudget() {
  const ref = new Date(TODAY.getFullYear(), TODAY.getMonth() + ui.bOffset, 1);
  const y = ref.getFullYear(), m = ref.getMonth(), days = dim(y, m), isCur = ui.bOffset === 0;
  const day = isCur ? TODAY.getDate() : days;
  const ms = monthStats(y, m), bt = budgetTotal(), left = bt - ms.spent;
  const oldest = S.tx.length ? parseISO(S.tx[S.tx.length - 1].date) : TODAY;
  const canPrev = new Date(y, m, 1) > new Date(oldest.getFullYear(), oldest.getMonth(), 1);
  // ring
  const R = 60, C = 2 * Math.PI * R, gap = 3;
  const cats = Object.keys(CATS).filter(c => ms.byCat[c]).sort((a, b) => ms.byCat[b] - ms.byCat[a]);
  const scale = Math.max(bt, ms.spent) || 1;
  let off = 0;
  const arcs = cats.map(c => { const len = ms.byCat[c] / scale * C; const s = `<circle cx="74" cy="74" r="${R}" fill="none" stroke="${CATS[c].mid}" stroke-width="16" stroke-dasharray="${Math.max(0.1, len - gap)} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('');
  // weeks
  const weeks = [];
  for (let s = 1; s <= days; s += 7) weeks.push({ s, e: Math.min(days, s + 6), amt: 0 });
  const FIXED = ['housing', 'bills'];
  S.tx.forEach(t => { if (t.type !== 'expense' || FIXED.includes(t.cat) || !t.date.startsWith(`${y}-${pad(m + 1)}-`)) return; const d = +t.date.slice(8); weeks[Math.floor((d - 1) / 7)].amt += t.amount; });
  const flexBudget = Object.keys(S.budgets).filter(c => !FIXED.includes(c)).reduce((a, c) => a + S.budgets[c], 0);
  const paceW = flexBudget / days * 7;
  const wmax = Math.max(paceW, ...weeks.map(w => w.amt)) * 1.08 || 1;
  const curW = isCur ? Math.floor((day - 1) / 7) : -1;
  const wkHTML = weeks.map((w, i) => {
    const future = isCur && i > curW, cur = i === curW;
    const h = future ? 4 : Math.max(5, w.amt / wmax * 100);
    return `<div class="wk"><div class="wk-bar ${future ? 'future' : cur ? 'cur' : 'past'}" style="height:${h}%">${cur ? `<span class="wk-tip money">${moneyRound(w.amt)}</span>` : ''}</div></div>`;
  }).join('');
  const wkLabels = weeks.map((w, i) => `<div><b class="money">${isCur && i > curW ? '—' : i === curW ? 'So far' : moneyRound(w.amt)}</b>${w.s}–${w.e}</div>`).join('');
  const allCats = Object.keys(CATS).sort((a, b) => ((ms.byCat[b] || 0) / (S.budgets[b] || 1)) - ((ms.byCat[a] || 0) / (S.budgets[a] || 1)));
  return `<div class="bud-grid">
    <div style="display:flex;flex-direction:column;gap:inherit;min-width:0">
      <section class="card" aria-labelledby="ov-h">
        <div class="card-head"><h2 id="ov-h">Overview</h2>
          <div class="month-nav"><button data-action="bmonth" data-d="-1" ${canPrev ? '' : 'disabled'} aria-label="Previous month">${icon('chevL')}</button><span>${MON[m]} ${y}</span><button data-action="bmonth" data-d="1" ${isCur ? 'disabled' : ''} aria-label="Next month">${icon('chevR')}</button></div></div>
        <div class="ring-wrap">
          <div class="ring" role="img" aria-label="${money(ms.spent)} spent of ${money(bt)} budget">
            <svg viewBox="0 0 148 148" aria-hidden="true"><circle cx="74" cy="74" r="${R}" fill="none" stroke="#F0F0F2" stroke-width="16"/>${arcs}</svg>
            <div class="ring-c"><span class="v money">${moneyRound(Math.abs(left))}</span><span class="k">${left < 0 ? 'over budget' : 'left to spend'}</span></div>
          </div>
          <div>
            <div class="kv"><span>Budget</span><b class="money">${money(bt)}</b></div>
            <div class="kv"><span>Spent</span><b class="money">${money(ms.spent)}</b></div>
            <div class="kv"><span>${isCur ? 'Per day left' : 'Income'}</span><b class="money">${isCur ? money(Math.max(0, left) / (days - day + 1)) : money(ms.income)}</b></div>
          </div>
        </div>
      </section>
      <section class="card" aria-labelledby="wk-h">
        <div class="card-head" style="margin-bottom:0;display:block"><h2 id="wk-h">Everyday spending</h2><p class="of" style="margin-top:2px">By week in ${MONTH_FULL[m]}, excluding rent and bills</p></div>
        <div class="weeks" role="img" aria-label="Everyday spending by week in ${MONTH_FULL[m]}: ${weeks.map(w => moneyRound(w.amt)).join(', ')}">
          <div class="paceline" style="bottom:${paceW / wmax * (168 - 32)}px"><span class="money">Weekly target ${moneyRound(paceW)}</span></div>
          ${wkHTML}</div>
        <div class="wk-labels">${wkLabels}</div>
      </section>
    </div>
    <section class="card" aria-labelledby="cb-h">
      <div class="card-head" style="margin-bottom:4px"><h2 id="cb-h">Category budgets</h2><span class="of">Tap to edit</span></div>
      ${allCats.map(c => {
        const sp = ms.byCat[c] || 0, bd = S.budgets[c] || 0, p = bd ? Math.min(100, sp / bd * 100) : 0, over = sp - bd;
        return `<button class="bud-row" data-action="edit-budget" data-cat="${c}">${chipIc(CATS[c])}
          <div><div class="bud-top"><span class="nm">${CATS[c].label}</span><span class="am money">${money(sp)} <span>/ ${moneyRound(bd)}</span></span></div>
          <div class="bud-bar"><span style="width:${p}%;background:${over > 0 ? 'var(--bad)' : CATS[c].mid}"></span></div>
          <div class="bud-foot"><span>${ms.cnt[c] || 0} ${ms.cnt[c] === 1 ? 'payment' : 'payments'}</span>${over > 0 ? `<span class="over money">${money(over)} over</span>` : `<span class="money">${money(bd - sp)} left</span>`}</div></div></button>`;
      }).join('')}
    </section>
  </div>`;
}

      <div class="field"><label class="lab" for="amt">Amount</label><div class="amount-in"><span class="cur">${curSym()}</span><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(d.amount)}"></div></div>
      ${d.type !== 'transfer' ? `<div class="field"><label class="lab" for="mer">${d.type === 'income' ? 'From' : 'Merchant'}</label><input class="input" id="mer" autocomplete="off" placeholder="${d.type === 'income' ? 'e.g. Paycheck' : 'e.g. Jewel-Osco'}" value="${esc(d.merchant)}"></div>` : ''}
      ${d.type === 'expense' ? `<div class="field"><span class="lab">Category</span><div class="cat-pick" role="group" aria-label="Category">${Object.entries(CATS).map(([k, c]) => `<button type="button" class="cat-opt" data-action="d-set" data-k="cat" data-v="${k}" aria-pressed="${d.cat === k}">${chipIc(c)}${c.label}</button>`).join('')}</div></div>` : ''}
      ${d.type === 'transfer'
        ? `<div class="field"><span class="lab">From</span>${acctChips('account')}</div><div class="field"><span class="lab">To</span>${acctChips('to', d.account)}</div>`
        : `<div class="field"><span class="lab">${d.type === 'income' ? 'Into' : 'Paid with'}</span>${acctChips('account')}</div>`}
      <div class="field"><span class="lab">Date</span><div class="stepper"><button type="button" data-action="d-date" data-d="-1" aria-label="Previous day">${icon('chevL')}</button><span>${dayLabel(d.date)}${Math.round((TODAY - dd) / 864e5) < 2 ? ', ' + dd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''}</span><button type="button" data-action="d-date" data-d="1" ${d.date === TODAY_ISO ? 'disabled' : ''} aria-label="Next day">${icon('chevR')}</button></div></div>
      ${d.err ? `<p class="err" role="alert">${icon('alert', 'sm')}${d.err}</p>` : ''}
      <div class="sheet-actions"><button class="btn full" type="submit">${icon('check')}Save transaction</button></div>
    </form>`);
}
function syncDraft() {
  const a = sheet.querySelector('#amt'), m = sheet.querySelector('#mer');
  if (a) draft.amount = a.value;
  if (m) draft.merchant = m.value;
}
sheet.addEventListener('submit', e => {
  if (e.target.id === 'budget-form') {
    e.preventDefault();
    const v = parseFloat(sheet.querySelector('#bamt').value.replace(/[^0-9.]/g, ''));
    if (!(v >= 0)) { sheet.querySelector('.err')?.remove(); sheet.querySelector('form').insertAdjacentHTML('beforeend', `<p class="err" role="alert">${icon('alert', 'sm')}Enter a monthly limit, or 0 for none.</p>`); return; }
    S.budgets[e.target.dataset.cat] = Math.round(v * 100) / 100; save(); closeSheet(); render(); toast(`${CATS[e.target.dataset.cat].label} budget set to ${moneyRound(v)}`);
    return;
  }
  if (e.target.id !== 'add-form') return;
  e.preventDefault(); syncDraft();
  const amt = parseFloat(String(draft.amount).replace(/[^0-9.]/g, ''));
  draft.err = !(amt > 0) ? 'Enter an amount greater than zero.' : draft.type !== 'transfer' && !draft.merchant.trim() ? (draft.type === 'income' ? 'Add where this money came from.' : 'Add a merchant name.') : draft.type === 'transfer' && draft.account === draft.to ? 'Choose two different accounts.' : '';
  if (draft.err) { renderAdd(); return; }
  const t = { id: uid(), date: draft.date, amount: Math.round(amt * 100) / 100, account: draft.account, type: draft.type,
    merchant: draft.type === 'transfer' ? (draft.to === 'card' ? 'Visa card payment' : `Transfer to ${acct(draft.to).short.toLowerCase()}`) : draft.merchant.trim(),
    cat: draft.type === 'expense' ? draft.cat : draft.type };
  if (draft.type === 'transfer') t.to = draft.to;
  S.tx.push(t); sortTx(S.tx); save(); closeSheet(); render();
  toast('Transaction added', 'Undo', () => { S.tx = S.tx.filter(x => x.id !== t.id); save(); render(); });
});

function openTx(id) {
  const t = S.tx.find(x => x.id === id); if (!t) return;
  const c = catOf(t), d = parseISO(t.date);
  const amt = t.type === 'income' ? money(t.amount, { sign: true }) : t.type === 'transfer' ? money(t.amount) : money(-t.amount);
  openSheet(`${sheetHead('Transaction')}
    <div class="det-amt">${chipIc(c)}<div class="fig money">${amt}</div><p class="sub" style="margin-top:4px">${esc(t.merchant)}</p></div>
    <div class="set-group" style="box-shadow:none;background:var(--surface-2)">
      <div class="kv"><span>Category</span><b>${c.label}</b></div>
      <div class="kv"><span>${t.type === 'transfer' ? 'From' : t.type === 'income' ? 'Into' : 'Paid with'}</span><b>${acct(t.account).name}</b></div>
      ${t.type === 'transfer' ? `<div class="kv"><span>To</span><b>${acct(t.to).name}</b></div>` : ''}
      <div class="kv"><span>Date</span><b>${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</b></div>
    </div>
    <div class="sheet-actions"><button class="btn danger" data-action="del" data-id="${t.id}">${icon('trash')}Delete</button><button class="btn ghost" data-action="close">Done</button></div>`);
}
function openBudget(cat) {
  const c = CATS[cat], ms = monthStats(TODAY.getFullYear(), TODAY.getMonth());
  openSheet(`${sheetHead(`${c.label} budget`)}
    <form id="budget-form" data-cat="${cat}" novalidate>
      <p class="sub">${money(ms.byCat[cat] || 0)} spent in ${MONTH_FULL[TODAY.getMonth()]}</p>
      <div class="field"><label class="lab" for="bamt">Monthly limit</label><div class="amount-in"><span class="cur">${curSym()}</span><input id="bamt" inputmode="decimal" autocomplete="off" value="${S.budgets[cat] || 0}"></div></div>
      <div class="acct-pick" style="margin-top:12px">${[-50, -10, 10, 50].map(v => `<button type="button" class="chipb" data-action="b-adj" data-v="${v}">${v > 0 ? '+' : '−'}${curSym()}${Math.abs(v)}</button>`).join('')}</div>
      <div class="sheet-actions"><button class="btn ghost" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Save limit</button></div>
    </form>`);
  setTimeout(() => sheet.querySelector('#bamt')?.select(), 50);
}
function openAlerts() {
  const list = alerts();
  openSheet(`${sheetHead('Notifications')}
    ${list.length ? list.map(a => `<div class="alert-row">${chipIc(a.c)}<div><b>${a.title}</b><span class="money">${a.text}</span></div></div>`).join('')
      : `<div class="empty"><h3>You’re all caught up</h3><p>Bill reminders and budget alerts will show up here.</p></div>`}
    <div class="sheet-actions"><button class="btn ghost" data-action="close">Close</button></div>`);
}
function confirmSheet(title, text, label, fn, danger) {
  openSheet(`${sheetHead(title)}<p class="sub" style="font-size:16px">${text}</p>
    <div class="sheet-actions"><button class="btn ghost" data-action="close">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-action="confirm">${label}</button></div>`);
  confirmFn = fn;
}
let confirmFn = null;

/* ================= toast ================= */
let toastT;
function toast(msg, label, fn) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${msg}</span>${label ? `<button>${label}</button>` : ''}`;
  el.classList.toggle('has-action', !!label);
  if (label) el.querySelector('button').onclick = () => { fn(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 4500);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case 'add': openAdd(el.dataset.type || 'expense'); break;
    case 'close': closeSheet(); break;
    case 'tx': openTx(el.dataset.id); break;
    case 'acct': ui.account = el.dataset.id; ui.filter = 'all'; ui.q = ''; if (location.hash !== '#activity') location.hash = 'activity'; else render(); break;
    case 'clear-acct': ui.account = null; render(); break;
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'reset-filters': ui.filter = 'all'; ui.q = ''; ui.account = null; render(); break;
    case 'bmonth': ui.bOffset = Math.min(0, ui.bOffset + +el.dataset.d); render(); break;
    case 'edit-budget': openBudget(el.dataset.cat); break;
    case 'b-adj': { const i = sheet.querySelector('#bamt'); i.value = Math.max(0, (parseFloat(i.value) || 0) + +el.dataset.v); break; }
    case 'alerts': openAlerts(); break;
    case 'go-budget': location.hash = 'budget'; break;
    case 'toggle': S.prefs[el.dataset.k] = !S.prefs[el.dataset.k]; save(); render(); break;
    case 'currency': S.prefs.currency = el.dataset.c; setNF(); save(); render(); break;
    case 'd-type': syncDraft(); draft.type = el.dataset.v; draft.err = ''; if (draft.type === 'transfer') { draft.account = 'checking'; draft.to = 'savings'; } else if (draft.type === 'income') draft.account = 'checking'; renderAdd(); break;
    case 'd-set': syncDraft(); draft[el.dataset.k] = el.dataset.v; if (draft.type === 'transfer' && draft.account === draft.to) draft.to = ACCTS.find(x => x.id !== draft.account).id; renderAdd(); sheet.querySelector(`[data-action="d-set"][data-k="${el.dataset.k}"][data-v="${el.dataset.v}"]`)?.focus(); break;
    case 'd-date': syncDraft(); { const n = addDays(parseISO(draft.date), +el.dataset.d); if (n <= TODAY) draft.date = isoOf(n); } renderAdd(); sheet.querySelector(`[data-action="d-date"][data-d="${el.dataset.d}"]:not(:disabled)`)?.focus(); break;
    case 'del': {
      const t = S.tx.find(x => x.id === el.dataset.id);
      S.tx = S.tx.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render();
      toast('Transaction deleted', 'Undo', () => { S.tx.push(t); sortTx(S.tx); save(); render(); });
      break;
    }
    case 'export': {
      const rows = [['Date', 'Merchant', 'Type', 'Category', 'Account', 'To', 'Amount']].concat(S.tx.map(t => [t.date, t.merchant, t.type, catOf(t).label, acct(t.account).name, t.to ? acct(t.to).name : '', (t.type === 'expense' ? -t.amount : t.amount).toFixed(2)]));
      const csv = rows.map(r => r.map(v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      const l = document.createElement('a'); l.href = url; l.download = `tally-transactions-${TODAY_ISO}.csv`; l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(`Exported ${S.tx.length} transactions`); break;
    }
    case 'reset': confirmSheet('Restore sample data?', 'Your transactions, balances and budgets will be replaced with the example month.', 'Restore', () => { S = seed(); setNF(); save(); render(); toast('Sample data restored'); }); break;
    case 'clear': confirmSheet('Clear all data?', 'This removes every transaction and sets all account balances to zero. Budgets are kept.', 'Clear data', () => { S.tx = []; S.opening = { checking: 0, savings: 0, card: 0 }; save(); render(); toast('All data cleared'); }, true); break;
    case 'confirm': closeSheet(); confirmFn && confirmFn(); confirmFn = null; break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q-m' || e.target.id === 'q-d') {
    ui.q = e.target.value;
    const id = e.target.id, pos = e.target.selectionStart;
    if (view !== 'activity') { ui.filter = 'all'; ui.account = null; pendingFocus = id; location.hash = 'activity'; }
    else { render(); const i = document.getElementById(id); i.focus(); i.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !sheet.open) {
    const i = document.getElementById('q-d'); if (i && i.offsetParent) { e.preventDefault(); i.focus(); }
  }
});

route();
</script>
</body>
</html>
