<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0">
<title>Liftlog · Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean on a warm grey canvas, near-black summary card and primary buttons,
   one orange accent for progress, ticks and active states. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F4F3F0; --surface: #FFFFFF; --surface-2: #F6F5F2; --line: #EAE8E3; --line-2: #DEDBD4;
  --text: #17171B; --text-2: #67645E; --text-3: #9C988F;
  --dark: #17171B; --dark-2: #26262C; --on-dark-2: #B5B3AE;
  --brand: #FF5A1F; --brand-ink: #C2410C; --brand-tint: #FFEEE6;
  --ok: #15803D; --ok-tint: #E8F7EE; --bad: #B42318; --bad-tint: #FDECEC;
  --r-sm: 12px; --r-md: 12px; --r-lg: 20px; --r-xl: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(40,30,20,.05), 0 1px 1px rgba(40,30,20,.03);
  --sh-2: 0 1px 2px rgba(40,30,20,.05), 0 8px 24px -12px rgba(40,30,20,.14);
  --sh-float: 0 12px 32px -8px rgba(40,30,20,.24);
  --tabbar-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text);
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; }
img, svg { display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { min-height: 100dvh; }
.side, .panel { display: none; }
main { padding: calc(env(safe-area-inset-top) + 16px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px); max-width: 600px; margin: 0 auto; }
.view { display: grid; gap: 16px; }

.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.94); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tab { display: grid; place-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--text-2); min-height: 44px; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand-ink); }
.tab[aria-current="page"] .ic { color: var(--brand); stroke-width: 2.1; }
.tab:active .ic { transform: scale(.92); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.top .eyebrow { font-size: 13px; color: var(--text-2); font-weight: 500; }
.top h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE3C7; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--surface), var(--sh-1); }
.avatar img { width: 100%; height: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-1); border: 1px solid var(--line); }

/* ---------- Week strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: grid; justify-items: center; gap: 2px; padding: 8px 0 8px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.day span { font-size: 12px; color: var(--text-2); font-weight: 500; }
.day b { font-size: 16px; font-weight: 600; }
.day i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px; }
.day.done i { background: var(--brand); }
.day.off { background: transparent; }
.day.off b { color: var(--text-2); font-weight: 500; }
.day.today { background: var(--dark); border-color: var(--dark); color: #fff; }
.day.today span { color: var(--on-dark-2); }

.day.today.done i { background: var(--brand); }

/* ---------- Summary card ---------- */
.hero { position: relative; overflow: hidden; background: var(--dark); color: #fff; border-radius: var(--r-xl); padding: 20px; box-shadow: var(--sh-2); }
.hero-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hero .label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--on-dark-2); }
.hero .label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.hero h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.15; }
.hero h2 small { font-size: 18px; font-weight: 500; color: var(--on-dark-2); letter-spacing: 0; }
.hero .sub { font-size: 14px; color: var(--on-dark-2); margin-top: 4px; }
.ring-wrap { position: relative; width: 92px; height: 92px; flex: none; }
.ring-wrap .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.hero-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
.hero-stats div + div { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.1); }
.hero-stats span { display: block; font-size: 12px; color: var(--on-dark-2); }
.hero-stats b { font-size: 16px; font-weight: 600; display: block; }
.hero-stats div { min-width: 0; }
.hero-actions { position: relative; margin-top: 16px; }
.hero .btn-light { background: #fff; color: var(--text); }

/* ---------- Sections and cards ---------- */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
.sec-head h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.sec-head span { font-size: 14px; color: var(--text-2); }
.card { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.card-pad { padding: 18px; }
.card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title h3 { font-size: 16px; font-weight: 600; }
.card-title span { font-size: 13px; color: var(--text-2); }

.chip { --c: var(--brand); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: var(--c); }
.chip .ic { width: 22px; height: 22px; }

/* ---------- Exercise list ---------- */
.ex-list { display: grid; gap: 10px; }
.ex { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--sh-1); transition: box-shadow .2s, border-color .2s; }
.ex.open { box-shadow: var(--sh-2); border-color: var(--line-2); }
.ex-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 14px; text-align: left; border-radius: var(--r-lg); min-height: 72px; }
@media (hover: hover) { .ex-head:hover { background: var(--surface-2); } .ex.open .ex-head:hover { background: transparent; } }
.ex-txt { flex: 1; min-width: 0; }
.ex-txt b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-txt small { display: block; font-size: 13px; color: var(--text-2); margin-top: 2px; }
.ex-prog { position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
.ex-prog > svg { position: absolute; inset: 0; }
.ex-prog > span { position: relative; font-size: 12px; font-weight: 600; color: var(--text-2); }
.ex-prog .done-badge { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; animation: pop .28s ease-out; }
.ex-prog .done-badge .ic { width: 18px; height: 18px; stroke-width: 2.6; }
.chev { color: var(--text-3); transition: transform .2s; }
.ex.open .chev { transform: rotate(180deg); }

.sets { display: none; padding: 0 14px 14px; }
.ex.open .sets { display: block; }
.set-grid { display: grid; grid-template-columns: 36px 1fr 1fr 48px; align-items: center; gap: 8px; }
.set-labels { font-size: 12px; color: var(--text-2); font-weight: 500; padding: 4px 0 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.set-labels span:nth-child(2), .set-labels span:nth-child(3) { padding-left: 12px; }
.set-row { padding: 4px 0; }
.set-n { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--text-2); }
.set-row.done .set-n { background: var(--brand-tint); color: var(--brand-ink); }
.field { position: relative; }
.field input { width: 100%; height: 44px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--surface-2); padding: 0 34px 0 12px;
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; transition: border-color .15s, background .15s; -moz-appearance: textfield; }
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input::placeholder { color: var(--text-2); font-weight: 500; }
.field input:focus { border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 3px var(--brand-tint); }
.field em { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--text-2); pointer-events: none; }
.set-row.done .field input { background: transparent; }
.tick { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; justify-self: end; border: 2px solid var(--line-2); color: var(--text-3);
  transition: background .18s, border-color .18s, color .18s, transform .12s; }
.tick .ic { width: 20px; height: 20px; stroke-width: 2.4; }
@media (hover: hover) { .tick:hover { border-color: var(--brand); color: var(--brand); } }
.tick:active { transform: scale(.9); }
.tick[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; animation: pop .28s ease-out; }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
.ex-note { font-size: 13px; color: var(--text-2); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.ex-note .ic { width: 16px; height: 16px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: var(--r-full); font-size: 16px; font-weight: 600;
  background: var(--dark); color: #fff; width: 100%; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 20px -10px rgba(23,23,27,.6);
  transition: transform .15s ease-out, background-color .15s; }
@media (hover: hover) { .btn:hover { background: #2A2A31; } }
.btn:active { transform: scale(.98); }
.btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line-2); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn-ghost:hover { background: var(--surface-2); } }
.btn-sm { height: 44px; font-size: 15px; }

/* ---------- Progress ---------- */
.prog-grid, .prog-grid > div { display: grid; gap: 16px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; display: grid; gap: 10px; align-content: start; }
.stat .chip { width: 36px; height: 36px; border-radius: 12px; }
.stat .chip .ic { width: 20px; height: 20px; }
.stat span { font-size: 13px; color: var(--text-2); display: block; }
.stat b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; display: block; }
.stat b small { font-size: 14px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-full); background: var(--ok-tint); color: var(--ok); width: fit-content; }
.pill.down { background: var(--bad-tint); color: var(--bad); }
.pill.flat { background: var(--surface-2); color: var(--text-2); }

.dots7 { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; }
.dots7 div { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--on-dark-2); }
.dots7 i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed rgba(255,255,255,.28); }
.dots7 i.done { background: var(--brand); border: 0; color: #fff; }
.dots7 i.off { border: 0; background: rgba(255,255,255,.08); color: var(--on-dark-2); }
.dots7 i .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.dots7 .today { color: #fff; font-weight: 600; }

.bars { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 168px; align-items: end; padding-top: 22px; }
.bars::before { content: ""; position: absolute; inset: 22px 0 26px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 100%); background-size: 100% 33.33%; pointer-events: none; }
.bar { position: relative; display: grid; grid-template-rows: 1fr 26px; height: 100%; justify-items: center; }
.bar .slot { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar .col { width: 100%; max-width: 30px; border-radius: 8px 8px 4px 4px; background: #E7E3DC; position: relative; min-height: 4px; transition: height .4s ease-out; }
.bar.has .col { background: var(--dark); }
.bar.cur .col { background: var(--brand); }
.bar.empty .col { background: transparent; border: 1.5px dashed var(--line-2); min-height: 20px; }
.bar .val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text); }
.bar .lbl { align-self: end; font-size: 12px; color: var(--text-2); font-weight: 500; }
.bar.cur .lbl { color: var(--brand-ink); font-weight: 600; }

.groups { display: grid; gap: 14px; }
.grp { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
.grp .chip { width: 36px; height: 36px; border-radius: 12px; }
.grp .chip .ic { width: 18px; height: 18px; }
.grp-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
.grp-top b { font-weight: 600; }
.grp-top span { color: var(--text-2); }
.track { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 8px; background: var(--c); transition: width .4s ease-out; }

.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .ex-txt b { font-size: 15px; font-weight: 600; }
.row .val { text-align: right; font-size: 15px; font-weight: 600; }
.row .val small { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }

.empty { text-align: center; padding: 20px 8px 8px; color: var(--text-2); font-size: 14px; display: grid; justify-items: center; gap: 8px; }
.empty .chip { width: 52px; height: 52px; border-radius: 12px; }

/* ---------- Plan ---------- */
.plan-day { display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 72px; }
.plan-day + .plan-day { border-top: 1px solid var(--line); }
.plan-day .dname { width: 40px; flex: none; font-size: 13px; color: var(--text-2); font-weight: 600; text-align: center; }
.plan-day.is-today { background: var(--brand-tint); }
.plan-day.is-today:first-child { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.plan-day.is-today:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.plan-day.is-today .dname { color: var(--brand-ink); }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-full); background: var(--brand); color: #fff; }
.badge.ok { background: var(--brand-tint); color: var(--brand-ink); }
.badge.muted { background: var(--surface-2); color: var(--text-2); }

/* ---------- Profile ---------- */
.profile { display: flex; align-items: center; gap: 16px; padding: 18px; }
.profile .avatar { width: 64px; height: 64px; }
.profile b { font-size: 20px; font-weight: 600; display: block; letter-spacing: -0.01em; }
.profile span { font-size: 14px; color: var(--text-2); }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.mini-stats div { padding: 14px 18px; }
.mini-stats div + div { border-left: 1px solid var(--line); }
.mini-stats b { font-size: 18px; font-weight: 600; display: block; }
.mini-stats span { font-size: 12px; color: var(--text-2); }
.setting { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; width: 100%; text-align: left; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting .chip { width: 36px; height: 36px; border-radius: 12px; }
.setting .chip .ic { width: 18px; height: 18px; }
@media (hover: hover) { button.setting:hover { background: var(--surface-2); } }
button.setting:first-child { border-radius: var(--r-lg) var(--r-lg) 0 0; }
button.setting:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.setting.danger b { color: var(--bad); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-full); padding: 3px; gap: 2px; }
.seg button { height: 34px; min-width: 48px; padding: 0 10px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
.foot-note { font-size: 13px; color: var(--text-2); text-align: center; }

/* ---------- Rest timer ---------- */
.rest { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px); max-width: 568px; margin: 0 auto;
  background: var(--dark); color: #fff; border-radius: var(--r-lg); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--sh-float);
  transform: translateY(calc(100% + 100px)); transition: transform .3s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.rest.show { transform: none; }
.rest .ic { color: var(--brand); }
.rest-txt { flex: 1; }
.rest-txt span { display: block; font-size: 12px; color: var(--on-dark-2); }
.rest-txt b { font-size: 18px; font-weight: 600; }
.rest button { height: 44px; padding: 0 14px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; background: rgba(255,255,255,.1); color: #fff; }
.rest button.primary { background: #fff; color: var(--text); }
.rest-bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--brand); transition: width 1s linear; }

.toast { visibility: hidden; position: fixed; z-index: 40; left: 50%; top: calc(env(safe-area-inset-top) + 16px); transform: translate(-50%, -140%); background: var(--dark); color: #fff;
  font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: var(--r-full); box-shadow: var(--sh-float); transition: transform .3s; white-space: nowrap; }
.toast.show { visibility: visible; transform: translate(-50%, 0); }

/* ---------- Tablet / desktop ---------- */
@media (min-width: 768px) {
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  .tabbar { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100dvh; padding: 24px 16px; background: var(--surface); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; padding: 0 8px 24px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 12px; background: var(--dark); display: grid; place-items: center; }
  .nav-item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--text-2); width: 100%; text-align: left; }
  @media (hover: hover) { .nav-item:hover { background: var(--surface-2); color: var(--text); } }
  .nav-item[aria-current="page"] { background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; }
  .nav-item[aria-current="page"] .ic { color: var(--brand); }
  .side-foot { margin-top: auto; display: grid; gap: 12px; }
  .goal-card { background: var(--surface-2); border-radius: var(--r-md); padding: 14px; font-size: 13px; color: var(--text-2); }
  .goal-card b { display: block; color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .goal-card .track { background: var(--line); margin-top: 8px; }
  .user { display: flex; align-items: center; gap: 10px; padding: 8px; }
  .user .avatar { width: 40px; height: 40px; }
  .user b { display: block; font-size: 14px; font-weight: 600; }
  .user span { font-size: 12px; color: var(--text-2); }
  main { padding: 32px 32px 120px; max-width: 680px; width: 100%; }
  .rest { bottom: 24px; left: 248px; right: 16px; max-width: 520px; }

}
@media (min-width: 1200px) {

  main { margin: 0; justify-self: center; max-width: 720px; padding: 32px 40px 120px; }
  .app.wide main { max-width: 1040px; }

  .panel { display: grid; align-content: start; gap: 16px; position: sticky; top: 0; height: 100dvh; overflow-y: auto; padding: 32px 24px; border-left: 1px solid var(--line); background: #FAF9F7; }
  .app.wide .panel { display: none; }
  .panel .stats { grid-template-columns: 1fr 1fr; }

}

</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Main">
    <div class="brand"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" style="color:var(--brand);stroke-width:2.2" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Liftlog</div>
    <nav id="sideNav" style="display:grid;gap:4px"></nav>
    <div class="side-foot">
      <div class="goal-card" id="sideGoal"></div>
      <div class="user"><span class="avatar" id="sideAvatar"></span><div><b>Alex Morgan</b><span>Strength · 5 days a week</span></div></div>
    </div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
  <aside class="panel" id="panel" aria-label="This week"></aside>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<div class="rest" id="rest" role="status" aria-live="polite" aria-hidden="true">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
  <div class="rest-txt"><span>Rest</span><b class="num" id="restTime">1:30</b></div>
  <button type="button" id="restAdd" tabindex="-1">+15s</button>
  <button type="button" class="primary" id="restSkip" tabindex="-1">Skip</button>
  <i class="rest-bar" id="restBar"></i>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- Icons ---------------- */
const P = {
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5V15h-5v5.5H5A1.5 1.5 0 0 1 3.5 19z"/>',
  chart: '<path d="M4 20.5h16M6.5 16.5v-5M11.5 16.5v-11M16.5 16.5v-7.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  user: '<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c.8-3.7 3.8-6 7.5-6s6.7 2.3 7.5 6"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  chevDown: '<path d="m6 9 6 6 6-6"/>',
  chevRight: '<path d="m9 6 6 6-6 6"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  barbell: '<path d="M2.5 12h19M5.5 8v8M8.5 6v12M15.5 6v12M18.5 8v8"/>',
  pull: '<path d="M4.5 4h15M12 20V8.5M7 13l5-5 5 5"/>',
  vert: '<path d="M12 3.5v17M8 7.5l4-4 4 4M8 16.5l4 4 4-4"/>',
  core: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  flame: '<path d="M12 21a6.5 6.5 0 0 0 6.5-6.5c0-3.5-2.5-5.5-3.5-8-1 2-2 2.8-3.2 3.2C12 7 11 4.6 9 3c.2 3-2.2 5-3 7a6.5 6.5 0 0 0 6 11z"/>',
  layers: '<path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/>',
  weight: '<path d="M7.5 8.5h9l2.5 12h-14z"/><circle cx="12" cy="5.5" r="2.5"/>',
  trophy: '<path d="M8 20.5h8M12 16.5v4M7 3.5h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  moon: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
  reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  ruler: '<path d="m3.5 15.5 12-12 5 5-12 12z"/><path d="m7.5 11.5 2 2M10.5 8.5l2 2M13.5 5.5l2 2"/>',
};
const ic = (n, extra = '') => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${P[n]}</svg>`;

/* ---------------- Program ---------------- */
const GROUPS = {
  chest:     { label: 'Chest',     c: '#DB4A82', icon: 'dumbbell', target: 10 },
  back:      { label: 'Back',      c: '#2F6FEB', icon: 'pull',     target: 14 },
  legs:      { label: 'Legs',      c: '#16A34A', icon: 'barbell',  target: 16 },
  shoulders: { label: 'Shoulders', c: '#7C5CFC', icon: 'vert',     target: 10 },
  arms:      { label: 'Arms',      c: '#D97706', icon: 'dumbbell', target: 8 },
  core:      { label: 'Core',      c: '#0E9F9A', icon: 'core',     target: 3 },
};
// [name, group, sets, reps, kg, unit]  kg 0 = bodyweight; unit 's' = seconds
const WORKOUTS = {
  push:  { name: 'Push day',   focus: 'Chest, shoulders, triceps', ex: [['Bench press','chest',4,8,60],['Overhead press','shoulders',3,10,35],['Incline dumbbell press','chest',3,10,22],['Lateral raise','shoulders',3,15,8],['Triceps pushdown','arms',3,12,25]] },
  pull:  { name: 'Pull day',   focus: 'Back, rear delts, biceps', ex: [['Deadlift','back',3,5,100],['Pull-up','back',4,8,0],['Barbell row','back',4,8,55],['Face pull','shoulders',3,15,15],['Biceps curl','arms',3,12,12]] },
  legs:  { name: 'Leg day',    focus: 'Quads, hamstrings, calves', ex: [['Back squat','legs',4,6,80],['Romanian deadlift','legs',3,10,70],['Walking lunge','legs',3,12,16],['Leg press','legs',3,12,140],['Standing calf raise','legs',4,15,40]] },
  upper: { name: 'Upper body', focus: 'Chest, back, shoulders', ex: [['Bench press','chest',4,6,65],['Weighted pull-up','back',4,6,10],['Seated cable row','back',3,10,50],['Dumbbell shoulder press','shoulders',3,10,20],['Dips','arms',3,10,0]] },
  full:  { name: 'Full body',  focus: 'Legs, chest, back, core', ex: [['Back squat','legs',4,8,70],['Bench press','chest',3,8,60],['Barbell row','back',3,10,50],['Romanian deadlift','legs',3,10,60],['Plank','core',3,45,0,'s']] },
};
const PLAN = ['push', 'pull', null, 'legs', 'upper', null, 'full']; // Monday first
const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_LETTER = ['M','T','W','T','F','S','S'];

/* ---------------- Dates ---------------- */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = (d) => (d.getDay() + 6) % 7; // 0 = Monday
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const monday = (d) => addDays(d, -dow(d));
const fmtKg = (n) => Math.round(n).toLocaleString('en-GB');
const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}h ${pad(Math.round(m % 60))}m` : `${Math.round(m)} min`;
const round25 = (x) => Math.round(x / 2.5) * 2.5;

/* ---------------- State ---------------- */
const KEY = 'liftlog.v1';
let S;
let tab = 'today';
const open = new Set();

function freshSets(wid) {
  return WORKOUTS[wid].ex.map(([, , sets, reps, kg]) => Array.from({ length: sets }, () => ({ w: kg, r: reps, done: false })));
}
function entryFromPlan(wid, factor, jitter) {
  const w = WORKOUTS[wid]; let sets = 0, volume = 0; const groups = {}; let top = null;
  w.ex.forEach(([name, g, n, r, kg, unit]) => {
    const load = kg ? round25(kg * factor) : 0;
    sets += n; groups[g] = (groups[g] || 0) + n;
    if (unit !== 's') volume += n * r * load;
    if (!top || load > top.w) top = { name, w: load, r };
  });
  return { wid, sets, volume, minutes: Math.round(sets * 2.8 + jitter), groups, top, done: true };
}
function seed() {
  const t = today(), history = {};
  const thisMon = monday(t);
  for (let wk = 5; wk >= 0; wk--) {
    const mon = addDays(thisMon, -7 * wk);
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i);
      if (d >= t || !PLAN[i]) continue;
      if (wk === 3 && i === 4) continue; // a missed session three weeks back
      const jitter = ((wk * 7 + i) * 37 % 11) - 4;
      history[iso(d)] = entryFromPlan(PLAN[i], 1 - 0.022 * wk, jitter);
    }
  }
  const wid = PLAN[dow(t)];
  const s = { date: iso(t), wid, sets: wid ? freshSets(wid) : null, finished: false, history, rest: 90, sample: true };
  if (wid) { // mid-session sample: first exercise done, two sets of the second
    s.sets[0].forEach((x) => x.done = true);
    s.sets[1][0].done = true; s.sets[1][1].done = true;
  }
  return s;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.history) S = seed();
  const t = iso(today());
  if (S.date !== t) { // new day: archive yesterday, set up today
    const live = liveEntry();
    if (live && live.sets) S.history[S.date] = { ...live, done: true };
    const wid = PLAN[dow(today())];
    Object.assign(S, { date: t, wid, sets: wid ? freshSets(wid) : null, finished: false });
  }
  save();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- Derived ---------------- */
function liveEntry() {
  if (!S.wid || !S.sets) return null;
  const w = WORKOUTS[S.wid]; let sets = 0, volume = 0, total = 0, exDone = 0; const groups = {}; let top = null;
  w.ex.forEach(([name, g, , , , unit], i) => {
    const arr = S.sets[i]; let all = true;
    arr.forEach((x) => {
      total++;
      if (!x.done) { all = false; return; }
      sets++; groups[g] = (groups[g] || 0) + 1;
      if (unit !== 's') volume += (+x.w || 0) * (+x.r || 0);
      if (!top || (+x.w || 0) > top.w) top = { name, w: +x.w || 0, r: +x.r || 0 };
    });
    if (all) exDone++;
  });
  return { wid: S.wid, sets, total, exDone, volume, minutes: Math.round(sets * 2.8), left: Math.round((total - sets) * 2.8), groups, top, done: S.finished };
}
function weekData(offsetWeeks = 0) {
  const t = today(), mon = addDays(monday(t), -7 * offsetWeeks), tIso = iso(t);
  const live = liveEntry();
  return Array.from({ length: 7 }, (_, i) => {
    const d = addDays(mon, i), k = iso(d);
    let e = S.history[k] || null;
    if (k === tIso && live && live.sets) e = live;
    return { date: d, iso: k, i, isToday: k === tIso, future: d > t, planned: PLAN[i], entry: e };
  });
}
function weekSummary() {
  const days = weekData(), last = weekData(1), todayIdx = dow(today());
  const sum = (arr, f) => arr.reduce((a, d) => a + (d.entry ? f(d.entry) : 0), 0);
  const groups = {};
  days.forEach((d) => d.entry && Object.entries(d.entry.groups).forEach(([g, n]) => groups[g] = (groups[g] || 0) + n));
  const workouts = days.filter((d) => d.entry && (d.entry.done || !d.isToday)).length;
  const volume = sum(days, (e) => e.volume);
  const cutoff = days[todayIdx].entry && days[todayIdx].entry.done ? todayIdx : todayIdx - 1;
  const doneVol = sum(days.filter((d) => d.i <= cutoff), (e) => e.volume);
  const lastSame = sum(last.filter((d) => d.i <= cutoff), (e) => e.volume);
  // streak: weeks in a row with 4+ workouts (this week counts once it gets there)
  let streak = workouts >= 4 ? 1 : 0;
  for (let w = 1; w < 60; w++) { if (weekData(w).filter((d) => d.entry).length >= 4) streak++; else break; }
  return { days, workouts, planned: PLAN.filter(Boolean).length, volume, lastSame,
    delta: lastSame && doneVol ? Math.round((doneVol - lastSame) / lastSame * 100) : null,
    minutes: sum(days, (e) => e.minutes), sets: sum(days, (e) => e.sets), groups, streak };
}

/* ---------------- Pieces ---------------- */
function ring(pct, size, stroke, color, track) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="transition:stroke-dashoffset .5s ease-out"/></svg>`;
}
const avatarImg = (bg = 'ffe3c7') => `<img src="https://api.dicebear.com/9.x/notionists/svg?seed=Alex%20Morgan&backgroundColor=${bg}" alt="" width="64" height="64" onerror="this.remove()">`;
const groupChip = (g, cls = '') => `<span class="chip ${cls}" style="--c:${GROUPS[g].c}">${ic(GROUPS[g].icon)}</span>`;

function weekStrip() {
  const days = weekData();
  return `<div class="strip" role="list" aria-label="This week">${days.map((d) => {
    const done = d.entry && (d.entry.done || !d.isToday);
    const cls = ['day', d.isToday && 'today', done && 'done', !d.planned && !d.isToday && 'off'].filter(Boolean).join(' ');
    const label = `${DAY_SHORT[d.i]} ${d.date.getDate()}: ${done ? 'workout done' : d.planned ? WORKOUTS[d.planned].name : 'rest day'}`;
    return `<div class="${cls}" role="listitem" aria-label="${label}"><span aria-hidden="true">${DAY_LETTER[d.i]}</span><b class="num" aria-hidden="true">${d.date.getDate()}</b><i aria-hidden="true"></i></div>`;
  }).join('')}</div>`;
}

function volumeChart(sum) {
  const vals = sum.days.map((d) => d.entry ? d.entry.volume : 0);
  const max = Math.max(...vals, 1) * 1.1;
  const best = sum.days.reduce((b, d) => d.entry && (!b || d.entry.volume > b.entry.volume) ? d : b, null);
  return `<div class="bars" role="img" aria-label="Volume by day this week${best ? `; highest on ${DAY_SHORT[best.i]} at ${fmtKg(best.entry.volume)} kg` : ''}">${sum.days.map((d, i) => {
    const v = vals[i], h = v ? Math.max(6, v / max * 100) : 0;
    const cls = ['bar', v && 'has', d.isToday && 'cur', !v && d.planned && d.future && 'empty'].filter(Boolean).join(' ');
    const showVal = v && (d.isToday || d === best);
    const hh = v ? h : (d.planned && d.future ? 12 : 3);
    return `<div class="${cls}"><div class="slot"><div class="col" style="height:${hh}%"></div>${showVal ? `<span class="val num" style="bottom:calc(${hh}% + 4px)">${(v / 1000).toFixed(1)}t</span>` : ''}</div><span class="lbl">${DAY_SHORT[i]}</span></div>`;
  }).join('')}</div>`;
}
function groupBars(sum) {
  return `<div class="groups">${Object.entries(GROUPS).map(([g, G]) => {
    const n = sum.groups[g] || 0, pct = Math.min(100, n / G.target * 100);
    return `<div class="grp">${groupChip(g)}<div><div class="grp-top"><b>${G.label}</b><span class="num">${n >= G.target ? '<b style="color:var(--brand-ink)">Target met</b> · ' : ''}${n} of ${G.target} sets</span></div>
      <div class="track" style="--c:${n >= G.target ? 'var(--brand)' : 'var(--dark)'}"><i style="width:${pct}%"></i></div></div></div>`;
  }).join('')}</div>`;
}
function statTiles(sum, two) {
  const d = sum.delta;
  const pill = d === null ? '' : `<span class="pill ${d > 0 ? '' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '↑' : d < 0 ? '↓' : ''} ${Math.abs(d)}% vs last week</span>`;
  return `<div class="stats ${two ? 'two' : ''}">
    <div class="card stat"><span class="chip" style="--c:#FF5A1F">${ic('weight')}</span><div><span>Volume</span><b class="num">${fmtKg(sum.volume)} <small>kg</small></b></div>${pill}</div>
    <div class="card stat"><span class="chip" style="--c:#2F6FEB">${ic('clock')}</span><div><span>Time trained</span><b class="num">${fmtMin(sum.minutes)}</b></div></div>
    <div class="card stat"><span class="chip" style="--c:#7C5CFC">${ic('layers')}</span><div><span>Sets done</span><b class="num">${sum.sets}</b></div></div>
    <div class="card stat"><span class="chip" style="--c:#D97706">${ic('flame')}</span><div><span>Streak</span><b class="num">${sum.streak} <small>${sum.streak === 1 ? 'week' : 'weeks'}</small></b></div></div>
  </div>`;
}
function topSets(sum) {
  const rows = sum.days.filter((d) => d.entry && d.entry.top).sort((a, b) => b.entry.top.w - a.entry.top.w).slice(0, 4);
  if (!rows.length) return `<div class="empty"><span class="chip" style="--c:#D97706">${ic('trophy')}</span>No sets logged yet this week.</div>`;
  return `<div class="rows">${rows.map((d) => {
    const t = d.entry.top, g = WORKOUTS[d.entry.wid].ex.find((e) => e[0] === t.name)[1];
    return `<div class="row">${groupChip(g)}<div class="ex-txt"><b>${t.name}</b><small>${WORKOUTS[d.entry.wid].name} · ${d.isToday ? 'Today' : DAY_SHORT[d.i]}</small></div>
      <div class="val num">${t.w ? `${t.w} kg` : 'BW'}<small>× ${t.r} reps</small></div></div>`;
  }).join('')}</div>`;
}

/* ---------------- Views ---------------- */
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function dateLine() { return today().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); }

function nextName() {
  const i = S.sets.findIndex((a) => a.some((x) => !x.done));
  return i < 0 ? 'All done' : WORKOUTS[S.wid].ex[i][0];
}
function heroToday() {
  const w = WORKOUTS[S.wid], e = liveEntry(), pct = e.total ? e.sets / e.total : 0;
  const complete = S.finished;
  return `<section class="hero" aria-label="Today's workout">
    <div class="hero-top">
      <div>
        <span class="label"><span class="dot"></span>${complete ? 'Completed' : 'Today'} · ${w.name}</span>
        <h2 class="num">${e.sets} <small>of ${e.total} sets</small></h2>
        <p class="sub">${complete ? w.focus : `Next up: ${nextName()}`}</p>
      </div>
      <div class="ring-wrap">${ring(pct, 92, 9, '#FF5A1F', 'rgba(255,255,255,.12)')}<span class="pct num">${Math.round(pct * 100)}%</span></div>
    </div>
    <div class="hero-stats">
      <div><span>Volume</span><b class="num">${fmtKg(e.volume)} kg</b></div>
      <div><span>Top set</span><b class="num">${e.top ? (e.top.w ? `${e.top.w} kg × ${e.top.r}` : `BW × ${e.top.r}`) : '–'}</b></div>
      <div><span>${complete ? 'Time' : 'Time left'}</span><b class="num">${complete ? fmtMin(e.minutes) : `~${fmtMin(e.left)}`}</b></div>
    </div>
  </section>`;
}

function exerciseCard(ex, i) {
  const [name, g, nSets, reps, kg, unit] = ex, arr = S.sets[i];
  const doneN = arr.filter((x) => x.done).length, all = doneN === arr.length, isOpen = open.has(i);
  const target = `${nSets} × ${reps}${unit === 's' ? ' sec' : ''} · ${kg ? `${kg} kg` : 'Bodyweight'}`;
  const prog = all ? `<span class="done-badge" aria-hidden="true">${ic('check')}</span>`
    : `${ring(doneN / arr.length, 40, 3.5, '#FF5A1F', '#EEEBE6')}<span class="num">${doneN}/${arr.length}</span>`;
  return `<article class="ex ${isOpen ? 'open' : ''} ${all ? 'done' : ''}">
    <button class="ex-head" type="button" data-toggle="${i}" aria-expanded="${isOpen}" aria-controls="sets-${i}">
      ${groupChip(g)}
      <span class="ex-txt"><b>${name}</b><small>${target}</small></span>
      <span class="ex-prog" aria-label="${doneN} of ${arr.length} sets done">${prog}</span>
      <span class="chev">${ic('chevDown')}</span>
    </button>
    <div class="sets" id="sets-${i}">
      <div class="set-grid set-labels" aria-hidden="true"><span>Set</span><span>Weight</span><span>${unit === 's' ? 'Time' : 'Reps'}</span><span></span></div>
      ${arr.map((x, j) => `<div class="set-grid set-row ${x.done ? 'done' : ''}">
        <span class="set-n num">${j + 1}</span>
        <label class="field"><span class="sr">${name} set ${j + 1} weight in kg</span><input type="number" inputmode="decimal" step="2.5" min="0" value="${x.w || ''}" placeholder="BW" data-ex="${i}" data-set="${j}" data-k="w"><em>kg</em></label>
        <label class="field"><span class="sr">${name} set ${j + 1} ${unit === 's' ? 'seconds' : 'reps'}</span><input type="number" inputmode="numeric" min="0" value="${x.r}" data-ex="${i}" data-set="${j}" data-k="r"><em>${unit === 's' ? 'sec' : 'reps'}</em></label>
        <button type="button" class="tick" data-tick="${i}:${j}" aria-pressed="${x.done}" aria-label="Mark set ${j + 1} of ${name} ${x.done ? 'not done' : 'done'}">${ic('check')}</button>
      </div>`).join('')}
    </div>
  </article>`;
}

function viewToday() {
  const sum = weekSummary();
  let body;
  if (!S.wid) {
    const nextIdx = [1,2,3,4,5,6,7].map((n) => (dow(today()) + n) % 7).find((i) => PLAN[i]);
    const nw = WORKOUTS[PLAN[nextIdx]];
    body = `<section class="hero" aria-label="Rest day">
        <span class="label"><span class="dot"></span>Today · Rest day</span>
        <h2>Recovery day</h2>
        <p class="sub">Next up: ${nw.name} on ${DAY_SHORT[nextIdx]} · ${nw.ex.length} exercises</p>
        <div class="hero-actions"><button class="btn btn-light btn-sm" type="button" data-train="${PLAN[nextIdx]}">${ic('play')} Train ${nw.name.toLowerCase()} today</button></div>
      </section>
      <div class="sec-head"><h3>Coming up: ${nw.name}</h3><span>${nw.ex.reduce((a, e) => a + e[2], 0)} sets</span></div>
      <div class="card" style="padding:0 16px"><div class="rows">${nw.ex.map((e) => `<div class="row">${groupChip(e[1])}<div class="ex-txt"><b>${e[0]}</b><small>${e[2]} × ${e[3]}${e[5] === 's' ? ' sec' : ''} · ${e[4] ? e[4] + ' kg' : 'Bodyweight'}</small></div></div>`).join('')}</div></div>`;
  } else {
    const w = WORKOUTS[S.wid], e = liveEntry();
    body = `<div id="hero">${heroToday()}</div>
      <div class="sec-head"><h3>Exercises</h3><span class="num">${e.exDone} of ${w.ex.length} done</span></div>
      <div class="ex-list">${w.ex.map(exerciseCard).join('')}</div>
      ${S.finished
        ? `<button class="btn btn-ghost" type="button" data-act="resume">${ic('reset')} Reopen workout</button>`
        : `<button class="btn" type="button" data-act="finish">${ic('check')} Finish workout</button>`}`;
  }
  return `<header class="top"><div><p class="eyebrow">${dateLine()}</p><h1>${greeting()}, Alex</h1></div>
      <button class="avatar" type="button" data-tab="profile" aria-label="Profile">${avatarImg()}</button></header>
    ${weekStrip()}
    ${body}`;
}

function panelHtml() {
  const sum = weekSummary();
  const nextIdx = [1,2,3,4,5,6,7].map((n) => (dow(today()) + n) % 7).find((i) => PLAN[i]);
  const nw = WORKOUTS[PLAN[nextIdx]];
  return `<div class="card card-pad">
      <div class="card-title"><h3>This week</h3><span class="num">${sum.workouts} of ${sum.planned} workouts</span></div>
      ${volumeChart(sum)}
    </div>
    ${lastSession()}
    <div class="card card-pad">
      <div class="card-title"><h3>Up next</h3><span>${nextIdx === dow(today()) + 1 ? 'Tomorrow' : DAY_SHORT[nextIdx]}</span></div>
      <div class="row" style="padding:0">${groupChip(nw.ex[0][1])}<div class="ex-txt"><b>${nw.name}</b><small>${nw.ex.length} exercises · ~${fmtMin(nw.ex.reduce((a, e) => a + e[2], 0) * 2.8)}</small></div></div>
    </div>`;
}

function lastSession() {
  if (!S.wid) return '';
  const prev = Object.entries(S.history).filter(([k, e]) => e.wid === S.wid && k < S.date).sort().pop();
  const w = WORKOUTS[S.wid], e = liveEntry();
  if (!prev) return `<div class="card card-pad"><div class="card-title"><h3>Last ${w.name.toLowerCase()}</h3></div><p class="foot-note" style="text-align:left">First time logging this workout.</p></div>`;
  const [k, p] = prev, d = new Date(k + 'T12:00');
  const pct = Math.min(1, e.volume / p.volume);
  return `<div class="card card-pad"><div class="card-title"><h3>Last ${w.name.toLowerCase()}</h3><span>${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span></div>
    <div class="rows">
      <div class="row" style="padding-top:0"><div class="ex-txt"><b>Volume</b><small>Today so far ${fmtKg(e.volume)} kg</small></div><div class="val num">${fmtKg(p.volume)} kg</div></div>
      <div class="row"><div class="ex-txt"><b>Sets</b><small>Today so far ${e.sets}</small></div><div class="val num">${p.sets}</div></div>
      <div class="row"><div class="ex-txt"><b>Duration</b><small>Planned ~${fmtMin(e.total * 2.8)}</small></div><div class="val num">${fmtMin(p.minutes)}</div></div>
    </div>
    <div class="track" style="--c:var(--brand);margin-top:6px"><i style="width:${pct * 100}%"></i></div>
    <p class="foot-note" style="text-align:left;margin-top:8px">${Math.round(pct * 100)}% of last session's volume</p></div>`;
}
function viewProgress() {
  const sum = weekSummary(), mon = monday(today()), sun = addDays(mon, 6);
  const range = `${mon.getDate()}${mon.getMonth() !== sun.getMonth() ? ' ' + mon.toLocaleDateString('en-GB', { month: 'short' }) : ''} – ${sun.getDate()} ${sun.toLocaleDateString('en-GB', { month: 'short' })}`;
  const remaining = sum.days.filter((d) => d.planned && !(d.entry && (d.entry.done || !d.isToday)) && (d.future || d.isToday)).length;
  const hero = `<section class="hero" aria-label="Workouts this week">
      <div class="hero-top"><div>
        <span class="label"><span class="dot"></span>Workouts this week</span>
        <h2 class="num">${sum.workouts} <small>of ${sum.planned} planned</small></h2>
        <p class="sub">${sum.workouts >= sum.planned ? 'Every planned session done this week' : remaining ? `${remaining} ${remaining === 1 ? 'session' : 'sessions'} left this week` : 'Week complete'}</p>
      </div>
      <div class="ring-wrap">${ring(sum.workouts / sum.planned, 92, 9, '#FF5A1F', 'rgba(255,255,255,.12)')}<span class="pct num">${Math.round(sum.workouts / sum.planned * 100)}%</span></div></div>
      <div class="dots7">${sum.days.map((d) => {
        const done = d.entry && (d.entry.done || !d.isToday);
        return `<div class="${d.isToday ? 'today' : ''}"><i class="${done ? 'done' : !d.planned ? 'off' : ''}" aria-hidden="true">${done ? ic('check') : !d.planned ? ic('moon', 'style="width:14px;height:14px"') : ''}</i><span>${DAY_LETTER[d.i]}</span></div>`;
      }).join('')}</div>
    </section>`;
  const chart = `<div class="card card-pad"><div class="card-title"><h3>Volume by day</h3><span>Tonnes lifted</span></div>${volumeChart(sum)}</div>`;
  const groups = `<div class="card card-pad"><div class="card-title"><h3>Sets by muscle group</h3><span>Weekly target</span></div>${groupBars(sum)}</div>`;
  const tops = `<div class="card card-pad" style="padding-bottom:6px"><div class="card-title" style="margin-bottom:2px"><h3>Top sets</h3><span>Heaviest per session</span></div>${topSets(sum)}</div>`;
  return `<header class="top"><div><p class="eyebrow num">${range}</p><h1>Progress</h1></div></header>
    <div class="prog-grid"><div>${hero}${statTiles(sum)}${chart}</div><div>${groups}${tops}</div></div>`;
}

function viewPlan() {
  const t = dow(today()), week = weekData();
  return `<header class="top"><div><p class="eyebrow">5 sessions · 2 rest days</p><h1>Weekly plan</h1></div></header>
    <div class="card">${PLAN.map((wid, i) => {
      const d = week[i], done = d.entry && (d.entry.done || !d.isToday);
      if (!wid) return `<div class="plan-day ${i === t ? 'is-today' : ''}"><span class="dname">${DAY_SHORT[i]}</span><span class="chip" style="--c:#67645E">${ic('moon')}</span>
        <div class="ex-txt"><b>Rest</b><small>Walk, stretch or mobility work</small></div>${i === t ? '<span class="badge">Today</span>' : ''}</div>`;
      const w = WORKOUTS[wid], sets = w.ex.reduce((a, e) => a + e[2], 0);
      return `<div class="plan-day ${i === t ? 'is-today' : ''}"><span class="dname">${DAY_SHORT[i]}</span>${groupChip(w.ex[0][1])}
        <div class="ex-txt"><b>${w.name}</b><small>${w.ex.length} exercises · ${sets} sets</small></div>
        ${i === t ? '<span class="badge">Today</span>' : done ? '<span class="badge ok">Done</span>' : d.future ? '' : '<span class="badge muted">Missed</span>'}</div>`;
    }).join('')}</div>
    ${Object.entries(WORKOUTS).filter(([k]) => PLAN.includes(k)).map(([k, w]) => `<div class="card card-pad" style="padding-bottom:6px">
      <div class="card-title" style="margin-bottom:2px"><h3>${w.name}</h3><span>${w.focus}</span></div>
      <div class="rows">${w.ex.map((e) => `<div class="row">${groupChip(e[1])}<div class="ex-txt"><b>${e[0]}</b><small>${GROUPS[e[1]].label}</small></div><div class="val num">${e[2]} × ${e[3]}${e[5] === 's' ? ' sec' : ''}<small>${e[4] ? e[4] + ' kg' : 'Bodyweight'}</small></div></div>`).join('')}</div>
    </div>`).join('')}`;
}

function viewProfile() {
  const all = Object.values(S.history).length + (S.finished ? 1 : 0);
  const vol = Object.values(S.history).reduce((a, e) => a + e.volume, 0);
  const sum = weekSummary();
  return `<header class="top"><div><p class="eyebrow">Member since March 2025</p><h1>Profile</h1></div></header>
    <div class="card"><div class="profile"><span class="avatar">${avatarImg()}</span><div><b>Alex Morgan</b><span>Strength program · 5 days a week</span></div></div>
      <div class="mini-stats"><div><b class="num">${all}</b><span>Workouts</span></div><div><b class="num">${(vol / 1000).toFixed(1)}t</b><span>Total lifted</span></div><div><b class="num">${sum.streak}</b><span>Week streak</span></div></div></div>
    <div class="sec-head"><h3>Settings</h3></div>
    <div class="card">
      <div class="setting"><span class="chip" style="--c:#2F6FEB">${ic('timer')}</span><div class="ex-txt"><b>Rest timer</b><small>After each set</small></div>
        <div class="seg" role="group" aria-label="Rest timer length">${[60, 90, 120].map((s) => `<button type="button" data-rest="${s}" aria-pressed="${S.rest === s}">${s}s</button>`).join('')}</div></div>
      <div class="setting"><span class="chip" style="--c:#16A34A">${ic('ruler')}</span><div class="ex-txt"><b>Units</b><small>Weights in kilograms</small></div><span class="badge muted">kg</span></div>
    </div>
    <div class="card">
      <button class="setting" type="button" data-act="reset-today"><span class="chip" style="--c:#D97706">${ic('reset')}</span><div class="ex-txt"><b>Reset today's workout</b><small>Untick all sets for today</small></div><span class="chev">${ic('chevRight')}</span></button>
      <button class="setting danger" type="button" data-act="clear"><span class="chip" style="--c:#B42318">${ic('trash')}</span><div class="ex-txt"><b>${S.sample ? 'Clear sample data' : 'Clear all history'}</b><small>${S.sample ? 'Start with an empty log' : 'Delete every logged workout'}</small></div><span class="chev">${ic('chevRight')}</span></button>
    </div>
    <p class="foot-note">Saved on this device</p>`;
}

/* ---------------- Render ---------------- */
const TABS = [['today', 'Today', 'home'], ['progress', 'Progress', 'chart'], ['plan', 'Plan', 'calendar'], ['profile', 'Profile', 'user']];
function renderNav() {
  const btn = (cls) => ([id, label, icon]) => `<button type="button" class="${cls}" data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></button>`;
  document.getElementById('tabbar').innerHTML = TABS.map(btn('tab')).join('');
  document.getElementById('sideNav').innerHTML = TABS.map(btn('nav-item')).join('');
  const sum = weekSummary();
  document.getElementById('sideGoal').innerHTML = `<b>Weekly goal</b><span class="num">${sum.workouts} of ${sum.planned} workouts done</span><div class="track" style="--c:var(--brand)"><i style="width:${sum.workouts / sum.planned * 100}%"></i></div>`;
}
function render() {
  const v = document.getElementById('view');
  v.innerHTML = { today: viewToday, progress: viewProgress, plan: viewPlan, profile: viewProfile }[tab]();
  document.getElementById('app').classList.toggle('wide', tab !== 'today');
  document.getElementById('app').classList.toggle('narrow', tab === 'plan' || tab === 'profile');
  document.getElementById('panel').innerHTML = tab === 'today' ? panelHtml() : '';
  document.title = `Liftlog · ${TABS.find((t) => t[0] === tab)[1]}`;
  renderNav();
}
function refreshLive() { // after editing weights: update summary without rebuilding inputs
  const h = document.getElementById('hero'); if (h) h.innerHTML = heroToday();
  document.getElementById('panel').innerHTML = tab === 'today' ? panelHtml() : '';
}

/* ---------------- Rest timer ---------------- */
let restLeft = 0, restTotal = 0, restInt = null;
const restEl = document.getElementById('rest');
function restShow(on) {
  restEl.classList.toggle('show', on); restEl.setAttribute('aria-hidden', String(!on));
  restEl.querySelectorAll('button').forEach((b) => b.tabIndex = on ? 0 : -1);
}
function restPaint() {
  document.getElementById('restTime').textContent = `${Math.floor(restLeft / 60)}:${pad(restLeft % 60)}`;
  document.getElementById('restBar').style.width = `${restLeft / restTotal * 100}%`;
}
function startRest() {
  clearInterval(restInt); restTotal = restLeft = S.rest; restPaint(); restShow(true);
  restInt = setInterval(() => { restLeft--; if (restLeft <= 0) { stopRest(); toast('Rest over · next set'); } else restPaint(); }, 1000);
}
function stopRest() { clearInterval(restInt); restShow(false); }
document.getElementById('restAdd').onclick = () => { restLeft += 15; restTotal = Math.max(restTotal, restLeft); restPaint(); };
document.getElementById('restSkip').onclick = stopRest;

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------------- Events ---------------- */
function openFirstIncomplete() {
  open.clear();
  if (!S.sets) return;
  const i = S.sets.findIndex((arr) => arr.some((x) => !x.done));
  if (i >= 0) open.add(i);
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-toggle],[data-tick],[data-act],[data-rest],[data-train]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; stopRest(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.toggle) { const i = +t.dataset.toggle; open.has(i) ? open.delete(i) : open.add(i); render(); return; }
  if (t.dataset.tick) {
    const [i, j] = t.dataset.tick.split(':').map(Number), set = S.sets[i][j];
    set.done = !set.done;
    if (set.done && navigator.vibrate) navigator.vibrate(12);
    const allEx = S.sets[i].every((x) => x.done), allW = S.sets.every((a) => a.every((x) => x.done));
    if (set.done && allEx) {
      open.delete(i);
      const next = S.sets.findIndex((a) => a.some((x) => !x.done)); if (next >= 0) open.add(next);
    }
    if (allW && set.done) { S.finished = true; stopRest(); toast('Workout complete'); }
    else if (set.done) startRest(); else { stopRest(); S.finished = false; }
    save(); render();
    if (set.done && !S.finished) {
      const nx = document.querySelector('.ex.open .tick[aria-pressed="false"]');
      if (nx) nx.closest('.set-row').scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    return;
  }
  if (t.dataset.rest) { S.rest = +t.dataset.rest; save(); render(); return; }
  if (t.dataset.train) { S.wid = t.dataset.train; S.sets = freshSets(S.wid); S.finished = false; openFirstIncomplete(); save(); render(); return; }
  const act = t.dataset.act;
  if (act === 'finish') {
    if (!liveEntry().sets) { toast('Tick at least one set first'); return; }
    S.finished = true; open.clear(); stopRest(); save(); render(); toast('Workout saved'); window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (act === 'resume') { S.finished = false; openFirstIncomplete(); save(); render(); }
  else if (act === 'reset-today') {
    if (!confirm("Reset today's workout? All ticks and edited weights for today will be cleared.")) return;
    const wid = PLAN[dow(today())]; S.wid = wid; S.sets = wid ? freshSets(wid) : null; S.finished = false; openFirstIncomplete(); save(); render(); toast("Today's workout reset");
  } else if (act === 'clear') {
    if (!confirm(S.sample ? 'Clear sample data and start fresh?' : 'Delete all logged workouts?')) return;
    const wid = PLAN[dow(today())];
    Object.assign(S, { history: {}, wid, sets: wid ? freshSets(wid) : null, finished: false, sample: false });
    openFirstIncomplete(); save(); render(); toast('History cleared');
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target; if (!el.dataset || !el.dataset.k) return;
  const v = el.value === '' ? 0 : Math.max(0, +el.value);
  S.sets[+el.dataset.ex][+el.dataset.set][el.dataset.k] = v;
  save(); refreshLive();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') stopRest(); });

load();
document.getElementById('sideAvatar').innerHTML = avatarImg();
openFirstIncomplete();
render();
</script>
</body>
</html>
