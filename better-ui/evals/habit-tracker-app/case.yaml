schema_version: "1.1"
name: habit-tracker-app
expected_outcome: |
  A working habit tracker at the level of popular Dribbble habit-app shots: a clear art direction,
  a hero card summarising today, habits with their own colour and icon, streaks shown as designed
  objects, history as a visual, an unmistakable daily tick with a satisfying state, an inviting
  first run, persistence, a composed multi-column desktop layout and a thumb-friendly phone
  layout.
