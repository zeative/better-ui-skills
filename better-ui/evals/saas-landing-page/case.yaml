schema_version: "1.1"
name: saas-landing-page
expected_outcome: |
  A landing page that makes a specific case for this invoicing product to freelancers: a first
  screen that says what it is and shows it, features presented as evidence rather than an icon
  grid, honest pricing, a working signup form with validation states, no invented testimonials or
  statistics, a visual identity that would not fit an unrelated product, and a layout that is
  designed (not just narrowed) at phone width.
