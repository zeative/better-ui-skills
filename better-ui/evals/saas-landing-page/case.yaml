schema_version: "1.1"
name: saas-landing-page
expected_outcome: |
  A landing page at the level of popular Dribbble shots for SaaS landing pages: a committed art
  direction, a hero led by a detailed product visual with floating detail cards and atmosphere, a
  feature section whose tiles each carry their own mini interface, designed pricing with a
  featured plan, a closing band with a visual, specific and honest copy, and a phone layout that
  is recomposed and still striking.
