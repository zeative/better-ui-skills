schema_version: "1.1"
name: store-admin-dashboard
expected_outcome: |
  An Indonesian admin dashboard at the level of popular Dribbble dashboard shots: a full app
  shell, content on cards over a tinted canvas, a hero module, KPI tiles with icon chips and mini
  visuals, a beautifully drawn 7-day chart plus other chart forms, order and product lists with
  thumbnails, avatars and status pills, believable reconciled rupiah data, a clear "what needs
  attention" module, and a designed phone layout.
