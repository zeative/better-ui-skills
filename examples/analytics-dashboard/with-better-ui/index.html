<style>
/* palette for #0F7B5F (OKLCH 0.520 0.1 169.2), neutral tint 0.012. Generated by palette.cjs; do not edit by hand. */
:root {
  --b1: #FBFDFC;
  --b2: #F5FAF8;
  --b3: #EAF5F0;
  --b4: #DDEEE7;
  --b5: #CEE6DC;
  --b6: #BADACD;
  --b7: #A2CABB;
  --b8: #7FB5A1;
  --b9: #0F7B5F;
  --b10: #037257;
  --b11: #2B7961;
  --b12: #143B2E;
  --n1: #FAFDFC;
  --n2: #F6FAF8;
  --n3: #EDF2F0;
  --n4: #E4EAE8;
  --n5: #DCE3E0;
  --n6: #D4DCD9;
  --n7: #C8D1CD;
  --n8: #B5BEBA;
  --n9: #87908C;
  --n10: #7D8682;
  --n11: #5E6663;
  --n12: #1B211F;
  --ok-3: #E9F6EB; --ok-9: #139948; --ok-11: #137E3B;
  --warn-3: #FAF0E4; --warn-9: #AB7302; --warn-11: #8D5E05;
  --bad-3: #FFEDEB; --bad-9: #CE514D; --bad-11: #A9433F;
  --hue: 169.2; /* brand hue, for tinted shadows: oklch(0.30 0.03 var(--hue) / .08) */
  /* roles */
  --canvas: var(--n2); --surface: #FFFFFF; --surface-raised: #FFFFFF; --well: var(--n3);
  --line: var(--n6); --line-input: var(--n7); --line-strong: var(--n8);
  --text-1: var(--n12); --text-2: var(--n11); --text-3: var(--n9);
  --brand: var(--b9); --brand-hover: var(--b10); --brand-ink: #FFFFFF; --brand-text: var(--b11);
  --tint: var(--b3); --tint-hover: var(--b4); --tint-pressed: var(--b5); --tint-line: var(--b6); --callout: var(--b2);
  --focus: var(--b9);
  --up: var(--ok-11); --down: var(--bad-11); --warning: var(--warn-11);
  --chart-1: var(--b9); --chart-compare: var(--n8); --chart-grid: var(--n4);
  --chart-area: linear-gradient(to bottom, color-mix(in oklch, var(--b9) 20%, transparent), transparent);
  /* contrast: text-1 15.6, text-2 5.9, text-3 3.3, brand-text on tint 4.7, brand-ink on brand 5.2 */
  --shadow-card: 0 1px 2px oklch(0.30 0.03 169.2 / 0.06), 0 2px 4px oklch(0.30 0.03 169.2 / 0.04);
  --shadow-pop: 0 2px 4px oklch(0.30 0.03 169.2 / 0.06), 0 8px 16px oklch(0.30 0.03 169.2 / 0.08);
  --shadow-sheet: 0 4px 8px oklch(0.30 0.03 169.2 / 0.06), 0 16px 32px oklch(0.30 0.03 169.2 / 0.10);
  --shadow-brand: 0 4px 12px color-mix(in oklch, var(--brand) 28%, transparent);
  --highlight: inset 0 1px 0 oklch(1 0 0 / 0.7);
}
.theme-dark, :root[data-theme="dark"] {
  color-scheme: dark;
  --b1: #0F1613;
  --b2: #121C18;
  --b3: #132C23;
  --b4: #123A2D;
  --b5: #194738;
  --b6: #235343;
  --b7: #2E6452;
  --b8: #397863;
  --b9: #0F7B5F;
  --b10: #2F866B;
  --b11: #8CC4AF;
  --b12: #D2E7DE;
  --n1: #101211;
  --n2: #171A19;
  --n3: #1F2322;
  --n4: #272B29;
  --n5: #2D3230;
  --n6: #353C39;
  --n7: #424A47;
  --n8: #5A625F;
  --n9: #67706D;
  --n10: #757E7A;
  --n11: #AFB6B3;
  --n12: #ECEFEE;
  --ok-3: #0E2E17; --ok-9: #139948; --ok-11: #84C992;
  --warn-3: #362201; --warn-9: #AB7302; --warn-11: #DDAC67;
  --bad-3: #3E1A18; --bad-9: #CE514D; --bad-11: #F19B94;
  --hue: 169.2; /* brand hue, for tinted shadows: oklch(0.30 0.03 var(--hue) / .08) */
  /* roles */
  --canvas: var(--n1); --surface: var(--n2); --surface-raised: var(--n3); --well: var(--n1);
  --line: var(--n6); --line-input: var(--n7); --line-strong: var(--n8);
  --text-1: var(--n12); --text-2: var(--n11); --text-3: var(--n9);
  --brand: var(--b9); --brand-hover: var(--b10); --brand-ink: #FFFFFF; --brand-text: var(--b11);
  --tint: var(--b3); --tint-hover: var(--b4); --tint-pressed: var(--b5); --tint-line: var(--b6); --callout: var(--b2);
  --focus: var(--b9);
  --up: var(--ok-11); --down: var(--bad-11); --warning: var(--warn-11);
  --chart-1: var(--b9); --chart-compare: var(--n8); --chart-grid: var(--n4);
  --chart-area: linear-gradient(to bottom, color-mix(in oklch, var(--b9) 20%, transparent), transparent);
  /* contrast: text-1 16.2, text-2 8.5, text-3 3.5, brand-text on tint 7.5, brand-ink on brand 5.2 */
  --shadow-pop: 0 0 0 1px var(--n6); --shadow-sheet: 0 0 0 1px var(--n6);
  --highlight: inset 0 1px 0 oklch(1 0 0 / 0.08);
}

/* better-ui tokens. Copy verbatim below the palette.cjs output; fill the font families from look.cjs.
   Every value comes from references/spec.md. Build only from these; do not invent sizes or spaces. */
:root {
  /* COLOUR: paste the output of `node scripts/palette.cjs "<brand hex>"` ABOVE this file. It defines
     --b1..--b12, --n1..--n12, --ok/--warn/--bad, and the roles used below (--canvas, --surface, --well,
     --line, --text-1/2/3, --brand, --brand-ink, --brand-text, --tint, --callout, --focus, --up, --down,
     shadows and --highlight). Never write a hex value for a neutral or a shade of the brand by hand. */
  --accent: var(--b9);                       /* a second colour from look.cjs only if the look calls for one */
  --surface-2: var(--well);                  /* alias kept for older names */
  --brand-tint: var(--tint);                 /* alias */

  /* spacing: the only values allowed */
  --s-0: 0; --s-2: 2px; --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px; --s-24: 24px;
  --s-32: 32px; --s-40: 40px; --s-48: 48px; --s-64: 64px; --s-80: 80px; --s-96: 96px; --s-128: 128px;

  /* radius */
  --r-badge: 6px; --r-sm: 8px; --r-md: 12px; --r-btn: 14px; --r-card: 16px; --r-lg: 20px; --r-sheet: 24px; --r-full: 999px;

  /* motion */
  --ease: cubic-bezier(.2,.8,.2,1); --t-fast: 150ms; --t-move: 240ms;

  /* fonts (from look.cjs) */
  --font: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; /* replace family */
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;                  /* replace family */
}

/* dark: palette.cjs prints the dark block (.theme-dark, :root[data-theme="dark"]); --dark puts it on :root. */

/* type ramp, phone (spec.md): exactly 44, 28, 20, 16, 13 (+11 tab labels). Desktop 32/24/18/14/12 and landing 64/40/20/16/13 are in spec.md. */
.t-display  { font: 600 44px/48px var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-title    { font: 600 28px/34px var(--font); letter-spacing: -0.015em; }
.t-headline { font: 600 20px/26px var(--font); letter-spacing: -0.01em; }
.t-body     { font: 400 16px/24px var(--font); }
.t-strong   { font: 500 16px/24px var(--font); }
.t-caption  { font: 400 13px/18px var(--font); color: var(--text-2); }
.t-meta     { font: 500 13px/18px var(--mono); }
.t-tab      { font: 500 11px/13px var(--font); }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--text-1); font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.num, [data-num] { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; animation-duration: 0s !important; } }


/* ---------- app ---------- */
:root {
  --fs-kpi: 600 32px/40px var(--font);
  --fs-title: 600 24px/32px var(--font);
  --fs-h: 600 18px/24px var(--font);
  --fs-body: 400 14px/20px var(--font);
  --fs-strong: 500 14px/20px var(--font);
  --fs-cap: 400 12px/16px var(--font);
  --fs-meta: 500 12px/16px var(--mono);
  --row: 48px;
  --src-1: var(--b9); --src-2: var(--b7); --src-3: var(--b5); --src-4: var(--n8); --src-5: var(--b12);
}
* { box-sizing: border-box; }
body { font: var(--fs-body); min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }

/* sidebar */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: var(--s-16) var(--s-12); border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: var(--s-12); height: 40px; padding: 0 var(--s-8); font: 600 14px/20px var(--font); }
.mark { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.mark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.brand small { font: var(--fs-cap); color: var(--text-2); display: block; }
.nav-label { font: 500 12px/16px var(--font); color: var(--text-2); padding: 0 var(--s-8); margin: var(--s-24) 0 var(--s-8); }
.nav { display: grid; gap: var(--s-2); }
.nav a { display: flex; align-items: center; gap: var(--s-12); height: 36px; padding: 0 var(--s-8); border-radius: var(--r-sm); font: var(--fs-strong); color: var(--text-2); transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.nav a:hover { background: var(--well); color: var(--text-1); }
.nav a[aria-current] { background: var(--tint); color: var(--brand-text); }
.nav .count { margin-left: auto; font: var(--fs-meta); }
.user { margin-top: auto; display: flex; align-items: center; gap: var(--s-12); padding: var(--s-12) var(--s-8) 0; border-top: 1px solid var(--line); }
.avatar { width: 32px; height: 32px; border-radius: var(--r-full); background: var(--tint); color: var(--brand-text); display: grid; place-items: center; font: 600 12px/16px var(--font); flex: none; }
.user b { display: block; font: var(--fs-strong); }
.user span { font: var(--fs-cap); color: var(--text-2); }

/* top bar */
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: var(--s-16); padding: 0 var(--s-32); background: color-mix(in oklch, var(--canvas) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top h1 { font: var(--fs-h); letter-spacing: -0.01em; }
.top .period { font: var(--fs-meta); color: var(--text-2); }
.top .sp { flex: 1; }
.top .brand { display: none; padding: 0; }
.live { display: inline-flex; align-items: center; gap: var(--s-8); font: var(--fs-meta); color: var(--text-2); white-space: nowrap; }
.live b { font-weight: 500; color: var(--text-1); }
.dot-live { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--ok-9); box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok-9) 50%, transparent); animation: pulse 2s var(--ease) infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.seg { display: inline-flex; padding: var(--s-2); background: var(--well); border-radius: var(--r-sm); }
.seg button { height: 32px; padding: 0 var(--s-12); border-radius: 6px; font: var(--fs-meta); color: var(--text-2); white-space: nowrap; transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.seg button:hover { color: var(--text-1); }
.seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-1); box-shadow: var(--shadow-card), var(--highlight); }
.seg.text button { font: 500 12px/16px var(--font); }
.btn { display: inline-flex; align-items: center; gap: var(--s-8); height: 36px; padding: 0 var(--s-16); border-radius: var(--r-sm); border: 1px solid var(--line-input); background: var(--surface); font: var(--fs-strong); white-space: nowrap; transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.btn svg.i { width: 16px; height: 16px; }
.btn:hover { background: var(--n3); }
.btn:active { transform: scale(.98); }

/* content */
.content { max-width: 1344px; margin: 0 auto; padding: var(--s-32); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-24); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-24); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-16); margin-bottom: var(--s-16); min-height: 36px; }
.card h2 { font: var(--fs-h); letter-spacing: -0.01em; }
.link { font: var(--fs-strong); color: var(--brand-text); display: inline-flex; align-items: center; gap: var(--s-4); white-space: nowrap; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link svg.i { width: 16px; height: 16px; }

.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-24); }
.kpi-rest { display: contents; }
.kpi .label { font: var(--fs-cap); color: var(--text-2); }
.kpi .label .when { display: none; }
.kpi .fig { font: var(--fs-kpi); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: var(--s-4); }
.kpi .fig small { font: var(--fs-h); color: var(--text-2); letter-spacing: 0; }
.delta { font: var(--fs-meta); color: var(--text-2); margin-top: var(--s-8); white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }

.chart-card, .pages { grid-column: span 8; }
.sources, .funnel { grid-column: span 4; }
.range-phone { display: none; }

.legend { display: flex; flex-wrap: wrap; gap: var(--s-4) var(--s-16); font: var(--fs-cap); color: var(--text-2); margin-bottom: var(--s-16); }
.legend span { display: inline-flex; align-items: center; gap: var(--s-8); white-space: nowrap; }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.sw.dash { width: 12px; height: 0; border-top: 2px dashed var(--n10); border-radius: 0; }
.chart { position: relative; height: 320px; outline-offset: 4px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font: var(--fs-meta); fill: var(--text-3); }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart { cursor: crosshair; touch-action: pan-y; }
.chart .layer { stroke: var(--surface); stroke-width: 1; stroke-linejoin: round; }
.chart .prev { fill: none; stroke: var(--n10); stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linecap: round; }
.chart .prev-halo { fill: none; stroke: var(--surface); stroke-width: 4; opacity: .7; }
.chart .cursor line { stroke: var(--text-1); stroke-width: 1; }
.chart .cursor circle { fill: var(--surface); stroke: var(--text-1); stroke-width: 2; }
.tip { position: absolute; top: 0; left: 0; z-index: 3; min-width: 208px; padding: var(--s-12); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-pop), var(--highlight); pointer-events: none; opacity: 0; transition: opacity var(--t-fast) var(--ease); font: var(--fs-cap); color: var(--text-2); }
.tip.show { opacity: 1; }
.tip .t-head { display: flex; justify-content: space-between; gap: var(--s-16); align-items: baseline; }
.tip .t-date { font: var(--fs-meta); }
.tip .t-total { font: 600 14px/20px var(--font); color: var(--text-1); font-variant-numeric: tabular-nums; }
.tip .t-prev { font: var(--fs-meta); margin: var(--s-2) 0 var(--s-8); text-align: right; }
.tip ul { list-style: none; margin: 0; padding: var(--s-8) 0 0; border-top: 1px solid var(--line); display: grid; gap: var(--s-4); }
.tip li { display: flex; align-items: center; gap: var(--s-8); }
.tip li b { margin-left: auto; font: var(--fs-meta); color: var(--text-1); }

/* sources */
.share { display: flex; gap: var(--s-2); height: 12px; margin-bottom: var(--s-16); }
.share i { display: block; height: 100%; border-radius: 3px; min-width: 4px; transition: flex-grow var(--t-move) var(--ease); }
.share i:first-child { border-radius: var(--r-full) 3px 3px var(--r-full); }
.share i:last-child { border-radius: 3px var(--r-full) var(--r-full) 3px; }
table { width: 100%; border-collapse: collapse; }
th { font: 500 12px/16px var(--font); color: var(--text-2); text-align: left; height: 32px; padding: 0 var(--s-16); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { height: var(--row); padding: 0 var(--s-16); border-bottom: 1px solid var(--line); font: var(--fs-body); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.sources th, .sources td { padding: 0 var(--s-8); }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
.r { text-align: right; font-variant-numeric: tabular-nums; }
td.m { font: var(--fs-meta); color: var(--text-2); }
td.name { font: var(--fs-strong); }
.src-name { display: flex; align-items: center; gap: var(--s-12); }
tbody tr { transition: background var(--t-fast) var(--ease); }
.pages tbody tr:hover { background: var(--callout); }
th button { display: inline-flex; align-items: center; gap: var(--s-4); font: inherit; color: inherit; height: 32px; }
th button:hover { color: var(--text-1); }
th[aria-sort] button { color: var(--text-1); }
th button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: transform var(--t-fast) var(--ease); }
th[aria-sort] button svg { opacity: 1; }
th[aria-sort="ascending"] button svg { transform: rotate(180deg); }
.path { font: 500 12px/16px var(--mono); color: var(--text-1); }
.path-title { display: none; }
.vis { display: flex; align-items: center; justify-content: flex-end; gap: var(--s-12); }
.meter { width: 64px; height: 4px; border-radius: var(--r-full); background: var(--well); overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; border-radius: var(--r-full); background: var(--b8); }

/* funnel */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-24); }
.step-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-12); }
.step-top span { font: var(--fs-strong); }
.step-top b { font: var(--fs-strong); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: var(--r-full); background: var(--well); margin: var(--s-8) 0 var(--s-4); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: var(--r-full); background: var(--brand); min-width: 4px; transition: width var(--t-move) var(--ease); }
.step-note { font: var(--fs-meta); color: var(--text-2); }

.tabs { display: none; }

/* ---------- tablet ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top .brand { display: flex; }
  .top h1 { display: none; }
  .chart-card, .sources, .pages, .funnel { grid-column: 1 / -1; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content { padding-bottom: calc(64px + var(--s-24) + env(safe-area-inset-bottom)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); }
  .tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-4); font: 500 11px/13px var(--font); color: var(--text-2); }
  .tabs a svg.i { width: 24px; height: 24px; }
  .tabs a[aria-current] { color: var(--brand-text); }
  .tabs a[aria-current] svg.i { color: var(--brand); }
  .card { scroll-margin-top: 72px; }
}

/* ---------- phone ---------- */
@media (max-width: 640px) {
  :root {
    --fs-kpi: 600 20px/26px var(--font);

<script>
(() => {
  // ---------- sample data: 168 days ending 16 Nov 2026, generated from one seed ----------
  const DAYS = 168, END = new Date(2026, 10, 16);
  let seed = 20261116;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const SOURCES = [
    { name: 'Organic search', w: .42, cr: .026 },
    { name: 'Direct',         w: .24, cr: .034 },
    { name: 'Referral',       w: .15, cr: .039 },
    { name: 'Social',         w: .12, cr: .011 },
    { name: 'Email',          w: .07, cr: .052 },
  ];
  const PAGES = [
    { path: '/',                               title: 'Home',                    w: .31, sw: .33 },
    { path: '/pricing',                        title: 'Pricing',                 w: .17, sw: .27 },
    { path: '/features/shared-inbox',          title: 'Shared inbox',            w: .11, sw: .10 },
    { path: '/blog/support-metrics-that-matter', title: 'Blog post',             w: .08, sw: .03 },
    { path: '/integrations/slack',             title: 'Slack integration',       w: .06, sw: .07 },
    { path: '/templates',                      title: 'Reply templates',         w: .05, sw: .04 },
  ];
  const WD = [.62, 1.08, 1.12, 1.1, 1.06, .98, .66]; // Sun..Sat
  const days = [];
  for (let d = 0; d < DAYS; d++) {
    const date = new Date(END); date.setDate(END.getDate() - (DAYS - 1 - d));
    const base = (1180 + d * 2.1) * WD[date.getDay()];
    const v = SOURCES.map((s, i) => {
      let x = base * s.w * (.88 + rnd() * .24);
      if (i === 4 && date.getDay() === 2) x *= 2.3;            // Tuesday newsletter
      if (i === 3 && rnd() > .93) x *= 1.9;                    // a post that travels
      return Math.round(x);
    });
    const s = v.map((x, i) => Math.round(x * SOURCES[i].cr * (.8 + rnd() * .4)));
    const tv = v.reduce((a, b) => a + b, 0), ts = s.reduce((a, b) => a + b, 0);
    days.push({
      date, v, s, tv, ts,
      bounce: Math.round(tv * (.43 - d * .00015 + (rnd() - .5) * .05)),
      pricing: Math.round(tv * (.21 + rnd() * .04)),
      started: Math.round(ts / (.6 + rnd() * .08)),
      pv: PAGES.map(p => tv * p.w * (.85 + rnd() * .3 + d * .0004 * (p.sw > .2 ? 1 : -1))),
      ps: PAGES.map(p => ts * p.sw * (.85 + rnd() * .3)),
    });
  }

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const nf = new Intl.NumberFormat('en-US');
  const md = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const pct = (x, dp = 1) => (x * 100).toFixed(dp) + '%';
  const signed = (x, dp = 1) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(dp);
  const chg = (a, b) => (a - b) / b * 100;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const state = { range: 28, metric: 'v', sort: 'v', dir: -1, active: -1 };
  const RANGE_NAME = { 7: '7 days', 28: '4 weeks', 84: '12 weeks' };

  function slice() {
    const cur = days.slice(DAYS - state.range), prev = days.slice(DAYS - 2 * state.range, DAYS - state.range);
    return { cur, prev };
  }
  function buckets(list) {
    const size = state.range === 84 ? 7 : 1, out = [];
    for (let i = 0; i < list.length; i += size) {
      const g = list.slice(i, i + size);
      out.push({ from: g[0].date, to: g[g.length - 1].date,
        v: SOURCES.map((_, k) => sum(g, d => d.v[k])), s: SOURCES.map((_, k) => sum(g, d => d.s[k])) });
    }
    return out;
  }

  // ---------- KPIs ----------
  function renderKpis({ cur, prev }) {
    const t = l => ({ v: sum(l, d => d.tv), s: sum(l, d => d.ts), b: sum(l, d => d.bounce) });
    const a = t(cur), b = t(prev), vs = `vs previous ${RANGE_NAME[state.range]}`;
    const when = `${md(cur[0].date)} – ${md(cur[cur.length - 1].date)}`;
    const tile = (key, label, fig, delta, good) => {
      $(`[data-kpi="${key}"]`).innerHTML =
        `<div class="label">${label}<span class="when"> · ${when}</span></div><div class="fig">${fig}</div>` +
        `<div class="delta"><span class="${good ? 'up' : 'down'}">${delta}</span> <span>${vs}</span></div>`;
    };
    const cv = a.s / a.v, cvp = b.s / b.v, br = a.b / a.v, brp = b.b / b.v;
    tile('visitors', 'Visitors', nf.format(a.v), signed(chg(a.v, b.v)) + '%', a.v >= b.v);
    tile('signups', 'Signups', nf.format(a.s), signed(chg(a.s, b.s)) + '%', a.s >= b.s);
    tile('conv', 'Conversion', (cv * 100).toFixed(2) + '<small>%</small>', signed((cv - cvp) * 100, 2) + ' pt', cv >= cvp);
    tile('bounce', 'Bounce rate', (br * 100).toFixed(1) + '<small>%</small>', signed((br - brp) * 100, 1) + ' pt', br <= brp);
    $('[data-period]').textContent = `${when}, 2026`;
  }

  // ---------- main chart: stacked bars by source over ghost bars for the previous period ----------
  const chartEl = $('#chart'), tip = $('#tip');
  let geo = null;
  function niceMax(m) {
    const p = Math.pow(10, Math.floor(Math.log10(m / 5)));
    const step = [1, 2, 2.5, 5, 10].map(k => k * p).find(k => Math.ceil(m / k) <= 5);
    const ticks = Math.ceil(m / step);
    return { step, ticks, max: step * ticks };
  }
  const smooth = pts => pts.reduce((d, p, i) => {
    if (i === 0) return `M${p}`;
    const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p3 = pts[i + 1] || p;
    const c1 = [p1[0] + (p[0] - p0[0]) / 6, p1[1] + (p[1] - p0[1]) / 6];
    const c2 = [p[0] - (p3[0] - p1[0]) / 6, p[1] - (p3[1] - p1[1]) / 6];
    return `${d} C${c1} ${c2} ${p}`;
  }, '');
  function renderChart({ cur, prev }) {
    const B = buckets(cur), P = buckets(prev), k = state.metric, n = B.length;
    const W = chartEl.clientWidth, H = chartEl.clientHeight, phone = innerWidth <= 640;
    const padL = phone ? 0 : 48, padR = phone ? 0 : 8, padT = 8, padB = 28;
    const pw = W - padL - padR, ph = H - padT - padB, dx = pw / (n - 1), base = padT + ph;
    const tot = b => b[k].reduce((a, c) => a + c, 0);
    const { step, max, ticks } = niceMax(Math.max(...B.map(tot), ...P.map(tot)));
    const y = v => padT + ph - v / max * ph, x = i => padL + dx * i;
    const fmtAxis = v => v >= 1000 ? (v / 1000) + 'k' : String(v);
    let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
    for (let i = 0; i <= ticks; i++) {
      const gy = Math.round(y(step * i)) + .5;
      if (!phone || i === 0) s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}"/>`;
      if (!phone) s += `<text x="${padL - 12}" y="${gy + 4}" text-anchor="end">${fmtAxis(step * i)}</text>`;
    }
    // stacked areas, drawn from the full total down so each layer covers the one above it
    for (let j = SOURCES.length - 1; j >= 0; j--) {
      const pts = B.map((b, i) => [x(i), y(b[k].slice(0, j + 1).reduce((a, c) => a + c, 0))]);
      s += `<path class="layer" fill="var(--src-${j + 1})" d="${smooth(pts)} L${x(n - 1)},${base} L${x(0)},${base}z"/>`;
    }
    const pp = smooth(P.map((b, i) => [x(i), y(tot(b))]));
    s += `<path class="prev-halo" d="${pp}"/><path class="prev" d="${pp}"/>`;
    const every = Math.ceil(n / (phone ? 4 : 7));
    B.forEach((b, i) => {
      if ((n - 1 - i) % every !== 0) return;
      const edge = 'middle';
      const lx = phone ? Math.min(W - 20, Math.max(20, x(i))) : x(i);
      s += `<text x="${lx}" y="${H - 6}" text-anchor="${i === n - 1 ? 'end' : edge}">${md(b.from)}</text>`;
    });
    s += `<g class="cursor" style="display:none"><line y1="${padT}" y2="${base}"/><circle r="5"/></g>`;
    s += '</svg>';
    chartEl.querySelector('svg')?.remove();
    chartEl.insertAdjacentHTML('afterbegin', s);
    geo = { B, P, k, tot, dx, padL, x, y, W, n };
    const label = k === 'v' ? 'Visitors' : 'Signups';
    $('#chart-title').textContent = `${label} by source`;
    chartEl.setAttribute('aria-label', `${label} by source, ${n} ${state.range === 84 ? 'weeks' : 'days'}. Use arrow keys to read each point.`);
    setActive(-1);
  }
  function setActive(i) {
    state.active = i;
    const cur = $('.cursor', chartEl);
    if (i < 0 || !geo) { tip.classList.remove('show'); if (cur) cur.style.display = 'none'; return; }
    const { B, P, k, tot, x, y, W } = geo, b = B[i], t = tot(b), p = tot(P[i]), d = chg(t, p), cx = x(i);
    cur.style.display = ''; cur.setAttribute('transform', `translate(${cx},0)`); $('circle', cur).setAttribute('cy', y(t));
    const date = state.range === 84 ? `${md(b.from)} – ${md(b.to)}` : b.from.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    tip.innerHTML = `<div class="t-head"><span class="t-date">${date}</span><span class="t-total">${nf.format(t)}</span></div>` +
      `<div class="t-prev"><span class="${d >= 0 ? 'up' : 'down'}">${signed(d)}%</span> vs ${nf.format(p)}</div><ul>` +
      SOURCES.map((s, j) => `<li><i class="sw" style="background:var(--src-${j + 1})"></i>${s.name}<b>${nf.format(b[k][j])}</b></li>`).join('') + '</ul>';
    const tw = tip.offsetWidth;
    let tx = cx + 16; if (tx + tw > W - 8) tx = cx - 16 - tw; if (tx < 8) tx = 8;
    tip.style.transform = `translate(${Math.round(tx)}px, 8px)`;
    tip.classList.add('show');
  }
  const pick = e => { const r = chartEl.getBoundingClientRect(); return Math.max(0, Math.min(geo.n - 1, Math.round((e.clientX - r.left - geo.padL) / geo.dx))); };
  chartEl.addEventListener('pointermove', e => { const i = pick(e); if (i !== state.active) setActive(i); });
  chartEl.addEventListener('pointerdown', e => setActive(pick(e)));
  chartEl.addEventListener('pointerleave', () => setActive(-1));
  chartEl.addEventListener('blur', () => setActive(-1));
  chartEl.addEventListener('keydown', e => {
    const n = geo.n;
    if (e.key === 'ArrowRight') setActive(state.active < 0 ? 0 : Math.min(n - 1, state.active + 1));
    else if (e.key === 'ArrowLeft') setActive(state.active < 0 ? n - 1 : Math.max(0, state.active - 1));
    else if (e.key === 'Escape') setActive(-1); else return;
    e.preventDefault();
  });
  $('#legend').innerHTML = SOURCES.map((s, j) => `<span><i class="sw" style="background:var(--src-${j + 1})"></i>${s.name}</span>`).join('') + '<span><i class="sw dash"></i>Previous period</span>';

  // ---------- traffic sources ----------
  function renderSources({ cur }) {
    const tv = sum(cur, d => d.tv);
    const rows = SOURCES.map((s, j) => ({ ...s, j, v: sum(cur, d => d.v[j]), s: sum(cur, d => d.s[j]) }));
    $('#share').innerHTML = rows.map(r => `<i style="flex:${r.v} 0 0;background:var(--src-${r.j + 1})"></i>`).join('');
    $('#src-body').innerHTML = rows.map(r =>
      `<tr><td class="name"><span class="src-name"><i class="sw" style="background:var(--src-${r.j + 1})"></i>${r.name}</span></td>` +
      `<td class="r">${nf.format(r.v)}</td><td class="r m col-x">${pct(r.v / tv)}</td><td class="r m">${pct(r.s / r.v, 2)}</td></tr>`).join('');
  }

  // ---------- top pages ----------
  const COLS = [
    { key: 'path', label: 'Page' }, { key: 'v', label: 'Visitors', r: 1 }, { key: 'd', label: 'Change', r: 1, x: 1 },
    { key: 's', label: 'Signups', r: 1, x: 1 }, { key: 'c', label: 'Conv.', r: 1 },
  ];
  function renderPages({ cur, prev }) {
    const rows = PAGES.map((p, j) => {
      const v = Math.round(sum(cur, d => d.pv[j])), vp = Math.round(sum(prev, d => d.pv[j])), s = Math.round(sum(cur, d => d.ps[j]));
      return { ...p, v, s, d: chg(v, vp), c: s / v };
    });
    const k = state.sort;
    rows.sort((a, b) => (k === 'path' ? a.path.localeCompare(b.path) : a[k] - b[k]) * state.dir);
    const top = Math.max(...rows.map(r => r.v));
    $('#page-head').innerHTML = COLS.map(c =>
      `<th class="${c.r ? 'r' : ''} ${c.x ? 'col-x' : ''}" ${c.key === k ? `aria-sort="${state.dir > 0 ? 'ascending' : 'descending'}"` : ''}>` +
      `<button data-sort="${c.key}">${c.label}<svg viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg></button></th>`).join('');
    $('#page-body').innerHTML = rows.map(r =>
      `<tr><td class="name"><span class="path">${r.path}</span><span class="path-title">${r.title}</span></td>` +
      `<td class="r"><span class="vis"><span class="meter"><i style="width:${r.v / top * 100}%"></i></span>${nf.format(r.v)}</span></td>` +
      `<td class="r m col-x"><span class="${r.d >= 0 ? 'up' : 'down'}">${signed(r.d)}%</span></td>` +
      `<td class="r col-x">${nf.format(r.s)}</td><td class="r m">${pct(r.c, 2)}</td></tr>`).join('');
  }
  $('#page-head').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]'); if (!b) return;
    const k = b.dataset.sort;
    if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = k === 'path' ? 1 : -1; }
    renderPages(slice());
    $(`[data-sort="${k}"]`).focus();
  });

  // ---------- funnel ----------
  function renderFunnel({ cur }) {
    const steps = [
      ['Visited the site', sum(cur, d => d.tv)], ['Viewed pricing', sum(cur, d => d.pricing)],
      ['Started signup', sum(cur, d => d.started)], ['Created an account', sum(cur, d => d.ts)],
    ];
    $('#steps').innerHTML = steps.map(([name, n], i) => {
      const note = i === 0 ? 'All visitors' : `${pct(n / steps[i - 1][1])} of previous step`;
      return `<li><div class="step-top"><span>${name}</span><b>${nf.format(n)}</b></div>` +
        `<div class="track"><i style="width:${n / steps[0][1] * 100}%"></i></div><div class="step-note">${note}</div></li>`;
    }).join('');
  }

  // ---------- controls ----------
  function sync() {
    $$('[data-range] button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.range));
    $$('[data-metric] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.metric));
  }
  function render() { const s = slice(); sync(); renderKpis(s); renderChart(s); renderSources(s); renderPages(s); renderFunnel(s); }
  document.addEventListener('click', e => {
    const r = e.target.closest('[data-range] button'), m = e.target.closest('[data-metric] button');
    if (r) { state.range = +r.dataset.v; render(); }
    if (m) { state.metric = m.dataset.v; sync(); renderChart(slice()); }
  });
  $('#export').addEventListener('click', () => {
    const { cur } = slice();
    const head = ['date', ...SOURCES.flatMap(s => [s.name + ' visitors', s.name + ' signups']), 'visitors', 'signups'];
    const lines = cur.map(d => [d.date.toISOString().slice(0, 10), ...d.v.flatMap((v, i) => [v, d.s[i]]), d.tv, d.ts].join(','));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([head.join(',') + '\n' + lines.join('\n')], { type: 'text/csv' }));
    a.download = `relay-overview-${state.range}d.csv`; a.click(); URL.revokeObjectURL(a.href);
  });

  // live visitors: the product's status dot
  let live = 38;
  const paintLive = () => $$('[data-live]').forEach(el => el.textContent = live);
  paintLive();
  setInterval(() => { live = Math.max(21, Math.min(64, live + Math.round((Math.random() - .5) * 6))); paintLive(); }, 4000);

  let rw = 0;
  new ResizeObserver(() => { if (chartEl.clientWidth !== rw) { rw = chartEl.clientWidth; renderChart(slice()); } }).observe(chartEl);
  render();
})();
</script>
</body>
</html>
