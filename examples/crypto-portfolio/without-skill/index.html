<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Portfolio</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #14171f;
    --surface-2: #1b1f29;
    --border: #232835;
    --text: #eef1f6;
    --muted: #8a93a6;
    --faint: #5b6376;
    --up: #2fd08a;
    --down: #ff5d6c;
    --accent: #7c8cff;
    --radius: 18px;
    --pad: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .app { max-width: 560px; margin: 0 auto; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) var(--pad) 8px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #7c8cff, #2fd08a);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #0b0d12;
  }
  .hdr-title { font-size: 15px; font-weight: 600; color: var(--muted); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border);
  }
  .icon-btn svg { width: 18px; height: 18px; stroke: var(--text); }

  /* Balance */
  .balance { padding: 18px var(--pad) 6px; }
  .balance-label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 0 rgba(47,208,138,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,208,138,.5);} 70% { box-shadow: 0 0 0 7px rgba(47,208,138,0);} 100% { box-shadow: 0 0 0 0 rgba(47,208,138,0);} }
  .balance-value { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-top: 6px; line-height: 1.1; }
  .balance-value .cents { color: var(--muted); font-size: 28px; }
  .balance-change { margin-top: 8px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; min-height: 20px; }
  .pill { padding: 3px 8px; border-radius: 999px; font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill.up { background: rgba(47,208,138,.12); }
  .pill.down { background: rgba(255,93,108,.12); }
  .change-ctx { color: var(--muted); font-weight: 500; }
  .hidden-val { filter: blur(9px); user-select: none; }

  /* Chart */
  .chart-wrap { position: relative; margin-top: 10px; height: 210px; touch-action: pan-y; }
  #chart { width: 100%; height: 100%; display: block; }
  .tip {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .15s;
  }
  .ranges { display: flex; justify-content: space-between; padding: 10px var(--pad) 0; gap: 4px; }
  .ranges button {
    flex: 1; padding: 8px 0; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted);
    transition: background .2s, color .2s;
  }
  .ranges button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

  /* Actions */
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 22px var(--pad) 4px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .action span.ic {
    width: 52px; height: 52px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
    display: grid; place-items: center; transition: transform .12s;
  }
  .action:active span.ic { transform: scale(.94); }
  .action svg { width: 22px; height: 22px; stroke: var(--text); }

  /* Sections */
  section { padding: 26px var(--pad) 0; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .sec-head h2 { font-size: 18px; font-weight: 700; }
  .sec-head button { font-size: 13px; color: var(--accent); font-weight: 600; }

  .alloc { display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
  .alloc div { height: 100%; transition: flex-grow .6s; }
  .alloc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .alloc-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
    padding: 14px 16px; width: 100%; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--border); }
  button.row:active { background: var(--surface-2); }
  .coin-ic {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .row-main { min-width: 0; }
  .row-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-end { text-align: right; }
  .row-end .v { font-size: 15px; font-weight: 600; }
  .row-end .s { font-size: 13px; margin-top: 3px; font-weight: 500; }
  .spark { width: 56px; height: 24px; display: none; }
  .holding { grid-template-columns: 40px 1fr auto; }

  .flash-up { animation: fu .8s; } .flash-down { animation: fd .8s; }
  @keyframes fu { 0% { color: var(--up); } 100% {} }
  @keyframes fd { 0% { color: var(--down); } 100% {} }

  .tx-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; position: relative; }
  .tx-ic svg { width: 18px; height: 18px; }
  .tx-ic .badge {
    position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%;
    font-size: 8px; font-weight: 800; display: grid; place-items: center; color: #fff; border: 2px solid var(--surface);
  }
  .tx-date { font-size: 12px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; padding: 12px 16px 4px; }
  .status-pending { color: #f5b74a; }

  /* Bottom nav */
  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(11,13,18,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar .inner { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-around; }
  nav.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--faint); padding: 4px 12px; }
  nav.tabbar button[aria-current="page"] { color: var(--text); }
  nav.tabbar svg { width: 22px; height: 22px; stroke: currentColor; }

  /* Sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto;
    background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--border); border-bottom: 0;
    padding: 10px var(--pad) calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .grabber { width: 38px; height: 5px; background: var(--border); border-radius: 9px; margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 16px; font-weight: 600; margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--surface-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px;
    font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 400px) {
    .spark { display: block; }
    .holding { grid-template-columns: 40px 1fr 56px auto; }
  }
  @media (min-width: 600px) {
    .app { padding-top: 16px; }
    .balance-value { font-size: 48px; }
    .chart-wrap { height: 260px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">JD</div>
    <div class="hdr-title">Main Portfolio</div>
    <button class="icon-btn" id="toggleHide" aria-label="Hide balances">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <div class="balance">
    <div class="balance-label"><span class="live-dot" aria-hidden="true"></span><span id="balLabel">Total balance</span></div>
    <div class="balance-value num" id="balance" aria-live="polite">—</div>
    <div class="balance-change num" id="balChange"></div>
  </div>

  <div class="chart-wrap" id="chartWrap">
    <svg id="chart" preserveAspectRatio="none" role="img" aria-label="Portfolio value chart"></svg>
    <div class="tip num" id="tip"></div>
  </div>
  <div class="ranges" role="group" aria-label="Chart range" id="ranges">
    <button data-r="1D" aria-pressed="false">1D</button>
    <button data-r="1W" aria-pressed="true">1W</button>
    <button data-r="1M" aria-pressed="false">1M</button>
    <button data-r="3M" aria-pressed="false">3M</button>
    <button data-r="1Y" aria-pressed="false">1Y</button>
    <button data-r="ALL" aria-pressed="false">All</button>
  </div>

  <div class="actions">
    <button class="action" data-act="Buy"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Buy</button>
    <button class="action" data-act="Send"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span>Send</button>
    <button class="action" data-act="Receive"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M16 17H7V8"/></svg></span>Receive</button>
    <button class="action" data-act="Swap"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/></svg></span>Swap</button>
  </div>

  <section>
    <div class="sec-head"><h2>Holdings</h2><button id="sortBtn">Sort: Value</button></div>
    <div class="alloc" id="alloc" aria-hidden="true"></div>
    <div class="alloc-legend" id="allocLegend"></div>
    <div class="card" id="holdings"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Recent transactions</h2><button data-act="Full history">See all</button></div>
    <div class="card" id="txs"></div>
  </section>
</div>

<nav class="tabbar">
  <div class="inner">
    <button aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-act="Markets"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Markets</button>
    <button data-act="Activity"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>Activity</button>
    <button data-act="Settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---------- Data ----------
  const COINS = [
    { sym: 'BTC',  name: 'Bitcoin',   color: '#f7931a', amount: 0.4821,  price: 91240.55, vol: 0.022, cost: 28400 },
    { sym: 'ETH',  name: 'Ethereum',  color: '#627eea', amount: 6.215,   price: 3412.18,  vol: 0.03,  cost: 14900 },
    { sym: 'SOL',  name: 'Solana',    color: '#9945ff', amount: 58.4,    price: 182.66,   vol: 0.045, cost: 7200 },
    { sym: 'LINK', name: 'Chainlink', color: '#2a5ada', amount: 312.0,   price: 17.42,    vol: 0.04,  cost: 5800 },
    { sym: 'USDC', name: 'USD Coin',  color: '#2775ca', amount: 2450.0,  price: 1.0,      vol: 0.0004, cost: 2450 },
    { sym: 'DOGE', name: 'Dogecoin',  color: '#c2a633', amount: 8200,    price: 0.1834,   vol: 0.06,  cost: 1300 },
  ];

  const RANGES = {
    '1D':  { pts: 96,  stepMs: 15 * 60e3,      volScale: 0.18, label: 'today' },
    '1W':  { pts: 84,  stepMs: 2 * 3600e3,     volScale: 0.35, label: 'past week' },
    '1M':  { pts: 90,  stepMs: 8 * 3600e3,     volScale: 0.6,  label: 'past month' },
    '3M':  { pts: 90,  stepMs: 24 * 3600e3,    volScale: 1.0,  label: 'past 3 months' },
    '1Y':  { pts: 122, stepMs: 3 * 86400e3,    volScale: 1.6,  label: 'past year' },
    'ALL': { pts: 150, stepMs: 7 * 86400e3,    volScale: 2.4,  label: 'all time' },
  };

  // Seeded RNG so history is stable across reloads
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

  // Build price history backwards from current price (random walk w/ slight upward drift)
  const history = {}; // history[range][sym] = [prices oldest->newest]
  for (const [r, cfg] of Object.entries(RANGES)) {
    history[r] = {};
    for (const c of COINS) {
      const rand = rng(hash(r + c.sym));
      const arr = [c.price];
      let p = c.price;
      const v = c.vol * cfg.volScale / Math.sqrt(cfg.pts / 10);
      const drift = c.sym === 'USDC' ? 0 : 0.0025 * cfg.volScale / cfg.pts * 10;
      for (let i = 1; i < cfg.pts; i++) {
        const g = (rand() + rand() + rand() - 1.5) * 2; // ~normal
        p = p / (1 + drift + g * v);
        if (c.sym === 'USDC') p = 1 + (rand() - .5) * 0.002;
        arr.unshift(p);
      }
      history[r][c.sym] = arr;
    }
  }

  const portfolioSeries = r => {
    const n = RANGES[r].pts;
    const out = new Array(n).fill(0);
    for (const c of COINS) history[r][c.sym].forEach((p, i) => out[i] += p * c.amount);
    return out;
  };

  const now = Date.now();
  const H = 3600e3, D = 86400e3;
  const TXS = [
    { type: 'buy',     sym: 'SOL',  amt: 12.5,   usd: 2283.25, t: now - 2 * H, status: 'Completed' },
    { type: 'receive', sym: 'ETH',  amt: 0.85,   usd: 2900.35, t: now - 5 * H, from: '0x3f2a…9c1e', status: 'Pending' },
    { type: 'swap',    sym: 'USDC', amt: 1500,   usd: 1500,    t: now - 1 * D - 3 * H, to: 'LINK', toAmt: 86.1, status: 'Completed' },
    { type: 'send',    sym: 'BTC',  amt: 0.015,  usd: 1368.6,  t: now - 1 * D - 9 * H, to: 'bc1q…x7k2', status: 'Completed' },
    { type: 'sell',    sym: 'DOGE', amt: 3000,   usd: 550.2,   t: now - 3 * D, status: 'Completed' },
    { type: 'buy',     sym: 'BTC',  amt: 0.05,   usd: 4512.0,  t: now - 6 * D, status: 'Completed' },
    { type: 'receive', sym: 'USDC', amt: 1000,   usd: 1000,    t: now - 9 * D, from: 'Coinbase', status: 'Completed' },
  ];

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const fmtUSD = (v, opts = {}) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: v !== 0 && Math.abs(v) < 1 ? 4 : 2, maximumFractionDigits: v !== 0 && Math.abs(v) < 1 ? 4 : 2, ...opts }).format(v);
  const fmtCompact = v => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 2 }).format(v);
  const fmtAmt = (v, sym) => `${new Intl.NumberFormat('en-US', { maximumFractionDigits: v < 1 ? 6 : v < 100 ? 4 : 2 }).format(v)} ${sym}`;
  const fmtPct = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2)}%`;
  const sign = v => v >= 0 ? '+' : '−';
  const cls = v => v >= 0 ? 'up' : 'down';
  const arrow = v => v >= 0 ? '▲' : '▼';
  const coin = s => COINS.find(c => c.sym === s);

  let range = '1W';
  let hidden = localStorage.getItem('pf-hidden') === '1';
  let sortKey = 'value';
  const mask = s => hidden ? `<span class="hidden-val">${s}</span>` : s;

  // ---------- Balance ----------
  function totalNow() { return COINS.reduce((s, c) => s + c.price * c.amount, 0); }

  function renderBalance(value, start, ctxLabel) {
    const [whole, cents] = fmtUSD(value, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split('.');
    $('balance').innerHTML = hidden ? '<span class="hidden-val">$••,•••.••</span>' : `${whole}<span class="cents">.${cents}</span>`;
    const diff = value - start, pct = diff / start * 100;
    $('balChange').innerHTML = `<span class="${cls(diff)}">${mask(sign(diff) + fmtUSD(Math.abs(diff), { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}</span>
      <span class="pill ${cls(diff)}">${arrow(diff)} ${Math.abs(pct).toFixed(2)}%</span>
      <span class="change-ctx">${ctxLabel}</span>`;
  }

  // ---------- Chart ----------
  const svg = $('chart'), wrap = $('chartWrap'), tip = $('tip');
  let series = [], scrubbing = false;

  function drawChart() {
    series = portfolioSeries(range);
    series[series.length - 1] = totalNow();
    const W = wrap.clientWidth, Hh = wrap.clientHeight;
    const padT = 22, padB = 12;
    const min = Math.min(...series), max = Math.max(...series);
    const span = max - min || 1;
    const x = i => i / (series.length - 1) * W;
    const y = v => padT + (1 - (v - min) / span) * (Hh - padT - padB);
    const up = series.at(-1) >= series[0];
    const col = up ? 'var(--up)' : 'var(--down)';
    const pts = series.map((v, i) => [x(i), y(v)]);
    // smooth path (monotone-ish Catmull-Rom)
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    const baseY = y(series[0]);
    svg.innerHTML = `
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${up ? '#2fd08a' : '#ff5d6c'}" stop-opacity=".28"/>
          <stop offset="1" stop-color="${up ? '#2fd08a' : '#ff5d6c'}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="0" x2="${W}" y1="${baseY}" y2="${baseY}" stroke="#3a4152" stroke-dasharray="2 4" stroke-width="1"/>
      <path d="${d} L${W},${Hh} L0,${Hh} Z" fill="url(#fill)"/>
      <path id="line" d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="cursor" x1="0" x2="0" y1="${padT - 6}" y2="${Hh}" stroke="#5b6376" stroke-width="1" opacity="0"/>
      <circle id="dot" r="5" fill="${col}" stroke="var(--bg)" stroke-width="2.5" cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}"/>
    `;
    const line = svg.querySelector('#line');
    const len = line.getTotalLength();
    if (!drawChart.animated && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
      line.getBoundingClientRect();
      line.style.transition = 'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)';
      line.style.strokeDashoffset = 0;
      drawChart.animated = true;
      setTimeout(() => { line.style.strokeDasharray = ''; line.style.transition = ''; }, 950);
    }
    drawChart.geom = { x, y, pts, padT };
    if (!scrubbing) renderBalance(series.at(-1), series[0], RANGES[range].label);
  }

  function scrubAt(clientX) {
    const r = wrap.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    const i = Math.round(rel * (series.length - 1));
    const [px, py] = drawChart.geom.pts[i];
    const cursor = svg.querySelector('#cursor'), dot = svg.querySelector('#dot');
    cursor.setAttribute('x1', px); cursor.setAttribute('x2', px); cursor.setAttribute('opacity', 1);
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    const t = new Date(Date.now() - (series.length - 1 - i) * RANGES[range].stepMs);
    const lbl = ['1D', '1W'].includes(range)
      ? t.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    tip.textContent = lbl;
    tip.style.left = Math.max(50, Math.min(r.width - 50, px)) + 'px';
    tip.style.opacity = 1;
    $('balLabel').textContent = 'Balance';
    renderBalance(series[i], series[0], lbl);
  }
  function endScrub() {
    scrubbing = false;
    tip.style.opacity = 0;
    $('balLabel').textContent = 'Total balance';
    drawChart();
  }
  wrap.addEventListener('pointerdown', e => { scrubbing = true; wrap.setPointerCapture(e.pointerId); scrubAt(e.clientX); if (navigator.vibrate) navigator.vibrate(5); });
  wrap.addEventListener('pointermove', e => { if (scrubbing || e.pointerType === 'mouse') { if (e.pointerType === 'mouse') scrubbing = true; scrubAt(e.clientX); } });
  wrap.addEventListener('pointerup', endScrub);
  wrap.addEventListener('pointercancel', endScrub);
  wrap.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') endScrub(); });

  $('ranges').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    range = b.dataset.r;
    document.querySelectorAll('#ranges button').forEach(x => x.setAttribute('aria-pressed', x === b));
    drawChart.animated = false;
    drawChart(); renderHoldings();
  });

  // ---------- Holdings ----------
  function sparkPath(arr, w = 56, h = 24) {
    const min = Math.min(...arr), max = Math.max(...arr), s = max - min || 1;
    return arr.map((v, i) => `${i ? 'L' : 'M'}${(i / (arr.length - 1) * w).toFixed(1)},${(2 + (1 - (v - min) / s) * (h - 4)).toFixed(1)}`).join('');
  }
  function coinChange(c) {
    const h = history[range][c.sym];
    return (c.price - h[0]) / h[0] * 100;
  }

  let prevPrices = {};
  function renderHoldings() {
    const total = totalNow();
    const list = COINS.map(c => ({ ...c, value: c.price * c.amount, chg: coinChange(c) }));
    list.sort(sortKey === 'value' ? (a, b) => b.value - a.value : (a, b) => b.chg - a.chg);

    $('alloc').innerHTML = list.map(c => `<div style="flex-grow:${c.value};background:${c.color}"></div>`).join('');
    $('allocLegend').innerHTML = list.map(c => `<span><i style="background:${c.color}"></i>${c.sym} ${(c.value / total * 100).toFixed(1)}%</span>`).join('');

    $('holdings').innerHTML = list.map(c => {
      const h = history[range][c.sym].slice(); h[h.length - 1] = c.price;
      const flash = prevPrices[c.sym] == null || prevPrices[c.sym] === c.price ? '' : (c.price > prevPrices[c.sym] ? 'flash-up' : 'flash-down');
      return `<button class="row holding" data-sym="${c.sym}" aria-label="${c.name}, ${fmtUSD(c.value)}, ${fmtPct(c.chg)}">
        <div class="coin-ic" style="background:${c.color}">${c.sym[0]}</div>
        <div class="row-main">
          <div class="row-title">${c.name}</div>
          <div class="row-sub num">${fmtUSD(c.price)} · <span class="${cls(c.chg)}">${fmtPct(c.chg)}</span></div>
        </div>
        <svg class="spark" viewBox="0 0 56 24" aria-hidden="true"><path d="${sparkPath(h)}" fill="none" stroke="${c.chg >= 0 ? 'var(--up)' : 'var(--down)'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <div class="row-end num">
          <div class="v ${flash}">${mask(fmtUSD(c.value, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}</div>
          <div class="s" style="color:var(--muted)">${mask(fmtAmt(c.amount, c.sym))}</div>
        </div>
      </button>`;
    }).join('');
    COINS.forEach(c => prevPrices[c.sym] = c.price);
  }

  $('holdings').addEventListener('click', e => {
    const b = e.target.closest('[data-sym]'); if (b) openCoin(coin(b.dataset.sym));
  });
  $('sortBtn').addEventListener('click', () => {
    sortKey = sortKey === 'value' ? 'change' : 'value';
    $('sortBtn').textContent = `Sort: ${sortKey === 'value' ? 'Value' : 'Change'}`;
    renderHoldings();
  });

  // ---------- Transactions ----------
  const TX_META = {
    buy:     { label: 'Bought',   icon: '<path d="M12 5v14M5 12h14"/>',                     color: 'var(--up)' },
    sell:    { label: 'Sold',     icon: '<path d="M5 12h14"/>',                             color: 'var(--down)' },
    send:    { label: 'Sent',     icon: '<path d="M7 17L17 7M8 7h9v9"/>',                   color: 'var(--text)' },
    receive: { label: 'Received', icon: '<path d="M17 7L7 17M16 17H7V8"/>',                 color: 'var(--text)' },
    swap:    { label: 'Swapped',  icon: '<path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/>', color: 'var(--accent)' },
  };
  function dayLabel(t) {
    const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.floor((today - new Date(d).setHours(0, 0, 0, 0)) / D);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: diff < 7 ? 'long' : undefined, month: 'short', day: 'numeric' });
  }
  function renderTxs() {
    let html = '', lastDay = '';
    TXS.slice(0, 6).forEach(tx => {
      const m = TX_META[tx.type], c = coin(tx.sym);
      const day = dayLabel(tx.t);
      if (day !== lastDay) { html += `<div class="tx-date">${day}</div>`; lastDay = day; }
      const incoming = tx.type === 'buy' || tx.type === 'receive';
      let title = `${m.label} ${c.name}`;
      let sub = new Date(tx.t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      if (tx.from) sub += ` · from ${tx.from}`;
      if (tx.to && tx.type === 'send') sub += ` · to ${tx.to}`;
      if (tx.type === 'swap') title = `${tx.sym} → ${tx.to}`;
      const amtLine = tx.type === 'swap'
        ? `+${fmtAmt(tx.toAmt, tx.to)}`
        : `${incoming ? '+' : '−'}${fmtAmt(tx.amt, tx.sym)}`;
      html += `<div class="row">
        <div class="tx-ic"><svg viewBox="0 0 24 24" fill="none" stroke="${m.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg>
          <span class="badge" style="background:${c.color}">${c.sym[0]}</span></div>
        <div class="row-main">
          <div class="row-title">${title}</div>
          <div class="row-sub">${tx.status === 'Pending' ? '<span class="status-pending">● Pending</span> · ' : ''}${sub}</div>
        </div>
        <div class="row-end num">
          <div class="v ${incoming || tx.type === 'swap' ? 'up' : ''}">${mask(amtLine)}</div>
          <div class="s" style="color:var(--muted)">${mask(fmtUSD(tx.usd, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}</div>
        </div>
      </div>`;
    });
    $('txs').innerHTML = html;
  }

  // ---------- Coin sheet ----------
  const sheet = $('sheet'), sheetBg = $('sheetBg');
  let lastFocus = null;
  function openCoin(c) {
    lastFocus = document.activeElement;
    const value = c.price * c.amount, pnl = value - c.cost, pnlPct = pnl / c.cost * 100;
    const h = history[range][c.sym].slice(); h[h.length - 1] = c.price;
    const chg = coinChange(c);
    $('sheetBody').innerHTML = `
      <div class="sheet-head">
        <div class="coin-ic" style="background:${c.color}">${c.sym[0]}</div>
        <div><div class="row-title" id="sheetTitle">${c.name}</div><div class="row-sub">${c.sym}</div></div>
        <div class="row-end num" style="margin-left:auto">
          <div class="v">${fmtUSD(c.price)}</div>
          <div class="s ${cls(chg)}">${fmtPct(chg)} · ${range}</div>
        </div>
      </div>
      <svg viewBox="0 0 300 80" preserveAspectRatio="none" style="width:100%;height:90px;margin-bottom:16px" aria-hidden="true">
        <path d="${sparkPath(h, 300, 80)}" fill="none" stroke="${chg >= 0 ? 'var(--up)' : 'var(--down)'}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="stats num">
        <div class="stat"><div class="k">Holdings</div><div class="val">${mask(fmtAmt(c.amount, c.sym))}</div></div>
        <div class="stat"><div class="k">Value</div><div class="val">${mask(fmtUSD(value, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}</div></div>
        <div class="stat"><div class="k">Avg. cost</div><div class="val">${fmtUSD(c.cost / c.amount)}</div></div>
        <div class="stat"><div class="k">Total P&amp;L</div><div class="val ${cls(pnl)}">${mask(sign(pnl) + fmtCompact(Math.abs(pnl)))} (${fmtPct(pnlPct)})</div></div>
        <div class="stat"><div class="k">Range high</div><div class="val">${fmtUSD(Math.max(...h))}</div></div>
        <div class="stat"><div class="k">Range low</div><div class="val">${fmtUSD(Math.min(...h))}</div></div>
      </div>`;
    sheet.classList.add('open'); sheetBg.classList.add('open');
    sheet.setAttribute('tabindex', '-1'); sheet.focus();
  }
  function closeSheet() { sheet.classList.remove('open'); sheetBg.classList.remove('open'); lastFocus && lastFocus.focus(); }
  sheetBg.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });
  // swipe-down to close
  let sy = null;
  sheet.addEventListener('touchstart', e => sy = e.touches[0].clientY, { passive: true });
  sheet.addEventListener('touchmove', e => { if (sy != null && e.touches[0].clientY - sy > 70) { sy = null; closeSheet(); } }, { passive: true });

  // ---------- Misc ----------
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
  }
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => toast(`${b.dataset.act} — coming soon`)));

  function setHidden(v) {
    hidden = v; localStorage.setItem('pf-hidden', v ? '1' : '0');
    $('toggleHide').setAttribute('aria-label', v ? 'Show balances' : 'Hide balances');
    $('eyeIcon').innerHTML = v
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    drawChart(); renderHoldings(); renderTxs();
  }
  $('toggleHide').addEventListener('click', () => setHidden(!hidden));

  // Simulated live ticks
  setInterval(() => {
    if (document.hidden) return;
    COINS.forEach(c => {
      if (c.sym === 'USDC') return;
      c.price *= 1 + (Math.random() - 0.49) * c.vol * 0.04;
    });
    if (!scrubbing) drawChart();
    renderHoldings();
  }, 4000);

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 100); });

  setHidden(hidden);
})();
</script>
</body>
</html>
