<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopi Teras · Pesan kopi</title>
<meta name="theme-color" content="#FDF8F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean, warm off-white canvas, white surfaces, paprika brand, photographs for every menu item */
/* palette for #E4572E (OKLCH 0.587 0.184 36.5), neutral tint 0.016. Generated by palette.cjs; do not edit by hand. */
:root {
  --b1: #FEFCFC;
  --b2: #FEF8F6;
  --b3: #FFEDE9;
  --b4: #FEE3DB;
  --b5: #FED5C9;
  --b6: #FCC2B2;
  --b7: #F3AC98;
  --b8: #E78C72;
  --b9: #D2461A;
  --b10: #C63F13;
  --b11: #B03E1B;
  --b12: #581D0C;
  --n1: #FFFBFA;
  --n2: #FDF8F6;
  --n3: #F6EFED;
  --n4: #EFE6E4;
  --n5: #E8DFDC;
  --n6: #E2D7D4;
  --n7: #D8CCC8;
  --n8: #C6B8B5;
  --n9: #978A87;
  --n10: #8D807D;
  --n11: #6C615E;
  --n12: #251D1B;
  --ok-3: #E9F6EB; --ok-9: #139948; --ok-11: #137E3B;
  --warn-3: #FAF0E4; --warn-9: #AB7302; --warn-11: #8D5E05;
  --bad-3: #FFEDEB; --bad-9: #CE514D; --bad-11: #A9433F;
  --hue: 36.5; /* brand hue, for tinted shadows: oklch(0.30 0.03 var(--hue) / .08) */
  /* roles */
  --canvas: var(--n2); --surface: #FFFFFF; --surface-raised: #FFFFFF; --well: var(--n3);
  --line: var(--n6); --line-input: var(--n7); --line-strong: var(--n8);
  --text-1: var(--n12); --text-2: var(--n11); --text-3: var(--n9);
  --brand: var(--b9); --brand-hover: var(--b10); --brand-ink: #FFFFFF; --brand-text: var(--b11);
  --tint: var(--b3); --tint-hover: var(--b4); --tint-pressed: var(--b5); --tint-line: var(--b6); --callout: var(--b2);
  --focus: var(--b9);
  --up: var(--ok-11); --down: var(--bad-11); --warning: var(--warn-11);
  --chart-1: var(--b9); --chart-compare: var(--n8); --chart-grid: var(--n4);
  --chart-area: linear-gradient(to bottom, color-mix(in oklch, var(--b9) 20%, transparent), transparent);
  /* contrast: text-1 15.6, text-2 6.0, text-3 3.3, brand-text on tint 5.2, brand-ink on brand 4.5 */
  --shadow-card: 0 1px 2px oklch(0.30 0.03 36.5 / 0.06), 0 2px 4px oklch(0.30 0.03 36.5 / 0.04);
  --shadow-pop: 0 2px 4px oklch(0.30 0.03 36.5 / 0.06), 0 8px 16px oklch(0.30 0.03 36.5 / 0.08);
  --shadow-sheet: 0 4px 8px oklch(0.30 0.03 36.5 / 0.06), 0 16px 32px oklch(0.30 0.03 36.5 / 0.10);
  --shadow-brand: 0 4px 12px color-mix(in oklch, var(--brand) 28%, transparent);
  --highlight: inset 0 1px 0 oklch(1 0 0 / 0.7);
}
.theme-dark, :root[data-theme="dark"] {
  color-scheme: dark;
  --b1: #1D100D;
  --b2: #251410;
  --b3: #41180D;
  --b4: #571B0A;
  --b5: #682410;
  --b6: #792E19;
  --b7: #8E3A23;
  --b8: #AA482C;
  --b9: #D2461A;
  --b10: #DB5935;
  --b11: #F89A7F;
  --b12: #FED7CC;
  --n1: #141110;
  --n2: #1C1817;
  --n3: #26211F;
  --n4: #2E2827;
  --n5: #362F2D;
  --n6: #403835;
  --n7: #4F4542;
  --n8: #695D5A;
  --n9: #776B67;
  --n10: #847875;
  --n11: #BBB1AF;
  --n12: #F1EDEC;
  --ok-3: #0E2E17; --ok-9: #139948; --ok-11: #84C992;
  --warn-3: #362201; --warn-9: #AB7302; --warn-11: #DDAC67;
  --bad-3: #3E1A18; --bad-9: #CE514D; --bad-11: #F19B94;
  --hue: 36.5; /* brand hue, for tinted shadows: oklch(0.30 0.03 var(--hue) / .08) */
  /* roles */
  --canvas: var(--n1); --surface: var(--n2); --surface-raised: var(--n3); --well: var(--n1);
  --line: var(--n6); --line-input: var(--n7); --line-strong: var(--n8);
  --text-1: var(--n12); --text-2: var(--n11); --text-3: var(--n9);
  --brand: var(--b9); --brand-hover: var(--b10); --brand-ink: #FFFFFF; --brand-text: var(--b11);
  --tint: var(--b3); --tint-hover: var(--b4); --tint-pressed: var(--b5); --tint-line: var(--b6); --callout: var(--b2);
  --focus: var(--b9);
  --up: var(--ok-11); --down: var(--bad-11); --warning: var(--warn-11);
  --chart-1: var(--b9); --chart-compare: var(--n8); --chart-grid: var(--n4);
  --chart-area: linear-gradient(to bottom, color-mix(in oklch, var(--b9) 20%, transparent), transparent);
  /* contrast: text-1 16.2, text-2 8.4, text-3 3.4, brand-text on tint 7.2, brand-ink on brand 4.5 */
  --shadow-pop: 0 0 0 1px var(--n6); --shadow-sheet: 0 0 0 1px var(--n6);
  --highlight: inset 0 1px 0 oklch(1 0 0 / 0.08);
}

/* better-ui tokens. Copy verbatim below the palette.cjs output; fill the font families from look.cjs.
   Every value comes from references/spec.md. Build only from these; do not invent sizes or spaces. */
:root {
  /* COLOUR: paste the output of `node scripts/palette.cjs "<brand hex>"` ABOVE this file. It defines
     --b1..--b12, --n1..--n12, --ok/--warn/--bad, and the roles used below (--canvas, --surface, --well,
     --line, --text-1/2/3, --brand, --brand-ink, --brand-text, --tint, --callout, --focus, --up, --down,
     shadows and --highlight). Never write a hex value for a neutral or a shade of the brand by hand. */
  --accent: var(--b9);                       /* a second colour from look.cjs only if the look calls for one */
  --surface-2: var(--well);                  /* alias kept for older names */
  --brand-tint: var(--tint);                 /* alias */

  /* spacing: the only values allowed */
  --s-0: 0; --s-2: 2px; --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px; --s-24: 24px;
  --s-32: 32px; --s-40: 40px; --s-48: 48px; --s-64: 64px; --s-80: 80px; --s-96: 96px; --s-128: 128px;

  /* radius */
  --r-badge: 6px; --r-sm: 8px; --r-md: 12px; --r-btn: 14px; --r-card: 16px; --r-lg: 20px; --r-sheet: 24px; --r-full: 999px;

  /* motion */
  --ease: cubic-bezier(.2,.8,.2,1); --t-fast: 150ms; --t-move: 240ms;

  /* fonts (from look.cjs) */
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}

/* dark: palette.cjs prints the dark block (.theme-dark, :root[data-theme="dark"]); --dark puts it on :root. */

/* type ramp, phone (spec.md): exactly 44, 28, 20, 16, 13 (+11 tab labels). Desktop 32/24/18/14/12 and landing 64/40/20/16/13 are in spec.md. */
.t-display  { font: 600 44px/48px var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-title    { font: 600 28px/34px var(--font); letter-spacing: -0.015em; }
.t-headline { font: 600 20px/26px var(--font); letter-spacing: -0.01em; }
.t-body     { font: 400 16px/24px var(--font); }
.t-strong   { font: 500 16px/24px var(--font); }
.t-caption  { font: 400 13px/18px var(--font); color: var(--text-2); }
.t-meta     { font: 500 13px/18px var(--mono); }
.t-tab      { font: 500 11px/13px var(--font); }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--text-1); font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.num, [data-num] { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; animation-duration: 0s !important; } }


/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 120px; }
body { min-height: 100dvh; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; }
ul, ol { list-style: none; margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon-24 { width: 24px; height: 24px; }

/* ---------- header ---------- */
.header { position: sticky; top: 0; z-index: 10; background: var(--canvas); padding-top: env(safe-area-inset-top); }
.header-in { height: 56px; display: flex; align-items: center; gap: var(--s-12); padding: 0 var(--s-20); max-width: 640px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: var(--s-8); font: 600 16px/24px var(--font); margin-right: auto; }
.brand-mark { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: var(--highlight); }
.brand-mark .icon { width: 16px; height: 16px; stroke-width: 2; }
.topnav { display: none; }
.avatar-btn { width: 40px; height: 40px; border-radius: var(--r-full); background: var(--well); overflow: hidden; display: grid; place-items: center; color: var(--text-2); position: relative; }
.avatar-btn::after { content: ""; position: absolute; inset: -2px; }
.avatar-btn img { width: 40px; height: 40px; }

/* ---------- views ---------- */
main { max-width: 640px; margin: 0 auto; padding: var(--s-8) var(--s-20) calc(64px + var(--s-24) + env(safe-area-inset-bottom)); }
body.has-bar main { padding-bottom: calc(64px + 76px + var(--s-24) + env(safe-area-inset-bottom)); }
.view { display: none; }
main[data-view="menu"] #v-menu, main[data-view="cart"] #v-cart, main[data-view="orders"] #v-orders, main[data-view="account"] #v-account { display: block; }
.page-title { font: 600 28px/34px var(--font); letter-spacing: -0.015em; padding-top: var(--s-16); }
.greeting { font: 400 13px/18px var(--font); color: var(--text-2); padding-top: var(--s-16); }
.greeting + .page-title { padding-top: var(--s-4); }
.section { margin-top: var(--s-40); }
.section-title { font: 600 20px/26px var(--font); letter-spacing: -0.01em; margin-bottom: var(--s-16); }
.caption { font: 400 13px/18px var(--font); color: var(--text-2); }
.strong { font: 500 16px/24px var(--font); }
.price { font: 500 16px/24px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
.group > * + * { border-top: 1px solid var(--line); }

.ph { background: var(--well); overflow: hidden; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- featured ---------- */
.featured { margin-top: var(--s-24); display: block; width: 100%; text-align: left; }
.featured .ph { aspect-ratio: 16 / 9; border-radius: var(--r-card); position: relative; }
.badge { position: absolute; left: var(--s-12); top: var(--s-12); font: 500 13px/18px var(--font); padding: var(--s-4) var(--s-8); border-radius: var(--r-badge); background: var(--surface); color: var(--text-1); box-shadow: var(--shadow-card); }
.featured-row { display: flex; align-items: center; gap: var(--s-12); margin-top: var(--s-12); }
.featured-row .ft { flex: 1; min-width: 0; }
.featured-row .ft > span { display: block; }
.featured-row, .featured .ph { display: flex; }
.featured .ph { display: block; }
.featured-name { font: 600 20px/26px var(--font); letter-spacing: -0.01em; }
.featured-row .caption { margin-top: var(--s-4); }

.add { width: 40px; height: 40px; border-radius: var(--r-full); background: var(--tint); color: var(--brand-text); display: grid; place-items: center; flex: none; position: relative; transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.add::after { content: ""; position: absolute; inset: -2px; }

/* ---------- chips ---------- */
.chips { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--canvas); margin: var(--s-24) calc(-1 * var(--s-20)) 0; padding: var(--s-8) var(--s-20); display: flex; gap: var(--s-8); overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 40px; padding: 0 var(--s-16); border-radius: var(--r-full); font: 500 13px/18px var(--font); white-space: nowrap; background: var(--surface); color: var(--text-2); border: 1px solid var(--line); position: relative; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.chip::after { content: ""; position: absolute; inset: -6px -2px; }
.chip[aria-pressed="true"] { background: var(--tint); color: var(--brand-text); border-color: var(--tint-line); }
.chips + .section { margin-top: var(--s-16); }

/* ---------- menu rows ---------- */
.item { display: flex; align-items: center; gap: var(--s-12); padding: var(--s-12) var(--s-16) var(--s-12) var(--s-12); width: 100%; text-align: left; transition: background var(--t-fast) var(--ease); }
.item .ph { width: 64px; height: 64px; border-radius: var(--r-md); }
.item-text { flex: 1; min-width: 0; }
.item-text .caption { margin-top: 0; }
.item .price { display: block; margin-top: var(--s-4); }
.item:active .add, .featured:active .add { transform: scale(.96); }

/* ---------- buttons ---------- */
.btn { height: 52px; border-radius: var(--r-btn); font: 600 16px/24px var(--font); display: flex; align-items: center; justify-content: center; gap: var(--s-8); width: 100%; padding: 0 var(--s-20); white-space: nowrap; transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease); }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(to bottom, color-mix(in oklch, var(--b9), white 6%), var(--b9)); color: var(--brand-ink); box-shadow: var(--highlight), var(--shadow-brand); }
.btn-secondary { height: 44px; border-radius: var(--r-md); font-weight: 500; background: var(--surface); border: 1px solid var(--line-input); }
.btn-danger { color: var(--bad-11); }
.btn-compact { height: 40px; width: auto; flex: none; border-radius: var(--r-sm); font: 500 13px/18px var(--font); padding: 0 var(--s-12); border: 1px solid var(--line-input); background: var(--surface); position: relative; }
.btn-compact::after { content: ""; position: absolute; inset: -6px 0; }
.btn .sep { opacity: .7; font-weight: 400; }
.btn .num { font-variant-numeric: tabular-nums; }

/* ---------- stepper ---------- */
.stepper { display: inline-flex; align-items: center; background: var(--well); border-radius: var(--r-full); flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: var(--r-full); display: grid; place-items: center; color: var(--text-1); position: relative; }
.stepper button::after { content: ""; position: absolute; inset: -2px; }
.stepper output { min-width: 24px; text-align: center; font: 500 16px/24px var(--font); font-variant-numeric: tabular-nums; }

/* ---------- cart ---------- */
.line { display: flex; gap: var(--s-12); padding: var(--s-16); }
.line .ph { width: 48px; height: 48px; border-radius: var(--r-md); }
.line-body { flex: 1; min-width: 0; }
.line-foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s-8); }
.field { margin-top: var(--s-24); }
.field-label { display: block; font: 500 13px/18px var(--font); color: var(--text-1); margin-bottom: var(--s-8); }
.field-label span { color: var(--text-2); font-weight: 400; }
.input { width: 100%; height: 48px; border-radius: var(--r-md); border: 1px solid var(--line-input); background: var(--surface); padding: 0 var(--s-16); font: 400 16px/24px var(--font); color: var(--text-1); transition: border-color var(--t-fast) var(--ease); }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.input[aria-invalid="true"] { border-color: var(--bad-9); }
.field-error { font: 400 13px/18px var(--font); color: var(--bad-11); margin-top: var(--s-8); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-4); background: var(--well); border-radius: var(--r-md); padding: var(--s-4); }
.seg button { height: 40px; border-radius: var(--r-sm); font: 500 13px/18px var(--font); color: var(--text-2); white-space: nowrap; position: relative; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.seg button::after { content: ""; position: absolute; inset: -4px 0; }
.seg button[aria-checked="true"] { background: var(--surface-raised); color: var(--text-1); box-shadow: var(--shadow-pop), var(--highlight); }
.total { display: flex; align-items: baseline; justify-content: space-between; margin-top: var(--s-24); padding-top: var(--s-16); border-top: 1px solid var(--line); }
.total .price { font: 600 20px/26px var(--font); letter-spacing: -0.01em; }
.total-note { margin-top: var(--s-4); }
.cart-cta { display: none; margin-top: var(--s-24); }

.empty { text-align: center; padding: var(--s-48) var(--s-20); }
.empty img, .empty .emoji { width: 96px; height: 96px; margin: 0 auto var(--s-16); font-size: 64px; line-height: 96px; }
.empty h2 { font: 600 20px/26px var(--font); letter-spacing: -0.01em; }
.empty p { font: 400 16px/24px var(--font); color: var(--text-2); margin-top: var(--s-4); }
.empty .btn { margin: var(--s-24) auto 0; width: auto; }

/* ---------- order status ---------- */
.order + .order { margin-top: var(--s-40); padding-top: var(--s-40); border-top: 1px solid var(--line); }
.order-hero { padding-top: var(--s-24); }
.order-top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-16); }
.stack { display: flex; }
.stack .ph { width: 56px; height: 56px; border-radius: var(--r-card); border: 2px solid var(--canvas); box-shadow: var(--shadow-card); }
.stack .ph + .ph { margin-left: calc(-1 * var(--s-16)); }
.order-no { font: 600 44px/48px var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: var(--s-4); }
.order-status { display: flex; align-items: center; gap: var(--s-8); font: 600 20px/26px var(--font); letter-spacing: -0.01em; margin-top: var(--s-16); }
.dot { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--brand); flex: none; }
.dot.live { animation: pulse 1.6s var(--ease) infinite; }
.dot.ok { background: var(--ok-9); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--brand) 40%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
.order-status + .caption { margin-top: var(--s-4); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-4); margin-top: var(--s-24); }
.step i { display: block; height: 8px; border-radius: var(--r-full); background: var(--well); overflow: hidden; position: relative; }
.step.done i, .step.now i { background: var(--brand); }
.step.now.working i { background: var(--b6); }
.step.now.working i::before { content: ""; position: absolute; inset: 0; width: 50%; border-radius: var(--r-full); background: var(--brand); animation: work 1.6s ease-in-out infinite alternate; }
@keyframes work { from { transform: translateX(0); } to { transform: translateX(100%); } }
.step span { display: block; margin-top: var(--s-8); font: 400 13px/18px var(--font); color: var(--text-2); }
.step.now span { color: var(--text-1); font-weight: 500; }
.callout { margin-top: var(--s-24); background: var(--callout); border: 1px solid var(--tint-line); border-radius: var(--r-card); padding: var(--s-16); font: 400 16px/24px var(--font); color: var(--b12); }
.order-actions { margin-top: var(--s-24); }
.detail-title { font: 500 13px/18px var(--font); color: var(--text-2); margin: var(--s-24) 0 var(--s-8); }
.drow { display: flex; gap: var(--s-12); padding: var(--s-12) var(--s-16); align-items: baseline; }
.drow .qty { font: 500 16px/24px var(--font); color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 24px; }
.drow > div { flex: 1; min-width: 0; }
.drow.sum { font-weight: 500; }

.hrow { display: flex; align-items: center; gap: var(--s-12); padding: var(--s-12) var(--s-16); min-height: 64px; }
.hrow .ph { width: 40px; height: 40px; border-radius: var(--r-md); }
.hrow > div { flex: 1; min-width: 0; }

/* ---------- account ---------- */
.profile { display: flex; align-items: center; gap: var(--s-16); padding-top: var(--s-24); }

.sheet .ph { aspect-ratio: 16 / 9; border-radius: var(--r-card); }
.sheet-close { position: absolute; right: var(--s-32); top: var(--s-40); width: 40px; height: 40px; border-radius: var(--r-full); background: var(--surface); box-shadow: var(--shadow-pop); display: grid; place-items: center; }

.confirm .btn:first-of-type { margin-top: var(--s-24); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

/* ---------- toast ---------- */
body.has-bar .toast { bottom: calc(64px + 76px + var(--s-12) + env(safe-area-inset-bottom)); }
.toast { position: fixed; left: 50%; bottom: calc(64px + var(--s-12) + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; background: var(--n12); color: var(--n1); font: 500 13px/18px var(--font); padding: var(--s-12) var(--s-16); border-radius: var(--r-md); box-shadow: var(--shadow-pop); white-space: nowrap; animation: rise var(--t-move) var(--ease); }

@media (hover: hover) {

  .topnav .dot { margin-left: 0; }
  .dock { display: none; }
  main, body.has-bar main { max-width: 1184px; padding: var(--s-16) var(--s-32) var(--s-64); }

  main[data-view="menu"] #v-cart { display: block; position: sticky; top: 96px; margin-top: var(--s-16); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: var(--s-24); max-height: calc(100dvh - 128px); overflow-y: auto; }
  #v-cart .page-title { font: 600 20px/26px var(--font); letter-spacing: -0.01em; padding-top: 0; }
  #v-cart .group { border: 0; box-shadow: none; border-radius: 0; margin-top: var(--s-8); }
  #v-cart .line { padding: var(--s-16) 0; }
  #v-cart .section { margin-top: 0; }
  #v-cart .empty { padding: var(--s-32) 0 var(--s-16); }
  #v-cart .empty .btn { display: none; }
  .cart-cta { display: flex; }
  .featured .ph { aspect-ratio: 21 / 9; }
  .chips { top: 65px; margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s-48); align-items: start; }
  .cols > .section { margin-top: var(--s-24); }
  #v-account { max-width: 640px; margin: 0 auto; }
  .scrim { align-items: center; }
  .sheet { border-radius: var(--r-sheet); padding-bottom: var(--s-24); }
  .grabber { visibility: hidden; margin-bottom: var(--s-8); }
  .sheet-close { top: var(--s-32); }
  .toast, body.has-bar .toast { bottom: var(--s-32); }
}
</style>

<script>
(() => {
'use strict';

/* ---------- data ---------- */
const SIZE_UP = 5000;
const T_ACCEPT = 10 * 1000;   // diterima -> dibuat
const T_READY = 60 * 1000;    // dibuat -> siap diambil
const MENU = [
  { id: 'gula-aren', cat: 'kopi', name: 'Es Kopi Gula Aren', desc: 'Susu segar dan gula aren', price: 22000, img: '1517701604599-bb29b565090c', temp: ['Dingin'], size: true, sugar: true },
  { id: 'americano', cat: 'kopi', name: 'Americano', desc: 'Espresso dan air panas', price: 18000, img: '1510591509098-f4fdc6d0ff04', temp: ['Panas', 'Dingin'], size: true, sugar: true },
  { id: 'cappuccino', cat: 'kopi', name: 'Cappuccino', desc: 'Busa susu yang tebal', price: 25000, img: '1572442388796-11668a67e53d', temp: ['Panas'], size: true, sugar: true },
  { id: 'latte', cat: 'kopi', name: 'Caffè Latte', desc: 'Espresso dan susu lembut', price: 25000, img: '1541167760496-1628856ab772', temp: ['Panas', 'Dingin'], size: true, sugar: true },
  { id: 'tubruk', cat: 'kopi', name: 'Kopi Tubruk', desc: 'Robusta Lampung', price: 12000, img: '1514432324607-a09d9b4aefdd', temp: ['Panas'], size: false, sugar: true },
  { id: 'espresso', cat: 'kopi', name: 'Espresso', desc: 'Satu shot arabika Gayo', price: 15000, img: '1485808191679-5f86510681a2', temp: ['Panas'], size: false, sugar: false },
  { id: 'matcha', cat: 'nonkopi', name: 'Matcha Latte', desc: 'Matcha dan susu segar', price: 27000, img: '1515823064-d6e0c04616a7', temp: ['Panas', 'Dingin'], size: true, sugar: true },
  { id: 'cokelat', cat: 'nonkopi', name: 'Cokelat Panas', desc: 'Cokelat hitam dan susu', price: 24000, img: '1542990253-0d0f5be5f0ed', temp: ['Panas'], size: true, sugar: true },
  { id: 'teh-nipis', cat: 'nonkopi', name: 'Es Teh Jeruk Nipis', desc: 'Teh melati, jeruk nipis', price: 16000, img: '1556679343-c7306c1976bc', temp: ['Dingin'], size: true, sugar: true },
  { id: 'croissant', cat: 'kudapan', name: 'Croissant Mentega', desc: 'Dipanggang setiap pagi', price: 20000, img: '1555507036-ab1f4038808a' },
  { id: 'sandwich', cat: 'kudapan', name: 'Sandwich Sapi Asap', desc: 'Roti gandum dan keju', price: 28000, img: '1553909489-cd47e0907980' },
  { id: 'brownies', cat: 'kudapan', name: 'Brownies Cokelat', desc: 'Satu potong, lembap', price: 18000, img: '1606313564200-e75d5e30476c' },
  { id: 'kukis', cat: 'kudapan', name: 'Kukis Cokelat', desc: 'Dua keping, renyah', price: 14000, img: '1499636136210-6f4ee915583e' },
];
const CATS = [['semua', 'Semua'], ['kopi', 'Kopi'], ['nonkopi', 'Non-kopi'], ['kudapan', 'Kudapan']];
const FEATURED = 'gula-aren';
const SUGARS = ['Normal', 'Sedikit', 'Tanpa gula'];
const MODES = { ambil: 'Ambil sendiri', sini: 'Minum di sini' };
const STEPS = ['Diterima', 'Dibuat', 'Siap', 'Selesai'];
const byId = (id) => MENU.find((m) => m.id === id);

/* ---------- state ---------- */
const KEY = 'kopi-teras-v1';
const DAY = 864e5;
function seed() {
  const at = (daysAgo, h, m) => { const d = new Date(Date.now() - daysAgo * DAY); d.setHours(h, m, 0, 0); return d.getTime(); };
  const done = (no, t, items) => ({ id: 'o' + no, no: 'A-' + no, createdAt: t, pickedAt: t + 7 * 60000, mode: 'ambil', name: 'Dimas', note: '', items });
  return {
    profile: { name: 'Dimas Prasetyo', phone: '0812 5550 142', notify: true },
    cart: [], draft: { mode: 'ambil', name: '', note: '' },
    orders: [
      done(26, at(1, 8, 14), [{ id: 'cappuccino', opts: { temp: 'Panas', size: 'Reguler', sugar: 'Normal' }, qty: 1 }, { id: 'croissant', opts: {}, qty: 1 }]),
      done(19, at(3, 15, 40), [{ id: 'gula-aren', opts: { temp: 'Dingin', size: 'Reguler', sugar: 'Sedikit' }, qty: 2 }]),
    ],
    seq: 27, view: 'menu', cat: 'semua',
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let sheet = null;        // { kind:'item', id, temp, size, sugar, qty } | { kind:'confirm', ... }
let nameError = false;
let lastFocus = null;

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp ' + n.toLocaleString('id-ID');
const img = (id, w, h) => `https://images.unsplash.com/photo-${id}?w=${w * 2}&h=${h * 2}&q=70&auto=format&fit=crop`;
const photo = (m, w, h) => `<span class="ph"><img src="${img(m.img, w, h)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></span>`;
const icon = (n, c = '') => `<svg class="icon ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const unit = (l) => byId(l.id).price + (l.opts && l.opts.size === 'Besar' ? SIZE_UP : 0);
const sum = (lines) => lines.reduce((t, l) => t + unit(l) * l.qty, 0);
const count = (lines) => lines.reduce((t, l) => t + l.qty, 0);
const optText = (l) => { const o = l.opts || {}; return [o.temp, o.size, o.sugar && (o.sugar === 'Normal' ? 'Gula normal' : o.sugar === 'Sedikit' ? 'Sedikit gula' : 'Tanpa gula')].filter(Boolean).join(' · '); };
const keyOf = (id, o) => [id, o.temp, o.size, o.sugar].join('|');
const hm = (t) => new Date(t).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
const isDesktop = () => matchMedia('(min-width: 1024px)').matches;
function when(t) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const diff = Math.floor((d0.getTime() - new Date(t).setHours(0, 0, 0, 0)) / DAY);
  if (diff <= 0) return 'Hari ini ' + hm(t);
  if (diff === 1) return 'Kemarin ' + hm(t);
  return new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ' ' + hm(t);
}
function statusOf(o, now = Date.now()) {
  if (o.cancelledAt) return 'batal';
  if (o.pickedAt) return 'selesai';
  const t = now - o.createdAt;
  return t < T_ACCEPT ? 'diterima' : t < T_READY ? 'dibuat' : 'siap';
}
const STATUS_LABEL = { diterima: 'Pesanan diterima', dibuat: 'Sedang dibuat', siap: 'Siap diambil', selesai: 'Selesai', batal: 'Dibatalkan' };
const activeOrders = () => S.orders.filter((o) => !o.pickedAt && !o.cancelledAt);
const firstName = () => (S.profile.name.trim().split(/\s+/)[0] || '');

/* ---------- render: menu ---------- */
function renderMenu() {
  const h = new Date().getHours();
  const part = h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam';
  const f = byId(FEATURED);
  const row = (m) => `
    <li><button class="item" data-act="open" data-id="${m.id}" data-fid="item-${m.id}">
      ${photo(m, 64, 64)}
      <span class="item-text"><span class="strong">${m.name}</span><span class="caption" style="display:block">${m.desc}</span><span class="price">${rp(m.price)}</span></span>
      <span class="add" aria-hidden="true">${icon('plus')}</span>
      <span class="sr">Tambah ke keranjang</span>
    </button></li>`;
  const sections = CATS.slice(1).filter(([k]) => S.cat === 'semua' || S.cat === k).map(([k, label]) => `
    <section class="section" aria-labelledby="h-${k}">
      <h2 class="section-title" id="h-${k}">${label}</h2>
      <ul class="group">${MENU.filter((m) => m.cat === k && m.id !== FEATURED).map(row).join('')}</ul>
    </section>`).join('');
  $('#v-menu').innerHTML = `
    <p class="greeting">Selamat ${part}${firstName() ? ', ' + esc(firstName()) : ''}</p>
    <h1 class="page-title">Mau pesan apa?</h1>
    <button class="featured" data-act="open" data-id="${f.id}" data-fid="featured">
      <span class="ph"><img src="${img(f.img, 640, 360)}" alt="${f.name} dalam gelas di atas meja kayu" onerror="this.style.visibility='hidden'"><span class="badge">Paling laris</span></span>
      <span class="featured-row">
        <span class="ft"><span class="featured-name">${f.name}</span><span class="caption">${rp(f.price)} · ${f.desc}</span></span>
        <span class="add" aria-hidden="true">${icon('plus')}</span>
      </span>
    </button>
    <div class="chips" role="group" aria-label="Kategori">
      ${CATS.map(([k, l]) => `<button class="chip" data-act="cat" data-cat="${k}" data-fid="cat-${k}" aria-pressed="${S.cat === k}">${l}</button>`).join('')}
    </div>
    ${sections}`;
}

/* ---------- render: cart ---------- */
function renderCart() {
  const el = $('#v-cart');
  if (!S.cart.length) {
    el.innerHTML = `
      <${isDesktop() ? "h2" : "h1"} class="page-title">Keranjang</${isDesktop() ? "h2" : "h1"}>
      <div class="empty">
        ${emoji('🛍️', '1f6cd-fe0f')}
        <h2>Keranjang masih kosong</h2>
        <p>Pilih minuman atau kudapan dari menu</p>
        <button class="btn btn-secondary" data-act="go" data-view="menu">Lihat menu</button>
      </div>`;
    return;
  }
  const total = sum(S.cart), n = count(S.cart);
  const nm = S.draft.name || firstName();
  el.innerHTML = `
    <${isDesktop() ? "h2" : "h1"} class="page-title">Keranjang</${isDesktop() ? "h2" : "h1"}>
    <section class="section" style="margin-top:var(--s-16)">
      <ul class="group">
        ${S.cart.map((l, i) => { const m = byId(l.id); const o = optText(l); return `
        <li class="line">
          ${photo(m, 48, 48)}
          <div class="line-body">
            <div class="strong">${m.name}</div>
            ${o ? `<div class="caption">${o}</div>` : ''}
            <div class="line-foot">
              <span class="price">${rp(unit(l) * l.qty)}</span>
              <span class="stepper">
                <button data-act="dec" data-i="${i}" data-fid="dec-${i}" aria-label="${l.qty === 1 ? 'Hapus' : 'Kurangi'} ${m.name}">${icon(l.qty === 1 ? 'trash' : 'minus')}</button>
                <output aria-label="Jumlah">${l.qty}</output>
                <button data-act="inc" data-i="${i}" data-fid="inc-${i}" aria-label="Tambah ${m.name}">${icon('plus')}</button>
              </span>
            </div>
          </div>
        </li>`; }).join('')}
      </ul>
    </section>
    <div class="field">
      <span class="field-label" id="l-mode">Cara ambil</span>
      <div class="seg" role="radiogroup" aria-labelledby="l-mode">
        ${Object.entries(MODES).map(([k, l]) => `<button role="radio" aria-checked="${S.draft.mode === k}" data-act="mode" data-mode="${k}" data-fid="mode-${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="f-name">Nama untuk dipanggil</label>
      <input class="input" id="f-name" data-bind="name" value="${esc(nm)}" autocomplete="given-name" maxlength="24" ${nameError ? 'aria-invalid="true" aria-describedby="e-name"' : ''}>
      ${nameError ? '<p class="field-error" id="e-name">Isi nama supaya barista bisa memanggilmu</p>' : ''}
    </div>
    <div class="field">
      <label class="field-label" for="f-note">Catatan <span>(opsional)</span></label>
      <input class="input" id="f-note" data-bind="note" value="${esc(S.draft.note)}" placeholder="Contoh: es sedikit saja" maxlength="80">
    </div>
    <div class="total"><span class="strong">Total · ${n} item</span><span class="price">${rp(total)}</span></div>
    <p class="caption total-note">Bayar di kasir saat pesanan diambil</p>
    <button class="btn btn-primary cart-cta" data-act="checkout">Pesan sekarang</button>`;
}
function emoji(ch, code) {
  return `<img src="https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/${code}.webp" alt="" width="96" height="96" onerror="this.outerHTML='<div class=&quot;emoji&quot; aria-hidden=&quot;true&quot;>${ch}</div>'">`;
}

/* ---------- render: orders ---------- */
function orderBlock(o) {
  const st = statusOf(o);
  const idx = { diterima: 0, dibuat: 1, siap: 2 }[st];
  const sub = st === 'diterima' ? 'Barista segera membuat pesananmu'
    : st === 'dibuat' ? `Siap sekitar pukul ${hm(o.createdAt + T_READY)}`
    : `Menunggu sejak ${hm(o.createdAt + T_READY)}`;
  return `
  <article class="order" aria-label="Pesanan ${o.no}">
    <div class="order-hero">
      <div class="order-top">
        <div><div class="caption">Nomor antrean</div><div class="order-no">${o.no}</div></div>
        <div class="stack" aria-hidden="true">${o.items.slice(0, 3).map((l) => photo(byId(l.id), 56, 56)).join('')}</div>
      </div>
      <div class="order-status"><span class="dot ${st === 'siap' ? 'ok' : 'live'}"></span>${STATUS_LABEL[st]}</div>
      <div class="caption">${sub}</div>
      <ol class="steps" aria-label="Tahap pesanan">
        ${STEPS.map((s, i) => `<li class="step ${i < idx ? 'done' : i === idx ? 'now' + (st === 'siap' ? '' : ' working') : ''}"${i === idx ? ' aria-current="step"' : ''}><i></i><span>${s}</span></li>`).join('')}
      </ol>
    </div>
    ${st === 'siap' ? `<p class="callout">Pesanan atas nama ${esc(o.name)} sudah di meja ambil. Sebutkan nomor ${o.no} ke barista.</p>` : ''}
    <div class="order-actions">
      ${st === 'siap' ? `<button class="btn btn-primary" data-act="picked" data-id="${o.id}" data-fid="picked-${o.id}">Sudah saya ambil</button>` : ''}
      ${st === 'diterima' ? `<button class="btn btn-secondary" data-act="ask-cancel" data-id="${o.id}" data-fid="cancel-${o.id}">Batalkan pesanan</button>` : ''}
    </div>
    <h2 class="detail-title">${MODES[o.mode]} · dipesan ${hm(o.createdAt)}</h2>
    <ul class="group">
      ${o.items.map((l) => `<li class="drow"><span class="qty">${l.qty}×</span><div><div class="strong">${byId(l.id).name}</div>${optText(l) ? `<div class="caption">${optText(l)}</div>` : ''}</div><span class="price">${rp(unit(l) * l.qty)}</span></li>`).join('')}
      ${o.note ? `<li class="drow"><div class="caption">Catatan: ${esc(o.note)}</div></li>` : ''}
      <li class="drow sum"><div class="strong">Total</div><span class="price">${rp(sum(o.items))}</span></li>
    </ul>
  </article>`;
}
function renderOrders() {
  const act = activeOrders().sort((a, b) => b.createdAt - a.createdAt);
  const past = S.orders.filter((o) => o.pickedAt || o.cancelledAt).sort((a, b) => b.createdAt - a.createdAt);
  const hist = past.length ? `
    <section class="section" aria-labelledby="h-hist">
      <h2 class="section-title" id="h-hist">Riwayat</h2>
      <ul class="group">
        ${past.map((o) => { const m = byId(o.items[0].id); return `
        <li class="hrow">
          ${photo(m, 40, 40)}
          <div><div class="strong">${when(o.createdAt)}</div><div class="caption">${o.cancelledAt ? 'Dibatalkan' : count(o.items) + ' item'} · ${rp(sum(o.items))}</div></div>
          <button class="btn btn-compact" data-act="reorder" data-id="${o.id}" data-fid="re-${o.id}" aria-label="Pesan lagi ${o.no}">Pesan lagi</button>
        </li>`; }).join('')}
      </ul>
    </section>` : '';
  const main = act.length ? act.map(orderBlock).join('') : `
    <div class="empty">
      ${emoji('☕', '2615')}
      <h2>Belum ada pesanan aktif</h2>
      <p>Status pesananmu akan muncul di sini</p>
      <button class="btn btn-secondary" data-act="go" data-view="menu">Pesan sekarang</button>
    </div>`;
  $('#v-orders').innerHTML = `<h1 class="page-title">Pesanan</h1><div class="cols"><div>${main}</div>${hist}</div>`;
}

/* ---------- render: account ---------- */
function renderAccount() {
  const p = S.profile;
  $('#v-account').innerHTML = `
    <h1 class="page-title">Akun</h1>
    <div class="profile">
      <span class="ph"><img src="https://api.dicebear.com/9.x/notionists/svg?seed=teras-07&backgroundColor=efe6e4" alt="" width="64" height="64" onerror="this.style.visibility='hidden'"></span>
      <div><h2 id="p-name">${esc(p.name) || 'Tamu'}</h2><div class="caption">${count(S.orders.filter((o) => o.pickedAt).flatMap((o) => o.items))} item dipesan sejauh ini</div></div>
    </div>
    <section class="section" aria-labelledby="h-prof">
      <h2 class="section-title" id="h-prof">Profil</h2>
      <div class="group"><div class="form-pad">
        <div class="field"><label class="field-label" for="f-pname">Nama</label><input class="input" id="f-pname" data-bind="pname" value="${esc(p.name)}" autocomplete="name" maxlength="40"></div>
        <div class="field"><label class="field-label" for="f-phone">Nomor WhatsApp</label><input class="input" id="f-phone" data-bind="phone" value="${esc(p.phone)}" inputmode="tel" autocomplete="tel" maxlength="16"></div>
      </div></div>
    </section>
    <section class="section" aria-labelledby="h-pref">
      <h2 class="section-title" id="h-pref">Pengaturan</h2>
      <ul class="group">
        <li class="srow"><span class="chipicon">${icon('bell')}</span><div><div class="strong" id="l-notif">Kabari saat siap</div><div class="caption">Pemberitahuan di aplikasi</div></div>
          <button class="switch" role="switch" aria-checked="${p.notify}" aria-labelledby="l-notif" data-act="notify" data-fid="notify"></button></li>
      </ul>
    </section>
    <section class="section" aria-labelledby="h-shop">
      <h2 class="section-title" id="h-shop">Kedai</h2>
      <ul class="group">
        <li class="srow"><span class="chipicon">${icon('pin')}</span><div><div class="strong">Jl. Cikini Raya 45</div><div class="caption">Menteng, Jakarta Pusat</div></div></li>
        <li class="srow"><span class="chipicon">${icon('clock')}</span><div><div class="strong">Setiap hari</div><div class="caption">07.00–21.00</div></div></li>
      </ul>
    </section>
    <section class="section" aria-labelledby="h-data">
      <h2 class="section-title" id="h-data">Data</h2>
      <button class="btn btn-secondary btn-danger" data-act="ask-reset" data-fid="reset">Hapus riwayat dan mulai baru</button>
    </section>`;
}

/* ---------- render: chrome ---------- */
function renderChrome() {
  const n = count(S.cart), act = activeOrders();
  const tabs = [['menu', 'Menu', 'cup'], ['cart', 'Keranjang', 'bag'], ['orders', 'Pesanan', 'receipt'], ['account', 'Akun', 'user']];
  $('#tabs').innerHTML = tabs.map(([v, l, i]) => `
    <li><button class="tab" data-act="go" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>
      <span class="ic">${icon(i, 'icon-24')}${v === 'cart' && n ? `<span class="n">${n}</span>` : ''}${v === 'orders' && act.length ? '<span class="n pip"></span>' : ''}</span>
      ${l}${v === 'cart' && n ? `<span class="sr">, ${n} item</span>` : ''}${v === 'orders' && act.length ? '<span class="sr">, ada pesanan aktif</span>' : ''}
    </button></li>`).join('');
  $('#topnav').innerHTML = tabs.filter(([v]) => v !== 'cart').map(([v, l]) => `
    <button data-act="go" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${l}${v === 'orders' && act.length ? '<span class="dot live"></span>' : ''}</button>`).join('');
  const bar = $('#dockbar');
  let html = '';
  if (S.view === 'menu' && n) html = `<button class="btn btn-primary cartbar" data-act="go" data-view="cart"><span class="l"><span class="count">${n}</span>Lihat keranjang</span><span class="num">${rp(sum(S.cart))}</span></button>`;
  else if (S.view === 'menu' && act.length) { const o = act[act.length - 1], st = statusOf(o); html = `<button class="btn orderbar" data-act="go" data-view="orders"><span class="dot ${st === 'siap' ? 'ok' : 'live'}"></span>${o.no} · ${STATUS_LABEL[st]}${icon('chev')}</button>`; }
  else if (S.view === 'cart' && n) html = `<button class="btn btn-primary" data-act="checkout">Pesan sekarang <span class="sep">·</span> <span class="num">${rp(sum(S.cart))}</span></button>`;
  bar.innerHTML = html; bar.hidden = !html;
  document.body.classList.toggle('has-bar', !!html);
  $('#main').dataset.view = S.view;
}

function render(which) {
  if (S.view === 'cart' && isDesktop()) S.view = 'menu';
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const all = !which;
  if (all || which.includes('menu')) renderMenu();
  if (all || which.includes('cart')) renderCart();
  if (all || which.includes('orders')) renderOrders();
  if (all || which.includes('account')) renderAccount();
  renderChrome();
  if (fid) { const el = document.querySelector(`[data-fid="${fid}"]`); if (el) el.focus({ preventScroll: true }); }
  save();
}

/* ---------- sheets ---------- */
function renderSheet() {
  const root = $('#sheet-root');
  if (!sheet) { root.innerHTML = ''; document.body.style.overflow = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); else if (lastFocus && lastFocus.dataset.fid) { const el = document.querySelector(`[data-fid="${lastFocus.dataset.fid}"]`); if (el) el.focus({ preventScroll: true }); } return; }
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const had = !!root.firstChild;
  let body = '';
  if (sheet.kind === 'item') {
    const m = byId(sheet.id);
    const price = (m.price + (sheet.size === 'Besar' ? SIZE_UP : 0)) * sheet.qty;
    const seg = (label, key, opts, text = (x) => x) => `
      <div class="field"><span class="field-label" id="sl-${key}">${label}</span>
      <div class="seg" role="radiogroup" aria-labelledby="sl-${key}">${opts.map((o) => `<button role="radio" aria-checked="${sheet[key] === o}" data-act="opt" data-key="${key}" data-val="${o}" data-fid="opt-${key}-${o}">${text(o)}</button>`).join('')}</div></div>`;
    body = `
      <div class="grabber"></div>
      <span class="ph" style="display:block"><img src="${img(m.img, 480, 270)}" alt="" onerror="this.style.visibility='hidden'"></span>
      <button class="sheet-close" data-act="close" aria-label="Tutup">${icon('x')}</button>
      <div class="sheet-head"><h2 id="sheet-title">${m.name}</h2><span class="price">${rp(m.price)}</span></div>
      <p class="sheet-desc">${m.desc}</p>
      ${m.temp && m.temp.length > 1 ? seg('Suhu', 'temp', m.temp) : ''}
      ${m.size ? seg('Ukuran', 'size', ['Reguler', 'Besar'], (o) => o === 'Besar' ? 'Besar +5.000' : o) : ''}
      ${m.sugar ? seg('Gula', 'sugar', SUGARS) : ''}
      <div class="sheet-foot">
        <span class="stepper">
          <button data-act="sheet-dec" data-fid="sdec" aria-label="Kurangi jumlah" ${sheet.qty === 1 ? 'disabled style="opacity:.35"' : ''}>${icon('minus')}</button>
          <output aria-label="Jumlah">${sheet.qty}</output>
          <button data-act="sheet-inc" data-fid="sinc" aria-label="Tambah jumlah">${icon('plus')}</button>
        </span>
        <button class="btn btn-primary" data-act="add" data-fid="sadd">Tambah <span class="sep">·</span> <span class="num">${rp(price)}</span></button>
      </div>`;
  } else {
    body = `
      <div class="grabber"></div>
      <div class="confirm">
        <h2 id="sheet-title">${sheet.title}</h2>
        <p>${sheet.text}</p>
        <button class="btn btn-secondary btn-danger" data-act="${sheet.act}" data-id="${sheet.id || ''}" data-fid="cyes">${sheet.yes}</button>
        <button class="btn btn-secondary" data-act="close" data-fid="cno">${sheet.no}</button>
      </div>`;
  }
  if (had) root.querySelector('.sheet').innerHTML = body;
  else root.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">${body}</div></div>`;
  document.body.style.overflow = 'hidden';
  const el = fid && root.querySelector(`[data-fid="${fid}"]`);
  (el || root.querySelector('.sheet')).focus({ preventScroll: true });
}
function openSheet(s) { lastFocus = document.activeElement; sheet = s; renderSheet(); }
function closeSheet() { sheet = null; renderSheet(); }

let toastTimer;
function toast(msg) {
  $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; }, 2600);
}

/* ---------- actions ---------- */
function go(v) {
  if (v === 'cart' && isDesktop()) v = 'menu';
  S.view = v; render([]); scrollTo(0, 0);
}
function addLine(id, opts, qty) {
  const k = keyOf(id, opts);
  const ex = S.cart.find((l) => keyOf(l.id, l.opts) === k);
  if (ex) ex.qty += qty; else S.cart.push({ id, opts, qty });
}
const A = {
  go: (d) => go(d.view),
  cat: (d) => { S.cat = d.cat; render(['menu']); },
  open: (d) => { const m = byId(d.id); openSheet({ kind: 'item', id: m.id, temp: m.temp ? m.temp[0] : undefined, size: m.size ? 'Reguler' : undefined, sugar: m.sugar ? 'Normal' : undefined, qty: 1 }); },
  opt: (d) => { sheet[d.key] = d.val; renderSheet(); },
  'sheet-inc': () => { sheet.qty = Math.min(20, sheet.qty + 1); renderSheet(); },
  'sheet-dec': () => { sheet.qty = Math.max(1, sheet.qty - 1); renderSheet(); },
  add: () => {
    const { id, temp, size, sugar, qty } = sheet;
    const opts = {}; if (temp) opts.temp = temp; if (size) opts.size = size; if (sugar) opts.sugar = sugar;
    addLine(id, opts, qty); closeSheet(); render(['cart']);
    const b = $('#dockbar .btn'); if (b) b.classList.add('bump');
    if (isDesktop()) toast(`${byId(id).name} masuk keranjang`);
  },
  close: () => closeSheet(),
  scrim: (d, e) => { if (e.target.classList.contains('scrim')) closeSheet(); },
  inc: (d) => { S.cart[d.i].qty = Math.min(20, S.cart[d.i].qty + 1); render(['cart']); },
  dec: (d) => { const l = S.cart[d.i]; if (l.qty > 1) l.qty--; else S.cart.splice(d.i, 1); render(['cart']); },
  mode: (d) => { S.draft.mode = d.mode; render(['cart']); },
  checkout: () => {
    const name = (S.draft.name || firstName()).trim();
    if (!name) { nameError = true; render(['cart']); const f = $('#f-name'); f.focus(); return; }
    nameError = false;
    const o = { id: 'o' + S.seq, no: 'A-' + S.seq, createdAt: Date.now(), mode: S.draft.mode, name, note: S.draft.note.trim(), items: S.cart };
    S.seq++; S.orders.push(o); S.cart = []; S.draft.note = '';
    S.view = 'orders'; render(); scrollTo(0, 0);
    toast(`Pesanan ${o.no} terkirim ke barista`);
  },
  picked: (d) => { const o = S.orders.find((x) => x.id === d.id); o.pickedAt = Date.now(); render(['orders', 'account']); toast('Selamat menikmati'); },
  'ask-cancel': (d) => { const o = S.orders.find((x) => x.id === d.id); openSheet({ kind: 'confirm', title: `Batalkan pesanan ${o.no}?`, text: 'Pesanan belum dibuat, jadi masih bisa dibatalkan.', yes: 'Ya, batalkan', no: 'Tidak jadi', act: 'cancel', id: o.id }); },
  cancel: (d) => { const o = S.orders.find((x) => x.id === d.id); if (statusOf(o) === 'diterima') { o.cancelledAt = Date.now(); toast(`Pesanan ${o.no} dibatalkan`); } else toast('Pesanan sudah dibuat, tidak bisa dibatalkan'); closeSheet(); render(['orders']); },
  reorder: (d) => { const o = S.orders.find((x) => x.id === d.id); o.items.forEach((l) => addLine(l.id, { ...l.opts }, l.qty)); S.view = isDesktop() ? 'menu' : 'cart'; render(['cart']); scrollTo(0, 0); toast('Pesanan lama masuk keranjang'); },
  notify: () => { S.profile.notify = !S.profile.notify; render(['account']); },
  'ask-reset': () => openSheet({ kind: 'confirm', title: 'Hapus semua data?', text: 'Riwayat pesanan, keranjang, dan profil di perangkat ini akan dihapus.', yes: 'Hapus semua', no: 'Batal', act: 'reset' }),
  reset: () => { S = { profile: { name: '', phone: '', notify: true }, cart: [], draft: { mode: 'ambil', name: '', note: '' }, orders: [], seq: 1, view: 'account', cat: 'semua' }; closeSheet(); render(); toast('Data dihapus'); },
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) fn(t.dataset, e);
});
document.addEventListener('input', (e) => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (!b) return;
  const v = e.target.value;
  if (b === 'name') { S.draft.name = v; if (nameError && v.trim()) { nameError = false; e.target.removeAttribute('aria-invalid'); const er = $('#e-name'); if (er) er.remove(); } }
  if (b === 'note') S.draft.note = v;
  if (b === 'pname') { S.profile.name = v; $('#p-name').textContent = v.trim() || 'Tamu'; S.draft.name = ''; renderMenu(); renderCart(); }
  if (b === 'phone') S.profile.phone = v;
  save();
});
document.addEventListener('keydown', (e) => {
  if (!sheet) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...$('#sheet-root').querySelectorAll('button:not([disabled])')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement.classList.contains('sheet'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
matchMedia('(min-width: 1024px)').addEventListener('change', () => render(['cart']));

/* ---------- status clock ---------- */
let sig = activeOrders().map((o) => o.id + statusOf(o)).join();
setInterval(() => {
  const act = activeOrders();
  const now = act.map((o) => o.id + statusOf(o)).join();
  if (now === sig) return;
  const ready = act.find((o) => statusOf(o) === 'siap' && !sig.includes(o.id + 'siap'));
  sig = now;
  render(['orders']);
  if (ready && S.profile.notify) toast(`Pesanan ${ready.no} siap diambil`);
}, 1000);

if (S.view === 'cart' && isDesktop()) S.view = 'menu';
render();
// test hook for seeding states
window.__kopi = { get state() { return S; }, set(fn) { fn(S); sig = ''; render(); } };
})();
</script>
</body>
</html>
