<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>Teras Kopi — Pesan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean — warm off-white canvas, white cards, paprika brand for actions, espresso-dark summary card, herb green for status. */
:root {
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F7F6F3; --surface: #FFFFFF; --surface-2: #F4F2EE; --line: rgba(40,28,20,.09);
  --text: #1C1714; --text-2: #6B625B; --text-3: #A0968E; --text-tab: #7A7069;
  --brand: #C4461F; --brand-strong: #A63A18; --brand-tint: #FCEDE7; --on-brand: #FFFFFF;
  --dark: #241C17; --dark-2: #3A2F28;
  --ok: #2E7D32; --ok-tint: #E7F4E8; --warn: #B45309; --warn-tint: #FEF3E2; --bad: #C62828; --bad-tint: #FDECEC;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(40,28,20,.05), 0 1px 1px rgba(40,28,20,.03);
  --sh-2: 0 1px 2px rgba(40,28,20,.05), 0 8px 20px -10px rgba(40,28,20,.14);
  --sh-3: 0 2px 4px rgba(40,28,20,.06), 0 16px 36px -10px rgba(40,28,20,.22);
  --sh-float: 0 12px 32px -8px rgba(40,28,20,.22);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }

/* ---------- Shell ---------- */
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; }
.rail, .aside { display: none; }
main { padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom)); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 10px -4px rgba(196,70,31,.6); }
.mark svg { width: 22px; height: 22px; stroke-width: 2; }
.brand b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.brand small { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #F6E3D3; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: var(--sh-1); display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--brand-strong); }
.avatar img { width: 100%; height: 100%; }
.greet { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.greet .avatar { display: none; }
.greet p { font-size: 14px; color: var(--text-2); }
.greet h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.page-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.page-sub { font-size: 14px; color: var(--text-2); margin-top: 2px; }

/* ---------- Pills, chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.brand { background: var(--brand-tint); color: var(--brand-strong); }
.pill.mute { background: var(--surface-2); color: var(--text-2); }
.pill.nodot::before { display: none; }

/* ---------- Summary card (active order / shop) ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; background: radial-gradient(120% 140% at 100% 0%, #4A3a30 0%, var(--dark) 55%); color: #fff; box-shadow: var(--sh-3); margin-bottom: 24px; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(196,70,31,.35), transparent 70%); pointer-events: none; }
.hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.hero-label { font-size: 13px; color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 6px; }
.hero-fig { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; line-height: 1.2; }
.hero-sub { font-size: 14px; color: rgba(255,255,255,.78); margin-top: 4px; }
.hero .emo-chip { background: rgba(255,255,255,.1); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 18px; position: relative; z-index: 1; }
.steps i { height: 6px; border-radius: var(--r-full); background: rgba(255,255,255,.16); overflow: hidden; position: relative; }
.steps i.on { background: var(--brand); }
.steps i.now { background: rgba(255,255,255,.16); }
.steps i.now::after { content: ""; position: absolute; inset: 0; width: 55%; background: var(--brand); border-radius: inherit; animation: fill 2.4s ease-in-out infinite alternate; }
@keyframes fill { from { width: 30%; } to { width: 75%; } }
.step-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.6); position: relative; z-index: 1; }
.step-labels span.on { color: #fff; font-weight: 500; }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); position: relative; z-index: 1; font-size: 13px; color: rgba(255,255,255,.75); }
.hero-link { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.12); border: 0; height: 40px; padding: 0 16px; border-radius: var(--r-full); transition: background-color .15s; }
.hero-link:hover { background: rgba(255,255,255,.2); }
.hero-stats { display: grid; grid-template-columns: auto 1fr; margin-top: 16px; position: relative; z-index: 1; }
.hero-stats div { padding-right: 16px; }
.hero-stats div + div { border-left: 1px solid rgba(255,255,255,.14); padding-left: 16px; }
.hero-stats b { display: block; font-size: 16px; font-weight: 600; }
.hero-stats span { font-size: 12px; color: rgba(255,255,255,.7); }

/* ---------- Section ---------- */
.sec { margin-bottom: 24px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.sec-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.sec-head span { font-size: 13px; color: var(--text-2); }

/* ---------- Segmented control ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: #EFECE7; border-radius: var(--r-sm); }
.seg button { height: 40px; border: 0; background: transparent; border-radius: var(--r-xs); font-size: 14px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: var(--sh-1); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--text); }

/* ---------- Category chips ---------- */
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 8px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--text); transition: background-color .15s, border-color .15s; }
.cat .ci { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.cat .ci img { width: 20px; height: 20px; }
.cat .ct { font-size: 12px; color: var(--text-3); font-weight: 500; }
.cat:hover { border-color: rgba(40,28,20,.2); }
.cat[aria-pressed="true"] { background: var(--dark); border-color: var(--dark); color: #fff; }
.cat[aria-pressed="true"] .ci { background: rgba(255,255,255,.14); }
.cat[aria-pressed="true"] .ct { color: rgba(255,255,255,.65); }

/* ---------- Emoji chips ---------- */
.emo-chip { width: 48px; height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; }
.emo-chip img { width: 30px; height: 30px; }
.emo-chip .em { font-size: 24px; line-height: 1; }
.emo-chip.lg { width: 64px; height: 64px; border-radius: var(--r-md); }
.emo-chip.lg img { width: 40px; height: 40px; }
.emo-chip.xl { width: 96px; height: 96px; border-radius: var(--r-lg); }
.emo-chip.xl img { width: 60px; height: 60px; }
.emo-chip.xl .em { font-size: 48px; }
.emo-chip.sm { width: 36px; height: 36px; border-radius: 10px; }
.emo-chip.sm img { width: 22px; height: 22px; }
.emo-chip.sm .em { font-size: 18px; }

/* ---------- Featured (terlaris) ---------- */
.feat { display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.feat::-webkit-scrollbar { display: none; }
.fcard { scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 8px 8px 12px; box-shadow: var(--sh-1); transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; }
.fcard:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.fcard .fimg { height: 104px; border-radius: 10px; display: grid; place-items: center; position: relative; }
.fcard .fimg img { width: 64px; height: 64px; }
.fcard .fimg .em { font-size: 48px; }
.fcard .fimg .pill { position: absolute; top: 8px; left: 8px; background: #fff; color: var(--text); height: 24px; font-size: 12px; padding: 0 8px; box-shadow: var(--sh-1); }
.fcard .fimg .pill::before { background: var(--brand); }
.fcard b { font-size: 14px; font-weight: 600; margin: 10px 4px 0; line-height: 1.3; min-height: calc(2 * 1.3em); }
.fcard .fp { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 0; font-size: 14px; font-weight: 600; }
.fcard .plus { position: absolute; right: 8px; bottom: 8px; box-shadow: 0 4px 10px -4px rgba(196,70,31,.7); width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; }
.fcard .plus svg { width: 16px; height: 16px; stroke-width: 2.2; }

/* ---------- Menu list ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.list { padding: 4px 0; }
.mrow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; position: relative; }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; left: 94px; right: 16px; border-top: 1px solid var(--line); }
.mrow-btn { position: absolute; inset: 0; border: 0; background: transparent; border-radius: inherit; z-index: 0; }
.mrow-btn:hover { background: rgba(40,28,20,.025); }
.mrow > *:not(.mrow-btn) { position: relative; z-index: 1; pointer-events: none; }
.mrow .add { pointer-events: auto; }
.mrow .info { flex: 1; min-width: 0; }
.mrow .name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mrow .desc { text-wrap: balance; font-size: 13px; color: var(--text-2); margin-top: 2px; line-height: 1.4; }
.mrow .price { font-size: 15px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.mrow .incart { font-size: 12px; font-weight: 600; color: var(--brand-strong); background: var(--brand-tint); padding: 2px 8px; border-radius: var(--r-full); }
.mrow.soldout .emo-chip, .mrow.soldout .name, .mrow.soldout .price { opacity: .55; }
.add { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand-tint); color: var(--brand-strong); display: grid; place-items: center; flex: none; transition: background-color .15s, color .15s, transform .12s; }
.add:hover { background: var(--brand); color: #fff; }
.add:active { transform: scale(.92); }
.add svg { stroke-width: 2.2; }
.add:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: var(--r-md); border: 0; font-weight: 600; font-size: 16px; background: var(--brand); color: var(--on-brand); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(40,28,20,.18), 0 8px 18px -8px rgba(196,70,31,.7); transition: transform .15s, box-shadow .15s, background-color .15s; }
@media (hover: hover) { .btn:hover { background: var(--brand-strong); } }
.btn:active { transform: scale(.98); }
.btn:disabled { background: #E6E1DB; color: var(--text-3); box-shadow: none; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.dark { background: var(--dark); box-shadow: 0 8px 18px -8px rgba(36,28,23,.6); }
.btn.dark:hover { background: #000; }
.btn.sm { height: 40px; font-size: 14px; padding: 0 14px; border-radius: var(--r-sm); }
.btn .spread { margin-left: auto; }
.linkbtn { border: 0; background: none; color: var(--brand-strong); font-weight: 600; font-size: 14px; padding: 10px 4px; margin: -10px -4px; border-radius: var(--r-xs); }
.linkbtn:hover { text-decoration: underline; }

/* ---------- Cart bar (mobile) ---------- */
.cartbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px)); z-index: 30; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px 0 16px; border-radius: var(--r-md); background: var(--brand); color: #fff; border: 0; box-shadow: var(--sh-float), 0 10px 24px -10px rgba(196,70,31,.7); text-align: left; animation: rise .25s ease-out; }
.cartbar:hover { background: var(--brand-strong); }
.cartbar .cnt { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.cartbar .t { flex: 1; line-height: 1.25; }
.cartbar .t b { display: block; font-size: 15px; font-weight: 600; }
.cartbar .t span { font-size: 12px; color: #fff; }
.cartbar .go { display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 14px; border-radius: var(--r-sm); background: #fff; color: var(--brand-strong); font-weight: 600; font-size: 14px; }
@keyframes rise { from { transform: translate(-50%, 12px); opacity: 0; } }

/* ---------- Tab bar ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(255,255,255,.96); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab-h); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-tab); position: relative; }
.tab .ico { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--brand-strong); font-weight: 600; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.tab:hover:not([aria-current]) { color: var(--text); }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; border: 2px solid #fff; box-sizing: content-box; }
.tab .dot { position: absolute; top: 12px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--ok); border: 2px solid #fff; }

/* ---------- Cart ---------- */
.line { display: flex; gap: 12px; padding: 16px; align-items: flex-start; }
.line + .line { border-top: 1px solid var(--line); }
.line .info { flex: 1; min-width: 0; }
.line .name { font-size: 16px; font-weight: 500; }
.line .opts { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.line .note { font-size: 13px; color: var(--text-2); margin-top: 4px; display: flex; gap: 6px; align-items: flex-start; }
.line .note svg { margin-top: 2px; }
.line .bot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 12px; }
.line .lp { font-size: 15px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: var(--r-full); padding: 2px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--text); transition: background-color .15s; }
.stepper button:hover { background: #fff; box-shadow: var(--sh-1); }
.stepper button svg { width: 16px; height: 16px; stroke-width: 2.2; }
.stepper output { min-width: 28px; text-align: center; font-weight: 600; font-size: 15px; }
.stepper.lg button { width: 44px; height: 44px; }
.stepper.lg output { min-width: 36px; font-size: 18px; }

.field { margin-bottom: 16px; }
.field > label, .field > .lbl { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.field .opt { color: var(--text-2); font-weight: 400; }
.input { width: 100%; height: 48px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid rgba(40,28,20,.14); background: #fff; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
textarea.input { height: 76px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(196,70,31,.15); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.err { display: flex; align-items: center; gap: 6px; color: var(--bad); font-size: 13px; margin-top: 6px; }

.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.payopt { display: flex; align-items: center; gap: 10px; padding: 12px; min-height: 60px; border-radius: var(--r-sm); border: 1px solid rgba(40,28,20,.14); background: #fff; text-align: left; transition: border-color .15s, background-color .15s; }
.payopt .pi { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); flex: none; }
.payopt b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.payopt span { font-size: 12px; color: var(--text-2); }
.payopt:hover { border-color: rgba(40,28,20,.28); }
.payopt[aria-pressed="true"] { border-color: var(--brand); background: #FFFAF8; box-shadow: 0 0 0 1px var(--brand); }
.payopt[aria-pressed="true"] .pi { background: var(--brand-tint); color: var(--brand-strong); }

.sum { padding: 16px; }
.sum-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-2); padding: 4px 0; }
.sum-row.total { color: var(--text); font-size: 18px; font-weight: 600; padding-top: 12px; margin-top: 8px; border-top: 1px dashed rgba(40,28,20,.16); }
.sum-row .free { color: var(--ok); font-weight: 600; }
.pad { padding: 16px; }

/* ---------- Empty ---------- */
.empty { text-align: center; padding: 40px 24px 32px; display: flex; flex-direction: column; align-items: center; }
.empty .emo-chip { margin-bottom: 16px; background: var(--surface-2); }
.empty h2 { font-size: 20px; font-weight: 600; }
.empty p { font-size: 14px; color: var(--text-2); margin: 6px 0 20px; max-width: 280px; }

/* ---------- Orders ---------- */
.track { padding: 20px; }
.track-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.track-code { font-size: 13px; color: var(--text-2); }
.track-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
.track-sub { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring > svg { width: 64px; height: 64px; transform: rotate(-90deg); }

}

<script>
/* ---------- Icons ---------- */

};
const ic = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Data ---------- */
const emoji3d = (e) => 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/' +
  [...e].filter(c => c !== '️').map(c => c.codePointAt(0).toString(16)).join('-') + '.webp';
const emo = (e, size = 30) => `<img src="${emoji3d(e)}" alt="" width="${size}" height="${size}" loading="lazy" data-e="${e}" onerror="this.outerHTML='<span class=em aria-hidden=true>'+this.dataset.e+'</span>'">`;

const CATS = [
  { id: 'kopi', name: 'Kopi', e: '☕' },
  { id: 'nonkopi', name: 'Non-kopi', e: '🍵' },
  { id: 'makanan', name: 'Makanan', e: '🥐' },
];
const MENU = [
  { id: 'aren', cat: 'kopi', name: 'Es Kopi Susu Aren', desc: 'Espresso, susu segar, gula aren', price: 22000, e: '🧋', tint: '#F6E6D6', opts: ['size', 'sugar', 'milk'], temps: ['Dingin'], tag: 'Terlaris' },
  { id: 'latte', cat: 'kopi', name: 'Caffe Latte', desc: 'Double shot, susu dikukus lembut', price: 28000, e: '☕', tint: '#F3E7DC', opts: ['temp', 'size', 'sugar', 'milk'], temps: ['Panas', 'Dingin'] },
  { id: 'americano', cat: 'kopi', name: 'Americano', desc: 'Espresso dan air, tanpa susu', price: 20000, e: '🫖', tint: '#ECE7E1', opts: ['temp', 'size', 'sugar'], temps: ['Panas', 'Dingin'] },
  { id: 'coldbrew', cat: 'kopi', name: 'Cold Brew Jeruk', desc: 'Cold brew 18 jam, jeruk peras', price: 27000, e: '🍊', tint: '#FDEBD7', opts: ['size', 'sugar'], temps: ['Dingin'], tag: 'Baru' },

  { id: 'coklat', cat: 'nonkopi', name: 'Cokelat Susu', desc: 'Dark chocolate 60%, susu segar', price: 25000, e: '🍫', tint: '#F1E4DD', opts: ['temp', 'size', 'sugar', 'milk'], temps: ['Dingin', 'Panas'] },
  { id: 'leci', cat: 'nonkopi', name: 'Es Teh Leci', desc: 'Teh hitam, sirup dan buah leci', price: 18000, e: '🍹', tint: '#FCE5EA', opts: ['size', 'sugar'], temps: ['Dingin'] },
  { id: 'croissant', cat: 'makanan', name: 'Croissant Mentega', desc: 'Dipanggang setiap pagi', price: 24000, e: '🥐', tint: '#FBEBCF', opts: [], tag: 'Terlaris' },
  { id: 'banana', cat: 'makanan', name: 'Banana Bread', desc: 'Pisang, kayu manis, kenari', price: 22000, e: '🍌', tint: '#FBF1C9', opts: [], soldOut: true },
  { id: 'cookie', cat: 'makanan', name: 'Cookie Cokelat', desc: 'Chunky, cokelat hitam', price: 15000, e: '🍪', tint: '#F4E6D6', opts: [] },
  { id: 'toast', cat: 'makanan', name: 'Roti Bakar Keju', desc: 'Roti sourdough, keju cheddar', price: 26000, e: '🧀', tint: '#FCF0CF', opts: [] },
];
const byId = Object.fromEntries(MENU.map(m => [m.id, m]));
const SIZE_UP = 5000, OAT_UP = 7000;
const SUGARS = ['Normal', 'Kurang manis', 'Tanpa gula'];
const SHOP = { name: 'Teras Kopi', addr: 'Jl. Kaliurang Km 5,3', city: 'Yogyakarta', open: 7, close: 22 };
const STATUS = [
  { key: 'diterima', label: 'Diterima', long: 'Pesanan diterima', sub: 'Barista sudah menerima pesananmu' },
  { key: 'dibuat', label: 'Dibuat', long: 'Sedang dibuat', sub: 'Pesananmu sedang disiapkan' },
  { key: 'siap', label: 'Siap', long: 'Siap diambil', sub: 'Ambil di meja pickup dekat kasir' },
  { key: 'selesai', label: 'Selesai', long: 'Selesai', sub: 'Terima kasih, selamat menikmati' },
];
const MIN = 60000;
const T_ACCEPT = 1 * MIN, T_READY = 7 * MIN; // estimasi barista

/* ---------- Helpers ---------- */
const rp = (n) => 'Rp' + n.toLocaleString('id-ID');
const hm = (t) => new Date(t).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  const d = new Date(t), now = new Date();
  const diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (diff === 0) return 'Hari ini';
  if (diff === 1) return 'Kemarin';
  return d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
};
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const unitPrice = (l) => { const m = byId[l.itemId]; return m.price + (l.size === 'Large' ? SIZE_UP : 0) + (l.milk === 'Oat' ? OAT_UP : 0); };
const lineTotal = (l) => unitPrice(l) * l.qty;
const optText = (l) => {
  const m = byId[l.itemId], parts = [];
  if (m.temps) parts.push(l.temp);
  if (m.opts.includes('size')) parts.push(l.size);
  if (m.opts.includes('sugar') && l.sugar !== 'Normal') parts.push(l.sugar);
  if (m.opts.includes('milk') && l.milk === 'Oat') parts.push('Susu oat');
  return parts.join(' · ');
};
const lineKey = (l) => [l.itemId, l.temp, l.size, l.sugar, l.milk, l.note].join('|');

  if (o.done) return 3;
  const el = Date.now() - o.createdAt;
  return el < T_ACCEPT ? 0 : el < T_READY ? 1 : 2;
};
const activeOrder = () => S.orders.find(o => !o.done);

/* ---------- State ---------- */
const KEY = 'teraskopi.v1';
function seed() {
  const now = Date.now(), day = 864e5;

    `<div class="shop"><span class="pill ${isOpen() ? 'ok' : 'mute'}">${isOpen() ? 'Buka sekarang' : 'Tutup'}</span><b>${SHOP.addr}</b>07.00–22.00 setiap hari</div>`;
  document.getElementById('cartbar-slot').innerHTML = (S.tab === 'menu' && n) ? `<button class="cartbar" data-act="tab" data-tab="cart"><span class="cnt num">${n}</span><span class="t"><b class="num">${rp(cartTotal())}</b><span>${S.cart.map(l => byId[l.itemId].name).slice(0, 2).join(', ')}${S.cart.length > 2 ? ' +' + (S.cart.length - 2) : ''}</span></span><span class="go">Keranjang ${ic('arrow', 'sm')}</span></button>` : '';
  document.getElementById('aside').innerHTML = `<h2 class="aside-title">Keranjang</h2><p class="page-sub" style="margin-bottom:16px">${n ? `${n} item · ambil di ${SHOP.addr}` : 'Belum ada item'}</p>${cartInner(true)}`;
}
function render() {
  if (mq.matches && S.tab === 'cart') S.tab = 'menu';
  const v = document.getElementById('view');
  v.innerHTML = S.tab === 'menu' ? viewMenu() : S.tab === 'cart' ? viewCart() : S.tab === 'pesanan' ? viewOrders() : viewProfile();
  renderChrome();
  renderSheet();
}

/* ---------- Sheet ---------- */
function openSheet(id) {
  const m = byId[id]; if (!m || m.soldOut) return;
  sheet = { itemId: id, temp: (m.temps || [''])[0], size: 'Reguler', sugar: 'Normal', milk: 'Sapi', note: '', qty: 1 };
  lastFocus = document.activeElement;
  renderSheet(true);
}
let lastFocus = null;
function renderSheet(focus) {
  const slot = document.getElementById('sheet-slot');
  if (!sheet) { slot.innerHTML = ''; return; }
  const m = byId[sheet.itemId];
  const seg = (key, label, vals, extra = {}) => `<div class="field"><span class="lbl" id="sg-${key}">${label}</span><div class="seg" role="group" aria-labelledby="sg-${key}">${vals.map(v => `<button data-act="opt" data-k="${key}" data-v="${v}" aria-pressed="${sheet[key] === v}">${v}${extra[v] ? `<span class="extra">${extra[v]}</span>` : ''}</button>`).join('')}</div></div>`;
  const keepScroll = slot.querySelector('.sheet-body')?.scrollTop || 0;
  slot.innerHTML = `<div class="scrim" data-act="close-scrim">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" style="position:relative">
      <div class="grab" aria-hidden="true"></div>
      <button class="x" data-act="close" aria-label="Tutup">${ic('x')}</button>
      <div class="sheet-body">
        <div class="sheet-hero"><span class="emo-chip xl" style="background:${m.tint}">${emo(m.e, 60)}</span>
          <div><h2 id="sh-t">${m.name}</h2><p>${m.desc}</p><div class="price num">${rp(m.price)}</div></div></div>
        ${m.temps && m.temps.length > 1 ? seg('temp', 'Suhu', m.temps) : m.temps ? `<div class="field"><span class="lbl">Suhu</span><span class="pill mute nodot">Hanya ${m.temps[0].toLowerCase()}</span></div>` : ''}
        ${m.opts.includes('size') ? seg('size', 'Ukuran', ['Reguler', 'Large'], { Large: '+5rb' }) : ''}
        ${m.opts.includes('sugar') ? seg('sugar', 'Gula', SUGARS) : ''}
        ${m.opts.includes('milk') ? seg('milk', 'Susu', ['Sapi', 'Oat'], { Oat: '+7rb' }) : ''}
        <div class="field" style="margin-bottom:0"><label for="sh-note">Catatan untuk barista <span class="opt">(opsional)</span></label>
          <textarea class="input" id="sh-note" data-bind="sheet-note" maxlength="80" placeholder="${m.cat === 'makanan' ? 'Mis. tolong dihangatkan' : 'Mis. es sedikit'}">${esc(sheet.note)}</textarea></div>
      </div>
      <div class="sheet-foot">
        <span class="stepper lg" role="group" aria-label="Jumlah">
          <button data-act="sq" data-d="-1" aria-label="Kurangi" ${sheet.qty <= 1 ? 'disabled' : ''}>${ic('minus')}</button>
          <output class="num">${sheet.qty}</output>
          <button data-act="sq" data-d="1" aria-label="Tambah" ${sheet.qty >= 20 ? 'disabled' : ''}>${ic('plus')}</button>
        </span>
        <button class="btn" data-act="addsheet">Tambah<span class="spread num">${rp(unitPrice(sheet) * sheet.qty)}</span></button>
      </div>
    </div></div>`;
  slot.querySelector('.sheet-body').scrollTop = keepScroll;
  if (focus) slot.querySelector('.x').focus();
}
function closeSheet() { sheet = null; renderSheet(); lastFocus?.focus?.(); }

/* ---------- Actions ---------- */
function addLine(l) {
  const k = lineKey(l), ex = S.cart.find(x => lineKey(x) === k);
  if (ex) ex.qty = Math.min(20, ex.qty + l.qty); else S.cart.push({ ...l });
  save();
}
let toastT;
function toast(msg) {
  const s = document.getElementById('toast-slot');
  s.innerHTML = `<div class="toast">${ic('check')}<span>${msg}</span></div>`;
  clearTimeout(toastT); toastT = setTimeout(() => (s.innerHTML = ''), 2400);
}
function validate() {
  errors = {};
  if (!S.name.trim()) errors.name = 'Isi nama agar barista bisa memanggilmu';
  if (S.type === 'tempat' && !/^\d{1,3}$/.test(S.table.trim())) errors.table = 'Isi nomor meja (angka di stiker meja)';
  return !Object.keys(errors).length;
}
function place() {
  if (!validate()) { render(); document.querySelector('[aria-invalid="true"]')?.focus(); return; }
  const code = (S.type === 'tempat' ? 'B-' : 'A-') + String(S.seq++).padStart(3, '0');
  S.orders.unshift({ id: code + '-' + Date.now(), code, createdAt: Date.now(), lines: S.cart.map(l => ({ ...l })), total: cartTotal(), type: S.type, table: S.table.trim(), name: S.name.trim(), pay: S.pay, done: false });
  S.cart = []; S.tab = 'pesanan'; save(); render(); scrollTo(0, 0);
  toast(`Pesanan #${code} terkirim ke barista`);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'close-scrim' && e.target !== t) return;
  switch (a) {
    case 'tab': S.tab = mq.matches && t.dataset.tab === 'cart' ? 'menu' : t.dataset.tab; errors = {}; save(); render(); scrollTo(0, 0); document.getElementById('view').focus({ preventScroll: true }); break;
    case 'cat': S.cat = t.dataset.cat; save(); render(); break;
    case 'open': openSheet(t.dataset.id); break;
    case 'quick': {
      const m = byId[t.dataset.id];
      if (m.opts.length || (m.temps && m.temps.length > 1)) openSheet(m.id);
      else { addLine({ itemId: m.id, qty: 1, temp: (m.temps || [''])[0], size: 'Reguler', sugar: 'Normal', milk: 'Sapi', note: '' }); render(); toast(`${m.name} masuk keranjang`); }
      break;
    }
    case 'close': case 'close-scrim': closeSheet(); break;
    case 'opt': sheet[t.dataset.k] = t.dataset.v; renderSheet(); document.querySelector(`[data-act="opt"][data-k="${t.dataset.k}"][data-v="${t.dataset.v}"]`)?.focus(); break;
    case 'sq': sheet.qty = Math.max(1, Math.min(20, sheet.qty + +t.dataset.d)); renderSheet(); document.querySelector(`[data-act="sq"][data-d="${t.dataset.d}"]`)?.focus(); break;
    case 'addsheet': { const m = byId[sheet.itemId], q = sheet.qty; addLine(sheet); sheet = null; render(); lastFocus?.focus?.(); toast(`${q}× ${m.name} masuk keranjang`); break; }
    case 'inc': S.cart[+t.dataset.i].qty = Math.min(20, S.cart[+t.dataset.i].qty + 1); save(); render(); break;
    case 'dec': { const l = S.cart[+t.dataset.i]; if (l.qty > 1) l.qty--; else S.cart.splice(+t.dataset.i, 1); save(); render(); break; }
    case 'type': S.type = t.dataset.v; delete errors.table; save(); render(); break;
    case 'pay': S.pay = t.dataset.v; save(); render(); break;
    case 'place': place(); break;
    case 'pickup': { const o = activeOrder(); if (o && orderStatus(o) >= 2) { o.done = true; save(); render(); toast('Selamat menikmati!'); } break; }
    case 'again': { const o = S.orders.find(x => x.id === t.dataset.id); o.lines.forEach(l => { if (!byId[l.itemId].soldOut) addLine({ ...l }); }); render(); toast('Item ditambahkan ke keranjang'); break; }
    case 'notif': S.notif = !S.notif; save(); render(); break;
    case 'reset': if (confirm('Hapus keranjang, riwayat pesanan, dan semua data contoh?')) { const n = S.name; S = { ...seed(), cart: [], orders: [], seq: 1, name: n }; save(); render(); toast('Data dihapus'); } break;
  }
});
document.addEventListener('input', (e) => {
  const b = e.target.dataset.bind; if (!b) return;
  if (b === 'sheet-note') { sheet.note = e.target.value; return; }
  S[b] = e.target.value; save();
  if (errors[b] && e.target.value.trim()) { delete errors[b]; e.target.removeAttribute('aria-invalid'); e.target.parentElement.querySelector('.err')?.remove(); }
});
document.addEventListener('change', (e) => { if (e.target.dataset.bind === 'name') renderChrome(); });
document.addEventListener('keydown', (e) => {
  if (!sheet) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...document.querySelectorAll('.sheet button:not([disabled]), .sheet textarea')];
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});
mq.addEventListener('change', render);

/* Live status: re-render when the active order crosses a step */
let lastSt = null;
setInterval(() => {
  const o = activeOrder(), st = o ? orderStatus(o) : null;
  if (st !== lastSt) { lastSt = st; const ae = document.activeElement; if (!sheet && !(ae && ae.matches('input, textarea'))) render(); }
}, 5000);
lastSt = activeOrder() ? orderStatus(activeOrder()) : null;
render();
</script>
</body>
</html>
