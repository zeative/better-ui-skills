<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EC">
<title>Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — stone canvas, deep green-black controls, lime highlights. */
:root {
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #F1F0EC; --surface: #FFFFFF; --surface-2: #F7F6F2; --line: rgba(31,42,36,.09); --line-2: rgba(31,42,36,.14);
  --text: #17201B; --text-2: #5C645E; --text-3: #8A918B;
  --ink: #1F2A24; --night: #141A16; --lime: #C6F432; --lime-ink: #1A2410; --lime-tint: #EEF9CF;
  --on-dark: #FFFFFF; --on-dark-2: rgba(255,255,255,.68);
  --ok: #15803D; --bad: #C2410C;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(31,42,36,.05), 0 1px 1px rgba(31,42,36,.03);
  --sh-2: 0 1px 2px rgba(31,42,36,.05), 0 8px 24px -12px rgba(31,42,36,.14);
  --sh-float: 0 12px 32px -8px rgba(20,26,22,.30);
  --tab-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.dark :focus-visible, .np :focus-visible, .mini :focus-visible { outline-color: var(--lime); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.fill { fill: currentColor; stroke: none; }

/* ---------- Shell ---------- */
.shell { min-height: 100dvh; }
.side, .panel { display: none; }
.main { padding: calc(12px + var(--safe-t)) 16px calc(var(--tab-h) + 96px + var(--safe-b)); max-width: 760px; margin: 0 auto; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.top .avatar { margin-left: auto; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #DCE8C8; overflow: hidden; border: 2px solid var(--surface); box-shadow: var(--sh-1); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.avatar img { width: 100%; height: 100%; }
.page-title { font-size: 24px; font-weight: 700; margin: 16px 0 4px; }
.page-sub { color: var(--text-2); font-size: 14px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text); transition: background-color .15s, transform .15s; }
.icon-btn:hover { background: rgba(31,42,36,.06); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.on { color: var(--ink); }
.icon-btn.raised { background: var(--surface); box-shadow: var(--sh-1); }

/* ---------- Chips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 16px -16px 0; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 40px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s, color .15s; }
.chip:hover { border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .count { font-weight: 500; opacity: .7; }

/* ---------- Week card (signature) ---------- */
.week { margin-top: 16px; background: var(--ink); color: var(--on-dark); border-radius: var(--r-lg); padding: 20px; position: relative; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 18px 40px -20px rgba(20,26,22,.55); }
.week-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.week-label { font-size: 13px; color: var(--on-dark-2); font-weight: 500; }
.week-fig { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; }
.week-fig small { font-size: 18px; font-weight: 600; color: var(--on-dark-2); margin: 0 6px 0 2px; }
.delta { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; background: rgba(198,244,50,.16); color: var(--lime); white-space: nowrap; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 104px; margin-top: 14px; max-width: 420px; }
.bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; position: relative; }
.bar { width: 100%; max-width: 30px; border-radius: 12px; background: rgba(255,255,255,.14); min-height: 10px; }
.bar.today { background: var(--lime); }
.bar-day { font-size: 12px; color: var(--on-dark-2); font-weight: 600; }
.bar-col.is-today .bar-day { color: #fff; }
.bar-tip { position: absolute; left: 50%; transform: translateX(-50%); background: #fff; color: var(--ink); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
.week-foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.10); }
.week-foot img { width: 40px; height: 40px; border-radius: 12px; }
.week-foot .t { font-size: 14px; font-weight: 600; }
.week-foot .s { font-size: 13px; color: var(--on-dark-2); }

/* ---------- Sections ---------- */
.sec { margin-top: 28px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
.sec-head h2 { font-size: 18px; font-weight: 700; }
.link-btn { font-size: 14px; font-weight: 600; color: var(--text-2); height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; }
.link-btn:hover { color: var(--text); }

/* Recent scroller */
.scroller { display: grid; grid-auto-flow: column; grid-auto-columns: 144px; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin: 0 -16px; padding: 0 16px 6px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.tile { scroll-snap-align: start; text-align: left; display: block; border-radius: var(--r-md); }
.lib-top { display: flex; flex-direction: column; }
.lib-top .jb { order: -1; margin-top: 20px; }
.lib-top .wk-top { display: none; }
.wk-bottom .week { margin-top: 0; }
.tile .cov-wrap { position: relative; }
.tile .cov { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--sh-2); position: relative; transition: transform .2s ease-out; }
.tile:hover .cov { transform: translateY(-2px); }
.tile .t { font-size: 14px; font-weight: 600; margin-top: 10px; line-height: 1.3; }
.tile .s { font-size: 13px; color: var(--text-2); }
.tile .play-fab { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; box-shadow: 0 6px 14px -4px rgba(0,0,0,.35); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
.tile:hover .play-fab, .tile:focus-within .play-fab, .tile .play-fab.show { opacity: 1; transform: none; }

/* Covers */
.cov { background: var(--surface-2); flex: none; }
.cov img { width: 100%; height: 100%; object-fit: cover; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; }
.mosaic img { width: 100%; height: 100%; }
.cov-liked { width: 100%; height: 100%; display: grid; place-items: center; container-type: inline-size; background: linear-gradient(140deg, #2B3A31, var(--ink)); color: var(--lime); }
.cov-liked .ic { width: 42cqw; height: 42cqw; fill: currentColor; stroke: none; }
.cov-empty { width: 100%; height: 100%; display: grid; place-items: center; background: #E6E4DD; color: var(--text-2); }

/* Card list */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); border: 1px solid var(--line); }
.list { padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r-md); min-height: 64px; width: 100%; text-align: left; position: relative; transition: background-color .15s; }
.row:hover { background: var(--surface-2); }
.row .cov { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; }
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 16px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 6px; }
.row-s { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; margin-top: 2px; white-space: nowrap; }
.row-s .dot { flex: none; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.tag-dl { color: var(--ok); display: inline-flex; }
.tag-pin { color: var(--ink); display: inline-flex; }
.row + .row::before { content: ""; position: absolute; left: 72px; right: 8px; top: 0; border-top: 1px solid var(--line); }
.row:hover::before, .row:hover + .row::before { opacity: 0; }
.chev { color: var(--text-3); }

.new-row .cov { display: grid; place-items: center; background: var(--lime-tint); color: var(--lime-ink); border: 1px dashed rgba(31,42,36,.25); }

/* ---------- Tracks ---------- */
.tracks { padding: 6px; }
.trk { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 12px; padding: 6px 4px 6px 8px; border-radius: var(--r-sm); min-height: 60px; position: relative; transition: background-color .15s; }
.trk:hover { background: var(--surface-2); }
.trk-hit { position: absolute; inset: 0; border-radius: inherit; z-index: 0; }
.trk > *:not(.trk-hit) { position: relative; z-index: 1; pointer-events: none; }
.trk .icon-btn, .trk .like { pointer-events: auto; }
.trk .cov { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; }
.trk-t { font-size: 15px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 8px; min-width: 0; }
.trk-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trk-s { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk-alb, .trk-num { display: none; }
.trk-d { font-size: 13px; color: var(--text-2); display: none; }
.trk.playing .trk-t { color: #3F6212; }
.trk.playing { background: color-mix(in srgb, var(--lime) 12%, var(--surface)); }
.trk .icon-btn { width: 40px; height: 40px; color: var(--text-2); }
.like.is-on { color: var(--ink); }
.like.is-on .ic { fill: currentColor; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
.eq i { width: 3px; background: #65A30D; border-radius: 2px; height: 40%; }
.eq.anim i { animation: eq 0.9s ease-in-out infinite; }
.eq.anim i:nth-child(2) { animation-delay: -.3s; } .eq.anim i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%,100% { height: 30%; } 50% { height: 100%; } }

/* ---------- Playlist header ---------- */
.pl-head { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
.pl-cover { width: min(232px, 62vw); aspect-ratio: 1; border-radius: var(--r-lg); overflow: hidden; align-self: center; box-shadow: 0 2px 4px rgba(31,42,36,.06), 0 24px 48px -16px rgba(31,42,36,.35); }
.pl-kind { font-size: 13px; font-weight: 600; color: var(--text-2); }
.pl-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; }
.pl-desc { color: var(--text-2); font-size: 14px; margin-top: 6px; max-width: 52ch; }
.pl-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-top: 10px; flex-wrap: wrap; }
.pl-meta .mini-av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: #DCE8C8; }
.pl-meta b { color: var(--text); font-weight: 600; }
.pl-actions { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.pl-actions .sp { flex: 1; }
.btn-play { width: 56px; height: 56px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(20,26,22,.2), 0 6px 14px -8px rgba(31,42,36,.5); transition: transform .15s; }
.btn-play:hover { transform: scale(1.04); }
.btn-play:active { transform: scale(.96); }
.btn-play .ic { width: 24px; height: 24px; }
.dl-on { color: var(--ok) !important; }

/* Empty state */
.empty { text-align: center; padding: 40px 24px; }
.empty .art { width: 120px; margin: 0 auto 16px; }
.empty h3 { font-size: 18px; font-weight: 700; }
.empty p { color: var(--text-2); font-size: 14px; margin: 6px auto 18px; max-width: 32ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: var(--r-full); background: var(--ink); color: #fff; font-weight: 600; font-size: 15px; transition: transform .15s, background-color .15s; }
.btn:hover { background: #2B3A31; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line-2); }
.btn.lime { background: var(--lime); color: var(--lime-ink); }
.btn.block { width: 100%; }

/* ---------- Search ---------- */
.search-field { position: relative; margin-top: 16px; }
.search-field .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
.search-field input { width: 100%; height: 52px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 0 44px 0 46px; font-size: 16px; box-shadow: var(--sh-1); outline: none; transition: border-color .15s, box-shadow .15s; }
.search-field input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search-field input::placeholder { color: var(--text-3); }
.search-field input:focus { border-color: rgba(31,42,36,.4); box-shadow: 0 0 0 4px rgba(198,244,50,.45); }
.search-field .clear { position: absolute; right: 4px; top: 4px; }
.genres { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.genre { height: 96px; border-radius: var(--r-md); padding: 14px; text-align: left; position: relative; overflow: hidden; background: var(--g-bg); color: var(--g-ink); font-weight: 700; font-size: 16px; transition: transform .15s; }
.genre:hover { transform: translateY(-2px); }
.genre img { position: absolute; right: -14px; bottom: -12px; width: 72px; height: 72px; border-radius: 12px; transform: rotate(18deg); box-shadow: 0 8px 18px -6px rgba(0,0,0,.35); }
.genre .n { display: block; font-size: 13px; font-weight: 500; opacity: .75; margin-top: 2px; }

/* ---------- Queue ---------- */
.q-now { display: flex; align-items: center; gap: 14px; padding: 14px; }
.q-now .cov { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; }
.q-label { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: center; }
.q-label b { color: var(--text); }
.qrow { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center; padding: 6px 4px 6px 8px; border-radius: var(--r-sm); min-height: 60px; background: var(--surface); position: relative; transition: background-color .15s, box-shadow .15s; }
.qrow .cov { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; }
.qrow:hover { background: var(--surface-2); }
.qrow.dragging { box-shadow: var(--sh-float); z-index: 3; background: var(--surface); }
.qrow .icon-btn { width: 40px; height: 40px; color: var(--text-2); }
.grip { cursor: grab; touch-action: none; }
.grip:active { cursor: grabbing; }
.q-hit { position: absolute; inset: 0; border-radius: inherit; }
.qrow > *:not(.q-hit) { position: relative; pointer-events: none; }
.qrow .icon-btn { pointer-events: auto; }
.q-count { font-size: 12px; font-weight: 600; background: var(--lime-tint); color: #3F6212; padding: 2px 8px; border-radius: var(--r-full); margin-left: 6px; }

/* ---------- Mini player ---------- */
.mini { position: fixed; left: 8px; right: 8px; bottom: calc(var(--tab-h) + 8px + var(--safe-b)); z-index: 32; background: var(--ink); color: #fff; border-radius: 16px; padding: 8px 8px 8px 8px; display: flex; align-items: center; gap: 12px; box-shadow: var(--sh-float); overflow: hidden; max-width: 744px; margin: 0 auto; }
.mini .hit { position: absolute; inset: 0; }
.mini > *:not(.hit) { position: relative; }
.mini .cov { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; pointer-events: none; }
.mini .meta { flex: 1; min-width: 0; pointer-events: none; }
.mini .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .s { font-size: 13px; color: var(--on-dark-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .icon-btn { color: #fff; }
.mini .icon-btn:hover { background: rgba(255,255,255,.08); }
.mini .like.is-on { color: var(--lime); }
.mini .prog { position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; background: rgba(255,255,255,.14); border-radius: 2px; pointer-events: none; }
.mini .prog i { display: block; height: 100%; background: var(--lime); border-radius: 2px; width: 0; }

/* ---------- Tab bar ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); display: flex; justify-content: space-around; }
.tabs::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 96px; background: linear-gradient(to top, var(--canvas) 30%, rgba(241,240,236,0)); pointer-events: none; }
.tab { flex: 1; max-width: 160px; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--text-2); position: relative; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] .tab-ic { background: var(--lime); color: var(--lime-ink); }
.tab-ic { width: 52px; height: 30px; border-radius: var(--r-full); display: grid; place-items: center; transition: background-color .2s; }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 12px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--surface); }

/* ---------- Now playing (mobile overlay) ---------- */
.np { position: fixed; inset: 0; z-index: 50; color: #fff; display: flex; flex-direction: column; padding: calc(8px + var(--safe-t)) 20px calc(20px + var(--safe-b));
  background: linear-gradient(180deg, color-mix(in srgb, var(--np-c, #2B3A31) 55%, var(--night)) 0%, color-mix(in srgb, var(--np-c, #2B3A31) 14%, var(--night)) 60%, var(--night) 100%);
  transform: translateY(100%); visibility: hidden; transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s .38s; overflow-y: auto; }
.np.open { transform: none; visibility: visible; transition: transform .38s cubic-bezier(.2,.8,.2,1); }
.np-top { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.np-top .icon-btn { color: #fff; }
.np-top .icon-btn:hover { background: rgba(255,255,255,.08); }
.np-from { text-align: center; min-width: 0; }
.np-from .k { font-size: 12px; color: var(--on-dark-2); font-weight: 500; }
.np-from .v { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; width: 100%; max-width: 440px; margin: 0 auto; }
.np-art { width: min(100%, 44vh, 400px); aspect-ratio: 1; border-radius: 24px; overflow: hidden; margin: 8px auto 0; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); transition: transform .3s ease-out; }
.np-art img { width: 100%; height: 100%; }
.np-art.paused { transform: scale(.94); }
.np-title-row { display: flex; align-items: center; gap: 12px; }
.np-title-row > div { flex: 1; min-width: 0; }
.np-t { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-a { font-size: 16px; color: var(--on-dark-2); margin-top: 2px; }
.np .like { color: #fff; }
.np .like.is-on, .panel .like.is-on { color: var(--lime); }
.np .icon-btn:hover { background: rgba(255,255,255,.08); }

/* Range sliders */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: pointer; --p: 0%; }
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fill, #fff) var(--p), var(--track, rgba(255,255,255,.2)) var(--p)); }
.range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fill, #fff) var(--p), var(--track, rgba(255,255,255,.2)) var(--p)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--thumb, #fff); margin-top: -5px; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.range::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--thumb, #fff); }
.range:hover::-webkit-slider-thumb, .range:active::-webkit-slider-thumb { transform: scale(1.2); }
.range:focus-visible { outline-offset: 4px; }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-dark-2); margin-top: 4px; font-weight: 500; }
.controls { display: flex; align-items: center; justify-content: space-between; }
.controls .icon-btn { color: #fff; width: 48px; height: 48px; }
.controls .icon-btn .ic { width: 26px; height: 26px; }
.controls .mode { color: var(--on-dark-2); position: relative; }
.controls .mode.on { color: var(--lime); }
.controls .mode.on::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--lime); }
.big-play { width: 72px; height: 72px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; box-shadow: 0 8px 20px -10px rgba(0,0,0,.5); transition: transform .15s; }
.big-play:hover { transform: scale(1.04); }
.big-play:active { transform: scale(.95); }
.big-play .ic { width: 30px; height: 30px; }
.np-foot { display: flex; align-items: center; gap: 10px; }
.np-foot .range { flex: 1; }
.np-foot .icon-btn { color: var(--on-dark-2); }
.np-foot .icon-btn:hover { color: #fff; }
.np-next { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border-radius: 16px; padding: 10px 12px; text-align: left; width: 100%; transition: background-color .15s; }
.np-next:hover { background: rgba(255,255,255,.11); }
.np-next .cov { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; }
.np-next .k { font-size: 12px; color: var(--on-dark-2); font-weight: 500; }
.np-next .v { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-next > div { flex: 1; min-width: 0; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(15,20,17,.45); opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 12px calc(24px + var(--safe-b)); transform: translateY(100%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; max-width: 520px; margin: 0 auto; max-height: 85dvh; overflow-y: auto; color: var(--text); }
.sheet.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 4px 10px 14px; border-bottom: 1px solid var(--line); margin: 0 0 6px; }
.sheet-head .cov { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; }
.sheet-head .t { font-weight: 700; font-size: 16px; }
.sheet-head .s { font-size: 13px; color: var(--text-2); }
.sheet h2 { font-size: 20px; font-weight: 700; padding: 4px 8px 4px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 10px; border-radius: 12px; font-size: 15px; font-weight: 600; text-align: left; transition: background-color .15s; }
.opt:hover { background: var(--surface-2); }
.opt .ic { color: var(--text-2); }
.opt.danger { color: var(--bad); }
.opt.danger .ic { color: var(--bad); }
.opt .cov { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; }
.opt .s { font-size: 13px; color: var(--text-2); font-weight: 500; }
.field { padding: 8px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 6px; }
.field input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 14px; font-size: 16px; outline: none; }
.field input:focus { border-color: rgba(31,42,36,.45); box-shadow: 0 0 0 4px rgba(198,244,50,.45); background: #fff; }
.field .err { color: var(--bad); font-size: 13px; margin-top: 6px; min-height: 0; }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 8px 12px; }
.profile { display: flex; align-items: center; gap: 14px; padding: 8px 8px 16px; }
.profile .avatar { width: 56px; height: 56px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 8px 12px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--text-2); font-weight: 500; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 84px + var(--safe-b)); z-index: 70; transform: translate(-50%, 12px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--sh-float); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { color: var(--lime); }

/* ---------- Tablet ---------- */
@media (min-width: 640px) {
  .tabs { justify-content: center; }
  .tab { max-width: 140px; }
  .mini { max-width: 600px; }
  .week { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; align-items: end; }
  .week-foot { grid-column: 1; margin-top: 12px; }
  .bars { grid-column: 2; grid-row: 1 / span 2; margin-top: 0; max-width: none; }
  .main { padding-left: 24px; padding-right: 24px; }
  .chips, .scroller { margin-left: -24px; margin-right: -24px; padding-left: 24px; padding-right: 24px; }
  .scroller { grid-auto-columns: 168px; }
  .genres { grid-template-columns: repeat(3, 1fr); }
  .pl-head { flex-direction: row; align-items: flex-end; gap: 24px; }
  .pl-cover { width: 200px; align-self: auto; }
  .lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .lib-grid .row + .row::before { display: none; }
}

/* ---------- Desktop ---------- */
@media (min-width: 1024px) {
  body { background: var(--canvas); }
  .shell { display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px; height: 100dvh; overflow: hidden; }
  .tabs, .mini, .np { display: none !important; }
  .side { display: flex; flex-direction: column; padding: 20px 16px 16px; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; }
  .main { max-width: none; width: 100%; margin: 0; padding: 20px 32px 48px; overflow-y: auto; }
  .main-inner { max-width: 980px; margin: 0 auto; }
  .chips, .scroller { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .top .brand { display: none; }
  .page-title { margin-top: 4px; font-size: 32px; }
  .lib-top { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; margin-top: 20px; }
  .lib-top .jb { order: 0; margin-top: 0; }
  .lib-top .wk-top { display: block; margin-top: 0; }
  .wk-bottom { display: none; }
  .lib-top .week { margin-top: 0; display: block; }
  .lib-top .bars { height: 112px; margin-top: 14px; max-width: none; }
  .lib-top .sec { margin-top: 0; min-width: 0; }
  .scroller { grid-auto-flow: row; grid-template-columns: 1fr 1fr; grid-auto-columns: auto; overflow: visible; gap: 12px; }
  .scroller .tile { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-content: center; align-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); border-radius: var(--r-md); padding: 8px; transition: box-shadow .2s; }
  .scroller .tile:hover { box-shadow: var(--sh-2); }
  .scroller .tile .cov-wrap { grid-row: 1 / span 2; width: 52px; }
  .scroller .tile .cov { border-radius: 10px; box-shadow: none; }
  .scroller .tile:hover .cov { transform: none; }
  .scroller .tile .t { margin: 0; align-self: end; white-space: nowrap; }
  .scroller .tile .s { white-space: nowrap; }
  .scroller .tile .s { align-self: start; }
  .scroller .tile .play-fab { width: 32px; height: 32px; right: auto; left: 10px; bottom: 10px; }
  .lib-top .bars { height: 92px !important; }
  .lib-grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; padding: 0; background: none; border: 0; box-shadow: none; }
  .lib-grid .row { flex-direction: column; align-items: stretch; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); border-radius: var(--r-md); padding: 12px; min-height: 0; gap: 10px; transition: transform .2s, box-shadow .2s; }
  .lib-grid .row:hover { transform: translateY(-2px); box-shadow: var(--sh-2); background: var(--surface); }
  .lib-grid .row .cov { width: 100%; height: auto; aspect-ratio: 1; border-radius: 12px; }
  .lib-grid .row .chev { display: none; }
  .lib-grid .kind { display: none; }
  .genres { grid-template-columns: repeat(4, 1fr); }
  .genre { height: 120px; }
  .genre img { width: 88px; height: 88px; }
  /* tracks table */
  .trk { grid-template-columns: 28px 44px minmax(0, 1.4fr) minmax(0, 1fr) 40px 52px 40px; }
  .trk-num { display: block; text-align: center; font-size: 14px; color: var(--text-2); }
  .trk-alb { display: block; font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk-d { text-align: right; display: block; }
  .trk-head { display: grid !important; grid-template-columns: 28px 44px minmax(0, 1.4fr) minmax(0, 1fr) 40px 52px 40px; gap: 12px; padding: 8px 4px 10px 8px; font-size: 12px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--line); margin: 0 6px 4px; }
  .pl-cover { width: 220px; }
  .m-eq { display: none !important; }
  .pl-title { font-size: 40px; }
  .q-wrap { max-width: 760px; }

  .panel > * { flex: none; }
  .panel { scrollbar-gutter: stable; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-left: 1px solid var(--line); overflow-y: auto; background: var(--canvas); }
  .np-card { background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 18px; box-shadow: 0 20px 44px -22px rgba(20,26,22,.6); position: relative; overflow: hidden; }

  .np-card .np-top { min-height: 0; margin-bottom: 14px; }
  .np-card .np-from { text-align: left; }

  .np-card .np-art.paused { transform: none; }
  .np-card .np-t { font-size: 20px; }
  .np-card .np-a { font-size: 14px; }
  .np-card .controls { margin-top: 10px; }
  .np-card .big-play { width: 60px; height: 60px; }
  .np-card .big-play .ic { width: 26px; height: 26px; }
  .np-card .controls .icon-btn { width: 44px; height: 44px; }
  .np-card .controls .icon-btn .ic { width: 22px; height: 22px; }
  .np-card .np-foot { margin-top: 12px; }
  .np-card .icon-btn { color: #fff; }
  .np-card .icon-btn:hover { background: rgba(255,255,255,.08); }
  .np-card .np-foot .icon-btn, .np-card .controls .mode { color: var(--on-dark-2); }
  .np-card .controls .mode.on { color: var(--lime); }
  .np-card .like.is-on { color: var(--lime); }
  .up-next .sec-head { margin-bottom: 4px; padding: 0 4px; }
  .up-next .sec-head h2 { font-size: 16px; }
  .up-next .q-label { margin: 8px 4px 8px; }
  .up-next .q-label ~ .q-label { margin-top: 16px; }
  .toast { bottom: 28px; }
  .sheet { bottom: auto; top: 50%; left: 50%; right: auto; width: 440px; border-radius: 24px; transform: translate(-50%, -46%); opacity: 0; transition: transform .2s, opacity .2s, visibility 0s .2s; }
  .sheet.open { transform: translate(-50%, -50%); opacity: 1; transition: transform .2s, opacity .2s; }
  .sheet .grab { display: none; }
}
.trk-head { display: none; }

/* Sidebar */
.side .brand { padding: 4px 10px 20px; }
.nav { display: grid; gap: 2px; }
.nav a, .nav button { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--text-2); text-decoration: none; width: 100%; transition: background-color .15s, color .15s; }
.nav a:hover, .nav button:hover { background: rgba(31,42,36,.05); color: var(--text); }
.nav [aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
.nav [aria-current="page"] .ic { color: var(--text); }
.nav .cnt { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--ink); color: #fff; padding: 1px 8px; border-radius: 999px; }
.side-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 24px 12px 8px; display: flex; justify-content: space-between; align-items: center; }
.side-label button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.side-label button:hover { background: rgba(31,42,36,.06); color: var(--text); }
.side-pl { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; width: 100%; text-align: left; transition: background-color .15s; }
.side-pl:hover { background: rgba(31,42,36,.05); }
.side-pl[aria-current="page"] { background: var(--surface); box-shadow: var(--sh-1); }
.side-pl .cov { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; }
.side-pl .t { font-size: 14px; font-weight: 600; line-height: 1.25; }
.side-pl .s { font-size: 12px; color: var(--text-2); }
.side-pl > div { min-width: 0; flex: 1; }
.side-pl .eq { margin-left: auto; }
.side-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--surface); box-shadow: var(--sh-1); border: 1px solid var(--line); width: 100%; text-align: left; }
.side-user .avatar { width: 36px; height: 36px; border: 0; box-shadow: none; }
.side-user .t { font-size: 14px; font-weight: 600; }
.side-user .s { font-size: 12px; color: var(--text-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

/* ===================== Audio (synthesised preview) ===================== */
/* Each track gets its own key, tempo and arpeggio pattern so playback is audible without media files. */
const Audio_ = (() => {
  let ac, master, timer, nextT = 0, step = 0, seedTrack = null, cfg;
  const SCALES = { maj: [0,2,4,5,7,9,11], min: [0,2,3,5,7,8,10] };
  const PROG = { maj: [0,5,3,4], min: [0,5,2,6] };
  function rng(seed) { let x = seed * 9301 + 49297; return () => ((x = (x * 9301 + 49297) % 233280) / 233280); }
  function config(t) {
    const r = rng(t.n + 7);
    const scale = r() > .45 ? 'maj' : 'min';
    const genre = ALBUMS[t.a].genre;
    const bpm = { Synthwave: 108, Electronic: 118, Pop: 112, Indie: 100, Soul: 92, Acoustic: 88, Jazz: 84, Ambient: 70 }[genre] + Math.floor(r() * 10);
    const root = 50 + Math.floor(r() * 9);
    const pat = Array.from({ length: 8 }, () => Math.floor(r() * 5));
    const wave = { Electronic: 'sawtooth', Pop: 'square', Ambient: 'sine' }[genre] || 'triangle';
    return { scale, bpm, root, pat, wave };
  }
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(f, t, dur, type, gain) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function chordNote(deg, idx) {
    const sc = SCALES[cfg.scale]; const d = deg + idx * 2;
    return cfg.root + 12 + sc[d % 7] + 12 * Math.floor(d / 7);
  }
  function tick() {
    const spb = 60 / cfg.bpm / 2;
    while (nextT < ac.currentTime + 0.12) {
      const bar = Math.floor(step / 8) % 4, s = step % 8;
      const deg = PROG[cfg.scale][bar];
      const pi = cfg.pat[s];
      const lvl = cfg.wave === 'sawtooth' || cfg.wave === 'square' ? 0.05 : 0.11;
      tone(freq(chordNote(deg, pi % 3) + (pi > 2 ? 12 : 0)), nextT, spb * 1.6, cfg.wave, lvl);
      if (s === 0 || s === 4) tone(freq(cfg.root - 12 + SCALES[cfg.scale][deg]), nextT, spb * 3.6, 'sine', 0.16);
      nextT += spb; step++;
    }
  }
  return {
    start(t) {
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
          master = ac.createGain(); master.connect(lp); lp.connect(ac.destination);
        }
        if (ac.state === 'suspended') ac.resume();
        this.volume();
        if (seedTrack !== t.id) { cfg = config(t); seedTrack = t.id; step = 0; }
        nextT = ac.currentTime + 0.05;
        clearInterval(timer); timer = setInterval(tick, 25); tick();
      } catch (e) {}
    },
    stop() { clearInterval(timer); timer = null; },
    volume() { if (master) master.gain.setTargetAtTime(S.muted ? 0 : S.vol * 0.6, ac.currentTime, 0.03); },
  };
})();

function playContext(pid, tid, { shuffle } = {}) {
  const p = PL(pid); const base = plTracks(p).slice();
  if (!base.length) return;
  if (shuffle !== undefined) S.shuffle = shuffle;
  const start = tid || (S.shuffle ? base[Math.floor(Math.random() * base.length)] : base[0]);
  const list = S.shuffle ? [start, ...shuffleArr(base.filter(t => t !== start))] : base;
  S.ctx = { pid, base, list, i: list.indexOf(start) };
  S.recent = [pid, ...S.recent.filter(x => x !== pid)].slice(0, 6);

function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function next(auto = false) {

  if (c.i + 1 < c.list.length) { c.i++; setTrack(c.list[c.i]); return; }
  if (S.repeat === 'all' || !auto) { c.i = 0; setTrack(c.list[0]); return; }

  const playing = S.ctx.pid === p.id && S.playing;
  return `<button class="row" data-act="open-pl" data-pid="${p.id}">
    <span class="cov">${plCover(p)}</span>
    <span class="row-main">
      <span class="row-t">${esc(p.name)}${playing ? eqHTML() : ''}</span>
      <span class="row-s">${pin ? `<span class="tag-pin" title="Pinned">${ic('pin', 'sm')}</span>` : ''}${dl ? `<span class="tag-dl" title="Downloaded">${ic('dl', 'sm')}</span>` : ''}<span class="kind">${p.kind === 'mix' ? 'Made for you' : 'Playlist'}</span><span class="dot kind"></span>${songs(n)}</span>
    </span>
    <span class="chev">${ic('right', 'sm')}</span>
  </button>`;
}

function viewLibrary() {
  const f = S.filter;
  const all = S.playlists;
  const list = all.filter(p => f === 'all' || (f === 'mix' && p.kind === 'mix') || (f === 'own' && p.kind !== 'mix') || (f === 'dl' && S.downloaded.includes(p.id)));
  const sorted = [...list].sort((a, b) => (S.pinned.includes(b.id) - S.pinned.includes(a.id)));
  const cnt = { all: all.length, own: all.filter(p => p.kind !== 'mix').length, mix: all.filter(p => p.kind === 'mix').length, dl: S.downloaded.length };
  const chip = (k, l) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${f === k}">${l}<span class="count num">${cnt[k]}</span></button>`;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  return `<div class="main-inner">
    ${header(`${greet}, Sam`, '')}
    <div class="lib-top">
      <div class="wk-slot wk-top">${weekCard()}</div>
      <section class="sec jb">
        <div class="sec-head"><h2>Jump back in</h2></div>
        <div class="scroller">
          ${S.recent.map(PL).filter(Boolean).map(p => { const live = S.ctx.pid === p.id && S.playing; return `<div class="tile">
            <div class="cov-wrap"><button class="cov" data-act="open-pl" data-pid="${p.id}" aria-label="Open ${esc(p.name)}">${plCover(p)}</button>
            <button class="play-fab ${live ? 'show' : ''}" data-act="${S.ctx.pid === p.id ? 'toggle' : 'play-pl'}" data-pid="${p.id}" aria-label="${live ? 'Pause' : 'Play'} ${esc(p.name)}">${ic(live ? 'pause' : 'play', 'sm')}</button></div>
            <div class="t">${esc(p.name)}</div><div class="s">${p.kind === 'mix' ? 'Made for you' : songs(plTracks(p).length)}</div>
          </div>`; }).join('')}
        </div>
      </section>
    </div>
    <section class="sec">
      <div class="sec-head"><h2>Your library</h2><button class="link-btn" data-act="new-pl">${ic('plus', 'sm')}New playlist</button></div>
      <div class="chips" role="group" aria-label="Filter">${chip('all', 'All')}${chip('own', 'Playlists')}${chip('mix', 'Made for you')}${chip('dl', 'Downloaded')}</div>
      <div style="height:12px"></div>
      ${sorted.length ? `<div class="card list lib-grid">${sorted.map(plRow).join('')}</div>` :
        `<div class="card empty">${emptyArt()}<h3>Nothing downloaded yet</h3><p>Download a playlist to listen without a connection.</p></div>`}
    </section>
    <section class="sec wk-bottom">${weekCard()}</section>
  </div>`;
}

function trackRow(tid, i, pid) {
  const t = TR[tid], a = ALBUMS[t.a], on = S.trackId === tid && (!pid || S.ctx.pid === pid);
  return `<div class="trk ${on ? 'playing' : ''}">
    <button class="trk-hit" data-act="play-track" data-pid="${pid || ''}" data-id="${tid}" aria-label="Play ${esc(t.title)} by ${esc(a.artist)}"></button>
    <span class="trk-num num">${on ? eqHTML() : i + 1}</span>
    <span class="cov">${trackImg(tid)}</span>
    <span style="min-width:0"><span class="trk-t">${on ? `<span style="flex:none;display:inline-flex" class="m-eq">${eqHTML()}</span>` : ''}<span>${esc(t.title)}</span></span><span class="trk-s" style="display:block">${esc(a.artist)}</span></span>
    <span class="trk-alb">${esc(a.title)}</span>
    <button class="icon-btn like ${isLiked(tid) ? 'is-on' : ''} trk-like" data-act="like" data-id="${tid}" aria-label="${isLiked(tid) ? 'Remove from' : 'Save to'} Liked Songs" aria-pressed="${isLiked(tid)}">${ic('heart', 'sm')}</button>
    <span class="trk-d num">${fmt(t.d)}</span>
    <button class="icon-btn" data-act="track-more" data-id="${tid}" data-pid="${pid || ''}" aria-label="More options for ${esc(t.title)}">${ic('more')}</button>
  </div>`;
}

function viewPlaylist() {
  const p = PL(S.viewPid); if (!p) { S.view = 'library'; return viewLibrary(); }
  const tr = plTracks(p); const isCtx = S.ctx.pid === p.id;
  const dl = S.downloaded.includes(p.id);
  return `<div class="main-inner">
    ${header('', '', { back: true })}
    <div class="pl-head">
      <div class="pl-cover">${plCover(p)}</div>
      <div>
        <div class="pl-kind">${p.kind === 'mix' ? 'Made for you' : 'Playlist'}</div>
        <h1 class="pl-title">${esc(p.name)}</h1>
        ${p.desc ? `<p class="pl-desc">${esc(p.desc)}</p>` : ''}
        <div class="pl-meta"><span class="mini-av">${p.kind === 'mix' ? `<span class="brand-mark" style="width:22px;height:22px;border-radius:50%">${brandGlyph()}</span>` : `<img src="${AVATAR}" alt="" width="22" height="22">`}</span><b>${p.kind === 'mix' ? 'Tempo' : 'Sam Rivera'}</b><span class="dot" style="width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6"></span><span class="num">${songs(tr.length)}, ${fmtLong(plDur(p))}</span></div>
      </div>
    </div>
    <div class="pl-actions">
      <button class="icon-btn ${dl ? 'dl-on' : ''}" data-act="download" data-pid="${p.id}" aria-pressed="${dl}" aria-label="${dl ? 'Remove download' : 'Download'}">${ic('dl')}</button>
      ${p.kind !== 'liked' ? `<button class="icon-btn" data-act="pin" data-pid="${p.id}" aria-pressed="${S.pinned.includes(p.id)}" aria-label="${S.pinned.includes(p.id) ? 'Unpin' : 'Pin'} playlist" style="${S.pinned.includes(p.id) ? 'color:#4D7C0F' : ''}">${ic('pin')}</button>` : ''}
      <button class="icon-btn" data-act="pl-more" data-pid="${p.id}" aria-label="More options">${ic('more')}</button>
      <span class="sp"></span>
      <button class="icon-btn" data-act="play-pl" data-pid="${p.id}" data-shuffle="1" aria-label="Shuffle play" style="${isCtx && S.shuffle ? 'color:#4D7C0F' : ''}" ${tr.length ? '' : 'disabled'}>${ic('shuffle')}</button>
      <button class="btn-play" data-act="${isCtx ? 'toggle' : 'play-pl'}" data-pid="${p.id}" aria-label="${isCtx && S.playing ? 'Pause' : 'Play'} ${esc(p.name)}" ${tr.length ? '' : 'disabled'}>${ic(isCtx && S.playing ? 'pause' : 'play')}</button>
    </div>
    <div style="height:12px"></div>
    ${tr.length ? `<div class="card tracks">
      <div class="trk-head"><span style="text-align:center">#</span><span></span><span>Title</span><span>Album</span><span></span><span style="display:flex;justify-content:flex-end">${ic('clock', 'sm')}</span><span></span></div>
      ${tr.map((t, i) => trackRow(t, i, p.id)).join('')}</div>` :
      `<div class="card empty">${emptyArt()}<h3>${p.kind === 'liked' ? 'Songs you like will appear here' : 'Add songs to this playlist'}</h3><p>${p.kind === 'liked' ? 'Tap the heart on any song to save it.' : 'Search for songs and use “Add to playlist” from the song menu.'}</p><button class="btn" data-act="nav" data-view="search">${ic('search', 'sm')}Find songs</button></div>`}
  </div>`;
}

function viewSearch() {
  return `<div class="main-inner">
    ${header('Search', '')}
    <div class="search-field">${ic('search')}
      <label for="q" class="sr">Search songs, artists and playlists</label>
      <input id="q" type="search" autocomplete="off" placeholder="Songs, artists or playlists" value="${esc(S.query)}">
      <button class="icon-btn clear" data-act="clear-q" aria-label="Clear search" style="${S.query ? '' : 'display:none'}">${ic('x', 'sm')}</button>
    </div>
    <div id="results">${searchResults()}</div>
  </div>`;
}
function searchResults() {
  const q = S.query.trim().toLowerCase();
  if (!q) return `<section class="sec"><div class="sec-head"><h2>Browse by genre</h2></div><div class="genres">
    ${GENRES.map(g => { return `<button class="genre" style="--g-bg:${g.bg};--g-ink:${g.ink}" data-act="genre" data-g="${g.g}">${g.g}<img src="${albumURL(g.a)}" alt="" width="72" height="72"></button>`; }).join('')}
  </div></section>
  <section class="sec"><div class="sec-head"><h2>Trending this week</h2></div><div class="card tracks">${['t29','t14','t9','t5','t31'].map((t, i) => trackRow(t, i, '')).join('')}</div></section>`;
  const tr = TRACK_LIST.filter(t => { const a = ALBUMS[t.a]; return [t.title, a.artist, a.title, a.genre].some(s => s.toLowerCase().includes(q)) ; });
  const pls = S.playlists.filter(p => p.name.toLowerCase().includes(q) || plTracks(p).some(t => tr.find(x => x.id === t)) && p.name.toLowerCase().includes(q));
  if (!tr.length && !pls.length) return `<div class="card empty" style="margin-top:20px">${emptyArt()}<h3>No results for “${esc(S.query.trim())}”</h3><p>Check the spelling, or try an artist or genre.</p></div>`;
  return `${pls.length ? `<section class="sec"><div class="sec-head"><h2>Playlists</h2></div><div class="card list">${pls.map(plRow).join('')}</div></section>` : ''}
    ${tr.length ? `<section class="sec"><div class="sec-head"><h2>Songs</h2><span class="page-sub num">${tr.length} found</span></div><div class="card tracks">${tr.map((t, i) => trackRow(t.id, i, '')).join('')}</div></section>` : ''}`;
}

function viewQueue() {
  const t = cur(), a = ALBUMS[t.a], ctxP = PL(S.ctx.pid);
  const nxt = upNext();
  return `<div class="main-inner q-wrap">
    ${header('Queue', ctxP ? `Playing from ${esc(ctxP.name)}` : '')}
    <div class="q-label" style="margin-top:20px">Now playing</div>
    <div class="card q-now">
      <span class="cov">${trackImg(t.id)}</span>
      <div style="flex:1;min-width:0"><div class="row-t">${eqHTML()}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span></div><div class="row-s">${esc(a.artist)}<span class="dot"></span>${esc(a.title)}</div></div>
      <button class="icon-btn like ${isLiked(t.id) ? 'is-on' : ''}" data-act="like" data-id="${t.id}" aria-pressed="${isLiked(t.id)}" aria-label="${isLiked(t.id) ? 'Remove from' : 'Save to'} Liked Songs">${ic('heart', 'sm')}</button>
    </div>
    ${queueLists(nxt, Infinity)}
  </div>`;
}
function queueLists(nxt, limit) {
  const ctxP = PL(S.ctx.pid);
  const q = S.queue;
  let html = '';
  if (q.length) html += `<div class="q-label"><span>Next in queue<span class="q-count num">${q.length}</span></span><button class="link-btn" data-act="q-clear">Clear</button></div>
    <div class="card list q-user">${q.slice(0, limit).map((tid, i) => qRow(tid, i, 'user')).join('')}</div>`;
  const rest = Math.max(0, limit - q.length);
  if (nxt.length && rest) html += `<div class="q-label"><span>Next from <b>${esc(ctxP ? ctxP.name : 'playlist')}</b></span>${S.shuffle ? `<span style="display:inline-flex;align-items:center;gap:4px;color:#4D7C0F">${ic('shuffle', 'sm')}Shuffled</span>` : ''}</div>
    <div class="card list">${nxt.slice(0, rest).map((tid, i) => qRow(tid, i, 'ctx')).join('')}</div>`;
  if (!q.length && !nxt.length) html += `<div class="card empty" style="margin-top:16px">${emptyArt()}<h3>Nothing up next</h3><p>Add songs from any playlist with “Add to queue”.</p><button class="btn" data-act="nav" data-view="library">Browse library</button></div>`;
  return html;
}
function qRow(tid, i, kind) {
  const t = TR[tid], a = ALBUMS[t.a];
  return `<div class="qrow" data-qi="${i}" data-kind="${kind}">
    <button class="q-hit" data-act="q-jump" data-kind="${kind}" data-i="${i}" aria-label="Play ${esc(t.title)} now"></button>
    <span class="cov">${trackImg(tid)}</span>
    <span style="min-width:0"><span class="row-t" style="font-size:15px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span></span><span class="row-s">${esc(a.artist)}<span class="dot"></span><span class="num">${fmt(t.d)}</span></span></span>
    ${kind === 'user' ? `<button class="icon-btn" data-act="q-remove" data-i="${i}" aria-label="Remove ${esc(t.title)} from queue">${ic('x', 'sm')}</button>
      <button class="icon-btn grip" data-i="${i}" aria-label="Reorder ${esc(t.title)}. Use arrow keys to move.">${ic('grip', 'sm')}</button>`
      : `<button class="icon-btn" data-act="track-more" data-id="${tid}" aria-label="More options for ${esc(t.title)}">${ic('more')}</button><span></span>`}
  </div>`;
}

function emptyArt() {
  return `<svg class="art" viewBox="0 0 120 100" aria-hidden="true"><rect x="14" y="18" width="64" height="64" rx="14" fill="#E6E4DD"/><rect x="34" y="10" width="72" height="72" rx="16" fill="#1F2A24"/><circle cx="70" cy="46" r="20" fill="#C6F432"/><circle cx="70" cy="46" r="6" fill="#1F2A24"/><rect x="44" y="88" width="52" height="6" rx="3" fill="#E6E4DD"/></svg>`;
}

function renderMain(soft) {
  const keepScroll = main.scrollTop, winScroll = window.scrollY;
  const focusedSearch = document.activeElement && document.activeElement.id === 'q';
  if (soft && S.view === 'search' && focusedSearch) { document.getElementById('results').innerHTML = searchResults(); return; }
  main.innerHTML = { library: viewLibrary, playlist: viewPlaylist, search: viewSearch, queue: viewQueue }[S.view]();
  if (soft) { main.scrollTop = keepScroll; window.scrollTo(0, winScroll); }
  bindQueueDrag(main);
}

function renderSide() {
  const side = document.getElementById('side');
  const nav = (v, icn, label, extra = '') => `<button data-act="nav" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${ic(icn)}${label}${extra}</button>`;
  const qn = S.queue.length;
  side.innerHTML = `<span class="brand"><span class="brand-mark">${brandGlyph()}</span>Tempo</span>
    <nav class="nav" aria-label="Main">${nav('library', 'library', 'Library')}${nav('search', 'search', 'Search')}${nav('queue', 'queue', 'Queue', qn ? `<span class="cnt num">${qn}</span>` : '')}</nav>
    <div class="side-label"><span>Playlists</span><button data-act="new-pl" aria-label="New playlist">${ic('plus', 'sm')}</button></div>
    <div style="display:grid;gap:2px">${[...S.playlists].sort((a, b) => S.pinned.includes(b.id) - S.pinned.includes(a.id)).map(p => `<button class="side-pl" data-act="open-pl" data-pid="${p.id}" ${S.view === 'playlist' && S.viewPid === p.id ? 'aria-current="page"' : ''}>
      <span class="cov">${plCover(p)}</span><div><div class="t">${esc(p.name)}</div><div class="s">${p.kind === 'mix' ? 'Made for you' : songs(plTracks(p).length)}</div></div>${S.ctx.pid === p.id && S.playing ? eqHTML() : ''}</button>`).join('')}</div>
    <div style="height:20px;flex:none"></div>
    <button class="side-user" data-act="account"><span class="avatar">${avatarImg()}</span><div><div class="t">Sam Rivera</div><div class="s">Premium · Family</div></div><span class="chev" style="margin-left:auto">${ic('right', 'sm')}</span></button>`;
}

function renderTabs() {
  const qn = S.queue.length;
  const tab = (v, icn, label, badge = '') => `<button class="tab" data-act="nav" data-view="${v}" ${(S.view === v || (v === 'library' && S.view === 'playlist')) ? 'aria-current="page"' : ''}><span class="tab-ic">${ic(icn)}</span>${label}${badge}</button>`;
  document.getElementById('tabs').innerHTML = tab('library', 'library', 'Library') + tab('search', 'search', 'Search') + tab('queue', 'queue', 'Queue', qn ? `<span class="badge num">${qn}</span>` : '');
}

function playerBits(variant) {
  const t = cur(), a = ALBUMS[t.a], ctxP = PL(S.ctx.pid);
  const pct = (S.pos / t.d * 100).toFixed(2);
  const rIcon = S.repeat === 'one' ? 'repeat1' : 'repeat';
  const n1 = S.queue[0] || upNext()[0];
  const volPct = (S.muted ? 0 : S.vol * 100).toFixed(0);
  return `
    <div class="np-top">
      ${variant === 'np' ? `<button class="icon-btn" data-act="close-np" aria-label="Close now playing">${ic('down')}</button>` : ''}
      <div class="np-from"><div class="k">Playing from playlist</div><div class="v">${esc(ctxP ? ctxP.name : '')}</div></div>
      <button class="icon-btn" data-act="track-more" data-id="${t.id}" aria-label="More options for ${esc(t.title)}">${ic('more')}</button>
    </div>
    <div class="np-body">
      <div class="np-art ${S.playing ? '' : 'paused'}">${trackImg(t.id, `${a.title} cover`)}</div>
      <div>
        <div class="np-title-row"><div><div class="np-t">${esc(t.title)}</div><div class="np-a">${esc(a.artist)}</div></div>
          <button class="icon-btn like ${isLiked(t.id) ? 'is-on' : ''}" data-act="like" data-id="${t.id}" aria-pressed="${isLiked(t.id)}" aria-label="${isLiked(t.id) ? 'Remove from' : 'Save to'} Liked Songs">${ic('heart')}</button></div>
        <div style="margin-top:16px">
          <label class="sr" for="seek-${variant}">Seek</label>
          <input class="range seek" id="seek-${variant}" type="range" min="0" max="${t.d}" step="1" value="${Math.floor(S.pos)}" style="--p:${pct}%">
          <div class="times num"><span class="js-cur">${fmt(S.pos)}</span><span>-<span class="js-left">${fmt(t.d - S.pos)}</span></span></div>
        </div>
        <div class="controls" style="margin-top:6px">
          <button class="icon-btn mode ${S.shuffle ? 'on' : ''}" data-act="shuffle" aria-pressed="${S.shuffle}" aria-label="Shuffle">${ic('shuffle')}</button>
          <button class="icon-btn" data-act="prev" aria-label="Previous">${ic('prev')}</button>
          <button class="big-play" data-act="toggle" aria-label="${S.playing ? 'Pause' : 'Play'}">${ic(S.playing ? 'pause' : 'play')}</button>
          <button class="icon-btn" data-act="next" aria-label="Next">${ic('next')}</button>
          <button class="icon-btn mode ${S.repeat !== 'off' ? 'on' : ''}" data-act="repeat" aria-label="Repeat: ${S.repeat === 'off' ? 'off' : S.repeat === 'all' ? 'playlist' : 'this song'}">${ic(rIcon)}</button>
        </div>
        <div class="np-foot">
          <button class="icon-btn" data-act="mute" aria-label="${S.muted ? 'Unmute' : 'Mute'}">${ic(S.muted || S.vol === 0 ? 'volx' : 'vol', 'sm')}</button>
          <label class="sr" for="vol-${variant}">Volume</label>
          <input class="range vol" id="vol-${variant}" type="range" min="0" max="100" value="${volPct}" style="--p:${volPct}%;--fill:rgba(255,255,255,.85)">
          ${variant === 'np' ? `<button class="icon-btn" data-act="open-queue" aria-label="Open queue">${ic('queue', 'sm')}</button>` : ''}
        </div>
      </div>
      ${variant === 'np' && n1 ? `<button class="np-next" data-act="next" aria-label="Skip to next: ${esc(TR[n1].title)}"><span class="cov">${trackImg(n1)}</span><div><div class="k">Up next${S.queue.length ? ' · from your queue' : ''}</div><div class="v">${esc(TR[n1].title)} · ${esc(alb(n1).artist)}</div></div>${ic('next', 'sm')}</button>` : ''}
    </div>`;
}

function renderPlayer() {
  const t = cur(), a = ALBUMS[t.a];
  const c = a.art.fg === '#C6F432' ? a.art.bg : a.art.fg;
  const np = document.getElementById('np');
  np.style.setProperty('--np-c', c);
  np.innerHTML = playerBits('np');
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="np-card" style="--np-c:${c}">${playerBits('panel')}</div>
    ${S.view === 'queue' ? '' : `<section class="up-next">${queueLists(upNext(), 5)}<button class="link-btn" style="margin:8px 4px 0" data-act="nav" data-view="queue">Open full queue${ic('right', 'sm')}</button></section>`}`;
  bindQueueDrag(panel);
  document.getElementById('mini').innerHTML = `
    <button class="hit" data-act="open-np" aria-label="Open now playing: ${esc(t.title)} by ${esc(a.artist)}"></button>
    <span class="cov">${trackImg(t.id)}</span>
    <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(a.artist)}</div></div>
    <button class="icon-btn like ${isLiked(t.id) ? 'is-on' : ''}" data-act="like" data-id="${t.id}" aria-pressed="${isLiked(t.id)}" aria-label="${isLiked(t.id) ? 'Remove from' : 'Save to'} Liked Songs">${ic('heart', 'sm')}</button>
    <button class="icon-btn" data-act="toggle" aria-label="${S.playing ? 'Pause' : 'Play'}">${ic(S.playing ? 'pause' : 'play')}</button>
    <div class="prog"><i style="width:${(S.pos / t.d * 100).toFixed(2)}%"></i></div>`;
  document.title = S.playing ? `${t.title} · ${a.artist}` : 'Tempo';
}

function updateProgress() {
  const t = cur(); const pct = (S.pos / t.d * 100).toFixed(2) + '%';
  document.querySelectorAll('.mini .prog i').forEach(el => el.style.width = pct);
  if (scrubbing) return;
  document.querySelectorAll('.seek').forEach(el => { el.value = Math.floor(S.pos); el.style.setProperty('--p', pct); });
  document.querySelectorAll('.js-cur').forEach(el => el.textContent = fmt(S.pos));
  document.querySelectorAll('.js-left').forEach(el => el.textContent = fmt(t.d - S.pos));
}

function renderAll() { renderMain(true); renderSide(); renderTabs(); renderPlayer(); }

/* ===================== Sheets & toast ===================== */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let sheetReturn = null;
function openSheet(html, label) {
  sheetReturn = document.activeElement;
  sheet.innerHTML = `<div class="grab"></div>${html}`;
  sheet.setAttribute('aria-label', label || 'Options');
  sheet.classList.add('open'); scrim.classList.add('open');
  setTimeout(() => { const f = sheet.querySelector('input, button'); f && f.focus(); }, 60);
}
function closeSheet() { sheet.classList.remove('open'); scrim.classList.remove('open'); if (sheetReturn && document.contains(sheetReturn)) sheetReturn.focus(); }
let toastT;
function toast(msg, icon = 'check') {
  const el = document.getElementById('toast'); el.innerHTML = ic(icon, 'sm') + esc(msg); el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
}

function trackSheet(tid, pid) {
  const t = TR[tid], a = ALBUMS[t.a]; const p = pid && PL(pid);
  const canRemove = p && p.kind === 'own';
  openSheet(`<div class="sheet-head"><span class="cov">${trackImg(tid)}</span><div><div class="t">${esc(t.title)}</div><div class="s">${esc(a.artist)} · ${esc(a.title)}</div></div></div>
    <button class="opt" data-act="play-next" data-id="${tid}">${ic('playnext')}Play next</button>
    <button class="opt" data-act="add-q" data-id="${tid}">${ic('addq')}Add to queue</button>
    <button class="opt" data-act="like" data-id="${tid}" data-close="1">${isLiked(tid) ? `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="fill:var(--ink);stroke:var(--ink)">${P.heart}</svg>` : ic('heart')}${isLiked(tid) ? 'Remove from Liked Songs' : 'Save to Liked Songs'}</button>
    <button class="opt" data-act="add-to-pl" data-id="${tid}">${ic('listplus')}Add to playlist</button>
    ${canRemove ? `<button class="opt danger" data-act="rm-from-pl" data-id="${tid}" data-pid="${pid}">${ic('trash')}Remove from ${esc(p.name)}</button>` : ''}`, t.title);
}
function addToPlSheet(tid) {
  const own = S.playlists.filter(p => p.kind === 'own');
  openSheet(`<h2>Add to playlist</h2><div style="height:6px"></div>
    <button class="opt" data-act="new-pl" data-id="${tid}"><span class="cov" style="display:grid;place-items:center;background:var(--lime-tint);color:var(--lime-ink)">${ic('plus', 'sm')}</span>New playlist</button>
    ${own.map(p => { const has = p.tracks.includes(tid); return `<button class="opt" data-act="add-pl-go" data-id="${tid}" data-pid="${p.id}" ${has ? 'aria-disabled="true"' : ''}><span class="cov">${plCover(p)}</span><span style="flex:1"><span style="display:block">${esc(p.name)}</span><span class="s">${has ? 'Already added' : songs(p.tracks.length)}</span></span>${has ? `<span style="color:#4D7C0F">${ic('check', 'sm')}</span>` : ''}</button>`; }).join('')}`, 'Add to playlist');
}
function newPlSheet(tid) {
  openSheet(`<h2>New playlist</h2>
    <form id="new-pl-form" class="field" novalidate>
      <label for="pl-name">Name</label>
      <input id="pl-name" maxlength="40" autocomplete="off" placeholder="e.g. Gym, Friday dinner">
      <div class="err" id="pl-err" role="alert"></div>
      <input type="hidden" id="pl-track" value="${tid || ''}">
    </form>
    <div class="suggest">${['Workout', 'Focus', 'Dinner party', 'Commute'].map(s => `<button class="chip" data-act="pl-suggest" data-s="${s}">${s}</button>`).join('')}</div>
    <div style="padding:0 8px"><button class="btn block" data-act="pl-create">Create playlist</button></div>`, 'New playlist');
}
function accountSheet() {
  const mins = WEEK.reduce((a, b) => a + b, 0);
  openSheet(`<div class="profile"><span class="avatar">${avatarImg()}</span><div><div style="font-weight:700;font-size:18px">Sam Rivera</div><div class="page-sub">Premium · Family plan</div></div></div>
    <div class="stat-row"><div class="stat"><b class="num">${S.playlists.length}</b><span>Playlists</span></div><div class="stat"><b class="num">${S.liked.length}</b><span>Liked</span></div><div class="stat"><b class="num">${Math.round(mins / 60 * 10) / 10}h</b><span>This week</span></div></div>
    <button class="opt">${ic('user')}Account settings</button>
    <button class="opt">${ic('dl')}Storage and downloads</button>
    <button class="opt danger" data-act="reset">${ic('refresh')}Reset library to sample data</button>`, 'Account');
}
function plMoreSheet(pid) {
  const p = PL(pid);
  openSheet(`<div class="sheet-head"><span class="cov">${plCover(p)}</span><div><div class="t">${esc(p.name)}</div><div class="s">${plSub(p)}</div></div></div>
    <button class="opt" data-act="pl-queue" data-pid="${pid}">${ic('addq')}Add all to queue</button>
    ${p.kind === 'own' ? `<button class="opt danger" data-act="pl-delete" data-pid="${pid}">${ic('trash')}Delete playlist</button>` : ''}`, p.name);
}

/* ===================== Events ===================== */
function go(view, pid) {
  S.view = view; S.viewPid = pid || null;
  document.getElementById('np').classList.remove('open');
  renderMain(); renderSide(); renderTabs(); renderPlayer();
  main.scrollTop = 0; window.scrollTo(0, 0); save();
  const h = main.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); }
}
let backStack = [];

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, pid, id } = b.dataset;
  switch (act) {
    case 'toggle': toggle(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuffle': toggleShuffle(); break;
    case 'repeat': cycleRepeat(); break;
    case 'like': toggleLike(id); if (b.dataset.close) closeSheet(); break;
    case 'mute': S.muted = !S.muted; if (!S.muted && S.vol === 0) S.vol = .5; Audio_.volume(); renderPlayer(); save(); break;
    case 'open-np': { const np = document.getElementById('np'); np.classList.add('open'); setTimeout(() => np.querySelector('[data-act="close-np"]').focus(), 50); break; }
    case 'close-np': document.getElementById('np').classList.remove('open'); document.querySelector('#mini .hit').focus(); break;
    case 'open-queue': go('queue'); break;
    case 'nav': closeSheet(); backStack = []; go(b.dataset.view); break;
    case 'back': go(backStack.pop() || 'library'); break;
    case 'open-pl': closeSheet(); if (S.view !== 'playlist') backStack.push(S.view); go('playlist', pid); break;
    case 'play-pl': if (S.ctx.pid === pid && !b.dataset.shuffle) toggle(); else playContext(pid, null, { shuffle: !!b.dataset.shuffle || (S.ctx.pid === pid ? S.shuffle : false) }); break;
    case 'play-track': {
      if (S.trackId === id && (!pid || S.ctx.pid === pid)) { toggle(); break; }
      if (pid) playContext(pid, id, { shuffle: S.shuffle && S.ctx.pid === pid });
      else { S.queue.unshift(id); S.playing = true; lastTick = performance.now(); next(); }
      break;
    }
    case 'track-more': trackSheet(id, pid); break;
    case 'play-next': S.queue.unshift(id); closeSheet(); toast('Playing next'); renderAll(); save(); break;
    case 'add-q': S.queue.push(id); closeSheet(); toast('Added to queue'); renderAll(); save(); break;
    case 'add-to-pl': addToPlSheet(id); break;
    case 'add-pl-go': { const p = PL(pid); if (!p.tracks.includes(id)) { p.tracks.push(id); toast(`Added to ${p.name}`); renderAll(); save(); } closeSheet(); break; }
    case 'rm-from-pl': { const p = PL(pid); p.tracks = p.tracks.filter(t => t !== id); closeSheet(); toast(`Removed from ${p.name}`, 'x'); renderAll(); save(); break; }
    case 'new-pl': newPlSheet(id); break;
    case 'pl-suggest': { const i = document.getElementById('pl-name'); i.value = b.dataset.s; i.focus(); break; }
    case 'pl-create': createPlaylist(); break;
    case 'pl-more': plMoreSheet(pid); break;
    case 'pl-queue': S.queue.push(...plTracks(PL(pid))); closeSheet(); toast(`${songs(plTracks(PL(pid)).length)} added to queue`); renderAll(); save(); break;
    case 'pl-delete': { const p = PL(pid); S.playlists = S.playlists.filter(x => x.id !== pid); S.pinned = S.pinned.filter(x => x !== pid); S.downloaded = S.downloaded.filter(x => x !== pid); S.recent = S.recent.filter(x => x !== pid); closeSheet(); toast(`Deleted ${p.name}`, 'trash'); go('library'); renderPlayer(); break; }
    case 'download': { const on = S.downloaded.includes(pid); S.downloaded = on ? S.downloaded.filter(x => x !== pid) : [...S.downloaded, pid]; toast(on ? 'Download removed' : 'Downloaded', on ? 'x' : 'dl'); renderAll(); save(); break; }
    case 'pin': { const on = S.pinned.includes(pid); S.pinned = on ? S.pinned.filter(x => x !== pid) : [...S.pinned, pid]; toast(on ? 'Unpinned' : 'Pinned to top', 'pin'); renderAll(); save(); break; }
    case 'filter': S.filter = b.dataset.f; renderMain(true); save(); break;
    case 'genre': S.query = b.dataset.g; renderMain(); break;
    case 'clear-q': S.query = ''; renderMain(); document.getElementById('q').focus(); break;
    case 'q-remove': { const [t] = S.queue.splice(+b.dataset.i, 1); toast(`Removed ${TR[t].title}`, 'x'); renderAll(); save(); break; }
    case 'q-clear': S.queue = []; toast('Queue cleared', 'x'); renderAll(); save(); break;
    case 'q-jump': {
      const i = +b.dataset.i; S.playing = true; lastTick = performance.now();
      if (b.dataset.kind === 'user') { const [t] = S.queue.splice(0, i + 1).slice(-1); setTrack(t); }
      else { S.ctx.i += i + 1; setTrack(S.ctx.list[S.ctx.i]); }
      break;
    }
    case 'account': accountSheet(); break;
    case 'reset': { const was = S.playing; Audio_.stop(); S = freshState(); closeSheet(); toast('Library reset', 'refresh'); renderAll(); save(); break; }
  }
});
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (sheet.classList.contains('open')) closeSheet();
    else if (document.getElementById('np').classList.contains('open')) document.querySelector('[data-act="close-np"]').click();
  }
  if (e.key === 'Tab' && sheet.classList.contains('open')) trapFocus(e, sheet);
  else if (e.key === 'Tab' && document.getElementById('np').classList.contains('open') && innerWidth < 1024) trapFocus(e, document.getElementById('np'));
  if (e.key === ' ' && !e.target.closest('input, button, [contenteditable]')) { e.preventDefault(); toggle(); }
  if (e.key === 'Enter' && e.target.id === 'pl-name') { e.preventDefault(); createPlaylist(); }
});
function trapFocus(e, root) {
  const f = [...root.querySelectorAll('button, input, [href]')].filter(el => !el.disabled && el.offsetParent !== null && el.type !== 'hidden');
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function createPlaylist() {
  const i = document.getElementById('pl-name'); const name = i.value.trim();
  const err = document.getElementById('pl-err');
  if (!name) { err.textContent = 'Give your playlist a name.'; i.focus(); return; }
  if (S.playlists.some(p => p.name.toLowerCase() === name.toLowerCase())) { err.textContent = 'You already have a playlist with this name.'; i.focus(); return; }
  const tid = document.getElementById('pl-track').value;
  const p = { id: 'u' + Date.now().toString(36), name, kind: 'own', desc: '', tracks: tid ? [tid] : [] };
  S.playlists.push(p); closeSheet(); toast(tid ? `Added to ${name}` : `Created ${name}`); save();
  if (!tid) { backStack.push(S.view); go('playlist', p.id); } else renderAll();
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.query = el.value; document.getElementById('results').innerHTML = searchResults(); main.querySelector('.clear').style.display = S.query ? '' : 'none'; }
  if (el.classList.contains('seek')) { scrubbing = true; const v = +el.value; el.style.setProperty('--p', (v / cur().d * 100) + '%'); el.parentElement.querySelector('.js-cur').textContent = fmt(v); el.parentElement.querySelector('.js-left').textContent = fmt(cur().d - v); }
  if (el.classList.contains('vol')) { S.vol = +el.value / 100; S.muted = false; el.style.setProperty('--p', el.value + '%'); Audio_.volume(); document.querySelectorAll('.vol').forEach(v => { if (v !== el) { v.value = el.value; v.style.setProperty('--p', el.value + '%'); } }); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.classList.contains('seek')) { S.pos = +el.value; scrubbing = false; lastTick = performance.now(); updateProgress(); save(); }
  if (el.classList.contains('vol')) { renderPlayer(); save(); }
});

/* Queue drag-to-reorder (pointer) + keyboard (arrow keys on grip) */
function bindQueueDrag(root) {
  root.querySelectorAll('.q-user .grip').forEach(g => {
    g.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault(); const i = +g.dataset.i, j = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (j < 0 || j >= S.queue.length) return;
      [S.queue[i], S.queue[j]] = [S.queue[j], S.queue[i]]; renderAll(); save();
      const ng = document.querySelector(`#${root.id} .q-user .grip[data-i="${j}"]`); ng && ng.focus();
    });
    g.addEventListener('pointerdown', e => {
      e.preventDefault(); const row = g.closest('.qrow'); const list = row.parentElement;
      const rows = [...list.children]; const from = rows.indexOf(row); const startY = e.clientY;
      const h = row.getBoundingClientRect().height; let to = from;
      row.classList.add('dragging'); g.setPointerCapture(e.pointerId);
      const move = ev => {
        const dy = ev.clientY - startY; row.style.transform = `translateY(${dy}px)`;
        to = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / h)));
        rows.forEach((r, k) => { if (r === row) return; let s = 0; if (from < to && k > from && k <= to) s = -h; if (from > to && k < from && k >= to) s = h; r.style.transform = s ? `translateY(${s}px)` : ''; r.style.transition = 'transform .15s'; });
      };
      const up = () => {
        g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
        if (to !== from) { const [t] = S.queue.splice(from, 1); S.queue.splice(to, 0, t); save(); }
        renderAll();
      };
      g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    });
  });
}

renderAll(); mediaMeta();
