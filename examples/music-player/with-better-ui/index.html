<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EC">
<title>Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — stone canvas, dark ink controls, lime highlight. Signature: a small equalizer beside whatever is playing. */
:root{
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --canvas:#F1F0EC; --surface:#FFFFFF; --surface-2:#F6F5F1; --inset:#E8E6E0; --line:#E4E2DB;
  --text:#1A1D1B; --text-2:#62665F; --text-3:#8D9089;
  --ink:#1F2A24; --ink-2:#2C3832; --lime:#C6F432; --lime-tint:#EEFBC9;
  --wave-off:#D3D0C7;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-full:999px;
  --shadow:0 1px 2px rgba(31,42,36,.05),0 8px 24px -12px rgba(31,42,36,.14);
  --shadow-art:0 2px 4px rgba(31,42,36,.08),0 24px 48px -20px rgba(31,42,36,.38);
  --shadow-float:0 12px 32px -8px rgba(31,42,36,.28);
  --dock-h:168px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-feature-settings:"ss01";background:var(--canvas);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ol,ul{list-style:none;margin:0;padding:0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-xs)}
.mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- layout ---------- */
.panel{display:none;min-height:100dvh;padding:calc(var(--safe-t) + 12px) 20px calc(var(--dock-h) + 24px)}
.app[data-view="lib"] .p-lib,.app[data-view="queue"] .p-queue{display:block}
.app[data-view="now"] .p-now{display:flex}
.p-now{flex-direction:column;padding-bottom:calc(var(--safe-b) + 28px);background:var(--tint,var(--canvas));--text-2:#53584F;--wave-off:rgba(31,42,36,.17);transition:background .4s}
@media (max-width:767px){.app[data-view="now"] ~ .dock{display:none}}

/* ---------- shared pieces ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo i{display:block;width:3px;border-radius:2px;background:var(--lime)}
.logo span{display:flex;align-items:flex-end;gap:3px;height:14px}
.wordmark{display:block;font-size:13px;font-weight:600;color:var(--text-2);line-height:1.3}
.page-title{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--lime-tint);overflow:hidden;flex:none;display:grid;place-items:center;font-size:14px;font-weight:600}
.avatar img{width:100%;height:100%}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--text);transition:background .15s,transform .1s;flex:none}
.icon-btn:hover{background:rgba(31,42,36,.06)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.sm .ico{width:18px;height:18px}
.text-btn{height:40px;padding:0 14px;border-radius:var(--r-full);font-size:14px;font-weight:600;color:var(--text-2);transition:background .15s}
.text-btn:hover{background:rgba(31,42,36,.06);color:var(--text)}
.text-btn:disabled{opacity:.45;cursor:default;background:none}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 12px}
.sec-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.sec-meta{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}

.art{position:relative;border-radius:var(--r-xs);overflow:hidden;background:var(--inset);flex:none}
.art svg{width:100%;height:100%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.liked-cover{width:100%;height:100%;display:grid;place-items:center;background:var(--lime);color:var(--ink)}
.liked-cover .ico{width:46%;height:46%;fill:var(--ink);stroke:none}

/* equalizer signature */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;border-radius:2px;background:currentColor;height:40%}
.eq i:nth-child(2){height:100%}.eq i:nth-child(3){height:65%}
body.playing .eq i{animation:eq 1s ease-in-out infinite}
body.playing .eq i:nth-child(2){animation-delay:-.35s}
body.playing .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* rows */
.list{padding:4px}
.row{display:flex;align-items:center;gap:4px;border-radius:var(--r-md);position:relative;transition:background .15s}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;text-align:left;border-radius:var(--r-md)}
.row-main .art{width:48px;height:48px}
.txt{min-width:0;display:flex;flex-direction:column}
.t1{font-size:15px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--text-2);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t1 .eq{color:var(--ink);margin-right:6px;vertical-align:-1px}
.dur{font-size:13px;color:var(--text-2);flex:none;padding:0 4px}
.row .trail{display:flex;align-items:center;padding-right:4px}

/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;border-radius:var(--r-md);background:var(--inset);color:var(--text-2);transition:box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 2px var(--ink)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--text);height:100%}
.search input::placeholder{color:var(--text-2)}
.search .ico{width:20px;height:20px}
.pane-switch{display:none!important}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:var(--r-full);background:var(--inset);margin-top:16px}
.seg button{height:40px;padding:0 16px;border-radius:var(--r-full);font-size:14px;font-weight:600;color:var(--text-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(31,42,36,.1)}
.hscroll{scroll-padding-inline:20px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:136px;scroll-snap-align:start;text-align:left;border-radius:var(--r-md)}
.tile .art{width:136px;height:136px;border-radius:var(--r-md);box-shadow:var(--shadow);transition:transform .2s}
.tile:hover .art{transform:translateY(-2px)}
.tile .t1{margin-top:10px;font-size:14px}
.tile .t2{font-size:13px}
.lib-list .row-main .art{width:56px;height:56px;border-radius:var(--r-sm)}
.chev{color:var(--text-3);padding-right:8px}

/* detail */
.detail-top{display:flex;align-items:center;gap:4px;margin:-4px 0 8px -12px}
.detail-top span{font-size:14px;font-weight:600;color:var(--text-2)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.hero .art{width:184px;height:184px;border-radius:var(--r-lg);box-shadow:var(--shadow-art)}
.hero h2{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:20px}
.hero .by{font-size:15px;color:var(--text-2);margin-top:4px}
.hero .meta{font-size:13px;color:var(--text-2);margin-top:8px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:20px}
.btn{height:48px;padding:0 22px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn .ico{width:18px;height:18px}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary .ico{color:var(--lime)}
.btn-primary:hover{background:var(--ink-2)}
.btn-ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px}
.empty img,.empty .emo{width:96px;height:96px;font-size:72px;line-height:96px}
.empty h3{font-size:18px;font-weight:600;margin-top:16px}
.empty p{font-size:14px;color:var(--text-2);margin-top:4px;max-width:280px}
.empty .btn{margin-top:20px}

/* ---------- now playing ---------- */
.np-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.ctx{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center}
.ctx small{font-size:13px;color:var(--text-2);line-height:1.4}
.ctx button{font-size:15px;font-weight:600;line-height:1.4;min-height:28px;padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px}
.ctx button:hover{text-decoration:underline;text-underline-offset:3px}
.np-body{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px;margin:0 auto}
.np-art{width:min(100%,40dvh,440px);aspect-ratio:1;margin:16px auto 0;border-radius:var(--r-lg);box-shadow:var(--shadow-art);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
body:not(.playing) .np-art{transform:scale(.94)}
.np-meta{display:flex;align-items:center;gap:12px;margin-top:28px}
.np-meta .txt{flex:1}
.np-title{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{min-height:28px;font-size:15px;color:var(--text-2);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px}
.np-artist:hover{color:var(--text)}
.heart[aria-pressed="true"] .ico{fill:var(--ink);stroke:var(--ink)}
.heart.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.wave{position:relative;display:flex;align-items:center;gap:2px;height:48px;margin-top:20px;cursor:pointer;touch-action:none;border-radius:6px}
.wave i{flex:1;border-radius:2px;background:var(--wave-off);transition:background .2s}
.wave i.on{background:var(--ink)}
.wave .head{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--ink);pointer-events:none;box-shadow:0 0 0 2px var(--canvas)}
.wave:hover i:not(.on){background:#C6C3B9}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-top:8px}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.controls .icon-btn{width:52px;height:52px;position:relative}
.controls .icon-btn .ico{width:26px;height:26px}
.controls .icon-btn.mode .ico{width:22px;height:22px;color:var(--text-2)}
.controls .icon-btn.mode[aria-pressed="true"] .ico{color:var(--ink)}
.controls .icon-btn.mode[aria-pressed="true"]::after{content:"";position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:999px;background:var(--ink)}
.play-btn{width:76px;height:76px;border-radius:999px;background:var(--ink);color:var(--lime);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px -10px rgba(31,42,36,.6);transition:transform .1s,background .15s}
.play-btn:hover{background:var(--ink-2)}
.play-btn:active{transform:scale(.95)}
.play-btn .ico{width:30px;height:30px}
.play-btn .ico.play{margin-left:3px}
.vol{display:none;align-items:center;gap:12px;margin-top:20px;color:var(--text-2)}
.vol .ico{width:20px;height:20px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:24px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--v,70%),var(--wave-off) var(--v,70%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--wave-off)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--ink),0 2px 4px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.upnext{display:flex;align-items:center;gap:12px;width:100%;margin-top:24px;padding:10px 12px 10px 10px;text-align:left;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);transition:transform .1s}
.upnext:active{transform:scale(.99)}
.upnext .art{width:44px;height:44px}
.upnext .txt{flex:1}
.upnext .lbl{font-size:13px;color:var(--text-2);line-height:1.4}
.upnext .t1{font-size:14px}
.upnext .ico{color:var(--text-3)}

/* ---------- queue ---------- */
.q-now{display:flex;align-items:center;gap:12px;padding:12px}
.q-now .art{width:56px;height:56px;border-radius:var(--r-sm)}
.q-now .txt{flex:1}
.q-now .ctx-line{font-size:13px;color:var(--text-2);margin-top:2px}
.q-now .eq{color:var(--ink);margin-right:8px}
.q-list .row{background:var(--surface);touch-action:pan-y}
.q-list .row:hover{background:var(--surface-2)}
.q-list .row.dragging{z-index:3;box-shadow:var(--shadow-float);background:var(--surface);transition:none}
.q-list .row.shift{transition:transform .18s ease}
.grip{width:36px;height:44px;display:grid;place-items:center;color:var(--text-3);cursor:grab;touch-action:none;flex:none}
.grip:active{cursor:grabbing}
@media (hover:hover){.q-list .row [data-act="remove"]{opacity:0;transition:opacity .15s}.q-list .row:hover [data-act="remove"],.q-list .row:focus-within [data-act="remove"]{opacity:1}}
.grip .ico{width:18px;height:18px}

/* ---------- dock ---------- */
.dock{position:fixed;inset:auto 0 0;z-index:20;padding:12px 20px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
.dock::before{content:"";position:absolute;inset:-32px 0 0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(241,240,236,0),var(--canvas) 36px)}
.mini{position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-float);overflow:hidden}
.app[data-view="now"] ~ .dock .mini{display:none}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;border-radius:var(--r-sm)}
.mini .art{width:44px;height:44px}
.mini .t1{font-size:14px}
.mini .play-btn{width:44px;height:44px;box-shadow:none}
.mini .play-btn .ico{width:20px;height:20px}
.mini .play-btn .ico.play{margin-left:2px}
.mini-bar{position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--inset);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--ink);width:0}
.tabs{display:flex;background:var(--ink);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow-float)}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;color:rgba(255,255,255,.62);font-size:12px;font-weight:600;transition:color .15s,background .15s}
.tab:hover{color:#fff}
.tab[aria-current="page"]{color:var(--lime);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tab .ico{width:22px;height:22px}
.tab:focus-visible{outline-color:var(--lime)}

.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 16px);transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:30;background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:10px 16px;border-radius:var(--r-full);box-shadow:var(--shadow-float);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet: player left, library/queue right ---------- */
@media (min-width:768px){
  .app{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:100dvh}
  .panel{min-height:0;overflow:auto;padding:20px 24px 24px}
  .p-now{display:flex!important;grid-column:1;grid-row:1;padding:20px 32px 28px;border-radius:var(--r-lg)}
  .side{grid-column:2;grid-row:1;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .side .card{box-shadow:none;border-radius:0;background:none}
  .side .list{padding:0;margin:0 -8px}
  .side .q-now{padding:8px 0}
  .side .q-list .row{background:var(--surface)}
  .side .hscroll{margin:0 -24px;padding:0 24px 4px;scroll-padding-inline:24px}
  .side .search{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
  .side .search:focus-within{box-shadow:0 0 0 2px var(--ink)}
  .side .seg{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
  .app[data-view="now"] .p-lib{display:block}
  .np-close{visibility:hidden}
  .np-queue{visibility:hidden}
  .np-art{width:min(100%,46dvh,440px)}
  .vol{display:flex}
  .dock{left:calc(50% + 8px);right:16px;bottom:16px;padding:0 16px 16px}
  .dock::before{display:none}
  .mini{display:none!important}
  .pane-switch{display:flex!important;margin:0 0 20px}
  .pane-switch button{flex:1}
  .dock{display:none}
  .side .detail-top{position:sticky;top:-20px;z-index:2;background:var(--surface);margin-top:-20px;padding-top:16px;padding-bottom:4px}
  .tab-now{display:none!important}
  .tabs{border-radius:20px}
  .toast{left:75%;bottom:32px}
}
/* ---------- desktop: three panes ---------- */
@media (min-width:1100px){
  .app{grid-template-columns:340px minmax(0,1fr) 380px;gap:16px}
  .p-lib{display:block!important;grid-column:1}
  .p-now{grid-column:2}
  .p-queue{display:block!important;grid-column:3}
  .side{padding-bottom:24px}
  .pane-switch{display:none!important}
  .dock{display:none}
  .upnext{display:none}
  .toast{left:50%;bottom:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<h1 class="sr">Tempo</h1>
<main class="app" id="app" data-view="lib">
  <section class="panel p-lib side" id="p-lib" aria-label="Library">
    <div class="pane-switch seg" role="group" aria-label="Show"><button data-act="tab" data-v="lib" aria-pressed="true">Library</button><button data-act="tab" data-v="queue" aria-pressed="false">Queue</button></div>
    <header class="top" id="lib-head">
      <div class="brand">
        <span class="logo" aria-hidden="true"><span><i style="height:55%"></i><i style="height:100%"></i><i style="height:75%"></i></span></span>
        <div><span class="wordmark">Tempo</span><h2 class="page-title">Library</h2></div>
      </div>
      <span class="avatar" aria-label="Signed in as Sam Rivera" role="img"><img src="https://api.dicebear.com/9.x/notionists/svg?seed=SamRivera&backgroundColor=eefbc9" alt="" width="40" height="40" onerror="this.parentNode.textContent='SR'"></span>
    </header>
    <label class="search" id="lib-search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg>
      <span class="sr">Search your library</span>
      <input id="q" type="search" placeholder="Songs, albums or artists" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn sm" id="q-clear" type="button" aria-label="Clear search" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </label>
    <div id="lib-body"></div>
  </section>

  <section class="panel p-now" id="p-now" aria-label="Now playing"></section>

  <section class="panel p-queue side" id="p-queue" aria-label="Queue"></section>
</main>

<div class="dock" id="dock">
  <div class="mini" id="mini"></div>
  <nav class="tabs" aria-label="Main">
    <button class="tab" data-tab="lib"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg>Library</button>
    <button class="tab tab-now" data-tab="now"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="2.5"/></svg>Now playing</button>
    <button class="tab" data-tab="queue"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5H3M11 12H3M11 19H3M20 16V4"/><circle cx="17" cy="16" r="3"/></svg>Queue</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- icons ---------- */
const I = {
  play:'<svg class="ico fill play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6Z"/></svg>',
  pause:'<svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></svg>',
  prev:'<svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5.2v13.6a1 1 0 0 1-1.55.83L8 13.24V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v4.76l9.45-6.39A1 1 0 0 1 19 5.2Z"/></svg>',
  next:'<svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.2v13.6a1 1 0 0 0 1.55.83L16 13.24V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.76L6.55 4.37A1 1 0 0 0 5 5.2Z"/></svg>',
  shuffle:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2a4 4 0 0 0 3.3-1.7l5.4-8.6A4 4 0 0 1 16 6h6M2 6h2a4 4 0 0 1 3.6 2.2M22 18h-6a4 4 0 0 1-3.3-1.8l-.4-.45"/></svg>',
  repeat:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  repeat1:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3M11 10h1v4"/></svg>',
  heart:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.5-1.46 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
  down:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  back:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  queue:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5H3M11 12H3M11 19H3M20 16V4"/><circle cx="17" cy="16" r="3"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>',
  x:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  grip:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>',
  volLo:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/></svg>',
  volHi:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5ZM16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8"/></svg>',
};
const eq = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';

/* ---------- catalogue (fictional artists) ---------- */
const ALBUMS = [
  {id:'fn',title:'Field Notes',artist:'Ruben Alcott Trio',year:2023,pal:['#E9E2D0','#2F5D50','#C8553D'],pat:'arcs',
   tracks:[['Field Notes','6:02'],['Blue Hour','5:24'],['Small Rooms','4:47'],['Willow Street','5:35']]},
  {id:'qm',title:'Quiet Machines',artist:'Ilse Marr',year:2026,pal:['#1D1D1F','#8E7DFF','#EDEDED'],pat:'grid',
   tracks:[['Quiet Machines','5:46'],['Signal','4:18'],['Relay','3:55'],['Afterglow','6:10']]},
  {id:'ll',title:'Low Light',artist:'Nadia Fern',year:2025,pal:['#2B2F5A','#F2A65A','#F7D7A8'],pat:'sun',
   tracks:[['Slow Afternoon','3:42'],['Glasshouse','4:05'],['Paper Moons','3:18'],['Back Porch','4:51'],['Low Light','5:12']]},
  {id:'nb',title:'Night Bus',artist:'Old Coast',year:2024,pal:['#16181C','#E8D44D','#343944'],pat:'windows',
   tracks:[['Night Bus','3:56'],['Northbound','4:22'],['Sodium','3:31'],['Empty Platform','4:08']]},
  {id:'oc',title:'Overcast',artist:'Hollis Grey',year:2026,pal:['#A3B4BE','#EEF2F4','#5C6F7B'],pat:'circles',
   tracks:[['Overcast','3:21'],['Second Floor','3:44'],['Weekday','2:58'],['Kettle','3:09'],['Loose Thread','4:15']]},
  {id:'rb',title:'Run It Back',artist:'Tala Moreno',year:2025,pal:['#FF6B3D','#FFD9CB','#1E1E1E'],pat:'stripes',
   tracks:[['Run It Back','3:12'],['Daylight Savings','3:27'],['Heatwave','2:54'],['Ten Miles','3:48']]},
  {id:'tl',title:'Tidal',artist:'Juno & the Lakes',year:2024,pal:['#0F4C5C','#5FB3B3','#DDEFEB'],pat:'waves',
   tracks:[['Tidal','4:33'],['Undertow','4:02'],['Saltwater','3:39'],['Harbour Lights','5:01']]},
  {id:'gc',title:'Good Company',artist:'The Fairweathers',year:2022,pal:['#F3C969','#B23A48','#FFF6DC'],pat:'half',
   tracks:[['Good Company','3:05'],['Sunday Paper','3:33'],['Hometown','3:50'],['Last Orders','4:12']]},
];
const TRACKS = {}; const ALB = {};
ALBUMS.forEach(a=>{ALB[a.id]=a; a.ids=a.tracks.map(([t,d],i)=>{const [m,s]=d.split(':').map(Number);const id=a.id+'-'+i;TRACKS[id]={id,title:t,artist:a.artist,album:a.id,dur:m*60+s};return id;});});
const PLAYLISTS = [
  {id:'liked',name:'Liked songs'},
  {id:'focus',name:'Focus',desc:'Instrumental, low tempo',ids:['fn-0','fn-1','qm-0','ll-0','fn-2','qm-1','ll-4','tl-0','qm-3','fn-3','ll-1']},
  {id:'run',name:'Morning run',desc:'Around 165 bpm',ids:['rb-0','rb-2','nb-0','gc-0','rb-1','nb-2','rb-3','gc-2','oc-2']},
  {id:'kitchen',name:'Sunday kitchen',desc:'Cooking and coffee',ids:['gc-1','oc-0','oc-3','ll-2','gc-3','tl-2','oc-1','ll-3']},
  {id:'drive',name:'Late drive',desc:'After 10 pm',ids:['nb-1','nb-3','tl-3','qm-2','ll-4','tl-1','nb-0','qm-3']},
];
const PL = Object.fromEntries(PLAYLISTS.map(p=>[p.id,p]));

/* ---------- state ---------- */
const KEY='tempo:v1';
function defaults(){
  const list=PL.focus.ids;
  return {view:'lib',libMode:'playlists',open:null,current:'fn-1',pos:108,playing:false,
    history:list.slice(0,1),queue:list.slice(2),ctx:{type:'pl',id:'focus'},shuffle:false,repeat:'off',
    liked:['fn-1','ll-0','nb-0','oc-3','rb-0','tl-3','qm-0','gc-1','ll-2','fn-3'],
    recent:['fn','qm','nb','oc','rb','tl','ll','gc'],vol:70};
}
let S; try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=defaults();}
if(!TRACKS[S.current]) S=defaults();
S.playing=false; S.open=S.open||null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtLong=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';};
const total=ids=>ids.reduce((a,id)=>a+TRACKS[id].dur,0);
const songs=n=>n+(n===1?' song':' songs');
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
const ctxIds=c=>c.type==='al'?ALB[c.id].ids:c.id==='liked'?S.liked.slice():PL[c.id].ids;
const ctxName=c=>c.type==='al'?ALB[c.id].title:PL[c.id].name;

/* ---------- artwork, drawn per album ---------- */
const artCache={};
function artSVG(aid){
  if(artCache[aid]) return artCache[aid];
  const a=ALB[aid],[bg,c1,c2]=a.pal; let s='';
  switch(a.pat){
    case 'sun': s=`<circle cx="50" cy="50" r="23" fill="${c1}"/><rect y="60" width="100" height="40" fill="${c2}"/><rect y="68" width="100" height="3" fill="${bg}" opacity=".35"/><rect y="78" width="100" height="4" fill="${bg}" opacity=".25"/><rect y="90" width="100" height="5" fill="${bg}" opacity=".18"/>`;break;
    case 'windows':{const r=rng(hash(aid));for(let y=0;y<6;y++)for(let x=0;x<5;x++){const lit=r()>.62;s+=`<rect x="${11+x*17}" y="${12+y*14}" width="11" height="8" rx="1.5" fill="${lit?c1:c2}"/>`;}break;}
    case 'arcs': [88,70,52,34,16].forEach((rad,i)=>s+=`<circle cx="0" cy="100" r="${rad}" fill="${i%2?bg:(i%4?c2:c1)}"/>`);s+=`<circle cx="76" cy="24" r="8" fill="${c2}"/>`;break;
    case 'circles': s=`<circle cx="38" cy="52" r="27" fill="${c1}"/><circle cx="62" cy="48" r="27" fill="${c2}" opacity=".85"/>`;break;
    case 'stripes': for(let i=-3;i<7;i++) s+=`<path d="M${i*20} 100L${i*20+46} 0h10L${i*20+10} 100Z" fill="${i%2?c1:c2}" opacity="${i%2?1:.9}"/>`;break;
    case 'waves': [38,52,66,80].forEach((y,i)=>s+=`<path d="M0 ${y}Q12.5 ${y-9} 25 ${y}T50 ${y}T75 ${y}T100 ${y}V100H0Z" fill="${i%2?c2:c1}" opacity="${.55+i*.15}"/>`);break;
    case 'grid': for(let y=0;y<4;y++)for(let x=0;x<4;x++){const on=(x===2&&y===1)||(x===1&&y===2);s+=`<rect x="${14+x*19}" y="${14+y*19}" width="14" height="14" rx="3" fill="${on?c1:'none'}" stroke="${on?c1:c2}" stroke-opacity="${on?1:.35}" stroke-width="1.2"/>`;}break;
    case 'half': s=`<path d="M10 72a40 40 0 0 1 80 0Z" fill="${c1}"/><rect x="10" y="76" width="80" height="4" rx="2" fill="${c1}"/><circle cx="72" cy="26" r="9" fill="${c2}"/>`;break;
  }
  return artCache[aid]=`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/>${s}</svg>`;
}
function plCover(p){
  if(p.id==='liked') return `<div class="liked-cover">${I.heart}</div>`;
  const al=[...new Set(p.ids.map(id=>TRACKS[id].album))].slice(0,4);
  while(al.length<4) al.push(al[al.length%Math.max(1,al.length)]);
  return `<div class="mosaic">${al.map(a=>artSVG(a)).join('')}</div>`;
}
const art=(tid,cls='')=>`<span class="art ${cls}">${artSVG(TRACKS[tid].album)}</span>`;
const curEq=id=>id===S.current?eq:'';

/* ---------- playback (simulated clock; no audio files are bundled) ---------- */
function startTrack(id){S.current=id;S.pos=0;const al=TRACKS[id].album;S.recent=[al,...S.recent.filter(a=>a!==al)].slice(0,8);}
function playFrom(ctx,tid,shuffle){
  const list=ctxIds(ctx); if(!list.length) return;
  if(shuffle!==undefined) S.shuffle=shuffle;
  let id=tid||(S.shuffle?list[Math.floor(Math.random()*list.length)]:list[0]);
  const i=list.indexOf(id);
  S.ctx=ctx; S.history=list.slice(0,i);
  const rest=list.slice(i+1); S.queue=S.shuffle?shuffled([...rest,...list.slice(0,i)]):rest;
  if(S.shuffle) S.history=[];
  startTrack(id); S.playing=true; render(); save();
}
function next(auto){
  if(auto&&S.repeat==='one'){S.pos=0;return render();}
  if(S.queue.length){S.history.push(S.current);startTrack(S.queue.shift());}
  else if(S.repeat==='all'){const list=ctxIds(S.ctx);const order=S.shuffle?shuffled(list):list;S.history.push(S.current);startTrack(order[0]);S.queue=order.slice(1);}
  else if(auto){S.playing=false;S.pos=0;}
  else {S.pos=TRACKS[S.current].dur;S.playing=false;}
  render();save();
}
function prev(){
  if(S.pos>3||!S.history.length){S.pos=0;}
  else{S.queue.unshift(S.current);S.current=S.history.pop();S.pos=0;}
  render();save();
}
function toggleShuffle(){
  S.shuffle=!S.shuffle;
  if(S.shuffle) S.queue=shuffled(S.queue);
  else{const list=ctxIds(S.ctx);S.queue.sort((a,b)=>{const ia=list.indexOf(a),ib=list.indexOf(b);return(ia<0?1e4:ia)-(ib<0?1e4:ib);});}
  toast(S.shuffle?'Shuffle on':'Shuffle off');render();save();
}
function cycleRepeat(){S.repeat={off:'all',all:'one',one:'off'}[S.repeat];toast({off:'Repeat off',all:'Repeating queue',one:'Repeating this song'}[S.repeat]);render();save();}
function togglePlay(){if(S.pos>=TRACKS[S.current].dur-.5)S.pos=0;S.playing=!S.playing;render();save();}
function toggleLike(id){const i=S.liked.indexOf(id);if(i>=0)S.liked.splice(i,1);else S.liked.unshift(id);toast(i>=0?'Removed from Liked songs':'Added to Liked songs');render();save();}

let last=performance.now(),saveT=0,dragging=false;
setInterval(()=>{
  const now=performance.now(),dt=(now-last)/1000;last=now;
  if(!S.playing) return;
  S.pos+=dt;
  if(S.pos>=TRACKS[S.current].dur){ if(dragging){S.pos=TRACKS[S.current].dur;return;} next(true);return; }
  progress(); if((saveT+=dt)>3){saveT=0;save();}
},250);

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('playing',S.playing);
  $('#app').dataset.view=S.view;
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===S.view||(S.view==='now'&&t.dataset.tab==='lib'&&innerWidth>=768);on?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current');});
  renderNow(); renderQueue(); renderMini(); renderLib(); progress();
  const t=TRACKS[S.current]; document.title=(S.playing?'▶ ':'')+t.title+' · '+t.artist;
}

function renderNow(){
  const t=TRACKS[S.current],a=ALB[t.album],liked=S.liked.includes(t.id),nx=S.queue[0];
  const r=rng(hash(t.id)),N=56;let bars='';
  for(let i=0;i<N;i++){const x=i/(N-1),env=.35+.65*Math.sin(Math.PI*Math.min(1,x*1.08))**.6;bars+=`<i style="height:${Math.round((.18+.82*env*(.45+.55*r()))*100)}%"></i>`;}
  $('#p-now').style.setProperty('--tint',`color-mix(in srgb, ${a.pal[1]} 16%, #F1F0EC)`);
  $('#p-now').innerHTML=`
    <header class="np-top">
      <button class="icon-btn np-close" data-act="tab" data-v="lib" aria-label="Close player">${I.down}</button>
      <div class="ctx"><small>Playing from ${S.ctx.type==='al'?'album':'playlist'}</small><button data-act="open" data-t="${S.ctx.type}" data-id="${S.ctx.id}">${esc(ctxName(S.ctx))}</button></div>
      <button class="icon-btn np-queue" data-act="tab" data-v="queue" aria-label="Open queue">${I.queue}</button>
    </header>
    <div class="np-body">
      <div class="art np-art">${artSVG(t.album)}</div>
      <div class="np-meta">
        <div class="txt"><h2 class="np-title">${esc(t.title)}</h2><button class="np-artist" data-act="open" data-t="al" data-id="${a.id}">${esc(t.artist)} · ${esc(a.title)}</button></div>
        <button class="icon-btn heart" data-act="like" data-id="${t.id}" aria-pressed="${liked}" aria-label="${liked?'Remove from':'Add to'} Liked songs">${I.heart}</button>
      </div>
      <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="${t.dur}">${bars}<span class="head"></span></div>
      <div class="times mono"><span id="t-el">0:00</span><span id="t-rem">-0:00</span></div>
      <div class="controls">
        <button class="icon-btn mode" data-act="shuffle" aria-pressed="${S.shuffle}" aria-label="Shuffle">${I.shuffle}</button>
        <button class="icon-btn" data-act="prev" aria-label="Previous">${I.prev}</button>
        <button class="play-btn" data-act="toggle" aria-label="${S.playing?'Pause':'Play'}">${S.playing?I.pause:I.play}</button>
        <button class="icon-btn" data-act="next" aria-label="Next">${I.next}</button>
        <button class="icon-btn mode" data-act="repeat" aria-pressed="${S.repeat!=='off'}" aria-label="Repeat: ${S.repeat}">${S.repeat==='one'?I.repeat1:I.repeat}</button>
      </div>
      <div class="vol">${I.volLo}<input type="range" id="vol" min="0" max="100" value="${S.vol}" aria-label="Volume" style="--v:${S.vol}%">${I.volHi}</div>
      ${nx?`<button class="upnext" data-act="tab" data-v="queue"><span class="art">${artSVG(TRACKS[nx].album)}</span><span class="txt"><span class="lbl">Up next · ${esc(TRACKS[nx].artist)}</span><span class="t1">${esc(TRACKS[nx].title)}</span></span>${I.right}</button>`
           :`<button class="upnext" data-act="tab" data-v="lib"><span class="art"><span class="liked-cover" style="background:var(--inset)">${I.plus}</span></span><span class="txt"><span class="lbl">Up next</span><span class="t1">Nothing queued</span></span>${I.right}</button>`}
    </div>`;
  bindWave();
}

function renderQueue(){
  const t=TRACKS[S.current];
  const rows=S.queue.map((id,i)=>{const q=TRACKS[id];return `
    <li class="row" data-i="${i}">
      <button class="row-main" data-act="jump" data-i="${i}">${art(id)}<span class="txt"><span class="t1">${esc(q.title)}</span><span class="t2">${esc(q.artist)}</span></span></button>
      <span class="dur mono">${fmt(q.dur)}</span>
      <div class="trail"><button class="icon-btn sm" data-act="remove" data-i="${i}" aria-label="Remove ${esc(q.title)} from queue">${I.x}</button>
      <span class="grip" data-i="${i}" aria-hidden="true">${I.grip}</span></div>
    </li>`;}).join('');
  $('#p-queue').innerHTML=`
    <div class="pane-switch seg" role="group" aria-label="Show"><button data-act="tab" data-v="lib" aria-pressed="false">Library</button><button data-act="tab" data-v="queue" aria-pressed="true">Queue</button></div>
    <header class="top"><h2 class="page-title">Queue</h2><button class="text-btn" data-act="clear" ${S.queue.length?'':'disabled'}>Clear</button></header>
    <div class="sec-row" style="margin-top:0"><h3 class="sec-title">Now playing</h3></div>
    <div class="card q-now">
      <span class="art">${artSVG(t.album)}</span>
      <div class="txt"><span class="t1">${esc(t.title)}</span><span class="t2">${esc(t.artist)}</span><span class="ctx-line">From ${esc(ctxName(S.ctx))}</span></div>
      ${eq}
    </div>
    <div class="sec-row"><h3 class="sec-title">Up next</h3><span class="sec-meta mono">${S.queue.length?songs(S.queue.length)+' · '+fmtLong(total(S.queue)):''}</span></div>
    ${S.queue.length?`<ol class="card list q-list" id="qlist">${rows}</ol>`
      :`<div class="card empty"><img src="${emoji3d('🎧')}" alt="" width="96" height="96" onerror="this.outerHTML='<span class=emo>🎧</span>'"><h3>Nothing up next</h3><p>Pick a playlist or album, or add songs from your library.</p><button class="btn btn-primary" data-act="tab" data-v="lib">Browse library</button></div>`}`;
  bindDrag();
}

function renderMini(){
  const t=TRACKS[S.current];
  $('#mini').innerHTML=`
    <button class="mini-open" data-act="tab" data-v="now" aria-label="Open player: ${esc(t.title)}">${art(t.id)}<span class="txt"><span class="t1">${esc(t.title)}</span><span class="t2">${esc(t.artist)}</span></span></button>
    <button class="icon-btn" data-act="next" aria-label="Next">${I.next}</button>
    <button class="play-btn" data-act="toggle" aria-label="${S.playing?'Pause':'Play'}">${S.playing?I.pause:I.play}</button>
    <span class="mini-bar"><i id="mini-bar"></i></span>`;
}

function trackRow(id,extra=''){
  const t=TRACKS[id];
  return `<li class="row ${id===S.current?'is-cur':''}">
    <button class="row-main" data-act="play" data-id="${id}" ${extra}>${art(id)}<span class="txt"><span class="t1">${curEq(id)}${esc(t.title)}</span><span class="t2">${esc(t.artist)}</span></span></button>
    <span class="dur mono">${fmt(t.dur)}</span>
    <div class="trail"><button class="icon-btn sm" data-act="addq" data-id="${id}" aria-label="Add ${esc(t.title)} to queue">${I.plus}</button></div>
  </li>`;
}

function renderLib(){
  const q=$('#q').value.trim().toLowerCase(), body=$('#lib-body');
  $('#q-clear').hidden=!q;
  const showHead=!S.open||q; $('#lib-search').hidden=!showHead; $('#lib-head').hidden=!showHead;
  if(q){
    const hits=Object.values(TRACKS).filter(t=>(t.title+' '+t.artist+' '+ALB[t.album].title).toLowerCase().includes(q));
    const pls=PLAYLISTS.filter(p=>p.name.toLowerCase().includes(q));
    const als=ALBUMS.filter(a=>(a.title+' '+a.artist).toLowerCase().includes(q));
    if(!hits.length&&!pls.length&&!als.length){body.innerHTML=`<div class="empty"><img src="${emoji3d('🔍')}" alt="" width="96" height="96" onerror="this.outerHTML='<span class=emo>🔍</span>'"><h3>No results for “${esc(q)}”</h3><p>Try a song title, an album or an artist’s name.</p></div>`;return;}
    body.dataset.ctx='search';
    body.innerHTML=`${pls.length||als.length?`<div class="sec-row"><h3 class="sec-title">Playlists and albums</h3></div><ul class="card list lib-list">${pls.map(plRow).join('')}${als.map(alRow).join('')}</ul>`:''}
      ${hits.length?`<div class="sec-row"><h3 class="sec-title">Songs</h3><span class="sec-meta mono">${songs(hits.length)}</span></div><ul class="card list">${hits.map(t=>trackRow(t.id,'data-ctx="al"')).join('')}</ul>`:''}`;
    return;
  }
  if(S.open){
    const isAl=S.open.t==='al', o=isAl?ALB[S.open.id]:PL[S.open.id], ids=isAl?o.ids:(o.id==='liked'?S.liked:o.ids);
    const isCtx=S.ctx.type===S.open.t&&S.ctx.id===S.open.id;
    const playing=isCtx&&S.playing;
    body.innerHTML=`
      <div class="detail-top"><button class="icon-btn" data-act="close" aria-label="Back to library">${I.back}</button><span>${isAl?'Album':'Playlist'}</span></div>
      <div class="hero">
        <div class="art">${isAl?artSVG(o.id):plCover(o)}</div>
        <h2>${esc(isAl?o.title:o.name)}</h2>
        <p class="by">${esc(isAl?o.artist:(o.id==='liked'?'Songs you’ve hearted':o.desc))}</p>
        <p class="meta mono">${isAl?o.year+' · ':''}${songs(ids.length)} · ${fmtLong(total(ids))}</p>
        ${ids.length?`<div class="actions">
          <button class="btn btn-primary" data-act="${isCtx?'toggle':'playctx'}">${playing?I.pause+'Pause':I.play+(isCtx?'Resume':'Play')}</button>
          <button class="btn btn-ghost" data-act="shufflectx">${I.shuffle}Shuffle</button></div>`:''}
      </div>
      ${ids.length?`<ul class="card list" style="margin-top:24px">${ids.map(id=>trackRow(id)).join('')}</ul>`
        :`<div class="empty"><img src="${emoji3d('💚')}" alt="" width="96" height="96" onerror="this.outerHTML='<span class=emo>💚</span>'"><h3>No liked songs yet</h3><p>Tap the heart on the player to save a song here.</p></div>`}`;
    return;
  }
  const mode=S.libMode;
  body.innerHTML=`
    <div class="seg" role="group" aria-label="Show">
      <button data-act="mode" data-m="playlists" aria-pressed="${mode==='playlists'}">Playlists</button>
      <button data-act="mode" data-m="albums" aria-pressed="${mode==='albums'}">Albums</button>
    </div>
    <div class="sec-row"><h3 class="sec-title">Recently played</h3></div>
    <div class="hscroll">${S.recent.map(aid=>{const a=ALB[aid];return `<button class="tile" data-act="open" data-t="al" data-id="${aid}"><span class="art">${artSVG(aid)}</span><span class="txt"><span class="t1">${esc(a.title)}</span><span class="t2">${esc(a.artist)}</span></span></button>`;}).join('')}</div>
    <div class="sec-row"><h3 class="sec-title">${mode==='playlists'?'Your playlists':'Albums'}</h3><span class="sec-meta mono">${mode==='playlists'?PLAYLISTS.length+' playlists':ALBUMS.length+' albums'}</span></div>
    <ul class="card list lib-list">${mode==='playlists'?PLAYLISTS.map(plRow).join(''):ALBUMS.map(alRow).join('')}</ul>`;
}
function plRow(p){
  const ids=p.id==='liked'?S.liked:p.ids, on=S.ctx.type==='pl'&&S.ctx.id===p.id;
  return `<li class="row ${on?'is-cur':''}"><button class="row-main" data-act="open" data-t="pl" data-id="${p.id}"><span class="art">${plCover(p)}</span><span class="txt"><span class="t1">${on?eq:''}${esc(p.name)}</span><span class="t2">${songs(ids.length)} · ${fmtLong(total(ids))}</span></span></button><span class="chev">${I.right}</span></li>`;
}
function alRow(a){
  const on=S.ctx.type==='al'&&S.ctx.id===a.id;
  return `<li class="row ${on?'is-cur':''}"><button class="row-main" data-act="open" data-t="al" data-id="${a.id}"><span class="art">${artSVG(a.id)}</span><span class="txt"><span class="t1">${on?eq:''}${esc(a.title)}</span><span class="t2">${esc(a.artist)} · ${a.year}</span></span></button><span class="chev">${I.right}</span></li>`;
}
function emoji3d(e){return 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/'+[...e].map(c=>c.codePointAt(0).toString(16)).join('-')+'.webp';}

function progress(){
  const t=TRACKS[S.current],p=Math.min(1,S.pos/t.dur);
  const w=$('#wave'); if(w){const bars=w.children,n=bars.length-1;for(let i=0;i<n;i++)bars[i].classList.toggle('on',(i+.5)/n<=p);
    w.querySelector('.head').style.left=`calc(${p*100}% - 1.5px)`;w.setAttribute('aria-valuenow',Math.floor(S.pos));w.setAttribute('aria-valuetext',fmt(S.pos)+' of '+fmt(t.dur));}
  const el=$('#t-el'); if(el){el.textContent=fmt(S.pos);$('#t-rem').textContent='-'+fmt(t.dur-Math.floor(S.pos));}
  const mb=$('#mini-bar'); if(mb) mb.style.width=p*100+'%';
}

/* ---------- interactions ---------- */
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'toggle': togglePlay();break;
    case 'next': next(false);break;
    case 'prev': prev();break;
    case 'shuffle': toggleShuffle();break;
    case 'repeat': cycleRepeat();break;
    case 'like': toggleLike(id); requestAnimationFrame(()=>$('.heart')?.classList.add('pop'));break;
    case 'tab': S.view=b.dataset.v; if(S.view==='lib'&&innerWidth>=1100){} render();save();scrollTo(0,0);break;
    case 'mode': S.libMode=b.dataset.m;render();save();break;
    case 'open': $('#q').value='';S.open={t:b.dataset.t,id};if(innerWidth<768||S.view==='queue')S.view='lib';render();save();$('#p-lib').scrollTop=0;scrollTo(0,0);break;
    case 'close': S.open=null;render();save();break;
    case 'play':{
      if(S.open&&!$('#q').value.trim()) playFrom({type:S.open.t,id:S.open.id},id);
      else playFrom({type:'al',id:TRACKS[id].album},id);
      break;}
    case 'playctx': playFrom({type:S.open.t,id:S.open.id},null,false);break;
    case 'shufflectx': playFrom({type:S.open.t,id:S.open.id},null,true);break;
    case 'addq': S.queue.push(id);toast('Added to queue');render();save();break;
    case 'remove': S.queue.splice(+b.dataset.i,1);render();save();break;
    case 'jump':{const i=+b.dataset.i;S.history.push(S.current,...S.queue.slice(0,i));const nid=S.queue[i];S.queue=S.queue.slice(i+1);startTrack(nid);S.playing=true;render();save();break;}
    case 'clear': S.queue=[];toast('Queue cleared');render();save();break;
  }
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{S.view=t.dataset.tab;if(S.view==='lib'&&S.open&&document.activeElement===t&&$('#app').dataset.view==='lib'){}render();save();scrollTo(0,0);}));
$('#q').addEventListener('input',()=>{renderLib();});
$('#q-clear').addEventListener('click',()=>{$('#q').value='';renderLib();$('#q').focus();});
document.addEventListener('input',e=>{if(e.target.id==='vol'){S.vol=+e.target.value;e.target.style.setProperty('--v',S.vol+'%');save();}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input')) return;
  if(e.code==='Space'&&!e.target.matches('button')){e.preventDefault();togglePlay();}
});

function bindWave(){
  const w=$('#wave'); if(!w) return;
  const seek=x=>{const r=w.getBoundingClientRect();S.pos=Math.max(0,Math.min(1,(x-r.left)/r.width))*TRACKS[S.current].dur;progress();};
  w.addEventListener('pointerdown',e=>{w.setPointerCapture(e.pointerId);dragging=true;seek(e.clientX);});
  w.addEventListener('pointermove',e=>{if(w.hasPointerCapture(e.pointerId))seek(e.clientX);});
  w.addEventListener('pointerup',()=>{dragging=false;save();});
  w.addEventListener('pointercancel',()=>{dragging=false;});
  w.addEventListener('keydown',e=>{const d=TRACKS[S.current].dur;
    if(e.key==='ArrowRight'){S.pos=Math.min(d-1,S.pos+5);}else if(e.key==='ArrowLeft'){S.pos=Math.max(0,S.pos-5);}
    else if(e.key==='Home'){S.pos=0;}else if(e.key==='End'){S.pos=d-1;}else return;
    e.preventDefault();progress();save();});
}

function bindDrag(){
  const list=$('#qlist'); if(!list) return;
  list.querySelectorAll('.grip').forEach(g=>g.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const row=g.closest('.row'),rows=[...list.children],from=rows.indexOf(row),h=row.offsetHeight;
    let to=from; const y0=e.clientY; dragging=true;
    g.setPointerCapture(e.pointerId); row.classList.add('dragging');
    rows.forEach(r=>r!==row&&r.classList.add('shift'));
    const move=ev=>{
      const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`;
      to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
      rows.forEach((r,i)=>{if(r===row)return;let s=0;if(from<to&&i>from&&i<=to)s=-h;if(from>to&&i<from&&i>=to)s=h;r.style.transform=s?`translateY(${s}px)`:'';});
    };
    const up=()=>{
      g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
      dragging=false;
      if(to!==from){const [m]=S.queue.splice(from,1);S.queue.splice(to,0,m);save();}
      renderQueue(); renderNow(); progress();
    };
    g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  }));
}
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,150);});
render();
</script>
</body>
</html>
