<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprint 14 · Checkout redesign · Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Look: monochrome. Light grey canvas, white cards, black controls, one tomato accent.
   Character: calm, exact, quick. Signature: status glyphs (dashed → half → full circle) shared by columns, progress bar and the task form. */
:root {
  --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --canvas: #F5F5F4; --surface: #FFFFFF; --surface-2: #F0F0EF; --col: #EBEBEA;
  --line: rgba(17,17,17,.09); --line-2: rgba(17,17,17,.14);
  --text: #111111; --text-2: #5F5F5F; --text-3: #707070;
  --brand: #111111; --on-brand: #FFFFFF;
  --accent: #FF5C35; --accent-ink: #C7360F; --accent-tint: #FFEDE7;
  --ok: #15803D; --ok-tint: #E7F6EC; --warn: #A15C00; --warn-tint: #FDF1DC; --bad: #C81E1E; --bad-tint: #FDECEC;
  --st-backlog: #A3A3A3; --st-todo: #6B6B6B; --st-progress: #E39A0B; --st-review: #2F6FEB; --st-done: #16A34A;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(17,17,17,.05), 0 1px 1px rgba(17,17,17,.03);
  --sh-2: 0 1px 2px rgba(17,17,17,.05), 0 8px 18px -6px rgba(17,17,17,.14);
  --sh-float: 0 2px 6px rgba(17,17,17,.06), 0 24px 48px -12px rgba(17,17,17,.24);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--text); background: var(--canvas); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Shell */
.app { display: grid; grid-template-columns: 64px minmax(0, 1fr); height: 100dvh; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; border-right: 1px solid var(--line); background: var(--canvas); }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; margin-bottom: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--sh-1); }
.rail-btn { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); transition: background-color .15s, color .15s; }
.rail-btn:hover { background: var(--surface-2); color: var(--text); }
.rail-btn[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1), inset 0 0 0 1px var(--line); }
.rail-spacer { flex: 1; }
.rail .me { width: 36px; height: 36px; margin-top: 8px; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.crumbs svg { color: var(--text-3); }
.title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.title span { color: var(--text-3); font-weight: 500; }
.head-actions { display: flex; align-items: center; gap: 10px; flex: none; }

.stack { display: flex; }
.stack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--canvas); }
.stack .av:first-child { margin-left: 0; }
.av { width: 24px; height: 24px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #3a3a3a; }
.av img { width: 100%; height: 100%; }
.av-md { width: 32px; height: 32px; font-size: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-weight: 500; font-size: 14px; white-space: nowrap; transition: background-color .15s, box-shadow .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(17,17,17,.2), 0 6px 14px -6px rgba(17,17,17,.4); }
.btn-primary:hover { background: #2a2a2a; }
.btn-ghost { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-1); }
.btn-ghost:hover { background: #FAFAFA; }
.btn-danger { color: var(--bad); padding: 0 10px; }
.btn-danger:hover { background: var(--bad-tint); }
.icon-btn { width: 36px; padding: 0; }
.btn-close { color: var(--text-2); }
.btn-close:hover { background: var(--surface-2); color: var(--text); }
.kbd { font-family: var(--mono); font-size: 12px; line-height: 1; padding: 3px 5px; border-radius: 5px; background: rgba(255,255,255,.14); color: rgba(255,255,255,.78); }

/* Sprint summary */
.sprint { display: flex; align-items: center; gap: 24px; padding: 14px 16px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-1), inset 0 0 0 1px var(--line); }
.sprint-meta { display: flex; gap: 24px; flex: none; }
.meta-label { font-size: 12px; color: var(--text-2); }
.meta-value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.meta-value small { font-size: 13px; font-weight: 500; color: var(--text-3); }
.sprint-bar { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; gap: 3px; height: 8px; }
.seg i { border-radius: 3px; min-width: 6px; transition: flex-grow .3s ease; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); overflow-x: auto; scrollbar-width: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend b { font-family: var(--mono); font-weight: 500; color: var(--text); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.search { position: relative; flex: none; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search input { height: 36px; width: 240px; border-radius: var(--r-sm); border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); padding: 0 36px 0 32px; font-size: 14px; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--text), 0 0 0 3px rgba(17,17,17,.08); }
.search .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--surface-2); color: var(--text-2); }
.divider { width: 1px; height: 20px; background: var(--line-2); flex: none; margin: 0 4px; }
.who { display: flex; gap: 2px; flex: none; }
.who button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; transition: background-color .15s; }
.who button:hover { background: var(--surface-2); }
.who button .av { width: 28px; height: 28px; transition: box-shadow .15s, opacity .15s; }
.who.filtering button[aria-pressed="false"] .av { opacity: .4; }
.who button[aria-pressed="true"] .av { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--text); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; color: var(--text-2); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; flex: none; transition: background-color .15s, color .15s, box-shadow .15s; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--text); color: #fff; box-shadow: none; }
.clear { font-size: 13px; color: var(--text-2); padding: 0 8px; height: 32px; flex: none; white-space: nowrap; }
.clear:hover { color: var(--text); text-decoration: underline; }
.result { font-size: 13px; color: var(--text-3); margin-left: auto; white-space: nowrap; flex: none; }

/* Board */
.board { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 16px 24px 24px; overflow-x: auto; }
.column { flex: 1 1 0; min-width: 252px; display: flex; flex-direction: column; min-height: 0; background: var(--col); border-radius: var(--r-lg); padding: 6px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 10px 10px; }
.col-head h2 { font-size: 14px; font-weight: 600; }
.col-count { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.col-add { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.col-add:hover { background: rgba(17,17,17,.06); color: var(--text); }
.list { flex: 1; min-height: 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; border-radius: var(--r-md); transition: background-color .15s; scrollbar-width: thin; }
.list.over { background: rgba(17,17,17,.035); }
.add-row { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; margin-top: 4px; border-radius: var(--r-sm); font-size: 13px; color: var(--text-2); width: 100%; flex: none; }
.add-row:hover { background: rgba(17,17,17,.05); color: var(--text); }

.card { position: relative; background: var(--surface); border-radius: var(--r-md); padding: 12px 12px 10px; box-shadow: var(--sh-1), inset 0 0 0 1px var(--line); cursor: grab; text-align: left; width: 100%; flex: none; transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: var(--sh-2), inset 0 0 0 1px var(--line-2); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .35; }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--accent), var(--sh-2); } 100% { box-shadow: var(--sh-1), inset 0 0 0 1px var(--line); } }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.key { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.card h3 { font-size: 14px; font-weight: 500; line-height: 1.4; letter-spacing: -0.005em; }
.card .desc { text-wrap: balance; font-size: 13px; color: var(--text-2); margin-top: 4px; }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 24px; }
.card-foot .stack { margin-left: auto; }
.card-foot .stack .av { box-shadow: 0 0 0 2px var(--surface); }
.is-done h3 { color: var(--text-2); }
.placeholder { flex: none; border-radius: var(--r-md); border: 1.5px dashed rgba(17,17,17,.22); background: rgba(255,255,255,.4); }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.due { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: var(--r-xs); font-family: var(--mono); font-size: 12px; color: var(--text-2); background: var(--surface-2); white-space: nowrap; }
.due.late { background: var(--bad-tint); color: var(--bad); }
.due.today { background: var(--warn-tint); color: var(--warn); }
.prio { display: grid; place-items: center; width: 24px; height: 24px; border-radius: var(--r-xs); color: var(--text-2); }
.prio.urgent { color: var(--accent-ink); background: var(--accent-tint); }

.empty { flex: 1; display: grid; place-items: center; align-content: center; gap: 4px; text-align: center; padding: 24px 12px; margin: 2px; border-radius: var(--r-md); border: 1.5px dashed rgba(17,17,17,.14); color: var(--text-3); font-size: 13px; }
.empty strong { color: var(--text-2); font-weight: 500; }

/* Dialog */
.overlay { position: fixed; inset: 0; background: rgba(17,17,17,.32); display: grid; place-items: center; padding: 24px; z-index: 40; opacity: 0; transition: opacity .18s; }
.overlay.open { opacity: 1; }
.dialog { width: min(560px, 100%); max-height: calc(100dvh - 48px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-float); transform: translateY(8px) scale(.98); transition: transform .2s ease-out; }
.overlay.open .dialog { transform: none; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0 24px; }
.dlg-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.dlg-head .key { font-size: 13px; font-weight: 400; }
.dlg-body { padding: 16px 24px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.field > label, .field > .lbl { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 8px; }
.input { width: 100%; border: 0; border-radius: var(--r-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--text), 0 0 0 3px rgba(17,17,17,.08); }
.input.big { font-size: 16px; font-weight: 500; }
.input.err { box-shadow: inset 0 0 0 1px var(--bad), 0 0 0 3px rgba(200,30,30,.1); }
textarea.input { resize: vertical; min-height: 76px; }
.hint-err { font-size: 13px; color: var(--bad); margin-top: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; transition: background-color .15s, box-shadow .15s, color .15s; }
.opt:hover { color: var(--text); background: #FAFAFA; }
.opt[aria-checked="true"] { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--text); }
.opt .av { width: 22px; height: 22px; margin-left: -6px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--line); margin-top: 8px; }
.dlg-foot .grow { flex: 1; }

.cal { margin-top: 10px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); width: 100%; max-width: 300px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.cal-head button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.cal-head button:hover { background: rgba(17,17,17,.06); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .dow { font-size: 12px; color: var(--text-3); padding: 4px 0; }
.cal-grid button { height: 34px; border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cal-grid button:hover { background: rgba(17,17,17,.06); }
.cal-grid button.muted { color: var(--text-3); }
.cal-grid button.is-today { color: var(--accent-ink); font-weight: 600; }
.cal-grid button[aria-pressed="true"] { background: var(--text); color: #fff; }

/* Menu & toast */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 220px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-float), inset 0 0 0 1px var(--line); padding: 6px; z-index: 30; display: none; }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu .danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 14px; background: var(--text); color: #fff; padding: 10px 10px 10px 16px; border-radius: var(--r-sm); font-size: 14px; box-shadow: var(--sh-float); transition: opacity .2s, transform .2s; z-index: 50; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: #fff; font-weight: 500; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,.14); }
.toast button:hover { background: rgba(255,255,255,.22); }

.m-only { display: none; }

@media (max-width: 1100px) {
  .sprint-meta .hide-md { display: none; }
  .legend { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; row-gap: 6px; overflow: visible; }
}
@media (max-width: 767px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .m-only { display: inline-flex; }
  .topbar { padding: calc(12px + env(safe-area-inset-top)) 16px 0; gap: 12px; }
  .title { font-size: 20px; flex-direction: column; gap: 2px; }
  .title span { font-size: 14px; letter-spacing: 0; }
  .d-only, .btn .kbd, .search .kbd, .result { display: none; }
  .btn, .icon-btn { height: 44px; }
  .icon-btn { width: 44px; }
  .btn-label { display: none; }
  .btn-primary { width: 44px; padding: 0; }
  .sprint { flex-direction: column; align-items: stretch; gap: 14px; }
  .sprint-meta { justify-content: space-between; }
  .search input { width: 200px; height: 40px; font-size: 16px; }
  .who button { width: 44px; height: 44px; }
  .chip { height: 40px; }
  .clear { height: 40px; }
  .board { padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); scroll-snap-type: x mandatory; scroll-padding: 16px; }
  .column { flex: 0 0 84%; min-width: 0; scroll-snap-align: start; }
  .col-add { width: 40px; height: 40px; }
  .add-row { height: 44px; }
  .overlay { padding: 0; place-items: end stretch; }
  .dialog { width: 100%; max-height: 92dvh; border-radius: var(--r-lg) var(--r-lg) 0 0; transform: translateY(24px); }
  .dlg-body { padding: 12px 20px 8px; }
  .dlg-head { padding: 16px 12px 0 20px; }
  .dlg-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); }
  .row2 { grid-template-columns: 1fr; }
  .opt { height: 40px; }
  .input { font-size: 16px; }
  .cal { max-width: none; }
  .cal-grid button { height: 40px; }
  .toast { bottom: calc(16px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-label="Tally">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="3" height="12" rx="1.5" fill="#fff"/><rect x="7.5" y="3" width="3" height="8" rx="1.5" fill="#fff"/><rect x="13" y="3" width="3" height="5" rx="1.5" fill="#FF5C35"/></svg>
    </div>
    <button class="rail-btn" aria-label="Inbox" title="Inbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></button>
    <button class="rail-btn" aria-current="page" aria-label="Board" title="Board"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v12"/></svg></button>
    <button class="rail-btn" aria-label="Roadmap" title="Roadmap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h10M7 12h12M5 18h8"/></svg></button>
    <button class="rail-btn" aria-label="Calendar" title="Calendar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    <button class="rail-btn" aria-label="Reports" title="Reports"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></button>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (n, from = TODAY) => { const d = new Date(from); d.setDate(d.getDate() + n); return iso(d); };
const diff = (s) => Math.round((parse(s) - TODAY) / 864e5);
const fmt = (s, opts = { month: 'short', day: 'numeric' }) => parse(s).toLocaleDateString('en-US', opts);

const STATUSES = [
  { id: 'backlog', name: 'Backlog' },
  { id: 'todo', name: 'To do' },
  { id: 'progress', name: 'In progress' },
  { id: 'review', name: 'In review' },
  { id: 'done', name: 'Done' },
];
const TAGS = [
  { id: 'design', name: 'Design', c: '#E0457B' },
  { id: 'frontend', name: 'Frontend', c: '#2F6FEB' },
  { id: 'backend', name: 'Backend', c: '#0E9F9A' },
  { id: 'qa', name: 'QA', c: '#C98A0B' },
  { id: 'bug', name: 'Bug', c: '#C81E1E' },
];
const PRIOS = [
  { id: 0, name: 'None' }, { id: 1, name: 'Low' }, { id: 2, name: 'Medium' }, { id: 3, name: 'High' }, { id: 4, name: 'Urgent' },
];
const PEOPLE = [
  { id: 'maya', name: 'Maya Chen', role: 'Product manager', bg: 'ffd9cf' },
  { id: 'daniel', name: 'Daniel Ortiz', role: 'Product designer', bg: 'c9e4ff' },
  { id: 'priya', name: 'Priya Nair', role: 'Frontend engineer', bg: 'd4f2dc' },
  { id: 'sam', name: 'Sam Okafor', role: 'Backend engineer', bg: 'ffe7b0' },
  { id: 'lena', name: 'Lena Fischer', role: 'QA engineer', bg: 'e6defd' },
];
const person = (id) => PEOPLE.find((p) => p.id === id);
const SPRINT_START = addDays(-6), SPRINT_END = addDays(7);

const statusIcon = (id, size = 14) => {
  const c = `var(--st-${id})`;
  const ring = `<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6"${id === 'backlog' ? ' stroke-dasharray="2.2 1.9"' : ''}/>`;
  const fills = {
    progress: `<path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="${c}"/>`,
    review: `<path d="M7 3.5a3.5 3.5 0 1 1-3.5 3.5H7z" fill="${c}"/>`,
  };
  if (id === 'done') return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.3" fill="${c}"/><path d="m4.4 7.2 1.8 1.8 3.5-3.7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true">${ring}${fills[id] || ''}</svg>`;
};
const prioIcon = (p) => {
  if (p === 4) return `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="currentColor"/><path d="M7 4v3.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="10" r=".95" fill="#fff"/></svg>`;
  const bars = [[2, 8, 4], [6, 5, 7], [10, 2, 10]];
  return `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${bars.map(([x, y, h], i) => `<rect x="${x}" y="${y + 1}" width="2.4" height="${h}" rx="1" fill="currentColor" opacity="${i < p ? 1 : .25}"/>`).join('')}</svg>`;
};
const avatar = (p, cls = '') => {
  const initials = p.name.split(' ').map((w) => w[0]).join('');
  return `<span class="av ${cls}" style="background:#${p.bg}" title="${esc(p.name)}"><img src="https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(p.name)}&backgroundColor=${p.bg}" alt="${esc(p.name)}" width="32" height="32" loading="lazy" onerror="this.replaceWith(document.createTextNode('${initials}'))"></span>`;
};
const calIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;

function dueInfo(t) {
  if (!t.due) return null;
  const n = diff(t.due);
  if (t.status === 'done') return { cls: '', text: fmt(t.due) };
  if (n < 0) return { cls: 'late', text: `${-n}d overdue` };
  if (n === 0) return { cls: 'today', text: 'Today' };
  if (n === 1) return { cls: '', text: 'Tomorrow' };
  if (n < 7) return { cls: '', text: fmt(t.due, { weekday: 'short' }) };
  return { cls: '', text: fmt(t.due) };
}

/* ---------- Data ---------- */
const KEY = 'tally-board-v1';
function sample() {
  const T = (status, title, tag, who, d, prio, desc = '') => ({ status, title, tag, who, due: d === null ? null : addDays(d), prio, desc });
  const list = [
    T('backlog', 'Remember saved cards for returning buyers', 'backend', ['sam'], null, 1, 'Keep tokenised cards with the payment provider, not in our database'),
    T('backlog', 'Explore one-tap reorder from order history', 'design', ['daniel'], 16, 1),
    T('backlog', 'Track coupon usage in analytics', 'frontend', ['priya'], null, 0),
    T('todo', 'Address autocomplete for UK postcodes', 'backend', ['sam'], 4, 2),
    T('todo', 'Empty cart copy and illustration', 'design', ['daniel', 'maya'], 2, 1),
    T('todo', 'Order summary layout for tablets', 'frontend', ['priya'], 5, 2),
    T('todo', 'Regression test plan for 3.2', 'qa', ['lena'], 6, 3, 'Cover guest checkout, promo codes and all three payment methods.'),
    T('progress', 'Final checkout designs for handoff', 'design', ['daniel'], -1, 4, 'Mobile and desktop, including error and loading states.'),
    T('progress', 'Promo code field validation', 'frontend', ['priya'], 0, 3),
    T('progress', 'Shipping estimate endpoint', 'backend', ['sam'], 1, 3),
    T('review', 'Totals off by 1¢ on multi-currency carts', 'bug', ['sam', 'lena'], -2, 4, 'Rounding happens before conversion. Reported by support for EUR → GBP.'),
    T('review', 'Apple Pay button placement', 'frontend', ['priya', 'daniel'], 1, 2),
    T('done', 'Payment error states', 'design', ['daniel'], -2, 2),
    T('done', 'Guest checkout without an account', 'frontend', ['priya'], -3, 3),
    T('done', 'Cart badge count out of sync', 'bug', ['lena'], -4, 2),
    T('done', 'Checkout funnel events', 'backend', ['sam'], -5, 1),
  ];
  return { next: 158, tasks: list.map((t, i) => ({ id: 'CHK-' + (142 + i), ...t })) };
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { state = sample(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const filters = { q: '', who: new Set(), week: false, urgent: false };
const visible = (t) => {
  if (filters.q) { const q = filters.q.toLowerCase(); if (!t.title.toLowerCase().includes(q) && !t.id.toLowerCase().includes(q)) return false; }
  if (filters.who.size && !t.who.some((w) => filters.who.has(w))) return false;
  if (filters.week && (!t.due || t.status === 'done' || diff(t.due) > 6)) return false;
  if (filters.urgent && t.prio < 3) return false;
  return true;
};
const filtering = () => !!(filters.q || filters.who.size || filters.week || filters.urgent);

/* ---------- Render ---------- */
function cardHTML(t) {
  const tag = TAGS.find((g) => g.id === t.tag) || TAGS[0];
  const d = dueInfo(t);
  const people = t.who.map(person).filter(Boolean);
  const status = STATUSES.find((s) => s.id === t.status).name;
  return `<article class="card${t.status === 'done' ? ' is-done' : ''}" draggable="true" tabindex="0" role="button" data-id="${t.id}"
    aria-label="${esc(t.title)}, ${status}${d ? ', due ' + d.text : ''}">
    <div class="card-top"><span class="tag" style="--c:${tag.c}"><i></i>${tag.name}</span><span class="key">${t.id}</span></div>
    <h3>${esc(t.title)}</h3>
    ${t.desc ? `<p class="desc">${esc(t.desc)}</p>` : ''}
    <div class="card-foot">
      ${d ? `<span class="due ${d.cls}">${calIcon}${d.text}</span>` : ''}
      ${t.prio ? `<span class="prio${t.prio === 4 ? ' urgent' : ''}" title="${PRIOS[t.prio].name} priority"><span class="sr">${PRIOS[t.prio].name} priority</span>${prioIcon(t.prio)}</span>` : ''}
      <span class="stack">${people.map((p) => avatar(p)).join('')}</span>
    </div>
  </article>`;
}

function renderBoard() {
  const board = $('#board');
  board.innerHTML = STATUSES.map((s) => {
    const all = state.tasks.filter((t) => t.status === s.id);
    const shown = all.filter(visible);
    const count = filtering() ? `${shown.length}/${all.length}` : all.length;
    let body;
    if (shown.length) body = shown.map(cardHTML).join('');
    else if (all.length) body = `<div class="empty"><strong>No matching tasks</strong>${all.length} hidden by filters</div>`;
    else body = `<div class="empty"><strong>No tasks</strong>Drag a card here or add one</div>`;
    return `<section class="column" data-status="${s.id}" aria-label="${s.name}">
      <div class="col-head">${statusIcon(s.id)}<h2>${s.name}</h2><span class="col-count">${count}</span>
        <button class="col-add" data-add="${s.id}" aria-label="Add task to ${s.name}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="list" data-status="${s.id}">${body}</div>
      <button class="add-row" data-add="${s.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
    </section>`;
  }).join('');
}

function renderSummary() {
  const total = state.tasks.length;
  const by = Object.fromEntries(STATUSES.map((s) => [s.id, state.tasks.filter((t) => t.status === s.id).length]));
  const late = state.tasks.filter((t) => t.status !== 'done' && t.due && diff(t.due) < 0).length;
  const left = Math.max(0, diff(SPRINT_END));
  $('#sprintRange').textContent = `${fmt(SPRINT_START)} – ${fmt(SPRINT_END)}`;
  $('#mDone').innerHTML = `${by.done} <small>of ${total}</small>`;
  $('#mDays').innerHTML = `${left} <small>of ${diff(SPRINT_END) - diff(SPRINT_START)}</small>`;
  $('#mLate').innerHTML = late ? `<span style="color:var(--bad)">${late}</span> <small>tasks</small>` : `0 <small>tasks</small>`;
  $('#seg').innerHTML = total ? STATUSES.filter((s) => by[s.id]).map((s) => `<i style="flex-grow:${by[s.id]};background:var(--st-${s.id})" title="${s.name}: ${by[s.id]}"></i>`).join('') : `<i style="flex-grow:1;background:var(--col)"></i>`;
  $('#seg').setAttribute('aria-label', `${by.done} of ${total} tasks done; ` + STATUSES.map((s) => `${by[s.id]} ${s.name.toLowerCase()}`).join(', '));
  $('#legend').innerHTML = STATUSES.map((s) => `<span>${statusIcon(s.id, 12)}${s.name} <b>${by[s.id]}</b></span>`).join('');
}

function renderFilters() {
  const n = state.tasks.filter(visible).length;
  $('#who').classList.toggle('filtering', filters.who.size > 0);
  $('#who').innerHTML = PEOPLE.map((p) => `<button aria-pressed="${filters.who.has(p.id)}" data-who="${p.id}" aria-label="Show tasks for ${esc(p.name)}" title="${esc(p.name)}">${avatar(p)}</button>`).join('');
  $('#fWeek').setAttribute('aria-pressed', filters.week);
  $('#fUrgent').setAttribute('aria-pressed', filters.urgent);
  $('#fClear').hidden = !filtering();
  $('#result').textContent = filtering() ? `${n} of ${state.tasks.length} tasks` : '';
}

function render() { renderBoard(); renderSummary(); renderFilters(); }

$('#teamStack').innerHTML = PEOPLE.map((p) => avatar(p, 'av-md')).join('');
$('#meAvatar').outerHTML = avatar(PEOPLE[0], 'me');
render();

/* ---------- Filters ---------- */
$('#q').addEventListener('input', (e) => { filters.q = e.target.value.trim(); renderBoard(); renderFilters(); });
$('#who').addEventListener('click', (e) => {
  const b = e.target.closest('[data-who]'); if (!b) return;
  const id = b.dataset.who; filters.who.has(id) ? filters.who.delete(id) : filters.who.add(id);
  renderBoard(); renderFilters(); $(`[data-who="${id}"]`).focus();
});
$('#fWeek').onclick = () => { filters.week = !filters.week; renderBoard(); renderFilters(); };
$('#fUrgent').onclick = () => { filters.urgent = !filters.urgent; renderBoard(); renderFilters(); };
$('#fClear').onclick = () => { filters.q = ''; $('#q').value = ''; filters.who.clear(); filters.week = filters.urgent = false; renderBoard(); renderFilters(); };

/* ---------- Drag and drop ---------- */
let dragId = null; const ph = document.createElement('div'); ph.className = 'placeholder';
const board = $('#board');
board.addEventListener('dragstart', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  dragId = c.dataset.id; ph.style.height = c.offsetHeight + 'px';
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  requestAnimationFrame(() => c.classList.add('dragging'));
});
board.addEventListener('dragend', () => { dragId = null; ph.remove(); document.querySelectorAll('.dragging,.over').forEach((el) => el.classList.remove('dragging', 'over')); });
board.addEventListener('dragover', (e) => {
  if (!dragId) return;
  const col = e.target.closest('.column'); if (!col) return;
  e.preventDefault();
  const list = $('.list', col);
  document.querySelectorAll('.list.over').forEach((l) => l !== list && l.classList.remove('over'));
  list.classList.add('over');
  const empty = $('.empty', list); if (empty) empty.style.display = 'none';
  const cards = [...list.querySelectorAll('.card:not(.dragging)')];
  const after = cards.find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
  after ? list.insertBefore(ph, after) : list.appendChild(ph);
});
board.addEventListener('drop', (e) => {
  if (!dragId) return; e.preventDefault();
  const list = ph.parentElement; if (!list) return;
  let next = ph.nextElementSibling; while (next && (!next.classList.contains('card') || next.dataset.id === dragId)) next = next.nextElementSibling;
  moveTask(dragId, list.dataset.status, next ? next.dataset.id : null);
});
function moveTask(id, status, beforeId) {
  const i = state.tasks.findIndex((t) => t.id === id); const [t] = state.tasks.splice(i, 1);
  t.status = status;
  let at = beforeId ? state.tasks.findIndex((x) => x.id === beforeId) : -1;
  if (at < 0) { const lastSame = state.tasks.map((x) => x.status).lastIndexOf(status); at = lastSame + 1 || state.tasks.length; }
  state.tasks.splice(at, 0, t); save(); render();
  const el = $(`.card[data-id="${id}"]`); if (el) el.classList.add('flash');
}

/* ---------- Card & add clicks ---------- */
board.addEventListener('click', (e) => {
  const add = e.target.closest('[data-add]'); if (add) return openDialog(null, add.dataset.add);
  const c = e.target.closest('.card'); if (c) openDialog(c.dataset.id);
});
board.addEventListener('keydown', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDialog(c.dataset.id); }
});
$('#addBtn').onclick = () => openDialog(null, 'todo');

/* ---------- Dialog ---------- */
let draft = null, editing = null, calMonth = null, lastFocus = null;
function openDialog(id, status = 'todo') {
  lastFocus = document.activeElement;
  editing = id ? state.tasks.find((t) => t.id === id) : null;
  draft = editing ? { ...editing, who: [...editing.who] } : { title: '', desc: '', status, tag: 'frontend', who: ['maya'], due: addDays(3), prio: 2 };
  draft.showCal = false; draft.err = false;
  calMonth = parse(draft.due || iso(TODAY)); calMonth.setDate(1);
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeDialog(); });
  renderDialog(); requestAnimationFrame(() => ov.classList.add('open'));
  $('#fTitle').focus();
}
function closeDialog() {
  const ov = $('#overlay'); if (!ov) return;
  ov.classList.remove('open'); setTimeout(() => ov.remove(), 180);
  draft = editing = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
const dueChips = () => {
  const fri = (5 - TODAY.getDay() + 7) % 7 || 7, mon = (8 - TODAY.getDay()) % 7 || 7;
  return [['Today', iso(TODAY)], ['Tomorrow', addDays(1)], ['Friday', addDays(fri)], ['Next Mon', addDays(mon)]]
    .filter((v, i, a) => a.findIndex((x) => x[1] === v[1]) === i);
};
function calHTML() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - start + i); const s = iso(d);
    if (i >= 35 && d.getMonth() !== m) break;
    cells += `<button type="button" data-day="${s}" class="${d.getMonth() !== m ? 'muted' : ''}${s === iso(TODAY) ? ' is-today' : ''}" aria-pressed="${draft.due === s}" aria-label="${d.toDateString()}">${d.getDate()}</button>`;
  }
  return `<div class="cal"><div class="cal-head"><button type="button" data-cal="-1" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <span>${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
    <button type="button" data-cal="1" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
    <div class="cal-grid">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => `<span class="dow">${d}</span>`).join('')}${cells}</div></div>`;
}
function renderDialog() {
  const dlg = $('#overlay .dialog');
  const active = document.activeElement && dlg.contains(document.activeElement) ? document.activeElement : null;
  const focusKey = active && (active.id || active.dataset.k);
  const chips = dueChips(); const inChips = chips.some((c) => c[1] === draft.due);
  const opt = (k, v, checked, inner) => `<button type="button" class="opt" role="radio" data-k="${k}" data-v="${v}" aria-checked="${checked}">${inner}</button>`;
  dlg.innerHTML = `
    <div class="dlg-head"><h2 id="dlgTitle">${editing ? `Edit task <span class="key">${editing.id}</span>` : 'New task'}</h2>
      <button class="btn icon-btn btn-close" type="button" aria-label="Close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <form class="dlg-body" id="taskForm" novalidate>
      <div class="field"><label for="fTitle">Title</label><input id="fTitle" class="input big${draft.err ? ' err' : ''}" value="${esc(draft.title)}" placeholder="What needs doing?" maxlength="120" autocomplete="off" aria-invalid="${draft.err}">${draft.err ? '<p class="hint-err">Give the task a title</p>' : ''}</div>
      <div class="field"><label for="fDesc">Description</label><textarea id="fDesc" class="input" placeholder="Add details, links or acceptance criteria">${esc(draft.desc || '')}</textarea></div>
      <div class="field"><span class="lbl" id="lStatus">Status</span><div class="opts" role="radiogroup" aria-labelledby="lStatus">${STATUSES.map((s) => opt('status', s.id, draft.status === s.id, statusIcon(s.id) + s.name)).join('')}</div></div>
      <div class="field"><span class="lbl" id="lWho">Assignees</span><div class="opts" role="group" aria-labelledby="lWho">${PEOPLE.map((p) => `<button type="button" class="opt" role="checkbox" data-k="who" data-v="${p.id}" aria-checked="${draft.who.includes(p.id)}">${avatar(p)}${esc(p.name.split(' ')[0])}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl" id="lDue">Due date${draft.due && !inChips ? ` <span class="mono" style="color:var(--text)">· ${fmt(draft.due, { weekday: 'short', month: 'short', day: 'numeric' })}</span>` : ''}</span>
        <div class="opts" role="radiogroup" aria-labelledby="lDue">${chips.map(([l, v]) => opt('due', v, draft.due === v, l)).join('')}${opt('due', '', !draft.due, 'None')}
        <button type="button" class="opt" data-k="pick" aria-expanded="${draft.showCal}" aria-checked="${!!draft.due && !inChips}">${calIcon}Pick date</button></div>
        ${draft.showCal ? calHTML() : ''}</div>
      <div class="row2">
        <div class="field"><span class="lbl" id="lTag">Label</span><div class="opts" role="radiogroup" aria-labelledby="lTag">${TAGS.map((g) => opt('tag', g.id, draft.tag === g.id, `<span class="tag" style="--c:${g.c};color:inherit"><i></i>${g.name}</span>`)).join('')}</div></div>
        <div class="field"><span class="lbl" id="lPrio">Priority</span><div class="opts" role="radiogroup" aria-labelledby="lPrio">${PRIOS.slice(1).map((p) => opt('prio', p.id, draft.prio === p.id, `<span class="prio${p.id === 4 ? ' urgent' : ''}" style="width:auto;height:auto;background:none">${prioIcon(p.id)}</span>${p.name}`)).join('')}</div></div>
      </div>
    </form>
    <div class="dlg-foot">
      ${editing ? `<button type="button" class="btn btn-danger" data-delete><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Delete</button>` : ''}
      <span class="grow"></span>
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" form="taskForm" class="btn btn-primary" style="width:auto;padding:0 16px">${editing ? 'Save changes' : 'Create task'}</button>
    </div>`;
  if (focusKey) {
    const el = active.id ? $('#' + active.id, dlg) : $(`[data-k="${focusKey}"][data-v="${active.dataset.v}"]`, dlg) || $(`[data-k="${focusKey}"]`, dlg);
    el && el.focus();
  }
}
document.addEventListener('input', (e) => {
  if (!draft) return;
  if (e.target.id === 'fTitle') { draft.title = e.target.value; if (draft.err && draft.title.trim()) { draft.err = false; e.target.classList.remove('err'); const h = $('.hint-err'); h && h.remove(); } }
  if (e.target.id === 'fDesc') draft.desc = e.target.value;
});
document.addEventListener('click', (e) => {
  const ov = $('#overlay'); if (!ov || !ov.contains(e.target) || !draft) return;
  if (e.target.closest('[data-close]')) return closeDialog();
  if (e.target.closest('[data-delete]')) return deleteTask(editing.id);
  const day = e.target.closest('[data-day]'); if (day) { draft.due = day.dataset.day; draft.showCal = false; renderDialog(); $('[data-k="pick"]').focus(); return; }
  const cal = e.target.closest('[data-cal]'); if (cal) { calMonth.setMonth(calMonth.getMonth() + Number(cal.dataset.cal)); renderDialog(); $(`[data-cal="${cal.dataset.cal}"]`).focus(); return; }
  const o = e.target.closest('.opt'); if (!o) return;
  const k = o.dataset.k, v = o.dataset.v;
  if (k === 'who') draft.who = draft.who.includes(v) ? draft.who.filter((x) => x !== v) : [...draft.who, v];
  else if (k === 'prio') draft.prio = Number(v);
  else if (k === 'due') { draft.due = v || null; draft.showCal = false; }
  else if (k === 'pick') { draft.showCal = !draft.showCal; if (draft.due) { calMonth = parse(draft.due); calMonth.setDate(1); } }
  else draft[k] = v;
  renderDialog();
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'taskForm') return; e.preventDefault();
  if (!draft.title.trim()) { draft.err = true; renderDialog(); $('#fTitle').focus(); return; }
  const data = { title: draft.title.trim(), desc: (draft.desc || '').trim(), status: draft.status, tag: draft.tag, who: draft.who, due: draft.due, prio: draft.prio };
  let id;
  if (editing) {
    const moved = editing.status !== data.status; id = editing.id;
    Object.assign(editing, data);
    if (moved) { const i = state.tasks.indexOf(editing); state.tasks.splice(i, 1); const last = state.tasks.map((x) => x.status).lastIndexOf(data.status); state.tasks.splice(last + 1, 0, editing); }
    toast('Changes saved');
  } else {
    id = 'CHK-' + state.next++;
    const last = state.tasks.map((x) => x.status).lastIndexOf(data.status);
    state.tasks.splice(last + 1, 0, { id, ...data });
    toast(`${id} added to ${STATUSES.find((s) => s.id === data.status).name}`);
  }
  save(); closeDialog(); render();
  const el = $(`.card[data-id="${id}"]`); if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); }
});
function deleteTask(id) {
  const snapshot = JSON.stringify(state);
  state.tasks = state.tasks.filter((t) => t.id !== id); save(); closeDialog(); render();
  toast(`${id} deleted`, () => { state = JSON.parse(snapshot); save(); render(); });
}

/* ---------- Menu ---------- */
const menu = $('#menu'), menuBtn = $('#menuBtn');
menuBtn.onclick = (e) => { e.stopPropagation(); const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open); if (open) $('button', menu).focus(); };
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', false); } });
menu.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const snapshot = JSON.stringify(state);
  if (b.dataset.act === 'reset') { state = sample(); toast('Sample board restored', () => { state = JSON.parse(snapshot); save(); render(); }); }
  else { state = { next: state.next, tasks: [] }; toast('All tasks cleared', () => { state = JSON.parse(snapshot); save(); render(); }); }
  save(); render(); menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', false); menuBtn.focus();
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast'), u = $('#toastUndo');
  $('#toastMsg').textContent = msg; u.hidden = !undo; u.onclick = () => { undo(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 2600);
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', (e) => {
  const ov = $('#overlay');
  if (ov) {
    if (e.key === 'Escape') { e.preventDefault(); return closeDialog(); }
    if (e.key === 'Tab') {
      const f = [...ov.querySelectorAll('button, input, textarea')].filter((el) => !el.disabled && el.offsetParent);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#taskForm').requestSubmit(); }
    return;
  }
  if (e.key === 'Escape' && menu.classList.contains('open')) { menu.classList.remove('open'); menuBtn.focus(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openDialog(null, 'todo'); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
</script>
</body>
