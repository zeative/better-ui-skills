<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>Simmer – recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Look: bright and clean, warm off-white canvas, white cards, paprika brand, herb green for vegetarian tags.
   Character: warm, appetising, unhurried. Signature: the frosted time pill on every recipe photo. */
:root {
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --canvas: #F7F7F5; --surface: #FFFFFF; --surface-2: #F1F1EE; --line: #E8E8E4; --line-2: #DEDED9;
  --text: #1A1A17; --text-2: #66665F; --text-3: #8C8C85;
  --brand: #C4411A; --brand-hi: #E4572E; --brand-tint: #FCEDE7; --on-brand: #FFFFFF;
  --herb: #2E7D32; --herb-tint: #E8F3E9;
  --c-protein: #CC441C; --c-carbs: #E7A33A; --c-fat: #6E8F4E;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(40,30,20,.05), 0 1px 1px rgba(40,30,20,.03);
  --sh-2: 0 1px 2px rgba(40,30,20,.05), 0 8px 20px -10px rgba(40,30,20,.16);
  --sh-float: 0 12px 32px -8px rgba(40,30,20,.22);
  --tab-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-sm { width: 16px; height: 16px; }

/* ---------- shell ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
main { padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
main.flush { padding-top: 0; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.brand { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(160deg, var(--brand-hi), var(--brand)); display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px -2px rgba(204,68,28,.6); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #F6E3C8; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: var(--sh-1); }
.avatar img { width: 100%; height: 100%; }

.tabbar { position: fixed; inset: auto 0 0; z-index: 30; background: rgba(255,255,255,.94); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: grid; grid-template-columns: repeat(3, 1fr); list-style: none; margin: 0 auto; padding: 0; max-width: 520px; height: var(--tab-h); }
.tab { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--text-2); position: relative; transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab[aria-current="page"] .ic { fill: color-mix(in srgb, var(--brand) 14%, transparent); }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: #fff;
  font: 500 11px/18px var(--mono); text-align: center; border: 2px solid #fff; box-sizing: content-box; }
.tab:active .ic { transform: scale(.92); }

/* ---------- discover ---------- */
.hello { margin: 16px 0 16px; }
.hello .date { font-size: 13px; color: var(--text-2); }
.hello h1 { font-size: 24px; letter-spacing: -0.015em; line-height: 1.25; margin-top: 2px; }

.search { position: relative; }
.search input { width: 100%; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 44px 0 44px; font-size: 16px;
  box-shadow: var(--sh-1); transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
.search > .ic { position: absolute; left: 14px; top: 14px; color: var(--text-2); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border-radius: 10px; display: none; place-items: center; color: var(--text-2); }
.search .clear:hover { background: var(--surface-2); }
.search.has-q .clear { display: grid; }
.search input::-webkit-search-cancel-button { display: none; }

.section { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { font-size: 18px; letter-spacing: -0.01em; line-height: 1.35; }
.see-all { font-size: 14px; font-weight: 500; color: var(--brand); display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 2px; margin: -10px 0; }
.see-all:hover { text-decoration: underline; text-underline-offset: 3px; }

.scroller { display: flex; gap: 12px; scroll-padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { scroll-snap-align: start; flex: none; }

.cat-chip { width: 64px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text); }
.cat-chip .bubble { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--tint); transition: transform .15s ease-out; box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
.cat-chip .bubble img { width: 38px; height: 38px; }
.cat-chip .bubble .fallback { font-size: 30px; line-height: 1; }
.cat-chip:hover .bubble { transform: translateY(-2px); }
.cat-chip:active .bubble { transform: scale(.96); }

/* photo + time pill (signature) */
.photo { position: relative; overflow: hidden; background: linear-gradient(160deg, #EFE7DC, #E4D9CA); }
.photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease-out, transform .4s cubic-bezier(.2,.8,.2,1); }
.photo img.ok { opacity: 1; }
.time-pill { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border-radius: var(--r-full);
  background: rgba(255,255,255,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--text); font: 500 12px/1 var(--mono); box-shadow: 0 2px 8px -2px rgba(0,0,0,.18); }
.time-pill .ic { width: 14px; height: 14px; color: var(--brand); stroke-width: 2; }
.heart { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--text); box-shadow: 0 2px 8px -2px rgba(0,0,0,.2); transition: transform .15s ease-out, color .15s; }
.heart .ic { width: 20px; height: 20px; }
.heart:hover { transform: scale(1.06); }
.heart:active { transform: scale(.92); }
.heart[aria-pressed="true"] { color: var(--brand); }
.heart[aria-pressed="true"] .ic { fill: var(--brand); }
.heart.pop .ic { animation: pop .35s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* featured */
.feature { display: block; border-radius: var(--r-lg); overflow: hidden; position: relative; background: #2b211a; box-shadow: var(--sh-2); isolation: isolate; }
.feature .photo { aspect-ratio: 4 / 3.6; }
.feature .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,6,0) 38%, rgba(20,12,6,.55) 64%, rgba(20,12,6,.86)); pointer-events: none; }
.feature .body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px; color: #fff; }
.feature .kicker { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); background: var(--brand); font-size: 12px; font-weight: 600; }
.feature h3 { font-size: 24px; line-height: 1.2; letter-spacing: -0.015em; margin-top: 10px; }
.feature .desc { font-size: 14px; color: rgba(255,255,255,.86); margin-top: 6px; max-width: 46ch; }
.feature .meta { display: flex; gap: 16px; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.92); }
.feature .meta span { display: inline-flex; align-items: center; gap: 6px; }
.feature .meta .ic { width: 16px; height: 16px; }
.feature:hover .photo img { transform: scale(1.03); }

/* recipe card */
.card { display: block; background: var(--surface); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--sh-1); border: 1px solid var(--line);
  transition: transform .18s ease-out, box-shadow .18s ease-out; position: relative; }
@media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); } .card:hover .photo img { transform: scale(1.04); } }
.card:active { transform: scale(.99); }
.card .photo { aspect-ratio: 4 / 3; }
.card .info { padding: 12px 14px 14px; }
.card .cat { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.card .t { font-size: 16px; line-height: 1.35; letter-spacing: -0.005em; margin-top: 2px; font-weight: 600; }
.card .sub { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--text-2); }
.card .sub span { display: inline-flex; align-items: center; gap: 4px; }
.card .sub .ic { width: 15px; height: 15px; }
.scroller .card { width: 220px; }
.scroller .card .t { min-height: 2.7em; }
.veg { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-full); background: var(--herb-tint); color: #276B2B; font-size: 12px; font-weight: 600; white-space: nowrap; }
.veg-txt { color: #276B2B; font-weight: 500; }
.veg .ic { width: 12px; height: 12px; stroke-width: 2.2; }
.dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid .card .info { padding: 10px 12px 12px; }
.grid .card .t { font-size: 15px; min-height: 2.7em; }
.grid .card .heart { width: 36px; height: 36px; right: 8px; top: 8px; }
.grid .card .heart .ic { width: 18px; height: 18px; }
.grid .card .time-pill { left: 8px; bottom: 8px; }

/* list rows */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-1); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; min-height: 80px; position: relative; transition: background-color .15s; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: #FBFBF9; }
.row .thumb { width: 64px; height: 64px; border-radius: 12px; flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row h3 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.row .sub { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; white-space: nowrap; margin-top: 4px; font-size: 13px; color: var(--text-2); }
.row .sub span { display: inline-flex; align-items: center; gap: 4px; }
.row .sub .ic { width: 15px; height: 15px; }
.row .chev { color: var(--text-3); }
.row .rank { font: 500 13px/1 var(--mono); color: var(--text-3); width: 16px; text-align: center; flex: none; }

/* ---------- browse ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin: 4px 0 4px; }
.page-head h1 { font-size: 24px; letter-spacing: -0.015em; line-height: 1.25; }
.page-head .count { font: 500 13px/1 var(--mono); color: var(--text-2); }
.lede { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }

.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat-tile { position: relative; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 1 / 1.08; display: block; box-shadow: var(--sh-1); background: #2b211a; isolation: isolate; transition: transform .18s ease-out, box-shadow .18s; }
.cat-tile .photo { position: absolute; inset: 0; }
.cat-tile .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,6,0) 35%, rgba(20,12,6,.78)); }
.cat-tile .lbl { position: absolute; left: 14px; right: 14px; bottom: 12px; color: #fff; }
.cat-tile .lbl strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.cat-tile .lbl span { font: 400 12px/1.4 var(--mono); color: rgba(255,255,255,.88); }
.cat-tile .emo { position: absolute; left: 12px; top: 12px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px -2px rgba(0,0,0,.2); }
.cat-tile .emo img { width: 24px; height: 24px; }
@media (hover: hover) { .cat-tile:hover { transform: translateY(-2px); box-shadow: var(--sh-2); } .cat-tile:hover .photo img { transform: scale(1.04); } }

.back-row { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); color: var(--text); flex: none; transition: transform .15s, background-color .15s; }
.icon-btn:hover { background: #FBFBF9; }
.icon-btn:active { transform: scale(.94); }

.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 2px 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; height: 40px; padding: 0 14px; border-radius: var(--r-full); border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; color: var(--text); transition: background-color .15s, border-color .15s, color .15s; }
.chip .n { font: 500 12px/1 var(--mono); color: var(--text-2); }
.chip:hover { border-color: #CFCFC9; }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.chip[aria-pressed="true"] .n { color: rgba(255,255,255,.72); }

/* ---------- detail ---------- */
.detail-hero { position: relative; margin: 0 -16px; }
.detail-hero .photo { aspect-ratio: 4 / 3.3; }
.detail-hero .bar { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top)) 16px 0; display: flex; justify-content: space-between; }
.detail-hero .icon-btn { background: rgba(255,255,255,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-color: transparent; }
.detail-hero .heart { position: static; width: 44px; height: 44px; }
.sheet { position: relative; margin: -28px -16px 0; background: var(--canvas); border-radius: 28px 28px 0 0; padding: 22px 16px 0; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.crumbs a { color: var(--brand); display: inline-flex; align-items: center; min-height: 40px; margin: -8px 0; }
.crumbs a:hover { text-decoration: underline; text-underline-offset: 3px; }
.d-title { font-size: 28px; line-height: 1.18; letter-spacing: -0.02em; margin-top: 6px; }
.d-desc { font-size: 15px; color: var(--text-2); margin-top: 8px; max-width: 60ch; }

.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-1); }
.fact { padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact .ic { color: var(--brand); width: 18px; height: 18px; margin-bottom: 4px; }
.fact strong { font-size: 15px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fact span { font-size: 12px; color: var(--text-2); line-height: 1.3; }

.nutri { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-1); padding: 16px; }
.nutri-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.nutri-top h2 { font-size: 15px; font-weight: 600; }
.nutri-top .kcal { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.nutri-top .kcal small { font-size: 13px; font-weight: 500; color: var(--text-2); letter-spacing: 0; margin-left: 2px; }
.nutri-sub { font: 400 12px/1.4 var(--mono); color: var(--text-2); margin-top: 2px; }
.segbar { display: flex; gap: 4px; height: 12px; margin-top: 14px; }
.segbar i { display: block; border-radius: var(--r-full); min-width: 8px; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.legend div { display: flex; flex-direction: column; gap: 2px; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.legend .k i { width: 8px; height: 8px; border-radius: 50%; }
.legend .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend .v small { font: 400 12px var(--mono); color: var(--text-2); margin-left: 4px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: var(--surface-2); border-radius: var(--r-sm); margin-top: 24px; position: relative; }
.seg button { height: 40px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--text-2); position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: color .15s; }
.seg button .n { font: 500 12px/1 var(--mono); color: var(--text-3); }
.seg button[aria-selected="true"] { color: var(--text); background: var(--surface); box-shadow: var(--sh-1), inset 0 1px 0 #fff; }
.seg button[aria-selected="true"] .n { color: var(--text-2); }

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 12px; min-height: 44px; }
.panel-head h2 { font-size: 18px; letter-spacing: -0.01em; }
.panel-head .hint { font: 400 12px/1.4 var(--mono); color: var(--text-2); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); padding: 3px; box-shadow: var(--sh-1); }
.stepper button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text); transition: background-color .15s; }
.stepper button:hover:not(:disabled) { background: var(--surface-2); }
.stepper button:disabled { color: var(--text-3); cursor: default; }
.stepper output { min-width: 78px; text-align: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

.ing-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-1); overflow: hidden; }
.ing { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 52px; width: 100%; text-align: left; transition: background-color .15s; }
.ing-list li + li .ing { border-top: 1px solid var(--line); }
.ing:hover { background: #FBFBF9; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #CFCFC8; display: grid; place-items: center; flex: none; color: #fff; transition: background-color .15s, border-color .15s, transform .15s; }
.box .ic { width: 14px; height: 14px; stroke-width: 2.6; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s cubic-bezier(.2,.8,.2,1.4); }
.ing .name { flex: 1; font-size: 15px; line-height: 1.4; padding: 14px 0; }
.ing .name em { font-style: normal; color: var(--text-2); }
.ing .qty { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ing[aria-checked="true"] .box { background: var(--herb); border-color: var(--herb); }

const byId = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
RECIPES.forEach(r => { r.time = r.prep + r.cook; r.kcal = Math.round((r.p * 4 + r.c * 4 + r.f * 9) / 10) * 10; });

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('simmer:' + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('simmer:' + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get('favs', ['thai-red-curry', 'cacio-e-pepe', 'chickpea-bowl', 'cookies']);
let progress = store.get('progress', {});   // { recipeId: { ing: [idx], steps: [idx], serves: n } }
let ui = { q: '', filter: 'all', tab: 'ingredients' };

const isFav = id => favs.includes(id);
function toggleFav(id, btn) {
  const was = isFav(id);
  favs = was ? favs.filter(x => x !== id) : [id, ...favs];
  store.set('favs', favs);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
    b.setAttribute('aria-pressed', String(!was));
    b.setAttribute('aria-label', (!was ? 'Remove ' : 'Save ') + byId[id].title + (!was ? ' from saved' : ''));
    if (!was) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
  renderChrome();
  toast(was ? 'Removed from saved' : 'Saved to favourites', () => { toggleFav(id); if (route().name === 'saved') render(); });
  if (route().name === 'saved' && was) render();
}

let toastTimer;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const u = document.getElementById('toastUndo');
  u.onclick = () => { t.classList.remove('show'); clearTimeout(toastTimer); undo && undo(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- helpers ---------- */
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim() : `${m} min`;
const emo = (e, size) => `<img src="${emoji3d(e)}" alt="" width="${size}" height="${size}" loading="lazy" onerror="this.outerHTML='<span class=&quot;fallback&quot;>${e}</span>'">`;
const photo = (r, w, extra = '', inner = '') => `<div class="photo ${extra}"><img src="${img(r.img || r.cover, w)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.remove()">${inner}</div>`;
const heartBtn = r => `<button class="heart" type="button" data-fav="${r.id}" aria-pressed="${isFav(r.id)}" aria-label="${isFav(r.id) ? 'Remove ' + esc(r.title) + ' from saved' : 'Save ' + esc(r.title)}">${ic('heart')}</button>`;
const timePill = r => `<span class="time-pill">${ic('clock')}${mins(r.time)}</span>`;
const countIn = id => RECIPES.filter(r => r.cat === id).length;

const FRAC = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
function fmtQty(q, unit) {
  if (unit === 'g' || unit === 'ml') {
    if (q >= 1000) return `${+(q / 1000).toFixed(2)} ${unit === 'g' ? 'kg' : 'litres'}`;
    return `${q >= 100 ? Math.round(q / 5) * 5 : Math.round(q)} ${unit}`;
  }
  const whole = Math.floor(q), rest = q - whole;
  let frac = '';
  const keys = Object.keys(FRAC).map(Number);
  const near = keys.reduce((a, b) => Math.abs(b - rest) < Math.abs(a - rest) ? b : a, keys[0]);
  let w = whole;
  if (rest > 0.12 && rest < 0.88) frac = FRAC[near]; else if (rest >= 0.88) w += 1;
  const n = (w ? w : '') + frac || '½';
  const plural = unit && !['tsp', 'tbsp', 'cm', 'pinch'].includes(unit) && q > 1 && !unit.endsWith('s') ? unit.replace(/(ch|sh)$/, '$1e') + 's' : unit;
  return unit ? `${n} ${plural}` : n;
}

function card(r) {
  const c = catById[r.cat];
  return `<a class="card" href="#/r/${r.id}">
    ${photo(r, 520, '', timePill(r))}
    <div class="info"><div class="cat">${c.name}</div>
      <h2 class="t">${esc(r.title)}</h2>
      <div class="sub"><span>${ic('flame')}<span class="num">${r.kcal}</span> kcal</span>${r.veg ? `<span class="veg-txt">${ic('leaf')}Veggie</span>` : `<span>${ic('chef')}${r.level}</span>`}</div></div>
  </a>`;
}
function cardWrap(r) { return `<div style="position:relative">${card(r)}${heartBtn(r)}</div>`; }
function row(r, i) {
  return `<a class="row" href="#/r/${r.id}">
    ${i != null ? `<span class="rank">${i + 1}</span>` : ''}
    ${photo(r, 160, 'thumb')}
    <div class="txt"><h3>${esc(r.title)}</h3>
      <div class="sub"><span>${ic('clock')}${mins(r.time)}</span><span>${ic('flame')}<span class="num">${r.kcal}</span> kcal</span></div></div>
    ${ic('right', 'chev')}
  </a>`;
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'r' && byId[h[1]]) return { name: 'recipe', id: h[1] };
  if (h[0] === 'c' && catById[h[1]]) return { name: 'category', id: h[1] };
  if (h[0] === 'browse') return { name: 'browse' };
  if (h[0] === 'saved') return { name: 'saved' };
  return { name: 'home' };
}

function renderChrome() {
  const r = route();
  const active = r.name === 'recipe' ? null : r.name === 'category' ? 'browse' : r.name;
  const items = [['home', '#/', 'Discover', 'home'], ['browse', '#/browse', 'Browse', 'grid'], ['saved', '#/saved', 'Saved', 'heart']];
  document.getElementById('tabs').innerHTML = items.map(([k, href, label, icon]) =>
    `<li><a class="tab" href="${href}" ${active === k ? 'aria-current="page"' : ''}>${ic(icon)}${label}${k === 'saved' && favs.length ? `<span class="badge" aria-label="${favs.length} saved">${favs.length}</span>` : ''}</a></li>`).join('');
  document.getElementById('sideNav').innerHTML = items.map(([k, href, label, icon]) =>
    `<a class="nav-item" href="${href}" ${active === k ? 'aria-current="page"' : ''}>${ic(icon)}${label}${k === 'saved' ? `<span class="cnt">${favs.length}</span>` : ''}</a>`).join('');
  document.getElementById('sideCats').innerHTML = CATS.map(c =>
    `<a class="nav-item" href="#/c/${c.id}" ${r.name === 'category' && r.id === c.id ? 'aria-current="page"' : ''}><span class="emo">${emo(c.emoji, 20)}</span>${c.name}<span class="cnt">${countIn(c.id)}</span></a>`).join('');
  document.getElementById('sideSaved').textContent = `${favs.length} saved ${favs.length === 1 ? 'recipe' : 'recipes'}`;
}

/* ---------- views ---------- */
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function pickOfDay() {
  const h = new Date().getHours();
  const pool = h < 11 ? RECIPES.filter(r => r.cat === 'breakfast') : RECIPES.filter(r => ['curries', 'mains', 'pasta'].includes(r.cat));
  const day = Math.floor(Date.now() / 864e5);
  return pool[day % pool.length];
}

      ${ic('search')}
      <label class="sr" for="q">Search recipes</label>
      <input id="q" type="search" placeholder="Search recipes or ingredients" value="${esc(ui.q)}" autocomplete="off">
      <button class="clear" type="button" aria-label="Clear search">${ic('x')}</button>
    </div>
  </div>
  <div id="homeBody">${ui.q ? searchResults() : homeSections(pick, quick, popular)}</div>`;
}
function homeSections(pick, quick, popular) {
  return `
  <section class="section" aria-labelledby="h-cats">
    <div class="sec-head"><h2 id="h-cats">Categories</h2><a class="see-all" href="#/browse">See all${ic('right', 'ic-sm')}</a></div>
    <div class="scroller cats-strip" style="gap:20px">${CATS.map(c => `<a class="cat-chip" href="#/c/${c.id}" style="--tint:${c.tint}"><span class="bubble">${emo(c.emoji, 38)}</span>${c.short || c.name}</a>`).join('')}</div>
  </section>
  <div class="disc-top section">
    <div style="position:relative">
      <a class="feature" href="#/r/${pick.id}" aria-label="${esc(pick.title)}, ${mins(pick.time)}">
        ${photo(pick, 1200)}<div class="shade"></div>
        <div class="body"><span class="kicker">${ic('flame', 'ic-sm')}${new Date().getHours() >= 17 ? 'Tonight’s pick' : 'Today’s pick'}</span>
          <h3>${esc(pick.title)}</h3><p class="desc">${esc(pick.desc)}</p>
          <div class="meta"><span>${ic('clock')}${mins(pick.time)}</span><span>${ic('users')}Serves ${pick.serves}</span><span>${ic('chef')}${pick.level}</span></div></div>
      </a>${heartBtn(pick)}
    </div>
    <section class="section" aria-labelledby="h-pop">
      <div class="sec-head"><h2 id="h-pop">Popular this week</h2></div>
      <div class="rows">${popular.map((r, i) => row(r, i)).join('')}</div>
    </section>
  </div>
  <section class="section quick" aria-labelledby="h-quick">
    <div class="sec-head"><h2 id="h-quick">Ready in 25 minutes</h2><a class="see-all" href="#/browse">Browse all${ic('right', 'ic-sm')}</a></div>
    <div class="scroller">${quick.map(r => `<div style="position:relative;flex:none">${card(r)}${heartBtn(r)}</div>`).join('')}</div>
  </section>`;
}
function searchResults() {
  const q = ui.q.trim().toLowerCase();
  const hits = RECIPES.filter(r => (r.title + ' ' + r.desc + ' ' + catById[r.cat].name + ' ' + r.i.map(x => x[2]).join(' ')).toLowerCase().includes(q));
  if (!hits.length) return `<div class="section"><div class="no-results"><strong>No recipes match “${esc(ui.q.trim())}”</strong>Try an ingredient like “chickpeas” or a dish like “curry”.</div></div>`;
  return `<section class="section" aria-live="polite"><div class="sec-head"><h2>${hits.length} ${hits.length === 1 ? 'recipe' : 'recipes'}</h2></div>
    <div class="rows">${hits.map(r => row(r)).join('')}</div></section>`;
}

function viewBrowse() {
  return `
  <div class="page-head"><h1>Browse</h1><span class="count">${RECIPES.length} recipes</span></div>
  <p class="lede">Pick a category to see every recipe in it.</p>
  <div class="cat-grid">${CATS.map(c => `<a class="cat-tile" href="#/c/${c.id}">${photo(c, 640)}<div class="shade"></div>
    <span class="emo">${emo(c.emoji, 24)}</span>
    <span class="lbl"><strong>${c.name}</strong><span>${countIn(c.id)} recipes</span></span></a>`).join('')}</div>`;
}

function viewCategory(id) {
  const c = catById[id];
  const all = RECIPES.filter(r => r.cat === id);
  const filters = [['all', 'All', all], ['quick', 'Under 30 min', all.filter(r => r.time < 30)], ['veg', 'Vegetarian', all.filter(r => r.veg)], ['easy', 'Easy', all.filter(r => r.level === 'Easy')]];
  if (!filters.some(f => f[0] === ui.filter)) ui.filter = 'all';
  const list = filters.find(f => f[0] === ui.filter)[2];
  return `
  <div class="back-row m-only"><a class="icon-btn" href="#/browse" aria-label="Back to Browse">${ic('left')}</a></div>
  <div class="page-head"><h1>${c.name}</h1><span class="count">${all.length} recipes</span></div>
  <div class="filters" role="group" aria-label="Filter recipes">${filters.map(([k, label, arr]) =>
    `<button class="chip" type="button" data-filter="${k}" aria-pressed="${ui.filter === k}" ${arr.length ? '' : 'disabled style="opacity:.5;cursor:default"'}>${label}<span class="n">${arr.length}</span></button>`).join('')}</div>
  ${list.length ? `<div class="grid">${list.map(cardWrap).join('')}</div>` : `<div class="no-results"><strong>Nothing here yet</strong>Try another filter.</div>`}`;
}

function viewSaved() {
  const list = favs.map(id => byId[id]).filter(Boolean);
  if (!list.length) return `
    <div class="page-head"><h1>Saved</h1></div>
    <div class="empty"><div class="art">${emo('🍳', 72)}</div><h2>No saved recipes yet</h2>
      <p>Tap the heart on any recipe to keep it here for later.</p><a class="btn" href="#/browse">Browse recipes</a></div>`;
  const total = list.reduce((s, r) => s + r.time, 0);
  return `
  <div class="page-head"><h1>Saved</h1><button class="btn-quiet" type="button" id="clearSaved">${ic('reset', 'ic-sm')}Clear all</button></div>
  <p class="lede"><span class="num">${list.length}</span> ${list.length === 1 ? 'recipe' : 'recipes'} · ${list.filter(r => r.veg).length} vegetarian · ${mins(Math.round(total / list.length))} on average</p>
  <div class="grid">${list.map(cardWrap).join('')}</div>`;
}

function viewRecipe(id) {
  const r = byId[id], c = catById[r.cat];
  const pr = progress[id] || { ing: [], steps: [], serves: r.serves };
  const serves = pr.serves || r.serves;
  const k = serves / r.serves;
  const kP = r.p * 4, kC = r.c * 4, kF = r.f * 9, kT = kP + kC + kF;
  const more = RECIPES.filter(x => x.cat === r.cat && x.id !== id).slice(0, 4);
  const done = pr.steps.length;
  return `
  <div class="d-wrap">
    <div class="detail-hero">${photo(r, 1200)}
      <div class="bar"><a class="icon-btn" href="#/c/${r.cat}" aria-label="Back to ${c.name}">${ic('left')}</a>${heartBtn(r)}</div>
    </div>
    <div class="sheet">
      <div class="crumbs"><a href="#/c/${r.cat}">${c.name}</a>${r.veg ? `<span class="veg">${ic('leaf')}Vegetarian</span>` : ''}</div>
      <h1 class="d-title">${esc(r.title)}</h1>
      <p class="d-desc">${esc(r.desc)}</p>
      <div class="facts">
        <div class="fact">${ic('clock')}<strong>${mins(r.time)}</strong><span>Total</span></div>
        <div class="fact">${ic('prep')}<strong>${r.prep} min</strong><span>Prep</span></div>
        <div class="fact">${ic('chef')}<strong>${r.level}</strong><span>Level</span></div>
        <div class="fact">${ic('users')}<strong>${r.serves}</strong><span>Serves</span></div>
      </div>
      <section class="nutri" aria-label="Nutrition per serving: ${r.kcal} kcal, ${r.p} g protein, ${r.c} g carbs, ${r.f} g fat">
        <div class="nutri-top"><div><h2>Per serving</h2><p class="nutri-sub">Energy split by macro</p></div><div class="kcal">${r.kcal}<small>kcal</small></div></div>
        <div class="segbar" aria-hidden="true"><i style="flex:${kP};background:var(--c-protein)"></i><i style="flex:${kC};background:var(--c-carbs)"></i><i style="flex:${kF};background:var(--c-fat)"></i></div>
        <div class="legend">
          <div><span class="k"><i style="background:var(--c-protein)"></i>Protein</span><span class="v">${r.p} g<small>${Math.round(kP / kT * 100)}%</small></span></div>
          <div><span class="k"><i style="background:var(--c-carbs)"></i>Carbs</span><span class="v">${r.c} g<small>${Math.round(kC / kT * 100)}%</small></span></div>
          <div><span class="k"><i style="background:var(--c-fat)"></i>Fat</span><span class="v">${r.f} g<small>${Math.round(kF / kT * 100)}%</small></span></div>
        </div>
      </section>
    </div>
  </div>
  <div class="d-body">
    <div class="seg" role="tablist" aria-label="Recipe sections">
      <button role="tab" type="button" id="t-ing" aria-controls="p-ing" aria-selected="${ui.tab === 'ingredients'}" data-tab="ingredients">Ingredients<span class="n">${r.i.length}</span></button>
      <button role="tab" type="button" id="t-steps" aria-controls="p-steps" aria-selected="${ui.tab === 'steps'}" data-tab="steps">Method<span class="n">${r.s.length}</span></button>
    </div>
    <div class="d-panels" style="display:contents">
      <section id="p-ing" role="tabpanel" aria-labelledby="t-ing" ${ui.tab === 'ingredients' ? '' : 'hidden'}>
        <div class="panel-head"><div><h2>Ingredients</h2><p class="hint">${pr.ing.length} of ${r.i.length} ready</p></div>
          <div class="stepper" role="group" aria-label="Servings">
            <button type="button" data-serve="-1" aria-label="Fewer servings" ${serves <= 1 ? 'disabled' : ''}>${ic('minus', 'ic-sm')}</button>
            <output aria-live="polite">${serves} ${serves === 1 ? 'serving' : 'servings'}</output>
            <button type="button" data-serve="1" aria-label="More servings" ${serves >= 24 ? 'disabled' : ''}>${ic('plus', 'ic-sm')}</button>
          </div></div>
        <ul class="ing-list">${r.i.map(([q, u, name, note], i) => `<li><button type="button" class="ing" role="checkbox" data-ing="${i}" aria-checked="${pr.ing.includes(i)}">
          <span class="box">${ic('check')}</span><span class="name"><span>${esc(name[0].toUpperCase() + name.slice(1))}</span>${note ? `<em>, ${esc(note)}</em>` : ''}</span><span class="qty">${fmtQty(q * k, u)}</span></button></li>`).join('')}</ul>
      </section>
      <section id="p-steps" role="tabpanel" aria-labelledby="t-steps" ${ui.tab === 'steps' ? '' : 'hidden'}>
        <div class="panel-head"><div><h2>Method</h2><p class="hint">Tap a step when it’s done</p></div>
          ${done ? `<button class="btn-quiet" type="button" id="resetSteps">${ic('reset', 'ic-sm')}Reset</button>` : ''}</div>
        <div class="progress"><div class="track"><div class="fill" style="width:${done / r.s.length * 100}%"></div></div><span>${done} of ${r.s.length} steps</span></div>
        <ol class="steps">${r.s.map(([t, m], i) => `<li><button type="button" class="step" role="checkbox" data-step="${i}" aria-checked="${pr.steps.includes(i)}">
          <span class="n">${pr.steps.includes(i) ? ic('check') : i + 1}</span><span class="t">${esc(t)}${m ? `<br><span class="tm">${ic('clock')}${m} min</span>` : ''}</span></button></li>`).join('')}</ol>
      </section>
    </div>
  </div>
  ${more.length ? `<section class="section more" aria-labelledby="h-more"><div class="sec-head"><h2 id="h-more">More ${c.name.toLowerCase()}</h2><a class="see-all" href="#/c/${c.id}">See all${ic('right', 'ic-sm')}</a></div>
    <div class="grid">${more.map(cardWrap).join('')}</div></section>` : ''}`;
}

/* ---------- render ---------- */
const main = document.getElementById('main');
let lastRoute = '';
function render() {
  const r = route();
  const key = r.name + (r.id || '');
  const changed = key !== lastRoute;
  if (changed && r.name !== 'category') ui.filter = 'all';
  if (changed && r.name === 'recipe') ui.tab = 'ingredients';
  main.className = r.name === 'recipe' ? 'flush' : '';
  main.innerHTML = `<div class="${changed ? 'view' : ''}">${
    r.name === 'recipe' ? viewRecipe(r.id) : r.name === 'category' ? viewCategory(r.id) : r.name === 'browse' ? viewBrowse() : r.name === 'saved' ? viewSaved() : viewHome()}</div>`;
  document.title = r.name === 'recipe' ? `${byId[r.id].title} – Simmer` : r.name === 'category' ? `${catById[r.id].name} – Simmer` : r.name === 'saved' ? 'Saved – Simmer' : r.name === 'browse' ? 'Browse – Simmer' : 'Simmer – recipes';
  renderChrome();
  if (changed) { window.scrollTo(0, 0); lastRoute = key; }
  bindHome();
}

function bindHome() {
  const q = document.getElementById('q');
  if (!q) return;
  const wrap = q.closest('.search');
  q.addEventListener('input', () => {
    ui.q = q.value;
    wrap.classList.toggle('has-q', !!ui.q);
    const r = route();
    document.getElementById('homeBody').innerHTML = ui.q.trim() ? searchResults() :
      homeSections(pickOfDay(), RECIPES.filter(x => x.time <= 25 && x.id !== pickOfDay().id).sort((a, b) => a.time - b.time).slice(0, 6), popularList(pickOfDay()));
  });
  wrap.querySelector('.clear').addEventListener('click', () => { q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); });
}

function saveProgress(id, pr) { progress[id] = pr; store.set('progress', progress); }

document.addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.preventDefault(); toggleFav(fav.dataset.fav, fav); return; }
  const f = e.target.closest('[data-filter]');
  if (f && !f.disabled) { ui.filter = f.dataset.filter; render(); return; }
  const r = route();
  if (r.name === 'recipe') {
    const rec = byId[r.id];
    const pr = progress[r.id] || { ing: [], steps: [], serves: rec.serves };
    const t = e.target.closest('[data-tab]');
    if (t) { ui.tab = t.dataset.tab; render(); document.querySelector(`[data-tab="${ui.tab}"]`).focus(); return; }
    const sv = e.target.closest('[data-serve]');
    if (sv && !sv.disabled) { pr.serves = Math.min(24, Math.max(1, (pr.serves || rec.serves) + +sv.dataset.serve)); saveProgress(r.id, pr); render(); document.querySelector(`[data-serve="${sv.dataset.serve}"]`)?.focus(); return; }
    const ing = e.target.closest('[data-ing]');
    if (ing) { const i = +ing.dataset.ing; pr.ing = pr.ing.includes(i) ? pr.ing.filter(x => x !== i) : [...pr.ing, i]; saveProgress(r.id, pr); render(); document.querySelector(`[data-ing="${i}"]`).focus(); return; }
    const st = e.target.closest('[data-step]');
    if (st) { const i = +st.dataset.step; pr.steps = pr.steps.includes(i) ? pr.steps.filter(x => x !== i) : [...pr.steps, i]; saveProgress(r.id, pr); render(); document.querySelector(`[data-step="${i}"]`).focus(); return; }
    if (e.target.closest('#resetSteps')) { pr.steps = []; saveProgress(r.id, pr); render(); return; }
  }
  if (e.target.closest('#clearSaved')) {
    const prev = favs.slice();
    favs = []; store.set('favs', favs); render();
    toast('Saved recipes cleared', () => { favs = prev; store.set('favs', favs); render(); });
  }
});
document.addEventListener('keydown', e => {
  const t = e.target.closest('[role="tab"]');
  if (t && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { ui.tab = ui.tab === 'ingredients' ? 'steps' : 'ingredients'; render(); document.querySelector(`[data-tab="${ui.tab}"]`).focus(); }
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
