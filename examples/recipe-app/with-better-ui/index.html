<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>Simmer · Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: colour blocks — warm cream canvas, near-black controls, tomato accent, soft colour-blocked categories */
:root {
  --font: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --canvas: #FBF7F0; --surface: #FFFFFF; --surface-2: #F5F0E7; --line: rgba(31,31,31,.08);
  --text: #1F1F1F; --text-2: #6B645C; --text-3: #9A9289;
  --brand: #1F1F1F; --on-brand: #FFFFFF;
  --accent: #FF7043; --accent-ink: #C2410C; --accent-tint: #FFE8DF;
  --ok: #166534; --ok-tint: #E6F4EA;
  --c-breakfast: #FCE9B2; --c-pasta: #FFD9C7; --c-lunch: #DCEDB9; --c-dinner: #E4DAF6; --c-baking: #F8D6E0;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(60,40,20,.05), 0 1px 1px rgba(60,40,20,.03);
  --sh-2: 0 1px 2px rgba(60,40,20,.05), 0 8px 20px -10px rgba(60,40,20,.16);
  --sh-float: 0 12px 32px -8px rgba(60,40,20,.20);
  --tabbar-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-sm { width: 16px; height: 16px; }

/* ---------- shell ---------- */
.shell { min-height: 100dvh; }
.side { display: none; }
main { padding: calc(env(safe-area-inset-top) + 12px) 20px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px); max-width: 1120px; margin: 0 auto; }
main.detail-mode { padding-top: 0; padding-left: 0; padding-right: 0; padding-bottom: 40px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { list-style: none; margin: 0 auto; padding: 0 8px; display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tabbar-h); font-size: 12px; font-weight: 500; color: var(--text-2); position: relative; transition: color .15s ease-out; }
.tab .ic { width: 22px; height: 22px; }
.tab-ic { width: 52px; height: 30px; border-radius: var(--r-full); display: grid; place-items: center; transition: background-color .2s; }
.tab[aria-current="page"] { color: var(--text); font-weight: 600; }
.tab[aria-current="page"] .tab-ic { background: var(--brand); color: #fff; }
.tab[aria-current="page"] .ic { stroke-width: 2.1; }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full); background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; border: 2px solid #fff; }
.shell.hide-tabs .tabbar { display: none; }

/* ---------- header ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; letter-spacing: -.02em; }
.brand-mark { width: 34px; height: 34px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #FFD9C7; overflow: hidden; display: grid; place-items: center; font-weight: 600; flex: none; }
.avatar img { width: 100%; height: 100%; }
.greet { margin-top: 20px; }
.greet .sub { color: var(--text-2); font-size: 14px; }
.greet h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; }
.page-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.page-head .sub { color: var(--text-2); font-size: 14px; }

/* ---------- search ---------- */
.search { position: relative; margin-top: 16px; }
.search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
.search input { width: 100%; height: 52px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 0 48px 0 46px; font-size: 16px; box-shadow: var(--sh-1); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: rgba(31,31,31,.35); box-shadow: 0 0 0 4px rgba(255,112,67,.18); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); }
.search .clear:hover { background: var(--surface-2); }

/* ---------- featured ---------- */
.feature { margin-top: 20px; position: relative; border-radius: var(--r-lg); background: var(--brand); color: #fff; padding: 20px; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; box-shadow: var(--sh-2); }
.feature .kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #FFB59C; }
.feature .kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.feature h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; }
.feature .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.78); }
.feature .meta span { display: inline-flex; align-items: center; gap: 5px; }
.feature .btn { margin-top: 16px; }
.feature-desc { display: none; }
@media (max-width: 400px) { .hide-xs { display: none !important; } }
@media (min-width: 1024px) { .feature { grid-template-columns: 1fr 240px; padding: 32px 36px; } .feature-desc { display: block; margin-top: 8px; font-size: 16px; color: rgba(255,255,255,.78); max-width: 48ch; text-wrap: balance; } .feature-art { width: 240px; height: 200px; } .feature-art img { width: 136px; height: 136px; } }
.feature-body { min-width: 0; }
.feature-art { width: 104px; height: 104px; border-radius: var(--r-lg); display: grid; place-items: center; }
.feature-art img, .feature-art .emo { width: 72px; height: 72px; }
.feature-art .emo { font-size: 56px; line-height: 72px; text-align: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-full); font-weight: 600; font-size: 15px; border: 0; background: var(--brand); color: #fff; transition: transform .15s ease-out, background-color .15s ease-out, box-shadow .15s ease-out; }
.btn:active { transform: scale(.98); }
.btn-light { background: #fff; color: var(--text); }
@media (hover: hover) { .btn-light:hover { background: #FFE8DF; } .btn:not(.btn-light):hover { background: #000; } }
.btn .ic { transition: transform .15s ease-out; }
.btn:hover .ic.arrow { transform: translateX(3px); }
.btn-block { width: 100%; height: 52px; font-size: 16px; }
.btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn-ghost:hover { background: var(--surface-2); } }

/* ---------- sections ---------- */
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section.first { margin-top: 20px; }
.section-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.section-head .count { font-size: 14px; color: var(--text-2); }
.link { font-size: 14px; font-weight: 500; color: var(--accent-ink); display: inline-flex; align-items: center; gap: 2px; min-height: 44px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 4px; }
.chips::-webkit-scrollbar { display: none; }
@media (max-width: 1023px) { .chips, .rail { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); } }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 8px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 500; scroll-snap-align: start; transition: background-color .15s, color .15s, border-color .15s; }
.chip.plain { padding-left: 16px; }
.chip .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.chip .dot img, .chip .dot .emo { width: 20px; height: 20px; font-size: 16px; line-height: 20px; text-align: center; }
.chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (hover: hover) { .chip[aria-pressed="false"]:hover { background: var(--surface-2); } }

/* ---------- recipe card grid ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { position: relative; background: var(--surface); border-radius: 20px; padding: 8px 8px 14px; box-shadow: var(--sh-1); transition: transform .18s ease-out, box-shadow .18s ease-out; display: flex; flex-direction: column; }
@media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); } }
.card:active { transform: scale(.985); }
.card .tile { aspect-ratio: 1 / .86; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden; }
.card .tile img, .card .tile .emo { width: 46%; height: auto; aspect-ratio: 1; transition: transform .25s ease-out; }
.card .tile .emo { font-size: 52px; line-height: 1; display: grid; place-items: center; }
@media (hover: hover) { .card:hover .tile img { transform: scale(1.06) rotate(-3deg); } }
.card .time { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: var(--r-full); background: rgba(255,255,255,.9); font-size: 12px; font-weight: 500; }
.card .time .ic { width: 13px; height: 13px; }
.card :is(h2, h3) { font-size: 16px; font-weight: 500; letter-spacing: -.01em; margin: 10px 6px 0; line-height: 1.3; }
.card .meta { display: flex; align-items: center; gap: 6px; margin: 4px 6px 0; font-size: 13px; color: var(--text-2); }
.veg-pill { position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: var(--r-full); background: rgba(255,255,255,.9); color: var(--ok); font-size: 12px; font-weight: 600; }
.veg-pill .ic { width: 12px; height: 12px; }
.card :is(h2, h3) { text-wrap: pretty; min-height: 2.6em; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 8px; scroll-padding-inline: 20px; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.rail .card { scroll-snap-align: start; }
.card .meta .star { color: var(--accent); width: 14px; height: 14px; fill: currentColor; stroke: none; }
.card .meta b { color: var(--text); font-weight: 500; }
.card-link { position: absolute; inset: 0; border-radius: 20px; z-index: 1; }
.fav { position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; color: var(--text); box-shadow: var(--sh-1); transition: transform .15s ease-out, color .15s; }
.fav::after { content: ""; position: absolute; inset: -4px; }
.fav .ic { width: 18px; height: 18px; }
.fav[aria-pressed="true"] { color: var(--accent); }
.fav[aria-pressed="true"] .ic { fill: currentColor; }
.fav:active { transform: scale(.88); }
.fav.pop .ic { animation: pop .32s cubic-bezier(.2,.8,.2,1.4); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ---------- list rows ---------- */
.list { background: var(--surface); border-radius: 20px; box-shadow: var(--sh-1); overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 12px; min-height: 84px; transition: background-color .15s; }
.row + .row { border-top: 1px solid var(--line); }
@media (hover: hover) { .row:hover { background: #FDFBF7; } }
.row .thumb { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.row .thumb img, .row .thumb .emo { width: 36px; height: 36px; font-size: 30px; line-height: 36px; text-align: center; }
.row .body { flex: 1; min-width: 0; }
.row h3 { font-size: 16px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }
.row .meta { display: flex; flex-wrap: nowrap; white-space: nowrap; gap: 2px 10px; font-size: 13px; color: var(--text-2); margin-top: 3px; }
.row .meta span { display: inline-flex; align-items: center; gap: 4px; }
.row .meta .ic { width: 14px; height: 14px; }
.row .fav { position: relative; top: auto; right: auto; flex: none; width: 44px; height: 44px; background: var(--surface-2); box-shadow: none; }
.row .card-link { border-radius: 0; }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-full); font-size: 12px; font-weight: 500; background: var(--ok-tint); color: var(--ok); }

/* ---------- browse categories ---------- */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat { position: relative; border-radius: var(--r-lg); padding: 16px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; transition: transform .18s ease-out, box-shadow .18s ease-out; }
@media (hover: hover) { .cat:hover { transform: translateY(-2px); box-shadow: var(--sh-2); } }
.cat:active { transform: scale(.985); }
.cat { color: var(--text); }
.cat h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.cat p { font-size: 14px; color: rgba(31,31,31,.72); }
.cat img, .cat .emo { position: absolute; right: 14px; bottom: 14px; width: 72px; height: 72px; font-size: 56px; line-height: 72px; text-align: center; transition: transform .25s ease-out; }
@media (hover: hover) { .cat:hover img { transform: scale(1.06) rotate(-4deg); } }
.cat .go { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.7); display: grid; place-items: center; }
.cat.dark { background: var(--brand); color: #fff; }
.cat.dark p { color: rgba(255,255,255,.75); }
.cat.dark .go { background: rgba(255,255,255,.14); }

.tip { margin-top: 28px; background: var(--surface); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--sh-1); }
.tip .thumb { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-tint); display: grid; place-items: center; flex: none; }
.tip .thumb img, .tip .thumb .emo { width: 32px; height: 32px; font-size: 26px; line-height: 32px; text-align: center; }
.tip h3 { font-size: 16px; font-weight: 500; }
.tip p { font-size: 14px; color: var(--text-2); }

/* ---------- sub header (back) ---------- */
.subbar { display: flex; align-items: center; gap: 12px; height: 48px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; box-shadow: var(--sh-1); transition: transform .15s ease-out, background-color .15s; }
.icon-btn:active { transform: scale(.94); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }
.cat-hero { margin-top: 4px; border-radius: var(--r-lg); padding: 12px 20px 20px 12px; position: relative; overflow: hidden; min-height: 168px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
.cat-hero > div { padding-left: 8px; }
.cat-hero .icon-btn { border: 0; background: rgba(255,255,255,.75); box-shadow: none; }
.cat-hero.dark { background: var(--brand); color: #fff; }
.cat-hero.dark p { color: rgba(255,255,255,.75); }
.cat-hero.dark .icon-btn { background: rgba(255,255,255,.14); color: #fff; }
.cat-hero h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.cat-hero h1, .cat-hero p { padding-right: 100px; }
.cat-hero .hero-n { margin-top: 2px; font-weight: 500; }
.cat-hero p { font-size: 14px; color: rgba(31,31,31,.72); max-width: 34ch; }
.cat-hero img, .cat-hero .emo { position: absolute; right: 20px; bottom: 20px; width: 88px; height: 88px; font-size: 68px; line-height: 88px; text-align: center; }
.seg-filter { margin-top: 16px; max-width: 440px; }

/* ---------- empty ---------- */
.empty { text-align: center; padding: 40px 24px; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-1); }
.empty img, .empty .emo { width: 96px; height: 96px; margin: 0 auto; font-size: 72px; line-height: 96px; }
.empty h2 { font-size: 18px; font-weight: 600; margin-top: 12px; }
.empty p { font-size: 15px; color: var(--text-2); margin: 4px auto 0; max-width: 32ch; }
.empty .btn { margin-top: 20px; }

/* ---------- detail ---------- */
.d-hero { position: relative; height: calc(300px + env(safe-area-inset-top)); display: grid; place-items: center; overflow: hidden; }
.d-hero::before { content: ""; position: absolute; left: 50%; top: calc(50% + 72px + env(safe-area-inset-top) / 2); width: 150px; height: 22px; transform: translateX(-50%); border-radius: 50%; background: rgba(60,40,20,.14); filter: blur(8px); }
.d-hero img, .d-hero .emo { position: relative; width: 168px; height: 168px; margin-top: env(safe-area-inset-top); font-size: 130px; line-height: 168px; text-align: center; animation: rise .5s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.d-actions { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 2; }
.d-actions .icon-btn { border: 0; background: rgba(255,255,255,.92); }
.d-actions .fav { position: static; width: 44px; height: 44px; }
.d-sheet { position: relative; margin-top: -28px; background: var(--canvas); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 24px 20px 0; }
.d-right.d-sheet { margin-top: 0; border-radius: 0; padding-top: 0; }
.d-cat { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 4px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; }
.d-cat::after { content: ""; position: absolute; inset: -8px 0; }
.d-cat img, .d-cat .emo { width: 20px; height: 20px; font-size: 15px; line-height: 20px; text-align: center; }
.d-title { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-top: 10px; line-height: 1.2; }
.d-rating { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: var(--text-2); }
.d-rating .star { width: 16px; height: 16px; fill: var(--accent); stroke: none; color: var(--accent); }
.d-rating b { color: var(--text); font-weight: 600; }
.d-rating .tag { margin-left: 6px; gap: 4px; }
.d-rating .tag .ic { width: 13px; height: 13px; }
.d-desc { margin-top: 12px; font-size: 16px; color: var(--text-2); max-width: 60ch; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
.fact { background: var(--surface); border-radius: var(--r-md); padding: 12px; box-shadow: var(--sh-1); }
.fact .chip-ic { width: 32px; height: 32px; border-radius: 12px; display: grid; place-items: center; }
.fact .chip-ic .ic { width: 17px; height: 17px; }
.fact .v { font-size: 16px; font-weight: 600; margin-top: 8px; line-height: 1.2; }
.fact .l { font-size: 12px; color: var(--text-2); }

.nutri { margin-top: 12px; background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--sh-1); }
.nutri-top { display: flex; justify-content: space-between; align-items: baseline; }
.nutri-top h2 { font-size: 16px; font-weight: 600; }
.nutri-top .kcal { font-size: 14px; color: var(--text-2); }
.nutri-top .kcal b { font-size: 20px; color: var(--text); font-weight: 600; letter-spacing: -.01em; }
.mbar { display: flex; gap: 4px; height: 12px; margin-top: 14px; }
.mbar span { border-radius: 6px; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.mbar span:nth-child(2) { animation-delay: .06s; } .mbar span:nth-child(3) { animation-delay: .12s; }

    <div class="greet"><p class="sub">${greeting()}, Sam</p><h1>What would you like to cook?</h1></div>
    <form class="search" role="search" onsubmit="return false">${ic('search')}
      <label class="sr" for="q">Search recipes</label>
      <input id="q" type="search" placeholder="Search recipes or ingredients" autocomplete="off" value="${esc(homeQuery)}">
      <button type="button" class="clear" aria-label="Clear search" ${homeQuery ? '' : 'hidden'}>${ic('x')}</button></form>
  </div>
  <div id="homeBody"></div>`;
}
function HomeBody() {
  const t = pickTonight();
  if (homeQuery.trim()) {
    const q = homeQuery.trim().toLowerCase();
    const res = RECIPES.filter(r => r.title.toLowerCase().includes(q) || r.ing.some(i => i[2].toLowerCase().includes(q)) || CAT[r.cat].name.toLowerCase().includes(q));
    return `<section class="section"><div class="section-head"><h2>Results</h2><span class="count num">${plural(res.length, 'recipe')}</span></div>
      ${res.length ? `<div class="grid">${res.map(r => card(r)).join('')}</div>` : empty('🔍', `No recipes for “${esc(homeQuery.trim())}”`, 'Try an ingredient like “chorizo” or “chickpeas”, or browse by category.', `<a class="btn btn-ghost" href="#/browse">Browse categories</a>`)}</section>`;
  }
  const quick = RECIPES.filter(r => r.time <= 30 && r !== t && r.cat !== 'baking').sort((a, b) => a.time - b.time);
  const list = homeCat === 'all' ? RECIPES.filter(r => r !== t && !quick.includes(r)).sort((a, b) => b.reviews - a.reviews).slice(0, 8) : byCat(homeCat);
  return `
  <section class="feature" aria-label="Tonight's pick">
    <div class="feature-body">
      <span class="kicker">Tonight's pick</span>
      <h2>${esc(t.title)}</h2>
      <p class="feature-desc">${esc(t.desc)}</p>
      <div class="meta num"><span>${ic('clock', 'ic-sm')}${fmtTime(t.time)}</span><span>${ic('users', 'ic-sm')}Serves ${t.serves}</span><span class="hide-xs">${ic('flame', 'ic-sm')}${kcal(t)} kcal</span></div>
      <a class="btn btn-light" href="#/recipe/${t.id}">View recipe${ic('arrow', 'arrow')}</a>
    </div>
    <div class="feature-art" style="background:${CAT[t.cat].tint}" aria-hidden="true">${emo(t.emoji, 128)}</div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Ready in 30 minutes</h2><a class="link" href="#/browse/quick">See all${ic('right', 'ic-sm')}</a></div>
    <div class="rail">${quick.map(r => card(r)).join('')}</div>
  </section>
  <section class="section" aria-labelledby="cats-h">
    <div class="section-head"><h2 id="cats-h">Categories</h2><a class="link" href="#/browse">See all${ic('right', 'ic-sm')}</a></div>
    <div class="chips" role="toolbar" aria-label="Filter by category">
      <button class="chip plain" data-cat="all" aria-pressed="${homeCat === 'all'}">All</button>
      ${CATS.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${homeCat === c.id}"><span class="dot" style="background:${c.tint}">${emo(c.emoji, 40)}</span>${c.name}</button>`).join('')}
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h2>${homeCat === 'all' ? 'Popular this week' : CAT[homeCat].name}</h2>${homeCat === 'all' ? `<a class="link" href="#/browse">Browse all ${RECIPES.length}${ic('right', 'ic-sm')}</a>` : `<span class="count num">${plural(list.length, 'recipe')}</span>`}</div>
    <div class="grid">${list.map(r => card(r)).join('')}</div>
  </section>`;
}

function Browse() {
  const top = [...RECIPES].sort((a, b) => b.rating - a.rating || b.reviews - a.reviews).slice(0, 4);
  return `<div class="page-head"><div><h1>Browse</h1><p class="sub num">${RECIPES.length} recipes in ${CATS.length} categories</p></div></div>
  <section class="section first" aria-label="Categories"><div class="cats">
    ${[...CATS, QUICK].map(c => `<a class="cat ${c.dark ? 'dark' : ''}" href="#/browse/${c.id}" ${c.dark ? '' : `style="background:${c.tint}"`}>
      <div><h2>${c.name}</h2><p class="num">${plural(byCat(c.id).length, 'recipe')}</p></div>${emo(c.emoji, 128)}</a>`).join('')}
  </div></section>
  <section class="section"><div class="section-head"><h2>Top rated</h2></div>
    <div class="grid">${top.map(r => card(r)).join('')}</div></section>`;
}

let catFilter = 0;
const FILTERS = [['All', () => true], ['Vegetarian', r => r.veg], ['Easy', r => r.level === 'Easy']];
function Category(id) {
  const c = CAT[id]; if (!c) return NotFound();
  const all = byCat(id);
  const avail = FILTERS.map((_, i) => i).filter(i => { const n = all.filter(FILTERS[i][1]).length; return i === 0 || (n > 0 && n < all.length); });
  if (!avail.includes(catFilter)) catFilter = 0;
  const list = all.filter(FILTERS[catFilter][1]);
  return `<section class="cat-hero ${c.dark ? 'dark' : ''}" ${c.dark ? '' : `style="background:${c.tint}"`}>
    <a class="icon-btn" href="#/browse" aria-label="Back to Browse">${ic('back')}</a>
    <div><h1>${c.name}</h1><p>${c.blurb}</p><p class="num hero-n">${plural(all.length, 'recipe')}</p></div>${emo(c.emoji, 192)}</section>
  ${avail.length > 1 ? `<div class="seg seg-filter" role="tablist" aria-label="Filter recipes" style="--n:${avail.length};--i:${avail.indexOf(catFilter)}"><span class="thumb-ind" aria-hidden="true"></span>
    ${avail.map(i => `<button role="tab" data-filter="${i}" aria-selected="${catFilter === i}">${FILTERS[i][0]} <span class="num">${all.filter(FILTERS[i][1]).length}</span></button>`).join('')}</div>` : ''}
  <section class="section" style="margin-top:16px" aria-label="Recipes">
    ${list.length ? `<div class="grid">${list.map(r => card(r, 'h2')).join('')}</div>` : empty(c.emoji, 'Nothing matches this filter', `There are no ${FILTERS[catFilter][0].toLowerCase()} recipes here yet.`, `<button class="btn btn-ghost" data-filter="0">Show all</button>`)}
  </section>`;
}

function Saved() {
  const list = S.favs.map(id => R[id]).filter(Boolean);
  return `<div class="page-head"><div><h1>Saved</h1><p class="sub num">${list.length ? `${plural(list.length, 'recipe')} saved for later` : 'Your favourite recipes in one place'}</p></div></div>
  <section class="section first" aria-label="Saved recipes">
    ${list.length ? `<div class="grid">${list.map(r => card(r, 'h2')).join('')}</div>`
      : empty('🍽️', 'No saved recipes yet', 'Tap the heart on any recipe to keep it here for later.', `<a class="btn" href="#/">Find a recipe${ic('arrow', 'arrow')}</a>`)}
  </section>`;
}

function Profile() {
  const cooked = S.cooked.slice().sort((a, b) => b[1].localeCompare(a[1]));
  const month = cooked.filter(c => Date.now() - new Date(c[1]) < 30 * 864e5).length;
  const tried = new Set(cooked.map(c => R[c[0]]?.cat).filter(Boolean)).size;
  return `<div class="page-head"><h1>Profile</h1></div><div class="prof-grid"><div>
  <section class="prof"><span class="avatar">${avatarHTML}</span><div><h2>Sam Carter</h2><p>Home cook · Manchester</p></div></section>
  <div class="stats">
    <div class="stat dark"><div class="v num">${month}</div><div class="l">Cooked this month</div></div>
    <div class="stat"><div class="v num">${S.favs.length}</div><div class="l">Saved recipes</div></div>
    <div class="stat"><div class="v num">${tried} of ${CATS.length}</div><div class="l">Categories tried</div></div>
  </div>
  <section class="section"><div class="section-head"><h2>Recently cooked</h2></div>
    ${cooked.length ? `<div class="list">${cooked.slice(0, 4).map(([id, d]) => row(R[id], `<span>${ic('calendar')}${relDay(d)}</span>`)).join('')}</div>` : empty('🍳', 'Nothing cooked yet', 'Mark a recipe as cooked when you finish the last step.', '')}
  </section>
  </div><section class="section prof-set"><div class="section-head"><h2>Settings</h2></div>
    <div class="settings">
      <label class="set"><span class="chip-ic" style="background:var(--c-breakfast)">${ic('sun')}</span><span class="t"><b>Keep screen on</b><small>While a recipe is open</small></span><span class="switch"><input type="checkbox" data-pref="awake" ${S.prefs.awake ? 'checked' : ''}><span></span></span></label>
      <label class="set"><span class="chip-ic" style="background:var(--c-pasta)">${ic('bell')}</span><span class="t"><b>Weekly recipe ideas</b><small>Every Sunday morning</small></span><span class="switch"><input type="checkbox" data-pref="ideas" ${S.prefs.ideas ? 'checked' : ''}><span></span></span></label>
      <button class="set" data-action="clear-progress"><span class="chip-ic" style="background:var(--surface-2)">${ic('check')}</span><span class="t"><b>Clear cooking progress</b><small>Unticks all ingredients and steps</small></span>${ic('right')}</button>
      <button class="set danger" data-action="reset"><span class="chip-ic" style="background:#FDECEC;color:#B42318">${ic('trash')}</span><span class="t"><b>Start fresh</b><small>Removes saves and history</small></span>${ic('right')}</button>
    </div>
  </section></div>`;
}

let detailTab = 'ingredients';
function Detail(id) {
  const r = R[id]; if (!r) return NotFound();
  const c = CAT[r.cat];
  const sv = S.servings[id] || r.serves;
  const k = kcal(r); const [p, cb, f] = r.macros; const tot = p * 4 + cb * 4 + f * 9;
  const pp = Math.round(p * 4 / tot * 100), pc = Math.round(cb * 4 / tot * 100), pf = 100 - pp - pc;
  const checked = S.checked[id] || [];
  const done = S.done[id] || [];
  const cur = r.steps.findIndex((_, i) => !done.includes(i));
  const lastCooked = S.cooked.filter(x => x[0] === id).sort((a, b) => b[1].localeCompare(a[1]))[0];
  const cookedToday = lastCooked && relDay(lastCooked[1]) === 'Today';
  const step = (s, i) => `<li class="step ${done.includes(i) ? 'done' : ''} ${i === cur ? 'current' : ''}">
      <button class="step-n num" data-step="${i}" aria-pressed="${done.includes(i)}" aria-label="Step ${i + 1}: mark as ${done.includes(i) ? 'not done' : 'done'}"><span>${i + 1}</span>${ic('check')}</button>
      <div><p>${esc(s[0])}</p>${s[1] ? `<span class="timer num">${ic('timer')}${fmtTime(s[1])}</span>` : ''}</div></li>`;
  return `<div class="detail">
  <div class="d-left">
    <div class="d-hero" style="background:${c.tint}">
      <div class="d-actions"><a class="icon-btn" href="#/" data-action="back" aria-label="Back">${ic('back')}</a>${favBtn(r)}</div>
      ${emo(r.emoji, 360)}
    </div>
    <div class="d-sheet"><div class="d-intro">
      <a class="d-cat" href="#/browse/${c.id}" style="background:${c.tint}">${emo(c.emoji, 40)}${c.name}</a>
      <h1 class="d-title">${esc(r.title)}</h1>
      <div class="d-rating num"><svg class="ic star" viewBox="0 0 24 24" aria-hidden="true">${P.star}</svg><b>${r.rating}</b><span>(${r.reviews.toLocaleString('en-GB')} ratings)</span>${r.veg ? `<span class="tag">${ic('leaf')}Vegetarian</span>` : ''}</div>
      <p class="d-desc">${esc(r.desc)}</p>
      <div class="facts">
        <div class="fact"><span class="chip-ic" style="background:var(--c-breakfast)">${ic('clock')}</span><div class="v num">${fmtTime(r.time)}</div><div class="l">Total time</div></div>
        <div class="fact"><span class="chip-ic" style="background:var(--c-dinner)">${ic('chef')}</span><div class="v">${r.level}</div><div class="l">Difficulty</div></div>
        <div class="fact"><span class="chip-ic" style="background:var(--c-pasta)">${ic('check')}</span><div class="v num">${r.steps.length} steps</div><div class="l">${r.ing.length} ingredients</div></div>
      </div>
      <section class="nutri" aria-label="Nutrition per ${one(r.yieldWord)}: ${k} kcal, ${p} g protein, ${cb} g carbs, ${f} g fat">
        <div class="nutri-top"><h2>Nutrition</h2><span class="kcal num"><b>${k}</b> kcal per ${one(r.yieldWord)}</span></div>
        <div class="mbar" aria-hidden="true"><span class="m-p" style="flex:${pp}"></span><span class="m-c" style="flex:${pc}"></span><span class="m-f" style="flex:${pf}"></span></div>
        <div class="mlegend num" aria-hidden="true">
          <div><span class="ml-l"><i class="m-p"></i>Protein</span><b>${p} g</b><small>${pp}%</small></div>
          <div><span class="ml-l"><i class="m-c"></i>Carbs</span><b>${cb} g</b><small>${pc}%</small></div>
          <div><span class="ml-l"><i class="m-f"></i>Fat</span><b>${f} g</b><small>${pf}%</small></div></div>
      </section>
    </div></div>
  </div>
  <div class="d-right d-sheet">
    <div class="seg" role="tablist" aria-label="Recipe sections" data-tab="${detailTab}"><span class="thumb-ind" aria-hidden="true"></span>
      <button role="tab" id="t-ing" aria-controls="p-ing" data-tab="ingredients" aria-selected="${detailTab === 'ingredients'}">Ingredients <span class="num">${r.ing.length}</span></button>
      <button role="tab" id="t-steps" aria-controls="p-steps" data-tab="steps" aria-selected="${detailTab === 'steps'}">Method <span class="num">${r.steps.length} steps</span></button>
    </div>
    <section class="panel ${detailTab === 'ingredients' ? '' : 'off'}" id="p-ing" role="tabpanel" aria-labelledby="t-ing">
      <div class="panel-head"><div><h2 class="panel-title-d">Ingredients</h2><span class="have num">${checked.length} of ${r.ing.length} ready${checked.length ? ' · <button data-action="untick">Untick all</button>' : ''}</span></div>
        <div class="stepper" role="group" aria-label="Quantities"><button data-serv="-1" aria-label="Fewer ${r.yieldWord}" ${sv <= 1 ? 'disabled' : ''}>${ic('minus', 'ic-sm')}</button><output class="num" aria-live="polite"><b>${sv}</b> ${sv === 1 ? one(r.yieldWord) : r.yieldWord}</output><button data-serv="1" aria-label="More ${r.yieldWord}" ${sv >= r.serves * 4 ? 'disabled' : ''}>${ic('plus', 'ic-sm')}</button></div>
      </div>
      <ul class="ingr">${r.ing.map((g, i) => `<li><label><input type="checkbox" data-ing="${i}" ${checked.includes(i) ? 'checked' : ''}><span class="box">${ic('check')}</span>
        <span class="name">${esc(cap(g[2]))}${g[3] ? `<span class="note">, ${esc(g[3])}</span>` : ''}</span><span class="qty num">${g[0] == null ? '' : fmtQty(g[0] * sv / r.serves, g[1])}</span></label></li>`).join('')}</ul>
    </section>
    <section class="panel ${detailTab === 'steps' ? '' : 'off'}" id="p-steps" role="tabpanel" aria-labelledby="t-steps">
      <div class="panel-head"><div><h2 class="panel-title-d">Method</h2><span class="have num">${done.length} of ${r.steps.length} steps done</span></div></div>
      <div class="pbar" aria-hidden="true"><i style="width:${done.length / r.steps.length * 100}%"></i></div>
      <ol class="steps">${r.steps.map(step).join('')}</ol>
      ${cookedToday ? `<div class="cooked-note">${ic('check')}Cooked today</div>` : `<button class="btn btn-block cooked-cta" data-action="cooked">${ic('check')}Mark as cooked</button>`}
    </section>
  </div></div>`;
}
const NotFound = () => empty('🤔', 'Recipe not found', 'It may have been removed. Have a look through the categories instead.', `<a class="btn" href="#/browse">Browse recipes</a>`);

/* ---------------- router ---------------- */
let wake;
async function setWake(on) {
  try { if (on && S.prefs.awake && 'wakeLock' in navigator) { if (!wake) wake = await navigator.wakeLock.request('screen'); } else if (wake) { await wake.release(); wake = null; } } catch {}
}
let lastRoute = '', navDepth = 0;
const activeFor = h => h.startsWith('#/browse') ? 'Browse' : h.startsWith('#/saved') ? 'Saved' : h.startsWith('#/profile') ? 'Profile' : h.startsWith('#/recipe') ? '' : 'Discover';
function render(keepScroll) {
  const h = location.hash || '#/';
  const v = $('#view'); const shell = $('#shell');
  let m, detail = false;
  if ((m = h.match(/^#\/recipe\/([\w-]+)/))) { if (lastRoute !== h) detailTab = 'ingredients'; v.innerHTML = Detail(m[1]); detail = true; }
  else if ((m = h.match(/^#\/browse\/([\w-]+)/))) { if (lastRoute !== h) catFilter = 0; v.innerHTML = Category(m[1]); }
  else if (h.startsWith('#/browse')) v.innerHTML = Browse();
  else if (h.startsWith('#/saved')) v.innerHTML = Saved();
  else if (h.startsWith('#/profile')) v.innerHTML = Profile();
  else { v.innerHTML = Home(); $('#homeBody').innerHTML = HomeBody(); }
  v.classList.toggle('detail-mode', detail);
  shell.classList.toggle('hide-tabs', detail);
  setWake(detail);
  renderNav(activeFor(h));
  if (!keepScroll && lastRoute !== h) window.scrollTo(0, 0);
  lastRoute = h;
}
window.addEventListener('hashchange', () => { navDepth++; render(); });

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-action]'); if (!t) return;
  if (t.dataset.action === 'back') { if (navDepth > 0) { e.preventDefault(); history.back(); } return; }
  if (t.dataset.fav) {
    const id = t.dataset.fav; const on = !isFav(id);
    S.favs = on ? [id, ...S.favs] : S.favs.filter(x => x !== id); save();
    toast(on ? 'Saved to your recipes' : 'Removed from saved');
    if (location.hash.startsWith('#/saved') || location.hash.startsWith('#/profile')) { render(true); return; }
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', `${on ? 'Remove' : 'Save'} ${R[id].title} ${on ? 'from' : 'to'} saved`);
      b.classList.remove('pop'); void b.offsetWidth; if (on) b.classList.add('pop');
    });
    renderNav(activeFor(location.hash || '#/'));
    return;
  }
  if (t.dataset.cat) { homeCat = t.dataset.cat; $('#homeBody').innerHTML = HomeBody(); document.querySelector(`[data-cat="${homeCat}"]`)?.focus({ preventScroll: true }); return; }
  if (t.dataset.filter != null) { catFilter = +t.dataset.filter; render(true); document.querySelector(`.seg-filter [data-filter="${catFilter}"]`)?.focus({ preventScroll: true }); return; }
  const rid = location.hash.match(/^#\/recipe\/([\w-]+)/)?.[1];
  const refocus = sel => document.querySelector(sel)?.focus({ preventScroll: true });
  if (t.dataset.tab && rid) { detailTab = t.dataset.tab; render(true); refocus(`.seg [data-tab="${detailTab}"]`); return; }
  if (t.dataset.serv && rid) { const r = R[rid]; S.servings[rid] = Math.max(1, Math.min(r.serves * 4, (S.servings[rid] || r.serves) + +t.dataset.serv)); save(); render(true); refocus(`[data-serv="${t.dataset.serv}"]`); return; }
  if (t.dataset.step && rid) {
    const i = +t.dataset.step; const d = S.done[rid] || []; S.done[rid] = d.includes(i) ? d.filter(x => x !== i) : [...d, i]; save(); render(true); refocus(`[data-step="${i}"]`); return;
  }
  const a = t.dataset.action;
  if (a === 'untick' && rid) { S.checked[rid] = []; save(); render(true); return; }
  if (a === 'cooked' && rid) { S.cooked.push([rid, new Date().toISOString()]); S.done[rid] = []; S.checked[rid] = []; save(); render(true); toast('Added to your cooking history'); return; }
  if (a === 'clear-progress') { S.done = {}; S.checked = {}; save(); toast('Cooking progress cleared'); return; }
  if (a === 'reset') { if (confirm('Remove all saved recipes and cooking history?')) { S = { favs: [], servings: {}, checked: {}, done: {}, cooked: [], prefs: S.prefs }; save(); render(true); toast('All cleared'); } return; }
  if (t.classList.contains('clear')) { homeQuery = ''; const q = $('#q'); q.value = ''; t.hidden = true; $('#homeBody').innerHTML = HomeBody(); q.focus(); }
});
document.addEventListener('change', e => {
  const t = e.target; const rid = location.hash.match(/^#\/recipe\/([\w-]+)/)?.[1];
  if (t.dataset.ing != null && rid) {
    const i = +t.dataset.ing; const c = S.checked[rid] || []; S.checked[rid] = t.checked ? [...c, i] : c.filter(x => x !== i); save();
    const n = S.checked[rid].length;
    document.querySelector('#p-ing .have').innerHTML = `${n} of ${R[rid].ing.length} ready${n ? ' · <button data-action="untick">Untick all</button>' : ''}`;
  }
  if (t.dataset.pref) { S.prefs[t.dataset.pref] = t.checked; save(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { homeQuery = e.target.value; document.querySelector('.search .clear').hidden = !homeQuery; $('#homeBody').innerHTML = HomeBody(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.id === 'q' && homeQuery) document.querySelector('.search .clear').click(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setWake(location.hash.startsWith('#/recipe')); });

render();
</script>
</body>
</html>
