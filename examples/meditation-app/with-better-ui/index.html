<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF1EC">
<title>Stillwater · Meditation and sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft tint — peach canvas, aubergine controls, apricot rings. Figtree + DM Mono.
   Signature: the breathing ring (concentric apricot rings) on today's card and in the player. */
:root {
  --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --canvas: #FBF1EC; --surface: #FFFFFF; --surface-2: #F8EDE7; --line: #F0E1D8; --line-2: #E6D4CA;
  --text: #2A1D2C; --text-2: #6E5E68; --text-3: #9C8A93;
  --brand: #2D1E2F; --brand-2: #3D2A40; --on-brand: #FFFFFF; --on-brand-2: rgba(255,255,255,.72);
  --accent: #FF9F7A; --accent-soft: #FFE3D7; --accent-ink: #A23E1A;
  --ok: #1F8A57; --ok-tint: #E3F4EA;
  --c-sleep: #E8E1F6; --c-calm: #FFE4D8; --c-focus: #DCEAF6; --c-breathe: #DAF0E4; --c-sounds: #F3E8D3;
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(60,30,40,.04), 0 6px 18px -10px rgba(60,30,40,.12);
  --sh-2: 0 1px 2px rgba(60,30,40,.05), 0 10px 24px -10px rgba(60,30,40,.16);
  --sh-float: 0 14px 36px -10px rgba(45,30,47,.38);
  --tab-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- shell ---------- */
.app { max-width: 480px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 48px + env(safe-area-inset-bottom)); }
.side, .aside { display: none; }
.screen { display: none; }
.screen.on { display: block; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; margin-bottom: 12px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.glyph { width: 28px; height: 28px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
.glyph i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(255,159,122,.28); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #FFD9C7; overflow: hidden; border: 2px solid var(--surface); box-shadow: var(--sh-1); }
.avatar img { width: 100%; height: 100%; }
.head { margin-bottom: 20px; }
.head .date { color: var(--text-2); font-size: 14px; margin-bottom: 2px; }
.head h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
.section-title h2 { font-size: 18px; letter-spacing: -.01em; line-height: 1.35; }
.link { font-size: 14px; font-weight: 500; color: var(--accent-ink); padding: 12px 0 12px 12px; margin: -12px 0; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }

.card { background: linear-gradient(180deg, #fff, #fffcfb); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px;
  box-shadow: inset 0 1px 0 #fff, var(--sh-1); }

/* ---------- today's session (summary card) ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; color: var(--on-brand);
  background: radial-gradient(120% 90% at 100% 0%, #4A3150 0%, transparent 60%), linear-gradient(160deg, #36243A, #261928);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--sh-float); min-height: 232px; display: flex; flex-direction: column; }
.hero .label { font-size: 13px; color: var(--on-brand-2); display: flex; align-items: center; gap: 6px; }
.hero .label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.hero h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.015em; margin-top: 8px; max-width: 72%; position: relative; }
.hero .meta { margin-top: 8px; font-size: 14px; color: var(--on-brand-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero .guide { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 20px; font-size: 14px; color: var(--on-brand-2); }
.hero .guide img { width: 28px; height: 28px; border-radius: 50%; background: #FFD9C7; }
.hero .guide b { color: var(--on-brand); font-weight: 500; }
.hero-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; position: relative; z-index: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: var(--r-full);
  font-size: 15px; font-weight: 600; white-space: nowrap; transition: transform .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out; }
.btn:active { transform: scale(.97); }
.btn-accent { background: var(--accent); color: #2A1410; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px -8px rgba(255,159,122,.7); }
@media (hover: hover) { .btn-accent:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px -8px rgba(255,159,122,.85); } }
.btn-dark { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 8px 18px -10px rgba(45,30,47,.6); }
@media (hover: hover) { .btn-dark:hover { background: var(--brand-2); } }
.btn-ghost { background: var(--surface); border: 1px solid var(--line-2); color: var(--text); }
@media (hover: hover) { .btn-ghost:hover { background: var(--surface-2); } }
.btn-block { width: 100%; height: 52px; font-size: 16px; }
.btn .ic { width: 18px; height: 18px; }
.btn .fill { fill: currentColor; stroke: none; }
.hero .done-note { font-size: 14px; color: var(--on-brand-2); display: inline-flex; gap: 6px; align-items: center; }
.hero .done-note .ic { color: var(--accent); }

.breath { position: absolute; right: -78px; top: -40px; width: 230px; height: 230px; pointer-events: none; }
.breath i { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--accent); animation: breathe 10s ease-in-out infinite; }
.breath i:nth-child(1) { opacity: .9; inset: 70px; background: radial-gradient(circle at 40% 35%, rgba(255,190,160,.85), rgba(255,159,122,.35) 60%, rgba(255,159,122,.12)); }
.breath i:nth-child(2) { opacity: .45; inset: 46px; animation-delay: .25s; }
.breath i:nth-child(3) { opacity: .25; inset: 22px; animation-delay: .5s; }
.breath i:nth-child(4) { opacity: .12; inset: 0; animation-delay: .75s; }
@keyframes breathe { 0%, 100% { transform: scale(.86); } 40% { transform: scale(1); } 52% { transform: scale(1); } }

/* ---------- week card ---------- */
.week-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.week-head h2 { font-size: 18px; letter-spacing: -.01em; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: var(--r-full);
  background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill .ic { width: 16px; height: 16px; }
.pill.muted { background: var(--surface-2); color: var(--text-2); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day .d { font-size: 12px; color: var(--text-3); font-weight: 500; }
.day.today .d { color: var(--text); font-weight: 600; }
.ring { width: 38px; height: 38px; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .n { font-size: 13px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ring.full { background: var(--accent); border-radius: 50%; }
.ring.full .ic { width: 18px; height: 18px; color: #2A1410; stroke-width: 2.25; }
.ring.future .n { color: var(--text-3); }
.ring.future svg circle { stroke-dasharray: 3 4; stroke: var(--line-2); }
.ring.missed .n { color: var(--text-3); }
.day.today .ring::after { content: ""; position: absolute; bottom: -9px; width: 4px; height: 4px; border-radius: 50%; background: var(--text); }
.week-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.week-stats > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.week-stats > div:first-child { padding-right: 16px; }
.ws-label { font-size: 13px; color: var(--text-2); }
.ws-fig { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; line-height: 1.35; }
.ws-fig small { font-size: 14px; font-weight: 500; color: var(--text-3); }
.segs { display: flex; gap: 4px; margin-top: 10px; }
.segs i { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.segs i.on { background: var(--accent); box-shadow: none; }
.bar { height: 6px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* ---------- lists ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 72px; width: 100%; text-align: left; position: relative;
  transition: background-color .15s ease-out; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 74px; right: 0; height: 1px; background: var(--line); }
@media (hover: hover) { .row:hover { background: #FFF8F5; } }
.row:active { background: var(--surface-2); }
.thumb { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--c); font-size: 24px; }
.thumb img { width: 28px; height: 28px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 500; line-height: 1.35; }
.row-sub { font-size: 14px; color: var(--text-2); margin-top: 2px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.row-sub .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.row-end { display: flex; align-items: center; gap: 8px; flex: none; }
.play-sm { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff;
  transition: transform .15s ease-out, background-color .15s ease-out; }
.play-sm .ic { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-left: 2px; }
@media (hover: hover) { .row:hover .play-sm { background: var(--brand-2); } }
.row:active .play-sm { transform: scale(.94); }
.check-sm { width: 24px; height: 24px; border-radius: 50%; background: var(--ok-tint); color: var(--ok); display: grid; place-items: center; }
.check-sm .ic { width: 14px; height: 14px; stroke-width: 2.5; }
.len { font-size: 14px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- library ---------- */
.search { position: relative; margin-bottom: 14px; }
.search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search input { width: 100%; height: 48px; border-radius: var(--r-full); border: 1px solid var(--line-2); background: var(--surface);
  padding: 0 44px 0 46px; font-size: 16px; outline: none; box-shadow: inset 0 1px 2px rgba(60,30,40,.04); transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.search .clear { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border-radius: 50%; display: none; place-items: center; color: var(--text-2); }
.search.has .clear { display: grid; }
.search .clear:hover { background: var(--surface-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 20px; padding: 2px 20px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 40px; padding: 0 14px; border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--line-2);
  font-size: 14px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s, color .15s, border-color .15s; }
.chip .count { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
@media (hover: hover) { .chip:hover { border-color: var(--text-3); } }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip[aria-pressed="true"] .count { color: rgba(255,255,255,.65); }
.group-label { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 20px 4px 8px; display: flex; justify-content: space-between; }
.group-label:first-of-type { margin-top: 0; }
.save { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); transition: color .15s, background-color .15s; }
@media (hover: hover) { .save:hover { background: var(--surface-2); color: var(--text-2); } }
.save[aria-pressed="true"] { color: var(--brand); }
.save[aria-pressed="true"] .ic { fill: currentColor; }
.empty { text-align: center; padding: 40px 24px; }
.empty img { width: 88px; height: 88px; margin: 0 auto 12px; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--text-2); font-size: 15px; margin-top: 4px; }
.empty .btn { margin-top: 16px; }

/* ---------- progress ---------- */
.prog-grid { display: grid; gap: 12px; }
.streak-card { display: flex; align-items: center; gap: 16px; }
.streak-card .big { width: 64px; height: 64px; border-radius: 20px; background: var(--accent-soft); display: grid; place-items: center; flex: none; font-size: 34px; }
.streak-card .big img { width: 42px; height: 42px; }
.fig-l { font-size: 13px; color: var(--text-2); }
.fig { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.fig small { font-size: 16px; font-weight: 500; color: var(--text-2); letter-spacing: 0; }
.fig-meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { padding: 16px; }
.tile .fig { font-size: 28px; margin-top: 4px; }
.delta { font-size: 13px; margin-top: 4px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta b { font-weight: 600; color: var(--ok); }
.delta b.down { color: var(--accent-ink); }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.chart-head h2 { font-size: 16px; font-weight: 600; }
.chart-sum { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-top: 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.chart { position: relative; height: 180px; margin-top: 24px; margin-left: 24px; }
.chart .grid { position: absolute; inset: 0; }
.chart .gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--line-2); }
.chart .gl span { position: absolute; left: -26px; top: -8px; font-family: var(--mono); font-size: 11px; color: var(--text-3); width: 20px; text-align: right; }
.chart .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(162,62,26,.5); z-index: 2; pointer-events: none; }
.chart .goal span { position: absolute; left: 0; top: -9px; background: var(--surface); padding: 1px 6px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(162,62,26,.3); font-family: var(--mono); font-size: 11px; color: var(--accent-ink); }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; }
.col { position: relative; height: 100%; display: flex; justify-content: center; align-items: flex-end; }
.col .ghost { position: absolute; bottom: 0; width: 22px; border-radius: 8px 8px 3px 3px; background: #F1E3DA; left: calc(50% - 6px); }
.col .cur { position: relative; width: 22px; border-radius: 8px 8px 3px 3px; background: #FFB898; left: -5px; transition: height .6s cubic-bezier(.2,.8,.2,1); }
.col.hl .cur { background: var(--brand); }
.col .tip { position: absolute; left: 50%; transform: translate(calc(-50% - 4px), -100%); top: -8px; background: var(--brand); color: #fff;
  font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.xlabels { display: grid; grid-template-columns: repeat(7, 1fr); margin-left: 24px; margin-top: 8px; }
.xlabels span { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.xlabels span.t { color: var(--text); font-weight: 500; }
.heat { display: grid; grid-template-columns: 52px repeat(7, 1fr); gap: 6px; margin-top: 16px; align-items: center; }
.heat .hl { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.heat .hd { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-align: center; }
.cell { height: 34px; border-radius: 8px; background: var(--surface-2); }
.cell.l1 { background: #FFE3D7; } .cell.l2 { background: #FFC6AE; } .cell.l3 { background: #FFA984; } .cell.l4 { background: #E9774D; }
.cell.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.cell.now { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--brand); }
.heat-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.heat-legend .cell { width: 12px; height: 12px; border-radius: 3px; aspect-ratio: auto; }
.heat-legend span { margin: 0 4px; }

/* ---------- profile ---------- */
.profile { display: flex; align-items: center; gap: 14px; }
.profile .avatar { width: 56px; height: 56px; }
.profile h2 { font-size: 20px; letter-spacing: -.01em; }
.profile p { font-size: 14px; color: var(--text-2); }
.set-group { margin-top: 24px; }
.set-group > h2 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 4px 8px; }
.set { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; position: relative; width: 100%; text-align: left; }
.set + .set::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--line); }
.set.stack { flex-wrap: wrap; }
.set-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--text); flex: none; }
.set-ic .ic { width: 18px; height: 18px; }
.set-main { flex: 1; min-width: 0; }
.set-title { font-size: 16px; font-weight: 500; }
.set-sub { font-size: 13px; color: var(--text-2); }
.seg { display: flex; padding: 3px; border-radius: var(--r-full); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); width: 100%; margin-left: 50px; }
.seg button { flex: 1; height: 40px; border-radius: var(--r-full); font-size: 14px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(60,30,40,.08), 0 2px 6px -2px rgba(60,30,40,.12); }
.toggle { width: 50px; height: 30px; border-radius: 15px; background: #E5D5CC; position: relative; flex: none; transition: background-color .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.toggle[aria-checked="true"] { background: var(--brand); }
.toggle::before { content: ""; position: absolute; inset: -8px -4px; }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.chev { color: var(--text-3); }

/* ---------- tab bar ---------- */

  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--sh-float); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 20px; color: rgba(255,255,255,.62);
  font-size: 12px; font-weight: 500; transition: color .15s, background-color .15s; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(32,20,34,.42); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 28px 28px 0 0; max-width: 480px; margin: 0 auto;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: var(--sh-float); }
.sheet.on { transform: none; }

.sheet-top { display: flex; align-items: flex-start; gap: 16px; }
.sheet .thumb { width: 72px; height: 72px; border-radius: 22px; }

.sheet h2 { font-size: 22px; letter-spacing: -.015em; line-height: 1.25; }
.sheet .cat { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.sheet .desc { color: var(--text-2); margin-top: 16px; font-size: 15px; line-height: 1.55; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r-md); }
.facts div { padding: 12px 14px; }
.facts div + div { border-left: 1px solid var(--line); }
.facts .k { font-size: 12px; color: var(--text-2); }

.sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
.sheet-actions .btn-ghost { width: 52px; height: 52px; padding: 0; flex: none; }

.x-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); margin-left: auto; flex: none; background: var(--surface-2); }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; color: #fff; display: flex; flex-direction: column; align-items: center;
  background: radial-gradient(90% 60% at 50% 38%, #4B3150 0%, #2D1E2F 55%, #1E1420 100%);
  padding: calc(16px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom)); opacity: 0; pointer-events: none; transform: scale(1.02); transition: opacity .3s, transform .3s; }
.sheet:focus, .player:focus { outline: none; }
.player.on { opacity: 1; pointer-events: auto; transform: none; }
.p-inner { width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; }
.p-top { display: flex; align-items: center; justify-content: space-between; }
.p-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: #fff; transition: background-color .15s; }
@media (hover: hover) { .p-icon:hover { background: rgba(255,255,255,.14); } }
.p-icon[aria-pressed="false"] { color: rgba(255,255,255,.55); }
.p-cat { font-size: 13px; color: rgba(255,255,255,.7); }
.p-stage { flex: 1; display: grid; place-items: center; position: relative; min-height: 260px; }
.p-rings { position: relative; width: min(72vw, 300px); aspect-ratio: 1; }
.p-rings i { position: absolute; border-radius: 50%; border: 1.5px solid var(--accent); animation: pbreathe 10s ease-in-out infinite; }
.p-rings i:nth-child(1) { inset: 28%; background: radial-gradient(circle, rgba(255,159,122,.55), rgba(255,159,122,.12)); border-color: rgba(255,159,122,.9); }

.p-rings i:nth-child(3) { inset: 7%; opacity: .22; animation-delay: .4s; }
.p-rings i:nth-child(4) { inset: -4%; opacity: .1; animation-delay: .6s; }
.player.paused .p-rings i { animation-play-state: paused; }
@keyframes pbreathe { 0%, 100% { transform: scale(.78); } 40% { transform: scale(1); } 48% { transform: scale(1); } }

}

const byId = Object.fromEntries(SESSIONS.map(s => [s.id, s]));

/* ================= dates ================= */
const pad = n => String(n).padStart(2, '0');

const DAY_S = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* ================= state ================= */
const STORE = 'stillwater.v1';
function seedHistory() {
  let s = 20261116; const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const t = today0(), h = {};
  const eve = ['unwind', 'bodyscan', 'countdown', 'clouds', '478', 'rain', 'unwind', 'bodyscan'];
  const day = ['morning', 'quiet', 'coffee', 'deepwork', 'box', 'twomin', 'kind', 'morning'];
  for (let i = 1; i <= 60; i++) {
    const d = addDays(t, -i);
    const keep = i <= 8 || rnd() > (i === 9 ? 1 : 0.27);
    if (!keep) continue;
    const list = [];
    if (rnd() > 0.35) { const id = day[Math.floor(rnd() * day.length)]; list.push({ id, min: byId[id].min, at: `0${7 + Math.floor(rnd() * 2)}:${pad(Math.floor(rnd() * 6) * 10)}` }); }
    if (!list.length || rnd() > 0.45) { const id = eve[Math.floor(rnd() * eve.length)]; list.push({ id, min: Math.min(byId[id].min, 20), at: `22:${pad(Math.floor(rnd() * 5) * 10 + 5)}` }); }
    h[key(d)] = list;
  }
  if (new Date().getHours() >= 9) h[key(t)] = [{ id: 'morning', min: 5, at: '07:40' }];
  return h;
}
const defaults = () => ({ name: 'Maya Chen', goalMin: 10, weekGoal: 5, bedtime: true, bedtimeAt: '22:30', morningRem: false, ambient: true, saved: ['rain', '478', 'bodyscan'], history: seedHistory() });
let S;
try { S = JSON.parse(localStorage.getItem(STORE)) || defaults(); } catch { S = defaults(); }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} };
save();

/* ================= derived ================= */
const dayMin = k => (S.history[k] || []).reduce((a, x) => a + x.min, 0);
const mindful = k => (S.history[k] || []).length > 0;
function streak() {
  let d = today0(); if (!mindful(key(d))) d = addDays(d, -1);
  let n = 0; while (mindful(key(d))) { n++; d = addDays(d, -1); } return n;
}
function bestStreak() {
  const keys = Object.keys(S.history).filter(mindful).sort(); let best = 0, run = 0, prev = null;
  for (const k of keys) { const d = new Date(k + 'T00:00'); run = prev && key(addDays(prev, 1)) === k ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
function weekDays(monday) { return Array.from({ length: 7 }, (_, i) => addDays(monday, i)); }
const weekMindful = monday => weekDays(monday).filter(d => mindful(key(d))).length;
function weeksOnTarget() {
  const mon = mondayOf(today0()); let n = weekMindful(mon) >= S.weekGoal ? 1 : 0; let w = addDays(mon, -7);
  while (weekMindful(w) >= S.weekGoal) { n++; w = addDays(w, -7); } return n;
}
function range(fromOffset, days) { let m = 0, c = 0; for (let i = 0; i < days; i++) { const k = key(addDays(today0(), -(fromOffset + i))); m += dayMin(k); c += (S.history[k] || []).length; } return { m, c }; }
function todaysPick() {
  const h = new Date().getHours();
  return h < 11 ? byId.morning : h < 17 ? byId.coffee : byId.unwind;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
const firstName = () => S.name.split(' ')[0];
const doneToday = id => (S.history[key(today0())] || []).some(x => x.id === id);

/* ================= render: shared ================= */
function ringSvg(p) {
  const r = 16.5, c = 2 * Math.PI * r;

}
function weekCard() {
  const t = today0(), mon = mondayOf(t), st = streak(), wm = weekMindful(mon), tm = dayMin(key(t));
  const days = weekDays(mon).map((d, i) => {
    const k = key(d), m = dayMin(k), fut = d > t, isT = k === key(t);
    const full = m >= S.goalMin;
    const label = `${DAY_S[i]} ${d.getDate()}: ${fut ? 'upcoming' : m ? m + ' min' : 'no session'}`;
    return `<div class="day ${isT ? 'today' : ''}" aria-label="${label}"><span class="d" aria-hidden="true">${DAY_L[i]}</span>
      <span class="ring ${full ? 'full' : ''} ${fut ? 'future' : ''} ${!fut && !m && !isT ? 'missed' : ''}" aria-hidden="true">${full ? icon('check') : ringSvg(m / S.goalMin) + `<span class="n">${d.getDate()}</span>`}</span></div>`;
  }).join('');
  return `<article class="card" aria-labelledby="h-week">
    <div class="week-head"><h2 id="h-week">This week</h2>
      ${st ? `<span class="pill">${icon('flame')}<span class="num">${st}-day streak</span></span>` : `<span class="pill muted">No streak yet</span>`}</div>

      <div><p class="ws-label">Today</p><p class="ws-fig num">${tm} <small>of ${S.goalMin} min</small></p>

}
function row(s, end = 'play') {

function recentCard() {
  const items = [];

  const el = document.getElementById('s-profile');
  const total = Object.values(S.history).flat().reduce((a, x) => a + x.min, 0);
  const first = Object.keys(S.history).filter(mindful).sort()[0];
  const since = first ? new Date(first + 'T00:00').toLocaleDateString('en-GB', { month: 'long' }) : '';
  const seg = (k, vals, unit) => `<div class="seg" role="group" aria-label="${k}">${vals.map(v => `<button data-set="${k}" data-val="${v}" aria-pressed="${S[k] === v}">${v}${unit}</button>`).join('')}</div>`;
  el.innerHTML = `<header class="head"><p class="date">Settings</p><h1 id="h-profile">Profile</h1></header>
    <article class="card profile"><span class="avatar"><img alt="" data-av src="${avatar('Maya', 'ffd9c7')}"></span>
      <div><h2>${S.name}</h2><p class="num">${first ? `${Math.round(total / 60)} hours since ${since}` : 'No sessions yet'}</p></div></article>
    <div class="set-group"><h2>Practice</h2><div class="list">
      <div class="set stack"><span class="set-ic">${icon('target')}</span><div class="set-main"><p class="set-title">Daily goal</p><p class="set-sub">Minutes of practice each day</p></div>${seg('goalMin', [5, 10, 15, 20], ' min')}</div>
      <div class="set stack"><span class="set-ic">${icon('cal')}</span><div class="set-main"><p class="set-title">Weekly goal</p><p class="set-sub">Mindful days that keep a week on target</p></div>${seg('weekGoal', [3, 4, 5, 6, 7], '')}</div>
    </div></div>
    <div class="set-group"><h2>Reminders</h2><div class="list">
      <div class="set"><span class="set-ic">${icon('moon')}</span><div class="set-main"><p class="set-title">Bedtime reminder</p><p class="set-sub">Every night at ${S.bedtimeAt}</p></div>
        <button class="toggle" role="switch" aria-checked="${S.bedtime}" data-toggle="bedtime" aria-label="Bedtime reminder"></button></div>
      ${S.bedtime ? `<div class="set stack" style="padding-top:0;min-height:0"><span class="set-ic" style="visibility:hidden"></span>${seg('bedtimeAt', ['21:30', '22:00', '22:30', '23:00'], '')}</div>` : ''}
      <div class="set"><span class="set-ic">${icon('bell')}</span><div class="set-main"><p class="set-title">Morning check-in</p><p class="set-sub">Weekdays at 07:30</p></div>
        <button class="toggle" role="switch" aria-checked="${S.morningRem}" data-toggle="morningRem" aria-label="Morning check-in"></button></div>
    </div></div>
    <div class="set-group"><h2>Sound</h2><div class="list">
      <div class="set"><span class="set-ic">${icon('vol')}</span><div class="set-main"><p class="set-title">Ambient sound</p><p class="set-sub">Soft background noise during sessions</p></div>
        <button class="toggle" role="switch" aria-checked="${S.ambient}" data-toggle="ambient" aria-label="Ambient sound"></button></div>
    </div></div>
    <div class="set-group"><h2>Your data</h2><div class="list">
      <button class="set" data-action="export"><span class="set-ic">${icon('export')}</span><span class="set-main"><span class="set-title" style="display:block">Export history</span><span class="set-sub">Download every session as JSON</span></span>${icon('chev', 'chev')}</button>
      <button class="set" data-action="restore"><span class="set-ic">${icon('restore')}</span><span class="set-main"><span class="set-title" style="display:block">Load sample history</span><span class="set-sub">Replace your history with 60 days of example sessions</span></span>${icon('chev', 'chev')}</button>
      <button class="set danger" data-action="reset"><span class="set-ic">${icon('reset')}</span><span class="set-main"><span class="set-title" style="display:block">Start fresh</span><span class="set-sub">Clear all sessions and streaks</span></span>${icon('chev', 'chev')}</button>
    </div></div>
    <p class="foot-note">Stillwater 2.4.1</p>`;
}

function renderAside() {
  document.getElementById('aside').innerHTML = weekCard() + recentCard();
  document.getElementById('sideReminder').textContent = S.bedtime ? `Bedtime reminder ${S.bedtimeAt}` : 'Reminders off';
  document.querySelectorAll('[data-av]').forEach(i => i.src = avatar('Maya', 'ffd9c7'));
  document.querySelectorAll('[data-name]').forEach(i => i.textContent = S.name);
}

/* ================= navigation ================= */
let tab = (location.hash || '#today').slice(1);
if (!['today', 'library', 'progress', 'profile'].includes(tab)) tab = 'today';
function renderAll() { renderToday(); renderLibrary(); renderProgress(); renderProfile(); renderAside(); }
function go(t, focus) {
  tab = t; history.replaceState(null, '', '#' + t);
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + t));
  document.querySelectorAll('.tab, .nav-item').forEach(b => b.dataset.tab === t ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.body.classList.toggle('wide', t === 'progress');
  document.body.classList.toggle('solo', t === 'profile');
  window.scrollTo({ top: 0 });
  if (focus) document.getElementById('h-' + t)?.focus?.();
}

/* ================= sheet ================= */
let lastFocus = null;
function openSheet(id) {
  const s = byId[id], saved = S.saved.includes(id), sh = document.getElementById('sheet');
  lastFocus = document.activeElement;
  sh.innerHTML = `<div class="grabber"></div>
    <div class="sheet-top"><span class="thumb" style="--c:${CATS[s.cat].c}">${em(s.e, 46)}</span>
      <div style="flex:1;min-width:0"><p class="cat">${CATS[s.cat].name}</p><h2 id="sheetTitle">${s.t}</h2></div>
      <button class="x-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
    <p class="desc">${s.d}</p>
    <div class="facts"><div><p class="k">Length</p><p class="v num">${s.min} min</p></div><div><p class="k">${s.g === 'Soundscape' ? 'Type' : 'Guide'}</p><p class="v">${s.g}</p></div>
      <div><p class="k">Played</p><p class="v num">${Object.values(S.history).flat().filter(x => x.id === id).length} times</p></div></div>
    <div class="sheet-actions"><button class="btn btn-dark btn-block" data-play="${id}">${icon('play', 'fill')}Start session</button>
      <button class="btn btn-ghost" data-save="${id}" aria-pressed="${saved}" aria-label="${saved ? 'Remove from saved' : 'Save'}">${icon('bookmark')}</button></div>`;
  sh.classList.add('on'); document.getElementById('scrim').classList.add('on');
  setTimeout(() => sh.focus(), 50);
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('on'); document.getElementById('scrim').classList.remove('on');
  lastFocus?.focus?.();
}

/* ================= player ================= */
const P = { id: null, total: 0, el: 0, playing: false, last: 0, raf: 0, audio: null };
const fmt = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function openPlayer(id) {
  closeSheet();
  const s = byId[id], pl = document.getElementById('player');
  Object.assign(P, { id, total: s.min * 60, el: 0 });
  pl.classList.remove('complete');
  document.getElementById('pTitle').textContent = s.t;
  document.getElementById('pGuide').textContent = s.g === 'Soundscape' ? `Soundscape · ${s.min} min` : `With ${s.g} · ${s.min} min`;
  document.getElementById('pCat').textContent = CATS[s.cat].name;
  pl.querySelectorAll('.p-rings i').forEach(i => { i.style.animation = 'none'; i.offsetHeight; i.style.animation = ''; });
  pl.classList.add('on'); document.body.style.overflow = 'hidden';
  setSoundBtn(); play(true); tick();
  setTimeout(() => document.getElementById('player').focus(), 60);
}
function play(on) {
  P.playing = on; P.last = performance.now();
  const pl = document.getElementById('player'), b = document.getElementById('pPlay');
  pl.classList.toggle('paused', !on);
  b.innerHTML = icon(on ? 'pause' : 'play'); b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  ambient(on && S.ambient);
  cancelAnimationFrame(P.raf); if (on) P.raf = requestAnimationFrame(loop);
}
function loop(now) {
  if (!P.playing) return;
  P.el = Math.min(P.total, P.el + (now - P.last) / 1000); P.last = now; tick();
  if (P.el >= P.total) return complete();
  P.raf = requestAnimationFrame(loop);
}
let lastCue = '';
function tick() {
  const pct = P.el / P.total * 100;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pBar').setAttribute('aria-valuenow', Math.round(pct));
  document.getElementById('pEl').textContent = fmt(P.el);
  document.getElementById('pRem').textContent = '−' + fmt(P.total - Math.floor(P.el));
  const cue = !P.playing ? 'Paused' : (P.el % 10) < 4 ? 'Breathe in' : 'Breathe out';
  if (cue !== lastCue) { document.getElementById('pCue').textContent = cue; lastCue = cue; }
}
function logSession(id, min) {
  const k = key(today0()), d = new Date();
  (S.history[k] ||= []).push({ id, min, at: `${pad(d.getHours())}:${pad(d.getMinutes())}` });
  save(); renderAll(); go(tab);
}
function complete() {
  play(false); const s = byId[P.id];
  logSession(P.id, s.min);
  const pl = document.getElementById('player'); pl.classList.add('complete');
  const st = streak(), tm = dayMin(key(today0()));
  document.getElementById('pDone').innerHTML = `${em(s.e, 112)}<h2>Session complete</h2><p>${s.min} minutes added to today</p>
    <div class="stats"><div><p class="k">Streak</p><p class="v num">${st} ${st === 1 ? 'day' : 'days'}</p></div><div><p class="k">Today</p><p class="v num">${tm} min</p></div></div>
    <button class="btn btn-accent" data-action="close-player">Done</button>`;
  setTimeout(() => pl.focus(), 50);
}
function closePlayer() {
  const pl = document.getElementById('player');
  if (!pl.classList.contains('on')) return;
  const wasComplete = pl.classList.contains('complete');
  play(false); pl.classList.remove('on'); document.body.style.overflow = '';
  if (!wasComplete) {
    const m = Math.floor(P.el / 60);
    if (m >= 1) { logSession(P.id, m); toast(`${m} min logged`); }
  }
}
function ambient(on) {
  try {
    if (on && !P.audio) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(lp).connect(g).connect(ctx.destination); src.start();
      P.audio = { ctx, g };
    }
    if (!P.audio) return;
    const { ctx, g } = P.audio;
    if (on) ctx.resume();
    g.gain.cancelScheduledValues(ctx.currentTime);
    g.gain.setTargetAtTime(on ? 0.12 : 0, ctx.currentTime, on ? 0.8 : 0.15);
  } catch {}
}
function setSoundBtn() { const b = document.getElementById('pSound'); b.setAttribute('aria-pressed', S.ambient); b.setAttribute('aria-label', S.ambient ? 'Ambient sound on' : 'Ambient sound off'); }

/* ================= misc ================= */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.querySelector('span').textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-play],[data-save],[data-cat],[data-action],[data-set],[data-toggle]');
  if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  if (t.dataset.save) {
    const id = t.dataset.save, i = S.saved.indexOf(id);
    i >= 0 ? S.saved.splice(i, 1) : S.saved.push(id); save();
    const on = i < 0; t.setAttribute('aria-pressed', on);
    toast(on ? 'Saved to your library' : 'Removed from saved');
    renderLibrary(); return;
  }
  if (t.dataset.cat && !t.dataset.tab) { libCat = t.dataset.cat; renderLibrary(); return; }
  if (t.dataset.tab) { if (t.dataset.cat) { libCat = t.dataset.cat; renderLibrary(); } go(t.dataset.tab); return; }
  if (t.dataset.open) return openSheet(t.dataset.open);
  if (t.dataset.play) return openPlayer(t.dataset.play);
  if (t.dataset.set) { const v = t.dataset.val; S[t.dataset.set] = isNaN(v) || v.includes(':') ? v : +v; save(); renderAll(); go(tab); return; }
  if (t.dataset.toggle) { S[t.dataset.toggle] = !S[t.dataset.toggle]; save(); renderAll(); go(tab); document.querySelector(`[data-toggle="${t.dataset.toggle}"]`)?.focus(); return; }
  const a = t.dataset.action;
  if (a === 'close-sheet') closeSheet();
  if (a === 'close-player') closePlayer();
  if (a === 'toggle-play') { if (P.el >= P.total) return; play(!P.playing); tick(); }
  if (a === 'skip') { P.el = Math.max(0, Math.min(P.total - 1, P.el + +t.dataset.sec)); tick(); }
  if (a === 'toggle-sound') { S.ambient = !S.ambient; save(); setSoundBtn(); ambient(P.playing && S.ambient); }
  if (a === 'clear-q') { libQ = ''; const q = document.getElementById('q'); q.value = ''; renderLibrary(); q.focus(); }
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(S.history, null, 2)], { type: 'application/json' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'stillwater-history.json'; link.click();
    toast('History exported');
  }
  if (a === 'reset' && confirm('Clear all sessions and streaks? This can’t be undone.')) { S.history = {}; save(); renderAll(); go(tab); toast('History cleared'); }
  if (a === 'restore') { S.history = seedHistory(); save(); renderAll(); go(tab); toast('Sample history loaded'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.getElementById('player').classList.contains('on')) closePlayer(); else closeSheet(); }
  if (e.key === ' ' && document.getElementById('player').classList.contains('on') && e.target.tagName !== 'BUTTON') { e.preventDefault(); play(!P.playing); tick(); }
  if (e.key === 'Tab') {
    const box = document.getElementById('player').classList.contains('on') ? document.getElementById('player') : document.getElementById('sheet').classList.contains('on') ? document.getElementById('sheet') : null;
    if (!box) return;
    const f = [...box.querySelectorAll('button')].filter(b => b.offsetParent !== null); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  }
});
document.querySelectorAll('h1').forEach(h => h.tabIndex = -1);

renderAll(); go(tab);
document.querySelectorAll('.screen h1').forEach(h => h.setAttribute('tabindex', '-1'));
</script>
</body>
</html>
