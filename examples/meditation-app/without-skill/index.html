<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stillwater — Meditate &amp; Sleep</title>
<style>
  :root {
    --bg: #0f1226;
    --surface: #181c37;
    --surface-2: #222749;
    --line: rgba(255,255,255,.08);
    --text: #eef0ff;
    --muted: #a2a7cb;
    --faint: #6c7199;
    --accent: #a8b8ff;
    --accent-strong: #8197ff;
    --warm: #ffcf9f;
    --good: #8fe3c0;
    --radius: 20px;
    --tabbar-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  h1, h2, h3, p { margin: 0; }

  /* ---------- Layout ---------- */
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; position: relative; }
  .view {
    display: none;
    padding: calc(20px + var(--safe-t)) 20px calc(var(--tabbar-h) + var(--safe-b) + 28px);
    animation: fade .35s ease;
  }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .title { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
  .section-h h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .link { color: var(--accent); font-size: 14px; font-weight: 600; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding-bottom: var(--safe-b);
    background: rgba(15,18,38,.86);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
  }
  .tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 11.5px; font-weight: 600; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"] svg { color: var(--accent); }

  /* ---------- Today ---------- */
  .week-strip {
    margin-top: 20px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 10px;
  }
  .day { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,.18);
    display: grid; place-items: center;
  }
  .dot.done { border: 0; background: linear-gradient(140deg, var(--accent), #c7a6ff); color: #1a1d3a; }
  .dot.done svg { width: 15px; height: 15px; }
  .dot.today:not(.done) { border: 1.5px solid var(--accent); }
  .dot.future { opacity: .45; }
  .day.is-today { color: var(--text); }
  .strip-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .strip-foot b { color: var(--text); }
  .flame { color: var(--warm); }

  .hero {
    margin-top: 16px; position: relative; overflow: hidden;
    border-radius: 26px; padding: 22px; min-height: 300px;
    display: flex; flex-direction: column; justify-content: flex-end;
    text-align: left; width: 100%;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  .hero .orb { position: absolute; width: 96px; height: 96px; border-radius: 50%; top: 22px; right: 22px; }
  .hero > :not(.orb) { position: relative; z-index: 1; }
  .hero .orb::after { content: ""; position: absolute; inset: -30px; border-radius: 50%; background: inherit; opacity: .25; filter: blur(28px); }
  .hero .tag { display: inline-flex; align-self: flex-start; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.16); padding: 6px 10px; border-radius: 99px; backdrop-filter: blur(6px); margin-bottom: auto; }
  .hero .h {display:block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 12px; }
  .hero .p {display:block; color: rgba(255,255,255,.82); margin-top: 4px; font-size: 15px; max-width: 34ch; }
  .hero .row { width:100%; display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .hero .meta { font-size: 14px; color: rgba(255,255,255,.85); font-weight: 600; }
  .play-btn { width: 54px; height: 54px; border-radius: 50%; background: #fff; color: #161a35; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.25); transition: transform .15s; }
  .hero:active .play-btn { transform: scale(.94); }
  .play-btn svg { width: 22px; height: 22px; margin-left: 3px; }

  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quick button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: left;
    display: flex; flex-direction: column; gap: 10px; transition: background .15s;
  }
  .quick button:active { background: var(--surface-2); }
  .quick .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .quick .ic svg { width: 20px; height: 20px; }
  .quick b { font-size: 15px; font-weight: 650; }
  .quick span { font-size: 13px; color: var(--muted); margin-top: -8px; }

  /* ---------- Session cards ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: flex; gap: 14px; align-items: center; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; padding-right: 6px;
    transition: background .15s;
  }
  .card:active { background: var(--surface-2); }
  .cover { flex: none; width: 66px; height: 66px; border-radius: 14px; position: relative; overflow: hidden; }
  .cover i { position: absolute; width: 26px; height: 26px; border-radius: 50%; right: 10px; top: 10px; }
  .card .info { flex: 1; min-width: 0; display: block; padding: 4px 0; }
  .card .t { display: block; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .card .sub .sep { width: 3px; height: 3px; background: var(--faint); border-radius: 50%; }
  .card .done-mark { color: var(--good); display: inline-flex; }
  .card .done-mark svg { width: 14px; height: 14px; }
  .fav { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--faint); border-radius: 50%; }
  .fav svg { width: 22px; height: 22px; }
  .fav[aria-pressed="true"] { color: #ff9fb8; }
  .fav[aria-pressed="true"] svg path { fill: currentColor; }

  /* ---------- Library ---------- */
  .search {
    margin-top: 18px; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; height: 48px;
  }
  .search svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
  .search input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; outline: none; min-width: 0; }
  .search input::placeholder { color: var(--faint); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -20px 18px; padding: 2px 20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 38px; padding: 0 16px; border-radius: 99px; font-size: 14px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  /* ---------- Streak ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .streak-hero { margin-top: 20px; display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .lbl b { font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  .ring .lbl span { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .streak-hero h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .streak-hero p { color: var(--muted); font-size: 14.5px; margin-top: 4px; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .week-nav b { font-size: 15px; font-weight: 650; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 18px; height: 18px; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .bar-val { font-size: 11.5px; color: var(--muted); font-weight: 600; min-height: 15px; }
  .bar { width: 100%; max-width: 30px; border-radius: 8px; background: var(--surface-2); min-height: 6px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .bar.on { background: linear-gradient(180deg, #c7a6ff, var(--accent-strong)); }
  .bar-day { font-size: 12px; color: var(--muted); font-weight: 600; }
  .bar-day.is-today { color: var(--text); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  .stat span { font-size: 12.5px; color: var(--muted); }

  .goal { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .goal p { color: var(--muted); font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 99px; padding: 4px; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; }
  .stepper button:active { background: rgba(255,255,255,.08); }
  .stepper output { min-width: 26px; text-align: center; font-weight: 700; }
  .history { display: flex; flex-direction: column; }
  .history-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .history-row:last-child { border-bottom: 0; }
  .history-row span { color: var(--muted); }
  .reset { display: block; margin: 26px auto 0; color: var(--faint); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Player ---------- */
  .player {
    position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
    padding: calc(14px + var(--safe-t)) 22px calc(26px + var(--safe-b));
    background: radial-gradient(120% 80% at 50% 10%, var(--p1, #343c7a) 0%, var(--bg) 70%);
    overflow-y: auto;
  }
  .player.open { display: flex; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  .player-top { display: flex; justify-content: space-between; align-items: center; max-width: 560px; width: 100%; margin: 0 auto; }
  .player-top .icon-btn { background: rgba(255,255,255,.1); width: 44px; height: 44px; }
  .player-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; max-width: 440px; width: 100%; margin: 0 auto; padding: 10px 0; }
  .player .cat { color: rgba(255,255,255,.7); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .player h2 { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
  .player .desc { color: rgba(255,255,255,.75); margin-top: 8px; font-size: 15px; }

  .breath-wrap { position: relative; width: min(68vw, 270px); aspect-ratio: 1; margin: 26px 0 18px; display: grid; place-items: center; }
  .breath-wrap svg.progress { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .breath {
    width: 74%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), var(--p2, #8197ff) 55%, var(--p1, #343c7a) 100%);
    box-shadow: 0 0 60px -6px var(--p2, #8197ff);
    transform: scale(.6);
    transition-property: transform; transition-timing-function: ease-in-out;
    display: grid; place-items: center;
  }
  .breath-label { position: absolute; font-size: 17px; font-weight: 650; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.35); pointer-events: none; }
  .time { font-variant-numeric: tabular-nums; font-size: 15px; color: rgba(255,255,255,.75); font-weight: 600; }
  .guide { min-height: 3.2em; margin-top: 14px; font-size: 17px; color: rgba(255,255,255,.92); max-width: 32ch; transition: opacity .6s; }

  .opt-group { width: 100%; margin-top: 18px; text-align: left; }
  .opt-group > span { font-size: 12.5px; color: rgba(255,255,255,.6); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .opt-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .opt { height: 38px; padding: 0 14px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); }
  .opt[aria-pressed="true"] { background: #fff; color: #161a35; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 22px; }
  .big-btn { width: 76px; height: 76px; border-radius: 50%; background: #fff; color: #161a35; display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.3); transition: transform .15s; }
  .big-btn:active { transform: scale(.94); }
  .big-btn svg { width: 30px; height: 30px; }
  .ctrl { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
  .ctrl svg { width: 22px; height: 22px; }
  .begin { margin-top: 26px; width: 100%; height: 56px; border-radius: 99px; background: #fff; color: #161a35; font-weight: 700; font-size: 17px; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .begin:active { transform: scale(.98); }

  .done-screen h2 { font-size: 30px; }
  .done-badge { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; margin: 10px auto 22px; background: linear-gradient(140deg, var(--accent), #c7a6ff); color: #1a1d3a; box-shadow: 0 0 60px -10px #c7a6ff; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  .done-badge svg { width: 54px; height: 54px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .done-stats { display: flex; gap: 10px; margin-top: 22px; width: 100%; }
  .done-stats div { flex: 1; background: rgba(255,255,255,.08); border-radius: 16px; padding: 14px 8px; }
  .done-stats b { display: block; font-size: 22px; }
  .done-stats span { font-size: 12.5px; color: rgba(255,255,255,.7); }
  .done-week { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .3s; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (min-width: 700px) {
    .view { padding-top: 40px; }
    .quick { grid-template-columns: repeat(4, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .breath { transform: scale(.8) !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- TODAY -->
  <main class="view active" id="view-today" aria-labelledby="today-title">
    <p class="eyebrow" id="today-date"></p>
    <h1 class="title" id="today-title">Good evening</h1>

    <section class="week-strip" id="today-week" aria-label="This week's practice"></section>

    <div class="section-h"><h2>Today's session</h2></div>
    <button class="hero" id="hero" aria-label="Start today's session"></button>

    <div class="section-h"><h2>Quick start</h2></div>
    <div class="quick" id="quick"></div>

    <div class="section-h"><h2 id="rec-title">Recommended</h2><button class="link" data-goto="library">See all</button></div>
    <div class="list" id="today-list"></div>
  </main>

  <!-- LIBRARY -->
  <main class="view" id="view-library" aria-labelledby="lib-title">
    <p class="eyebrow">Library</p>
    <h1 class="title" id="lib-title">Guided sessions</h1>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Search sessions</span>
      <input type="search" id="search" placeholder="Search sessions" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
    <div class="list" id="lib-list"></div>
  </main>

  <!-- STREAK -->
  <main class="view" id="view-streak" aria-labelledby="streak-title">
    <p class="eyebrow">Progress</p>
    <h1 class="title" id="streak-title">Mindfulness streak</h1>

    <section class="panel streak-hero" id="streak-hero"></section>

    <div class="section-h"><h2>Weekly minutes</h2></div>
    <section class="panel">
      <div class="week-nav">
        <button class="icon-btn" id="wk-prev" aria-label="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <b id="wk-label">This week</b>
        <button class="icon-btn" id="wk-next" aria-label="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="bars" id="bars" role="img"></div>
    </section>

    <div class="stats" id="stats"></div>

    <div class="section-h"><h2>Weekly goal</h2></div>
    <section class="panel goal">
      <p>Practice on <b id="goal-text">5 days</b> each week</p>
      <div class="stepper">
        <button id="goal-dec" aria-label="Decrease weekly goal">−</button>
        <output id="goal-val" aria-live="polite">5</output>
        <button id="goal-inc" aria-label="Increase weekly goal">+</button>
      </div>
    </section>

    <div class="section-h"><h2>Recent sessions</h2></div>
    <section class="panel history" id="history"></section>

    <button class="reset" id="reset">Reset all progress</button>
  </main>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today
    </button>
    <button class="tab" role="tab" data-tab="library" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      Library
    </button>
    <button class="tab" role="tab" data-tab="streak" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.8 7-7 0-3.5-2.5-6-4-8-.5 2-1.5 3-3 3 0-3-1.5-6-4-8 0 4-3 6.5-3 10.5C5 18.5 8 22 12 22Z"/></svg>
      Streak
    </button>

</nav>

<section class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="p-title">
  <div class="player-top">
    <button class="icon-btn" id="p-close" aria-label="Close player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="time" id="p-top-time"></span>

  </div>
  <div class="player-body" id="p-body"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ================= Data ================= */
  const CATS = ['All', 'Favorites', 'Sleep', 'Calm', 'Focus', 'Breath', 'Body'];
  const CAT_HUES = { Sleep: [232, 262], Calm: [190, 220], Focus: [28, 350], Breath: [160, 195], Body: [300, 330] };

  const S = (id, title, cat, min, desc, breath, steps) => ({ id, title, cat, min, desc, breath, steps });
  const SESSIONS = [
    S('morning-clarity', 'Morning Clarity', 'Focus', 10, 'Set a clear, kind intention for the day ahead.', [4, 2, 6, 0], [
      'Sit tall and let your shoulders soften.', 'Notice the light, the sounds, the air around you.',
      'Follow the breath without changing it.', 'Ask quietly: what matters most today?',
      'Let one intention settle in your chest.', 'Carry this clarity with you as you open your eyes.']),
    S('deep-work', 'Before Deep Work', 'Focus', 5, 'A short reset to gather scattered attention.', [4, 4, 4, 4], [
      'Close the tabs in your mind, one by one.', 'Rest attention on the tip of the nose.',
      'When thoughts pull you away, simply return.', 'Picture the single task in front of you.', 'Begin, gently and fully.']),
    S('single-point', 'Single-Point Focus', 'Focus', 15, 'Train steady attention on one anchor.', [4, 0, 6, 0], [
      'Choose an anchor: breath, sound, or touch.', 'Count breaths from one to ten.',
      'Lost count? Start again at one, without judgment.', 'Notice the gap between breaths.',
      'Attention is a muscle. Every return is a rep.', 'Widen your awareness to the whole room.', 'Slowly come back.']),
    S('calm-reset', 'Three-Minute Reset', 'Calm', 3, 'A pause button for busy moments.', [4, 0, 6, 0], [
      'Stop. Notice where you are.', 'Breathe in through the nose, out through the mouth.', 'Let the next moment be a little lighter.']),
    S('anxious-mind', 'Unwinding Anxiety', 'Calm', 10, 'Make room for difficult feelings, and let them pass.', [4, 2, 7, 0], [
      'Notice what you are feeling, without fixing it.', 'Name it softly: "worry is here."',
      'Where does it live in your body?', 'Breathe into that place, as if making space.',
      'Feelings are weather. You are the sky.', 'Return to the steady rhythm of breath.']),
    S('loving-kindness', 'Loving-Kindness', 'Calm', 12, 'Grow warmth for yourself and others.', [4, 0, 6, 0], [
      'Bring to mind someone who makes you smile.', 'Silently wish: may you be happy, may you be well.',
      'Now offer the same wish to yourself.', 'Extend it to someone you barely know.',
      'And to someone you find difficult.', 'Finally, to all beings, everywhere.']),
    S('box-breath', 'Box Breathing', 'Breath', 5, 'Inhale, hold, exhale, hold, four counts each.', [4, 4, 4, 4], [
      'Follow the circle as it grows and shrinks.', 'Four counts in. Four counts hold.',
      'Four counts out. Four counts rest.', 'Let the rhythm steady your nervous system.']),
    S('478', '4-7-8 Relaxing Breath', 'Breath', 3, 'A classic pattern to settle quickly.', [4, 7, 8, 0], [
      'Breathe in quietly through your nose.', 'Hold, soft and easy.', 'Exhale slowly through your mouth.']),
    S('coherent', 'Coherent Breathing', 'Breath', 10, 'Slow, even breaths at about six per minute.', [5, 0, 5, 0], [
      'Five seconds in, five seconds out.', 'Make each breath smooth like a wave.',
      'Feel your heartbeat begin to slow.', 'Nothing to do but breathe.']),
    S('body-scan', 'Full Body Scan', 'Body', 15, 'Move awareness slowly from head to toe.', [4, 0, 6, 0], [
      'Begin at the crown of your head.', 'Soften your forehead, eyes and jaw.',
      'Let your shoulders drop away from your ears.', 'Notice your chest rise and fall.',
      'Feel the weight of your belly and hips.', 'Travel down through your legs.',
      'Rest awareness in the soles of your feet.', 'Feel the whole body, breathing as one.']),
    S('desk-stretch', 'Desk Body Check-In', 'Body', 5, 'Release tension from long hours sitting.', [4, 0, 5, 0], [
      'Roll your shoulders back, slowly.', 'Tilt your head side to side.',
      'Unclench your hands and jaw.', 'Feel your feet on the floor.', 'Sit back, a little taller.']),
    S('drift-off', 'Drift Off', 'Sleep', 20, 'A slow descent into deep, restful sleep.', [4, 0, 7, 0], [
      'Lie down and let the bed hold you.', 'Each exhale, sink a little deeper.',
      'Let the day go, one moment at a time.', 'Your eyelids are heavy and warm.',
      'Nothing to remember. Nothing to plan.', 'Soften into the quiet.', 'Drift…']),
    S('night-rain', 'Night Rain', 'Sleep', 30, 'Soft rain and slow breathing for a quiet mind.', [4, 0, 8, 0], [
      'Listen to the rain on the window.', 'Each drop washes a thought away.',
      'Your breath grows slow and long.', 'Warm, safe, and still.', 'Let sleep come when it’s ready.']),
    S('back-to-sleep', 'Back to Sleep', 'Sleep', 10, 'For waking in the night. No need to try.', [4, 0, 8, 0], [
      'You don’t need to fall asleep. Just rest.', 'Count backwards from 100, slowly.',
      'If you lose count, begin again.', 'Rest is enough.']),
    S('wind-down', 'Evening Wind-Down', 'Sleep', 8, 'Close the day with gratitude.', [4, 0, 6, 0], [
      'Recall one good moment from today.', 'Thank yourself for something you did.',
      'Set down what is unfinished; it can wait.', 'Breathe out the day.']),
  ];
  SESSIONS.forEach((s, i) => { const [a, b] = CAT_HUES[s.cat]; s.hue = a + ((i * 9) % (b - a + 1)); });
  const byId = Object.fromEntries(SESSIONS.map(s => [s.id, s]));

  /* ================= Storage ================= */
  const KEY = 'stillwater.v1';
  const defaults = () => ({ log: {}, history: [], favs: [], goal: 5, sound: 'rain' });
  let state;
  try { state = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { state = defaults(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  /* ================= Dates ================= */
  const pad = n => String(n).padStart(2, '0');
  const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
  const today = () => new Date();
  const DAY_LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const MIN_SECONDS = 60; // a day counts once you've practiced at least a minute

  const secsOn = k => state.log[k] || 0;
  const practiced = k => secsOn(k) >= MIN_SECONDS;

  function currentStreak() {
    let d = today(), n = 0;
    if (!practiced(dkey(d))) d = addDays(d, -1); // today's not over yet
    while (practiced(dkey(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function longestStreak() {
    const keys = Object.keys(state.log).filter(practiced).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const d = new Date(k + 'T12:00:00');
      run = prev && dkey(addDays(prev, 1)) === k ? run + 1 : 1;
      best = Math.max(best, run); prev = d;
    }
    return best;
  }
  function weekDays(offset = 0) {
    const s = addDays(startOfWeek(today()), offset * 7);
    return Array.from({ length: 7 }, (_, i) => addDays(s, i));
  }
  const daysThisWeek = () => weekDays(0).filter(d => practiced(dkey(d))).length;
  const totalMinutes = () => Math.round(Object.values(state.log).reduce((a, b) => a + b, 0) / 60);

  /* ================= Helpers ================= */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const grad = h => `linear-gradient(150deg, hsl(${h} 55% 52%), hsl(${(h + 40) % 360} 50% 28%))`;
  const orb = h => `radial-gradient(circle at 35% 35%, hsl(${(h + 20) % 360} 100% 92%), hsl(${h} 80% 72%))`;
  const fmt = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="12" y="15.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
    wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15Z"/><path d="M5 19 13 11"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
  };

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function cardHTML(s) {
    const fav = state.favs.includes(s.id);
    const done = state.history.some(h => h.id === s.id && h.complete);
    return `<div class="card" role="listitem">
      <button class="cover" style="background:${grad(s.hue)}" data-play="${s.id}" aria-hidden="true" tabindex="-1"><i style="background:${orb(s.hue)}"></i></button>
      <button class="info" data-play="${s.id}" style="text-align:left">
        <span class="t">${esc(s.title)}</span>
        <span class="sub">${s.cat}<span class="sep"></span>${s.min} min${done ? `<span class="sep"></span><span class="done-mark" aria-label="completed before">${ICON.check}</span>` : ''}</span>
      </button>
      <button class="fav" data-fav="${s.id}" aria-pressed="${fav}" aria-label="${fav ? 'Remove from' : 'Add to'} favorites: ${esc(s.title)}">${ICON.heart}</button>
    </div>`;
  }

  /* ================= Today ================= */
  function pickToday() {
    const now = today(), h = now.getHours();
    const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
    const pool = h < 12 ? ['Focus', 'Breath'] : h < 18 ? ['Calm', 'Body', 'Breath'] : ['Sleep'];
    const list = SESSIONS.filter(s => pool.includes(s.cat));
    return list[doy % list.length];
  }

  function weekStripHTML(days, { compact = false } = {}) {
    const tk = dkey(today());
    return days.map((d, i) => {
      const k = dkey(d), done = practiced(k), isT = k === tk, fut = k > tk;
      return `<div class="day ${isT ? 'is-today' : ''}" aria-label="${d.toLocaleDateString(undefined, { weekday: 'long' })}: ${done ? 'practiced' : fut ? 'upcoming' : 'not yet'}">
        ${compact ? '' : `<span aria-hidden="true">${DAY_LETTERS[i]}</span>`}
        <span class="dot ${done ? 'done' : ''} ${isT ? 'today' : ''} ${fut ? 'future' : ''}" aria-hidden="true">${done ? ICON.check : ''}</span>
      </div>`;
    }).join('');
  }

  function renderToday() {
    const now = today(), h = now.getHours();
    $('#today-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    $('#today-title').textContent = h < 5 ? 'Still awake?' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';

    const streak = currentStreak(), wk = daysThisWeek();
    $('#today-week').innerHTML = weekStripHTML(weekDays(0)) +
      `<div class="strip-foot"><span><span class="flame">🔥</span> <b>${streak}</b> day streak</span><span><b>${wk}</b> / ${state.goal} days this week</span></div>`;

    const s = pickToday();
    const doneToday = state.history.some(x => x.id === s.id && x.date === dkey(now) && x.complete);
    const hero = $('#hero');
    hero.dataset.play = s.id;
    hero.style.background = grad(s.hue);
    hero.setAttribute('aria-label', `Start today's session: ${s.title}, ${s.min} minutes`);
    hero.innerHTML = `<span class="orb" style="background:${orb(s.hue)}"></span>
      <span class="tag">${doneToday ? ICON.check.replace('<svg', '<svg width="13" height="13"') + ' Completed' : (h >= 18 || h < 5 ? '☾ Tonight' : '☀ Today')}</span>
      <span class="h">${esc(s.title)}</span>
      <span class="p">${esc(s.desc)}</span>
      <span class="row"><span class="meta">${s.cat} · ${s.min} min</span><span class="play-btn">${ICON.play}</span></span>`;

    const quick = [
      { id: 'calm-reset', label: 'Reset', sub: '3 min calm', icon: 'leaf', hue: 200 },
      { id: 'box-breath', label: 'Breathe', sub: '5 min box', icon: 'wind', hue: 170 },
      { id: 'deep-work', label: 'Focus', sub: '5 min', icon: 'target', hue: 30 },
      { id: 'drift-off', label: 'Sleep', sub: '20 min', icon: 'moon', hue: 245 },
    ];
    $('#quick').innerHTML = quick.map(q => `<button data-play="${q.id}">
      <span class="ic" style="background:hsl(${q.hue} 60% 60% / .18);color:hsl(${q.hue} 90% 78%)">${ICON[q.icon]}</span>
      <b>${q.label}</b><span>${q.sub}</span></button>`).join('');

    const recCats = h >= 18 || h < 5 ? ['Sleep', 'Body'] : ['Calm', 'Focus', 'Body'];
    $('#rec-title').textContent = h >= 18 || h < 5 ? 'For tonight' : 'Recommended';
    const recs = SESSIONS.filter(x => x.id !== s.id && recCats.includes(x.cat)).slice(0, 3);
    $('#today-list').setAttribute('role', 'list');
    $('#today-list').innerHTML = recs.map(cardHTML).join('');
  }

  /* ================= Library ================= */
  let libCat = 'All', libQ = '';
  function renderChips() {
    $('#chips').innerHTML = CATS.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === libCat}">${c === 'Favorites' ? '♥ ' : ''}${c}</button>`).join('');
  }
  function renderLibrary() {
    const q = libQ.trim().toLowerCase();
    const list = SESSIONS.filter(s =>
      (libCat === 'All' || (libCat === 'Favorites' ? state.favs.includes(s.id) : s.cat === libCat)) &&
      (!q || (s.title + ' ' + s.desc + ' ' + s.cat).toLowerCase().includes(q)));
    const el = $('#lib-list');
    el.setAttribute('role', 'list');
    el.innerHTML = list.length ? list.map(cardHTML).join('')
      : `<p class="empty">${libCat === 'Favorites' && !q ? 'Tap the ♥ on any session to save it here.' : 'No sessions match your search.'}</p>`;
  }

  /* ================= Streak ================= */
  let weekOffset = 0;
  function renderStreak() {
    const streak = currentStreak(), wk = daysThisWeek(), goal = state.goal;
    const pct = Math.min(1, wk / goal), C = 2 * Math.PI * 48;
    const msg = wk >= goal ? ['Weekly goal reached', 'Beautiful consistency. Anything more is a bonus.']
      : practiced(dkey(today())) ? ['Today counts ✓', `${goal - wk} more day${goal - wk === 1 ? '' : 's'} to hit your weekly goal.`]
      : streak ? [`Keep your ${streak}-day streak`, 'A one-minute session today keeps it going.']
      : ['Start a new streak', 'Just one minute of practice counts for the day.'];
    $('#streak-hero').innerHTML = `
      <div class="ring" role="img" aria-label="${wk} of ${goal} days this week">
        <svg viewBox="0 0 112 112"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#a8b8ff"/><stop offset="1" stop-color="#c7a6ff"/></linearGradient></defs>
          <circle cx="56" cy="56" r="48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
          <circle cx="56" cy="56" r="48" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .8s"/></svg>
        <div class="lbl"><b>${wk}<span style="font-size:16px;color:var(--muted)">/${goal}</span></b><span>this week</span></div>
      </div>
      <div><h3>${msg[0]}</h3><p>${msg[1]}</p></div>`;

    const days = weekDays(weekOffset), tk = dkey(today());
    const mins = days.map(d => Math.round(secsOn(dkey(d)) / 60));
    const max = Math.max(10, ...mins);
    $('#wk-label').textContent = weekOffset === 0 ? 'This week' : weekOffset === -1 ? 'Last week'
      : `${days[0].toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${days[6].toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
    $('#wk-next').disabled = weekOffset >= 0;
    const bars = $('#bars');
    bars.setAttribute('aria-label', 'Minutes per day: ' + days.map((d, i) => `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${mins[i]}`).join(', '));
    bars.innerHTML = days.map((d, i) => `<div class="bar-col">
      <span class="bar-val">${mins[i] || ''}</span>
      <div class="bar ${practiced(dkey(d)) ? 'on' : ''}" style="height:${Math.max(4, (mins[i] / max) * 100)}%"></div>
      <span class="bar-day ${dkey(d) === tk ? 'is-today' : ''}">${DAY_LETTERS[i]}</span></div>`).join('');

    const wkMin = mins.reduce((a, b) => a + b, 0);
    $('#stats').innerHTML = `
      <div class="stat"><b><span class="flame">🔥</span>${streak}</b><span>Current streak</span></div>
      <div class="stat"><b>${longestStreak()}</b><span>Longest streak</span></div>
      <div class="stat"><b>${weekOffset === 0 ? wkMin : totalMinutes()}</b><span>${weekOffset === 0 ? 'Min this week' : 'Total minutes'}</span></div>`;

    $('#goal-val').textContent = goal;
    $('#goal-text').textContent = `${goal} day${goal === 1 ? '' : 's'}`;
    $('#goal-dec').disabled = goal <= 1; $('#goal-inc').disabled = goal >= 7;

    const hist = state.history.slice(-6).reverse();
    $('#history').innerHTML = hist.length ? hist.map(h => {
      const s = byId[h.id];
      const d = new Date(h.date + 'T12:00:00');
      const when = h.date === tk ? 'Today' : h.date === dkey(addDays(today(), -1)) ? 'Yesterday' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      return `<div class="history-row"><b>${esc(s ? s.title : 'Session')}</b><span>${Math.max(1, Math.round(h.secs / 60))} min · ${when}</span></div>`;
    }).join('') : '<p class="empty" style="padding:16px 0">No sessions yet. Your practice will appear here.</p>';
  }

  /* ================= Navigation ================= */
  function go(tab) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
    if (tab === 'today') renderToday();
    if (tab === 'library') renderLibrary();
    if (tab === 'streak') { weekOffset = 0; renderStreak(); }
    window.scrollTo(0, 0);
    history.replaceState(null, '', '#' + tab);
  }
  const renderAll = () => { renderToday(); renderLibrary(); renderStreak(); };

  /* ================= Audio (generated, no files) ================= */
  const Audio = (() => {
    let ctx, master, nodes = [];
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function noiseBuffer(brown) {
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c); let last = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
        }
      }
      return buf;
    }
    function stopNodes() { nodes.forEach(n => { try { n.stop ? n.stop() : 0; } catch {} try { n.disconnect(); } catch {} }); nodes = []; }
    function start(kind) {
      if (!ensure()) return;
      stopNodes();
      if (kind === 'none') return;
      const t = ctx.currentTime;
      if (kind === 'rain' || kind === 'waves') {
        const src = ctx.createBufferSource(); src.buffer = noiseBuffer(kind === 'waves'); src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = kind === 'rain' ? 'bandpass' : 'lowpass';
        f.frequency.value = kind === 'rain' ? 1400 : 500; f.Q.value = kind === 'rain' ? 0.5 : 0.7;
        const g = ctx.createGain(); g.gain.value = kind === 'rain' ? 0.18 : 0.55;
        src.connect(f).connect(g).connect(master);
        nodes.push(src, f, g);
        if (kind === 'waves') { // slow swell
          const lfo = ctx.createOscillator(), lg = ctx.createGain();
          lfo.frequency.value = 0.09; lg.gain.value = 0.35; lfo.connect(lg).connect(g.gain); lfo.start(t); nodes.push(lfo, lg);
        }
        src.start(t);
      } else if (kind === 'hum') {
        [110, 164.81, 220.5].forEach((fr, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = fr; g.gain.value = [0.12, 0.06, 0.04][i];
          o.connect(g).connect(master); o.start(t); nodes.push(o, g);
        });
      }
    }
    function fade(to, secs = 1.5) {
      if (!ctx) return;
      const t = ctx.currentTime; master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(to, t + secs);
    }
    function bell() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      [[528, .22], [792, .08], [1056, .05]].forEach(([f, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 4.6);
      });
    }
    return { start, fade, bell, stop: () => { fade(0, 0.8); setTimeout(stopNodes, 900); } };
  })();

  /* ================= Player ================= */
  const P = { s: null, dur: 0, elapsed: 0, running: false, phase: 'ready', tick: null, last: 0, breathT: null, guideIdx: -1 };
  const SOUNDS = [['none', 'Silence'], ['rain', 'Rain'], ['waves', 'Waves'], ['hum', 'Hum']];
  const player = $('#player');
  let lastFocus = null;

  function durationOptions(s) {
    return [...new Set([s.min, ...(s.cat === 'Sleep' ? [10, 20, 30, 45] : [3, 5, 10, 15])])].sort((a, b) => a - b);
  }

  function openPlayer(id) {
    const s = byId[id]; if (!s) return;
    lastFocus = document.activeElement;
    Object.assign(P, { s, dur: s.min * 60, elapsed: 0, running: false, phase: 'ready', guideIdx: -1 });
    player.style.setProperty('--p1', `hsl(${s.hue} 45% 32%)`);
    player.style.setProperty('--p2', `hsl(${s.hue} 75% 66%)`);
    const fav = state.favs.includes(s.id);
    $('#p-fav').setAttribute('aria-pressed', fav);
    $('#p-fav').setAttribute('aria-label', fav ? 'Remove from favorites' : 'Add to favorites');
    renderReady();
    player.classList.add('open');
    document.body.style.overflow = 'hidden';
    $('#p-close').focus();
  }

  function renderReady() {
    const s = P.s;
    $('#p-top-time').textContent = '';
    $('#p-body').innerHTML = `
      <p class="cat">${s.cat}</p>
      <h2 id="p-title">${esc(s.title)}</h2>
      <p class="desc">${esc(s.desc)}</p>
      <div class="breath-wrap"><div class="breath" style="transform:scale(.72)"></div></div>
      <div class="opt-group"><span>Length</span><div class="opt-row" id="opt-dur">
        ${durationOptions(s).map(m => `<button class="opt" data-dur="${m}" aria-pressed="${m * 60 === P.dur}">${m} min</button>`).join('')}</div></div>
      <div class="opt-group"><span>Background</span><div class="opt-row" id="opt-snd">
        ${SOUNDS.map(([k, l]) => `<button class="opt" data-snd="${k}" aria-pressed="${state.sound === k}">${l}</button>`).join('')}</div></div>
      <button class="begin" id="p-begin">Begin · ${P.dur / 60} min</button>`;
  }

  function renderSession() {
    const s = P.s, C = 2 * Math.PI * 49;
    $('#p-body').innerHTML = `
      <p class="cat">${s.cat}</p>
      <h2 id="p-title">${esc(s.title)}</h2>
      <div class="breath-wrap">
        <svg class="progress" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.2"/>
          <circle id="p-ring" cx="50" cy="50" r="49" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="breath" id="p-breath"></div>
        <span class="breath-label" id="p-phase" aria-live="off"></span>
      </div>
      <p class="time" id="p-time" aria-live="off"></p>
      <p class="guide" id="p-guide" aria-live="polite"></p>
      <div class="controls">
        <button class="ctrl" id="p-back" aria-label="Back 15 seconds">${ICON.back}</button>
        <button class="big-btn" id="p-toggle" aria-label="Pause">${ICON.pause}</button>
        <button class="ctrl" id="p-end" aria-label="End session">${ICON.stop}</button>
      </div>`;
    updateProgress();
  }

  function begin() {
    P.phase = 'playing';
    renderSession();
    Audio.bell();
    Audio.start(state.sound);
    resume();
  }

  function resume() {
    P.running = true; P.last = performance.now();
    Audio.fade(P.s.cat === 'Sleep' ? 0.7 : 0.9, 2);
    clearInterval(P.tick); P.tick = setInterval(step, 250);
    breathe(0);
    const b = $('#p-toggle'); if (b) { b.innerHTML = ICON.pause; b.setAttribute('aria-label', 'Pause'); }
  }
  function pause() {
    P.running = false; clearInterval(P.tick); clearTimeout(P.breathT);
    Audio.fade(0, 0.8);
    const br = $('#p-breath'); if (br) { br.style.transitionDuration = '1.2s'; br.style.transform = 'scale(.68)'; }
    $('#p-phase') && ($('#p-phase').textContent = 'Paused');
    const b = $('#p-toggle'); if (b) { b.innerHTML = ICON.play; b.setAttribute('aria-label', 'Resume'); }
  }

  function step() {
    const now = performance.now();
    P.elapsed = Math.min(P.dur, P.elapsed + (now - P.last) / 1000); P.last = now;
    // sleep sessions: gently fade the soundscape over the last minute
    if (P.s.cat === 'Sleep' && P.dur - P.elapsed < 60) Audio.fade(0.7 * (P.dur - P.elapsed) / 60, 0.3);
    updateProgress();
    if (P.elapsed >= P.dur) finish(true);
  }

  function updateProgress() {
    const ring = $('#p-ring'); if (!ring) return;
    const C = 2 * Math.PI * 49, pct = P.elapsed / P.dur;
    ring.setAttribute('stroke-dashoffset', C * (1 - pct));
    const left = Math.ceil(P.dur - P.elapsed);
    $('#p-time').textContent = `${fmt(left)} remaining`;
    $('#p-top-time').textContent = fmt(P.elapsed);
    const steps = P.s.steps, idx = Math.min(steps.length - 1, Math.floor(pct * steps.length));
    if (idx !== P.guideIdx) {
      P.guideIdx = idx; const g = $('#p-guide');
      g.style.opacity = 0; setTimeout(() => { g.textContent = steps[idx]; g.style.opacity = 1; }, P.guideIdx === 0 && pct < .01 ? 0 : 500);
    }
  }

  // Breathing guide: [inhale, hold, exhale, hold]
  function breathe(i) {
    if (!P.running) return;
    const pat = P.s.breath, labels = ['Breathe in', 'Hold', 'Breathe out', 'Rest'], scales = [1, 1, .55, .55];
    let n = i % 4, guard = 0;
    while (!pat[n] && guard++ < 4) n = (n + 1) % 4;
    const br = $('#p-breath'), lbl = $('#p-phase');
    if (!br) return;
    br.style.transitionDuration = pat[n] + 's';
    br.style.transform = `scale(${scales[n]})`;
    lbl.textContent = labels[n];
    P.breathT = setTimeout(() => breathe(n + 1), pat[n] * 1000);
  }

  function record(secs, complete) {
    if (secs < 5) return;
    const k = dkey(today());
    const wasPracticed = practiced(k);
    state.log[k] = Math.round(secsOn(k) + secs);
    state.history.push({ id: P.s.id, date: k, secs: Math.round(secs), complete });
    if (state.history.length > 200) state.history = state.history.slice(-200);
    save();
    return !wasPracticed && practiced(k);
  }

  function finish(complete) {
    clearInterval(P.tick); clearTimeout(P.breathT);
    P.running = false; P.phase = 'done';
    const secs = P.elapsed;
    const newDay = record(secs, complete);
    Audio.stop();
    if (complete) Audio.bell();
    if (!complete && secs < MIN_SECONDS) { // too short to count, close quietly
      closePlayer(); if (secs >= 5) toast('Sessions over a minute count toward your streak'); return;
    }
    const streak = currentStreak(), wk = daysThisWeek();
    $('#p-top-time').textContent = '';
    $('#p-body').innerHTML = `<div class="done-screen">
      <div class="done-badge">${ICON.check}</div>
      <h2 id="p-title">${complete ? 'Well done' : 'Nice pause'}</h2>
      <p class="desc">${newDay ? 'Today is marked as a mindful day.' : complete ? `You completed ${esc(P.s.title)}.` : 'Every minute of practice counts.'}</p>
      <div class="done-week week-strip" style="background:none;border:0;padding:0;margin-top:22px">${weekStripHTML(weekDays(0))}</div>
      <div class="done-stats">
        <div><b>${Math.max(1, Math.round(secs / 60))}</b><span>minutes</span></div>
        <div><b>🔥 ${streak}</b><span>day streak</span></div>
        <div><b>${wk}/${state.goal}</b><span>weekly goal</span></div>
      </div>
      <button class="begin" id="p-done">Done</button></div>`;
    renderAll();
    $('#p-done').focus();
  }

  function closePlayer() {
    clearInterval(P.tick); clearTimeout(P.breathT);
    if (P.phase === 'playing') { P.running = false; Audio.stop(); }
    player.classList.remove('open');
    document.body.style.overflow = '';
    P.phase = 'closed';
    renderAll();
    lastFocus && lastFocus.focus && lastFocus.focus();
  }

  function requestClose() {
    if (P.phase === 'playing' && P.elapsed >= MIN_SECONDS) { finish(false); return; }
    if (P.phase === 'playing') { const secs = P.elapsed; P.running = false; Audio.stop(); record(secs, false); if (secs >= 5) toast('Sessions over a minute count toward your streak'); }
    closePlayer();
  }

  /* ================= Events ================= */
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.goto) return go(t.dataset.goto);
    if (t.dataset.play) return openPlayer(t.dataset.play);
    if (t.dataset.fav) {
      const id = t.dataset.fav, i = state.favs.indexOf(id);
      i >= 0 ? state.favs.splice(i, 1) : state.favs.push(id); save();
      toast(i >= 0 ? 'Removed from favorites' : 'Saved to favorites');
      renderToday(); renderLibrary(); return;
    }
    if (t.dataset.cat) { libCat = t.dataset.cat; renderChips(); renderLibrary(); return; }
    if (t.dataset.dur) { P.dur = +t.dataset.dur * 60; renderReady(); return; }
    if (t.dataset.snd) {
      state.sound = t.dataset.snd; save(); renderReady();
      // short preview
      Audio.start(state.sound); Audio.fade(0.6, .4); clearTimeout(P.previewT);
      P.previewT = setTimeout(() => { if (P.phase === 'ready') Audio.stop(); }, 2200);
      return;
    }
    switch (t.id) {
      case 'p-begin': clearTimeout(P.previewT); return begin();
      case 'p-toggle': return P.running ? pause() : resume();
      case 'p-back': P.elapsed = Math.max(0, P.elapsed - 15); updateProgress(); return;
      case 'p-end': return finish(P.elapsed >= P.dur);
      case 'p-close': return requestClose();
      case 'p-done': return closePlayer();
      case 'p-fav': {
        const id = P.s.id, i = state.favs.indexOf(id);
        i >= 0 ? state.favs.splice(i, 1) : state.favs.push(id); save();
        t.setAttribute('aria-pressed', i < 0); t.setAttribute('aria-label', i < 0 ? 'Remove from favorites' : 'Add to favorites');
        return;
      }
      case 'wk-prev': weekOffset--; return renderStreak();
      case 'wk-next': weekOffset = Math.min(0, weekOffset + 1); return renderStreak();
      case 'goal-dec': state.goal = Math.max(1, state.goal - 1); save(); return renderStreak();
      case 'goal-inc': state.goal = Math.min(7, state.goal + 1); save(); return renderStreak();
      case 'reset':
        if (confirm('Reset your streak, history and favorites? This can’t be undone.')) {
          state = defaults(); save(); renderAll(); toast('Progress reset');
        }
        return;
    }
  });

  $('#search').addEventListener('input', e => { libQ = e.target.value; renderLibrary(); });
  document.addEventListener('keydown', e => {
    if (!player.classList.contains('open')) return;
    if (e.key === 'Escape') requestClose();
    if (e.key === ' ' && P.phase === 'playing' && e.target.tagName !== 'BUTTON') { e.preventDefault(); P.running ? pause() : resume(); }
  });
  // Refresh "today" if the app is left open across midnight
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !player.classList.contains('open')) renderAll(); });

  /* ================= Init ================= */
  renderChips();
  renderAll();
  const initial = location.hash.slice(1);
  if (['today', 'library', 'streak'].includes(initial)) go(initial);
})();
</script>
</body>
</html>
